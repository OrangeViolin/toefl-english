<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>托福写作专项系统</title>
<style>
  :root{--bg:#f6f3ed;--card:#fffdf8;--ink:#2f2a24;--muted:#8c8072;--line:#e5dccb;--accent:#c1662f;--core:#2f8f83;--ok:#2f8f5b;--bad:#c0453a;--blue:#4a5cc7}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang SC","Helvetica Neue",sans-serif;line-height:1.7;-webkit-font-smoothing:antialiased}
  .wrap{max-width:860px;margin:0 auto;padding:0 20px 100px}
  header{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:10px 20px}
  header .sec{font-weight:700;font-size:15px}
  header .prog{font-size:13px;color:var(--muted)}
  header .spacer{flex:1}
  #timer{font-variant-numeric:tabular-nums;font-size:15px;background:#efe7d6;border-radius:8px;padding:4px 10px;color:#6f6552}
  #timer.warn{background:#f4dcd6;color:var(--bad)}
  .exit{font-size:13px;color:var(--muted);cursor:pointer}
  .menu{padding:40px 20px 60px;max-width:860px;margin:0 auto}
  .menu h1{font-size:26px;margin:0 0 4px}
  .menu .sub{color:var(--muted);margin-bottom:18px}
  .notice{background:#fff6e8;border:1px solid #f0d9b0;border-left:5px solid var(--accent);border-radius:12px;padding:13px 15px;font-size:13.5px;margin-bottom:22px}
  .notice b{color:var(--accent)}
  .bigbtn{display:block;width:100%;text-align:left;background:var(--accent);color:#fff;border:0;border-radius:16px;padding:18px 22px;font-size:18px;font-weight:700;cursor:pointer;font-family:inherit;margin-bottom:14px}
  .bigbtn small{display:block;font-weight:400;font-size:13px;opacity:.92;margin-top:3px}
  .bigbtn.b2{background:#3f7d74}.bigbtn.b3{background:var(--blue)}.bigbtn.b4{background:#8a6d3b}
  .block{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 24px;margin-top:22px;box-shadow:0 2px 12px rgba(150,120,70,.05)}
  .tasklabel{display:inline-block;font-size:12px;color:#fff;background:var(--core);padding:2px 10px;border-radius:20px;margin-bottom:12px}
  .lv{display:inline-block;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:1px 8px;margin-left:6px}
  .instr{font-size:14px;color:var(--muted);margin-bottom:12px}
  /* 连词成句 */
  .bs-prompt{background:#eef1fb;border-radius:10px;padding:10px 13px;font-size:14.5px;margin-bottom:12px}
  .bs-slot{min-height:46px;border:2px dashed var(--accent);border-radius:10px;padding:8px;display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-bottom:12px;background:#fdf7f0}
  .bs-bank{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:6px}
  .tok{background:#eae2d0;border:1px solid #d8c8a8;border-radius:8px;padding:6px 12px;font-size:14px;cursor:pointer;font-family:inherit}
  .tok:hover{background:#e0d5bd}
  .verdict{margin-top:12px;font-size:14.5px;padding:12px 14px;border-radius:10px;display:none}
  .verdict.show{display:block}
  .verdict.ok{background:#eaf6ee;border:1px solid #bfe3cb}
  .verdict.no{background:#fbecea;border:1px solid #f0c9c2}
  .verdict .ans{font-weight:700;margin-top:4px}
  .verdict .note{font-size:13px;color:#6f6656;margin-top:6px}
  /* 写作 */
  .tmpl{border:1px solid #cfe0dc;background:#eef6f4;border-radius:12px;margin-bottom:14px;overflow:hidden}
  .tmpl summary{cursor:pointer;padding:11px 15px;font-weight:600;color:#2c6a60;font-size:14px;list-style:none}
  .tmpl summary::-webkit-details-marker{display:none}
  .tmpl summary::before{content:"📋 ";}
  .ref{border:1px solid #e5cdbb;background:#fffaf4;border-radius:12px;margin-top:14px;overflow:hidden}
  .ref>summary{cursor:pointer;padding:11px 15px;font-weight:600;color:var(--accent);font-size:14px;list-style:none}
  .ref>summary::-webkit-details-marker{display:none}
  .ref>summary::before{content:"📖 ";}
  .rin{padding:0 16px 14px}
  .rlabel{font-weight:700;color:var(--core);font-size:13px;margin:10px 0 4px}
  .model{background:#faf7ef;border:1px solid #efe6d4;border-radius:10px;padding:12px 14px;margin:8px 0;white-space:pre-wrap;line-height:1.75;font-size:14px}
  .mlabel{font-weight:700;color:#8a5a2e;font-size:12.5px;margin-bottom:6px}
  .sbb{font-weight:600;font-size:13px;color:#5f574c;margin:9px 0 2px}
  .sopt{font-size:13.5px;color:#433d34;padding:2px 0}
  .cn-tbl{width:100%;border-collapse:collapse;font-size:13px;margin:6px 0}
  .cn-tbl th,.cn-tbl td{border:1px solid #e0d7c7;padding:5px 8px;text-align:left;vertical-align:top}
  .cn-tbl th{background:#eef1fb;font-weight:600}
  .cn-n{white-space:nowrap;color:var(--muted)}
  .cn-p{color:var(--blue);font-style:italic}
  .cn-sample{margin-top:10px;background:#faf7ef;border:1px solid #efe6d4;border-radius:8px;padding:10px 12px}
  .cn-slabel{font-weight:700;color:var(--core);font-size:13px;margin-bottom:6px}
  .cn-sl{font-size:13.5px;margin:5px 0;line-height:1.55}
  .cn-sn{display:inline-block;font-size:11px;color:#fff;background:#b9ad95;border-radius:8px;padding:1px 7px;margin-right:5px}
  .tmpl .tin{padding:0 16px 14px;font-size:13.5px}
  .tmpl .frame div{padding:3px 0;border-bottom:1px dashed #d3e5e0}
  .tmpl .phr{margin-top:10px}
  .tmpl .phr span{display:inline-block;background:#fff;border:1px solid #d3e5e0;border-radius:8px;padding:3px 9px;margin:3px 4px 0 0;font-size:12.5px;color:#3a6b63}
  .tmpl .tips{margin-top:10px;color:#8a5a2e;background:#fff6e8;border-radius:8px;padding:8px 11px;font-size:12.5px}
  .passage{background:#faf7ef;border:1px solid var(--line);border-radius:10px;padding:14px 16px;font-size:15px;white-space:pre-wrap;margin-bottom:12px}
  .post{background:#f2f0fb;border-radius:10px;padding:11px 14px;font-size:14px;margin-bottom:10px}
  .post b{color:var(--blue)}
  .meta{font-size:13px;color:var(--muted);margin-bottom:6px}
  textarea{width:100%;min-height:220px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px;font-family:inherit;line-height:1.6;resize:vertical}
  textarea:focus{outline:none;border-color:var(--accent)}
  .wc{font-size:13px;color:var(--muted);margin-top:6px}
  .wc.low{color:var(--bad)}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
  .chips button{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:6px 13px;font-size:13px;cursor:pointer;color:#5f574c;font-family:inherit}
  .chips button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0}
  .btn{border:0;border-radius:10px;padding:10px 18px;font-size:14.5px;cursor:pointer;font-family:inherit}
  .btn.p{background:var(--accent);color:#fff}.btn.g{background:#efe8d8;color:#5f574c}
  .btn.t{background:var(--core);color:#fff}
  .btn:disabled{opacity:.45;cursor:default}
  .nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;gap:12px;padding:12px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const BS = {"title": "连词成句 Build a Sentence", "intro": "重排词/词组，组成合语法、且能恰当回应上句的句子。对/错判分——语序或语法错一处即算错。", "items": [{"level": "A1", "prompt": "What are you doing this weekend?", "tokens": ["the science museum", "visit", "I'm going to"], "answer": "I'm going to visit the science museum.", "note": "be going to + 动词原形，表已定的计划"}, {"level": "A2", "prompt": "Why didn't you answer my call?", "tokens": ["at that time", "was", "I", "in a meeting"], "answer": "I was in a meeting at that time.", "note": "was + 介词短语，描述过去某时的状态"}, {"level": "A2", "prompt": "Have you finished the report?", "tokens": ["by Friday", "will finish", "I", "it"], "answer": "I will finish it by Friday.", "note": "will + 动词原形；by + 时间点 = 不迟于"}, {"level": "B1", "prompt": "Which apartment did you choose?", "tokens": ["that is closer to the park", "the one", "I chose"], "answer": "I chose the one that is closer to the park.", "note": "that 引导定语从句，修饰 the one"}, {"level": "B1", "prompt": "How was the lecture?", "tokens": ["fell asleep", "so boring", "the lecture", "that I almost", "was"], "answer": "The lecture was so boring that I almost fell asleep.", "note": "so + 形容词 + that 结果状语从句"}, {"level": "B1", "prompt": "What's your plan after graduation?", "tokens": ["studying", "I'm thinking about", "abroad for a master's degree"], "answer": "I'm thinking about studying abroad for a master's degree.", "note": "think about + 动名词(-ing)"}, {"level": "B2", "prompt": "Why do you prefer online classes?", "tokens": ["at my own pace", "allow me", "they", "to study"], "answer": "They allow me to study at my own pace.", "note": "allow sb to do = 允许某人做某事"}, {"level": "B2", "prompt": "Would you have come if you had known?", "tokens": ["I would have come earlier", "if", "I had known"], "answer": "If I had known, I would have come earlier.", "note": "第三条件句：If + had done, would have done（与过去相反）"}, {"level": "B2", "prompt": "What made the project succeed?", "tokens": ["on time", "was completed", "the project", "by everyone's effort"], "answer": "The project was completed on time by everyone's effort.", "note": "被动语态 was + 过去分词；by 引出施动者"}, {"level": "C1", "prompt": "What's your view on the deadline?", "tokens": ["although it is tight", "reasonable", "is", "the deadline"], "answer": "The deadline is reasonable although it is tight.", "note": "although 引导让步状语从句"}, {"level": "C1", "prompt": "Why was the experiment repeated?", "tokens": ["that the results were reliable", "was repeated", "the experiment", "to ensure"], "answer": "The experiment was repeated to ensure that the results were reliable.", "note": "to ensure that... 目的状语 + 宾语从句"}, {"level": "C2", "prompt": "What surprised you about the study?", "tokens": ["such an obvious factor", "was that", "what surprised me", "the researchers overlooked"], "answer": "What surprised me was that the researchers overlooked such an obvious factor.", "note": "What... 主语从句 + that 表语从句"}]}, EMAIL = {"title": "写邮件 Write an Email", "intro": "限时约 7 分钟。读情景，用完整句子写一封达成沟通目的的邮件。官方 0–5 评分。", "template": {"name": "邮件万能框架（照这个顺序写，band 4 稳）", "frame": ["① 称呼：Dear [姓名/头衔], （正式）｜ Hi [姓名], （半正式）", "② 来意 1 句：I am writing to ... / I am reaching out about ...", "③ 情况+影响 1–2 句：Recently, ... As a result, ...（说清为什么写、对你有什么影响）", "④ 方案/请求 1–2 句：I would like to suggest ... / Would it be possible to ...?（对应题目每个 bullet）", "⑤ 礼貌收尾：Thank you for your time and consideration. I look forward to your reply.", "⑥ 落款：Best regards, / Sincerely, + [你的名字]"], "phrases": ["I am writing to ask about / to request / to let you know that ...", "As a result, I have been unable to ...", "I would like to suggest that ... / Would it be possible to ...?", "I would really appreciate it if you could ...", "Please let me know if there is anything else you need from me.", "Thank you for your understanding. I look forward to hearing from you."], "tips": "对齐题目的每个 bullet 各写 1 句，别漏点；语气礼貌（这科考 social conventions / 语域）；6–10 句、120 词左右足够 band 4。"}, "items": [{"time_sec": 420, "to": "ms.lopez@communitycharity.org", "subject": "Fundraising event for the children's hospital", "scenario": "A local community organization is planning a fundraising event for a local children's hospital. You want to contact Ms. Lopez to discuss the event and possible support. Write as much as you can, in complete sentences.", "bullets": ["Describe the purpose of the fundraising event.", "Explain why you think the activity will be successful.", "Suggest a time to meet and discuss the plans in more detail."], "bySentence": [{"bullet": "① 说明活动目的", "options": ["The purpose of the event is to raise money for new medical equipment at the children's hospital.", "We are organizing this event to support young patients and their families.", "All the funds we raise will go toward improving care for sick children."]}, {"bullet": "② 解释为何会成功", "options": ["I believe the event will be successful because many local businesses have already offered to help.", "A similar event last year attracted a large crowd, so we expect a strong turnout again.", "With good publicity and community support, I am confident that we will reach our goal."]}, {"bullet": "③ 建议见面时间", "options": ["Would you be available to meet next Wednesday afternoon to discuss the plans in more detail?", "I would like to arrange a short meeting at your convenience, perhaps early next week.", "Please let me know a time that works for you, and I will make myself available."]}], "models": [{"label": "范文 A · 简洁稳妥版（band 4）", "text": "Dear Ms. Lopez,\n\nI am writing to tell you about a fundraising event that our community organization is planning for the local children's hospital. The purpose of the event is to raise money for new medical equipment and to help families who cannot afford treatment.\n\nI believe the activity will be successful because many local businesses have already offered to help, and a similar event last year attracted a large crowd. With good advertising, I am confident that even more people will take part this time.\n\nI would love to discuss the plans with you in more detail. Would you be available to meet next Wednesday afternoon, around 3 p.m.? Please let me know if another time works better for you.\n\nThank you for your time and support.\n\nBest regards,\nFish"}, {"label": "范文 B · 进阶丰富版（band 5）", "text": "Dear Ms. Lopez,\n\nI hope this email finds you well. I am reaching out on behalf of our community organization, which is planning a fundraising event to support the local children's hospital. The main purpose of the event is to raise funds for new medical equipment and to help cover treatment costs for families in need.\n\nI am confident that the event will be a success for several reasons. First, a number of local shops and restaurants have already agreed to donate prizes and refreshments. Second, a similar event we held last spring drew more than two hundred visitors, so we already have an enthusiastic community behind us. With your support, I believe we can reach an even wider audience.\n\nI would very much appreciate the chance to discuss the details with you in person. Would you be available to meet sometime next week, for example on Tuesday or Thursday afternoon? Please let me know what suits you best.\n\nThank you very much for considering our request. I look forward to hearing from you.\n\nWarm regards,\nFish"}]}, {"time_sec": 420, "to": "ithelp@university.edu", "subject": "Slow Wi-Fi in the dormitory", "scenario": "For the past week, the Wi-Fi in your dormitory has been very slow, and it often disconnects during online classes. Several of your classmates have the same problem.", "bullets": ["Describe the Wi-Fi problem and how it affects you.", "Mention that others are affected too.", "Politely ask the IT office to fix it soon."]}, {"time_sec": 420, "to": "events@university.edu", "subject": "Switching my workshop session", "scenario": "You signed up for a campus resume workshop on Friday afternoon, but a required class was just rescheduled to the same time, so you can no longer attend.", "bullets": ["Explain why you can no longer attend Friday's session.", "Ask whether you can switch to another session.", "Ask to receive the materials if no other session is available."]}, {"time_sec": 420, "to": "prof.reed@university.edu", "subject": "Textbook is out of stock", "scenario": "The required textbook for your professor's course is sold out at the campus bookstore, and the next shipment will not arrive for three weeks. The first assignment is due next week.", "bullets": ["Let the professor know the textbook is unavailable.", "Explain your concern about the upcoming assignment.", "Ask if there is a scan or another way to access the first chapter."]}, {"time_sec": 420, "to": "s.martin@university.edu", "subject": "Joining your study group", "scenario": "You saw a notice about a weekly study group for a statistics course, organized by a classmate named Sam. You would like to join.", "bullets": ["Say where you saw the notice and that you want to join.", "Ask when and where the group meets.", "Offer to help by sharing your practice problems."]}, {"time_sec": 420, "to": "housing@university.edu", "subject": "Requesting a room repair", "scenario": "The heater in your dormitory room has stopped working, and the weather is getting cold. You have already reported it once by phone but no one has come.", "bullets": ["Describe the problem and that it was already reported once.", "Explain how it is affecting you.", "Ask for a specific time when someone can come to fix it."]}]}, DISC = {"title": "学术讨论 Write for an Academic Discussion", "intro": "限时约 10 分钟、≥100 词。读教授的问题和两名同学的发言，写出你自己的立场并论证。官方 0–5 评分。", "template": {"name": "学术讨论万能框架（立场→理由+例子→呼应同学→收尾）", "frame": ["① 表明立场 1 句：In my opinion, ... / I believe that ...（直接回答教授的问题）", "② 理由 + 具体例子 2–3 句：One important reason is that ... For example / For instance, ...（例子越具体越好，可用自己的经历）", "③ 呼应一名同学 1 句：I agree with [名字] that ..., but I would add ... / While [名字] makes a good point, I think ...", "④ 收尾 1 句：For these reasons, I believe ..."], "phrases": ["In my opinion, ... / From my perspective, ...", "One important reason is that ...", "For example, when I ... / A good example of this is ...", "While [Student] makes a good point, I would argue that ...", "On the other hand, ... / However, ...", "Overall, I believe that ..."], "tips": "一定要有一个具体例子（band 4 与 band 3 的分水岭常在此）；用 1–2 个连接词（however / for example / on the other hand）；至少呼应一名同学显得像真讨论；110–140 词足够 band 4。"}, "concession": {"name": "让步型 · 高分结构（建议 ≥7 句）", "note": "先让步认可对方 → 转折立己见 → 理由+解释+例子 → 收尾。比直接站队更客观成熟，常拿高分。", "rows": [{"n": "第1句", "outline": "让步认可一位同学的观点", "pattern": "Admittedly, [Name] is right when…"}, {"n": "第2句", "outline": "让步认可的理由", "pattern": "After all, some people…"}, {"n": "第3句", "outline": "转折提出自己的观点", "pattern": "Nevertheless, I think…"}, {"n": "第4句", "outline": "给予新的支持理由（万能理由）", "pattern": "In my opinion, …"}, {"n": "第5句", "outline": "解释陈述", "pattern": "In other words, …"}, {"n": "第6句", "outline": "例证细节", "pattern": "For example, …"}, {"n": "第7句", "outline": "总结观点", "pattern": "Therefore, …"}], "sample": {"topic": "实战范文 · 该优先建图书馆还是体育设施？", "lines": [{"n": "1 让步认可", "en": "Admittedly, Andrew makes a persuasive point in support of promoting student sports."}, {"n": "2 让步理由", "en": "After all, taking part in sports is indeed an excellent way to improve students' physical health."}, {"n": "3 转折观点", "en": "Nevertheless, considering the university's responsibility to promote academic excellence, I would prioritize building a new library."}, {"n": "4 新支持理由", "en": "In my opinion, a new library could strengthen teaching and academic exchange."}, {"n": "5 解释陈述", "en": "In other words, a well-equipped library serves as a platform for academic communication and collaboration, offering not only printed books but also high-speed internet and databases for cross-disciplinary projects."}, {"n": "6 例证细节", "en": "For example, as interdisciplinary collaboration keeps growing, teachers and students in the architecture department need a library that strengthens cross-department networks and enriches the shared database."}, {"n": "7 总结观点", "en": "Therefore, I believe that prioritizing a new library, by integrating resources across disciplines, would greatly improve academic exchange and enhance our research capacity."}]}}, "items": [{"time_sec": 600, "min_words": 100, "professor": "This week we are discussing university policies. Some universities require students to attend every class and take attendance, while others let students decide for themselves. Do you think class attendance should be mandatory? Why or why not?", "student1": "I think attendance should be mandatory. When attendance is required, students stay engaged and don't fall behind. Many people, including me, need that push to show up on difficult days.", "student2": "I disagree. We are adults and should manage our own time. If a lecture is recorded, forcing students to sit in class just wastes time they could spend studying more effectively on their own."}, {"time_sec": 600, "min_words": 100, "professor": "Let's talk about how to learn. Some students prefer to study one subject very deeply, while others prefer to explore many subjects broadly. Which approach do you think is more valuable for university students, and why?", "student1": "I believe going deep is better. Real expertise comes from focusing on one field long enough to master it, and that's what employers and graduate programs actually reward.", "student2": "I'd argue the opposite. The most interesting ideas often come from combining fields. A broad education makes you more adaptable in a job market that keeps changing."}, {"time_sec": 600, "min_words": 100, "professor": "Many schools are debating technology in the classroom. Some want to ban smartphones during lectures; others say students should be trusted to use them responsibly. Should smartphones be banned in classrooms? Explain your view.", "student1": "Phones should definitely be banned. They are a constant distraction, and studies show that even having a phone on the desk lowers concentration. Banning them helps everyone focus.", "student2": "A full ban goes too far. Phones can be useful for looking things up, taking photos of the board, or using learning apps. The problem is misuse, not the device itself."}, {"time_sec": 600, "min_words": 100, "professor": "Today's topic is consumer behavior. Online reviews strongly influence what people buy, watch, and where they eat. In your opinion, do online reviews do more good or more harm? Give reasons.", "student1": "Reviews do more good. They give ordinary buyers information they never had before and pressure businesses to actually improve their products and service.", "student2": "I'm more skeptical. Many reviews are fake or paid for, and a few angry comments can unfairly ruin a small business. People trust them more than they deserve."}]}, RUBRICS = {"email": "Write an Email（0–5）\n5 完全成功：有效清晰、语言驾驭稳定；论述有效支撑沟通目的；句式多样用词精准地道；社交惯例(礼貌/语域/请求措辞)得体；几乎无错。\n4 大体成功：基本有效易懂；论述较充分；句式多样得体；社交惯例大体到位；少量词法/语法错。\n3 部分成功：基本完成但语言局限使部分信息不清；论述部分支撑；句式词汇中等；结构/词形/习语/社交惯例有明显错。\n2 大体不成功：尝试但大体无效；论述有限或跑题；范围窄；错误累积。\n1 不成功：近乎不可懂；几无论述；电报式；严重频繁出错。\n0：空白/离题/非英文/照抄/乱敲。", "discussion": "Write for an Academic Discussion（0–5）\n5 完全成功：贴题清楚的讨论贡献、语言稳定；解释/举例/细节充分相关；句式多样用词地道；几乎无错。\n4 大体成功：相关易懂；解释举例较充分；句式多样得体；少量错。\n3 部分成功：大体相关可懂；例证有缺失/不清/不相关；词法句法习语有明显错。\n2 大体不成功：尝试贡献但语言局限使观点难懂；论述差或部分相关；范围有限；错误累积。\n1 不成功：贡献无效；几无连贯观点；极受限；严重频繁错。\n0：空白/离题/非英文/照抄/乱敲。"};
const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const norm = s => (s||'').toLowerCase().replace(/[.,!?;:'"’]/g,'').replace(/\s+/g,' ').trim();
const wcount = s => (s.trim().match(/\S+/g)||[]).length;
const store = { get:(k,d)=>{try{return JSON.parse(localStorage.getItem('toefl-writing:'+k))??d}catch(e){return d}}, set:(k,v)=>localStorage.setItem('toefl-writing:'+k,JSON.stringify(v)) };
let timerIv=null;
function stopTimer(){ if(timerIv){clearInterval(timerIv); timerIv=null;} }

/* ───────── 菜单 ───────── */
function menu(){
  stopTimer();
  app.innerHTML = `<div class="menu">
    <h1>✍️ 托福写作专项系统</h1>
    <div class="sub">新版 iBT 写作三题型 · 造句填空自动判分 · 邮件/讨论带模板 + 一键复制报告给 cc 打分</div>
    <div class="notice"><b>写作占总分 1/4。</b> 造句填空(10题×1分)+邮件(5分)+学术讨论(5分)=20 原始分。造句填空是稳拿分区，两篇作文靠<b>模板+切题+一个具体例子</b>就能到 band 4。</div>
    <button class="bigbtn" onclick="bsStart()">🧩 连词成句 Build a Sentence<small>${BS.items.length} 题 · 重排词块成句 · 自动对错 + 语法点</small></button>
    <button class="bigbtn b2" onclick="writeStart('email')">✉️ 写邮件 Write an Email<small>${EMAIL.items.length} 个情景 · 7 分钟 · 带万能框架 + 高频句</small></button>
    <button class="bigbtn b3" onclick="writeStart('disc')">💬 学术讨论 Write for an Academic Discussion<small>${DISC.items.length} 个话题 · 10 分钟 · ≥100 词 · 带立场论证框架</small></button>
    <a class="bigbtn b4" href="./打字练习.html" style="text-decoration:none">⌨️ 打字练习<small>极简打字框 · 拼错纠错 · WPM 测速（对标 10 分钟 100 词）</small></a>
  </div>`;
}

/* ───────── 连词成句 ───────── */
let bsi=0;
function bsStart(){ bsi = store.get('bs-pos',0); if(bsi>=BS.items.length) bsi=0; bsRender(); }
function bsRender(){
  stopTimer();
  const it = BS.items[bsi];
  const done = store.get('bs-done',{});
  const nDone = Object.values(done).filter(Boolean).length;
  app.innerHTML = `<header><span class="sec">连词成句</span><span class="prog">第 ${bsi+1}/${BS.items.length} 题 · 已做对 ${nDone}</span><span class="spacer"></span><span class="exit" onclick="menu()">✕ 退出</span></header>
  <div class="wrap"><div class="block">
    <div class="tasklabel">Build a Sentence</div><span class="lv">${it.level}</span>
    <div class="instr">${esc(BS.intro)}</div>
    <div class="bs-prompt">🗣 ${esc(it.prompt)}</div>
    <div class="bs-slot" id="slot"></div>
    <div class="bs-bank" id="bank"></div>
    <div><span class="exit" id="reset">↺ 清空重排</span></div>
    <div class="verdict" id="vd"></div>
  </div></div>
  <div class="nav">
    <button class="btn g" id="prev">◀ 上一题</button>
    <button class="btn t" id="check">✓ 对答案</button>
    <button class="btn p" id="next">${bsi===BS.items.length-1?'回菜单':'下一题 ▶'}</button>
  </div>`;
  let order = store.get('bs-order:'+bsi, []);
  const slot=$('#slot'), bank=$('#bank');
  function draw(){
    slot.innerHTML = order.map(i=>`<button class="tok" data-o="${i}">${esc(it.tokens[i])}</button>`).join('') || '<span style="color:#b3a78f;font-size:13px">点下面的词块，按顺序排到这里</span>';
    bank.innerHTML = it.tokens.map((tk,i)=> order.includes(i)?'':`<button class="tok" data-b="${i}">${esc(tk)}</button>`).join('');
    slot.querySelectorAll('[data-o]').forEach(x=>x.onclick=()=>{order=order.filter(i=>i!=+x.dataset.o);persist();draw();});
    bank.querySelectorAll('[data-b]').forEach(x=>x.onclick=()=>{order.push(+x.dataset.b);persist();draw();});
  }
  function persist(){ store.set('bs-order:'+bsi, order); }
  $('#reset').onclick=()=>{order=[];persist();draw();$('#vd').classList.remove('show');};
  $('#check').onclick=()=>{
    const got = norm(order.map(i=>it.tokens[i]).join(' '));
    const cands = [it.answer, ...(it.accept||[])].map(norm);
    const ok = cands.includes(got);
    const done = store.get('bs-done',{}); done[bsi]=ok; store.set('bs-done',done);
    const vd=$('#vd'); vd.className='verdict show '+(ok?'ok':'no');
    vd.innerHTML = (ok?'✅ 正确！':'❌ 语序/语法不对')+`<div class="ans">✔︎ ${esc(it.answer)}</div>`+(it.note?`<div class="note">📎 ${esc(it.note)}</div>`:'');
  };
  $('#prev').onclick=()=>{ if(bsi>0){bsi--;store.set('bs-pos',bsi);bsRender();} };
  $('#prev').disabled=bsi===0;
  $('#next').onclick=()=>{ if(bsi===BS.items.length-1){menu();} else {bsi++;store.set('bs-pos',bsi);bsRender();} };
  draw();
}

/* ───────── 写作（邮件 / 讨论）───────── */
function writeStart(kind){ writeRender(kind, store.get(kind+'-pick',0)); }
function tmplHtml(t){
  return `<details class="tmpl" open><summary>${esc(t.name)}</summary><div class="tin">
    <div class="frame">${t.frame.map(f=>`<div>${esc(f)}</div>`).join('')}</div>
    <div class="phr">${t.phrases.map(p=>`<span>${esc(p)}</span>`).join('')}</div>
    ${t.tips?`<div class="tips">💡 ${esc(t.tips)}</div>`:''}
  </div></details>`;
}
function concessionHtml(D){
  const c = D.concession; if(!c) return '';
  const rows = c.rows.map(r=>`<tr><td class="cn-n">${esc(r.n)}</td><td>${esc(r.outline)}</td><td class="cn-p">${esc(r.pattern)}</td></tr>`).join('');
  const sample = c.sample ? `<div class="cn-sample"><div class="cn-slabel">${esc(c.sample.topic)}</div>`+
      c.sample.lines.map(l=>`<div class="cn-sl"><span class="cn-sn">${esc(l.n)}</span>${esc(l.en)}</div>`).join('')+`</div>` : '';
  return `<details class="tmpl" open><summary>${esc(c.name)}</summary><div class="tin">
    ${c.note?`<div class="tips" style="margin-bottom:8px">💡 ${esc(c.note)}</div>`:''}
    <table class="cn-tbl"><thead><tr><th>句</th><th>提纲</th><th>句式开头</th></tr></thead><tbody>${rows}</tbody></table>
    ${sample}
  </div></details>`;
}
function refHtml(it){
  if(!it.models && !it.bySentence) return '';
  const models=(it.models||[]).map(m=>`<div class="model"><div class="mlabel">${esc(m.label)}</div>${esc(m.text)}</div>`).join('');
  const sb=(it.bySentence||[]).map(b=>`<div class="sbb">${esc(b.bullet)}</div>`+b.options.map(o=>`<div class="sopt">· ${esc(o)}</div>`).join('')).join('');
  return `<details class="ref"><summary>参考范文 &amp; 例句（先自己写，再对照）</summary><div class="rin">`+
    (models?`<div class="rlabel">范文</div>${models}`:'')+
    (sb?`<div class="rlabel">分点参考例句（每点挑一句套用）</div>${sb}`:'')+
    `</div></details>`;
}
function writeRender(kind, idx){
  stopTimer();
  const D = kind==='email'?EMAIL:DISC;
  const it = D.items[idx];
  store.set(kind+'-pick', idx);
  const secs = it.time_sec||(kind==='email'?420:600);
  const key = kind+'-draft:'+idx;
  const chips = D.items.map((_,i)=>`<button class="${i===idx?'on':''}" data-i="${i}">${kind==='email'?'情景':'话题'} ${i+1}</button>`).join('');
  const scene = kind==='email'
    ? `<div class="meta">To: ${esc(it.to)} ｜ Subject: ${esc(it.subject)} ｜ 限时 ${Math.round(secs/60)} 分钟</div>
       <div class="passage">${esc(it.scenario)}\n\n在邮件中：${it.bullets.map(b=>'\n • '+esc(b)).join('')}</div>`
    : `<div class="meta">限时 ${Math.round(secs/60)} 分钟 · 有效作答 ≥${it.min_words||100} 词</div>
       <div class="post"><b>教授：</b> ${esc(it.professor)}</div>
       <div class="post"><b>学生 A：</b> ${esc(it.student1)}</div>
       <div class="post"><b>学生 B：</b> ${esc(it.student2)}</div>`;
  app.innerHTML = `<header><span class="sec">${kind==='email'?'写邮件':'学术讨论'}</span><span class="spacer"></span>
      <span id="timer">${String(Math.floor(secs/60)).padStart(2,'0')}:00</span>
      <span class="exit" onclick="menu()" style="margin-left:12px">✕ 退出</span></header>
  <div class="wrap"><div class="block">
    <div class="tasklabel">${kind==='email'?'Write an Email':'Write for an Academic Discussion'}</div>
    <div class="instr">${esc(D.intro)}</div>
    <div class="chips" id="chips">${chips}</div>
    ${tmplHtml(D.template)}
    ${scene}
    <textarea id="ta" placeholder="在此作答…">${esc(store.get(key,''))}</textarea>
    <div class="wc" id="wc"></div>
    <div class="row">
      <button class="btn g" id="tstart">▶ 开始限时</button>
      <button class="btn t" id="copy">复制报告给 cc 打分</button>
    </div>
    ${refHtml(it)}
  </div></div>
  <div class="nav"><button class="btn g" onclick="menu()">← 回菜单</button></div>`;
  $('#chips').querySelectorAll('button').forEach(b=>b.onclick=()=>writeRender(kind,+b.dataset.i));
  const ta=$('#ta'), wc=$('#wc');
  const minW = kind==='disc'?(it.min_words||100):0;
  function cnt(){ const n=wcount(ta.value); wc.textContent=n+' 词'+(minW?` / 建议 ≥${minW}`:''); wc.classList.toggle('low', minW&&n<minW); }
  ta.oninput=()=>{ store.set(key, ta.value); cnt(); }; cnt();
  // 计时
  let left=secs; const tEl=$('#timer');
  function tdraw(){ const m=Math.floor(Math.max(0,left)/60),s=Math.max(0,left)%60; tEl.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'); tEl.classList.toggle('warn',left<=60); }
  $('#tstart').onclick=()=>{ stopTimer(); left=secs; tdraw(); $('#tstart').disabled=true; $('#tstart').textContent='计时中…';
    timerIv=setInterval(()=>{ left--; tdraw(); if(left<=0){ stopTimer(); tEl.textContent='时间到'; ta.blur(); } },1000); };
  // 复制报告
  $('#copy').onclick=()=>{
    let txt;
    if(kind==='email'){
      txt=`【托福写作·Write an Email 评分请求】请依据官方 0–5 量规给我打分并给改进建议。\n\n[情景]\n${it.scenario}\n[要求]\n${it.bullets.map(b=>'• '+b).join('\n')}\n\n[我的作答 · ${wcount(ta.value)}词]\n${ta.value||'(空)'}\n\n[评分量规]\n${RUBRICS.email}`;
    } else {
      txt=`【托福写作·Write for an Academic Discussion 评分请求】请依据官方 0–5 量规给我打分并给改进建议。\n\n[教授]\n${it.professor}\n[学生A]\n${it.student1}\n[学生B]\n${it.student2}\n\n[我的作答 · ${wcount(ta.value)}词]\n${ta.value||'(空)'}\n\n[评分量规]\n${RUBRICS.discussion}`;
    }
    navigator.clipboard.writeText(txt).then(()=>{$('#copy').textContent='✓ 已复制，贴回给 cc';setTimeout(()=>$('#copy').textContent='复制报告给 cc 打分',1600);})
      .catch(()=>prompt('复制以下内容贴给 cc：',txt));
  };
}

menu();
</script>
</body>
</html>
