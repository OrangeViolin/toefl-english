<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>博物馆·画廊 · 听力复述场景高频词 · 单词拆解卡片</title>
<style>
  :root{
    --bg:#f7f1e7; --card:#fffdf8; --ink:#2f2a24; --muted:#8c8072;
    --line:#eaddc9; --accent:#c1662f; --accent2:#e0913c; --amber:#fbe6c4;
    --core:#2f8f83; --exc:#b0603f; --ok:#4a9a5e;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,"PingFang SC","Helvetica Neue",Segoe UI,sans-serif;
    line-height:1.6;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1180px;margin:0 auto;padding:26px 20px 90px}
  a{color:var(--accent);text-decoration:none}
  .top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
  .top a{color:var(--muted)}
  /* header */
  header.hero{margin:14px 0 22px}
  .combo{display:inline-flex;align-items:baseline;gap:14px}
  .combo .big{font-family:Georgia,"Times New Roman",serif;font-size:60px;font-weight:700;
    background:var(--amber);color:var(--accent);padding:2px 20px;border-radius:18px;line-height:1.1}
  .combo .snd{font-size:30px;color:var(--core);font-weight:700}
  h1{font-size:23px;margin:14px 0 4px}
  .intro{color:#5f574c;max-width:860px;font-size:15px}
  /* rule cards */
  .rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin:18px 0}
  .rule{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:14px}
  .rule.core{border-left:5px solid var(--core)}
  .rule.exc{border-left:5px solid var(--exc)}
  .rule b{display:block;margin-bottom:4px;font-size:14px}
  .rule.core b{color:var(--core)} .rule.exc b{color:var(--exc)}
  /* rhyme chains */
  .rhymes{background:linear-gradient(135deg,#fff6e8,#fdeede);border:1px dashed var(--accent2);
    border-radius:14px;padding:14px 16px;margin-bottom:20px}
  .rhymes h3{margin:0 0 8px;font-size:15px;color:var(--accent)}
  .chain{margin:6px 0;font-size:14px}
  .chain .lab{color:var(--muted);margin-right:8px}
  .chip{display:inline-block;background:#fff;border:1px solid var(--line);border-radius:20px;
    padding:2px 11px;margin:3px 4px 3px 0;cursor:pointer;font-family:Georgia,serif;font-size:15px;transition:.15s}
  .chip:hover{background:var(--amber);border-color:var(--accent2)}
  /* toolbar */
  .toolbar{position:sticky;top:0;z-index:20;background:rgba(247,241,231,.94);backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);padding:12px 0;margin-bottom:18px;
    display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .search{flex:1;min-width:180px;padding:8px 13px;border:1px solid var(--line);border-radius:10px;
    font-size:14px;background:#fff}
  .filters{display:flex;flex-wrap:wrap;gap:6px}
  .f{padding:6px 12px;border:1px solid var(--line);background:#fff;border-radius:20px;font-size:13px;
    cursor:pointer;color:#6b6154;transition:.15s}
  .f.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  select.f{max-width:170px;color:#6b6154;cursor:pointer}
  .btn{padding:7px 14px;border:1px solid var(--accent);background:#fff;color:var(--accent);
    border-radius:20px;font-size:13px;cursor:pointer;font-weight:600}
  .btn.on{background:var(--accent);color:#fff}
  .prog{font-size:13px;color:var(--muted);white-space:nowrap}
  .bar{height:6px;background:var(--line);border-radius:6px;width:120px;overflow:hidden;display:inline-block;vertical-align:middle}
  .bar>i{display:block;height:100%;background:var(--ok);width:0}
  /* cards */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 17px;
    box-shadow:0 2px 10px rgba(150,120,70,.06);display:flex;flex-direction:column;gap:10px;position:relative}
  .card.unfamiliar{border-color:#e08a3c;background:#fff7ec;box-shadow:0 2px 14px rgba(210,120,40,.20)}
  .card .sub-tag{position:absolute;top:0;right:16px;transform:translateY(-50%);
    font-size:11px;padding:2px 9px;border-radius:10px;color:#fff}
  .sub-core{background:var(--core)} .sub-exc{background:var(--exc)}
  .whead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .word{font-family:Georgia,"Times New Roman",serif;font-size:30px;font-weight:700;letter-spacing:.5px}
  .word .hl{background:var(--amber);color:var(--accent);border-radius:6px;padding:0 3px}
  .ipa{color:var(--core);font-size:16px;font-weight:600}
  .say{margin-left:auto;border:none;background:var(--amber);color:var(--accent);border-radius:50%;
    width:34px;height:34px;font-size:16px;cursor:pointer;flex:none}
  .say:hover{background:var(--accent2);color:#fff}
  .tags{display:flex;gap:5px;flex-wrap:wrap}
  .tag{font-size:11px;padding:1px 8px;border-radius:9px;background:#f0e7d6;color:#8a6a3c}
  .tag.lv6{background:#e6f0ec;color:#2f8f83}
  .tag.tfl{background:#eae6f5;color:#6a52a8}
  .tag.gre{background:#f7e6ea;color:#b0507a}
  .tag.spk{background:#fdeccd;color:#b5661f}
  .tag.scn{background:#e4f0e6;color:#3d7a4a}
  .mean{font-size:15.5px;font-weight:600;color:#3a332b}
  .sec{font-size:13.5px;color:#4d463c;border-top:1px dashed var(--line);padding-top:8px}
  .sec .l{font-size:11.5px;color:var(--accent);font-weight:700;letter-spacing:.5px;display:block;margin-bottom:2px}
  .roots{display:flex;flex-wrap:wrap;gap:6px}
  .root{background:#f6efe1;border-radius:8px;padding:3px 9px;font-size:12.5px}
  .root b{font-family:Georgia,serif;color:var(--accent)}
  .tip{background:#fff6e8;border-left:3px solid var(--accent2);padding:5px 10px;border-radius:0 8px 8px 0;font-size:13px}
  /* 一词多义 · 核心意象 */
  .coreimg{background:#f4f0e5;border-radius:8px;padding:6px 10px;font-size:13.5px;color:#5a4a2e;margin-bottom:7px}
  .sense{border-left:3px solid var(--accent2);padding:3px 0 3px 10px;margin:6px 0}
  .sense .s-gloss{font-size:14px}
  .sense .s-gloss b{color:#3a332b}
  .sense .s-logic{color:var(--accent);font-size:12.5px}
  .sense .s-ex{margin-top:2px;font-size:13px}
  .sense .s-en{font-family:Georgia,serif;color:#2f2a24}
  .sense .s-zh{color:#6b6154}
  .ex{margin:7px 0}
  .ex .en{font-family:Georgia,serif;font-size:14px;color:#2f2a24}
  .ex .zh{color:#6b6154;font-size:13px}
  .ex .src{display:inline-block;font-size:11px;color:#a89a86;margin-top:1px}
  .ex.famous{background:#fbf4e7;border-radius:8px;padding:7px 10px}
  /* 近义词辨析 / 反义词 */
  .lexgroup{display:flex;gap:8px;margin:4px 0;align-items:flex-start}
  .lextag{flex:none;font-size:11px;font-weight:700;padding:1px 8px;border-radius:8px;margin-top:3px}
  .lextag.syn{background:#e6f0ec;color:#2f8f83}
  .lextag.ant{background:#f7e6ea;color:#b0507a}
  .lexlist{display:flex;flex-direction:column;gap:3px;font-size:13.5px;flex:1}
  .lexlist.antline{flex-direction:row;flex-wrap:wrap;gap:6px;align-items:center}
  .lex .lw{font-family:Georgia,serif;color:var(--accent);cursor:pointer;font-weight:600}
  .lex .lw:hover{text-decoration:underline}
  .lex .lip{color:var(--core);font-size:12px}
  .lex .ln{color:#5f574c}
  .antchip{background:#faf0f2;border-radius:8px;padding:2px 9px;cursor:pointer;font-family:Georgia,serif;font-size:13px;color:#b0507a}
  .antchip:hover{background:#f6e3e8}
  .antchip i{font-style:normal;color:#9a8f86;font-size:12px}
  .nuance{background:#eef6f3;border-left:3px solid var(--core);padding:6px 10px;border-radius:0 8px 8px 0;font-size:13px;margin-top:7px;color:#33463f}
  /* memorize mode hides meaning+detail until hover/click */
  body.mem .mean, body.mem .sec{filter:blur(5px);transition:.15s;cursor:pointer}
  body.mem .card:hover .mean, body.mem .card.reveal .mean,
  body.mem .card:hover .sec, body.mem .card.reveal .sec{filter:none}
  .check{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer;margin-top:2px}
  .check input{width:16px;height:16px;accent-color:#c1662f}
  .card.unfamiliar .check{color:#c1662f;font-weight:600}
  .empty{text-align:center;color:var(--muted);padding:40px;grid-column:1/-1}
  footer{margin-top:36px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
  /* 测验 */
  #quizOv{display:none;position:fixed;inset:0;background:rgba(47,42,36,.55);z-index:50;
    align-items:center;justify-content:center;padding:18px}
  .qbox{background:var(--card);border-radius:20px;max-width:560px;width:100%;padding:22px 24px 20px;
    box-shadow:0 24px 70px rgba(0,0,0,.32);max-height:92vh;overflow:auto}
  .qtop{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px;margin-bottom:8px}
  .qbar2{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:16px}
  .qbar2>i{display:block;height:100%;background:var(--accent);width:0;transition:.3s}
  .qword{font-family:Georgia,serif;font-size:40px;font-weight:700;text-align:center;margin:4px 0 2px}
  .qipa{text-align:center;color:var(--core);font-size:16px;margin-bottom:16px}
  .qopts{display:grid;gap:10px}
  .qopt{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:11px 14px;font-size:14.5px;
    cursor:pointer;text-align:left;transition:.12s;display:flex;gap:10px;align-items:flex-start;font-family:inherit;color:var(--ink)}
  .qopt:hover{border-color:var(--accent2);background:#fffaf0}
  .qopt .k{font-weight:700;color:var(--accent);flex:none}
  .qopt.right{border-color:var(--ok);background:#eafaef}
  .qopt.wrong{border-color:var(--exc);background:#fdeeea}
  .qopt.dim{opacity:.45}
  .qnext{margin-top:14px;width:100%;padding:12px;border:none;border-radius:12px;background:var(--accent);
    color:#fff;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
  .qend{text-align:center}
  .qscore{font-size:46px;font-weight:800;color:var(--accent);margin:4px 0}
  .qwrong{text-align:left;margin:14px 0;max-height:34vh;overflow:auto}
  .qwrong .r{border-top:1px dashed var(--line);padding:7px 0;font-size:14px}
  .qwrong .r b{font-family:Georgia,serif;color:var(--exc)}
  .hint{text-align:center;color:var(--muted);font-size:12px;margin-top:10px}
  /* 精读 · 文章 + 句法分析 */
  .passage{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--accent);
    border-radius:14px;padding:18px 20px;margin:0 0 22px}
  .passage h2{margin:0 0 10px;font-size:18px;color:var(--accent)}
  .passage .p-title{font-family:Georgia,serif;font-size:20px;font-weight:700;color:var(--ink);margin-bottom:10px}
  .passage p{font-size:15px;line-height:1.9;margin:10px 0}
  .passage .en{color:#3a332b;font-family:Georgia,"Times New Roman",serif}
  .passage .zh{color:var(--muted);font-size:13.5px}
  .passage .kw{cursor:pointer;color:var(--accent);font-weight:600;border-bottom:1px dotted var(--accent2)}
  .readall{background:var(--accent);color:#fff;border:none;border-radius:20px;padding:4px 14px;font-size:13px;
    cursor:pointer;margin-left:10px;vertical-align:middle;transition:.15s}
  .readall:hover{background:var(--core)}
  .sents{background:linear-gradient(135deg,#f3f8f6,#eef3f0);border:1px solid var(--line);
    border-radius:14px;padding:18px 20px;margin:0 0 22px}
  .sents h2{margin:0 0 6px;font-size:18px;color:var(--core)}
  .sents .s-sub{color:var(--muted);font-size:13px;margin-bottom:14px}
  .sent{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:12px 0}
  .sent .s-en{font-family:Georgia,"Times New Roman",serif;font-size:15.5px;line-height:1.7;cursor:pointer;color:#3a332b}
  .sent .s-en:hover{color:var(--accent)}
  .sent .s-zh{color:var(--muted);font-size:13.5px;margin:6px 0 10px}
  .sent .s-parts{display:flex;flex-wrap:wrap;gap:6px}
  .spart{display:inline-flex;align-items:center;gap:6px;border-radius:9px;padding:4px 9px;font-size:13px;line-height:1.4}
  .spart .st{font-family:Georgia,serif;font-weight:600}
  .spart .sr{font-size:11px;color:#fff;border-radius:5px;padding:0 5px;white-space:nowrap}
  .spart .sn{font-size:12px;color:var(--muted)}
  .snotes{margin-top:10px;padding-top:8px;border-top:1px dashed var(--line);font-size:13px;color:#5f574c}
  .snotes b{color:var(--accent)}
  /* 句子内括号标注 */
  .s-flow{font-family:Georgia,"Times New Roman",serif;font-size:16px;line-height:2.1;cursor:pointer;color:#3a332b;padding:2px 0}
  .s-flow:hover{color:var(--accent)}
  .brkbox{border-radius:4px;padding:1px 1px;transition:.15s}
  .brk{font-weight:700;font-size:17px;padding:0 1px}
  .say-mini{background:none;border:none;cursor:pointer;font-size:15px;padding:0 4px;vertical-align:middle}
  @media(max-width:680px){.rules{grid-template-columns:1fr}.combo .big{font-size:44px}}
</style>
</head>

<div class="wrap">
  <div class="top">
    <a href="../index.html">← 返回总目录</a>

  <div class="toolbar">

    <div class="filters" id="sgf"></div>

 "core": "把一个人的面容轮廓「描画出来」的画像。", "senses": [{"gloss": "n. 肖像，画像", "logic": "描出人的面容", "en": "This portrait of the queen hangs in the main hall.", "zh": "这幅女王肖像挂在主厅。"}, {"gloss": "n. 描写，刻画（文字/影视）", "logic": "用文字「描画」出一个形象", "en": "The novel is a vivid portrait of village life.", "zh": "这部小说生动地刻画了乡村生活。"}], "roots": [{"part": "por- (pro-)", "meaning": "向前"}, {"part": "trait (traire)", "meaning": "拉、描（同 trace）"}]}, {"word": "landscape", "levels": ["托福"], "ipa": "/ˈlændskeɪp/", "subgroup": "noun", "meaning": "n. 风景画；风景，地貌", "etymology": "荷兰语 landschap（land 土地 + -schap，相当英语 -ship），17 世纪随荷兰风景画传入英语，先指画、后指实景。", "phonetics": "重音在首 /ˈlænd/，land 和 scape 连读，中间 d 几乎不停顿，读 /ˈlænd-skeɪp/。", "examples": [{"en": "The gallery devotes an entire room to nineteenth-century landscapes.", "zh": "这间画廊用一整个房间陈列十九世纪风景画。", "source": "造句"}, {"en": "a landscape painting", "zh": "一幅风景画（高频搭配）", "source": "高频搭配"}], "synonyms": [{"w": "scenery", "ipa": "/ˈsiːnəri/", "gloss": "风景，景色", "note": "scenery 指现实中的自然景色（不可数）；landscape 既可指实景也可指风景画"}], "nuance": "landscape 作画类与 portrait（肖像）相对；作横版页面方向也与 portrait（竖版）相对。"}, {"word": "sculpture", "levels": ["托福"], "ipa": "/ˈskʌlptʃər/", "subgroup": "noun", "meaning": "n. 雕塑（品）；雕刻艺术", "etymology": "拉丁 sculpere『雕、刻』→ sculptura。同源 sculpt（雕刻）、sculptor（雕塑家）。", "phonetics": "重音在首 /ˈskʌlp/，注意 -lpt- 三个辅音连读；结尾 -ture 读 /tʃər/。", "examples": [{"en": "A bronze sculpture stands at the center of the courtyard.", "zh": "院子中央立着一尊青铜雕塑。", "source": "造句"}, {"en": "a marble / bronze sculpture", "zh": "一尊大理石／青铜雕塑（高频搭配）", "source": "高频搭配"}], "synonyms": [{"w": "statue", "ipa": "/ˈstætʃuː/", "gloss": "雕像", "note": "statue 特指人或动物的立体雕像；sculpture 涵盖一切雕塑，含抽象作品"}], "nuance": "sculpture 是雕塑的总称（含抽象）；statue 只指具象的人／动物雕像。", "core": "从石头或木头里「雕、刻」出来的立体艺术品。", "roots": [{"part": "sculpt (sculpere)", "meaning": "雕、刻"}, {"part": "-ure", "meaning": "名词后缀，表结果/行为"}]}, {"word": "statue", "levels": ["托福"], "ipa": "/ˈstætʃuː/", "subgroup": "noun", "meaning": "n. 雕像，塑像", "etymology": "拉丁 statua『立像』，来自 stare『站立』（同 s su-ve-NIR」；这是法语外来词，重音后置。", "examples": [{"en": "She bought a small souvenir to remember the trip.", "zh": "她买了个小纪念品来记住这次旅行。", "source": "造句"}, {"en": "a souvenir of the visit", "zh": "此次参观的纪念品（高频搭配）", "source": "高频搭配"}], "synonyms": [{"w": "memento", "ipa": "/məˈmentoʊ/", "gloss": "纪念物，遗念", "note": "memento 更带情感/纪念逝者意味；souvenir 多指旅游购买的纪念品"}], "nuance": "souvenir 是买来的旅行纪念品；keepsake 更强调「因情感而珍藏」的东西。"}, {"word": "replica", "levels": ["托福"], "ipa": "/ˈreplɪkə/", "subgroup": "noun", "meaning": "n. 复制品，仿制品", "etymology": "意大利 replica『重复、复本』，来自拉丁 replicare『折回、重复』（re- 再 + plicare『折』，同 fold）。", "phonetics": "重音在首 /ˈrep/，读「REP-li-ka」，三音节。", "examples": [{"en": "The original is too fragile to display, so this is a replica.", "zh": "原件太易碎无法展出，所以这是复制品。", "source": "造句"}, {"en": "an exact replica", "zh": "一件精确复制品（高频搭配）", "source": "高频搭配"}], "synonyms": [{"w": "reproduction", "ipa": "/ˌriːprəˈdʌkʃn/", "gloss": "复制品，翻印品", "note": "reproduction 多指印刷或批量复制；replica 常指高精度、按原尺寸的复制"}], "nuance": "replica 是获认可的复制品；forgery 是意图冒充原作的赝品，性质完全不同。", "core": "「折回、重复」原作而做出的忠实复制品。", "roots": [{"part": "re-", "meaning": "再、重复"}, {"part": "plica (plicare)", "meaning": "折叠（同 fold、reply）"}]}, {"word": "original", "levels": ["基础"], "ipa": "/əˈrɪdʒənl/", "subgroup": "noun", "meaning": "n. 原作，原件；adj. 原来的，独创的", "etymology": "拉丁 origo『起源、开端』（oriri『升起、开始』）+ -al。字面「最初的那一个」。", "phonetics": "重音在第二音节 /ˈrɪ/，读「e-RI-ji-nel」，首音节弱读 /ə/。", "examples": [{"en": "Only the original is displayed here; the rest are copies.", "zh": "这里只展出原作，其余都是复制品。", "source": "造句"}, {"en": "the original painting", "zh": "原作画（高频搭配）", "source": "高频搭配"}], "synonyms": [{"w": "authentic", "ipa": "/ɔːˈθentɪk/", "gloss": "真品的，真正的", "note": "authentic 是形容词，强调「货真价实非仿制」；original 作名词指「原件」本身"}], "nuance": "original（原作）与 replica／copy（复制品）相对；导览常说明展出的是不是 original。", "core": "「起源、最初」的那一件——真迹，区别于复制品。", "senses": [{"gloss": "n. 原作，真迹", "logic": "最初创作的那一件", "en": "Is this the original or a replica?", "zh": "这是真迹还是复制品？"}, {"gloss": "adj. 最初的；原创的", "logic": "位于起 onyms": [{"w": "label", "ipa": "/ˈleɪbl/", "gloss": "标签，说明牌", "note": "label 是展品旁的立体说明牌；caption 是图片正下方的一行说明字"}], "nuance": "caption 配图；subtitle（字幕）配视频画面，导览影片里出现的是 subtitle。"}, {"word": "sketch", "levels": ["六级"], "ipa": "/sketʃ/", "subgroup": "noun", "meaning": "n. 素描，速写；草图；v. 素描", "etymology": "荷兰 schets ← 意大利 schizzo『草草画就』← 希腊 skhedios『临时的』。字面「随手画的草图」。", "phonetics": "单音节 /sketʃ/，sk- 连读，结尾 -tch 读 /tʃ/。", "examples": [{"en": "The gallery displays the artist's early sketches.", "zh": "画廊展出了这位艺术家的早期素描。", "source": "造句"}, {"en": "a pencil sketch", "zh": "一幅铅笔素描（高频搭配）", "source": "高频搭配"}], "synonyms": [{"w": "drawing", "ipa": "/ˈdrɔːɪŋ/", "gloss": "素描，绘画（用线条）", "note": "drawing 是线条画通称；sketch 强调「快速、未完成的草图」"}], "nuance": "sketch 是速写草图；painting 是上色完成的画作，展览常并列展示创作过程。"}, {"word": "mural", "levels": ["托福"], "ipa": "/ˈmjʊrəl/", "subgroup": "noun", "meaning": "n. 壁画", "etymology": "拉丁 murus『墙』→ muralis『墙的』。字面「画在墙上的画」。", "phonetics": "重音在首 /ˈmjʊ/，读「MYU-rel」。", "examples": [{"en": "A huge mural covers the entire back wall of the hall.", "zh": "一幅巨型壁画铺满了大厅的整面后墙。", "source": "造句"}, {"en": "a wall mural", "zh": "一幅墙壁画（高频搭配）", "source": "高频搭配"}], "synonyms": [{"w": "fresco", "ipa": "/ˈfreskoʊ/", "gloss": "湿壁画", "note": "fresco 特指在未干灰泥上作的湿壁画技法；mural 泛指一切墙面绘画"}], "nuance": "mural 是墙面壁画的总称；fresco 是其中一种「趁湿作画」的具体技法。"}, {"word": "fresco", "levels": ["托福"], "ipa": "/ˈfreskoʊ/", "subgroup": "noun", "meaning": "n. 湿壁画（技法）", "etymology": "意大利 fresco『新鲜的、湿的』——在新抹、尚湿的灰泥上作画，颜料随灰泥干燥而固着。同源 fresh。", "phonetics": "重音在首 /ˈfres/，fr- 连读，结尾 -co 读 /koʊ/。", "examples": [{"en": "The chapel's ceiling frescoes took years to restore.", "zh": "教堂天顶的湿壁画修复了好几年。", "source": "造句"}, {"en": "Renaissance frescoes", "zh": "文艺复兴湿壁画（高频搭配）", "source": "高频搭配"}], "synonyms": [{"w": "mural", "ipa": "/ˈmjʊrəl/", "gloss": "壁画", "note": "mural 是墙画统称；fresco 是趁灰泥湿时作画的特定工艺"}], "nuance": "fresco 因作于湿灰泥而与墙体一体，难以移动；这也是它常需现场修复的原因。"}, {"word": "specimen", "levels": ["托福"], "ipa": "/ˈspesɪmən/", "subgroup": "noun", "meaning": "n. 标本，样本 : "参观，访问", "note": "visit 只是「去看」；tour 强调有路线、绕一圈地系统参观"}], "core": "核心意象「绕一圈走完」——名词是这趟行程，动词是走这一圈的动作。", "nuance": "tour 是有组织的游览（含 guided tour）；visit 只是去某处，不一定成团有路线。"}, {"word": "display", "levels": ["托福"], "ipa": "/dɪˈspleɪ/", "subgroup": "verb", "meaning": "v. 陈列，展示；显示 / n. 陈列，展览", "etymology": "拉丁 displicare『摊开、展开』（dis- 分开 + plicare『折』）。字面「把折着的东西摊开给人看」。", "phonetics": "重音在第二音节 /ˈspleɪ/，读「dis-PLAY」，首音节弱读 /dɪ/。", "examples": [{"en": "The painting is displayed in the main gallery.", "zh": "这幅画陈列在主展厅。", "source": "造句"}, {"en": "on display", "zh": "在展出中（高频搭配）", "source": "高频搭配"}], "synonyms": [{"w": "exhibit", "ipa": "/ɪɡˈzɪbɪt/", "gloss": "展出，陈列", "note": "exhibit 偏正式、多用于博物馆；display 更通用，商品、作品皆可"}], "nuance": "display 是展示动作的通称；exhibit 侧重博物馆式的正式展出。on display = 正在展出。"}, {"word": "exhibit", "levels": ["托福"], "ipa": "/ɪɡˈzɪbɪt/", "subgroup": "verb", "meaning": "v. 展出，陈列；表现，显示", "etymology": "拉丁 exhibere『拿出来展示』（ex- 出 + habere 持有）。作动词强调「把东西拿出来给人看」的动作。", "phonetics": "重音在第二音节 /ˈzɪ/，exh- 中 h 不发音，读 /ɪɡ-ˈzɪ-bɪt/。", "examples": [{"en": "The gallery is currently exhibiting works by young sculptors.", "zh": "画廊正在展出年轻雕塑家的作品。", "source": "造句"}, {"en": "exhibit a collection", "zh": "展出一批藏品（高频搭配）", "source": "高频搭配"}], "synonyms": [{"w": "showcase", "ipa": "/ˈʃoʊkeɪs/", "gloss": "展示，展现", "note": "showcase 强调「集中亮相、突出优点」；exhibit 是中性的展出"}], "nuance": "exhibit 作动词=正式展出；作名词见名词桶（展品/一场展），复述时注意词性。", "core": "动词是「拿出来展示」，名词是「一件展品/一处展区」——博物馆里最爱考的一词两义。", "senses": [{"gloss": "v. 展出，陈列", "logic": "把东西「拿出来」给人看", "en": "The gallery exhibits works by local painters.", "zh": "这家画廊展出本地画家的作品。"}, {"gloss": "v. 表现，显示（情绪/特征）", "logic": "把内在状态「拿出来」显露", "en": "The child exhibited signs of great talent.", "zh": "这孩子显露出极高的天赋。"}, {"gloss": "n. 展品；（美式）展区", "logic": "被拿出来展示的那件东西/那片区域", "en": "The dinosaur exhibit is on the second floor.", "zh": "恐龙展区在二楼。"}], "roots": [{"part": "ex-", "meaning": "出、向外"}, {"part": "hib (habere)", "meaning": "持有、拿"}]}, {"word": "donate", "levels": ["托福"], "ipa": "/ˈdoʊneɪt/", "subgroup": ": "verb", "meaning": "v.（用画/文字）描绘，刻画", "etymology": "拉丁 depingere『画出』（de- 完全 + pingere『绘』，同 paint、picture）。字面「把它画出来」。", "phonetics": "重音在第二音节 /ˈpɪkt/，读「di-PIKT」，结尾 -ct 别吞音。", "examples": [{"en": "The mural depicts a battle from ancient times.", "zh": "这幅壁画描绘了一场古代战役。", "source": "造句"}, {"en": "depict a scene", "zh": "描绘一个场景（高频搭配）", "source": "高频搭配"}], "synonyms": [{"w": "portray", "ipa": "/pɔːrˈtreɪ/", "gloss": "描绘，刻画", "note": "portray 与 portrait 同根，偏「刻画人物形象」；depict 泛指画/写出任何场景"}], "nuance": "depict 是「作品描绘了什么」的高频动词；导览讲画面内容常说 the painting depicts…。", "core": "「完全地画出来」——用画笔或文字把一个场景刻画呈现。", "roots": [{"part": "de-", "meaning": "完全、彻底"}, {"part": "pict (pingere)", "meaning": "绘、画（同 paint、picture）"}]}, {"word": "date back", "levels": ["六级"], "ipa": "/deɪt bæk/", "subgroup": "verb", "meaning": "v. 追溯到（某年代）", "etymology": "date（拉丁 data『给出的日期』）+ back（向后）。字面「日期往回推到」。", "phonetics": "date 结尾 t 与 back 连读几乎并音；back 元音 /æ/ 张口。", "examples": [{"en": "These carvings date back to the Bronze Age.", "zh": "这些雕刻可追溯到青铜时代。", "source": "造句"}, {"en": "date back to", "zh": "追溯到（后接年代，高频搭配）", "source": "高频搭配"}], "synonyms": [{"w": "originate", "ipa": "/əˈrɪdʒɪneɪt/", "gloss": "起源于", "note": "originate from 强调「起源出处」；date back to 强调「年代久远、可回溯到某时」"}], "nuance": "date back to 后接时间/年代（date back to 1500）；导览讲文物年代时的固定说法。"}, {"word": "reserve", "levels": ["托福"], "ipa": "/rɪˈzɜːrv/", "subgroup": "verb", "meaning": "v. 预订，预约；保留", "etymology": "拉丁 reservare『留存』（re- 回 + servare『保存』）。字面「预先留住一份」。", "phonetics": "重音在第二音节 /ˈzɜːrv/，读「ri-ZERV」，中间是 /z/。", "examples": [{"en": "You should reserve a spot for the guided tour in advance.", "zh": "你应该提前预约导览团的名额。", "source": "造句"}, {"en": "reserve a ticket / a spot", "zh": "预订门票／名额（高频搭配）", "source": "高频搭配"}], "synonyms": [{"w": "book", "ipa": "/bʊk/", "gloss": "预订", "note": "book 更口语（book a tour）；reserve 略正式，也含「保留席位」之意"}], "nuance": "reserve/book 是提前占位；purchase 是当场付钱买。热门特展常需先 reserve。", "core": "「预先留住」一个名额——把票或导览团位子提前守下来。", "roots": [{"part": "re-", "meaning": "预先、回"}, { p": "noun", "meaning": "n. 购得物，新入藏品；获得，收购", "core": "博物馆新「弄到手」的一件藏品，或「征集入藏」这件事。", "etymology": "拉丁 acquirere『获得』（ad- 向 + quaerere 寻求）+ -ition。同源动词 acquire。博物馆铭牌上的 “Recent Acquisitions” 即「新近入藏」。", "roots": [{"part": "ac- (ad-)", "meaning": "向、朝"}, {"part": "quis (quaerere)", "meaning": "寻求、获得"}, {"part": "-ition", "meaning": "名词后缀"}], "phonetics": "重音在第三音节 /ˈzɪ/，读作「ak-wi-ZI-shn」。cq 读 /kw/。", "examples": [{"en": "This bronze is the museum's latest acquisition.", "zh": "这件青铜器是本馆最新的入藏品。", "source": "造句"}, {"en": "recent acquisitions / a new acquisition", "zh": "新近入藏品／一件新藏品（高频搭配）", "source": "高频搭配"}], "synonyms": [{"w": "purchase", "ipa": "/ˈpɜːrtʃəs/", "gloss": "购入物，购买", "note": "purchase 一定是花钱买的；acquisition 可以是购买、受赠或委托征集，范围更广，也更正式"}], "nuance": "acquisition 是馆方视角的「新入藏」（不问来源）；purchase 特指花钱买来的那一类。"}, {"word": "installation", "levels": ["托福", "六级"], "ipa": "/ˌɪnstəˈleɪʃn/", "subgroup": "noun", "meaning": "n. 装置艺术；（设备的）安装，装置", "core": "把材料在展厅里「安置成」一整件沉浸式作品——当代艺术的常见形式。", "etymology": "拉丁 installare『安置就位』（in- 入 + stallum 位子、席位）+ -ation。原指「安装设备」，当代艺术借来指「就地布置的整体作品」。", "roots": [{"part": "in-", "meaning": "入、进"}, {"part": "stall (stallum)", "meaning": "位子、就位"}, {"part": "-ation", "meaning": "名词后缀"}], "phonetics": "重音在第三音节 /ˈleɪ/，读作「in-stə-LAY-shn」。", "examples": [{"en": "The light installation fills the entire dark room.", "zh": "这件灯光装置作品占满了整间暗室。", "source": "造句"}, {"en": "a video / sound installation", "zh": "影像／声音装置（高频搭配）", "source": "高频搭配"}], "synonyms": [{"w": "sculpture", "ipa": "/ˈskʌlptʃər/", "gloss": "雕塑", "note": "sculpture 是单件立体造型；installation 常由多种材料就地布置、往往可走入其中、强调整体环境体验"}], "nuance": "sculpture 是「一件立体作品」；installation 是「一整个被布置出来的空间/场景」，观众常置身其中。"}, {"word": "retrospective", "levels": ["托福"], "ipa": "/ˌretrəˈspektɪv/", "subgroup": "noun", "meaning": "n. 回顾展 / adj. 回顾的，追溯的", "core": "「回头看」一位艺术家一生创作的回顾展。", "etymology": "拉丁 retro-『向后』+ spec/spect『看』（specere）+ -ive。字面「往回看的」，用于展览即「梳理某人全部生涯之作」。", "roots": [{"part": "retro-", "meaning": "向后、往回"}, {"part": "spect (specere)", "meaning": "看（同 inspect、spectacle）"}, {"part": "-ive", "meaning": "形容词/名词后缀"}], "phonetics": "重音在第三音节 /ˈspek/，读作「re-trə-SPEK-tiv」。", "examples": [{"en": "The gallery is holding a retrospective of her forty-year career.", "zh": "画廊正在举办她四十年生涯的回顾展。", "source": "造句"}, {"en": "a major retrospective", "zh": "一场大型回顾展（高频搭配）", "source": "高频搭配"}], "synonyms": [{"w": "exhibition", "ipa": "/ˌeksɪˈbɪʃn/", "gloss": "展览", "note": "exhibition 是泛指的展览；retrospective 特指「回顾单个艺术家整个生涯」的那种展，按时间线铺陈"}], "nuance": "普通 exhibition 可围绕任何主题；retrospective 一定是回望某人（或某流派）的整段历程。"}, {"word": "mosaic", "levels": ["托福"], "ipa": "/moʊˈzeɪɪk/", "subgroup": "noun", "meaning": "n. 马赛克镶嵌画，镶嵌工艺", "core": "用无数小块彩石或玻璃「拼镶」成的图案画。", "etymology": "中世纪拉丁 musaicum『缪斯的作品』，与 museum 同出希腊 mousa（缪斯）——古人视这种精细镶嵌为献给缪斯的技艺。", "phonetics": "重音在第二音节 /ˈzeɪ/，读作「moh-ZAY-ik」。ai 读 /eɪ.ɪ/ 分两个音。", "examples": [{"en": "The Roman floor mosaic depicts a hunting scene.", "zh": "这幅罗马地面镶嵌画描绘了狩猎场景。", "source": "造句"}, {"en": "a Byzantine mosaic", "zh": "一幅拜占庭镶嵌画（高频搭配）", "source": "高频搭配"}], "synonyms": [{"w": "fresco", "ipa": "/ˈfreskoʊ/", "gloss": "湿壁画", "note": "fresco 是在湿灰泥上用颜料画；mosaic 是用小块硬材料拼镶，两者都是墙面/地面装饰但工艺完全不同"}], "nuance": "mosaic 是「拼镶」出来的（小石块/玻璃）；fresco 是「画」出来的（颜料涂在湿灰泥）。"}, {"word": "engraving", "levels": ["托福"], "ipa": "/ɪnˈɡreɪvɪŋ/", "subgroup": "noun", "meaning": "n. 版画，雕版；雕刻（工艺）", "core": "在金属板上「刻出」线条、再蘸墨印出的版画。", "etymology": "en-『使』+ grave『刻』（与「坟墓」grave 同根，本义「挖、刻」）+ -ing。指刻版这门工艺及其印出的成品。", "roots": [{"part": "en-", "meaning": "使、令"}, {"part": "grave", "meaning": "刻、雕"}, {"part": "-ing", "meaning": "名词后缀，表行为/成品"}], "phonetics": "重音在第二音节 /ˈɡreɪ/，读作「in-GRAY-ving」。", "examples": [{"en": "A collection of 18th-century engravings lines the corridor.", "zh": "走廊两侧陈列着一批 18 世纪版画。", "source": "造句"}, {"en": "a copper / steel engraving", "zh": "铜版／钢版画（高频搭配）", "source": "高频搭配"}], "synonyms": [{"w": "print", "ipa": "/prɪnt/", "gloss": "版画，印刷品", "note": "print 泛指一切印制出的画；engraving 特指用刻版（凹版）方式制作的那一类，线条锐利"}], "nuance": "print 是上位词（各种版画/印刷）；engraving 特指「刻版印制」这一具体技法。"}, {"word": "watercolor", "levels": ["六级"], "ipa": "/ˈwɔːtərˌkʌlər/", "subgroup": "noun", "meaning": "n. 水彩画；水彩颜料", "core": "用水调和颜料、色调透明轻盈的水彩画。", "etymology": "water（水）+ color（颜色）复合而成。颜料以水稀释，故与油画 oil painting 相对。", "roots": [{"part": "water", "meaning": "水（作媒介）"}, {"part": "color", "meaning": "颜色、颜料"}], "phonetics": "重音在首音节 /ˈwɔː/，读作「WAW-ter-kuh-ler」，三节连读。", "examples": [{"en": "Her delicate watercolors capture the morning light.", "zh": "她清透的水彩画捕捉住了晨光。", "source": "造句"}, {"en": "a watercolor landscape", "zh": "一幅水彩风景画（高频搭配）", "source": "高频搭配"}], "synonyms": [{"w": "oil painting", "ipa": "/ˈɔɪl ˌpeɪntɪŋ/", "gloss": "油画", "note": "oil painting 颜料厚重、色彩浓郁、可反复覆盖；watercolor 透明轻薄、难以修改，两种媒介质感相反"}], "nuance": "watercolor 透明轻盈、以水为媒；oil painting 浓稠厚重、以油为媒，是最常拿来对照的两种画种。"}, {"word": "pigment", "levels": ["托福"], "ipa": "/ˈpɪɡmənt/", "subgroup": "noun", "meaning": "n. 颜料，色素", "core": "给画面上色的「彩色粉末」——磨碎调和后就是颜料。", "etymology": "拉丁 pigmentum『颜料』，源自 pingere『绘画』（同 paint、picture、depict）。指未调和的着色物质本身。", "roots": [{"part": "pig (pingere)", "meaning": "绘、画"}, {"part": "-ment", "meaning": "名词后缀，表物/结果"}], "phonetics": "重音在首音节 /ˈpɪɡ/，读作「PIG-ment」。", "examples": [{"en": "Analysis of the pigment helped date the painting.", "zh": "对颜料的分析帮助确定了这幅画的年代。", "source": "造句"}, {"en": "natural / mineral pigment", "zh": "天然／矿物颜料（高频搭配）", "source": "高频搭配"}], "synonyms": [{"w": "paint", "ipa": "/peɪnt/", "gloss": "油漆，涂料，颜料", "note": "pigment 是纯的着色粉末（原料）；paint 是把 pigment 与油/水等调匀后可直接刷的成品"}], "nuance": "pigment 是「色的原料」（干粉/色素）；paint 是「已调好、能直接用」的颜料。"}, {"word": "relic", "levels": ["托福"], "ipa": "/ˈrelɪk/", "subgroup": "noun", "meaning": "n. 遗物，遗迹；圣物", "core": "从旧时代「留下来」的遗物残迹，往往带历史或宗教分量。", "etymology": "拉丁 reliquiae『残留之物』，源自 relinquere『留下、遗弃』（re- 后 + linquere 离开，同 relinquish）。原多指圣徒遗骸圣物，后泛指历史遗存。", "roots": [{"part": "re-", "meaning": "后、遗留"}, {"part": "lic (linquere)", "meaning": "离开、留下"}], "phonetics": "重音在首音节 /ˈre/，读作「REL-ik」。", "examples": [{"en": "These relics survived from the Bronze Age.", "zh": "这些遗物从青铜时代留存至今。", "source": "造句"}, {"en": "ancient / cultural relics", "zh": "古代／文化遗物（高频搭配）", "source": "高频搭配"}], "synonyms": [{"w": "artifact", "ipa": "/ˈɑːrtɪfækt/", "gloss": "人工制品，文物", "note": "artifact 强调「人手做的」东西（哪怕不古）；relic 强调「从旧时代残留下来」的年代感与稀缺"}], "nuance": "artifact 看的是「人造」这一属性；relic 看的是「历经岁月留存」这一时间维度。"}, {"word": "excavation", "levels": ["托福"], "ipa": "/ˌekskəˈveɪʃn/", "subgroup": "noun", "meaning": "n. 发掘，挖掘；出土文物；发掘现场", "core": "把土「挖空掏出」——考古发掘的动作、现场与出土物。", "etymology": "拉丁 excavare『挖空』（ex- 出 + cavare 使空，源自 cavus 空的，同 cave 洞穴）+ -ation。", "roots": [{"part": "ex-", "meaning": "出、向外"}, {"part": "cav (cavus)", "meaning": "空的、洞（同 cave）"}, {"part": "-ation", "meaning": "名词后缀"}], "phonetics": "重音在第三音节 /ˈveɪ/，读作「eks-kə-VAY-shn」。", "examples": [{"en": "The exhibit shows finds from a recent excavation in Egypt.", "zh": "这个展区展示了近期埃及一处发掘的出土文物。", "source": "造句"}, {"en": "an archaeological excavation", "zh": "一次考古发掘（高频搭配）", "source": "高频搭配"}], "synonyms": [{"w": "dig", "ipa": "/dɪɡ/", "gloss": "（考古）发掘现场", "note": "dig 是考古行内的口语说法，指发掘现场/发掘活动；excavation 是正式术语，也可指抽象的「挖掘工程」"}], "nuance": "excavation 正式、书面，兼指行为与现场；a dig 口语、亲切，多指「一次发掘现场」。"}, {"word": "archaeology", "levels": ["六级"], "ipa": "/ˌɑːrkiˈɑːlədʒi/", "subgroup": "noun", "meaning": "n. 考古学", "core": "通过遗物与遗址「研究古代」的学问——博物馆藏品的来源之一。", "etymology": "希腊 archaios『古老的』（arche 起始）+ -logia『学问』。字面「关于古老之物的学问」。同源 archaic、archive。", "roots": [{"part": "archaeo (archaios)", "meaning": "古老、上古"}, {"part": "-logy (logia)", "meaning": "…学、学问"}], "phonetics": "重音在第三音节 /ˈɑː/，读作「ar-ki-OL-ə-ji」。ch 读 /k/。", "examples": [{"en": "The gallery explains how archaeology reconstructs daily life.", "zh": "这个展厅讲解考古学如何重建古人的日常生活。", "source": "造句"}, {"en": "underwater / experimental archaeology", "zh": "水下／实验考古学（高频搭配）", "source": "高频搭配"}], "synonyms": [{"w": "history", "ipa": "/ˈhɪstri/", "gloss": "历史（学）", "note": "history 主要靠文字记载研究过去；archaeology 靠实物遗存（器物、遗址）研究过去，方法不同"}], "nuance": "history 读「写下来的过去」；archaeology 挖「埋起来的过去」，两者互补印证。"}, {"word": "civilization", "levels": ["六级", "托福"], "ipa": "/ˌsɪvələˈzeɪʃn/", "subgroup": "noun", "meaning": "n. 文明；文明社会", "core": "有城市、文字与制度的「开化社会」——文明史类博物馆的核心叙事线。", "etymology": "拉丁 civilis『市民的、城邦的』（civis 公民，同 city、citizen）+ -ization。字面「变得有城邦秩序的状态」。", "roots": [{"part": "civil (civis)", "meaning": "公民、城邦"}, {"part": "-ization", "meaning": "名词后缀，表状态/过程"}], "phonetics": "重音在第四音节 /ˈzeɪ/，读作「si-və-lə-ZAY-shn」，五节连读。", "examples": [{"en": "The hall traces the rise of ancient Mesopotamian civilization.", "zh": "这个展厅追溯古代美索不达米亚文明的兴起。", "source": "造句"}, {"en": "ancient / Western civilization", "zh": "古代／西方文明（高频搭配）", "source": "高频搭配"}], "synonyms": [{"w": "culture", "ipa": "/ˈkʌltʃər/", "gloss": "文化", "note": "culture 指一群人的生活方式、信仰与艺术（可大可小）；civilization 指发展到城市、文字、国家阶段的整个大社会体系"}], "nuance": "culture 是任何群体都有的「生活方式」；civilization 特指高度组织化、有城市与文字的大型社会。"}, {"word": "dynasty", "levels": ["六级"], "ipa": "/ˈdaɪnəsti/", "subgroup": "noun", "meaning": "n. 朝代，王朝", "core": "同一家族接连统治的一段「朝代」——文物断代常用它当标签。", "etymology": "希腊 dynasteia『统治权』，源自 dynasthai『有力量、能』（同 dynamic）。指一个家族世代掌权的时期。", "roots": [{"part": "dynast (dynasthai)", "meaning": "掌权、有力"}, {"part": "-y", "meaning": "名词后缀"}], "phonetics": "美音重音在首音节 /ˈdaɪ/，读作「DYE-nə-sti」，dy 读 /daɪ/（英音常读 /ˈdɪn-/）。", "examples": [{"en": "This vase dates from the Ming dynasty.", "zh": "这只花瓶出自明朝。", "source": "造句"}, {"en": "the Tang / Qing dynasty", "zh": "唐／清朝（高频搭配）", "source": "高频搭配"}], "synonyms": [{"w": "era", "ipa": "/ˈɪrə/", "gloss": "时代，纪元", "note": "era 是任意划分的「时代」（不必与王室有关）；dynasty 特指「某家族连续统治」的那段朝代"}], "nuance": "era 泛指一个时代；dynasty 特指「一个统治家族」跨越的时期，博物馆用它给东亚文物断代。"}, {"word": "era", "levels": ["托福", "六级"], "ipa": "/ˈɪrə/", "subgroup": "noun", "meaning": "n. 时代，年代，纪元", "core": "以某特征划出的一整段「时代」——展线常按 era 分区。", "etymology": "晚期拉丁 aera『纪年起算点』，原为计数用的铜片。后引申为「一段有共同特征的历史时期」。", "phonetics": "重音在首音节 /ˈɪ/，读作「IR-ə」，两个音节，别读成三个。", "examples": [{"en": "The upper floor covers the industrial era.", "zh": "楼上展区涵盖工业时代。", "source": "造句"}, {"en": "a new / modern era", "zh": "新／现代纪元（高频搭配）", "source": "高频搭配"}], "synonyms": [{"w": "period", "ipa": "/ˈpɪriəd/", "gloss": "时期，阶段", "note": "period 是中性的「一段时间」，长短不限；era 更宏大、更有「以某标志划时代」的分量"}], "nuance": "period 只是「一段时期」；era 强调这段时期有鲜明特征、足以「自成一个时代」。"}, {"word": "monument", "levels": ["托福"], "ipa": "/ˈmɑːnjumənt/", "subgroup": "noun", "meaning": "n. 纪念碑，纪念建筑；遗迹", "core": "为「提醒后人记住」而立的纪念碑或宏伟遗迹。", "etymology": "拉丁 monumentum『提醒物、纪念物』，源自 monere『提醒、警告』（同 monitor、admonish）+ -ment。", "roots": [{"part": "mon (monere)", "meaning": "提醒、警示"}, {"part": "-ment", "meaning": "名词后缀，表物"}], "phonetics": "重音在首音节 /ˈmɑː/，读作「MON-yu-ment」。", "examples": [{"en": "The stone monument commemorates the city's founders.", "zh": "这座石碑纪念这座城市的奠基者。", "source": "造句"}, {"en": "a national monument / an ancient monument", "zh": "国家纪念建筑／古代遗迹（高频搭配）", "source": "高频搭配"}], "synonyms": [{"w": "statue", "ipa": "/ˈstætʃuː/", "gloss": "雕像", "note": "statue 是人或动物的立体塑像；monument 是为纪念而建的碑/建筑，可以包含雕像但目的是「纪念」"}], "nuance": "statue 关注「是不是人像雕塑」；monument 关注「是不是为纪念而立」，两者可重叠但侧重不同。"}, {"word": "architecture", "levels": ["六级", "托福"], "ipa": "/ˈɑːrkɪtektʃər/", "subgroup": "noun", "meaning": "n. 建筑（艺术/风格）；架构", "core": "建筑的「设计艺术与风格」——博物馆本身常就是一件建筑作品。", "etymology": "希腊 arkhitekton『首席工匠』（arkhi- 主、首 + tekton 工匠，同 technique）+ -ure。字面「主匠之艺」。", "roots": [{"part": "archi- (arkhi)", "meaning": "主、首席"}, {"part": "tect (tekton)", "meaning": "工匠、建造（同 technique）"}, {"part": "-ure", "meaning": "名词后缀"}], "phonetics": "重音在首音节 /ˈɑːr/，读作「AR-ki-tek-cher」。ch 读 /k/。", "examples": [{"en": "The museum's glass architecture is an attraction in itself.", "zh": "博物馆的玻璃建筑本身就是一大看点。", "source": "造句"}, {"en": "modern / Gothic architecture", "zh": "现代／哥特式建筑（高频搭配）", "source": "高频搭配"}], "synonyms": [{"w": "building", "ipa": "/ˈbɪldɪŋ/", "gloss": "建筑物", "note": "building 是具体的一栋楼（可数实体）；architecture 是「建筑设计艺术/风格」这门学问或整体气质（多不可数）"}], "nuance": "building 指「那一栋楼」；architecture 指「建筑的设计与风格」这一抽象维度。"}, {"word": "facade", "levels": ["托福"], "ipa": "/fəˈsɑːd/", "subgroup": "noun", "meaning": "n.（建筑的）正立面，门面；假象", "core": "建筑朝街的那张「脸」——正立面，也比喻装出来的表面。", "etymology": "法语 façade，源自意大利 facciata『正面』（faccia 脸，源自拉丁 facies 面容，同 face）。字面「建筑的脸面」。", "roots": [{"part": "fac (facies)", "meaning": "脸、面（同 face）"}, {"part": "-ade", "meaning": "名词后缀"}], "phonetics": "重音在第二音节 /ˈsɑːd/，读作「fə-SAHD」，c 因原带软音符读 /s/，不读 /k/。", "examples": [{"en": "Restorers spent two years cleaning the marble façade.", "zh": "修复人员花了两年清理这座大理石正立面。", "source": "造句"}, {"en": "the building's façade", "zh": "建筑的正立面（高频搭配）", "source": "高频搭配"}], "synonyms": [{"w": "front", "ipa": "/frʌnt/", "gloss": "正面，前部", "note": "front 泛指任何东西的前面；façade 特指建筑「经设计的正立面」，是专业建筑用语，也带比喻义（假象）"}], "nuance": "front 是普通的「前面」；façade 特指建筑那面「精心设计、朝外示人」的立面，故引申出「装门面」义。", "senses": [{"gloss": "n. 正立面，门面", "logic": "建筑朝外的脸", "en": "The neoclassical façade dominates the square.", "zh": "这座新古典主义正立面统领着整个广场。"}, {"gloss": "n. 假象，伪装", "logic": "装出来的「表面」", "en": "His calm was just a façade.", "zh": "他的镇定只是伪装。"}]}, {"word": "archive", "levels": ["托福"], "ipa": "/ˈɑːrkaɪv/", "subgroup": "noun", "meaning": "n. 档案（馆），案卷 / v. 存档，归档", "core": "系统保存历史文献资料的「档案库」——研究与展览的资料后台。", "etymology": "希腊 arkheion『官署、政府文书处』，源自 arkhe『政府、起始』。原指存放官方记录之所，后泛指档案。", "roots": [{"part": "arch (arkhe)", "meaning": "政府、起始（同 archaeology）"}, {"part": "-ive", "meaning": "名词后缀"}], "phonetics": "重音在首音节 /ˈɑːr/，读作「AR-kive」，ch 读 /k/，尾 -ive 读 /aɪv/。", "examples": [{"en": "The letters come from the museum's archive.", "zh": "这些信件出自博物馆的档案库。", "source": "造句"}, {"en": "the national archives / archive footage", "zh": "国家档案馆／存档影像（高频搭配）", "source": "高频搭配"}], "synonyms": [{"w": "collection", "ipa": "/kəˈlekʃn/", "gloss": "藏品，馆藏", "note": "collection 多指用于展出的艺术/实物藏品；archive 多指保存备查的文献、记录、影像资料，偏研究用途"}], "nuance": "collection 是「拿来展出的藏品」；archive 是「留存备查的文档资料」，前台与后台之别。"}, {"word": "texture", "levels": ["托福"], "ipa": "/ˈtekstʃər/", "subgroup": "noun", "meaning": "n. 质地，质感；纹理", "core": "作品表面「摸上去/看上去」的质感肌理——赏画时的细节维度。", "etymology": "拉丁 textura『编织、织物结构』，源自 texere『编织』（同 textile、text）。字面「织出来的表面纹理」。", "roots": [{"part": "text (texere)", "meaning": "编织（同 textile、text）"}, {"part": "-ure", "meaning": "名词后缀"}], "phonetics": "重音在首音节 /ˈtek/，读作「TEKS-cher」。", "examples": [{"en": "The thick paint gives the canvas a rough texture.", "zh": "厚涂的颜料让画布有一种粗糙的质感。", "source": "造句"}, {"en": "a smooth / rich texture", "zh": "光滑／丰富的质地（高频搭配）", "source": "高频搭配"}], "synonyms": [{"w": "surface", "ipa": "/ˈsɜːrfɪs/", "gloss": "表面", "note": "surface 是「表面」这个部位本身；texture 是这表面「摸/看起来的质感特征」（粗糙、细腻等）"}], "nuance": "surface 指「哪一层面」；texture 指「那层面呈现出的质感」，一个是位置一个是特征。"}, {"word": "perspective", "levels": ["托福", "六级"], "ipa": "/pərˈspektɪv/", "subgroup": "noun", "meaning": "n. 透视法；视角，观点", "core": "让平面画出「远近纵深」的透视法，也引申为看事情的视角。", "etymology": "拉丁 perspicere『看透、看清』（per- 透过 + spec/spicere 看）+ -ive。文艺复兴画家用它制造立体纵深错觉。", "roots": [{"part": "per-", "meaning": "透过、贯穿"}, {"part": "spect (specere)", "meaning": "看（同 inspect、spectacle）"}, {"part": "-ive", "meaning": "名词后缀"}], "phonetics": "重音在第二音节 /ˈspek/，读作「pər-SPEK-tiv」。", "examples": [{"en": "The painter used linear perspective to create depth.", "zh": "画家用线性透视法营造纵深感。", "source": "造句"}, {"en": "from a historical perspective", "zh": "从历史的视角来看（高频搭配）", "source": "高频搭配"}], "synonyms": [{"w": "viewpoint", "ipa": "/ˈvjuːpɔɪnt/", "gloss": "观点，立场", "note": "viewpoint 只有「看法/立场」这一层意思；perspective 既有「看法」义，又有绘画专业的「透视法」义"}], "nuance": "谈想法时 perspective ≈ viewpoint；但在美术馆语境里 perspective 常指「透视法」这门绘画技巧。", "senses": [{"gloss": "n. 透视法", "logic": "让平面看出纵深", "en": "Renaissance artists mastered perspective.", "zh": "文艺复兴画家精通透视法。"}, {"gloss": "n. 视角，观点", "logic": "「看透」事情的角度", "en": "The tour offers a fresh perspective on the era.", "zh": "这场导览提供了看待那个时代的新视角。"}]}, {"word": "renowned", "levels": ["六级", "托福"], "ipa": "/rɪˈnaʊnd/", "subgroup": "desc", "meaning": "adj. 著名的，声誉卓著的", "core": "被人「反复叫响名字」的——享有盛誉的名家名作。", "etymology": "古法语 renomer『再三提名、扬名』（re- 再 + nomer 命名，源自拉丁 nomen 名字，同 name、nominate）。字面「名字被一再传诵」。", "roots": [{"part": "re-", "meaning": "再、反复"}, {"part": "nown (nomen)", "meaning": "名字（同 name、nominate）"}, {"part": "-ed", "meaning": "形容词后 hey commissioned a mural for the lobby.", "zh": "他们委托为大厅创作一幅壁画。"}, {"gloss": "n. 受委托的作品", "logic": "被托付而生的成品", "en": "The statue was a royal commission.", "zh": "这尊雕像是王室委托之作。"}, {"gloss": "n. 佣金；委员会", "logic": "交托事务后所付的酬劳/受托办事的机构", "en": "The gallery takes a commission on each sale.", "zh": "画廊在每笔成交中抽取佣金。"}]}, {"word": "unveil", "levels": ["托福", "口语"], "ipa": "/ˌʌnˈveɪl/", "subgroup": "verb", "meaning": "v. 揭幕，为…揭去覆盖物；首次公开", "core": "「揭下遮布」——新作品或新展正式向公众亮相的那一刻。", "etymology": "un-『去除』+ veil『面纱、遮布』（拉丁 velum 帆、幕）。字面「揭去覆盖物」，引申为「首次公开展示」。", "roots": [{"part": "un-", "meaning": "去除、相反"}, {"part": "veil (velum)", "meaning": "面纱、遮布"}], "phonetics": "重音在第二音节 /ˈveɪl/，读作「un-VALE」，ei 读 /eɪ/。", "examples": [{"en": "The museum will unveil its new sculpture next week.", "zh": "博物馆将于下周为新雕塑揭幕。", "source": "造句"}, {"en": "unveil a statue / a plan", "zh": "为雕像揭幕／公布一项计划（高频搭配）", "source": "高频搭配"}], "synonyms": [{"w": "reveal", "ipa": "/rɪˈviːl/", "gloss": "揭示，透露", "note": "reveal 泛指「揭露、透露」任何信息（抽象）；unveil 更具仪式感，多指「正式为实物/大作品揭幕亮相」"}], "nuance": "reveal 是普通「揭露/透露」；unveil 带揭幕仪式的隆重感，多用于雕像、名作、新品正式亮相。"}, {"word": "renovate", "levels": ["托福"], "ipa": "/ˈrenəveɪt/", "subgroup": "verb", "meaning": "v. 翻新，整修（建筑/场馆）", "core": "把老场馆「重新弄新」——大修翻新，常导致临时闭馆。", "etymology": "拉丁 renovare『更新』（re- 再 + novare 使新，源自 novus 新，同 novel、innovate）。字面「使重新变新」。", "roots": [{"part": "re-", "meaning": "再、重新"}, {"part": "nov (novus)", "meaning": "新（同 novel、innovate）"}, {"part": "-ate", "meaning": "动词后缀"}], "phonetics": "重音在首音节 /ˈre/，读作「REN-ə-vate」。", "examples": [{"en": "The east wing is closed while they renovate it.", "zh": "东翼楼在整修期间暂停开放。", "source": "造句"}, {"en": "renovate a building / a gallery", "zh": "翻修一栋楼／一间展厅（高频搭配）", "source": "高频搭配"}], "synonyms": [{"w": "restore", "ipa": "/rɪˈstɔːr/", "gloss": "修复", "note": "restore 是「修回原来的样子」（尊重原貌，多用于文物/古画）；renovate 是「整修更新、可现代化改造」（多用于建筑设施）"}], "nuance": "restore 力求「复原如初」（文物、旧画）；renovate 允许「更新改造、变得更好用」（建筑、场馆）。"}, {"word": "conserve", "levels": ["托福", "六级"], "ipa": "/kənˈsɜːrv/", "subgroup": "verb", "meaning": "v. 保护，保存（文物/资源）", "core": "「一起守护」文物免于损坏——博物馆修复保护的专业动作。", "etymology": "拉丁 conservare『妥善保存』（com- 加强 + servare 守护，同 preserve、reserve）。文物领域专指「以科学手段延缓损坏」。", "roots": [{"part": "con- (com-)", "meaning": "加强、一起"}, {"part": "serve (servare)", "meaning": "守护、保存"}], "phonetics": "重音在第二音节 /ˈsɜːrv/，读作「kən-SURV」。", "examples": [{"en": "Experts work to conserve the fragile manuscripts.", "zh": "专家们努力保护这些脆弱的手稿。", "source": "造句"}, {"en": "conserve artifacts / energy", "zh": "保护文物／节约能源（高频搭配）", "source": "高频搭配"}], "synonyms": [{"w": "preserve", "ipa": "/prɪˈzɜːrv/", "gloss": "保存，保护", "note": "两词常通用；文博语境里 conserve 更强调「主动干预、科学处理以延缓损坏」，preserve 更强调「维持原状不使变化」"}], "nuance": "preserve 侧重「维持不变、留存原样」；conserve 侧重「主动施加保护手段延缓劣化」，是文物修复的专业用词。"}, {"word": "donor", "levels": ["场景", "托福"], "ipa": "/ˈdoʊnər/", "subgroup": "noun", "meaning": "n. 捐赠者，赠予人", "core": "把藏品或资金「捐给」博物馆的人——展签上常见「XX 捐赠」。", "etymology": "拉丁 donare『赠送』（donum 礼物，源自 dare 给，同 donate、donation）+ -or。字面「作赠予的人」。", "roots": [{"part": "don (donare)", "meaning": "赠送、给予（同 donate）"}, {"part": "-or", "meaning": "表施动者，做…的人"}], "phonetics": "重音在首音节 /ˈdoʊ/，读作「DOH-ner」，o 读 /oʊ/。", "examples": [{"en": "The painting was left to the museum by a private donor.", "zh": "这幅画是一位私人捐赠者遗赠给博物馆的。", "source": "造句"}, {"en": "an anonymous donor / a major donor", "zh": "匿名捐赠者／主要捐赠人（高频搭配）", "source": "高频搭配"}], "synonyms": [{"w": "patron", "ipa": "/ˈpeɪtrən/", "gloss": "赞助人", "note": "donor 侧重「一次性捐出实物/钱款」；patron 侧重「长期资助、扶持」某艺术家或机构，关系更持续"}], "nuance": "donor 强调「捐了什么」（多为具体一笔捐赠）；patron 强调「长期赞助扶持」的持续关系。"}, {"word": "patron", "levels": ["托福"], "ipa": "/ˈpeɪtrən/", "subgroup": "noun", "meaning": "n. 赞助人，资助者；老主顾", "core": "长期出钱「护着、养着」艺术家或机构的赞助人——文艺复兴名作背后多有 patron。", "etymology": "拉丁 patronus『保护人』，源自 pater『父亲』（同 paternal）。字面「像父亲一样庇护供养的人」。", "roots": [{"part": "patr (pater)", "meaning": "父亲、庇护（同 paternal）"}, {"part": "-on", "meaning": "名词后缀，表人"}], "phonetics": "重音在首音节 /ˈpeɪ/，读作「PAY-tron」，a 读 /eɪ/。", "examples": [{"en": "The Medici family were famous patrons of the arts.", "zh": "美第奇家族是著名的艺术赞助人。", "source": "造句"}, {"en": "a patron of the arts", "zh": "艺术赞助人（高频搭配）", "source": "高频搭配"}], "synonyms": [{"w": "sponsor", "ipa": "/ˈspɑːnsər/", "gloss": "赞助商", "note": "sponsor 多是为回报（品牌曝光）而出资，偏商业；patron 传统上是「因热爱艺术而长期供养」，情怀色彩更浓"}], "nuance": "sponsor 出钱图回报（商业味重）；patron 是「因爱艺术而扶持」，历史上多指供养艺术家的贵族富商。", "senses": [{"gloss": "n. 赞助人，资助者", "logic": "像父亲般庇护供养", "en": "She became a patron of young sculptors.", "zh": "她成了年轻雕塑家的赞助人。"}, {"gloss": "n. 老主顾，顾客", "logic": "长期光顾、受店家「照拂」的人", "en": "The café's regular patrons filled every table.", "zh": "咖啡馆的常客坐满了每一张桌子。"}]}]}</script>
<script>
const G = JSON.parse(document.getElementById('data').textContent);
const KEY = 'vocab-unfam-' + G.id;
let unfam = new Set(JSON.parse(localStorage.getItem(KEY) || '[]'));
let curLv = '全部', curSg = '全部', curQ = '', onlyUnfam = false;

const LVCLASS = {'六级':'lv6','托福':'tfl','GRE拓展':'gre','基础':'','口语':'spk','场景':'scn'};
// 发音分组配色（按 subgroups 顺序循环取用）
const SGCOLORS = ['#2f8f83','#b0603f','#6a52a8','#c1662f','#3a7bd5'];
const SUBG = G.subgroups || [];
function sgIndex(key){ const i=SUBG.findIndex(s=>s.key===key); return i<0?0:i; }
function sgColor(key){ return SGCOLORS[sgIndex(key)%SGCOLORS.length]; }
function sgOf(key){ return SUBG.find(s=>s.key===key); }

// ---------- header
function renderHero(){
  const h = document.getElementById('hero');
  const rules = SUBG.map((s,i)=>{
    const c = SGCOLORS[i%SGCOLORS.length];
    return `<div class="rule" style="border-left:5px solid ${c}"><b style="color:${c}">${s.label}</b>${s.desc||''}</div>`;
  }).join('');
  const rhymes = (G.rhymeChains && G.rhymeChains.length)
    ? `<div class="rhymes"><h3>🎵 同韵顺口溜 · 点单词听发音，成串背最快</h3>${
        G.rhymeChains.map(c=>`<div class="chain"><span class="lab">${c.label}</span>${
          c.words.map(w=>`<span class="chip" onclick="say('${w}')">${w}</span>`).join('')
        }</div>`).join('')}</div>`
    : '';
  h.innerHTML = `
    <div class="combo"><span class="big">${G.combo}</span><span class="snd">${G.sound}</span></div>
    <h1>${G.title} · ${G.subtitle||''}</h1>
    <p class="intro">${G.intro}</p>
    <div class="rules">${rules}</div>
    ${rhymes}`;
}

// ---------- 精读：文章 + 句法分析
let speaking=false;
function sayPassage(btn){
  if(speaking){ speechSynthesis.cancel(); speaking=false; if(btn) btn.textContent='🔊 朗读全文'; return; }
  const P = G.passage; if(!P) return;
  const texts = (P.paragraphs||[]).map(p=>p.en).filter(Boolean);
  if(!texts.length) return;
  if(!VOICE) pickVoice();
  speaking=true; if(btn) btn.textContent='⏹ 停止朗读';
  let last=null;
  texts.forEach((t,i)=>{
    const u = new SpeechSynthesisUtterance(t);
    u.lang='en-US'; if(VOICE) u.voice=VOICE; u.rate=.95; u.pitch=1.0;
    if(i===texts.length-1) last=u;
    speechSynthesis.speak(u);
  });
  if(last) last.onend=()=>{ speaking=false; if(btn) btn.textContent='🔊 朗读全文'; };
}
function renderPassage(){
  const el = document.getElementById('passage');
  const P = G.passage; if(!P){ el.style.display='none'; return; }
  const paras = (P.paragraphs||[]).map(p=>{
    let en = p.en||'';
    // 高亮关键词（p.kws 或自动匹配词表词）
    const kws = p.kws || [];
    kws.forEach(k=>{ en = en.replace(new RegExp('('+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'), '<span class="kw" onclick="say(\'$1\')">$1</span>'); });
    return `<p><div class="en">${en}</div>${p.zh?`<div class="zh">${p.zh}</div>`:''}</p>`;
  }).join('');
  el.innerHTML = `<div class="passage"><h2>📖 精读原文</h2>
    <div class="p-title">${P.title||''} <button class="readall" onclick="sayPassage(this)">🔊 朗读全文</button></div>
    ${paras}</div>`;
}
const ROLECOLOR = { '主语':'#2f8f83','谓语':'#c1662f','宾语':'#3a7bd5','状语':'#6a52a8','定语':'#b0603f','补语':'#c1662f','从句':'#8c8072','连词':'#8c8072','介词':'#8c8072','插入语':'#8c8072','同位语':'#b0603f' };
function roleColor(r){ return ROLECOLOR[r] || '#6a52a8'; }
function escAttr(s){ return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
// 句子内括号标注：介词短语 ( ) · 从句 [ ] · 非谓语 { }
const BRK = {'pp':['(',')'], 'cl':['[',']'], 'nf':['{','}']};
const BRKC = {'pp':'#6a52a8', 'cl':'#3a7bd5', 'nf':'#b0603f'};
function renderFlow(s){
  let html='';
  (s.flow||[]).forEach(it=>{
    if(it.open){ const k=it.open; html+=`<span class="brkbox" style="background:${BRKC[k]}16;border-bottom:2px solid ${BRKC[k]}66"><b class="brk" style="color:${BRKC[k]}">${BRK[k][0]}</b>`; }
    else if(it.close){ const k=it.close; html+=`<b class="brk" style="color:${BRKC[k]}">${BRK[k][1]}</b></span>`; }
    else { html+=escAttr(it.t); }
  });
  return html;
}
function renderSents(){
  const el = document.getElementById('sents');
  const S = G.sentences; if(!S || !S.length){ el.style.display='none'; return; }
  const items = S.map((s,i)=>{
    const flowHtml = (s.flow && s.flow.length) ? renderFlow(s) : escAttr(s.en);
    const parts = (s.parts||[]).map(p=>{
      const c = roleColor(p.r);
      return `<span class="spart" style="background:${c}18;border:1px solid ${c}55">
        <span class="st" style="color:${c}">${escAttr(p.t)}</span>
        <span class="sr" style="background:${c}">${p.r}</span>
        ${p.n?`<span class="sn">${p.n}</span>`:''}</span>`;
    }).join('');
    return `<div class="sent">
      <div class="s-flow" data-en="${escAttr(s.en)}" onclick="say(this.dataset.en)" title="点句子朗读">${flowHtml} <button class="say-mini" data-en="${escAttr(s.en)}" onclick="event.stopPropagation();say(this.dataset.en)" title="朗读">🔊</button></div>
      ${s.zh?`<div class="s-zh">${s.zh}</div>`:''}
      <div class="s-parts">${parts}</div>
      ${s.note?`<div class="snotes">${s.note}</div>`:''}</div>`;
  }).join('');
  el.innerHTML = `<div class="sents"><h2>🔍 长难句 · 句法分析</h2>
    <div class="s-sub">点英文句可朗读 · 括号标注：<b style="color:#6a52a8">( ) 介词短语</b> · <b style="color:#3a7bd5">[ ] 从句</b> · <b style="color:#b0603f">{ } 非谓语动词</b> · 下方色块=成分功能</div>
    ${items}</div>`;
}

// ---------- filters
function renderFilters(){
  const lvs = ['全部','六级','托福','GRE拓展','基础'];
  document.getElementById('lvf').innerHTML = lvs.map(l=>
    `<span class="f${l===curLv?' on':''}" onclick="setLv('${l}')">${l}</span>`).join('');
  const sgs = [['全部','全部'], ...SUBG.map(s=>[s.tag||s.label, s.key])];
  document.getElementById('sgf').innerHTML = sgs.map(([t,v])=>
    `<span class="f${v===curSg?' on':''}" onclick="setSg('${v}')">${t}</span>`).join('');
}
function setLv(l){curLv=l;renderFilters();renderGrid();}
function setSg(s){curSg=s;renderFilters();renderGrid();}

// ---------- speech：优先自然美式女声
let VOICE=null, VOICES=[];
// 各浏览器/系统里公认自然的美式女声，按优先级排序
const PREF=[
  'Google US English',                 // Chrome：自然女声
  'Microsoft Aria Online (Natural) - English (United States)',
  'Microsoft Jenny Online (Natural) - English (United States)',
  'Microsoft Ava Online (Natural) - English (United States)',
  'Microsoft Aria','Microsoft Jenny','Microsoft Michelle',
  'Ava (Premium)','Ava (Enhanced)','Ava',   // macOS Siri 女声
  'Samantha',                          // macOS 经典美式女声
  'Allison','Susan','Nicky','Zoe','Karen','Victoria'
];
const MALE=/(alex|daniel|fred|tom|david|mark|male|aaron|arthur|gordon|oliver|rishi|junior|ralph)/i;
function usPool(){
  VOICES = speechSynthesis.getVoices()||[];
  let us = VOICES.filter(v=>/en[-_]US/i.test(v.lang)||/United States/i.test(v.name));
  if(!us.length) us = VOICES.filter(v=>/^en/i.test(v.lang));
  return us;
}
function pickVoice(){
  const pool=usPool(); if(!pool.length) return;
  VOICE=null;
  for(const n of PREF){ const h=pool.find(v=>v.name===n)||pool.find(v=>v.name.indexOf(n)===0); if(h){VOICE=h;break;} }
  if(!VOICE) VOICE = pool.find(v=>/(samantha|ava|allison|susan|nicky|zoe|karen|victoria|aria|jenny|michelle|female|google us)/i.test(v.name))
                   || pool.find(v=>!MALE.test(v.name)) || pool[0];
  fillVoiceSel(pool);
}
function fillVoiceSel(pool){
  const s=document.getElementById('voiceSel'); if(!s) return;
  s.innerHTML = pool.map(v=>{
    const nm=v.name.replace(/ - English.*/,'').replace(/Online \(Natural\)/,'✨');
    return `<option value="${v.name}"${VOICE&&v.name===VOICE.name?' selected':''}>🎙 ${nm}</option>`;
  }).join('');
}
document.getElementById('voiceSel').addEventListener('change',e=>{
  VOICE = VOICES.find(v=>v.name===e.target.value)||VOICE; say(G.combo==='aw'?'awesome':'natural');
});
if('onvoiceschanged' in speechSynthesis) speechSynthesis.onvoiceschanged = pickVoice;
pickVoice();
function say(w){
  try{
    if(!VOICE) pickVoice();
    const u = new SpeechSynthesisUtterance(w);
    u.lang='en-US'; if(VOICE) u.voice=VOICE; u.rate=.95; u.pitch=1.0;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }catch(e){}
}

// 高亮单词里的目标拼写：优先用该词自带的 hl（音位页里每词各自的拼写），否则用组的 combo
function hlWord(word, spell){
  const c = (spell||'').replace(/[.*+?^${}()|[\]\\\/·\s]/g,'');  // 只取干净字母做高亮，去掉 / · 空格等
  if(!c) return word;
  try{ return word.replace(new RegExp('('+c+')','i'), '<span class="hl">$1</span>'); }
  catch(e){ return word; }
}

// ---------- card
function card(w){
  const tags = (w.levels||[]).map(l=>`<span class="tag ${LVCLASS[l]||''}">${l}</span>`).join('');
  const roots = (w.roots||[]).map(r=>`<span class="root"><b>${r.part}</b> ${r.meaning}</span>`).join('');
  const exs = (w.examples||[]).map(e=>{
    const fam = /造句/.test(e.source)? '' : ' famous';
    return `<div class="ex${fam}"><div class="en">${e.en}</div><div class="zh">${e.zh}</div><span class="src">— ${e.source}</span></div>`;
  }).join('');
  const syns = (w.synonyms||[]).map(s=>
    `<div class="lex"><b class="lw" onclick="event.stopPropagation();say('${s.w}')">${s.w}</b>`+
    `${s.ipa?` <span class="lip">${s.ipa}</span>`:''}${s.note?` <span class="ln">— ${s.note}</span>`:''}</div>`).join('');
  const ants = (w.antonyms||[]).map(a=>
    `<span class="antchip" onclick="event.stopPropagation();say('${a.w}')">${a.w}${a.note?` <i>${a.note}</i>`:''}</span>`).join('');
  const lexSec = (syns||ants||w.nuance)
    ? `<div class="sec"><span class="l">🔗 近义词辨析 · 反义词</span>`+
      `${syns?`<div class="lexgroup"><span class="lextag syn">近义</span><div class="lexlist">${syns}</div></div>`:''}`+
      `${ants?`<div class="lexgroup"><span class="lextag ant">反义</span><div class="lexlist antline">${ants}</div></div>`:''}`+
      `${w.nuance?`<div class="nuance">🎯 ${w.nuance}</div>`:''}</div>`
    : '';
  const senses = (w.senses||[]).map(s=>
    `<div class="sense"><div class="s-gloss"><b>${s.gloss}</b>${s.logic?` <span class="s-logic">← ${s.logic}</span>`:''}</div>`+
    `${s.en?`<div class="s-ex"><span class="s-en">${s.en}</span> <span class="s-zh">${s.zh||''}</span></div>`:''}</div>`).join('');
  const senseSec = (w.core||senses)
    ? `<div class="sec"><span class="l">🧠 一词多义 · 核心意象串解</span>`+
      `${w.core?`<div class="coreimg">🎯 核心感觉：${w.core}</div>`:''}${senses}</div>`
    : '';
  const isU = unfam.has(w.word);
  const so = sgOf(w.subgroup);
  return `<div class="card${isU?' unfamiliar':''}" data-w="${w.word}" onclick="if(document.body.classList.contains('mem'))this.classList.toggle('reveal')">
    <span class="sub-tag" style="background:${sgColor(w.subgroup)}">${so?(so.tag||so.label):''}</span>
    <div class="whead">
      <span class="word">${hlWord(w.word, w.hl || G.combo)}</span>
      <span class="ipa">${w.ipa}</span>
      <button class="say" onclick="event.stopPropagation();say('${w.word}')" title="朗读">🔊</button>
    </div>
    <div class="tags">${tags}</div>
    <div class="mean">${w.meaning}</div>
    ${senseSec}
    ${w.etymology?`<div class="sec"><span class="l">🏛 造词来源 · 词源故事</span>${w.etymology}</div>`:''}
    ${roots?`<div class="sec"><span class="l">🧩 词根词缀</span><div class="roots">${roots}</div></div>`:''}
    ${w.phonetics?`<div class="sec"><span class="l">🗣 发音规律</span>${w.phonetics}</div>`:''}
    ${w.tip?`<div class="sec"><span class="l">💡 记忆钩子</span><div class="tip">${w.tip}</div></div>`:''}
    ${exs?`<div class="sec"><span class="l">✍️ 造句 · 名著/影视例句</span>${exs}</div>`:''}
    ${lexSec}
    <label class="check" onclick="event.stopPropagation()">
      <input type="checkbox" ${isU?'checked':''} onchange="toggleUnfam('${w.word}',this.checked)"> 🔺 标记不熟悉
    </label>
  </div>`;
}

function match(w){
  if(onlyUnfam && !unfam.has(w.word)) return false;
  if(curLv!=='全部' && !(w.levels||[]).includes(curLv)) return false;
  if(curSg!=='全部' && w.subgroup!==curSg) return false;
  if(curQ){
    const s=(w.word+' '+w.meaning).toLowerCase();
    if(!s.includes(curQ.toLowerCase())) return false;
  }
  return true;
}

function renderGrid(){
  const list = G.words.filter(match);
  // 不熟悉的置顶（稳定排序，保持各自原有相对顺序）
  list.sort((a,b)=>(unfam.has(b.word)?1:0)-(unfam.has(a.word)?1:0));
  const g = document.getElementById('grid');
  g.innerHTML = list.length? list.map(card).join('') : '<div class="empty">没有匹配的单词，换个筛选试试～</div>';
  updateUnfamCount();
}

function toggleUnfam(word, on){
  if(on) unfam.add(word); else unfam.delete(word);
  localStorage.setItem(KEY, JSON.stringify([...unfam]));
  const c = document.querySelector(`.card[data-w="${word}"]`);
  if(c) c.classList.toggle('unfamiliar', on);   // 立即变色，卡片原位不跳动；置顶在下次渲染/筛选时生效
  updateUnfamCount();
}
function updateUnfamCount(){
  const n = G.words.filter(w=>unfam.has(w.word)).length;
  const el = document.getElementById('unfamN');
  if(el) el.textContent = n;
}

document.getElementById('q').addEventListener('input',e=>{curQ=e.target.value;renderGrid();});
document.getElementById('unfamBtn').addEventListener('click',e=>{
  onlyUnfam=!onlyUnfam;
  e.currentTarget.classList.toggle('on',onlyUnfam);
  renderGrid();
});
document.getElementById('memBtn').addEventListener('click',e=>{
  document.body.classList.toggle('mem');
  e.target.classList.toggle('on');
  e.target.textContent = document.body.classList.contains('mem')?'🧠 记忆模式(开)·悬停显形':'🧠 记忆模式';
});

// ---------- 测验：英文 → 中文四选一（覆盖当前筛选到的全部单词）
let quiz=null;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
// 测验池 = 本页(筛选后)全部词 + 它们的同义词 + 衍生词（去重）
function quizPool(){
  const base = G.words.filter(match);
  const items=[]; const seen=new Set();
  const add=(word,ipa,meaning)=>{const k=(word||'').toLowerCase();
    if(!word||!meaning||seen.has(k))return; seen.add(k); items.push({word,ipa:ipa||'',meaning});};
  base.forEach(w=>{
    add(w.word,w.ipa,w.meaning);
    (w.synonyms||[]).forEach(s=>add(s.w,s.ipa,s.gloss||s.note));
    (w.derivatives||[]).forEach(dv=>add(dv.w,dv.ipa,dv.gloss||dv.note));
  });
  return items;
}
function startQuiz(src){
  const pool = src || quizPool();
  if(pool.length<4){ alert('至少要有 4 个词才能测验，请先放宽上方筛选～'); return; }
  quiz={list:shuffle(pool), i:0, score:0, wrong:[], done:false, next:null, pool:quizPool()};
  document.getElementById('quizOv').style.display='flex';
  renderQ();
}
function renderQ(){
  quiz.done=false; quiz.next=null;
  const q=quiz.list[quiz.i];
  const others=(quiz.pool||[]).filter(w=>w.meaning!==q.meaning);
  const opts=shuffle([q.meaning, ...shuffle(others).slice(0,3).map(w=>w.meaning)]);
  const K=['1','2','3','4'];
  document.getElementById('qbox').innerHTML=`
    <div class="qtop"><span>第 ${quiz.i+1} / ${quiz.list.length} 题 · 已答对 ${quiz.score}</span>
      <span style="cursor:pointer" onclick="closeQuiz()">✕ 关闭</span></div>
    <div class="qbar2"><i style="width:${quiz.i/quiz.list.length*100}%"></i></div>
    <div class="qword">${q.word} <button class="say" style="vertical-align:middle;width:30px;height:30px;font-size:14px" onclick="say('${q.word}')">🔊</button></div>
    <div class="qipa">${q.ipa}</div>
    <div class="qopts" id="qopts">${opts.map((o,k)=>
      `<button class="qopt" data-m="${encodeURIComponent(o)}" onclick="answer(this,'${encodeURIComponent(q.meaning)}')">
        <span class="k">${K[k]}</span><span>${o}</span></button>`).join('')}</div>
    <div class="hint">按 1–4 键作答 · 回车进入下一题</div>`;
  say(q.word);
}
function answer(el, correctEnc){
  if(quiz.done) return; quiz.done=true;
  const correct=decodeURIComponent(correctEnc);
  const chosen=decodeURIComponent(el.dataset.m);
  if(chosen===correct) quiz.score++; else quiz.wrong.push(quiz.list[quiz.i]);
  document.querySelectorAll('#qopts .qopt').forEach(b=>{
    const m=decodeURIComponent(b.dataset.m);
    if(m===correct) b.classList.add('right');
    else if(b===el) b.classList.add('wrong');
    else b.classList.add('dim');
    b.style.pointerEvents='none';
  });
  const btn=document.createElement('button');
  btn.className='qnext';
  btn.textContent = quiz.i<quiz.list.length-1 ? '下一题 →' : '看结果 →';
  btn.onclick=nextQ;
  document.getElementById('qbox').appendChild(btn);
  quiz.next=btn;
}
function nextQ(){
  if(quiz.i<quiz.list.length-1){ quiz.i++; renderQ(); } else endQuiz();
}
function endQuiz(){
  const tot=quiz.list.length, pct=Math.round(quiz.score/tot*100);
  const wrongHtml = quiz.wrong.length
    ? quiz.wrong.map(w=>`<div class="r"><b>${w.word}</b> ${w.ipa} — ${w.meaning}</div>`).join('')
    : '<div class="r">全部答对，太强了！🎉</div>';
  const wrongCopy = quiz.wrong.slice();
  document.getElementById('qbox').innerHTML=`
    <div class="qend">
      <div class="qtop" style="justify-content:flex-end"><span style="cursor:pointer" onclick="closeQuiz()">✕ 关闭</span></div>
      <div>本轮得分</div><div class="qscore">${quiz.score}/${tot}</div>
      <div style="color:var(--muted)">正确率 ${pct}%</div>
      <div class="qwrong"><div style="color:var(--exc);font-weight:700;margin-bottom:4px">错题（${quiz.wrong.length}）</div>${wrongHtml}</div>
      <div id="qendBtns"></div>
    </div>`;
  const box=document.getElementById('qendBtns');
  if(wrongCopy.length){
    const b1=document.createElement('button'); b1.className='qnext'; b1.textContent='只测这些错题';
    b1.onclick=()=>startQuiz(wrongCopy); box.appendChild(b1);
  }
  const b2=document.createElement('button'); b2.className='qnext';
  b2.style.cssText='background:#fff;color:var(--accent);border:1.5px solid var(--accent);margin-top:8px';
  b2.textContent='再来一轮（当前筛选）'; b2.onclick=()=>startQuiz(); box.appendChild(b2);
}
function closeQuiz(){ document.getElementById('quizOv').style.display='none'; quiz=null; }
document.getElementById('quizBtn').addEventListener('click',()=>startQuiz());
document.getElementById('quizOv').addEventListener('click',e=>{ if(e.target.id==='quizOv') closeQuiz(); });
document.addEventListener('keydown',e=>{
  if(!quiz || document.getElementById('quizOv').style.display==='none') return;
  if(quiz.next && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); quiz.next.click(); return; }
  if(!quiz.done && /^[1-4]$/.test(e.key)){ const b=document.querySelectorAll('#qopts .qopt')[+e.key-1]; if(b) b.click(); }
});

document.getElementById('foot').innerHTML =
  `共 ${G.words.length} 词 · 数据源：托福 4264 词表（真实词库）+ 六级核心词 · `+
  `发音由浏览器语音合成朗读 · 名著/影视例句均为真实出处，「造句」为学习例句，「高频搭配」为常用短语。`;

renderHero(); renderPassage(); renderSents(); renderFilters(); renderGrid();
</script>
