<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>酒店前台 · 听力复述场景高频词 · 单词拆解卡片</title>
<style>
  :root{
    --bg:#f7f1e7; --card:#fffdf8; --ink:#2f2a24; --muted:#8c8072;
    --line:#eaddc9; --accent:#c1662f; --accent2:#e0913c; --amber:#fbe6c4;
    --core:#2f8f83; --exc:#b0603f; --ok:#4a9a5e;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,"PingFang SC","Helvetica Neue",Segoe UI,sans-serif;
    line-height:1.6;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1180px;margin:0 auto;padding:26px 20px 90px}
  a{color:var(--accent);text-decoration:none}
  .top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
  .top a{color:var(--muted)}
  /* header */
  header.hero{margin:14px 0 22px}
  .combo{display:inline-flex;align-items:baseline;gap:14px}
  .combo .big{font-family:Georgia,"Times New Roman",serif;font-size:60px;font-weight:700;
    background:var(--amber);color:var(--accent);padding:2px 20px;border-radius:18px;line-height:1.1}
  .combo .snd{font-size:30px;color:var(--core);font-weight:700}
  h1{font-size:23px;margin:14px 0 4px}
  .intro{color:#5f574c;max-width:860px;font-size:15px}
  /* rule cards */
  .rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin:18px 0}
  .rule{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:14px}
  .rule.core{border-left:5px solid var(--core)}
  .rule.exc{border-left:5px solid var(--exc)}
  .rule b{display:block;margin-bottom:4px;font-size:14px}
  .rule.core b{color:var(--core)} .rule.exc b{color:var(--exc)}
  /* rhyme chains */
  .rhymes{background:linear-gradient(135deg,#fff6e8,#fdeede);border:1px dashed var(--accent2);
    border-radius:14px;padding:14px 16px;margin-bottom:20px}
  .rhymes h3{margin:0 0 8px;font-size:15px;color:var(--accent)}
  .chain{margin:6px 0;font-size:14px}
  .chain .lab{color:var(--muted);margin-right:8px}
  .chip{display:inline-block;background:#fff;border:1px solid var(--line);border-radius:20px;
    padding:2px 11px;margin:3px 4px 3px 0;cursor:pointer;font-family:Georgia,serif;font-size:15px;transition:.15s}
  .chip:hover{background:var(--amber);border-color:var(--accent2)}
  /* toolbar */
  .toolbar{position:sticky;top:0;z-index:20;background:rgba(247,241,231,.94);backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);padding:12px 0;margin-bottom:18px;
    display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .search{flex:1;min-width:180px;padding:8px 13px;border:1px solid var(--line);border-radius:10px;
    font-size:14px;background:#fff}
  .filters{display:flex;flex-wrap:wrap;gap:6px}
  .f{padding:6px 12px;border:1px solid var(--line);background:#fff;border-radius:20px;font-size:13px;
    cursor:pointer;color:#6b6154;transition:.15s}
  .f.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  select.f{max-width:170px;color:#6b6154;cursor:pointer}
  .btn{padding:7px 14px;border:1px solid var(--accent);background:#fff;color:var(--accent);
    border-radius:20px;font-size:13px;cursor:pointer;font-weight:600}
  .btn.on{background:var(--accent);color:#fff}
  .prog{font-size:13px;color:var(--muted);white-space:nowrap}
  .bar{height:6px;background:var(--line);border-radius:6px;width:120px;overflow:hidden;display:inline-block;vertical-align:middle}
  .bar>i{display:block;height:100%;background:var(--ok);width:0}
  /* cards */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 17px;
    box-shadow:0 2px 10px rgba(150,120,70,.06);display:flex;flex-direction:column;gap:10px;position:relative}
  .card.unfamiliar{border-color:#e08a3c;background:#fff7ec;box-shadow:0 2px 14px rgba(210,120,40,.20)}
  .card .sub-tag{position:absolute;top:0;right:16px;transform:translateY(-50%);
    font-size:11px;padding:2px 9px;border-radius:10px;color:#fff}
  .sub-core{background:var(--core)} .sub-exc{background:var(--exc)}
  .whead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .word{font-family:Georgia,"Times New Roman",serif;font-size:30px;font-weight:700;letter-spacing:.5px}
  .word .hl{background:var(--amber);color:var(--accent);border-radius:6px;padding:0 3px}
  .ipa{color:var(--core);font-size:16px;font-weight:600}
  .say{margin-left:auto;border:none;background:var(--amber);color:var(--accent);border-radius:50%;
    width:34px;height:34px;font-size:16px;cursor:pointer;flex:none}
  .say:hover{background:var(--accent2);color:#fff}
  .tags{display:flex;gap:5px;flex-wrap:wrap}
  .tag{font-size:11px;padding:1px 8px;border-radius:9px;background:#f0e7d6;color:#8a6a3c}
  .tag.lv6{background:#e6f0ec;color:#2f8f83}
  .tag.tfl{background:#eae6f5;color:#6a52a8}
  .tag.gre{background:#f7e6ea;color:#b0507a}
  .mean{font-size:15.5px;font-weight:600;color:#3a332b}
  .sec{font-size:13.5px;color:#4d463c;border-top:1px dashed var(--line);padding-top:8px}
  .sec .l{font-size:11.5px;color:var(--accent);font-weight:700;letter-spacing:.5px;display:block;margin-bottom:2px}
  .roots{display:flex;flex-wrap:wrap;gap:6px}
  .root{background:#f6efe1;border-radius:8px;padding:3px 9px;font-size:12.5px}
  .root b{font-family:Georgia,serif;color:var(--accent)}
  .tip{background:#fff6e8;border-left:3px solid var(--accent2);padding:5px 10px;border-radius:0 8px 8px 0;font-size:13px}
  /* 一词多义 · 核心意象 */
  .coreimg{background:#f4f0e5;border-radius:8px;padding:6px 10px;font-size:13.5px;color:#5a4a2e;margin-bottom:7px}
  .sense{border-left:3px solid var(--accent2);padding:3px 0 3px 10px;margin:6px 0}
  .sense .s-gloss{font-size:14px}
  .sense .s-gloss b{color:#3a332b}
  .sense .s-logic{color:var(--accent);font-size:12.5px}
  .sense .s-ex{margin-top:2px;font-size:13px}
  .sense .s-en{font-family:Georgia,serif;color:#2f2a24}
  .sense .s-zh{color:#6b6154}
  .ex{margin:7px 0}
  .ex .en{font-family:Georgia,serif;font-size:14px;color:#2f2a24}
  .ex .zh{color:#6b6154;font-size:13px}
  .ex .src{display:inline-block;font-size:11px;color:#a89a86;margin-top:1px}
  .ex.famous{background:#fbf4e7;border-radius:8px;padding:7px 10px}
  /* 近义词辨析 / 反义词 */
  .lexgroup{display:flex;gap:8px;margin:4px 0;align-items:flex-start}
  .lextag{flex:none;font-size:11px;font-weight:700;padding:1px 8px;border-radius:8px;margin-top:3px}
  .lextag.syn{background:#e6f0ec;color:#2f8f83}
  .lextag.ant{background:#f7e6ea;color:#b0507a}
  .lexlist{display:flex;flex-direction:column;gap:3px;font-size:13.5px;flex:1}
  .lexlist.antline{flex-direction:row;flex-wrap:wrap;gap:6px;align-items:center}
  .lex .lw{font-family:Georgia,serif;color:var(--accent);cursor:pointer;font-weight:600}
  .lex .lw:hover{text-decoration:underline}
  .lex .lip{color:var(--core);font-size:12px}
  .lex .ln{color:#5f574c}
  .antchip{background:#faf0f2;border-radius:8px;padding:2px 9px;cursor:pointer;font-family:Georgia,serif;font-size:13px;color:#b0507a}
  .antchip:hover{background:#f6e3e8}
  .antchip i{font-style:normal;color:#9a8f86;font-size:12px}
  .nuance{background:#eef6f3;border-left:3px solid var(--core);padding:6px 10px;border-radius:0 8px 8px 0;font-size:13px;margin-top:7px;color:#33463f}
  /* memorize mode hides meaning+detail until hover/click */
  body.mem .mean, body.mem .sec{filter:blur(5px);transition:.15s;cursor:pointer}
  body.mem .card:hover .mean, body.mem .card.reveal .mean,
  body.mem .card:hover .sec, body.mem .card.reveal .sec{filter:none}
  .check{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer;margin-top:2px}
  .check input{width:16px;height:16px;accent-color:#c1662f}
  .card.unfamiliar .check{color:#c1662f;font-weight:600}
  .empty{text-align:center;color:var(--muted);padding:40px;grid-column:1/-1}
  footer{margin-top:36px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
  /* 测验 */
  #quizOv{display:none;position:fixed;inset:0;background:rgba(47,42,36,.55);z-index:50;
    align-items:center;justify-content:center;padding:18px}
  .qbox{background:var(--card);border-radius:20px;max-width:560px;width:100%;padding:22px 24px 20px;
    box-shadow:0 24px 70px rgba(0,0,0,.32);max-height:92vh;overflow:auto}
  .qtop{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px;margin-bottom:8px}
  .qbar2{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:16px}
  .qbar2>i{display:block;height:100%;background:var(--accent);width:0;transition:.3s}
  .qword{font-family:Georgia,serif;font-size:40px;font-weight:700;text-align:center;margin:4px 0 2px}
  .qipa{text-align:center;color:var(--core);font-size:16px;margin-bottom:16px}
  .qopts{display:grid;gap:10px}
  .qopt{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:11px 14px;font-size:14.5px;
    cursor:pointer;text-align:left;transition:.12s;display:flex;gap:10px;align-items:flex-start;font-family:inherit;color:var(--ink)}
  .qopt:hover{border-color:var(--accent2);background:#fffaf0}
  .qopt .k{font-weight:700;color:var(--accent);flex:none}
  .qopt.right{border-color:var(--ok);background:#eafaef}
  .qopt.wrong{border-color:var(--exc);background:#fdeeea}
  .qopt.dim{opacity:.45}
  .qnext{margin-top:14px;width:100%;padding:12px;border:none;border-radius:12px;background:var(--accent);
    color:#fff;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
  .qend{text-align:center}
  .qscore{font-size:46px;font-weight:800;color:var(--accent);margin:4px 0}
  .qwrong{text-align:left;margin:14px 0;max-height:34vh;overflow:auto}
  .qwrong .r{border-top:1px dashed var(--line);padding:7px 0;font-size:14px}
  .qwrong .r b{font-family:Georgia,serif;color:var(--exc)}
  .hint{text-align:center;color:var(--muted);font-size:12px;margin-top:10px}
  /* 精读 · 文章 + 句法分析 */
  .passage{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--accent);
    border-radius:14px;padding:18px 20px;margin:0 0 22px}
  .passage h2{margin:0 0 10px;font-size:18px;color:var(--accent)}
  .passage .p-title{font-family:Georgia,serif;font-size:20px;font-weight:700;color:var(--ink);margin-bottom:10px}
  .passage p{font-size:15px;line-height:1.9;margin:10px 0}
  .passage .en{color:#3a332b;font-family:Georgia,"Times New Roman",serif}
  .passage .zh{color:var(--muted);font-size:13.5px}
  .passage .kw{cursor:pointer;color:var(--accent);font-weight:600;border-bottom:1px dotted var(--accent2)}
  .readall{background:var(--accent);color:#fff;border:none;border-radius:20px;padding:4px 14px;font-size:13px;
    cursor:pointer;margin-left:10px;vertical-align:middle;transition:.15s}
  .readall:hover{background:var(--core)}
  .sents{background:linear-gradient(135deg,#f3f8f6,#eef3f0);border:1px solid var(--line);
    border-radius:14px;padding:18px 20px;margin:0 0 22px}
  .sents h2{margin:0 0 6px;font-size:18px;color:var(--core)}
  .sents .s-sub{color:var(--muted);font-size:13px;margin-bottom:14px}
  .sent{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:12px 0}
  .sent .s-en{font-family:Georgia,"Times New Roman",serif;font-size:15.5px;line-height:1.7;cursor:pointer;color:#3a332b}
  .sent .s-en:hover{color:var(--accent)}
  .sent .s-zh{color:var(--muted);font-size:13.5px;margin:6px 0 10px}
  .sent .s-parts{display:flex;flex-wrap:wrap;gap:6px}
  .spart{display:inline-flex;align-items:center;gap:6px;border-radius:9px;padding:4px 9px;font-size:13px;line-height:1.4}
  .spart .st{font-family:Georgia,serif;font-weight:600}
  .spart .sr{font-size:11px;color:#fff;border-radius:5px;padding:0 5px;white-space:nowrap}
  .spart .sn{font-size:12px;color:var(--muted)}
  .snotes{margin-top:10px;padding-top:8px;border-top:1px dashed var(--line);font-size:13px;color:#5f574c}
  .snotes b{color:var(--accent)}
  /* 句子内括号标注 */
  .s-flow{font-family:Georgia,"Times New Roman",serif;font-size:16px;line-height:2.1;cursor:pointer;color:#3a332b;padding:2px 0}
  .s-flow:hover{color:var(--accent)}
  .brkbox{border-radius:4px;padding:1px 1px;transition:.15s}
  .brk{font-weight:700;font-size:17px;padding:0 1px}
  .say-mini{background:none;border:none;cursor:pointer;font-size:15px;padding:0 4px;vertical-align:middle}
  @media(max-width:680px){.rules{grid-template-columns:1fr}.combo .big{font-size:44px}}
</style>
</head>

<div class="wrap">
  <div class="top">
    <a href="../index.html">← 返回总目录</a>
    <span>六级 · 托福单词记忆系统</span>
  </div>

  <header class="hero" id="hero"></header>

  <div id="passage"></div>

  <div class="toolbar">
    <input class="search" id="q" placeholder="🔎 搜索单词或释义…">
    <div class="filters" id="lvf"></div>
    <div class="filters" id="sgf"></div>
    <select class="f" id="voiceSel" title="选择发音音色（美式女声）"></select>

</div>

s meet in the lobby at nine.", "zh": "我们九点在大堂碰头。", "source": "造句"}, {"en": "the hotel lobby", "zh": "酒店大堂（高频搭配）", "source": "高频搭配"}], "synonyms": [{"w": "foyer", "ipa": "/ˈfɔɪər/", "gloss": "门厅，休息厅", "note": "foyer 偏剧院/公寓入口的小门厅；lobby 是酒店那种宽敞大堂"}, {"w": "hall", "ipa": "/hɔːl/", "gloss": "大厅，走廊", "note": "hall 泛指大厅或走廊；lobby 特指入口处的会客大堂"}], "nuance": "lobby 是进门第一个大空间，前台（reception）通常就设在 lobby 里。"}, {"word": "reception", "levels": ["托福"], "ipa": "/rɪˈsepʃn/", "subgroup": "noun", "meaning": "n. 前台，接待处；接待，招待会", "etymology": "拉丁 recipere「收下、接纳」（re-回 + capere 拿）→ reception「接纳的地方」。同源：receive、receipt、recipe。", "phonetics": "重音在第二音节 /ˈsep/，ti 读 /ʃ/。英式常把「前台」叫 reception，美式更常说 front desk。", "examples": [{"en": "Please leave your key at reception when you go out.", "zh": "外出时请把钥匙留在前台。", "source": "造句"}, {"en": "the reception desk", "zh": "接待台，前台（高频搭配）", "source": "高频搭配"}], "synonyms": [{"w": "front desk", "ipa": "/ˌfrʌnt ˈdesk/", "gloss": "前台", "note": "front desk 是美式说法，和 reception 同指；front desk 更口语"}], "nuance": "reception 既指「前台这个地方」，也指「接待、招待会」；听力里靠上下文判断——酒店语境几乎都是「前台」。"}, {"word": "receptionist", "levels": ["六级"], "ipa": "/rɪˈsepʃənɪst/", "subgroup": "noun", "meaning": "n. 前台接待员", "etymology": "reception + -ist（做某事的人）。词根同 receive「接收」，字面「负责接待来客的人」。", "phonetics": "四音节，重音仍在 /ˈsep/。词尾 -ist 读 /ɪst/。别把重音挪到词尾。", "examples": [{"en": "The receptionist handed me the room key.", "zh": "前台把房卡递给我。", "source": "造句"}, {"en": "ask the receptionist", "zh": "问前台接待员（高频搭配）", "source": "高频搭配"}], "synonyms": [{"w": "clerk", "ipa": "/klɜːrk/", "gloss": "职员，柜台员", "note": "front desk clerk 是美式常见叫法；receptionist 更强调「接待」职能"}, {"w": "concierge", "ipa": "/ˌkɑːnsiˈerʒ/", "gloss": "礼宾员", "note": "concierge 专管订餐订票等增值服务；receptionist 管入住退房基本手续"}], "nuance": "复述酒店对话时，客人的对话对象通常就是 the receptionist 或 the front desk clerk。"}, {"word": "guest", "levels": ["六级"], "ipa": "/ɡest/", "subgroup": "noun", "meaning": "n. 客人，住客", "etymology": "古诺斯语 gestr「客人」，与拉丁 hostis 同源，最初「陌生人/客人」不分。同根还有 host（主人）、hospitality（好客）。", "phonetics": "单音节，元音 /e/ 短促，g 是硬音 /ɡ/。词尾 -st 别吞。", "examples": [{"en": "All guests must check out by noon.", "zh": "所有住客须在中午前退房。", "source": "造句"}, {"en": "a hotel guest", "zh": "酒店住客（高频搭配）", "source": "高频搭配"}], "synonyms": [{"w": "visitor", "ipa": "/ˈvɪzɪtər/", "gloss": "访客，来访者", "note": "visitor 泛指来访的人；guest 特指受招待/付费入住的客人"}, {"w": "patron", "ipa": "/ˈpeɪtrən/", "gloss": "顾客，主顾", "note": "patron 多指餐厅/店铺的老顾客；hotel 里几乎只说 guest"}], "nuance": "酒店住客一律叫 guest，不叫 customer；front desk 常礼貌称 our guests。"}, {"word": "room", "levels": ["托福"], "ipa": "/ruːm/", "subgroup": "noun", "meaning": "n. 房间；空间", "etymology": "古英语 rūm「空间、地方」，与德语 Raum 同源。「房间」义由「围起来的空间」引申而来。所以 room 既是「房间」也是「余地」。", "phonetics": "长元音 /uː/，r 是美式卷舌 r。「有空间」义（make room）和「房间」义同形。", "examples": [{"en": "Do you have any rooms available tonight?", "zh": "今晚还有空房吗？", "source": "造句"}, {"en": "a double / single room", "zh": "双人／单人房（高频搭配）", "source": "高频搭配"}], "synonyms": [{"w": "chamber", "ipa": "/ˈtʃeɪmbər/", "gloss": "房间，室（正式/古旧）", "note": "chamber 偏正式或古语；日常酒店只说 room"}], "core": "room 既指「房间」，也指「空间/余地」（There's no room left）——酒店语境两义都可能出现。", "nuance": "组合词密集：guest room、hotel room、room key、room rate、room service，记住 room 作定语时读法不变。"}, {"word": "suite", "levels": ["托福"], "ipa": "/swiːt/", "subgroup": "noun", "meaning": "n. 套房", "etymology": "法语 suite「跟随、成套」，来自拉丁 sequi「跟随」（同 sequence、pursue）。套房是「一连串相连的房间」，故名 suite。", "phonetics": "读音和 sweet 完全相同 /swiːt/，别按拼写读成「休特」。这是最经典的拼读陷阱。", "examples": [{"en": "We upgraded to a suite with a living room.", "zh": "我们升级到带客厅的套房。", "source": "造句"}, {"en": "a honeymoon / presidential suite", "zh": "蜜月／总统套房（高频搭配）", "source": "高频搭配"}], "synonyms": [{"w": "apartment", "ipa": "/əˈpɑːrtmənt/", "gloss": "公寓套间", "note": "apartment 是居住用的公寓；suite 是酒店里多间相连的高档房型"}], "nuance": "suite（套房，读 /swiːt/）≠ suit（西装，读 /suːt/）；拼写差一个 e，听力里全靠语境和语音区分。"}, {"word": "key", "levels": ["基础"], "ipa": "/kiː/", "subgroup": "noun", "meaning": "n. 钥匙；关键", "etymology": "古英语 cǣg「钥匙」，来源不明。「关键」义是从「开锁的东西」隐喻引申——解决问题的钥匙。", "phonetics": "长元音 /iː/，单音节。现代酒店多用 key card（房卡），但口语仍统称 key。", "examples": [{"en": "Your key doesn't work? Let me reactivate it.", "zh": "您的房卡打不开？我帮您重新激活。", "source": "造句"}, {"en": "room key / key card", "zh": "房间钥匙／房卡（高频搭配）", "source": "高频搭配"}], "synonyms": [{"w": "keycard", "ipa": "/ˈkiːkɑːrd/", "gloss": "房卡", "note": "keycard 特指磁卡/感应卡；key 是通称"}], "nuance": "现代酒店的 key 多是 key card（磁卡房卡）；对话里 key 和 key card 常混用，都指开房门的那张卡。"}, {"word": "reservation", "levels": ["托福"], "ipa": "/ˌrezərˈveɪʃn/", "subgroup": "noun", "meaning": "n. 预订；保留", "etymology": "拉丁 reservare「保留、留下」（re-回 + servare 保存）→ reservation「预留的东西」。同源：conserve、preserve、reserve。", "phonetics": "重音在第三音节 /ˈveɪ/，前面两个音节是弱读的 /ˌrez.ər/。别把重音放前面。", "examples": [{"en": "I have a reservation under the name Smith.", "zh": "我有一个用 Smith 名字订的预订。", "source": "造句"}, {"en": "make / cancel a reservation", "zh": "预订／取消预订（高频搭配）", "source": "高频搭配"}], "synonyms": [{"w": "booking", "ipa": "/ˈbʊkɪŋ/", "gloss": "预订", "note": "booking 是英式更常用；reservation 美式更常用，两者同义"}], "nuance": "reservation 是名词「预订」，动词用 reserve 或 book；开口第一句常是 I have a reservation…。"}, {"word": "deposit", "levels": ["托福"], "ipa": "/dɪˈpɑːzɪt/", "subgroup": "noun", "meaning": "n. 押金，定金；v. 存放", "etymology": "拉丁 deponere「放下、存放」（de-下 + ponere 放）→ deposit「放下来暂存的东西」。同根  position、compose 都含 ponere「放」。", "phonetics": "重音在第二音节 /ˈpɑː/，词首 de- 弱读 /dɪ/。名动同形，读音不变。", "examples": [{"en": "We require a fifty-dollar deposit for incidentals.", "zh": "杂费需交五十美元押金。", "source": "造句"}, {"en": "leave / pay a deposit", "zh": "交押金（高频搭配）", "source": "高频搭配"}], "synonyms": [{"w": "down payment", "ipa": "/ˌdaʊn ˈpeɪmənt/", "gloss": "首付款", "note": "down payment 指买房买车的首付；deposit 是酒店退还型押金"}], "nuance": "酒店 deposit 是「担保押金」，退房无损坏会退还；别理解成买东西的「首付」。"}, {"word": "receipt", "levels": ["六级"], "ipa": "/rɪˈsiːt/", "subgroup": "noun", "meaning": "n. 收据，发票；收到", "etymology": "拉丁 recipere「收到」（re- + capere 拿）→ 收到的凭证。中间那个 p 是后人仿拉丁 receptum 硬加的，不发音。", "phonetics": "p 不发音，读 /rɪˈsiːt/，重音在第二音节。这是著名的哑音陷阱，别读出 p。", "examples": [{"en": "Could I get a receipt for the room charge?", "zh": "能给我一张房费收据吗？", "source": "造句"}, {"en": "keep the receipt", "zh": "保留收据（高频搭配）", "source": "高频搭配"}], "synonyms": [{"w": "invoice", "ipa": "/ˈɪnvɔɪs/", "gloss": "发票，账单", "note": "invoice 是「要你付款」的账单；receipt 是「已付款」的凭证"}], "nuance": "receipt（已付凭证）和 invoice（待付账单）方向相反：先收 invoice，付完拿 receipt。"}, {"word": "invoice", "levels": ["六级"], "ipa": "/ˈɪnvɔɪs/", "subgroup": "noun", "meaning": "n. 发票，账单；v. 开发票", "etymology": "源自法语 envois「寄送的货物清单」（envoyer 寄送的复数），后指随货附的「货款清单」。", "phonetics": "重音在首音节 /ˈɪn/，voi 读 /vɔɪ/。别读成「in-vice」。", "examples": [{"en": "The company will pay the invoice directly.", "zh": "公司会直接付这张账单。", "source": "造句"}, {"en": "issue / settle an invoice", "zh": "开具／结清账单（高频搭配）", "source": "高频搭配"}], "synonyms": [{"w": "bill", "ipa": "/bɪl/", "gloss": "账单", "note": "bill 更口语，酒店退房常说 the bill；invoice 更正式、多用于公司报销"}], "nuance": "invoice 偏正式书面（公司报销要 invoice）；日常退房口语更常说 bill。"}, {"word": "bill", "levels": ["托福"], "ipa": "/bɪl/", "subgroup": "noun", "meaning": "n. 账单；钞票；议案；v. 记账", "etymology": "中世纪拉丁 bulla「盖章的文件」（本义「气泡/印章」）→ 正式单据 → 账单。同源 bulletin（公告）。", "phonetics": "单音节 /bɪl/，短元音。美式「钞票」也叫 bill（a ten-dollar bill）。", "examples": [{"en": "Could you put it on my room bill?", "zh": "能记到我的房费账单上吗？", "source": "造句"}, {"en": "settle / split the bill", "zh": "结账／分摊账单（高频搭配）", "source": "高频搭配"}], "synonyms": [{"w": "tab", "ipa": "/tæb/", "gloss": "（餐饮/酒店的）账单", "note": "tab 特指「先记账后结」的挂账；bill 是通称"}, {"w": "check", "ipa": "/tʃek/", "gloss": "（餐厅的）账单", "note": "美式餐厅要账单说 the check；酒店房费常说 bill"}], "core": "bill 一词多义：账单、钞票、议案——酒店语境几乎都是「账单」。", "nuance": "put it on my bill = 记到我账上，退房一起结；是酒店最高频的付款短语之一。"}, {"word": "luggage", "levels": ["六级"], "ipa": "/ˈlʌɡɪdʒ/", "subgroup": "noun", "meaning": "n. 行李（总称）", "etymology": "lug「用力拖拽」+ -age（集合名词后缀）→ 「拖着走的一堆东西」。所以 luggage 是「需要拖的行李」。", "phonetics": "重音在首 /ˈlʌ/，结尾 -age 弱读 /ɪdʒ/。是不可数名词，没有复数 luggages。", "examples": [{"en": "Can I leave my luggage here until check-in?", "zh": "入住前我能把行李寄存这儿吗？", "source": "造句"}, {"en": "luggage storage", oor；复述楼层数字时要留意。"}, {"word": "corridor", "levels": ["六级"], "ipa": "/ˈkɔːrɪdɔːr/", "subgroup": "noun", "meaning": "n. 走廊，通道", "etymology": "意大利 corridore「奔跑的地方」，来自 correre「跑」（同 current、course）→ 供人快速通行的长通道。", "phonetics": "重音在首音节 /ˈkɔː/，三音节，词尾 -dor 弱读。别读成「co-RI-dor」。", "examples": [{"en": "The ice machine is at the end of the corridor.", "zh": "制冰机在走廊尽头。", "source": "造句"}, {"en": "down the corridor", "zh": "沿走廊走（高频搭配）", "source": "高频搭配"}], "synonyms": [{"w": "hallway", "ipa": "/ˈhɔːlweɪ/", "gloss": "走廊，过道", "note": "hallway 美式更常用；corridor 英式更常用，两者同指楼内长走道"}], "nuance": "corridor（英式偏多）与 hallway（美式偏多）同义，都是连接各房间的室内长通道。"}, {"word": "amenity", "levels": ["托福"], "ipa": "/əˈmenəti/", "subgroup": "noun", "meaning": "n.（酒店的）便利设施，配套服务", "etymology": "拉丁 amoenus「宜人的、令人愉快的」→ amenity「使人舒适的东西」。复数 amenities 指泳池、健身房、免费早餐等配套。", "phonetics": "重音在第二音节 /ˈme/，美音也读 /əˈmiːnəti/。常用复数 amenities。", "examples": [{"en": "The hotel offers amenities like a gym and free breakfast.", "zh": "酒店提供健身房、免费早餐等配套设施。", "source": "造句"}, {"en": "hotel amenities", "zh": "酒店配套设施（高频搭配）", "source": "高频搭配"}], "synonyms": [{"w": "facility", "ipa": "/fəˈsɪləti/", "gloss": "设施", "note": "facility 偏硬件（泳池、停车场）；amenity 更强调「让客人舒适的贴心配套」，含牙刷洗漱包等小物"}], "nuance": "amenities 常同时含大设施（gym、pool）和小赠品（洗漱包、瓶装水）；facilities 更偏大型硬件设施。"}, {"word": "facility", "levels": ["托福"], "ipa": "/fəˈsɪləti/", "subgroup": "noun", "meaning": "n. 设施，设备（常用复数 facilities）", "etymology": "拉丁 facilis「容易的」（facere 做）→ facility「使事情变容易的东西」→ 设施。同根 facile、faculty。", "phonetics": "重音在第二音节 /ˈsɪl/，四音节。常用复数 facilities /fəˈsɪlətiz/。", "examples": [{"en": "The fitness facilities are open around the clock.", "zh": "健身设施二十四小时开放。", "source": "造句"}, {"en": "leisure / parking facilities", "zh": "休闲／停车设施（高频搭配）", "source": "高频搭配"}], "synonyms": [{"w": "amenity", "ipa": "/əˈmenəti/", "gloss": "便利设施", "note": "见 amenity 词条：facility 偏大型硬件，amenity 偏贴心配套"}], "nuance": "facilities 强调可使用的硬件设施；单数 facility 有时也指「一处场所/机构」。"}, {"word": "vacancy", "levels": ["托福"], "ipa": "/ˈveɪkənsi/",  "Is breakfast included in the room rate?", "zh": "房费含早餐吗？", "source": "造句"}, {"en": "complimentary breakfast", "zh": "免费早餐（高频搭配）", "source": "高频搭配"}], "synonyms": [{"w": "buffet", "ipa": "/bəˈfeɪ/", "gloss": "自助餐", "note": "buffet 是取餐形式（自助）；breakfast 是餐次，酒店常是 breakfast buffet"}], "nuance": "酒店对话高频问 Is breakfast included?（含早餐吗）；included / complimentary 都表示「已包含、免费」。"}, {"word": "bellhop", "levels": ["六级"], "ipa": "/ˈbelhɑːp/", "subgroup": "noun", "meaning": "n. 行李员，门童（美式）", "etymology": "bell（铃）+ hop（蹦跳）→ 「铃一响就蹦着去干活的人」，形象地指听召唤搬行李、跑腿的服务生。", "phonetics": "重音在首 /ˈbel/。美式 bellhop / bellboy，英式常说 porter。", "examples": [{"en": "The bellhop carried our bags to the room.", "zh": "行李员把我们的包提到了房间。", "source": "造句"}, {"en": "tip the bellhop", "zh": "给行李员小费（高频搭配）", "source": "高频搭配"}], "synonyms": [{"w": "porter", "ipa": "/ˈpɔːrtər/", "gloss": "行李搬运工", "note": "porter 英式常用（也用于机场/车站）；bellhop 美式酒店专指搬行李门童"}], "nuance": "bellhop / bellboy（美）= porter（英，广义），都是帮客人搬行李的服务生。"}, {"word": "concierge", "levels": ["六级"], "ipa": "/ˌkɑːnsiˈerʒ/", "subgroup": "noun", "meaning": "n. 礼宾员，门房", "etymology": "法语 concierge「看门人、管家」，源头不明（一说来自拉丁 conservus「同仆」）。现指高档酒店负责订票、订餐、导览的服务岗。", "phonetics": "法语外来词，词尾 -ge 读 /ʒ/（像 measure 的 s），重音在末音节 /ˈerʒ/。别按英语拼读。", "examples": [{"en": "Ask the concierge to book a taxi for you.", "zh": "让礼宾员帮您叫辆出租车。", "source": "造句"}, {"en": "the hotel concierge", "zh": "酒店礼宾员（高频搭配）", "source": "高频搭配"}], "synonyms": [{"w": "receptionist", "ipa": "/rɪˈsepʃənɪst/", "gloss": "前台接待", "note": "receptionist 管入住退房；concierge 管订票订餐、旅游咨询等增值服务"}], "nuance": "concierge 专门处理「额外请求」——订餐、订票、推荐景点；基础入住退房归 front desk。"}, {"word": "rate", "levels": ["托福"], "ipa": "/reɪt/", "subgroup": "noun", "meaning": "n. 价格，费率；速度；v. 评价", "etymology": "拉丁 rata「按比例算定的」（reri「计算」）→ rate「按比例算出的价/率」。同根 ratio、ration。", "phonetics": "单音节 /reɪt/，双元音。酒店语境 rate = 房价（room rate、nightly rate）。", "examples": [{"en": "What's your best rate for a double room?", "zh": "双人房最优惠的房价是多少？", "source": "造句"}, {"en": "room rate / nightly rate", erve 词条：book 口语，reserve 正式，常互换"}], "core": "book 既是名词「书」，也是最高频的动词「预订」——酒店语境全是「预订」义。", "nuance": "fully booked = 订满/客满，是酒店常用表达；别和名词「书」混，靠语境判断。"}, {"word": "check in", "levels": ["六级"], "ipa": "/ˌtʃek ˈɪn/", "subgroup": "verb", "meaning": "v. 办理入住；登记", "etymology": "check「核对、登记」+ in「进入」→ 「登记进入、办入住」。同一逻辑也用于机场值机（check in for a flight）。", "phonetics": "动词短语重音落在 in /ˌtʃek ˈɪn/；名词 check-in 重音在前。两者靠重音和拼写区分。", "examples": [{"en": "We can't check in until three o'clock.", "zh": "我们三点才能办理入住。", "source": "造句"}, {"en": "check in at the front desk", "zh": "在前台办入住（高频搭配）", "source": "高频搭配"}], "synonyms": [{"w": "register", "ipa": "/ˈredʒɪstər/", "gloss": "登记", "note": "register 强调「填写登记信息」；check in 指完整的入住办理"}], "nuance": "check in（动词）分写；名词 check-in（入住手续/时间）连字符连写，重音也从 in 移到 check。"}, {"word": "check out", "levels": ["六级"], "ipa": "/ˌtʃek ˈaʊt/", "subgroup": "verb", "meaning": "v. 办理退房；结账离店", "etymology": "check「核对结算」+ out「出去」→ 「结完账离店」。图书馆里同一短语指「借出」，语境不同。", "phonetics": "动词短语重音落在 out /ˌtʃek ˈaʊt/；名词 checkout 重音在 check。", "examples": [{"en": "You need to check out before noon.", "zh": "您需要在中午前退房。", "source": "造句"}, {"en": "check out early / late", "zh": "提前／延迟退房（高频搭配）", "source": "高频搭配"}], "synonyms": [{"w": "depart", "ipa": "/dɪˈpɑːrt/", "gloss": "离开，离店", "note": "depart 只是「离开」这个动作；check out 含「结账 + 交钥匙」的完整手续"}], "nuance": "酒店 check out = 结账退房；图书馆 check out = 借书出馆——同一短语，场景决定含义。"}, {"word": "confirm", "levels": ["托福"], "ipa": "/kənˈfɜːrm/", "subgroup": "verb", "meaning": "v. 确认，证实", "etymology": "拉丁 confirmare「使坚定」（con-加强 + firmus 坚固，同 firm）→ 「把某事坐实、确认」。", "phonetics": "重音在第二音节 /ˈfɜːrm/，词首 con- 弱读 /kən/。名词是 confirmation。", "examples": [{"en": "Let me confirm your reservation for two nights.", "zh": "我确认一下您两晚的预订。", "source": "造句"}, {"en": "confirm a booking", "zh": "确认预订（高频搭配）", "source": "高频搭配"}], "synonyms": [{"w": "verify", "ipa": "/ˈverɪfaɪ/", "gloss": "核实，查验", "note": "verify 强调「查证真伪」；confirm 强调「敲定、给出确认」"}], "nuance": "前台常说 confirm your reservation（确认您的预订），确认后会给 confirmation number（ ister", "levels": ["托福"], "ipa": "/ˈredʒɪstər/", "subgroup": "verb", "meaning": "v. 登记，注册；n. 登记簿", "etymology": "拉丁 regesta「记录下来的东西」（re-回 + gerere 携带/记载）→ 「登记名录」。同根 gesture、digest。", "phonetics": "重音在首 /ˈre/，三音节，中间 -gis- 读 /dʒɪs/。名词 registration。", "examples": [{"en": "Please register your details at the front desk.", "zh": "请在前台登记您的信息。", "source": "造句"}, {"en": "register a guest", "zh": "登记住客（高频搭配）", "source": "高频搭配"}], "synonyms": [{"w": "sign in", "ipa": "/ˌsaɪn ˈɪn/", "gloss": "签到，登记进入", "note": "sign in 是口语的「签名登记」；register 更正式，指填写完整登记信息"}], "nuance": "入住时前台会让你 register（登记），填 registration form（登记表）；比口语 sign in 更正式。"}, {"word": "accommodate", "levels": ["托福"], "ipa": "/əˈkɑːmədeɪt/", "subgroup": "verb", "meaning": "v. 容纳，提供住宿；迁就", "etymology": "拉丁 accommodare「使适合」（ad-向 + commodus 合适的）→ 「安排得合适、提供住处」。同根 commodity、commode。", "phonetics": "重音在第二音节 /ˈkɑː/，四音节。拼写陷阱：双 c、双 m（ac-com-mo-date）。", "examples": [{"en": "The suite can accommodate up to four guests.", "zh": "这套房最多可住四位客人。", "source": "造句"}, {"en": "accommodate a request", "zh": "满足某项请求（高频搭配）", "source": "高频搭配"}], "synonyms": [{"w": "house", "ipa": "/haʊz/", "gloss": "（动词）容纳，为…提供住所", "note": "house 作动词读浊音 /haʊz/，指「容纳/收留」；accommodate 更正式，还含「迁就满足需求」义"}], "nuance": "accommodate 双关：既指「房间能住下几人」，也指「前台尽量满足客人特殊要求」（accommodate your request）。"}, {"word": "arrange", "levels": ["托福"], "ipa": "/əˈreɪndʒ/", "subgroup": "verb", "meaning": "v. 安排，筹备", "etymology": "法语 arangier「排成一行」（a- + rang 行列，同 range、rank）→ 「把事情排布妥当、安排」。", "phonetics": "重音在第二音节 /ˈreɪndʒ/，词尾 -ge 读 /dʒ/。名词 arrangement。", "examples": [{"en": "We can arrange an airport shuttle for you.", "zh": "我们可以为您安排机场接送。", "source": "造句"}, {"en": "arrange transport / a taxi", "zh": "安排交通／叫车（高频搭配）", "source": "高频搭配"}], "synonyms": [{"w": "organize", "ipa": "/ˈɔːrɡənaɪz/", "gloss": "组织，筹办", "note": "organize 强调「把多件事系统组织起来」；arrange 强调「为某人妥善安排一件事」"}], "nuance": "前台常说 We can arrange…（我们可以为您安排…），接 shuttle、taxi、wake-up call 等服务。"}, {"word": "provide", "levels": ["托福"], "ipa": "/prəˈv ote": "debit card 直接扣存款；credit card 是先透支后还，入住预授权多用 credit card"}], "nuance": "入住常要 credit card 做预授权担保（hold a deposit）；退房无损坏会解冻。"}, {"word": "passport", "levels": ["基础"], "ipa": "/ˈpæspɔːrt/", "subgroup": "general", "meaning": "n. 护照", "etymology": "法语 passeport「通过港口的许可」（passer 通过 + port 港口）→ 出入境证件。同源 port、portal。", "phonetics": "重音在首 /ˈpæs/，第二音节 -port 读 /pɔːrt/。入住登记常要出示。", "examples": [{"en": "May I see your passport, please?", "zh": "能出示一下您的护照吗？", "source": "造句"}, {"en": "show your passport", "zh": "出示护照（高频搭配）", "source": "高频搭配"}], "synonyms": [{"w": "ID", "ipa": "/ˌaɪ ˈdiː/", "gloss": "身份证件", "note": "ID 泛指任何身份证明；passport 特指护照，国际酒店入住常要 passport"}], "nuance": "国际酒店入住登记常要 passport 或 photo ID（带照片证件）核对身份。"}, {"word": "form", "levels": ["托福"], "ipa": "/fɔːrm/", "subgroup": "general", "meaning": "n. 表格；形式；v. 形成", "etymology": "拉丁 forma「形状、模型」→ form「按固定格式的表」。同源 format、formal、uniform。", "phonetics": "单音节 /fɔːrm/。registration form = 登记表。fill out a form。", "examples": [{"en": "Please sign at the bottom of the form.", "zh": "请在表格底部签名。", "source": "造句"}, {"en": "a registration form", "zh": "登记表（高频搭配）", "source": "高频搭配"}], "synonyms": [{"w": "document", "ipa": "/ˈdɑːkjumənt/", "gloss": "文件", "note": "document 泛指任何文件；form 特指「有空格待填的表格」"}], "nuance": "入住的 registration form（登记表）要 fill out（填）并 sign（签名）；form 在此是「表格」义。"}, {"word": "sign", "levels": ["托福"], "ipa": "/saɪn/", "subgroup": "general", "meaning": "v. 签名；n. 标志，招牌", "etymology": "拉丁 signum「记号、标记」→ sign。「签名」义即「留下自己的标记」。同源 signal、signature、design。", "phonetics": "单音节 /saɪn/，g 不发音（哑音）。别把 g 读出来。名词 signature（签名）。", "examples": [{"en": "Could you sign here to confirm?", "zh": "能在这里签名确认吗？", "source": "造句"}, {"en": "sign the form / register", "zh": "在表上／登记簿签名（高频搭配）", "source": "高频搭配"}], "synonyms": [{"w": "signature", "ipa": "/ˈsɪɡnətʃər/", "gloss": "签名（名词）", "note": "signature 是名词「签名」（注意此处 g 要发音）；sign 是动词「签」，g 不发音"}], "core": "sign 一词多用：动词「签名」、名词「招牌/标志」——酒店里既签字也看招牌。", "nuance": "动词 sign（签名）里 g 不发音；名词 signature（签名）里 g 要发音——同族词读法不同。"}, {"word": "towel", "levels": ["六级"], "ipa": "/ˈtaʊəl/", "subgroup": "general", "meaning": "n. 毛巾，浴巾", "etymology": "法语 toaille「毛巾」，源自日耳曼语 thwahlijo「洗擦用布」。同源德语 Zwehle。", "phonetics": "重音在首 /ˈtaʊ/，两音节 /ˈtaʊ.əl/，别读成一音节。缺毛巾找 housekeeping。", "examples": [{"en": "Could we get some extra towels?", "zh": "能再给我们几条毛巾吗？", "source": "造句"}, {"en": "fresh / extra towels", "zh": "干净的／额外的毛巾（高频搭配）", "source": "高频搭配"}], "synonyms": [{"w": "linen", "ipa": "/ˈlɪnɪn/", "gloss": "床上/浴室织品（总称）", "note": "linen 是床单、枕套、毛巾等布草总称；towel 特指毛巾"}], "nuance": "缺毛巾、要加毛巾找 housekeeping；towel、sheet、pillowcase 都属 linen（布草）。"}, {"word": "pillow", "levels": ["托福"], "ipa": "/ˈpɪloʊ/", "subgroup": "general", "meaning": "n. 枕头", "etymology": "拉丁 pulvinus「垫子、枕」经古英语 pyle → pillow。", "phonetics": "重音在首 /ˈpɪ/，词尾 -ow 读 /oʊ/，别读成 /aʊ/。", "examples": [{"en": "Could I have an extra pillow?", "zh": "能再给我一个枕头吗？", "source": "造句"}, {"en": "an extra pillow / blanket", "zh": "额外的枕头／毯子（高频搭配）", "source": "高频搭配"}], "synonyms": [{"w": "cushion", "ipa": "/ˈkʊʃn/", "gloss": "靠垫，坐垫", "note": "cushion 是沙发/椅子的靠垫坐垫；pillow 专指睡觉用的枕头"}], "nuance": "客房常见请求 an extra pillow / blanket（加枕头/毯子）；pillow 睡觉用，cushion 是靠垫。"}, {"word": "blanket", "levels": ["托福"], "ipa": "/ˈblæŋkɪt/", "subgroup": "general", "meaning": "n. 毯子，毛毯", "etymology": "法语 blanchet「白色羊毛布」（blanc 白色）→ blanket。最初是白色的羊毛盖布，故得名。", "phonetics": "重音在首 /ˈblæŋ/，n 在 k 前读 /ŋ/。词尾 -et 弱读 /ɪt/。", "examples": [{"en": "The room was cold, so we asked for a blanket.", "zh": "房间冷，我们要了条毯子。", "source": "造句"}, {"en": "an extra blanket", "zh": "额外的毯子（高频搭配）", "source": "高频搭配"}], "synonyms": [{"w": "duvet", "ipa": "/duːˈveɪ/", "gloss": "羽绒被", "note": "duvet 是带被套的厚羽绒被；blanket 是较薄的盖毯，两者厚度不同"}], "nuance": "嫌冷加盖找 housekeeping 要 an extra blanket（毯子）；duvet 则是更厚的羽绒被。"}, {"word": "shower", "levels": ["托福"], "ipa": "/ˈʃaʊər/", "subgroup": "general", "meaning": "n. 淋浴；阵雨；v. 淋浴", "etymology": "古英语 scūr「阵雨、暴风雨」→ shower。「淋浴」义由「像下雨一样从上洒水」引申。", "phonetics": "重音在首 /ˈʃaʊ/，两音节 /ˈʃaʊ.ər/。sh 读 /ʃ/。别读成一音节。", "examples": [{"en": "The shower in my room isn't working.", "zh": "我房间的淋浴坏了。", "source": "造句"}, {"en": "take a shower", "zh": "洗淋浴（高频搭配）", "source": "高频搭配"}], "synonyms": [{"w": "bathtub", "ipa": "/ˈbæθtʌb/", "gloss": "浴缸", "note": "bathtub 是泡澡的缸；shower 是站着淋的淋浴，房型常注明有哪种"}], "nuance": "投诉高频：the shower isn't working（淋浴坏了）；shower（淋浴）↔ bathtub（浴缸）。"}, {"word": "air conditioning", "levels": ["六级"], "ipa": "/ˈer kənˌdɪʃənɪŋ/", "subgroup": "general", "meaning": "phr. 空调；空气调节", "etymology": "air（空气）+ conditioning（调节，condition 使处于某状态）→ 「调节空气温湿度」。缩写 AC / A/C。", "phonetics": "主重音在 air /ˈer/。conditioning 弱读。缩写读作 /ˌeɪ ˈsiː/（AC）。", "examples": [{"en": "The air conditioning isn't cooling the room.", "zh": "空调制冷不行。", "source": "造句"}, {"en": "turn on the air conditioning", "zh": "开空调（高频搭配）", "source": "高频搭配"}], "synonyms": [{"w": "heating", "ipa": "/ˈhiːtɪŋ/", "gloss": "暖气，供暖", "note": "heating 是制热；air conditioning 通常指制冷（也可含制热），投诉时说清哪个"}], "nuance": "投诉设备高频 the air conditioning / heating isn't working（空调/暖气坏了）；缩写 AC。"}, {"word": "parking", "levels": ["托福"], "ipa": "/ˈpɑːrkɪŋ/", "subgroup": "general", "meaning": "n. 停车；停车场", "etymology": "park（停放，源自「围起的场地」）+ -ing → parking「停车（的地方）」。", "phonetics": "重音在首 /ˈpɑːr/。free parking（免费停车）是常见卖点。", "examples": [{"en": "Is parking free for guests?", "zh": "住客停车免费吗？", "source": "造句"}, {"en": "free / valet parking", "zh": "免费停车／代客泊车（高频搭配）", "source": "高频搭配"}], "synonyms": [{"w": "garage", "ipa": "/ɡəˈrɑːʒ/", "gloss": "车库", "note": "garage 是有顶的停车楼/库；parking 泛指停车（场），含露天车位"}], "nuance": "订房常问的配套：free parking（免费停车）、valet parking（代客泊车，另收费）。"}, {"word": "shuttle", "levels": ["托福"], "ipa": "/ˈʃʌtl/", "subgroup": "general", "meaning": "n. 班车，接驳车", "etymology": "古英语 scytel「射出的箭/梭子」→ 织布梭来回穿梭 → shuttle「往返穿梭的车」。同源 shoot。", "phonetics": "重音在首 /ˈʃʌ/，双写 t 让元音读短，词尾 -tle 读 /tl/。", "examples": [{"en": "Does the hotel offer an airport shuttle?", "zh": "酒店提供机场班车吗？", "source": "造句"}, {"en": "airport shuttle", "zh": "机场班车（高频搭配）", "source": "高频搭配"}], "synonyms": [{"w": "transfer", "ipa": "/ˈtrænsfɜːr/", "gloss": "（机场）接送", "note": "transfer 指点到点的接送（常预约）；shuttle 是按班次往返的接驳车"}], "nuance": "问接送高频 airport shuttle（机场班车，常免费按班次）；私人接送叫 transfer。"}, {"word": "lounge", "levels": ["托福"], "ipa": "/laʊndʒ/", "subgroup": "noun", "meaning": "n. 休息厅，贵宾厅；v. 懒散地靠坐", "etymology": "词源不确定，一说与 lungis「懒汉」有关。「休息厅」义指「供人悠闲靠坐的厅」。", "phonetics": "单音节 /laʊndʒ/，ou 读 /aʊ/，词尾 -ge 读 /dʒ/。别读成 /lɔːndʒ/。", "examples": [{"en": "You can wait in the lounge on the second floor.", "zh": "您可以在二楼的休息厅等。", "source": "造句"}, {"en": "the executive lounge", "zh": "行政酒廊（高频搭配）", "source": "高频搭配"}], "synonyms": [{"w": "lobby", "ipa": "/ˈlɑːbi/", "gloss": "大堂", "note": "lobby 是进门大堂；lounge 是供人休息落座的厅，常更私密舒适"}], "nuance": "executive/VIP lounge（行政/贵宾酒廊）是高级房客专享；lobby 是所有人进出的大堂。"}, {"word": "porter", "levels": ["六级"], "ipa": "/ˈpɔːrtər/", "subgroup": "noun", "meaning": "n. 行李搬运工，门房", "etymology": "拉丁 portare「搬运」（同 port、transport、import）→ porter「搬运东西的人」。另一 porter 义「门房」来自 porta「门」。", "phonetics": "重音在首 /ˈpɔːr/，词尾 -ter 弱读 /tər/。英式酒店/车站常用。", "examples": [{"en": "The porter will take your bags to the room.", "zh": "行李员会把您的包送到房间。", "source": "造句"}, {"en": "call a porter", "zh": "叫行李员（高频搭配）", "source": "高频搭配"}], "synonyms": [{"w": "bellhop", "ipa": "/ˈbelhɑːp/", "gloss": "行李员（美式）", "note": "bellhop 美式酒店专用；porter 英式且通用于机场、车站、酒店"}], "nuance": "porter（英/通用）与 bellhop（美式酒店）都是搬行李的人；porter 使用范围更广。"}, {"word": "linen", "levels": ["托福"], "ipa": "/ˈlɪnɪn/", "subgroup": "noun", "meaning": "n. 布草（床单、毛巾等）；亚麻布", "etymology": "拉丁 linum「亚麻」→ linen「亚麻织物」。因早年床品多用亚麻，引申指酒店的「床上/浴室布草」。同源 line（本义亚麻绳）。", "phonetics": "重音在首 /ˈlɪ/，两个 n 之间元音弱读 /ɪ/。作「布草」义时不可数。", "examples": [{"en": "Housekeeping changes the linen every day.", "zh": "客房部每天更换布草。", "source": "造句"}, {"en": "fresh linen", "zh": "干净的布草（高频搭配）", "source": "高频搭配"}], "synonyms": [{"w": "sheets", "ipa": "/ʃiːts/", "gloss": "床单", "note": "sheets 特指床单；linen 是床单、枕套、毛巾等布草的总称"}], "nuance": "linen 是布草总称（床单+枕套+毛巾）；换床单说 change the linen 或 change the sheets。"}, {"word": "laundry", "levels": ["托福"], "ipa": "/ˈlɔːndri/", "subgroup": "noun", "meaning": "n. 洗衣服务；待洗/已洗的衣物", "etymology": "拉丁 lavanda「要洗的东西」（lavare 洗，同 lavatory、lava）→ laundry。字面「要洗的衣物/洗衣处」。", "phonetics": "重音在首 /ˈlɔːn/，au 读 /ɔː/。laundry service = 洗衣服务。", "examples": [{"en": "Does the hotel offer a laundry service?", "zh": "酒店提供洗衣服务吗？", "source": "造句"}, {"en": "laundry service", "zh": "洗衣服务（高频搭配）", "source": "高频搭配"}], "synonyms": [{"w": "dry cleaning", "ipa": "/ˌdraɪ ˈkliːnɪŋ/", "gloss": "干洗", "note": "dry cleaning 是用溶剂的干洗；laundry 是常规水洗，酒店两种服务常并列"}], "nuance": "laundry service（水洗）与 dry cleaning（干洗）是酒店两类洗衣服务，价目常分开列。"}, {"word": "balcony", "levels": ["托福"], "ipa": "/ˈbælkəni/", "subgroup": "noun", "meaning": "n. 阳台", "etymology": "意大利 balcone「大窗、露台」，源自日耳曼 balko「梁」→ 「用梁挑出的平台」。", "phonetics": "重音在首 /ˈbæl/，三音节，词尾 -ny 弱读 /ni/。别把重音放中间。", "examples": [{"en": "The room has a private balcony with a sea view.", "zh": "房间带一个可看海的私人阳台。", "source": "造句"}, {"en": "a room with a balcony", "zh": "带阳台的房间（高频搭配）", "source": "高频搭配"}], "synonyms": [{"w": "terrace", "ipa": "/ˈterəs/", "gloss": "露台，平台", "note": "terrace 多在底层/屋顶、面积更大；balcony 是楼层外挑的小阳台"}], "nuance": "balcony（楼层外挑的小阳台）vs terrace（较大的露台/平台）；订房卖点常提 private balcony。"}, {"word": "buffet", "levels": ["托福"], "ipa": "/bəˈfeɪ/", "subgroup": "noun", "meaning": "n. 自助餐", "etymology": "法语 buffet「餐具柜、摆菜的长桌」→ 「摆开随取的自助餐」。是外来词，词尾 t 不发音。", "phonetics": "法语外来词，重音在后 /bəˈfeɪ/，词尾 t 不发音。别读成「巴菲特」。", "examples": [{"en": "Breakfast is served as a buffet from seven to ten.", "zh": "早餐是自助形式，七点到十点供应。", "source": "造句"}, {"en": "a breakfast buffet", "zh": "自助早餐（高频搭配）", "source": "高频搭配"}], "synonyms": [{"w": "à la carte", "ipa": "/ˌɑː lɑː ˈkɑːrt/", "gloss": "单点（按菜单点）", "note": "à la carte 是照菜单一道道点；buffet 是付一个价随便取"}], "nuance": "buffet（自助餐，t 不发音）↔ à la carte（单点）；酒店早餐多为 breakfast buffet。"}, {"word": "surcharge", "levels": ["六级"], "ipa": "/ˈsɜːrtʃɑːrdʒ/", "subgroup": "noun", "meaning": "n. 附加费，额外收费", "etymology": "sur-（在…之上，拉丁 super）+ charge（收费）→ 「在原价之上再加的费用」。", "phonetics": "重音在首 /ˈsɜːr/。构词与 charge 同族，指「额外加收」。", "examples": [{"en": "There's a surcharge for using the safe.", "zh": "使用保险箱要加收一笔费用。", "source": "造句"}, {"en": "a weekend surcharge", "zh": "周末附加费（高频搭配）", "source": "高频搭配"}], "synonyms": [{"w": "extra charge", "ipa": "/ˌekstrə ˈtʃɑːrdʒ/", "gloss": "额外费用", "note": "extra charge 是通俗说法；surcharge 更正式，特指「在标价上外加」的费用"}], "nuance": "surcharge 强调「在原价基础上外加」（周末/旺季/服务附加费）；比 extra charge 更书面。"}, {"word": "under the name of", "levels": ["基础"], "ipa": "/ˌʌndər ðə ˈneɪm əv/", "subgroup": "phrase", "meaning": "phr. 以…的名字（登记/预订）", "etymology": "under（在…名下）+ the name of（…的名字）→ 「登记在某人名下」。报预订时的固定说法。", "phonetics": "主重音在 name /ˈneɪm/。under the name of Smith = 用 Smith 的名字。", "examples": [{"en": "I have a booking under the name of Chen.", "zh": "我有一个用 Chen 名字订的预订。", "source": "造句"}, {"en": "under the name (of) …", "zh": "以…的名字（高频搭配）", "source": "高频搭配"}], "synonyms": [{"w": "in the name of", "ipa": "/ɪn ðə ˈneɪm əv/", "gloss": "以…的名义/名字", "note": "in the name of 更正式（也含「以…名义」）；under the name of 报预订时更常用"}], "nuance": "报预订高频 a reservation under the name of …（用…的名字订的）；前台据此调单。"}, {"word": "credit card authorization", "levels": ["六级"], "ipa": "/ˈkredɪt kɑːrd ˌɔːθərəˈzeɪʃn/", "subgroup": "phrase", "meaning": "phr. 信用卡预授权", "etymology": "credit card（信用卡）+ authorization（授权，author「使有权」）→ 「冻结一笔额度作担保」，退房无损即解冻。", "phonetics": "authorization 重音在 /ˈzeɪ/，五音节。也说 pre-authorization。", "examples": [{"en": "We'll place a credit card authorization for incidentals.", "zh": "我们会对信用卡做一笔杂费预授权。", "source": "造句"}, {"en": "a credit card authorization / hold", "zh": "信用卡预授权／冻结（高频搭配）", "source": "高频搭配"}], "synonyms": [{"w": "hold", "ipa": "/hoʊld/", "gloss": "（金额）冻结", "note": "hold 是口语「冻结一笔钱」（put a hold on your card）；authorization 是正式术语"}], "nuance": "入住常做 credit card authorization（预授权/冻结额度）作担保；退房无损坏自动解冻。"}, {"word": "on the house", "levels": ["六级"], "ipa": "/ˌɑːn ðə ˈhaʊs/", "subgroup": "phrase", "meaning": "phr.（酒店/餐厅）免费赠送的", "etymology": "house 指「店家」→ on the house「由店家买单」→ 「免费招待」。", "phonetics": "主重音在 house /ˈhaʊs/（清音 /s/）。习语，整块记。", "examples": [{"en": "The welcome drink is on the house.", "zh": "这杯迎宾饮料是免费赠送的。", "source": "造句"}, {"en": "This one's on the house.", "zh": "这个算我们请客（习语）", "source": "高频搭配"}], "synonyms": [{"w": "complimentary", "ipa": "/ˌkɑːmplɪˈmentri/", "gloss": "免费赠送的", "note": "complimentary 是正式书面词；on the house 是口语习语，都指「店家免费送」"}], "nuance": "on the house = 店家请客、免费赠送（口语）；正式书面用 complimentary。"}, {"word": "check the reservation", "levels": ["基础"], "ipa": "/ˌtʃek ðə ˌrezərˈveɪʃn/", "subgroup": "phrase", "meaning": "phr. 核对预订", "etymology": "check（核对）+ the reservation（预订）→ 前台按姓名/确认号「核对订单」。", "phonetics": "reservation 重音在 /ˈveɪ/。整句主重音落在 check 和 -va-。", "examples": [{"en": "Let me check the reservation under your name.", "zh": "我核对一下用您名字的预订。", "source": "造句"}, {"en": "check the reservation details", "zh": "核对预订详情（高频搭配）", "source": "高频搭配"}], "synonyms": [{"w": "look up the booking", "ipa": "/ˌlʊk ʌp ðə ˈbʊkɪŋ/", "gloss": "查预订", "note": "两者同义，都指前台在系统里调出并核对订单"}], "nuance": "入住时前台常说 Let me check the reservation（核对一下预订），按姓名或确认号找单。"}, {"word": "occupy", "levels": ["托福"], "ipa": "/ˈɑːkjupaɪ/", "subgroup": "verb", "meaning": "v. 占用，入住（房间）", "etymology": "拉丁 occupare「占取」（ob-朝 + capere 拿）→ occupy。同族 occupied、occupation、capture。", "phonetics": "重音在首 /ˈɑː/，四音节，词尾 -py 读 /paɪ/。", "examples": [{"en": "The room is currently occupied by another guest.", "zh": "这间房目前有另一位客人住着。", "source": "造句"}, {"en": "occupy a room", "zh": "占用/入住房间（高频搭配）", "source": "高频搭配"}], "synonyms": [{"w": "vacate", "ipa": "/ˈveɪkeɪt/", "gloss": "腾空，退房", "note": "occupy（占用/入住）↔ vacate（腾空/退房），一对反义动作"}], "antonyms": ["vacate"], "nuance": "occupy（占用/入住）↔ vacate（腾空/退房）；形容词 occupied（有人）↔ vacant（无人）。"}, {"word": "switch", "levels": ["托福"], "ipa": "/swɪtʃ/", "subgroup": "verb", "meaning": "v. 更换，调换；n. 开关", "etymology": "本义「细树枝」（可抽打）→ 「快速拨动」→ 「切换、调换」。同源低地德语 swutsche。", "phonetics": "单音节 /swɪtʃ/，sw 连读，词尾 -tch 读 /tʃ/。switch rooms = 换房。", "examples": [{"en": "Could we switch to a quieter room?", "zh" <script>
const G = JSON.parse(document.getElementById('data').textContent);
const KEY = 'vocab-unfam-' + G.id;
let unfam = new Set(JSON.parse(localStorage.getItem(KEY) || '[]'));
let curLv = '全部', curSg = '全部', curQ = '', onlyUnfam = false;

const LVCLASS = {'六级':'lv6','托福':'tfl','GRE拓展':'gre','基础':''};
// 发音分组配色（按 subgroups 顺序循环取用）
const SGCOLORS = ['#2f8f83','#b0603f','#6a52a8','#c1662f','#3a7bd5'];
const SUBG = G.subgroups || [];
function sgIndex(key){ const i=SUBG.findIndex(s=>s.key===key); return i<0?0:i; }
function sgColor(key){ return SGCOLORS[sgIndex(key)%SGCOLORS.length]; }
function sgOf(key){ return SUBG.find(s=>s.key===key); }

// ---------- header
function renderHero(){
  const h = document.getElementById('hero');
  const rules = SUBG.map((s,i)=>{
    const c = SGCOLORS[i%SGCOLORS.length];
    return `<div class="rule" style="border-left:5px solid ${c}"><b style="color:${c}">${s.label}</b>${s.desc||''}</div>`;
  }).join('');
  const rhymes = (G.rhymeChains && G.rhymeChains.length)
    ? `<div class="rhymes"><h3>🎵 同韵顺口溜 · 点单词听发音，成串背最快</h3>${
        G.rhymeChains.map(c=>`<div class="chain"><span class="lab">${c.label}</span>${
          c.words.map(w=>`<span class="chip" onclick="say('${w}')">${w}</span>`).join('')
        }</div>`).join('')}</div>`
    : '';
  h.innerHTML = `
    <div class="combo"><span class="big">${G.combo}</span><span class="snd">${G.sound}</span></div>
    <h1>${G.title} · ${G.subtitle||''}</h1>
    <p class="intro">${G.intro}</p>
    <div class="rules">${rules}</div>
    ${rhymes}`;
}

let speaking=false;
function sayPassage(btn){
  if(speaking){ speechSynthesis.cancel(); speaking=false; if(btn) btn.textContent='🔊 朗读全文'; return; }
  const P = G.passage; if(!P) return;
  const texts = (P.paragraphs||[]).map(p=>p.en).filter(Boolean);
  if(!texts.length) return;
  if(!VOICE) pickVoice();
  speaking=true; if(btn) btn.textContent='⏹ 停止朗读';
  let last=null;
  texts.forEach((t,i)=>{
    const u = new SpeechSynthesisUtterance(t);
    u.lang='en-US'; if(VOICE) u.voice=VOICE; u.rate=.95; u.pitch=1.0;
    if(i===texts.length-1) last=u;
    speechSynthesis.speak(u);
  });
  if(last) last.onend=()=>{ speaking=false; if(btn) btn.textContent='🔊 朗读全文'; };
}
function renderPassage(){
  const el = document.getElementById('passage');
  const P = G.passage; if(!P){ el.style.display='none'; return; }
  const paras = (P.paragraphs||[]).map(p=>{
    let en = p.en||'';
    // 高亮关键词（p.kws 或自动匹配词表词）
    const kws = p.kws || [];
    kws.forEach(k=>{ en = en.replace(new RegExp('('+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'), '<span class="kw" onclick="say(\'$1\')">$1</span>'); });
    return `<p><div class="en">${en}</div>${p.zh?`<div class="zh">${p.zh}</div>`:''}</p>`;
  }).join('');
  el.innerHTML = `<div class="passage"><h2>📖 精读原文</h2>
    <div class="p-title">${P.title||''} <button class="readall" onclick="sayPassage(this)">🔊 朗读全文</button></div>
    ${paras}</div>`;
}
const ROLECOLOR = { '主语':'#2f8f83','谓语':'#c1662f','宾语':'#3a7bd5','状语':'#6a52a8','定语':'#b0603f','补语':'#c1662f','从句':'#8c8072','连词':'#8c8072','介词':'#8c8072','插入语':'#8c8072','同位语':'#b0603f' };
function roleColor(r){ return ROLECOLOR[r] || '#6a52a8'; }
function escAttr(s){ return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
// 句子内括号标注：介词短语 ( ) · 从句 [ ] · 非谓语 { }
const BRK = {'pp':['(',')'], 'cl':['[',']'], 'nf':['{','}']};
const BRKC = {'pp':'#6a52a8', 'cl':'#3a7bd5', 'nf':'#b0603f'};
function renderFlow(s){
  let html='';
  (s.flow||[]).forEach(it=>{
    if(it.open){ const k=it.open; html+=`<span class="brkbox" style="background:${BRKC[k]}16;border-bottom:2px solid ${BRKC[k]}66"><b class="brk" style="color:${BRKC[k]}">${BRK[k][0]}</b>`; }
    else if(it.close){ const k=it.close; html+=`<b class="brk" style="color:${BRKC[k]}">${BRK[k][1]}</b></span>`; }
    else { html+=escAttr(it.t); }
  });
  return html;
}
function renderSents(){
  const el = document.getElementById('sents');
  const S = G.sentences; if(!S || !S.length){ el.style.display='none'; return; }
  const items = S.map((s,i)=>{
    const flowHtml = (s.flow && s.flow.length) ? renderFlow(s) : escAttr(s.en);
    const parts = (s.parts||[]).map(p=>{
      const c = roleColor(p.r);
      return `<span class="spart" style="background:${c}18;border:1px solid ${c}55">
        <span class="st" style="color:${c}">${escAttr(p.t)}</span>
        <span class="sr" style="background:${c}">${p.r}</span>
        ${p.n?`<span class="sn">${p.n}</span>`:''}</span>`;
    }).join('');
    return `<div class="sent">
      <div class="s-flow" data-en="${escAttr(s.en)}" onclick="say(this.dataset.en)" title="点句子朗读">${flowHtml} <button class="say-mini" data-en="${escAttr(s.en)}" onclick="event.stopPropagation();say(this.dataset.en)" title="朗读">🔊</button></div>
      ${s.zh?`<div class="s-zh">${s.zh}</div>`:''}
      <div class="s-parts">${parts}</div>
      ${s.note?`<div class="snotes">${s.note}</div>`:''}</div>`;
  }).join('');
  el.innerHTML = `<div class="sents"><h2>🔍 长难句 · 句法分析</h2>
    <div class="s-sub">点英文句可朗读 · 括号标注：<b style="color:#6a52a8">( ) 介词短语</b> · <b style="color:#3a7bd5">[ ] 从句</b> · <b style="color:#b0603f">{ } 非谓语动词</b> · 下方色块=成分功能</div>
    ${items}</div>`;
}

// ---------- filters
function renderFilters(){
  const lvs = ['全部','六级','托福','GRE拓展','基础'];
  document.getElementById('lvf').innerHTML = lvs.map(l=>
    `<span class="f${l===curLv?' on':''}" onclick="setLv('${l}')">${l}</span>`).join('');
  const sgs = [['全部','全部'], ...SUBG.map(s=>[s.tag||s.label, s.key])];
  document.getElementById('sgf').innerHTML = sgs.map(([t,v])=>
    `<span class="f${v===curSg?' on':''}" onclick="setSg('${v}')">${t}</span>`).join('');
}
function setLv(l){curLv=l;renderFilters();renderGrid();}
function setSg(s){curSg=s;renderFilters();renderGrid();}

// ---------- speech：优先自然美式女声
let VOICE=null, VOICES=[];
// 各浏览器/系统里公认自然的美式女声，按优先级排序
const PREF=[
  'Google US English',                 // Chrome：自然女声
  'Microsoft Aria Online (Natural) - English (United States)',
  'Microsoft Jenny Online (Natural) - English (United States)',
  'Microsoft Ava Online (Natural) - English (United States)',
  'Microsoft Aria','Microsoft Jenny','Microsoft Michelle',
  'Ava (Premium)','Ava (Enhanced)','Ava',   // macOS Siri 女声
  'Samantha',                          // macOS 经典美式女声
  'Allison','Susan','Nicky','Zoe','Karen','Victoria'
];
const MALE=/(alex|daniel|fred|tom|david|mark|male|aaron|arthur|gordon|oliver|rishi|junior|ralph)/i;
function usPool(){
  VOICES = speechSynthesis.getVoices()||[];
  let us = VOICES.filter(v=>/en[-_]US/i.test(v.lang)||/United States/i.test(v.name));
  if(!us.length) us = VOICES.filter(v=>/^en/i.test(v.lang));
  return us;
}
function pickVoice(){
  const pool=usPool(); if(!pool.length) return;
  VOICE=null;
  for(const n of PREF){ const h=pool.find(v=>v.name===n)||pool.find(v=>v.name.indexOf(n)===0); if(h){VOICE=h;break;} }
  if(!VOICE) VOICE = pool.find(v=>/(samantha|ava|allison|susan|nicky|zoe|karen|victoria|aria|jenny|michelle|female|google us)/i.test(v.name))
                   || pool.find(v=>!MALE.test(v.name)) || pool[0];
  fillVoiceSel(pool);
}
function fillVoiceSel(pool){
  const s=document.getElementById('voiceSel'); if(!s) return;
  s.innerHTML = pool.map(v=>{
    const nm=v.name.replace(/ - English.*/,'').replace(/Online \(Natural\)/,'✨');
    return `<option value="${v.name}"${VOICE&&v.name===VOICE.name?' selected':''}>🎙 ${nm}</option>`;
  }).join('');
}
document.getElementById('voiceSel').addEventListener('change',e=>{
  VOICE = VOICES.find(v=>v.name===e.target.value)||VOICE; say(G.combo==='aw'?'awesome':'natural');
});
if('onvoiceschanged' in speechSynthesis) speechSynthesis.onvoiceschanged = pickVoice;
pickVoice();
function say(w){
  try{
    if(!VOICE) pickVoice();
    const u = new SpeechSynthesisUtterance(w);
    u.lang='en-US'; if(VOICE) u.voice=VOICE; u.rate=.95; u.pitch=1.0;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }catch(e){}
}

// 高亮单词里的目标拼写：优先用该词自带的 hl（音位页里每词各自的拼写），否则用组的 combo
function hlWord(word, spell){
  const c = (spell||'').replace(/[.*+?^${}()|[\]\\\/·\s]/g,'');  // 只取干净字母做高亮，去掉 / · 空格等
  if(!c) return word;
  try{ return word.replace(new RegExp('('+c+')','i'), '<span class="hl">$1</span>'); }
  catch(e){ return word; }
}

// ---------- card
function card(w){
  const tags = (w.levels||[]).map(l=>`<span class="tag ${LVCLASS[l]||''}">${l}</span>`).join('');
  const roots = (w.roots||[]).map(r=>`<span class="root"><b>${r.part}</b> ${r.meaning}</span>`).join('');
  const exs = (w.examples||[]).map(e=>{
    const fam = /造句/.test(e.source)? '' : ' famous';
    return `<div class="ex${fam}"><div class="en">${e.en}</div><div class="zh">${e.zh}</div><span class="src">— ${e.source}</span></div>`;
  }).join('');
  const syns = (w.synonyms||[]).map(s=>
    `<div class="lex"><b class="lw" onclick="event.stopPropagation();say('${s.w}')">${s.w}</b>`+
    `${s.ipa?` <span class="lip">${s.ipa}</span>`:''}${s.note?` <span class="ln">— ${s.note}</span>`:''}</div>`).join('');
  const ants = (w.antonyms||[]).map(a=>
    `<span class="antchip" onclick="event.stopPropagation();say('${a.w}')">${a.w}${a.note?` <i>${a.note}</i>`:''}</span>`).join('');
  const lexSec = (syns||ants||w.nuance)
    ? `<div class="sec"><span class="l">🔗 近义词辨析 · 反义词</span>`+
      `${syns?`<div class="lexgroup"><span class="lextag syn">近义</span><div class="lexlist">${syns}</div></div>`:''}`+
      `${ants?`<div class="lexgroup"><span class="lextag ant">反义</span><div class="lexlist antline">${ants}</div></div>`:''}`+
      `${w.nuance?`<div class="nuance">🎯 ${w.nuance}</div>`:''}</div>`
    : '';
  const senses = (w.senses||[]).map(s=>
    `<div class="sense"><div class="s-gloss"><b>${s.gloss}</b>${s.logic?` <span class="s-logic">← ${s.logic}</span>`:''}</div>`+
    `${s.en?`<div class="s-ex"><span class="s-en">${s.en}</span> <span class="s-zh">${s.zh||''}</span></div>`:''}</div>`).join('');
  const senseSec = (w.core||senses)
    ? `<div class="sec"><span class="l">🧠 一词多义 · 核心意象串解</span>`+
      `${w.core?`<div class="coreimg">🎯 核心感觉：${w.core}</div>`:''}${senses}</div>`
    : '';
  const isU = unfam.has(w.word);
  const so = sgOf(w.subgroup);
  return `<div class="card${isU?' unfamiliar':''}" data-w="${w.word}" onclick="if(document.body.classList.contains('mem'))this.classList.toggle('reveal')">
    <span class="sub-tag" style="background:${sgColor(w.subgroup)}">${so?(so.tag||so.label):''}</span>
    <div class="whead">
      <span class="word">${hlWord(w.word, w.hl || G.combo)}</span>
      <span class="ipa">${w.ipa}</span>
      <button class="say" onclick="event.stopPropagation();say('${w.word}')" title="朗读">🔊</button>
    </div>
    <div class="tags">${tags}</div>
    <div class="mean">${w.meaning}</div>
    ${senseSec}
    ${w.etymology?`<div class="sec"><span class="l">🏛 造词来源 · 词源故事</span>${w.etymology}</div>`:''}
    ${roots?`<div class="sec"><span class="l">🧩 词根词缀</span><div class="roots">${roots}</div></div>`:''}
    ${w.phonetics?`<div class="sec"><span class="l">🗣 发音规律</span>${w.phonetics}</div>`:''}
    ${w.tip?`<div class="sec"><span class="l">💡 记忆钩子</span><div class="tip">${w.tip}</div></div>`:''}
    ${exs?`<div class="sec"><span class="l">✍️ 造句 · 名著/影视例句</span>${exs}</div>`:''}
    ${lexSec}
    <label class="check" onclick="event.stopPropagation()">
      <input type="checkbox" ${isU?'checked':''} onchange="toggleUnfam('${w.word}',this.checked)"> 🔺 标记不熟悉
    </label>
  </div>`;
}

function match(w){
  if(onlyUnfam && !unfam.has(w.word)) return false;
  if(curLv!=='全部' && !(w.levels||[]).includes(curLv)) return false;
  if(curSg!=='全部' && w.subgroup!==curSg) return false;
  if(curQ){
    const s=(w.word+' '+w.meaning).toLowerCase();
    if(!s.includes(curQ.toLowerCase())) return false;
  }
  return true;
}

function renderGrid(){
  const list = G.words.filter(match);
  // 不熟悉的置顶（稳定排序，保持各自原有相对顺序）
  list.sort((a,b)=>(unfam.has(b.word)?1:0)-(unfam.has(a.word)?1:0));
  const g = document.getElementById('grid');
  g.innerHTML = list.length? list.map(card).join('') : '<div class="empty">没有匹配的单词，换个筛选试试～</div>';
  updateUnfamCount();
}

function toggleUnfam(word, on){
  if(on) unfam.add(word); else unfam.delete(word);
  localStorage.setItem(KEY, JSON.stringify([...unfam]));
  const c = document.querySelector(`.card[data-w="${word}"]`);
  if(c) c.classList.toggle('unfamiliar', on);   // 立即变色，卡片原位不跳动；置顶在下次渲染/筛选时生效
  updateUnfamCount();
}
function updateUnfamCount(){
  const n = G.words.filter(w=>unfam.has(w.word)).length;
  const el = document.getElementById('unfamN');
  if(el) el.textContent = n;
}

document.getElementById('q').addEventListener('input',e=>{curQ=e.target.value;renderGrid();});
document.getElementById('unfamBtn').addEventListener('click',e=>{
  onlyUnfam=!onlyUnfam;
  e.currentTarget.classList.toggle('on',onlyUnfam);
  renderGrid();
});
document.getElementById('memBtn').addEventListener('click',e=>{
  document.body.classList.toggle('mem');
  e.target.classList.toggle('on');
  e.target.textContent = document.body.classList.contains('mem')?'🧠 记忆模式(开)·悬停显形':'🧠 记忆模式';
});

// ---------- 测验：英文 → 中文四选一（覆盖当前筛选到的全部单词）
let quiz=null;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
// 测验池 = 本页(筛选后)全部词 + 它们的同义词 + 衍生词（去重）
function quizPool(){
  const base = G.words.filter(match);
  const items=[]; const seen=new Set();
  const add=(word,ipa,meaning)=>{const k=(word||'').toLowerCase();
    if(!word||!meaning||seen.has(k))return; seen.add(k); items.push({word,ipa:ipa||'',meaning});};
  base.forEach(w=>{
    add(w.word,w.ipa,w.meaning);
    (w.synonyms||[]).forEach(s=>add(s.w,s.ipa,s.gloss||s.note));
    (w.derivatives||[]).forEach(dv=>add(dv.w,dv.ipa,dv.gloss||dv.note));
  });
  return items;
}
function startQuiz(src){
  const pool = src || quizPool();
  if(pool.length<4){ alert('至少要有 4 个词才能测验，请先放宽上方筛选～'); return; }
  quiz={list:shuffle(pool), i:0, score:0, wrong:[], done:false, next:null, pool:quizPool()};
  document.getElementById('quizOv').style.display='flex';
  renderQ();
}
function renderQ(){
  quiz.done=false; quiz.next=null;
  const q=quiz.list[quiz.i];
  const others=(quiz.pool||[]).filter(w=>w.meaning!==q.meaning);
  const opts=shuffle([q.meaning, ...shuffle(others).slice(0,3).map(w=>w.meaning)]);
  const K=['1','2','3','4'];
  document.getElementById('qbox').innerHTML=`
    <div class="qtop"><span>第 ${quiz.i+1} / ${quiz.list.length} 题 · 已答对 ${quiz.score}</span>
      <span style="cursor:pointer" onclick="closeQuiz()">✕ 关闭</span></div>
    <div class="qbar2"><i style="width:${quiz.i/quiz.list.length*100}%"></i></div>
    <div class="qword">${q.word} <button class="say" style="vertical-align:middle;width:30px;height:30px;font-size:14px" onclick="say('${q.word}')">🔊</button></div>
    <div class="qipa">${q.ipa}</div>
    <div class="qopts" id="qopts">${opts.map((o,k)=>
      `<button class="qopt" data-m="${encodeURIComponent(o)}" onclick="answer(this,'${encodeURIComponent(q.meaning)}')">
        <span class="k">${K[k]}</span><span>${o}</span></button>`).join('')}</div>
    <div class="hint">按 1–4 键作答 · 回车进入下一题</div>`;
  say(q.word);
}
function answer(el, correctEnc){
  if(quiz.done) return; quiz.done=true;
  const correct=decodeURIComponent(correctEnc);
  const chosen=decodeURIComponent(el.dataset.m);
  if(chosen===correct) quiz.score++; else quiz.wrong.push(quiz.list[quiz.i]);
  document.querySelectorAll('#qopts .qopt').forEach(b=>{
    const m=decodeURIComponent(b.dataset.m);
    if(m===correct) b.classList.add('right');
    else if(b===el) b.classList.add('wrong');
    else b.classList.add('dim');
    b.style.pointerEvents='none';
  });
  const btn=document.createElement('button');
  btn.className='qnext';
  btn.textContent = quiz.i<quiz.list.length-1 ? '下一题 →' : '看结果 →';
  btn.onclick=nextQ;
  document.getElementById('qbox').appendChild(btn);
  quiz.next=btn;
}
function nextQ(){
  if(quiz.i<quiz.list.length-1){ quiz.i++; renderQ(); } else endQuiz();
}
function endQuiz(){
  const tot=quiz.list.length, pct=Math.round(quiz.score/tot*100);
  const wrongHtml = quiz.wrong.length
    ? quiz.wrong.map(w=>`<div class="r"><b>${w.word}</b> ${w.ipa} — ${w.meaning}</div>`).join('')
    : '<div class="r">全部答对，太强了！🎉</div>';
  const wrongCopy = quiz.wrong.slice();
  document.getElementById('qbox').innerHTML=`
    <div class="qend">
      <div class="qtop" style="justify-content:flex-end"><span style="cursor:pointer" onclick="closeQuiz()">✕ 关闭</span></div>
      <div>本轮得分</div><div class="qscore">${quiz.score}/${tot}</div>
      <div style="color:var(--muted)">正确率 ${pct}%</div>
      <div class="qwrong"><div style="color:var(--exc);font-weight:700;margin-bottom:4px">错题（${quiz.wrong.length}）</div>${wrongHtml}</div>
      <div id="qendBtns"></div>
    </div>`;
  const box=document.getElementById('qendBtns');
  if(wrongCopy.length){
    const b1=document.createElement('button'); b1.className='qnext'; b1.textContent='只测这些错题';
    b1.onclick=()=>startQuiz(wrongCopy); box.appendChild(b1);
  }
  const b2=document.createElement('button'); b2.className='qnext';
  b2.style.cssText='background:#fff;color:var(--accent);border:1.5px solid var(--accent);margin-top:8px';
  b2.textContent='再来一轮（当前筛选）'; b2.onclick=()=>startQuiz(); box.appendChild(b2);
}
function closeQuiz(){ document.getElementById('quizOv').style.display='none'; quiz=null; }
document.getElementById('quizBtn').addEventListener('click',()=>startQuiz());
document.getElementById('quizOv').addEventListener('click',e=>{ if(e.target.id==='quizOv') closeQuiz(); });
document.addEventListener('keydown',e=>{
  if(!quiz || document.getElementById('quizOv').style.display==='none') return;
  if(quiz.next && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); quiz.next.click(); return; }
  if(!quiz.done && /^[1-4]$/.test(e.key)){ const b=document.querySelectorAll('#qopts .qopt')[+e.key-1]; if(b) b.click(); }
});

document.getElementById('foot').innerHTML =
  `共 ${G.words.length} 词 · 数据源：托福 4264 词表（真实词库）+ 六级核心词 · `+
  `发音由浏览器语音合成朗读 · 名著/影视例句均为真实出处，「造句」为学习例句，「高频搭配」为常用短语。`;

renderHero(); renderPassage(); renderSents(); renderFilters(); renderGrid();
</script>
