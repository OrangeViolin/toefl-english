<style>

  html{scroll-behavior:smooth}

    font-family:-apple-system,"PingFang SC","Helvetica Neue",Segoe UI,sans-serif;
    line-height:1.6;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1180px;margin:0 auto;padding:26px 20px 90px}

  .top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
  .top a{color:var(--muted)}
  /* header */

  .combo{display:inline-flex;align-items:baseline;gap:14px}

    background:var(--amber);color:var(--accent);padding:2px 20px;border-radius:18px;line-height:1.1}

  .rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin:18px 0}
  .rule{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:14px}

  .rule.exc{border-left:5px solid var(--exc)}
  .rule b{display:block;margin-bottom:4px;font-size:14px}
  .rule.core b{color:var(--core)} .rule.exc b{color:var(--exc)}
  /* rhyme chains */
  .rhymes{background:linear-gradient(135deg,#fff6e8,#fdeede);border:1px dashed var(--accent2);
    border-radius:14px;padding:14px 16px;margin-bottom:20px}
  .rhymes h3{margin:0 0 8px;font-size:15px;color:var(--accent)}
  .chain{margin:6px 0;font-size:14px}
  .chain .lab{color:var(--muted);margin-right:8px}
  .chip{display:inline-block;background:#fff;border:1px solid var(--line);border-radius:20px;
    padding:2px 11px;margin:3px 4px 3px 0;cursor:pointer;font-family:Georgia,serif;font-size:15px;transition:.15s}
  .chip:hover{background:var(--amber);border-color:var(--accent2)}
  /* toolbar */
  .toolbar{position:sticky;top:0;z-index:20;background:rgba(247,241,231,.94);backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);padding:12px 0;margin-bottom:18px;
    display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .search{flex:1;min-width:180px;padding:8px 13px;border:1px solid var(--line);border-radius:10px;
    font-size:14px;background:#fff}
  .filters{display:flex;flex-wrap:wrap;gap:6px}
  .f{padding:6px 12px;border:1px solid var(--line);background:#fff;border-radius:20px;font-size:13px;
    cursor:pointer;color:#6b6154;transition:.15s}
  .f.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  select.f{max-width:170px;color:#6b6154;cursor:pointer}
  .btn{padding:7px 14px;border:1px solid var(--accent);background:#fff;color:var(--accent);
    border-radius:20px;font-size:13px;cursor:pointer;font-weight:600}
  .btn.on{background:var(--accent);color:#fff}
  .prog{font-size:13px;color:var(--muted);white-space:nowrap}
  .bar{height:6px;background:var(--line);border-radius:6px;width:120px;overflow:hidden;display:inline-block;vertical-align:middle}
  .bar>i{display:block;height:100%;background:var(--ok);width:0}
  /* cards */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 17px;
    box-shadow:0 2px 10px rgba(150,120,70,.06);display:flex;flex-direction:column;gap:10px;position:relative}
  .card.unfamiliar{border-color:#e08a3c;background:#fff7ec;box-shadow:0 2px 14px rgba(210,120,40,.20)}
  .card .sub-tag{position:absolute;top:0;right:16px;transform:translateY(-50%);
    font-size:11px;padding:2px 9px;border-radius:10px;color:#fff}
  .sub-core{background:var(--core)} .sub-exc{background:var(--exc)}
  .whead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .word{font-family:Georgia,"Times New Roman",serif;font-size:30px;font-weight:700;letter-spacing:.5px}
  .word .hl{background:var(--amber);color:var(--accent);border-radius:6px;padding:0 3px}
  .ipa{color:var(--core);font-size:16px;font-weight:600}
  .say{margin-left:auto;border:none;background:var(--amber);color:var(--accent);border-radius:50%;
    width:34px;height:34px;font-size:16px;cursor:pointer;flex:none}
  .say:hover{background:var(--accent2);color:#fff}
  .tags{display:flex;gap:5px;flex-wrap:wrap}
  .tag{font-size:11px;padding:1px 8px;border-radius:9px;background:#f0e7d6;color:#8a6a3c}
  .tag.lv6{background:#e6f0ec;color:#2f8f83}
  .tag.tfl{background:#eae6f5;color:#6a52a8}
  .tag.gre{background:#f7e6ea;color:#b0507a}
  .mean{font-size:15.5px;font-weight:600;color:#3a332b}
  .sec{font-size:13.5px;color:#4d463c;border-top:1px dashed var(--line);padding-top:8px}
  .sec .l{font-size:11.5px;color:var(--accent);font-weight:700;letter-spacing:.5px;display:block;margin-bottom:2px}
  .roots{display:flex;flex-wrap:wrap;gap:6px}
  .root{background:#f6efe1;border-radius:8px;padding:3px 9px;font-size:12.5px}
  .root b{font-family:Georgia,serif;color:var(--accent)}
  .tip{background:#fff6e8;border-left:3px solid var(--accent2);padding:5px 10px;border-radius:0 8px 8px 0;font-size:13px}

  .coreimg{background:#f4f0e5;border-radius:8px;padding:6px 10px;font-size:13.5px;color:#5a4a2e;margin-bottom:7px}
  .sense{border-left:3px solid var(--accent2);padding:3px 0 3px 10px;margin:6px 0}
  .sense .s-gloss{font-size:14px}
  .sense .s-gloss b{color:#3a332b}
  .sense .s-logic{color:var(--accent);font-size:12.5px}
  .sense .s-ex{margin-top:2px;font-size:13px}
  .sense .s-en{font-family:Georgia,serif;color:#2f2a24}
  .sense .s-zh{color:#6b6154}
  .ex{margin:7px 0}
  .ex .en{font-family:Georgia,serif;font-size:14px;color:#2f2a24}
  .ex .zh{color:#6b6154;font-size:13px}
  .ex .src{display:inline-block;font-size:11px;color:#a89a86;margin-top:1px}
  .ex.famous{background:#fbf4e7;border-radius:8px;padding:7px 10px}

  .lexgroup{display:flex;gap:8px;margin:4px 0;align-items:flex-start}
  .lextag{flex:none;font-size:11px;font-weight:700;padding:1px 8px;border-radius:8px;margin-top:3px}
  .lextag.syn{background:#e6f0ec;color:#2f8f83}
  .lextag.ant{background:#f7e6ea;color:#b0507a}
  .lexlist{display:flex;flex-direction:column;gap:3px;font-size:13.5px;flex:1}
  .lexlist.antline{flex-direction:row;flex-wrap:wrap;gap:6px;align-items:center}
  .lex .lw{font-family:Georgia,serif;color:var(--accent);cursor:pointer;font-weight:600}
  .lex .lw:hover{text-decoration:underline}
  .lex .lip{color:var(--core);font-size:12px}
  .lex .ln{color:#5f574c}
  .antchip{background:#faf0f2;border-radius:8px;padding:2px 9px;cursor:pointer;font-family:Georgia,serif;font-size:13px;color:#b0507a}
  .antchip:hover{background:#f6e3e8}
  .antchip i{font-style:normal;color:#9a8f86;font-size:12px}
  .nuance{background:#eef6f3;border-left:3px solid var(--core);padding:6px 10px;border-radius:0 8px 8px 0;font-size:13px;margin-top:7px;color:#33463f}

  body.mem .mean, body.mem .sec{filter:blur(5px);transition:.15s;cursor:pointer}
  body.mem .card:hover .mean, body.mem .card.reveal .mean,
  body.mem .card:hover .sec, body.mem .card.reveal .sec{filter:none}
  .check{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer;margin-top:2px}
  .check input{width:16px;height:16px;accent-color:#c1662f}
  .card.unfamiliar .check{color:#c1662f;font-weight:600}
  .empty{text-align:center;color:var(--muted);padding:40px;grid-column:1/-1}
  footer{margin-top:36px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
  /* 测验 */

  .qbox{background:var(--card);border-radius:20px;max-width:560px;width:100%;padding:22px 24px 20px;

  .qtop{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px;margin-bottom:8px}
  .qbar2{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:16px}
  .qbar2>i{display:block;height:100%;background:var(--accent);width:0;transition:.3s}
  .qword{font-family:Georgia,serif;font-size:40px;font-weight:700;text-align:center;margin:4px 0 2px}
  .qipa{text-align:center;color:var(--core);font-size:16px;margin-bottom:16px}
  .qopts{display:grid;gap:10px}
  .qopt{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:11px 14px;font-size:14.5px;
    cursor:pointer;text-align:left;transition:.12s;display:flex;gap:10px;align-items:flex-start;font-family:inherit;color:var(--ink)}
  .qopt:hover{border-color:var(--accent2);background:#fffaf0}
  .qopt .k{font-weight:700;color:var(--accent);flex:none}
  .qopt.right{border-color:var(--ok);background:#eafaef}
  .qopt.wrong{border-color:var(--exc);background:#fdeeea}
  .qopt.dim{opacity:.45}
  .qnext{margin-top:14px;width:100%;padding:12px;border:none;border-radius:12px;background:var(--accent);
    color:#fff;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
  .qend{text-align:center}
  .qscore{font-size:46px;font-weight:800;color:var(--accent);margin:4px 0}
  .qwrong{text-align:left;margin:14px 0;max-height:34vh;overflow:auto}
  .qwrong .r{border-top:1px dashed var(--line);padding:7px 0;font-size:14px}
  .qwrong .r b{font-family:Georgia,serif;color:var(--exc)}
  .hint{text-align:center;color:var(--muted);font-size:12px;margin-top:10px}
  @media(max-width:680px){.rules{grid-template-columns:1fr}.combo .big{font-size:44px}}
</style>

ry entry in the books at year-end.", "zh": "年终时会计核对了账簿中的每一笔记录。"}, {"gloss": "v. 预订（座位、房间等）", "logic": "在账本上「登记名字」→ 把东西提前锁定归你", "en": "I need to book a hotel room before the conference next week.", "zh": "我需要在下周会议前预订一间酒店房间。"}], "derivatives": [{"w": "booklet", "gloss": "小册子"}, {"w": "textbook", "gloss": "教科书，课本"}, {"w": "notebook", "gloss": "笔记本"}, {"w": "bookmark", "gloss": "书签"}], "examples": [{"en": "She booked a table at the restaurant three weeks in advance.", "zh": "她提前三周在餐厅订了一张桌子。", "source": "造句"}, {"en": "by the book", "zh": "「按规矩来，照章办事」——固定习语，强调严格遵守规则。", "source": "高频搭配"}], "synonyms": [{"w": "reserve", "ipa": "/rɪˈzɜːrv/", "gloss": "预订，预留", "note": "「预订」义，比 book 更正式；reserve a seat（预留座位）。也可指「储备」"}, {"w": "volume", "ipa": "/ˈvɒljuːm/", "gloss": "书卷，卷册", "note": "「书册」义，偏正式或学术，常指系列中的一册；volume II of the encyclopedia"}, {"w": "text", "ipa": "/tekst/", "gloss": "课本，文本", "note": "「课本、文本」义，textbook 的口语简称，语境限于教育场合"}], "antonyms": [{"w": "cancel", "note": "取消（预订）"}], "nuance": "book（动词）和 reserve 都是「预订」，但 book 更口语（book a flight），reserve 更正式（reserve a room），且 reserve 还有「保留权利、储备」义，book 没有。"}, {"word": "big", "hl": "b", "levels": ["六级"], "ipa": "/bɪɡ/", "subgroup": "b", "meaning": "adj. 大的；重要的；成功的  adv. 大地；夸大地", "etymology": "中古英语 big，来源不确定，可能源自斯堪的纳维亚语 bugge（重要人物）。14世纪进入英语时原指「强壮有力的」，后扩展为「体积大的」和「重要的」。", "roots": [{"part": "big", "meaning": "大、重要"}], "phonetics": "b + i /ɪ/ + g，单音节短元音词，/ɪ/ 是松散的短「衣」，舌头低于 /iː/。与 dig、fig、pig、wig 押韵。", "core": "一种身体能感受到的「撑开来、压下来的体量感」——不是脑子里想的抽象「大」，而是眼睛看到庞然大物时身体本能的那一下收缩反应，所有引申义都是「这东西让人没法忽视」", "senses": [{"gloss": "adj. 大的（体积、尺寸）", "logic": "最直接的空间占据感：东西撑开、压住视野", "en": "They moved into a big house on the outskirts of the city.", "zh": "他们搬进了市郊一栋大房子。"}, {"gloss": "adj. 重要的，重大的", "logic": "从「体积大」→「分量重」→「影响力不可忽视」", "en": "Graduating was a big moment for the entire family.", "zh": "毕业对整个家庭来说是一个重大时刻。"}, {"gloss": "adj. 成功的，走红的", "logic": "从「大」到「占据大块空间」→ 在某个领域声势浩大", "en": "The band became big in the early 2000s with their debut album.", "zh": "那支乐队凭借首 efits that no medication can replace.", "zh": "规律运动带来的长期健康益处是任何药物都无法替代的。"}, {"gloss": "n.（政府）福利金，补助金", "logic": "好处制度化→政府定期给的钱和帮助", "en": "She receives unemployment benefits while looking for a new job.", "zh": "她在找新工作期间领取失业补助金。"}, {"gloss": "v. 对……有益", "logic": "「好行为」变成动词——成为那个给出去的好处", "en": "The new policy will benefit low-income families the most.", "zh": "新政策将最大程度惠及低收入家庭。"}, {"gloss": "v. 从……中获益", "logic": "反过来——从别人做的好事中获得好处", "en": "Students benefit greatly from one-on-one tutoring.", "zh": "学生从一对一辅导中获益良多。"}], "derivatives": [{"w": "beneficial", "gloss": "有益的，有利的"}, {"w": "beneficiary", "gloss": "受益人，受惠者"}, {"w": "benevolent", "gloss": "仁慈的，慈善的（bene-好+vol-意愿）"}], "examples": [{"en": "Regular exercise brings long-term health benefits that no medication can replace.", "zh": "规律运动带来的长期健康益处是任何药物都无法替代的。", "source": "造句"}, {"en": "benefit of the doubt", "zh": "「（在证据不足时）给予信任」——法律和日常高频短语。", "source": "高频搭配"}], "synonyms": [{"w": "advantage", "ipa": "/ədˈvɑːntɪdʒ/", "gloss": "优势，有利条件（强调相对竞争）", "note": "「优势」，比 benefit 更强调相对竞争中的有利之处；an advantage over rivals（相对对手的优势）"}, {"w": "gain", "ipa": "/ɡeɪn/", "gloss": "收益，获得（强调结果/数量）", "note": "「收益、获得」，比 benefit 更强调结果；financial gain（财务收益）"}, {"w": "merit", "ipa": "/ˈmerɪt/", "gloss": "优点，价值（强调固有品质）", "note": "「优点、价值」，比 benefit 更强调固有质量；judge on merit（凭实力评判）"}], "antonyms": [{"w": "harm", "note": "伤害，危害"}, {"w": "disadvantage", "note": "劣势，不利因素"}], "nuance": "benefit 强调对某人或某事有正面帮助（mutual benefit），advantage 强调相对其他选项的有利地位（competitive advantage），gain 更强调所得的数量或结果，merit 侧重内在价值而非外部效果。"}, {"word": "balance", "hl": "b", "levels": ["托福"], "ipa": "/ˈbæləns/", "subgroup": "b", "meaning": "n. 平衡；（银行）余额；天平  v. 使平衡；权衡", "etymology": "拉丁语 bilanx = bi-（两）+ lanx（盘子）= 「两个盘子的天平」。从物理天平→平衡状态→权衡利弊→财务余额。bilanx 的双盘结构完整保留在词义里。", "roots": [{"part": "bi-", "meaning": "二、两"}, {"part": "-lance（lanx）", "meaning": "天平盘"}], "phonetics": "重音在首 BAL-ance，bal = /bæl/（短元音 /æ/，嘴张大），-ance 弱读 /əns/。", "core": "两个盘子用一根杆连在一起、轻了重了马上能看出来的画面——一只盘沉下去另一只就翘起来，核心就是「两端对等的张力」，所有的「平衡」「余额」「权衡」都是这两个盘子在对话", "senses": [{"gloss": "n. 平衡，均衡", "logic": "物理天平两盘齐平的画面→两边对等不倾斜", "en": "The policy aims to strike a balance between economic growth and environmental protection.", "zh": "该政策旨在在经济增长与环境保护之间寻求平衡。"}, {"gloss": "n.（银行）余额，结余", "logic": "天平两端：收入一边，支出一边→两边相减后剩下的", "en": "Please check your account balance before making the transfer.", "zh": "请在转账前核对你的账户余额。"}, {"gloss": "v. 使平衡，保持平衡", "logic": "做出动作让天平两盘回到齐平", "en": "She balanced a stack of books on her head as a party trick.", "zh": "她在派对上头顶一摞书保持平衡作为小把戏。"}, {"gloss": "v. 权衡，斟酌", "logic": "把两个选项放在天平两端比一比轻重", "en": "You need to balance the risks against the potential rewards.", "zh": "你需要权衡风险与潜在回报。"}], "derivatives": [{"w": "balanced", "gloss": "均衡的，公平的"}, {"w": "counterbalance", "gloss": "抗衡，抵消"}, {"w": "imbalance", "gloss": "失衡，不平衡"}, {"w": "well-balanced", "gloss": "均衡的；心态稳的"}], "examples": [{"en": "The policy aims to strike a balance between economic growth and environmental protection.", "zh": "该政策旨在在经济增长与环境保护之间寻求平衡。", "source": "造句"}, {"en": "on balance", "zh": "「总的来说，权衡之下」——高频口语/书面连接语，引出综合评估结论。", "source": "高频搭配"}], "synonyms": [{"w": "equilibrium", "ipa": "/ˌiːkwɪˈlɪbriəm/", "gloss": "平衡态（科学术语，强调系统稳态）", "note": "正式科学术语「平衡态」，比 balance 更学术；maintain equilibrium（维持平衡）"}, {"w": "stability", "ipa": "/stəˈbɪlɪti/", "gloss": "稳定性（强调持续不变）", "note": "「稳定性」，比 balance 更强调持续不变的状态；economic stability（经济稳定）"}, {"w": "harmony", "ipa": "/ˈhɑːrməni/", "gloss": "和谐，协调（强调各方融洽）", "note": "「和谐」，比 balance 更主观，强调各方融洽协调；live in harmony（和谐共处）"}], "antonyms": [{"w": "imbalance", "note": "不平衡，失调"}, {"w": "instability", "note": "不稳定"}], "nuance": "balance 强调两力对等的动态过程（work-life balance），equilibrium 是科学用语，指系统的稳定状态（chemical equilibrium），stability 强调抗干扰的稳定性（political stability），harmony 带情感色彩，强调多方协调的美好状态。"}, {"word": "barrier", "hl": "b", "levels": ["托福"], "ipa": "/ˈbæriər/", "subgroup": "b", "meaning": "n. 屏障；障碍（物）；隔阂", "etymology": "古法语 barriere，源自 barre（横杆、栅栏），与 bar（横条、酒吧）同根。「横着的东西」→ 阻止通行的实体障碍→ 抽象阻力。", "roots": [{"part": "bar（barre）", "meaning": "横杆，阻挡物"}, {"part": "-ier", "meaning": "名词后缀"}], "phonetics": "重音在首 BAR-ri-er，三音节，-rr- 只读一个 /r/，-ier 弱读 /iər/。", "core": "一根横在面前的粗杆子——你想往前走，它拦着你、不让你过。物理上是栏杆，抽象上是任何「让人过不去的东西」，核心就是「横断感」", "senses": [{"gloss": "n. 屏障，栅栏（物理障碍）", "logic": "最直白的横杆：拦在路上的那个东西", "en": "The police set up barriers to control the crowd at the concert.", "zh": "警方在演唱会现场设置了屏障来控制人群。"}, {"gloss": "n. 障碍，隔阂（抽象）", "logic": "不在路上但在心里/系统里「横着」的东西", "en": "Language barriers remain one of the biggest obstacles in international business.", "zh": "语言障碍仍是国际商务中最大的障碍之一。"}], "derivatives": [{"w": "bar", "gloss": "横条；酒吧（吧台横杆）"}, {"w": "barricade", "gloss": "路障，街垒"}, {"w": "sound barrier", "gloss": "音障（物理速度极限）"}], "examples": [{"en": "Language barriers remain one of the biggest obstacles in international business.", "zh": "语言障碍仍是国际商务中最大的障碍之一。", "source": "造句"}, {"en": "break down barriers", "zh": "「打破隔阂/壁垒」——政治、社会、商业语境高频搭配。", "source": "高频搭配"}], "synonyms": [{"w": "obstacle", "ipa": "/ˈɒbstəkl/", "gloss": "障碍物（挡在路上的东西）", "note": "「障碍物」，比 barrier 更侧重具体阻挡进展的事物；overcome an obstacle（克服障碍）"}, {"w": "hurdle", "ipa": "/ˈhɜːrdl/", "gloss": "难关，障碍（可跨越的）", "note": "「难关」，源自跨栏，强调可以跨越的障碍，比 barrier 更乐观；clear the final hurdle（过最后一关）"}, {"w": "hindrance", "ipa": "/ˈhɪndrəns/", "gloss": "阻碍，干扰（令人烦恼的小阻力）", "note": "「阻碍」，强调令人烦恼的干扰，比 barrier 更口语和轻微"}], "antonyms": [{"w": "gateway", "note": "通道，入口"}, {"w": "bridge", "note": "桥梁（沟通的）"}], "nuance": "barrier 暗示「难以跨越的壁垒」（trade barrier），obstacle 是「挡在路上的东西」（remove obstacles），hurdle 是「可以跨越的难关」（含积极克服意味），hindrance 是「令人恼火的小阻力」（without hindrance）。三者在「阻碍」义上语气依次递减。"}, {"word": "blame", "hl": "b", "levels": ["托福"], "ipa": "/bleɪm/", "subgroup": "b", "meaning": "v. 责怪，归咎于  n. 责任，罪责", "etymology": "古法语 blasmer，源自晚期拉丁语 blasphemare（辱骂、谴责），与 blaspheme（亵渎）同根。从「宗教上的辱骂神灵」→「世俗的批评指责」，词义在进入英语后大幅温和化。", "roots": [{"part": "blame（blasphemare）", "meaning": "辱骂，谴责"}], "phonetics": "bl- 连缀辅音 + ame /eɪm/，开音节长元音。与 flame、claim、name 押韵。", "core": "用手指戳着一个人说「是你搞砸的」——那个指责瞬间的压迫感。blame 的核心是「把坏事的原因钉在某人身上」，不是客观分析，而是带有情绪的归责动作", "senses": [{"gloss": "v. 责怪，归咎于", "logic": "最直接的动作：指着人说「是你的错」", "en": "Don't blame yourself — the circumstances were beyond your control.", "zh": "别责怪自己——那些情况是你无法掌控的。"}, {"gloss": "n. 责任，罪责", "logic": "被归责之后背在身上的那个东西", "en": "The company tried to shift the blame onto its suppliers.", "zh": "公司试图把责任推给供应商。"}], "derivatives": [{"w": "blameless", "gloss": "无可指责的，清白的"}, {"w": "blameworthy", "gloss": "该受责备的，有过错的"}, {"w": "blame-shifting", "gloss": "推卸责任，甩锅"}], "examples": [{"en": "Don't blame yourself — the circumstances were beyond your control.", "zh": "别责怪自己——那些情况是你无法掌控的。", "source": "造句"}, {"en": "take the blame", "zh": "「承担责任，背锅」——高频短语，与 pass the blame（甩锅）相对。", "source": "高频搭配"}], "synonyms": [{"w": "accuse", "ipa": "/əˈkjuːz/", "gloss": "指控，控告（法律性强）", "note": "「指控（某人犯罪）」，比 blame 更正式、法律性强；accuse sb of murder（指控某人谋杀）"}, {"w": "criticize", "ipa": "/ˈkrɪtɪsaɪz/", "gloss": "批评，批判（指出错误）", "note": "「批评」，比 blame 更聚焦于指出错误和缺点，不一定追责；criticize a policy（批评政策）"}, {"w": "attribute to", "ipa": "/əˈtrɪbjuːt/", "gloss": "归因于（中性客观）", "note": "「归因于」，比 blame 中性，不含情绪色彩；attribute the failure to poor planning（将失败归因于计划不周）"}], "antonyms": [{"w": "praise", "note": "称赞"}, {"w": "credit", "note": "（把功劳）归于"}], "nuance": "blame sb for sth（为某事责怪某人）含情绪判断，attribute sth to sb/sth（把某事归因于）是客观中性的因果分析。accuse 比 blame 更正式、更严重，必须接具体罪名（accuse of theft）。"}, {"word": "brand", "hl": "b", "levels": ["托福"], "ipa": "/brænd/", "subgroup": "b", "meaning": "n. 品牌；类型；烙印  v. 给……打烙印；将……定性", "etymology": "古北欧语 brandr「火焰、燃烧的木头」，日耳曼同根，与 burn 同源。原义「烙铁烙印」——古代用火焰加热铁器在牲口身上打记号→ 识别标记→ 现代「品牌」。", "roots": [{"part": "brand（brandr）", "meaning": "火，烙印"}], "phonetics": "br- 连缀 + and /ænd/，/æ/ 嘴大张发短「啊」，与 grand、stand、hand 押韵。", "core": "烧红的铁块「滋啦」一声烫在牲口皮上、留下一个永远去不掉的记号——这就是 brand 的原始画面。不管是品牌、烙印还是「定性」，全都是「烫上一个洗不掉的标记」", "senses": [{"gloss": "n. 品牌，商标", "logic": "烫在牲口上的主人标记→商业上的识别标记→消费者心中的形象", "en": "The company spent millions building its brand before launching the product.", "zh": "公司在推出产品之前花费了数百万美元来打造品牌。"}, {"gloss": "n. 烙印（本义）", "logic": "最原始的：烧红的烙铁在皮上留下的焦痕", "en": "Each horse on the ranch had a brand on its flank to show ownership.", "zh": "牧场里每匹马臀部都有一个烙印来标识归属。"}, {"gloss": "v. 给……打烙印；把……定性为", "logic": "做「烙」这个动作→引申为给人/事贴上一个撕不掉的标签", "en": "The media quickly branded him as a troublemaker.", "zh": "媒体很快就给他贴上了肇事者的标签。"}], "derivatives": [{"w": "branding", "gloss": "品牌塑造，品牌推广"}, {"w": "brand-new", "gloss": "崭新的，全新的"}, {"w": "burn", "gloss": "燃烧（同源词，brand-来自火）"}], "examples": [{"en": "The company spent millions building its brand before launching the product.", "zh": "公司在推出产品之前花费了数百万美元来打造品牌。", "source": "造句"}, {"en": "brand new", "zh": "「崭新的」——字面是「从炉火中新取出的」，即全新未用。", "source": "高频搭配"}], "synonyms": [{"w": "trademark", "ipa": "/ˈtreɪdmɑːrk/", "gloss": "商标（法律意义上的品牌标识）", "note": "「商标」，法律意义上的品牌标识，比 brand 更具体；register a trademark（注册商标）"}, {"w": "label", "ipa": "/ˈleɪbl/", "gloss": "标签，厂牌（时尚/音乐多用）", "note": "「标签，品牌标」，时尚、音乐行业多用 label；a designer label（设计师品牌）"}, {"w": "mark", "ipa": "/mɑːrk/", "gloss": "标记，记号", "note": "「标记」，比 brand 更抽象，指任何识别性符号；a distinguishing mark（识别标记）"}], "antonyms": [], "nuance": "brand 是最广义的「品牌」，涵盖形象、价值观、消费者认知；trademark 是品牌的法律保护形式（注册商标）；label 多用于唱片、时尚行业，带有精品感；mark 是最泛化的「标记」，不专指商业品牌。"}, {"word": "base", "hl": "b", "levels": ["托福"], "ipa": "/beɪs/", "subgroup": "b", "meaning": "n. 基础；底部；基地；碱（化学）  v. 以……为基础  adj. 卑鄙的", "etymology": "拉丁语 basis「基础、底座」，源自希腊语 bainein（走，步），「脚步落点」→「底部、基础」。基础词族：basic（基础的）、database（数据库）、basement（地下室）、baseline（基准线）。", "roots": [{"part": "base（basis）", "meaning": "底部，基础"}], "phonetics": "分裂式 b + a_e：b + ase /eɪs/，词尾哑 e 把 a 拉长成 /eɪ/。与 case、face、place、race 押韵。", "core": "脚踩下去的那个支撑面——你站着不塌、房子不倒，靠的就是底下那块结实的东西。base 的核心就是「最下面那个撑住一切的底层」，地基、总部、根据全是从这里发散", "senses": [{"gloss": "n. 基础，根基；底座", "logic": "最物理的：大柱子底下的那个基座，撑住上面一切", "en": "The statue was mounted on a marble base.", "zh": "那座雕像安放在大理石底座上。"}, {"gloss": "n. 基地，总部", "logic": "组织「坐落」的地方→行动的根据地", "en": "The company is based in Shanghai but operates globally.", "zh": "该公司总部设在上海，但在全球经营。"}, {"gloss": "v. 以……为基础，基于", "logic": "把某物放在那个底层上→把它当根据", "en": "His novel is based on true events from his childhood.", "zh": "他的小说基于他童年的真实事件。"}, {"gloss": "adj. 卑鄙的，下贱的", "logic": "历史偶合，非同一感觉引申。此义源自拉丁语 bassus（低的），与「基础」义来源不同，仅拼写重合", "en": "He was accused of base motives in pursuing the deal.", "zh": "他被指控在追求这笔交易中动机卑鄙。"}], "derivatives": [{"w": "basic", "gloss": "基本的，基础的"}, {"w": "basis", "gloss": "根据，依据（抽象基础）"}, {"w": "basement", "gloss": "地下室"}, {"w": "baseline", "gloss": "基准线，基线"}], "examples": [{"en": "The company is based in Shanghai but operates globally.", "zh": "该公司总部设在上海，但在全球经营。", "source": "造句"}, {"en": "base on / based on", "zh": "「以……为依据」——学术写作和日常最高频的介词搭配之一。", "source": "高频搭配"}], "synonyms": [{"w": "foundation", "ipa": "/faʊnˈdeɪʃn/", "gloss": "基础，根基（强调稳固支撑）", "note": "「基础」义，比 base 更强调稳固性和支撑作用；lay the foundation（奠定基础）"}, {"w": "headquarters", "ipa": "/ˌhedˈkwɔːrtərz/", "gloss": "总部，司令部", "note": "「总部」义，比 base 更具体，指组织的主要办公地点"}, {"w": "basis", "ipa": "/ˈbeɪsɪs/", "gloss": "根据，依据（抽象基础）", "note": "「根据，依据」义，与 base 同根，but basis 更抽象（on the basis of evidence）"}], "antonyms": [{"w": "top", "note": "顶部"}, {"w": "apex", "note": "顶点，最高点"}], "nuance": "base 最通用（military base、base salary），foundation 强调「奠定的根基」（lay a foundation），basis 多用于抽象的依据（on a daily basis、legal basis）。动词「be based on」（以……为根据）几乎无可替代。"}, {"word": "bold", "hl": "b", "levels": ["托福"], "ipa": "/boʊld/", "subgroup": "b", "meaning": "adj. 大胆的；醒目的；（字体）粗体的", "etymology": "古英语 beald「勇敢、无畏」，日耳曼同根，与德语 bald（很快地）同源。原义「勇敢、无畏」，扩展到「颜色/线条突出显眼」和「印刷粗体」。", "roots": [{"part": "bold（beald）", "meaning": "勇敢，突出"}], "phonetics": "b + old /oʊld/，/oʊ/ 是美式双元音「欧」，与 cold、gold、hold、told 押韵。", "core": "不缩、不躲、不藏着掖着的「站出来」感——一个人敢迈出去、一笔线条敢画粗、一个色敢用跳的，全是同一个「不缩着」的身体感觉", "senses": [{"gloss": "adj. 大胆的，敢于冒险的", "logic": "身体往里缩的反面：迈出去、不害怕", "en": "It was a bold move to resign without a backup plan.", "zh": "在没有后备计划的情况下辞职，这是个大胆的举动。"}, {"gloss": "adj. 醒目的，突出的（颜色/设计）", "logic": "不缩在背景里→跳出来、抢眼睛", "en": "The designer chose bold colors to make the logo stand out.", "zh": "设计师选用了醒目颜色让标志脱颖而出。"}, {"gloss": "adj.（字体）粗体的", "logic": "笔画不细不缩→加粗、重笔触", "en": "Use bold text for all section headings in the document.", "zh": "文档中所有章节标题使用粗体字。"}], "derivatives": [{"w": "boldly", "gloss": "大胆地，醒目地"}, {"w": "boldness", "gloss": "大胆，勇敢"}, {"w": "embolden", "gloss": "使有胆量，鼓励"}], "examples": [{"en": "It was a bold move to resign without a backup plan.", "zh": "在没有后备计划的情况下辞职，这是个大胆的举动。", "source": "造句"}, {"en": "bold colors / bold font", "zh": "「鲜艳的颜色 / 粗体字」——设计和排版的高频用法。", "source": "高频搭配"}], "synonyms": [{"w": "daring", "ipa": "/ˈdeərɪŋ/", "gloss": "大胆冒险的（强调甘冒风险）", "note": "「大胆冒险的」，比 bold 更强调甘冒风险；a daring escape（大胆逃跑）"}, {"w": "audacious", "ipa": "/ɔːˈdeɪʃəs/", "gloss": "胆大妄为的（语气最强，有时含批评）", "note": "「胆大妄为的」，比 bold 语气更强，有时含批评意味；an audacious claim（大胆的断言）"}, {"w": "striking", "ipa": "/ˈstraɪkɪŋ/", "gloss": "醒目的，引人注目的", "note": "「醒目的、引人注目的」，对应 bold 的「视觉突出」义；a striking design（醒目设计）"}], "antonyms": [{"w": "timid", "note": "胆怯的"}, {"w": "subtle", "note": "低调的，微妙的（视觉义）"}], "nuance": "bold 最通用，可褒义（a bold leader）或中性（bold colors）；daring 强调敢于冒险的勇气；audacious 偏向「超乎常规的大胆」，语气更强，有时暗含批评（audacious lies 厚颜无耻的谎言）；striking 专指视觉上的突出。"}, {"word": "burst", "hl": "b", "levels": ["六级"], "ipa": "/bɜːrst/", "subgroup": "b", "meaning": "v. 爆裂；突然冲出；充满（以至要爆）  n. 爆发；一阵", "etymology": "古英语 berstan「破裂、爆炸」，日耳曼同根，与德语 bersten 同源。burst 是不规则动词：burst–burst–burst（原形、过去式、过去分词相同）。", "roots": [{"part": "burst（berstan）", "meaning": "破裂，爆炸"}], "phonetics": "b + ur /ɜːr/ + st，/ɜːr/ 是「啊儿」的卷舌音（美式），与 first、thirst、worst 押韵。", "tip": "burst 三态同形：The pipe burst（过去式）/ The pipe has burst（过去分词），不要加 -ed。", "core": "一个被撑到极限的东西「砰」一下炸开——里头的东西瞬间涌出来。核心是「压力积累到临界点→瞬间释放」，气球爆炸、突然大哭、一阵掌声全是同一个爆发节律", "senses": [{"gloss": "v. 爆裂，破裂", "logic": "最物理的：被里面的压力撑破，内容物冲出", "en": "The water pipe burst during the freeze and flooded the basement.", "zh": "水管在冰冻期间爆裂，淹了地下室。"}, {"gloss": "v. 突然爆发（情绪/动作），冲出", "logic": "情绪/人在临界点破门而出→不是物理的爆，是行为的「爆」", "en": "She burst into tears when she heard the news.", "zh": "听到消息时她突然哭了起来。"}, {"gloss": "v. 充满……（以至于要爆出来）", "logic": "里头的东西多到快撑破外皮", "en": "The room was bursting with excited fans waiting for the show.", "zh": "房间里挤满了等待演出的兴奋粉丝。"}, {"gloss": "n. 爆发，一阵（短促强烈的活动）", "logic": "爆裂那个瞬间的名词化→短而猛的一次释放", "en": "After a brief burst of enthusiasm, he lost interest in the project.", "zh": "一阵短暂的热情爆发后，他对这个项目失去了兴趣。"}], "derivatives": [{"w": "outburst", "gloss": "爆发，迸发（情绪/声音）"}, {"w": "bursting", "gloss": "挤满的，充满的"}, {"w": "sunburst", "gloss": "阳光突现；旭日图案"}], "examples": [{"en": "She burst into tears when she heard the news.", "zh": "听到消息时她突然哭了起来。", "source": "造句"}, {"en": "a burst of energy / a burst of applause", "zh": "「一阵能量爆发 / 一阵掌声」——名词义高频搭配。", "source": "高频搭配"}], "synonyms": [{"w": "explode", "ipa": "/ɪkˈsploʊd/", "gloss": "爆炸（更剧烈，更有破坏性）", "note": "「爆炸」，比 burst 更剧烈、更有破坏性；比喻也用于情绪（explode with anger）"}, {"w": "erupt", "ipa": "/ɪˈrʌpt/", "gloss": "喷发，突然爆发（压力积累后释放）", "note": "「（火山）爆发；突然爆发」，比 burst 更强调积累后的突然释放；erupt in laughter（突然爆笑）"}, {"w": "surge", "ipa": "/sɜːrdʒ/", "gloss": "涌现，急增（最平稳无破坏性）", "note": "「涌现、急增」，比 burst 更平稳，强调量的快速上升；a surge in demand（需求激增）"}], "antonyms": [{"w": "contain", "note": "控制，抑制"}, {"w": "implode", "note": "向内塌陷"}], "nuance": "burst 强调「突然的外向爆破」（burst into laughter），explode 是最剧烈的爆炸，erupt 强调压力积累后的突然释放（erupt in anger），surge 是「涌现/急升」，最平和无破坏性（a surge of hope）。"}, {"word": "broad", "hl": "b", "levels": ["六级"], "ipa": "/brɔːd/", "subgroup": "b", "meaning": "adj. 宽广的；广泛的；（口音）浓重的  adv. 完全地（broad awake 完全清醒）", "etymology": "古英语 brād「宽阔的」，日耳曼同根，与德语 breit 同源。派生词：broaden（拓宽）、broadly（大体上）、broadcast（播送，字面「广泛撒播」）。", "roots": [{"part": "broad（brād）", "meaning": "宽阔的"}], "phonetics": "br- + oa /ɔː/ + d，oa 在此读 /ɔː/（如 road、load 读 /oʊ/ 不同）——broad 是 oa=/ɔː/ 的少数例外，须单记。", "tip": "broad 的 oa 读 /ɔː/（不是 /oʊ/）——与 road/load 的发音不同，是特例。", "core": "两条手臂从胸前向两边「刷」一下张开的那个空间感——从左到右跨度很大，不窄、不拘、不局限在一个点上。这就是 broad，一种「横向展开、不设边界」的张开感", "senses": [{"gloss": "adj. 宽广的，宽阔的", "logic": "横向张开的物理宽度", "en": "We walked along the broad avenue lined with chestnut trees.", "zh": "我们沿着两旁种满栗树的宽阔大道散步。"}, {"gloss": "adj. 广泛的，覆盖范围大的", "logic": "不是一条线，是一个面——覆盖面广", "en": "The study takes a broad view of the factors contributing to climate change.", "zh": "这项研究从广泛角度审视导致气候变化的各种因素。"}, {"gloss": "adj.（口音）浓重的", "logic": "口音「展开」得厉害→一听就知道从哪儿来，特别明显", "en": "He spoke with a broad Scottish accent that was hard to follow.", "zh": "他说话带有浓重的苏格兰口音，很难听懂。"}], "derivatives": [{"w": "broaden", "gloss": "拓宽，扩大"}, {"w": "broadly", "gloss": "大体上，广泛地"}, {"w": "broadcast", "gloss": "播送（broad广泛+cast抛撒）"}, {"w": "breadth", "gloss": "宽度，广度（名词形式）"}], "examples": [{"en": "The study takes a broad view of the factors contributing to climate change.", "zh": "这项研究从广泛角度审视导致气候变化的各种因素。", "source": "造句"}, {"en": "in broad daylight", "zh": "「在光天化日之下」——高频习语，强调在众目睽睽的公开场合。", "source": "高频搭配"}], "synonyms": [{"w": "wide", "ipa": "/waɪd/", "gloss": "宽的（偏物理宽度，更口语）", "note": "「宽的」，比 broad 更口语，多描述物理宽度；a wide road（宽路）。broad 更常用于抽象（a broad range）"}, {"w": "extensive", "ipa": "/ɪkˈstensɪv/", "gloss": "广泛的，大规模的（强调覆盖面大）", "note": "「广泛的、大规模的」，比 broad 更正式，强调覆盖面大；extensive research（大量研究）"}, {"w": "comprehensive", "ipa": "/ˌkɒmprɪˈhensɪv/", "gloss": "全面的（强调无一遗漏）", "note": "「全面的」，比 broad 更强调「无一遗漏」；a comprehensive plan（全面计划）"}], "antonyms": [{"w": "narrow", "note": "狭窄的；局限的"}, {"w": "limited", "note": "有限的"}], "nuance": "broad 描述「范围大、覆盖广」（broad knowledge）；wide 偏具体物理宽度（wide river）；extensive 强调大规模投入（extensive damage）；comprehensive 强调「涵盖所有方面，不留死角」（comprehensive coverage）。"}, {"word": "brief", "hl": "b", "levels": ["托福"], "ipa": "/briːf/", "subgroup": "b", "meaning": "adj. 简短的；短暂的  n. 摘要；任务说明  v. 向……简报", "etymology": "拉丁语 brevis「短的」，法语 bref 传入英语。同根词：abbreviate（缩写）= ab-（离开）+ brevi（短）+ -ate；brevity（简洁）。", "roots": [{"part": "brief（brevis）", "meaning": "短"}], "phonetics": "br- + ie /iː/ + f，ie 读 /iː/，符合「i before e」规律（不在 c 后）。与 grief、chief、leaf 押韵。", "core": "一刀切下去把多余的都去掉、只留下最要紧的那几根骨头——brief 的核心感觉就是「把一堆东西压缩到最短还能说清楚」，像一个提纲挈领的摘要或一次干脆利落的通报", "senses": [{"gloss": "adj. 简短的，简洁的", "logic": "把一根东西切短→语言上砍掉多余的话", "en": "The manager gave a brief overview of the project before handing out the brief.", "zh": "经理在分发任务说明前，对项目做了简短概述。"}, {"gloss": "adj. 短暂的（时间）", "logic": "时间被「切短」→一会儿就没了", "en": "There was a brief pause before the next speaker began.", "zh": "下一位发言者开始前有一个短暂的停顿。"}, {"gloss": "n. 摘要，概要；任务说明", "logic": "把一大堆信息「压缩」成的一页纸", "en": "The lawyer prepared a legal brief summarizing the key arguments.", "zh": "律师准备了一份法律摘要，概括了关键论点。"}, {"gloss": "v. 向……做简报，通报", "logic": "把压缩好的要点「喂」给别人", "en": "The general was briefed on the latest intelligence before the operation.", "zh": "行动前将军听取了最新情报简报。"}], "derivatives": [{"w": "brevity", "gloss": "简洁，短暂（名词）"}, {"w": "briefly", "gloss": "简短地，简要地"}, {"w": "abbreviate", "gloss": "缩写，缩短（ab-离开+brevi-短）"}, {"w": "briefing", "gloss": "简报会，情况介绍"}], "examples": [{"en": "The manager gave a brief overview of the project before handing out the brief.", "zh": "经理在分发任务说明前，对项目做了简短概述。", "source": "造句"}, {"en": "in brief", "zh": "「简言之」——论文、演讲总结段落的高频连接语。", "source": "高频搭配"}], "synonyms": [{"w": "concise", "ipa": "/kənˈsaɪs/", "gloss": "简洁精练的（褒义，删去冗余抓核心）", "note": "「简洁精练（褒义）」，比 brief 更强调「删去冗余抓住核心」；a concise report（简练的报告）"}, {"w": "short", "ipa": "/ʃɔːrt/", "gloss": "短的（最口语，可指时间/长度）", "note": "最口语的「短」，可指时间、长度；a short speech（简短演讲）"}, {"w": "succinct", "ipa": "/səkˈsɪŋkt/", "gloss": "言简意赅的（比 concise 更书面）", "note": "「言简意赅」，比 concise 更书面，常见于正式写作评语；a succinct answer（简明答案）"}], "antonyms": [{"w": "lengthy", "note": "冗长的"}, {"w": "prolonged", "note": "持续很长时间的"}], "nuance": "brief 中性描述「时间短或篇幅短」（a brief pause），concise 是褒义词，专指「精炼不含废话」，succinct 比 concise 更正式，三者在「简短」义上语气依次增强（short < brief < concise/succinct）。"}, {"word": "bubble", "hl": "bb", "levels": ["托福"], "ipa": "/ˈbʌbl/", "subgroup": "bb", "meaning": "n. 气泡；泡沫（经济）；幻想  v. 冒泡；（情绪）涌动", "etymology": "中古英语 bobel，拟声词，模仿气泡破裂的声音「bu-bu-bu」。bb 双写锁住前面的短元音 /ʌ/（若只有一个 b，则变成开音节长音）。金融「泡沫经济」的比喻最早见于17世纪南海泡沫事件（South Sea Bubble）。", "roots": [{"part": "bubble（拟声）", "meaning": "气泡破裂声"}], "phonetics": "重音在首 BUB-ble，bb 只读一个 /b/，-ble 是辅音+le 音节（/bl/）。/ʌ/ 是中元音，如 cup/love。", "core": "一个薄薄的圆球浮在空气或水里，亮晶晶的，轻轻一碰就「啪」没了——bubble 的核心就是「外表圆鼓鼓、里头空、一戳就破」的那种脆弱饱满感", "senses": [{"gloss": "n. 气泡，泡沫", "logic": "最直观：水里或空气中的那个透明圆球", "en": "The child watched the soap bubbles float up into the sky.", "zh": "孩子看着肥皂泡飘向天空。"}, {"gloss": "n. 泡沫（经济），虚假繁荣", "logic": "从易碎空气泡→越吹越大但里头没东西的虚假繁荣→一戳就崩", "en": "The tech bubble burst in 2000, wiping out trillions in market value.", "zh": "互联网泡沫于2000年破裂，蒸发了数万亿美元市值。"}, {"gloss": "n. 幻想，幻影", "logic": "气泡的虚→不真实的东西，看着有其实无", "en": "The scandal burst the bubble of his perfect public image.", "zh": "丑闻戳破了他完美公众形象的泡沫。"}, {"gloss": "v. 冒泡；（情绪）涌动", "logic": "气从水里咕嘟咕嘟冒上来→情绪从心底往上涌", "en": "Excitement bubbled up inside her as the concert was about to start.", "zh": "演唱会即将开始时，兴奋之情在她心底涌动。"}], "derivatives": [{"w": "bubbly", "gloss": "多泡的；活泼开朗的"}, {"w": "bubblegum", "gloss": "泡泡糖"}, {"w": "bubble-wrap", "gloss": "气泡膜（缓冲包装材料）"}], "examples": [{"en": "The tech bubble burst in 2000, wiping out trillions in market value.", "zh": "互联网泡沫于2000年破裂，蒸发了数万亿美元市值。", "source": "造句"}, {"en": "bubble up", "zh": "「（情绪/想法）涌上来」——情感义高频短语动词；excitement bubbled up（兴奋之情涌上心头）。", "source": "高频搭配"}], "synonyms": [{"w": "foam", "ipa": "/foʊm/", "gloss": "泡沫（整体泡沫状，如海浪泡沫）", "note": "「泡沫」，比 bubble 更指整体泡沫状，如海浪泡沫；foam mattress（泡沫床垫）"}, {"w": "froth", "ipa": "/frɒθ/", "gloss": "浮沫，泡沫（液体表面，可指空洞无物）", "note": "「（液体表面的）浮沫」，比 bubble 更指表面轻浮的东西，也比喻「没有实质内容」；full of froth（空洞无物）"}, {"w": "illusion", "ipa": "/ɪˈluːʒn/", "gloss": "幻觉，假象（对应「一戳即破」义）", "note": "「幻想」义的近义词，bubble 比喻「一戳即破的幻象」时与 illusion 接近"}], "antonyms": [{"w": "substance", "note": "实质，内容（对应「泡沫/幻想」义）"}], "nuance": "bubble 强调单个气泡，foam 是整体泡沫状（shaving foam），froth 多指不稳定的表面浮沫（frothy cappuccino），引申义均可指「虚而不实的东西」，但 bubble 的金融「泡沫」用法最固定（housing bubble）。"}, {"word": "ribbon", "hl": "bb", "levels": ["托福"], "ipa": "/ˈrɪbən/", "subgroup": "bb", "meaning": "n. 丝带，缎带；（机器上的）色带；（细长的）条状物", "etymology": "中古荷兰语 ringhband「环形带子」，16世纪进入英语，字母 bb 是古英语/法语借词习惯拼写的遗留。现代延伸义：计算机工具栏（ribbon interface）、勋带（military ribbon）。", "roots": [{"part": "ribbon（ringhband）", "meaning": "环形带，条带"}], "phonetics": "重音在首 RIB-bon，bb 只读一个 /b/，-on 弱读 /ən/。注意 i 读短元音 /ɪ/。", "core": "一根细长的、软软的、光滑的布条，捏在指尖滑过去有点凉——你可以把它系成蝴蝶结、绕在礼物上、或者让它飘着。ribbon 的核心就是「丝滑细长的软条」，所有含义都是这个形状的延伸", "senses": [{"gloss": "n. 丝带，缎带", "logic": "最直白的：柔软细长的装饰用带子", "en": "She tied a red ribbon around the gift box.", "zh": "她在礼盒上系了一条红色丝带。"}, {"gloss": "n.（细长的）条状物，带状物", "logic": "丝带的形状→任何又细又长像带子一样的东西", "en": "The road narrowed to a ribbon of gravel winding through the hills.", "zh": "道路变成了一条蜿蜒穿过山丘的碎石带。"}, {"gloss": "n.（机器上的）色带；绶带，勋带", "logic": "细长带在不同领域的专用：打字机色带、军人胸口勋带", "en": "The general's uniform was decorated with several campaign ribbons.", "zh": "将军的制服上装饰着几枚战役勋带。"}], "derivatives": [{"w": "ribbon-like", "gloss": "带状似的，像飘带的"}, {"w": "ribbon-cutting", "gloss": "剪彩仪式"}], "examples": [{"en": "She tied a red ribbon around the gift box.", "zh": "她在礼盒上系了一条红色丝带。", "source": "造句"}, {"en": "cut the ribbon", "zh": "「剪彩（开幕式）」——庆典仪式的固定表达。", "source": "高频搭配"}], "synonyms": [{"w": "band", "ipa": "/bænd/", "gloss": "带子，条带（通用，不限于丝质）", "note": "「带子」，比 ribbon 更通用，不限于丝质；rubber band（橡皮筋）、headband（头带）"}, {"w": "strip", "ipa": "/strɪp/", "gloss": "条状物（强调细长形状）", "note": "「条状物」，比 ribbon 更强调细长形状，不含丝质含义；a strip of paper（纸条）"}, {"w": "tape", "ipa": "/teɪp/", "gloss": "胶带，卷带（注重粘合功能）", "note": "「胶带、卷带」，比 ribbon 更注重粘合功能；adhesive tape（胶带）"}], "antonyms": [], "nuance": "ribbon 专指装饰性细长带（如礼品缎带、勋带），band 是最通用的「环形带/条带」，strip 强调细长形状（不一定软），tape 强调可粘贴或卷绕功能。"}, {"word": "rubber", "hl": "bb", "levels": ["六级"], "ipa": "/ˈrʌbər/", "subgroup": "bb", "meaning": "n. 橡胶；（英式）橡皮擦  adj. 橡胶制的", "etymology": "18世纪英国化学家约瑟夫·普里斯特利（Joseph Priestley）发现天然橡胶能「擦去」铅笔痕迹，于是称之为 rubber——来自动词 rub（摩擦）+ -er（做……动作的东西）。bb 锁住前面的短元音 /ʌ/。", "roots": [{"part": "rub", "meaning": "摩擦"}, {"part": "-ber（-er）", "meaning": "工具/物质后缀"}], "phonetics": "重音在首 RUB-ber，bb 读单个 /b/，-ber 弱读 /bər/。/ʌ/ 是中元音（cup、luck、blood）。", "tip": "英式英语中「橡皮擦」叫 rubber，美式叫 eraser——考试用英式时注意。", "core": "一个能「擦掉东西」的材料——rub（摩擦） + er（工具）。最早的 rubber 就是因为能擦铅笔字而得名。它的手感是弹弹的   const rules = SUBG.map((s,i)=>{
    const c = SGCOLORS[i%SGCOLORS.length];
    return `<div class="rule" style="border-left:5px solid ${c}"><b style="color:${c}">${s.label}</b>${s.desc||''}</div>`;
  }).join('');
  const rhymes = (G.rhymeChains && G.rhymeChains.length)
    ? `<div class="rhymes"><h3>🎵 同韵顺口溜 · 点单词听发音，成串背最快</h3>${
        G.rhymeChains.map(c=>`<div class="chain"><span class="lab">${c.label}</span>${
          c.words.map(w=>`<span class="chip" onclick="say('${w}')">${w}</span>`).join('')
        }</div>`).join('')}</div>`
    : '';
  h.innerHTML = `
    <div class="combo"><span class="big">${G.combo}</span><span class="snd">${G.sound}</span></div>
    <h1>${G.title} · ${G.subtitle||''}</h1>
    <p class="intro">${G.intro}</p>
    <div class="rules">${rules}</div>
    ${rhymes}`;
}

// ---------- filters
function renderFilters(){
  const lvs = ['全部','六级','托福','GRE拓展','基础'];
  document.getElementById('lvf').innerHTML = lvs.map(l=>
    `<span class="f${l===curLv?' on':''}" onclick="setLv('${l}')">${l}</span>`).join('');
  const sgs = [['全部','全部'], ...SUBG.map(s=>[s.tag||s.label, s.key])];
  document.getElementById('sgf').innerHTML = sgs.map(([t,v])=>
    `<span class="f${v===curSg?' on':''}" onclick="setSg('${v}')">${t}</span>`).join('');
}
function setLv(l){curLv=l;renderFilters();renderGrid();}
function setSg(s){curSg=s;renderFilters();renderGrid();}

// ---------- speech：优先自然美式女声
let VOICE=null, VOICES=[];
// 各浏览器/系统里公认自然的美式女声，按优先级排序
const PREF=[
  'Google US English',                 // Chrome：自然女声
  'Microsoft Aria Online (Natural) - English (United States)',
  'Microsoft Jenny Online (Natural) - English (United States)',
  'Microsoft Ava Online (Natural) - English (United States)',
  'Microsoft Aria','Microsoft Jenny','Microsoft Michelle',
  'Ava (Premium)','Ava (Enhanced)','Ava',   // macOS Siri 女声
  'Samantha',                          // macOS 经典美式女声
  'Allison','Susan','Nicky','Zoe','Karen','Victoria'
];
const MALE=/(alex|daniel|fred|tom|david|mark|male|aaron|arthur|gordon|oliver|rishi|junior|ralph)/i;
function usPool(){
  VOICES = speechSynthesis.getVoices()||[];
  let us = VOICES.filter(v=>/en[-_]US/i.test(v.lang)||/United States/i.test(v.name));
  if(!us.length) us = VOICES.filter(v=>/^en/i.test(v.lang));
  return us;
}
function pickVoice(){
  const pool=usPool(); if(!pool.length) return;
  VOICE=null;
  for(const n of PREF){ const h=pool.find(v=>v.name===n)||pool.find(v=>v.name.indexOf(n)===0); if(h){VOICE=h;break;} }
  if(!VOICE) VOICE = pool.find(v=>/(samantha|ava|allison|susan|nicky|zoe|karen|victoria|aria|jenny|michelle|female|google us)/i.test(v.name))
                   || pool.find(v=>!MALE.test(v.name)) || pool[0];
  fillVoiceSel(pool);
}
function fillVoiceSel(pool){
  const s=document.getElementById('voiceSel'); if(!s) return;
  s.innerHTML = pool.map(v=>{
    const nm=v.name.replace(/ - English.*/,'').replace(/Online \(Natural\)/,'✨');
    return `<option value="${v.name}"${VOICE&&v.name===VOICE.name?' selected':''}>🎙 ${nm}</option>`;
  }).join('');
}
document.getElementById('voiceSel').addEventListener('change',e=>{
  VOICE = VOICES.find(v=>v.name===e.target.value)||VOICE; say(G.combo==='aw'?'awesome':'natural');
});
if('onvoiceschanged' in speechSynthesis) speechSynthesis.onvoiceschanged = pickVoice;
pickVoice();
function say(w){
  try{
    if(!VOICE) pickVoice();
    const u = new SpeechSynthesisUtterance(w);
    u.lang='en-US'; if(VOICE) u.voice=VOICE; u.rate=.95; u.pitch=1.0;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }catch(e){}
}

// 高亮单词里的目标拼写：优先用该词自带的 hl（音位页里每词各自的拼写），否则用组的 combo
function hlWord(word, spell){
  const c = (spell||'').replace(/[.*+?^${}()|[\]\\\/·\s]/g,'');  // 只取干净字母做高亮，去掉 / · 空格等
  if(!c) return word;
  try{ return word.replace(new RegExp('('+c+')','i'), '<span class="hl">$1</span>'); }
  catch(e){ return word; }
}

// ---------- card
function card(w){
  const tags = (w.levels||[]).map(l=>`<span class="tag ${LVCLASS[l]||''}">${l}</span>`).join('');
  const roots = (w.roots||[]).map(r=>`<span class="root"><b>${r.part}</b> ${r.meaning}</span>`).join('');
  const exs = (w.examples||[]).map(e=>{
    const fam = /造句/.test(e.source)? '' : ' famous';
    return `<div class="ex${fam}"><div class="en">${e.en}</div><div class="zh">${e.zh}</div><span class="src">— ${e.source}</span></div>`;
  }).join('');
  const syns = (w.synonyms||[]).map(s=>
    `<div class="lex"><b class="lw" onclick="event.stopPropagation();say('${s.w}')">${s.w}</b>`+
    `${s.ipa?` <span class="lip">${s.ipa}</span>`:''}${s.note?` <span class="ln">— ${s.note}</span>`:''}</div>`).join('');
  const ants = (w.antonyms||[]).map(a=>
    `<span class="antchip" onclick="event.stopPropagation();say('${a.w}')">${a.w}${a.note?` <i>${a.note}</i>`:''}</span>`).join('');
  const lexSec = (syns||ants||w.nuance)
    ? `<div class="sec"><span class="l">🔗 近义词辨析 · 反义词</span>`+
      `${syns?`<div class="lexgroup"><span class="lextag syn">近义</span><div class="lexlist">${syns}</div></div>`:''}`+
      `${ants?`<div class="lexgroup"><span class="lextag ant">反义</span><div class="lexlist antline">${ants}</div></div>`:''}`+
      `${w.nuance?`<div class="nuance">🎯 ${w.nuance}</div>`:''}</div>`
    : '';
  const senses = (w.senses||[]).map(s=>
    `<div class="sense"><div class="s-gloss"><b>${s.gloss}</b>${s.logic?` <span class="s-logic">← ${s.logic}</span>`:''}</div>`+
    `${s.en?`<div class="s-ex"><span class="s-en">${s.en}</span> <span class="s-zh">${s.zh||''}</span></div>`:''}</div>`).join('');
  const senseSec = (w.core||senses)
    ? `<div class="sec"><span class="l">🧠 一词多义 · 核心意象串解</span>`+
      `${w.core?`<div class="coreimg">🎯 核心感觉：${w.core}</div>`:''}${senses}</div>`
    : '';
  const isU = unfam.has(w.word);
  const so = sgOf(w.subgroup);
  return `<div class="card${isU?' unfamiliar':''}" data-w="${w.word}" onclick="if(document.body.classList.contains('mem'))this.classList.toggle('reveal')">
    <span class="sub-tag" style="background:${sgColor(w.subgroup)}">${so?(so.tag||so.label):''}</span>
    <div class="whead">
      <span class="word">${hlWord(w.word, w.hl || G.combo)}</span>
      <span class="ipa">${w.ipa}</span>
      <button class="say" onclick="event.stopPropagation();say('${w.word}')" title="朗读">🔊</button>
    </div>
    <div class="tags">${tags}</div>
    <div class="mean">${w.meaning}</div>
    ${senseSec}
    ${w.etymology?`<div class="sec"><span class="l">🏛 造词来源 · 词源故事</span>${w.etymology}</div>`:''}
    ${roots?`<div class="sec"><span class="l">🧩 词根词缀</span><div class="roots">${roots}</div></div>`:''}
    ${w.phonetics?`<div class="sec"><span class="l">🗣 发音规律</span>${w.phonetics}</div>`:''}
    ${w.tip?`<div class="sec"><span class="l">💡 记忆钩子</span><div class="tip">${w.tip}</div></div>`:''}
    ${exs?`<div class="sec"><span class="l">✍️ 造句 · 名著/影视例句</span>${exs}</div>`:''}
    ${lexSec}
    <label class="check" onclick="event.stopPropagation()">
      <input type="checkbox" ${isU?'checked':''} onchange="toggleUnfam('${w.word}',this.checked)"> 🔺 标记不熟悉
    </label>
  </div>`;
}

function match(w){
  if(onlyUnfam && !unfam.has(w.word)) return false;
  if(curLv!=='全部' && !(w.levels||[]).includes(curLv)) return false;
  if(curSg!=='全部' && w.subgroup!==curSg) return false;
  if(curQ){
    const s=(w.word+' '+w.meaning).toLowerCase();
    if(!s.includes(curQ.toLowerCase())) return false;
  }
  return true;
}

function renderGrid(){
  const list = G.words.filter(match);
  // 不熟悉的置顶（稳定排序，保持各自原有相对顺序）
  list.sort((a,b)=>(unfam.has(b.word)?1:0)-(unfam.has(a.word)?1:0));
  const g = document.getElementById('grid');
  g.innerHTML = list.length? list.map(card).join('') : '<div class="empty">没有匹配的单词，换个筛选试试～</div>';
  updateUnfamCount();
}

function toggleUnfam(word, on){
  if(on) unfam.add(word); else unfam.delete(word);
  localStorage.setItem(KEY, JSON.stringify([...unfam]));
  const c = document.querySelector(`.card[data-w="${word}"]`);
  if(c) c.classList.toggle('unfamiliar', on);   // 立即变色，卡片原位不跳动；置顶在下次渲染/筛选时生效
  updateUnfamCount();
}
function updateUnfamCount(){
  const n = G.words.filter(w=>unfam.has(w.word)).length;
  const el = document.getElementById('unfamN');
  if(el) el.textContent = n;
}

document.getElementById('q').addEventListener('input',e=>{curQ=e.target.value;renderGrid();});
document.getElementById('unfamBtn').addEventListener('click',e=>{
  onlyUnfam=!onlyUnfam;
  e.currentTarget.classList.toggle('on',onlyUnfam);
  renderGrid();
});
document.getElementById('memBtn').addEventListener('click',e=>{
  document.body.classList.toggle('mem');
  e.target.classList.toggle('on');
  e.target.textContent = document.body.classList.contains('mem')?'🧠 记忆模式(开)·悬停显形':'🧠 记忆模式';
});

// ---------- 测验：英文 → 中文四选一（覆盖当前筛选到的全部单词）
let quiz=null;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
// 测验池 = 本页(筛选后)全部词 + 它们的同义词 + 衍生词（去重）
function quizPool(){
  const base = G.words.filter(match);
  const items=[]; const seen=new Set();
  const add=(word,ipa,meaning)=>{const k=(word||'').toLowerCase();
    if(!word||!meaning||seen.has(k))return; seen.add(k); items.push({word,ipa:ipa||'',meaning});};
  base.forEach(w=>{
    add(w.word,w.ipa,w.meaning);
    (w.synonyms||[]).forEach(s=>add(s.w,s.ipa,s.gloss||s.note));
    (w.derivatives||[]).forEach(dv=>add(dv.w,dv.ipa,dv.gloss||dv.note));
  });
  return items;
}
function startQuiz(src){
  const pool = src || quizPool();
  if(pool.length<4){ alert('至少要有 4 个词才能测验，请先放宽上方筛选～'); return; }
  quiz={list:shuffle(pool), i:0, score:0, wrong:[], done:false, next:null, pool:quizPool()};
  document.getElementById('quizOv').style.display='flex';
  renderQ();
}
function renderQ(){
  quiz.done=false; quiz.next=null;
  const q=quiz.list[quiz.i];
  const others=(quiz.pool||[]).filter(w=>w.meaning!==q.meaning);
  const opts=shuffle([q.meaning, ...shuffle(others).slice(0,3).map(w=>w.meaning)]);
  const K=['1','2','3','4'];
  document.getElementById('qbox').innerHTML=`
    <div class="qtop"><span>第 ${quiz.i+1} / ${quiz.list.length} 题 · 已答对 ${quiz.score}</span>
      <span style="cursor:pointer" onclick="closeQuiz()">✕ 关闭</span></div>
    <div class="qbar2"><i style="width:${quiz.i/quiz.list.length*100}%"></i></div>
    <div class="qword">${q.word} <button class="say" style="vertical-align:middle;width:30px;height:30px;font-size:14px" onclick="say('${q.word}')">🔊</button></div>
    <div class="qipa">${q.ipa}</div>
    <div class="qopts" id="qopts">${opts.map((o,k)=>
      `<button class="qopt" data-m="${encodeURIComponent(o)}" onclick="answer(this,'${encodeURIComponent(q.meaning)}')">
        <span class="k">${K[k]}</span><span>${o}</span></button>`).join('')}</div>
    <div class="hint">按 1–4 键作答 · 回车进入下一题</div>`;
  say(q.word);
}
function answer(el, correctEnc){
  if(quiz.done) return; quiz.done=true;
  const correct=decodeURIComponent(correctEnc);
  const chosen=decodeURIComponent(el.dataset.m);
  if(chosen===correct) quiz.score++; else quiz.wrong.push(quiz.list[quiz.i]);
  document.querySelectorAll('#qopts .qopt').forEach(b=>{
    const m=decodeURIComponent(b.dataset.m);
    if(m===correct) b.classList.add('right');
    else if(b===el) b.classList.add('wrong');
    else b.classList.add('dim');
    b.style.pointerEvents='none';
  });
  const btn=document.createElement('button');
  btn.className='qnext';
  btn.textContent = quiz.i<quiz.list.length-1 ? '下一题 →' : '看结果 →';
  btn.onclick=nextQ;
  document.getElementById('qbox').appendChild(btn);
  quiz.next=btn;
}
function nextQ(){
  if(quiz.i<quiz.list.length-1){ quiz.i++; renderQ(); } else endQuiz();
}
function endQuiz(){
  const tot=quiz.list.length, pct=Math.round(quiz.score/tot*100);
  const wrongHtml = quiz.wrong.length
    ? quiz.wrong.map(w=>`<div class="r"><b>${w.word}</b> ${w.ipa} — ${w.meaning}</div>`).join('')
    : '<div class="r">全部答对，太强了！🎉</div>';
  const wrongCopy = quiz.wrong.slice();
  document.getElementById('qbox').innerHTML=`
    <div class="qend">
      <div class="qtop" style="justify-content:flex-end"><span style="cursor:pointer" onclick="closeQuiz()">✕ 关闭</span></div>
      <div>本轮得分</div><div class="qscore">${quiz.score}/${tot}</div>
      <div style="color:var(--muted)">正确率 ${pct}%</div>
      <div class="qwrong"><div style="color:var(--exc);font-weight:700;margin-bottom:4px">错题（${quiz.wrong.length}）</div>${wrongHtml}</div>
      <div id="qendBtns"></div>
    </div>`;
  const box=document.getElementById('qendBtns');
  if(wrongCopy.length){
    const b1=document.createElement('button'); b1.className='qnext'; b1.textContent='只测这些错题';
    b1.onclick=()=>startQuiz(wrongCopy); box.appendChild(b1);
  }
  const b2=document.createElement('button'); b2.className='qnext';
  b2.style.cssText='background:#fff;color:var(--accent);border:1.5px solid var(--accent);margin-top:8px';
  b2.textContent='再来一轮（当前筛选）'; b2.onclick=()=>startQuiz(); box.appendChild(b2);
}
function closeQuiz(){ document.getElementById('quizOv').style.display='none'; quiz=null; }
document.getElementById('quizBtn').addEventListener('click',()=>startQuiz());
document.getElementById('quizOv').addEventListener('click',e=>{ if(e.target.id==='quizOv') closeQuiz(); });
document.addEventListener('keydown',e=>{
  if(!quiz || document.getElementById('quizOv').style.display==='none') return;
  if(quiz.next && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); quiz.next.click(); return; }
  if(!quiz.done && /^[1-4]$/.test(e.key)){ const b=document.querySelectorAll('#qopts .qopt')[+e.key-1]; if(b) b.click(); }
});

document.getElementById('foot').innerHTML =
  `共 ${G.words.length} 词 · 数据源：托福 4264 词表（真实词库）+ 六级核心词 · `+
  `发音由浏览器语音合成朗读 · 名著/影视例句均为真实出处，「造句」为学习例句，「高频搭配」为常用短语。`;

renderHero(); renderFilters(); renderGrid();
</script>
