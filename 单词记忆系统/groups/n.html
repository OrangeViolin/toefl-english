<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>/n/ 齿龈鼻音 · 单词拆解卡片</title>
<style>
  :root{
    --bg:#f7f1e7; --card:#fffdf8; --ink:#2f2a24; --muted:#8c8072;
    --line:#eaddc9; --accent:#c1662f; --accent2:#e0913c; --amber:#fbe6c4;
    --core:#2f8f83; --exc:#b0603f; --ok:#4a9a5e;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,"PingFang SC","Helvetica Neue",Segoe UI,sans-serif;
    line-height:1.6;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1180px;margin:0 auto;padding:26px 20px 90px}
  a{color:var(--accent);text-decoration:none}
  .top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
  .top a{color:var(--muted)}
  /* header */
  header.hero{margin:14px 0 22px}
  .combo{display:inline-flex;align-items:baseline;gap:14px}
  .combo .big{font-family:Georgia,"Times New Roman",serif;font-size:60px;font-weight:700;
    background:var(--amber);color:var(--accent);padding:2px 20px;border-radius:18px;line-height:1.1}
  .combo .snd{font-size:30px;color:var(--core);font-weight:700}
  h1{font-size:23px;margin:14px 0 4px}
  .intro{color:#5f574c;max-width:860px;font-size:15px}
  /* rule cards */
  .rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin:18px 0}
  .rule{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:14px}
  .rule.core{border-left:5px solid var(--core)}
  .rule.exc{border-left:5px solid var(--exc)}
  .rule b{display:block;margin-bottom:4px;font-size:14px}
  .rule.core b{color:var(--core)} .rule.exc b{color:var(--exc)}
  /* rhyme chains */
  .rhymes{background:linear-gradient(135deg,#fff6e8,#fdeede);border:1px dashed var(--accent2);
    border-radius:14px;padding:14px 16px;margin-bottom:20px}
  .rhymes h3{margin:0 0 8px;font-size:15px;color:var(--accent)}
  .chain{margin:6px 0;font-size:14px}
  .chain .lab{color:var(--muted);margin-right:8px}
  .chip{display:inline-block;background:#fff;border:1px solid var(--line);border-radius:20px;
    padding:2px 11px;margin:3px 4px 3px 0;cursor:pointer;font-family:Georgia,serif;font-size:15px;transition:.15s}
  .chip:hover{background:var(--amber);border-color:var(--accent2)}
  /* toolbar */
  .toolbar{position:sticky;top:0;z-index:20;background:rgba(247,241,231,.94);backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);padding:12px 0;margin-bottom:18px;
    display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .search{flex:1;min-width:180px;padding:8px 13px;border:1px solid var(--line);border-radius:10px;
    font-size:14px;background:#fff}
  .filters{display:flex;flex-wrap:wrap;gap:6px}
  .f{padding:6px 12px;border:1px solid var(--line);background:#fff;border-radius:20px;font-size:13px;
    cursor:pointer;color:#6b6154;transition:.15s}
  .f.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  select.f{max-width:170px;color:#6b6154;cursor:pointer}
  .btn{padding:7px 14px;border:1px solid var(--accent);background:#fff;color:var(--accent);
    border-radius:20px;font-size:13px;cursor:pointer;font-weight:600}
  .btn.on{background:var(--accent);color:#fff}
  .prog{font-size:13px;color:var(--muted);white-space:nowrap}
  .bar{height:6px;background:var(--line);border-radius:6px;width:120px;overflow:hidden;display:inline-block;vertical-align:middle}
  .bar>i{display:block;height:100%;background:var(--ok);width:0}
  /* cards */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 17px;
    box-shadow:0 2px 10px rgba(150,120,70,.06);display:flex;flex-direction:column;gap:10px;position:relative}
  .card.unfamiliar{border-color:#e08a3c;background:#fff7ec;box-shadow:0 2px 14px rgba(210,120,40,.20)}
  .card .sub-tag{position:absolute;top:0;right:16px;transform:translateY(-50%);
    font-size:11px;padding:2px 9px;border-radius:10px;color:#fff}
  .sub-core{background:var(--core)} .sub-exc{background:var(--exc)}
  .whead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .word{font-family:Georgia,"Times New Roman",serif;font-size:30px;font-weight:700;letter-spacing:.5px}
  .word .hl{background:var(--amber);color:var(--accent);border-radius:6px;padding:0 3px}
  .ipa{color:var(--core);font-size:16px;font-weight:600}
  .say{margin-left:auto;border:none;background:var(--amber);color:var(--accent);border-radius:50%;
    width:34px;height:34px;font-size:16px;cursor:pointer;flex:none}
  .say:hover{background:var(--accent2);color:#fff}
  .tags{display:flex;gap:5px;flex-wrap:wrap}
  .tag{font-size:11px;padding:1px 8px;border-radius:9px;background:#f0e7d6;color:#8a6a3c}
  .tag.lv6{background:#e6f0ec;color:#2f8f83}
  .tag.tfl{background:#eae6f5;color:#6a52a8}
  .tag.gre{background:#f7e6ea;color:#b0507a}
  .mean{font-size:15.5px;font-weight:600;color:#3a332b}
  .sec{font-size:13.5px;color:#4d463c;border-top:1px dashed var(--line);padding-top:8px}
  .sec .l{font-size:11.5px;color:var(--accent);font-weight:700;letter-spacing:.5px;display:block;margin-bottom:2px}
  .roots{display:flex;flex-wrap:wrap;gap:6px}
  .root{background:#f6efe1;border-radius:8px;padding:3px 9px;font-size:12.5px}
  .root b{font-family:Georgia,serif;color:var(--accent)}
  .tip{background:#fff6e8;border-left:3px solid var(--accent2);padding:5px 10px;border-radius:0 8px 8px 0;font-size:13px}
  /* 一词多义 · 核心意象 */
  .coreimg{background:#f4f0e5;border-radius:8px;padding:6px 10px;font-size:13.5px;color:#5a4a2e;margin-bottom:7px}
  .sense{border-left:3px solid var(--accent2);padding:3px 0 3px 10px;margin:6px 0}
  .sense .s-gloss{font-size:14px}
  .sense .s-gloss b{color:#3a332b}
  .sense .s-logic{color:var(--accent);font-size:12.5px}
  .sense .s-ex{margin-top:2px;font-size:13px}
  .sense .s-en{font-family:Georgia,serif;color:#2f2a24}
  .sense .s-zh{color:#6b6154}
  .ex{margin:7px 0}
  .ex .en{font-family:Georgia,serif;font-size:14px;color:#2f2a24}
  .ex .zh{color:#6b6154;font-size:13px}
  .ex .src{display:inline-block;font-size:11px;color:#a89a86;margin-top:1px}
  .ex.famous{background:#fbf4e7;border-radius:8px;padding:7px 10px}
  /* 近义词辨析 / 反义词 */
  .lexgroup{display:flex;gap:8px;margin:4px 0;align-items:flex-start}
  .lextag{flex:none;font-size:11px;font-weight:700;padding:1px 8px;border-radius:8px;margin-top:3px}
  .lextag.syn{background:#e6f0ec;color:#2f8f83}
  .lextag.ant{background:#f7e6ea;color:#b0507a}
  .lexlist{display:flex;flex-direction:column;gap:3px;font-size:13.5px;flex:1}
  .lexlist.antline{flex-direction:row;flex-wrap:wrap;gap:6px;align-items:center}
  .lex .lw{font-family:Georgia,serif;color:var(--accent);cursor:pointer;font-weight:600}
  .lex .lw:hover{text-decoration:underline}
  .lex .lip{color:var(--core);font-size:12px}
  .lex .ln{color:#5f574c}
  .antchip{background:#faf0f2;border-radius:8px;padding:2px 9px;cursor:pointer;font-family:Georgia,serif;font-size:13px;color:#b0507a}
  .antchip:hover{background:#f6e3e8}
  .antchip i{font-style:normal;color:#9a8f86;font-size:12px}
  .nuance{background:#eef6f3;border-left:3px solid var(--core);padding:6px 10px;border-radius:0 8px 8px 0;font-size:13px;margin-top:7px;color:#33463f}
  /* memorize mode hides meaning+detail until hover/click */
  body.mem .mean, body.mem .sec{filter:blur(5px);transition:.15s;cursor:pointer}
  body.mem .card:hover .mean, body.mem .card.reveal .mean,
  body.mem .card:hover .sec, body.mem .card.reveal .sec{filter:none}
  .check{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer;margin-top:2px}
  .check input{width:16px;height:16px;accent-color:#c1662f}
  .card.unfamiliar .check{color:#c1662f;font-weight:600}
  .empty{text-align:center;color:var(--muted);padding:40px;grid-column:1/-1}
  footer{margin-top:36px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
  /* 测验 */
  #quizOv{display:none;position:fixed;inset:0;background:rgba(47,42,36,.55);z-index:50;
    align-items:center;justify-content:center;padding:18px}
  .qbox{background:var(--card);border-radius:20px;max-width:560px;width:100%;padding:22px 24px 20px;
    box-shadow:0 24px 70px rgba(0,0,0,.32);max-height:92vh;overflow:auto}
  .qtop{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px;margin-bottom:8px}
  .qbar2{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:16px}
  .qbar2>i{display:block;height:100%;background:var(--accent);width:0;transition:.3s}
  .qword{font-family:Georgia,serif;font-size:40px;font-weight:700;text-align:center;margin:4px 0 2px}
  .qipa{text-align:center;color:var(--core);font-size:16px;margin-bottom:16px}
  .qopts{display:grid;gap:10px}
  .qopt{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:11px 14px;font-size:14.5px;
    cursor:pointer;text-align:left;transition:.12s;display:flex;gap:10px;align-items:flex-start;font-family:inherit;color:var(--ink)}
  .qopt:hover{border-color:var(--accent2);background:#fffaf0}
  .qopt .k{font-weight:700;color:var(--accent);flex:none}
  .qopt.right{border-color:var(--ok);background:#eafaef}
  .qopt.wrong{border-color:var(--exc);background:#fdeeea}
  .qopt.dim{opacity:.45}
  .qnext{margin-top:14px;width:100%;padding:12px;border:none;border-radius:12px;background:var(--accent);
    color:#fff;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
  .qend{text-align:center}
  .qscore{font-size:46px;font-weight:800;color:var(--accent);margin:4px 0}
  .qwrong{text-align:left;margin:14px 0;max-height:34vh;overflow:auto}
  .qwrong .r{border-top:1px dashed var(--line);padding:7px 0;font-size:14px}
  .qwrong .r b{font-family:Georgia,serif;color:var(--exc)}
  .hint{text-align:center;color:var(--muted);font-size:12px;margin-top:10px}
  /* 精读 · 文章 + 句法分析 */
  .passage{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--accent);
    border-radius:14px;padding:18px 20px;margin:0 0 22px}
  .passage h2{margin:0 0 10px;font-size:18px;color:var(--accent)}
  .passage .p-title{font-family:Georgia,serif;font-size:20px;font-weight:700;color:var(--ink);margin-bottom:10px}
  .passage p{font-size:15px;line-height:1.9;margin:10px 0}
  .passage .en{color:#3a332b;font-family:Georgia,"Times New Roman",serif}
  .passage .zh{color:var(--muted);font-size:13.5px}
  .passage .kw{cursor:pointer;color:var(--accent);font-weight:600;border-bottom:1px dotted var(--accent2)}
  .readall{background:var(--accent);color:#fff;border:none;border-radius:20px;padding:4px 14px;font-size:13px;
    cursor:pointer;margin-left:10px;vertical-align:middle;transition:.15s}
  .readall:hover{background:var(--core)}
  .sents{background:linear-gradient(135deg,#f3f8f6,#eef3f0);border:1px solid var(--line);
    border-radius:14px;padding:18px 20px;margin:0 0 22px}
  .sents h2{margin:0 0 6px;font-size:18px;color:var(--core)}
  .sents .s-sub{color:var(--muted);font-size:13px;margin-bottom:14px}
  .sent{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:12px 0}
  .sent .s-en{font-family:Georgia,"Times New Roman",serif;font-size:15.5px;line-height:1.7;cursor:pointer;color:#3a332b}
  .sent .s-en:hover{color:var(--accent)}
  .sent .s-zh{color:var(--muted);font-size:13.5px;margin:6px 0 10px}
  .sent .s-parts{display:flex;flex-wrap:wrap;gap:6px}
  .spart{display:inline-flex;align-items:center;gap:6px;border-radius:9px;padding:4px 9px;font-size:13px;line-height:1.4}
  .spart .st{font-family:Georgia,serif;font-weight:600}
  .spart .sr{font-size:11px;color:#fff;border-radius:5px;padding:0 5px;white-space:nowrap}
  .spart .sn{font-size:12px;color:var(--muted)}
  .snotes{margin-top:10px;padding-top:8px;border-top:1px dashed var(--line);font-size:13px;color:#5f574c}
  .snotes b{color:var(--accent)}
  /* 句子内括号标注 */
  .s-flow{font-family:Georgia,"Times New Roman",serif;font-size:16px;line-height:2.1;cursor:pointer;color:#3a332b;padding:2px 0}
  .s-flow:hover{color:var(--accent)}
  .brkbox{border-radius:4px;padding:1px 1px;transition:.15s}
  .brk{font-weight:700;font-size:17px;padding:0 1px}
  .say-mini{background:none;border:none;cursor:pointer;font-size:15px;padding:0 4px;vertical-align:middle}
  @media(max-width:680px){.rules{grid-template-columns:1fr}.combo .big{font-size:44px}}
</style>
</head>

notable = note（笔记值得记的事）+ -able → 值得记一笔 → 显著的。", "core": "用笔在重要的事上画个圈——它突出到值得被单独记下来。", "senses": [{"gloss": "adj. 显著的，值得注意的", "logic": "notare 是「做标记」→ 能被人做标记的东西一定够醒目够突出 → 引申为「显著的」。", "en": "The region has seen notable improvements in air quality over the past decade.", "zh": "该地区过去十年空气质量有显著改善。"}, {"gloss": "n. 名人，要人", "logic": "被标记→被大家记住名字→从众多人中「标出来」的人 → 名人。", "en": "The conference was attended by local notables and business leaders.", "zh": "会议出席者包括当地名流和商界领袖。"}], "derivatives": [{"w": "note", "gloss": "n.笔记 v.注意，记下"}, {"w": "notice", "gloss": "v.注意到 n.通知，布告"}, {"w": "notify", "gloss": "v.通知，告知"}, {"w": "notation", "gloss": "n.标记法，记号系统"}, {"w": "noteworthy", "gloss": "adj.值得注意的，显著的"}], "examples": [{"en": "The region has seen notable improvements in air quality over the past decade.", "zh": "该地区过去十年空气质量有显著改善。", "source": "造句"}, {"en": "with the notable exception of", "zh": "「除了……这一显著例外」——学术写作让步结构高频搭配。", "source": "高频搭配"}], "synonyms": [{"w": "remarkable", "gloss": "显著的，非凡的", "ipa": "/rɪˈmɑːrkəbl/", "note": "「显著的、非凡的」，比 notable 更强调出乎意料；a remarkable achievement（非凡成就）"}, {"w": "significant", "gloss": "重要的，有意义的", "ipa": "/sɪɡˈnɪfɪkənt/", "note": "「重要的、有意义的」，比 notable 更强调分量和后果；significant impact（重大影响）"}, {"w": "prominent", "gloss": "突出的，知名的", "ipa": "/ˈprɒmɪnənt/", "note": "「突出的、知名的」，与 notable 作名词义时最近；a prominent scientist（知名科学家）"}], "antonyms": [{"w": "insignificant", "note": "微不足道的"}, {"w": "obscure", "note": "默默无闻的"}], "nuance": "notable 强调「值得关注的程度」，可以是数量或质量上的显著；remarkable 强调「超出预期的惊人」；significant 强调「后果上的重要性」。「a notable increase」是显著增加（数量），「a significant increase」更强调这个增加带来的影响。"}, {"word": "notion", "hl": "n", "levels": ["托福"], "ipa": "/ˈnoʊʃn/", "subgroup": "n", "meaning": "n. 概念，观念；想法；（模糊的）印象", "etymology": "拉丁语 notio = noscere（知道、认识）的名词形式，「认识的结果」→ 概念。与 know（经由条顿语借道）、notice、cognition（认知）同根——都来自「知」这一核心。", "roots": [{"part": "not- (noscere)", "meaning": "知道、认识"}, {"part": "-ion", "meaning": "名词后缀"}], "phonetics": "NO-tion，重音在前，-tion = /ʃn/（不是 /tɪɒn/）。n 在词首清晰发 /n/。", "core": "脑子里飘着一个模糊的形状，知道它在那儿，但还没完全看清。", "senses": [{"gloss": "n. 概念，观念", "logic": "noscere「知道」→ 知道的结果是一个「想法/概念」在脑子里成形 → 观念。", "en": "The notion of universal basic income has gained traction in recent years.", "zh": "全民基本收入的概念近年来受到了越来越多的关注。"}, {"gloss": "n.（模糊的）印象，想法", "logic": "知道但不完全知道 → 心里有个影影绰绰的感觉 → 模糊印象。从「清晰的知」滑向「不太确定的知」。", "en": "He had little notion of how much work was involved.", "zh": "他完全不了解这需要多少工作量。"}], "derivatives": [{"w": "cognition", "gloss": "n.认知，认识能力"}, {"w": "recognize", "gloss": "v.认出，识别"}, {"w": "cognitive", "gloss": "adj.认知的"}, {"w": "notorious", "gloss": "adj.臭名昭著的（大家都'知道'的负面人物）"}], "examples": [{"en": "He had little notion of how much work was involved.", "zh": "他完全不了解这需要多少工作量。", "source": "造句"}, {"en": "challenge the notion that", "zh": "「挑战……这一观念」——学术论证高频句型。", "source": "高频搭配"}], "synonyms": [{"w": "concept", "gloss": "概念，观念", "ipa": "/ˈkɒnsept/", "note": "「概念」，比 notion 更系统、更清晰；the concept of democracy（民主概念）"}, {"w": "idea", "gloss": "想法，主意", "ipa": "/aɪˈdɪə/", "note": "最通用的「想法/观念」，比 notion 更口语，适用范围最广"}, {"w": "impression", "gloss": "印象，感觉", "ipa": "/ɪmˈpreʃn/", "note": "「印象、感觉」，比 notion 更模糊，强调主观感知；first impression（第一印象）"}], "antonyms": [{"w": "reality", "note": "现实（与观念相对）"}, {"w": "fact", "note": "事实"}], "nuance": "notion 常指「尚未完全厘清的想法或印象」，带有模糊感（I have no notion of what he means）；concept 是经过系统化的明确概念；idea 最泛最口语。用 notion 常暗示质疑或讨论某个观念是否成立。"}, {"word": "nourish", "hl": "n", "levels": ["托福"], "ipa": "/ˈnʌrɪʃ/", "subgroup": "n", "meaning": "v. 滋养，哺育；（感情、希望等）培育，助长", "etymology": "古法语 norrir，源自拉丁语 nutrire「喂养、滋养」。与 nutrition（营养）、nurse（护士/哺育）、nutrient（营养素）同根——都在讲「提供生长所需」。", "roots": [{"part": "nour- (nutrire)", "meaning": "滋养、喂养"}, {"part": "-ish", "meaning": "动词后缀"}], "phonetics": "NOU-rish，注意拼写是 ou 但发音是 /ʌ/（同 nurse/nurture），词首 n = /n/。", "tip": "nourish → nutrition → nurse：同一个词根 nutri-，养育身体和灵魂的行为。", "core": "把食物一口一口喂进去，看着对方慢慢长起来——身体在长，心也在长。", "senses": [{"gloss": "v. 滋养，哺育（身体）", "logic": "nutrire = 喂养 → 提供营养让生物体生长 → 物质层面的滋养。", "en": "A balanced diet nourishes both the body and the mind.", "zh": "均衡饮食能同时滋养身体和心灵。"}, {"gloss": "v. 培育，助长（感情、希望等抽象事物）", "logic": "喂养身体 → 像喂食物一样「喂养」抽象事物 → 让感情/希望/关系也「长大」。这是从物质到精神的自然隐喻。", "en": "She nourished the hope of one day returning to her hometown.", "zh": "她一直怀着有朝一日回到家乡的希望。"}], "derivatives": [{"w": "nutrition", "gloss": "n.营养，营养学"}, {"w": "nutrient", "gloss": "n.营养素，养分"}, {"w": "nurse", "gloss": "n.护士 v.护理，哺育"}, {"w": "nurture", "gloss": "v./n.培育，教养"}, {"w": "nutritious", "gloss": "adj.有营养的"}], "examples": [{"en": "A balanced diet nourishes both the body and the mind.", "zh": "均衡饮食能同时滋养身体和心灵。", "source": "造句"}, {"en": "nourish a hope / nourish a relationship", "zh": "「培育希望 / 滋养一段关系」——抽象义高频用法。", "source": "高频搭配"}], "synonyms": [{"w": "nurture", "gloss": "培育，教养", "ipa": "/ˈnɜːrtʃər/", "note": "「培育」，与 nourish 同根，但更强调长期呵护和教育；nurture talent（培养才能）"}, {"w": "sustain", "gloss": "维持，支撑", "ipa": "/səˈsteɪn/", "note": "「维持、支撑」，强调维持生命或状态的持续性；sustain life（维持生命）"}, {"w": "feed", "gloss": "喂养，喂食", "ipa": "/fiːd/", "note": "最口语的「喂养」，仅指物质食物，没有抽象义"}], "antonyms": [{"w": "starve", "note": "使挨饿、剥夺营养"}, {"w": "deprive", "note": "剥夺（所需之物）"}], "nuance": "nourish 强调「提供成长所需的养分」，可以是物质（food nourishes the body）也可以是精神（nourish a dream）；nurture 更强调长期的教育培养过程；sustain 侧重「维持不断绝」而非主动滋养。"}, {"word": "neutral", "hl": "n", "levels": ["托福"], "ipa": "/ˈnjuːtrəl/", "subgroup": "n", "meaning": "adj. 中立的；中性的；（颜色）不鲜明的  n. 中立国；空挡", "etymology": "拉丁语 neutralis = neuter（两者都不）+ -alis。neuter = ne-(不) + uter(两者之一)。「两者都不站」→ 中立。与 neither（两者都不）同源于印欧词根。", "roots": [{"part": "ne-", "meaning": "不、否定"}, {"part": "-utr- (uter)", "meaning": "两者之一"}, {"part": "-al", "meaning": "形容词后缀"}], "phonetics": "NEU-tral，英式 /ˈnjuːtrəl/，美式 /ˈnuːtrəl/（ny 简化）；词首 n = /n/。", "core": "站在正中间那条线上，不往左也不往右——两边都跟我没关系。", "senses": [{"gloss": "adj. 中立的，不偏袒的", "logic": "ne-不 + uter两者之一 → 「哪一个都不是」→ 不选边不站队 → 中立立场。", "en": "Switzerland has maintained a neutral position in international conflicts.", "zh": "瑞士在国际冲突中一直保持中立立场。"}, {"gloss": "adj. 中性的，不鲜明的", "logic": "不偏袒→不带有任何一方的色彩→没有强烈特征→中性/不鲜明。从政治延展到色彩、化学、语法等域。", "en": "She decorated the room in neutral tones of beige and gray.", "zh": "她用米色和灰色等中性色调装饰了房间。"}, {"gloss": "n. 空挡（汽车）", "logic": "两边都不挂→不挂前进挡也不挂倒挡→空挡。机械域的具体化。", "en": "Put the car in neutral before starting the engine.", "zh": "发动引擎前先把车挂到空挡。"}], "derivatives": [{"w": "neuter", "gloss": "adj.中性的（语法）v.阉割"}, {"w": "neither", "gloss": "pron./adj.两者都不"}, {"w": "neutrality", "gloss": "n.中立，中立地位"}, {"w": "neutralize", "gloss": "v.使中和，使失效"}], "examples": [{"en": "Switzerland has maintained a neutral position in international conflicts.", "zh": "瑞士在国际冲突中一直保持中立立场。", "source": "造句"}, {"en": "a neutral tone / neutral ground", "zh": "「中性色调 / 中立场所」——颜色和外交语境高频搭配。", "source": "高频搭配"}], "synonyms": [{"w": "impartial", "gloss": "公正的，不偏不倚的", "ipa": "/ɪmˈpɑːrʃl/", "note": "「公正无私的」，比 neutral 更强调主动不偏袒，常用于裁判或评估语境；an impartial judge（公正的法官）"}, {"w": "unbiased", "gloss": "无偏见的", "ipa": "/ʌnˈbaɪəst/", "note": "「无偏见的」，强调没有预设立场；unbiased reporting（无偏见报道）"}, {"w": "objective", "gloss": "客观的", "ipa": "/əbˈdʒektɪv/", "note": "「客观的」，强调基于事实而非情感；objective analysis（客观分析）"}], "antonyms": [{"w": "biased", "note": "有偏见的"}, {"w": "partisan", "note": "党派的、偏袒一方的"}], "nuance": "neutral 强调「不介入任何一方」（可以是出于选择或性质）；impartial 强调「主动维持公正」（有判断但不偏袒）；objective 强调「以事实为准绳」。neutral country（中立国）是政治选择，objective reporter（客观记者）是职业标准。"}, {"word": "negotiate", "hl": "n", "levels": ["托福"], "ipa": "/nɪˈɡoʊʃieɪt/", "subgroup": "n", "meaning": "v. 谈判，协商；（成功）通过（障碍）", "etymology": "拉丁语 negotiari = neg-(不) + otium(闲暇) = 「没有闲着」→ 做生意、谈判。与 negotium（事务）同根。otium（闲暇）的反义词是 negotium（事务），古罗马人用这个词对组来区分「工作」与「休闲」。", "roots": [{"part": "neg- (nec-)", "meaning": "不、否定"}, {"part": "-otium", "meaning": "闲暇，休息"}], "phonetics": "重音在第二音节 ne-GO-tiate，词首 n = /n/；-tiate 读 /ʃieɪt/，不是 /tɪeɪt/。", "tip": "negotiate 字面是「不得闲」（neg + otium）——谈判桌上没有闲人，每个人都在为利益工作。", "core": "两个人对坐桌前，不得闲——你说你的我要我的，磨来磨去，直到磨出一个都能接受的点。", "senses": [{"gloss": "v. 谈判，协商", "logic": "neg-不 + otium闲暇 = 「不得闲，在忙事务」→ 古罗马人用来指做生意→你来我往谈条件→谈判。核心是双方来回博弈。", "en": "The two governments agreed to negotiate a trade deal.", "zh": "两国政府同意就贸易协议展开谈判。"}, {"gloss": "v.（成功）通过（障碍、弯道等）", "logic": "谈判需要技巧→你得灵活应对各种情况→引申为「巧妙通过」障碍。就像一个谈判高手绕过对方条件，也像司机绕过急弯。", "en": "She carefully negotiated the winding mountain road.", "zh": "她小心地通过了蜿蜒的山路。"}], "derivatives": [{"w": "negotiation", "gloss": "n.谈判，协商"}, {"w": "negotiator", "gloss": "n.谈判者，协商者"}, {"w": "negotiable", "gloss": "adj.可协商的，可通行的"}], "examples": [{"en": "The two governments agreed to negotiate a trade deal.", "zh": "两国政府同意就贸易协议展开谈判。", "source": "造句"}, {"en": "negotiate a sharp bend / negotiate the terms", "zh": "「安全通过急转弯 / 谈判条款」——两种义的高频搭配。", "source": "高频搭配"}], "synonyms": [{"w": "bargain", "gloss": "讨价还价，谈判", "ipa": "/ˈbɑːrɡɪn/", "note": "「讨价还价」，比 negotiate 更口语，强调争取有利条件；bargain for a better price（讨价还价）"}, {"w": "mediate", "gloss": "调解，斡旋", "ipa": "/ˈmiːdieɪt/", "note": "「调解」，强调第三方居间斡旋，比 negotiate 更被动；mediate a dispute（调解纠纷）"}, {"w": "arbitrate", "gloss": "仲裁，公断", "ipa": "/ˈɑːrbɪtreɪt/", "note": "「仲裁」，比 mediate 更正式，裁决具有约束力；arbitrate a case（仲裁案件）"}], "antonyms": [{"w": "dictate", "note": "强行规定，不经协商"}, {"w": "impose", "note": "单方面强加"}], "nuance": "negotiate 是双方或多方坐下来平等协商寻求共识；bargain 更强调争利的过程，语气接近「砍价」；mediate 是第三方介入；arbitrate 是有约束力的裁决。「negotiate a peace deal」是双边努力，「arbitrate a dispute」是请外部权威裁判。"}, {"word": "navigate", "hl": "n", "levels": ["托福"], "ipa": "/ˈnævɪɡeɪt/", "subgroup": "n", "meaning": "v. 导航，航行；（在复杂局面中）找到方向", "etymology": "拉丁语 navigare = navis（船）+ agere（驾驶、行动）。「驾船而行」→ 导航。与 navy（海军）、naval（海军的）同根，核心是「船/海」。", "roots": [{"part": "navi- (navis)", "meaning": "船"}, {"part": "-gate (agere)", "meaning": "驾驶、推动"}], "phonetics": "NAV-i-gate，重音在首音节，词首 n = /n/；-gate 末尾弱读 /ɡɪt/ 或 /ɡeɪt/（美式偏 /ɡeɪt/）。", "core": "驾着船在茫茫海上——手里有舵，眼前有星，穿过风浪找到对的方向。", "senses": [{"gloss": "v. 导航，航行（物理空间）", "logic": "navis船 + agere驾驶 = 「驾船」→ 驾驶船/飞机/车沿着一定路线行进 → 导航。", "en": "Ancient sailors navigated by the stars.", "zh": "古代水手靠星星导航。"}, {"gloss": "v. 在复杂局面中找到方向（抽象）", "logic": "驾船找路 → 比喻在抽象迷宫中找出口 → 面对复杂系统（官僚、法规、人际关系）也能找到正确的通过方式。航海是原始意象，人生是引申海域。", "en": "She had to navigate complex regulations to get the permit approved.", "zh": "她不得不在复杂的法规中找到路径，才让许可申请获批。"}], "derivatives": [{"w": "navigation", "gloss": "n.导航，航行"}, {"w": "navigator", "gloss": "n.导航员，航海家"}, {"w": "navy", "gloss": "n.海军"}, {"w": "naval", "gloss": "adj.海军的"}, {"w": "navigable", "gloss": "adj.可航行的，可通航的"}], "examples": [{"en": "She had to navigate complex regulations to get the permit approved.", "zh": "她不得不在复杂的法规中找到路径，才让许可申请获批。", "source": "造句"}, {"en": "navigate the job market / navigate choppy waters", "zh": "「在求职市场找到方向 / 在动荡中驾驭」——抽象义高频隐喻。", "source": "高频搭配"}], "synonyms": [{"w": "steer", "gloss": "掌舵，引导", "ipa": "/stɪər/", "note": "「掌舵、引导」，物理意义更强，也可抽象；steer a company through a crisis（带领公司渡过危机）"}, {"w": "maneuver", "gloss": "机动，巧妙操控", "ipa": "/məˈnuːvər/", "note": "「机动、巧妙应对」，强调技巧性的操控；maneuver through traffic（在车流中穿行）"}, {"w": "pilot", "gloss": "驾驶，引导", "ipa": "/ˈpaɪlət/", "note": "「驾驶（飞机/船）/ 引导」，与 navigate 最近，也可抽象；pilot a bill through Congress（引导法案在国会通过）"}], "antonyms": [{"w": "flounder", "note": "（在困境中）挣扎，不知所措"}, {"w": "get lost", "note": "迷失方向"}], "nuance": "navigate 强调「找到正确路径穿越复杂环境」，可以是地理的也可以是抽象的（navigate politics）；steer 强调主动控制方向；maneuver 强调灵活机动；pilot 更强调全程引导到达目的地。"}, {"word": "narrative", "hl": "n", "levels": ["托福"], "ipa": "/ˈnærətɪv/", "subgroup": "n", "meaning": "n. 叙述，故事；（主导性的）叙事框架  adj. 叙事的", "etymology": "拉丁语 narrare「讲述」，与 gnarus（知道的、熟悉的）同根——「知道某事」→「把它讲出来」。gnarus 本身含 gn 词根（参见 gn 静音组合），是 kn/gn 同族词的证明。", "roots": [{"part": "narr- (narrare)", "meaning": "讲述"}, {"part": "-ative", "meaning": "名词/形容词后缀"}], "phonetics": "NAR-ra-tive，三音节，重音在首，词首 n = /n/；注意中间 r 要清晰。", "tip": "narrative 的词源 narrare 与 gnarus（知道的）同根——知道→讲述，n 的深层联系。", "core": "把知道的事用一根线串起来，从头到尾讲给别人听——线怎么穿，故事就长什么样。", "senses": [{"gloss": "n. 叙述，故事", "logic": "narrare「讲述」→ gnarus「知道」→「把知道的说出来」→有结构地讲故事。核心是「讲」的动作和「故事」这个产物。", "en": "The novel is told in a non-linear narrative that jumps between past and present.", "zh": "这部小说采用非线性叙事，在过去和现在之间跳跃。"}, {"gloss": "n.（主导性的）叙事框架", "logic": "讲故事→谁在讲、怎么讲决定了听众看到什么→「叙事」不仅是故事，更是定义现实的话语权。这个义从文学批评渗透到政治和媒体。", "en": "The documentary challenges the dominant narrative about climate change.", "zh": "这部纪录片质疑气候变化的主流叙事框架。"}], "derivatives": [{"w": "narrate", "gloss": "v.叙述，讲述"}, {"w": "narrator", "gloss": "n.叙述者，旁白"}, {"w": "narration", "gloss": "n.叙述，解说"}], "examples": [{"en": "The documentary challenges the dominant narrative about climate change.", "zh": "这部纪录片质疑气候变化的主流叙事框架。", "source": "造句"}, {"en": "a compelling narrative / control the narrative", "zh": "「引人入胜的故事 / 掌控舆论框架」——文学和政治高频搭配。", "source": "高频搭配"}], "synonyms": [{"w": "account", "gloss": "描述，陈述", "ipa": "/əˈkaʊnt/", "note": "「描述、陈述」，比 narrative 更中性，不一定有故事结构；an eyewitness account（目击者陈述）"}, {"w": "story", "gloss": "故事", "ipa": "/ˈstɔːri/", "note": "最口语的「故事」，比 narrative 少了批判性分析的含义"}, {"w": "discourse", "gloss": "话语，论述", "ipa": "/ˈdɪskɔːrs/", "note": "「话语、论述」，比 narrative 更抽象学术，指社会层面的话语体系；dominant discourse（主流话语）"}], "antonyms": [{"w": "counter-narrative", "note": "反叙事、对立叙事框架"}], "nuance": "narrative 现在不仅指「故事」，还指「人们对事件的解读框架」——谁在控制 narrative，谁就在定义公众对事件的理解。这个用法在新闻、政治、学术中极高频，是比 story 更有分析力的词。"}, {"word": "numerous", "hl": "n", "levels": ["托福"], "ipa": "/ˈnjuːmərəs/", "subgroup": "n", "meaning": "adj. 众多的，许多的", "etymology": "拉丁语 numerosus = numerus（数）+ -osus（充满的）。「充满数字/充满数量」→ 众多的。与 number（数字）、enumerate（列举）、innumerable（不可数的）同根。", "roots": [{"part": "numer- (numerus)", "meaning": "数、数量"}, {"part": "-ous", "meaning": "充满……的"}], "phonetics": "NU-mer-ous，三音节，重音在首，词首 n = /n/；英式 /ˈnjuːmərəs/，美式 /ˈnuːmərəs/。", "core": "放眼望去满眼都是——数都懒得数，因为太多了。", "senses": [{"gloss": "adj. 众多的，许多的", "logic": "numerus数 + -ous充满的 = 「充满数量的」→ 数量大到让人注意到 → 许多的。只有一个核心义，但使用域很广（人、物、事件、研究等）。", "en": "Numerous studies have confirmed the link between stress and illness.", "zh": "大量研究证实了压力与疾病之间的联系。"}], "derivatives": [{"w": "number", "gloss": "n.数字，数量 v.编号"}, {"w": "numerical", "gloss": "adj.数字的，数值的"}, {"w": "enumerate", "gloss": "v.逐一列举，枚举"}, {"w": "innumerable", "gloss": "adj.无数的，数不清的"}, {"w": "numeral", "gloss": "n.数字符号 adj.数字的"}], "examples": [{"en": "Numerous studies have confirmed the link between stress and illness.", "zh": "大量研究证实了压力与疾病之间的联系。", "source": "造句"}, {"en": "on numerous occasions", "zh": "「在许多场合」——学术和正式文体高频替换「many times」。", "source": "高频搭配"}], "synonyms": [{"w": "many", "gloss": "许多的", "ipa": "/ˈmeni/", "note": "最口语的「许多」，无正式感；numerous 是其书面替换词"}, {"w": "countless", "gloss": "无数的", "ipa": "/ˈkaʊntləs/", "note": "「无数的、数不清的」，比 numerous 更强调数量多到难以计数；countless stars（无数繁星）"}, {"w": "abundant", "gloss": "丰富的，充裕的", "ipa": "/əˈbʌndənt/", "note": "「丰富的、充裕的」，比 numerous 更强调充足充裕，不一定指个体数量；abundant resources（丰富资源）"}], "antonyms": [{"w": "few", "note": "很少的"}, {"w": "scarce", "note": "稀少的，匮乏的"}], "nuance": "numerous 是学术写作中替换 many 的首选词——正式、中性、不夸张。countless 暗示数量多到无法计数（有夸张成分），abundant 侧重「量大充裕」而非单纯「个数多」，因此「numerous participants」比「abundant participants」更自然。"}, {"word": "announce", "hl": "nn", "levels": ["托福"], "ipa": "/əˈnaʊns/", "subgroup": "nn", "meaning": "v. 宣布，公告；（声音、信号）预示", "etymology": "拉丁语 annuntiare = ad-(向) + nuntiare(报告、传递消息)。「向……传递消息」→ 宣布。与 pronounce（发音/宣判）、denounce（谴责）、renounce（放弃声称）同根——都含 -nounce（nuntius，信使）。", "roots": [{"part": "an- (ad-)", "meaning": "向、朝"}, {"part": "-nounce (nuntiare)", "meaning": "传递消息、报告"}], "phonetics": "an-NOUNCE，重音在后，nn = /n/（双写锁住前面 a 的短音 /ə/）；-ounce = /aʊns/。", "core": "站到高处，对着一群人把消息喊出来——从此刻起，所有人都知道了。", "senses": [{"gloss": "v. 宣布，公告", "logic": "ad-向 + nuntiare报信 = 「向众人报信」→ 正式公开地把信息传达出去 → 宣布。信使（nuntius）是词根灵魂——announce 就是扮演信使的角色。", "en": "The company announced a major restructuring plan at the shareholders' meeting.", "zh": "公司在股东大会上宣布了重大重组计划。"}, {"gloss": "v.（声音、信号）预示……的到来", "logic": "宣布某事→宣布某事要来了→「宣告来临」→从人域拓展到物域：钟声announce新年，乌云announce暴雨。信使从人变成了信号。", "en": "The first buds announce the arrival of spring.", "zh": "第一颗嫩芽宣告春天的到来。"}], "derivatives": [{"w": "announcement", "gloss": "n.公告，宣布"}, {"w": "announcer", "gloss": "n.播音员，宣告者"}, {"w": "pronounce", "gloss": "v.发音；宣判，宣告"}, {"w": "denounce", "gloss": "v.谴责，告发"}, {"w": "renounce", "gloss": "v.放弃，声明放弃（头衔/权利）"}], "examples": [{"en": "The company announced a major restructuring plan at the shareholders' meeting.", "zh": "公司在股东大会上宣布了重大重组计划。", "source": "造句"}, {"en": "announce one's resignation / as announced", "zh": "「宣布辞职 / 如已公布的那样」——正式场合高频搭配。", "source": "高频搭配"}], "synonyms": [{"w": "declare", "gloss": "宣告，声明", "ipa": "/dɪˈkleər/", "note": "「宣告」，比 announce 更正式，常用于重大决定或立场；declare independence（宣布独立）"}, {"w": "proclaim", "gloss": "宣称，公告天下", "ipa": "/prəˈkleɪm/", "note": "「宣称、公告天下」，比 announce 更庄重有力，带公开示众意味；proclaim victory（宣布胜利）"}, {"w": "disclose", "gloss": "披露，公开", "ipa": "/dɪsˈkloʊz/", "note": "「披露」，强调公开此前未知的信息，比 announce 更强调信息的机密性；disclose financial data（披露财务数据）"}], "antonyms": [{"w": "conceal", "note": "隐瞒，不公开"}, {"w": "withhold", "note": "扣押，不发布"}], "nuance": "announce 强调公开发布信息（中性），declare 带有正式宣告的庄重感，proclaim 语气最强烈正式（常用于历史性时刻）。「announce a policy」是日常行政用语，「declare war」是严肃历史用语，「proclaim independence」是里程碑式宣告。"}, {"word": "innocent", "hl": "nn", "levels": ["托福"], "ipa": "/ˈɪnəsnt/", "subgroup": "nn", "meaning": "adj. 无罪的；天真无邪的；（错误等）无心的  n. 无辜者", "etymology": "拉丁语 innocens = in-(不) + nocere(伤害) = 「不伤害人的」→ 无害→无辜。与 noxious（有害的）、obnoxious（令人反感的）、nuisance（烦恼）同根，nocere 是「伤害」。", "roots": [{"part": "in-", "meaning": "不、否定"}, {"part": "-noc- (nocere)", "meaning": "伤害"}, {"part": "-ent", "meaning": "形容词后缀"}], "phonetics": "IN-no-cent，重音在首，nn = /n/；-cent 弱读 /snt/，注意不发 /e/（省略）。", "tip": "innocent 字面「不伤害人」→ 无辜。反向记忆：nocere（伤害）也在 noxious（有毒有害）里。", "core": "像一张还没被写过字的白纸——没害过人，也还没被世界弄脏。", "senses": [{"gloss": "adj. 无罪的（法律）", "logic": "in-不 + nocere伤害 = 「没做过伤害行为」→ 法律上没有犯罪 → 无罪。这是最字面的义。", "en": "The court ruled that she was innocent of all charges.", "zh": "法庭裁定她对所有指控均无罪。"}, {"gloss": "adj. 天真无邪的（性格）", "logic": "没有伤害行为→也没被伤害过→保持天然的纯净状态→像孩子一样天真。从「法律清白」滑向「心灵纯洁」。不是两个不同义，而是一条光谱。", "en": "She looked at him with innocent eyes, not understanding the joke.", "zh": "她用天真无邪的眼神看着他，没听懂那个笑话。"}, {"gloss": "adj. 无心的，无恶意的（错误等）", "logic": "不伤害人→不是故意的→没有恶意→无心的。从行为动机而非法律后果来判定。", "en": "It was an innocent mistake — he never meant to hurt anyone.", "zh": "那是个无心之过——他从没想过要伤害任何人。"}], "derivatives": [{"w": "innocence", "gloss": "n.无辜，清白；天真"}, {"w": "innocuous", "gloss": "adj.无害的，无伤大雅的"}, {"w": "noxious", "gloss": "adj.有毒的，有害的"}, {"w": "nuisance", "gloss": "n.讨厌的人/事，滋扰"}], "examples": [{"en": "The court ruled that she was innocent of all charges.", "zh": "法庭裁定她对所有指控均无罪。", "source": "造句"}, {"en": "an innocent mistake / an innocent bystander", "zh": "「无心之过 / 无辜旁观者」——两种义的高频搭配。", "source": "高频搭配"}], "synonyms": [{"w": "guiltless", "gloss": "无罪的", "ipa": "/ˈɡɪltləs/", "note": "「无罪的」，与 innocent 法律义最近，但更口语；比 innocent 少了「天真」的含义"}, {"w": "naive", "gloss": "天真的，幼稚的", "ipa": "/naɪˈiːv/", "note": "「天真的」，与 innocent 的「天真无邪」义最近，但 naive 常含轻微贬义（过于轻信）"}, {"w": "blameless", "gloss": "无可指责的", "ipa": "/ˈbleɪmləs/", "note": "「无可指责的」，强调行为上没有过错，比 innocent 更着眼于「无过失」"}], "antonyms": [{"w": "guilty", "note": "有罪的"}, {"w": "culpable", "note": "应受责备的，有过错的"}], "nuance": "innocent 兼有法律义（无罪）和性格义（天真无邪）；naive 专指「天真、容易被骗」（常含批评）；blameless 只说行为上无过错，不涉及法律或性格。「an innocent child」是「天真的孩子」（褒），「a naive adult」是「过于轻信的成年人」（微贬）。"}, {"word": "innate", "hl": "nn", "levels": ["托福"], "ipa": "/ɪˈneɪt/", "subgroup": "nn", "meaning": "adj. 天生的，与生俱来的；固有的", "etymology": "拉丁语 innatus = in-(进入/在…里) + natus（出生的，nasci 的过去分词）。「在出生里的」→ 天生的。与 nature（自然）、native（本地的）、prenatal（产前的）同根，nasci 是「出生」。", "roots": [{"part": "in-", "meaning": "在……里，进入"}, {"part": "-nate (natus)", "meaning": "出生的"}], "phonetics": "in-NATE，重音在后，nn = /n/（双写，锁住前 i 短音 /ɪ/）；-nate = /neɪt/。", "tip": "innate = in + nate（born）→ 生来就有的。同族：native、nature、prenatal。", "core": "从娘胎里带出来的东西——不用学，不用练，生下来就在那儿。", "senses": [{"gloss": "adj. 天生的，与生俱来的", "logic": "in-在…里 + natus出生 = 「在出生里的」→ 出生时就带着的 → 先天具备的。字面义就是「生来就有的」。", "en": "Children have an innate ability to acquire language without formal instruction.", "zh": "儿童具有天生的语言习得能力，无需正式教学。"}, {"gloss": "adj. 固有的，内在的", "logic": "出生时就有的→是事物本质的一部分→不是外部加上的→固有的。从「出生自带」引申为「本质属性」，在哲学和科学语境中常用于讨论天性vs后天。", "en": "The design has an innate flaw that cannot be fixed with software updates.", "zh": "这个设计有一个固有问题，无法通过软件更新修复。"}], "derivatives": [{"w": "native", "gloss": "adj.本地的，土生土长的 n.本地人"}, {"w": "nation", "gloss": "n.国家，民族（出生之地）"}, {"w": "nature", "gloss": "n.自然，天性"}, {"w": "natal", "gloss": "adj.出生的，诞生的"}, {"w": "prenatal", "gloss": "adj.产前的，出生前的"}], "examples": [{"en": "Children have an innate ability to acquire language without formal instruction.", "zh": "儿童具有天生的语言习得能力，无需正式教学。", "source": "造句"}, {"en": "innate curiosity / innate talent", "zh": "「与生俱来的好奇心 / 天赋才能」——高频搭配，常用于科学和教育讨论。", "source": "高频搭配"}], "synonyms": [{"w": "inherent", "gloss": "固有的，内在的", "ipa": "/ɪnˈhɪərənt/", "note": "「固有的、内在的」，比 innate 更强调「作为本质组成部分存在」，不一定涉及出生；inherent risks（内在风险）"}, {"w": "inborn", "gloss": "天生的", "ipa": "/ˈɪnbɔːrn/", "note": "「天生的」，与 innate 最接近，更口语；an inborn gift（天赋）"}, {"w": "natural", "gloss": "自然的，天生的", "ipa": "/ˈnætʃrəl/", "note": "「自然的、天然的」，比 innate 更泛，也指非人工的；a natural talent（自然才能）"}], "antonyms": [{"w": "acquired", "note": "后天习得的"}, {"w": "learned", "note": "学习得来的"}], "nuance": "innate 特指「出生时就具备的」（天生论语境），inborn 是口语同义词；inherent 不一定涉及出生，而是「作为事物本质的一部分而存在」（the inherent difficulty of the task）。「nature vs nurture」辩论中，innate abilities 代表 nature 一方。"}, {"word": "annual", "hl": "nn", "levels": ["托福"], "ipa": "/ˈænjuəl/", "subgroup": "nn", "meaning": "adj. 每年的，年度的  n. 年刊；一年生植物", "etymology": "拉丁语 annualis = annus（年）+ -alis。与 anniversary（周年纪念）、perennial（多年生的/长期的）、millennium（千年）同根，annus 是「年」。", "roots": [{"part": "ann- (annus)", "meaning": "年"}, {"part": "-ual", "meaning": "形容词后缀"}], "phonetics": "AN-nu-al，重音在首，nn = /n/；-ual 发 /juəl/（英式）或 /uəl/（美式简化）。", "core": "地球绕太阳转完一整圈——这个时间单位里，总有一些事会回到原点再来一次。", "senses": [{"gloss": "adj. 每年的，一年一度的", "logic": "annus年 + -al形容词 = 「属于年的」→ 以一年为周期发生一次 → 每年一次的。", "en": "The company publishes an annual report detailing its financial performance.", "zh": "公司发布年报详述其财务表现。"}, {"gloss": "n. 年刊，年鉴", "logic": "每年一次的→每年出版一次的刊物→年刊。从形容词名词化，省掉了后面的 publication/book。", "en": "She contributed an article to the department's annual.", "zh": "她为系里的年刊撰文一篇。"}, {"gloss": "n. 一年生植物", "logic": "以一年为周期的→生命周期就是一年的→活一季就死的植物。植物学域的名词化，与 perennial（多年生）对举。", "en": "Marigolds are annuals that need to be replanted each spring.", "zh": "万寿菊是一年生植物，每年春天需要重新播种。"}], "derivatives": [{"w": "anniversary", "gloss": "n.周年纪念日"}, {"w": "annuity", "gloss": "n.年金（每年支付的固定金额）"}, {"w": "perennial", "gloss": "adj.多年生的；长期的，反复出现的"}, {"w": "millennium", "gloss": "n.一千年，千禧年"}, {"w": "biennial", "gloss": "adj.两年一次的"}], "examples": [{"en": "The company publishes an annual report detailing its financial performance.", "zh": "公司发布年报详述其财务表现。", "source": "造句"}, {"en": "annual income / annual conference", "zh": "「年收入 / 年度会议」——商务和学术高频搭配。", "source": "高频搭配"}], "synonyms": [{"w": "yearly", "gloss": "每年的", "ipa": "/ˈjɪərli/", "note": "最口语的「每年的」，与 annual 可互换但 annual 更正式书面"}, {"w": "perennial", "gloss": "多年生的，长期的", "ipa": "/pəˈreniəl/", "note": "「多年的、长期的」，同根词，但 perennial 指「持续多年反复出现」；a perennial problem（长期存在的问题）"}, {"w": "periodic", "gloss": "定期的，周期性的", "ipa": "/ˌpɪəriˈɒdɪk/", "note": "「定期的」，比 annual 更泛，指任意有规律的时间间隔，不限于一年"}], "antonyms": [{"w": "monthly", "note": "每月的"}, {"w": "daily", "note": "每日的"}], "nuance": "annual 特指「以一年为周期」（annual salary 年薪），yearly 是其口语版；perennial 是同根兄弟词，但指「年年如此」的持续或反复（而非「一年发生一次」）。"}, {"word": "manner", "hl": "nn", "levels": ["托福"], "ipa": "/ˈmænər/", "subgroup": "nn", "meaning": "n. 方式，方法；举止，态度；（复数）礼仪", "etymology": "古法语 maniere，源自拉丁语 manuarius = manus（手）+ -arius。「手上的方式」→ 处理方式 → 举止。与 manual（手动的）、manufacture（制造）同根。", "roots": [{"part": "man- (manus)", "meaning": "手"}, {"part": "-ner (-arius)", "meaning": "方式、属于……的"}], "phonetics": "MAN-ner，重音在首，nn = /n/（锁住短 a /æ/）；与 manor（庄园）同音，靠语境区分。", "tip": "manor（庄园）和 manner（方式）同音！加 s 就不一样了：manners（礼仪），manors（庄园们）。", "core": "一双手怎么做事的——怎么拿、怎么放、怎么对人，每个动作里都透露着一个人的样子。", "senses": [{"gloss": "n. 方式，方法", "logic": "manus手 + -arius方式 = 「手上的方式」→ 做事的风格和路径 → 方式方法。手是人与世界交互的器官，manner 就是「手的风格→做事的风格」。", "en": "She addressed the audience in a calm and professional manner.", "zh": "她以冷静专业的方式向听众致辞。"}, {"gloss": "n. 举止，态度", "logic": "手上做事的方式→整个人呈现出来的样子→行为举止。从手的动作扩展到全身的表达，从「怎么做」到「怎么表现」。", "en": "His quiet manner made people underestimate his intelligence.", "zh": "他安静的举止让人们低估了他的才智。"}, {"gloss": "n. (pl.) 礼仪，规矩", "logic": "举止→被社会认可的好举止→符合规范的礼貌行为→礼仪。从客观描述（某人举止如何）到价值判断（举止好不好）。", "en": "It's bad manners to interrupt someone when they're speaking.", "zh": "打断别人说话是不礼貌的。"}], "derivatives": [{"w": "manual", "gloss": "adj.手工的，用手操作的 n.手册"}, {"w": "manufacture", "gloss": "v./n.制造（字面：用手做）"}, {"w": "manipulate", "gloss": "v.操纵，操控"}, {"w": "manuscript", "gloss": "n.手稿，原稿"}, {"w": "maneuver", "gloss": "v.巧妙操控 n.军事演习"}], "examples": [{"en": "She addressed the audience in a calm and professional manner.", "zh": "她以冷静专业的方式向听众致辞。", "source": "造句"}, {"en": "in a … manner / good manners", "zh": "「以……方式 / 良好礼仪」——两种义的高频用法。", "source": "高频搭配"}], "synonyms": [{"w": "way", "gloss": "方式，方法", "ipa": "/weɪ/", "note": "最口语的「方式」，in a way = in a manner，但 manner 更正式书面"}, {"w": "style", "gloss": "风格，方式", "ipa": "/staɪl/", "note": "「风格」，比 manner 更强调个人特色；her speaking style（她的演讲风格）"}, {"w": "approach", "gloss": "方法，途径", "ipa": "/əˈproʊtʃ/", "note": "「方法/方式」，比 manner 更强调解决问题的策略；a new approach to teaching（新的教学方法）"}], "antonyms": [{"w": "rudeness", "note": "粗鲁（对 manners 礼仪义）"}], "nuance": "in a … manner 是正式书面替换 in a … way；manner 强调「如何做的样子（举止风格）」，approach 强调「达到目的的策略」，style 强调「个人特有的形式感」。"}, {"word": "knack", "hl": "kn", "levels": ["托福"], "ipa": "/næk/", "subgroup": "kngn", "meaning": "n. 诀窍，本领；天赋（for doing sth）", "etymology": "中古英语 knak「小玩意儿、花招」，日耳曼语系，与德语 Knacks（裂缝声）同源。从「小技巧」演变为「做某事的天生本领」。kn 词首中 k 在 17 世纪前发音，knife 的先祖读 /knɪf/，knack 曾读 /knak/。", "roots": [{"part": "kn- (k 静音)", "meaning": "词首 k 不发音，历史遗留"}, {"part": "-ack", "meaning": "词根本体，读 /æk/"}], "phonetics": "kn = /n/（k 完全静音），-ack = /æk/，整词 /næk/。发音等同于 nack，见到 kn 开头直接去掉 k 读音。", "tip": "kn 开头的词：knife/know/knock/kneel/knack——k 全部静音，口诀：kn = n。", "core": "一种说不清从哪来的巧劲儿——别人要琢磨半天的事，你上手就会。",  on the bone for hours.", "zh": "那只狗啃了好几个小时的骨头。", "source": "造句"}, {"en": "gnaw at sb's conscience / a gnawing doubt", "zh": "「折磨某人的良知 / 挥之不去的疑虑」——抽象义高频搭配。", "source": "高频搭配"}], "synonyms": [{"w": "chew", "gloss": "咀嚼", "ipa": "/tʃuː/", "note": "「咀嚼」，比 gnaw 更普通，不强调反复啃的动作；chew food（咀嚼食物）"}, {"w": "nibble", "gloss": "小口啃，轻咬", "ipa": "/ˈnɪbl/", "note": "「小口啃、轻咬」，比 gnaw 更轻柔细小；nibble at a cracker（小口啃饼干）"}, {"w": "erode", "gloss": "侵蚀，腐蚀", "ipa": "/ɪˈroʊd/", "note": "「侵蚀」，对应 gnaw 的抽象义，更正式；erode confidence（侵蚀信心）"}], "antonyms": [{"w": "soothe", "note": "抚慰（对抽象侵蚀义）"}], "nuance": "gnaw 的核心是「持续性的啃咬/侵蚀」，物理上比 chew 更反复用力，比 nibble 更持久；抽象义上「gnaw at」是内心慢慢被某种情绪消磨（guilt gnaws at him），比 erode 更有动态感和痛感。"}, {"word": "benign", "hl": "gn", "levels": ["托福"], "ipa": "/bɪˈnaɪn/", "subgroup": "kngn", "meaning": "adj.（肿瘤）良性的；温和无害的；和善的", "etymology": "拉丁语 benignus = bene-(好) + gnus（出生，同 gnasci/nasci）= 「生来就好的」→ 天性善良的 → 温和无害的。词尾 -gn 来自拉丁语词根，g 在英语里静音。反义词 malign（恶意的）= male-(坏) + gnus。", "roots": [{"part": "bene-", "meaning": "好、善"}, {"part": "-gn (gnasci/nasci)", "meaning": "出生（g 静音）"}], "phonetics": "be-NIGN，重音在后，词尾 -gn = /n/（g 静音）；整词 /bɪˈnaɪn/。", "tip": "benign/malign 是完美对立词：bene-（好）vs male-（坏）+ 同一词尾 -gn。医学里良性/恶性肿瘤就是这对词。", "core": "这个东西生来就带着善意——不会伤害你，你可以放心地把手伸过去。", "senses": [{"gloss": "adj.（肿瘤）良性的", "logic": "bene-好 + gnus出生 = 「生来就是好的」→ 不是恶性的增生，不会威胁生命 → 良性。医学最核心的义。", "en": "The biopsy confirmed that the tumor was benign.", "zh": "活检证实肿瘤是良性的。"}, {"gloss": "adj. 温和无害的，和善的", "logic": "生来就好→天性善良→对人温和友善→不构成威胁。从医学扩展到对人的性格、环境、气候、政策的描述。核心判断始终是「这东西不会害你」。", "en": "He gave her a benign smile and waved her through.", "zh": "他给了她一个和善的微笑，挥手让她通过。"}], "derivatives": [{"w": "malignant", "gloss": "adj.恶性的（肿瘤）；恶意的"}, {"w": "malign", "gloss": "v.诽谤，中伤 adj.恶意的"}, {"w": "benevolent", "gloss": "adj.仁慈的，慈善的"}, {"w": "beneficial", "gloss": "adj.有益的，有利的"}], "examples": [{"en": "The biopsy confirmed that the tumor was benign.", "zh": "活检证实肿瘤是良性的。", "source": "造句"}, {"en": "a benign climate / a benign neglect", "zh": "「温和的气候 / 善意的忽略（有意不干涉的政策）」——两种义的高频搭配。", "source": "高频搭配"}], "synonyms": [{"w": "harmless", "gloss": "无害的", "ipa": "/ˈhɑːrmləs/", "note": "「无害的」，最口语，比 benign 更泛；a harmless joke（无害的玩笑）"}, {"w": "gentle", "gloss": "温和的，温柔的", "ipa": "/ˈdʒentl/", "note": "「温和的」，比 benign 更侧重性格温柔，无医学义"}, {"w": "favorable", "gloss": "有利的，良好的", "ipa": "/ˈfeɪvərəbl/", "note": "「有利的」，对应 benign 的「温和/有利」义；favorable conditions（有利条件）"}], "antonyms": [{"w": "malignant", "note": "恶性的（医学）；恶意的"}, {"w": "malign", "note": "恶意的；诽谤（动词）"}], "nuance": "benign 最重要的场景是医学（benign tumor 良性肿瘤），对应 malignant/malign；作「温和」义时比 gentle 更正式，常用于环境、气候、政策；「benign neglect」是政治学术语，指故意不干涉以让局势自然发展。"}, {"word": "resign", "hl": "gn", "levels": ["托福"], "ipa": "/rɪˈzaɪn/", "subgroup": "kngn", "meaning": "v. 辞职；放弃（权利）；（resign oneself to）听从，接受", "etymology": "拉丁语 resignare = re-(撤回) + signare(签名/盖印) = 「撤回签名」→ 放弃职位。词尾 -sign/-gn 中 g 静音，但派生词 resignation /ˌrezɪɡˈneɪʃn/ 中 g 复活——这是 gn 词族的重要规律。", "roots": [{"part": "re-", "meaning": "撤回、反向"}, {"part": "-sign (signare)", "meaning": "签名、标记（g 在词尾静音）"}], "phonetics": "re-SIGN，重音在后，词尾 -gn = /n/（g 静音）；但 res-ig-NA-tion 中 g 复活发 /ɡ/——派生词要单独记音。", "tip": "resign（辞职）→ resignation（辞职信）：gn 词尾 g 静音，但加后缀后 g 会复活，读 /ɡ/！sign→signal 也是同一规律。", "core": "签过名的手，现在把名字划掉——我不干了，这个位子还给你。", "senses": [{"gloss": "v. 辞职，放弃职位", "logic": "re-撤回 + signare签名 = 「撤回自己的签名」→ 把自己签过的契约/任命撤销 → 辞职。最核心的画面：入职时签了名，离职时撤回它。", "en": "The CEO resigned over the financial scandal.", "zh": "CEO 因财务丑闻辞职。"}, {"gloss": "v. 放弃（权利、主张）", "logic": "辞职→放弃职位→放弃任何被正式赋予的东西→放弃权利。从职位拓展到所有可以「交出去」的东西。", "en": "He resigned all claims to the estate.", "zh": "他放弃了对该遗产的所有主张。"}, {"gloss": "v. resign oneself to 听从，接受（命运/不可改变的事）", "logic": "放弃权利→放弃抵抗→不再挣扎→认了，接受现实。这是 resign 最微妙的义：不是放弃职位，而是放弃挣扎。resignation 的双关——辞职信 / 认命——就来源于此。", "en": "She resigned herself to the fact that the exam would be extremely difficult.", "zh": "她接受了现实——这场考试会非常难。"}], "derivatives": [{"w": "resignation", "gloss": "n.辞职（信）；顺从，认命"}, {"w": "resigned", "gloss": "adj.顺从的，逆来顺受的（认了的）"}, {"w": "sign", "gloss": "v.签名 n.标记，迹象"}, {"w": "signal", "gloss": "n.信号 v.示意"}, {"w": "signature", "gloss": "n.签名，署名"}], "examples": [{"en": "The CEO resigned over the financial scandal.", "zh": "CEO 因财务丑闻辞职。", "source": "造句"}, {"en": "resign oneself to / submit a resignation", "zh": "「听天由命 / 提交辞呈」——两种义的高频搭配。", "source": "高频搭配"}], "synonyms": [{"w": "quit", "gloss": "辞职，退出", "ipa": "/kwɪt/", "note": "「辞职/退出」，最口语，比 resign 随意；quit a job（辞职）"}, {"w": "step down", "gloss": "卸任，下台", "ipa": "/step daʊn/", "note": "「卸任，下台」，比 resign 更委婉，常用于高级职位；step down as chairman（卸任主席）"}, {"w": "abdicate", "gloss": "退位，放弃（责任）", "ipa": "/ˈæbdɪkeɪt/", "note": "「退位；放弃（责任）」，专用于君主退位或严重的责任推卸；abdicate the throne（退位）"}], "antonyms": [{"w": "take office", "note": "就职"}, {"w": "assume power", "note": "掌权"}], "nuance": "resign 是正式书面词，适用于所有层级的辞职；quit 最口语，带有主动舍弃感；step down 更委婉，常用于政治人物；abdicate 专指君主退位，也可比喻放弃责任（abdicate responsibility）。"}, {"word": "assign", "hl": "gn", "levels": ["托福"], "ipa": "/əˈsaɪn/", "subgroup": "kngn", "meaning": "v. 分配，指派；（任务/工作）布置；转让（财产）", "etymology": "拉丁语 assignare = ad-(向) + signare(签名/标记) = 「向某人签名/标记」→ 指定给某人。同 sign（标记）、signal、resign（撤回签名）同根。assignment（作业/任务）是其名词派生，gn 之后 g 复活读 /ɡ/：as-sign-MENT /əˈsaɪnmənt/（此处 g 仍静音）。", "roots": [{"part": "as- (ad-)", "meaning": "向、朝"}, {"part": "-sign (signare)", "meaning": "签名、标记（g 在词尾静音）"}], "phonetics": "as-SIGN，重音在后，词尾 -gn = /n/（g 静音）；assignment 中 gn 也静音 /əˈsaɪnmənt/。", "core": "拿笔在一个东西上写下某人的名字——这个归你了，你去搞定它。", "senses": [{"gloss": "v. 分配，分派（任务、工作）", "logic": "ad-向 + signare标记 = 「在东西上做标记，然后指向某人」→ 把任务/工作指定给特定的人 → 分配。核心是「打上归属标记」。", "en": "Each student was assigned a topic for the final presentation.", "zh": "每位学生被分配了一个期末展示题目。"}, {"gloss": "v. 指派，委派（人到岗位）", "logic": "把任务标记给某人→把人也标记到某位置→派遣/任命。从分配东西到分配人。", "en": "She was assigned to the company's London office.", "zh": "她被派驻到公司的伦敦办事处。"}, {"gloss": "v. 转让（财产、权利）", "logic": "标记给某人→在法律文件上签名过户→正式转让。法律域的专业义，「签名」的动作在此最字面。", "en": "He assigned the patent rights to the university.", "zh": "他将专利权转让给了大学。"}], "derivatives": [{"w": "assignment", "gloss": "n.作业，任务；分配"}, {"w": "assignee", "gloss": "n.受让人，受托人"}, {"w": "assignor", "gloss": "n.转让人，让与人"}, {"w": "designate", "gloss": "v.指定，标出，任命"}, {"w": "sign", "gloss": "v.签名 n.标记，符号"}], "examples": [{"en": "Each student was assigned a topic for the final presentation.", "zh": "每位学生被分配了一个期末展示题目。", "source": "造句"}, {"en": "assign a task / be assigned to a post", "zh": "「分配任务 / 被派驻某职位」——主动和被动的高频用法。", "source": "高频搭配"}], "synonyms": [{"w": "allocate", "gloss": "分配（资源/资金）", "ipa": "/ˈæləkeɪt/", "note": "「分配（资源/资金）」，比 assign 更强调按比例分配资源；allocate a budget（分配预算）"}, {"w": "delegate", "gloss": "委派，授权", "ipa": "/ˈdelɪɡeɪt/", "note": "「委派、授权」，比 assign 更强调把权力或职责向下交托；delegate authority（授权）"}, {"w": "designate", "gloss": "指定，任命", "ipa": "/ˈdezɪɡneɪt/", "note": "「指定、任命」，比 assign 更正式，强调官方指定；designate sb as spokesperson（指定某人为发言人）"}], "antonyms": [{"w": "withdraw", "note": "撤回（任务/分配）"}, {"w": "revoke", "note": "取消、撤销"}], "nuance": "assign 是最通用的「指派/分配」，可用于任务、角色、财产；allocate 专指资源的按比例分配（钱、时间、空间）；delegate 强调授权向下转让，带有信任含义；designate 是正式的官方指定，多用于职位或区域。"}, {"word": "campaign", "hl": "gn", "levels": ["托福"], "ipa": "/kæmˈpeɪn/", "subgroup": "kngn", "meaning": "n. 运动，行动；竞选活动；军事行动  v. 参加运动；开展活动", "etymology": "法语 campagne「乡野、战场」，源自拉丁语 campus（平地、广场）。「在广阔平原上展开的军事行动」→ 战役 → 有组织的社会运动。词尾 -gn 来自法语，g 在英语化后静音（读 /n/）。", "roots": [{"part": "camp- (campus)", "meaning": "平地、战场"}, {"part": "-aign (法语词尾)", "meaning": "g 静音，读 /eɪn/"}], "phonetics": "cam-PAIGN，重音在后，词尾 -gn = /n/（g 静音）；-paign = /peɪn/。", "core": "在广阔的平原上拉开阵势——有计划、有目标、有期限的一场仗，打完了就收兵。", "senses": [{"gloss": "n. 军事行动，战役", "logic": "campus平地 + campagne乡野/战场 = 「在开阔地上展开的军事行动」→ 战役。这是最原始的义。", "en": "The general planned a spring campaign to retake the occupied territory.", "zh": "将军策划了一场春季战役以夺回被占领土。"}, {"gloss": "n. 竞选活动", "logic": "军事战役→争夺权力的战斗→选举中争夺选票的有组织行动→竞选活动。从战场到投票站，斗争的本质不变。", "en": "The presidential campaign lasted nearly two years.", "zh": "总统竞选活动持续了近两年。"}, {"gloss": "n./v. 运动，有组织的行动（社会/商业等）", "logic": "战役→有组织有目标的持续行动→不限于军事和选举→任何有策略的推广/宣传/社会行动。比如广告战役(ad campaign)、环保运动。", "en": "The environmental group launched a campaign to reduce plastic waste.", "zh": "环保团体发起了一场减少塑料垃圾的运动。"}], "derivatives": [{"w": "campus", "gloss": "n.校园（字面：平地/广场）"}, {"w": "champion", "gloss": "n.冠军，拥护者（原指战场上的勇士）"}, {"w": "campaigner", "gloss": "n.活动家，运动参与者"}, {"w": "encampment", "gloss": "n.营地，扎营"}], "examples": [{"en": "The environmental group launched a campaign to reduce plastic waste.", "zh": "环保团体发起了一场减少塑料垃圾的运动。", "source": "造句"}, {"en": "election campaign / advertising campaign", "zh": "「选举活动 / 广告战役」——政治和商业高频搭配。", "source": "高频搭配"}], "synonyms": [{"w": "drive", "gloss": "运动，推进活动", "ipa": "/draɪv/", "note": "「运动、推进活动」，比 campaign 更口语；a fundraising drive（募捐活动）"}, {"w": "initiative", "gloss": "倡议，主动行动", "ipa": "/ɪˈnɪʃətɪv/", "note": "「主动行动、倡议」，比 campaign 更强调开创性；a government initiative（政府倡议）"}, {"w": "crusade", "gloss": "圣战式运动", "ipa": "/kruːˈseɪd/", "note": "「圣战式运动」，比 campaign 更充满激情甚至狂热；a crusade for human rights（为人权而战）"}], "antonyms": [{"w": "inaction", "note": "不作为"}, {"w": "opposition", "note": "反对活动（语境反义）"}], "nuance": "campaign 强调「有组织、有目标的持续行动」，可以是政治（election campaign）、商业（marketing campaign）或社会（awareness campaign）；drive 更口语，强调推动力；crusade 带强烈情感色彩，暗示为正义不惜代价的斗争。"}, {"word": "sovereign", "hl": "gn", "levels": ["托福"], "ipa": "/ˈsɒvrɪn/", "subgroup": "kngn", "meaning": "n. 君主，元首  adj. 最高权力的；独立自主的", "etymology": "古法语 souverain，源自拉丁语 superanus = super-(上方) + -anus（属于……的）= 「在最高位的」→ 君主。词尾 -gn 是法语拼写遗留，g 在英语中静音（同 campaign、champagne）。注意：ign 在此处读 /ɪn/，不是通常的 /aɪn/（区别于 sign/resign）。", "roots": [{"part": "sover- (super-)", "meaning": "上方、最高"}, {"part": "-eign (法语词尾)", "meaning": "g 静音，读 /rɪn/"}], "phonetics": "SOV-er-eign，重音在首，三音节，词尾 -reign = /rɪn/（不是 /raɪn/！）；整词 /ˈsɒvrɪn/。", "tip": "sovereign 的 -eign 读 /rɪn/ 不是 /raɪn/——不同于 sign/reign（国王统治，/reɪn/，注意 reign 也有 gn）。sovereign 是独立词，需单独记音。", "core": "站在金字塔的最顶端——头顶上再没有别人，谁也管不了我。", "senses": [{"gloss": "n. 君主，元首，最高统治者", "logic": "super-上方 + -anus属于…的 = 「属于最高位置的」→ 站在权力金字塔顶端的那个人 → 君主。最字面的义。", "en": "The sovereign addressed the nation on the anniversary of independence.", "zh": "君主在独立周年纪念日向全国发表讲话。"}, {"gloss": "adj. 拥有最高权力的，独立自主的（国家/政府）", "logic": "君主→拥有不受外部干涉的最高权力→主权独立。从个人扩展到国家——sovereign state 就是说这个国家自己就是自己的「君主」，不对任何外部势力低头。", "en": "The treaty confirmed the country's status as a sovereign nation.", "zh": "条约确认了该国作为主权国家的地位。"}], "derivatives": [{"w": "sovereignty", "gloss": "n.主权，最高统治权"}, {"w": "reign", "gloss": "n./v.统治，在位（注意发音/reɪn/, gn静音但元音不同）"}, {"w": "superior", "gloss": "adj.上级的，更好的（同词根super-）"}, {"w": "supreme", "gloss": "adj.最高的，至高无上的"}], "examples": [{"en": "The treaty confirmed the country's status as a sovereign nation.", "zh": "条约确认了该国作为主权国家的地位。", "source": "造句"}, {"en": "sovereign power / sovereign debt", "zh": "「最高权力 / 国家债务」——政治和金融高频搭配。", "source": "高频搭配"}], "synonyms": [{"w": "monarch", "gloss": "君主，国王/女王", "ipa": "/ˈmɒnək/", "note": "「君主」义的近义词，专指世袭的国王/女王，比 sovereign 更具体"}, {"w": "ruler", "gloss": "统治者", "ipa": "/ˈruːlər/", "note": "「统治者」，比 sovereign 更泛，可指任何有权力的人"}, {"w": "autonomous", "gloss": "自治的，自主的", "ipa": "/ɔːˈtɒnəməs/", "note": "「自治的、自主的」，对应 sovereign 的「独立自主」义；an autonomous region（自治区）"}], "antonyms": [{"w": "subject", "note": "臣民（对君主义）"}, {"w": "dependent", "note": "依附的，附属的（对主权义）"}], "nuance": "sovereign 作名词时是「君主」的书面正式词，monarch 特指世袭制君主，ruler 最泛；作形容词时 sovereign 强调「拥有最高不受外部干涉的权力」（sovereign state 主权国家），autonomous 强调「有自治权但可能隶属于更大实体」（autonomous region 自治区但非独立国）。"}]}</script>
<script>
const G = JSON.parse(document.getElementById('data').textContent);
const KEY = 'vocab-unfam-' + G.id;
let unfam = new Set(JSON.parse(localStorage.getItem(KEY) || '[]'));
let curLv = '全部', curSg = '全部', curQ = '', onlyUnfam = false;

const LVCLASS = {'六级':'lv6','托福':'tfl','GRE拓展':'gre','基础':''};
// 发音分组配色（按 subgroups 顺序循环取用）
const SGCOLORS = ['#2f8f83','#b0603f','#6a52a8','#c1662f','#3a7bd5'];
const SUBG = G.subgroups || [];
function sgIndex(key){ const i=SUBG.findIndex(s=>s.key===key); return i<0?0:i; }
function sgColor(key){ return SGCOLORS[sgIndex(key)%SGCOLORS.length]; }
function sgOf(key){ return SUBG.find(s=>s.key===key); }

// ---------- header
function renderHero(){
  const h = document.getElementById('hero');
  const rules = SUBG.map((s,i)=>{
    const c = SGCOLORS[i%SGCOLORS.length];
    return `<div class="rule" style="border-left:5px solid ${c}"><b style="color:${c}">${s.label}</b>${s.desc||''}</div>`;
  }).join('');
  const rhymes = (G.rhymeChains && G.rhymeChains.length)
    ? `<div class="rhymes"><h3>🎵 同韵顺口溜 · 点单词听发音，成串背最快</h3>${
        G.rhymeChains.map(c=>`<div class="chain"><span class="lab">${c.label}</span>${
          c.words.map(w=>`<span class="chip" onclick="say('${w}')">${w}</span>`).join('')
        }</div>`).join('')}</div>`
    : '';
  h.innerHTML = `
    <div class="combo"><span class="big">${G.combo}</span><span class="snd">${G.sound}</span></div>
    <h1>${G.title} · ${G.subtitle||''}</h1>
    <p class="intro">${G.intro}</p>
    <div class="rules">${rules}</div>
    ${rhymes}`;
}

// ---------- 精读：文章 + 句法分析
let speaking=false;
function sayPassage(btn){
  if(speaking){ speechSynthesis.cancel(); speaking=false; if(btn) btn.textContent='🔊 朗读全文'; return; }
  const P = G.passage; if(!P) return;
  const texts = (P.paragraphs||[]).map(p=>p.en).filter(Boolean);
  if(!texts.length) return;
  if(!VOICE) pickVoice();
  speaking=true; if(btn) btn.textContent='⏹ 停止朗读';
  let last=null;
  texts.forEach((t,i)=>{
    const u = new SpeechSynthesisUtterance(t);
    u.lang='en-US'; if(VOICE) u.voice=VOICE; u.rate=.95; u.pitch=1.0;
    if(i===texts.length-1) last=u;
    speechSynthesis.speak(u);
  });
  if(last) last.onend=()=>{ speaking=false; if(btn) btn.textContent='🔊 朗读全文'; };
}
function renderPassage(){
  const el = document.getElementById('passage');
  const P = G.passage; if(!P){ el.style.display='none'; return; }
  const paras = (P.paragraphs||[]).map(p=>{
    let en = p.en||'';
    // 高亮关键词（p.kws 或自动匹配词表词）
    const kws = p.kws || [];
    kws.forEach(k=>{ en = en.replace(new RegExp('('+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'), '<span class="kw" onclick="say(\'$1\')">$1</span>'); });
    return `<p><div class="en">${en}</div>${p.zh?`<div class="zh">${p.zh}</div>`:''}</p>`;
  }).join('');
  el.innerHTML = `<div class="passage"><h2>📖 精读原文</h2>
    <div class="p-title">${P.title||''} <button class="readall" onclick="sayPassage(this)">🔊 朗读全文</button></div>
    ${paras}</div>`;
}
const ROLECOLOR = { '主语':'#2f8f83','谓语':'#c1662f','宾语':'#3a7bd5','状语':'#6a52a8','定语':'#b0603f','补语':'#c1662f','从句':'#8c8072','连词':'#8c8072','介词':'#8c8072','插入语':'#8c8072','同位语':'#b0603f' };
function roleColor(r){ return ROLECOLOR[r] || '#6a52a8'; }
function escAttr(s){ return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
// 句子内括号标注：介词短语 ( ) · 从句 [ ] · 非谓语 { }
const BRK = {'pp':['(',')'], 'cl':['[',']'], 'nf':['{','}']};
const BRKC = {'pp':'#6a52a8', 'cl':'#3a7bd5', 'nf':'#b0603f'};
function renderFlow(s){
  let html='';
  (s.flow||[]).forEach(it=>{
    if(it.open){ const k=it.open; html+=`<span class="brkbox" style="background:${BRKC[k]}16;border-bottom:2px solid ${BRKC[k]}66"><b class="brk" style="color:${BRKC[k]}">${BRK[k][0]}</b>`; }
    else if(it.close){ const k=it.close; html+=`<b class="brk" style="color:${BRKC[k]}">${BRK[k][1]}</b></span>`; }
    else { html+=escAttr(it.t); }
  });
  return html;
}
function renderSents(){
  const el = document.getElementById('sents');
  const S = G.sentences; if(!S || !S.length){ el.style.display='none'; return; }
  const items = S.map((s,i)=>{
    const flowHtml = (s.flow && s.flow.length) ? renderFlow(s) : escAttr(s.en);
    const parts = (s.parts||[]).map(p=>{
      const c = roleColor(p.r);
      return `<span class="spart" style="background:${c}18;border:1px solid ${c}55">
        <span class="st" style="color:${c}">${escAttr(p.t)}</span>
        <span class="sr" style="background:${c}">${p.r}</span>
        ${p.n?`<span class="sn">${p.n}</span>`:''}</span>`;
    }).join('');
    return `<div class="sent">
      <div class="s-flow" data-en="${escAttr(s.en)}" onclick="say(this.dataset.en)" title="点句子朗读">${flowHtml} <button class="say-mini" data-en="${escAttr(s.en)}" onclick="event.stopPropagation();say(this.dataset.en)" title="朗读">🔊</button></div>
      ${s.zh?`<div class="s-zh">${s.zh}</div>`:''}
      <div class="s-parts">${parts}</div>
      ${s.note?`<div class="snotes">${s.note}</div>`:''}</div>`;
  }).join('');
  el.innerHTML = `<div class="sents"><h2>🔍 长难句 · 句法分析</h2>
    <div class="s-sub">点英文句可朗读 · 括号标注：<b style="color:#6a52a8">( ) 介词短语</b> · <b style="color:#3a7bd5">[ ] 从句</b> · <b style="color:#b0603f">{ } 非谓语动词</b> · 下方色块=成分功能</div>
    ${items}</div>`;
}

// ---------- filters
function renderFilters(){
  const lvs = ['全部','六级','托福','GRE拓展','基础'];
  document.getElementById('lvf').innerHTML = lvs.map(l=>
    `<span class="f${l===curLv?' on':''}" onclick="setLv('${l}')">${l}</span>`).join('');
  const sgs = [['全部','全部'], ...SUBG.map(s=>[s.tag||s.label, s.key])];
  document.getElementById('sgf').innerHTML = sgs.map(([t,v])=>
    `<span class="f${v===curSg?' on':''}" onclick="setSg('${v}')">${t}</span>`).join('');
}
function setLv(l){curLv=l;renderFilters();renderGrid();}
function setSg(s){curSg=s;renderFilters();renderGrid();}

// ---------- speech：优先自然美式女声
let VOICE=null, VOICES=[];
// 各浏览器/系统里公认自然的美式女声，按优先级排序
const PREF=[
  'Google US English',                 // Chrome：自然女声
  'Microsoft Aria Online (Natural) - English (United States)',
  'Microsoft Jenny Online (Natural) - English (United States)',
  'Microsoft Ava Online (Natural) - English (United States)',
  'Microsoft Aria','Microsoft Jenny','Microsoft Michelle',
  'Ava (Premium)','Ava (Enhanced)','Ava',   // macOS Siri 女声
  'Samantha',                          // macOS 经典美式女声
  'Allison','Susan','Nicky','Zoe','Karen','Victoria'
];
const MALE=/(alex|daniel|fred|tom|david|mark|male|aaron|arthur|gordon|oliver|rishi|junior|ralph)/i;
function usPool(){
  VOICES = speechSynthesis.getVoices()||[];
  let us = VOICES.filter(v=>/en[-_]US/i.test(v.lang)||/United States/i.test(v.name));
  if(!us.length) us = VOICES.filter(v=>/^en/i.test(v.lang));
  return us;
}
function pickVoice(){
  const pool=usPool(); if(!pool.length) return;
  VOICE=null;
  for(const n of PREF){ const h=pool.find(v=>v.name===n)||pool.find(v=>v.name.indexOf(n)===0); if(h){VOICE=h;break;} }
  if(!VOICE) VOICE = pool.find(v=>/(samantha|ava|allison|susan|nicky|zoe|karen|victoria|aria|jenny|michelle|female|google us)/i.test(v.name))
                   || pool.find(v=>!MALE.test(v.name)) || pool[0];
  fillVoiceSel(pool);
}
function fillVoiceSel(pool){
  const s=document.getElementById('voiceSel'); if(!s) return;
  s.innerHTML = pool.map(v=>{
    const nm=v.name.replace(/ - English.*/,'').replace(/Online \(Natural\)/,'✨');
    return `<option value="${v.name}"${VOICE&&v.name===VOICE.name?' selected':''}>🎙 ${nm}</option>`;
  }).join('');
}
document.getElementById('voiceSel').addEventListener('change',e=>{
  VOICE = VOICES.find(v=>v.name===e.target.value)||VOICE; say(G.combo==='aw'?'awesome':'natural');
});
if('onvoiceschanged' in speechSynthesis) speechSynthesis.onvoiceschanged = pickVoice;
pickVoice();
function say(w){
  try{
    if(!VOICE) pickVoice();
    const u = new SpeechSynthesisUtterance(w);
    u.lang='en-US'; if(VOICE) u.voice=VOICE; u.rate=.95; u.pitch=1.0;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }catch(e){}
}

// 高亮单词里的目标拼写：优先用该词自带的 hl（音位页里每词各自的拼写），否则用组的 combo
function hlWord(word, spell){
  const c = (spell||'').replace(/[.*+?^${}()|[\]\\\/·\s]/g,'');  // 只取干净字母做高亮，去掉 / · 空格等
  if(!c) return word;
  try{ return word.replace(new RegExp('('+c+')','i'), '<span class="hl">$1</span>'); }
  catch(e){ return word; }
}

// ---------- card
function card(w){
  const tags = (w.levels||[]).map(l=>`<span class="tag ${LVCLASS[l]||''}">${l}</span>`).join('');
  const roots = (w.roots||[]).map(r=>`<span class="root"><b>${r.part}</b> ${r.meaning}</span>`).join('');
  const exs = (w.examples||[]).map(e=>{
    const fam = /造句/.test(e.source)? '' : ' famous';
    return `<div class="ex${fam}"><div class="en">${e.en}</div><div class="zh">${e.zh}</div><span class="src">— ${e.source}</span></div>`;
  }).join('');
  const syns = (w.synonyms||[]).map(s=>
    `<div class="lex"><b class="lw" onclick="event.stopPropagation();say('${s.w}')">${s.w}</b>`+
    `${s.ipa?` <span class="lip">${s.ipa}</span>`:''}${s.note?` <span class="ln">— ${s.note}</span>`:''}</div>`).join('');
  const ants = (w.antonyms||[]).map(a=>
    `<span class="antchip" onclick="event.stopPropagation();say('${a.w}')">${a.w}${a.note?` <i>${a.note}</i>`:''}</span>`).join('');
  const lexSec = (syns||ants||w.nuance)
    ? `<div class="sec"><span class="l">🔗 近义词辨析 · 反义词</span>`+
      `${syns?`<div class="lexgroup"><span class="lextag syn">近义</span><div class="lexlist">${syns}</div></div>`:''}`+
      `${ants?`<div class="lexgroup"><span class="lextag ant">反义</span><div class="lexlist antline">${ants}</div></div>`:''}`+
      `${w.nuance?`<div class="nuance">🎯 ${w.nuance}</div>`:''}</div>`
    : '';
  const senses = (w.senses||[]).map(s=>
    `<div class="sense"><div class="s-gloss"><b>${s.gloss}</b>${s.logic?` <span class="s-logic">← ${s.logic}</span>`:''}</div>`+
    `${s.en?`<div class="s-ex"><span class="s-en">${s.en}</span> <span class="s-zh">${s.zh||''}</span></div>`:''}</div>`).join('');
  const senseSec = (w.core||senses)
    ? `<div class="sec"><span class="l">🧠 一词多义 · 核心意象串解</span>`+
      `${w.core?`<div class="coreimg">🎯 核心感觉：${w.core}</div>`:''}${senses}</div>`
    : '';
  const isU = unfam.has(w.word);
  const so = sgOf(w.subgroup);
  return `<div class="card${isU?' unfamiliar':''}" data-w="${w.word}" onclick="if(document.body.classList.contains('mem'))this.classList.toggle('reveal')">
    <span class="sub-tag" style="background:${sgColor(w.subgroup)}">${so?(so.tag||so.label):''}</span>
    <div class="whead">
      <span class="word">${hlWord(w.word, w.hl || G.combo)}</span>
      <span class="ipa">${w.ipa}</span>
      <button class="say" onclick="event.stopPropagation();say('${w.word}')" title="朗读">🔊</button>
    </div>
    <div class="tags">${tags}</div>
    <div class="mean">${w.meaning}</div>
    ${senseSec}
    ${w.etymology?`<div class="sec"><span class="l">🏛 造词来源 · 词源故事</span>${w.etymology}</div>`:''}
    ${roots?`<div class="sec"><span class="l">🧩 词根词缀</span><div class="roots">${roots}</div></div>`:''}
    ${w.phonetics?`<div class="sec"><span class="l">🗣 发音规律</span>${w.phonetics}</div>`:''}
    ${w.tip?`<div class="sec"><span class="l">💡 记忆钩子</span><div class="tip">${w.tip}</div></div>`:''}
    ${exs?`<div class="sec"><span class="l">✍️ 造句 · 名著/影视例句</span>${exs}</div>`:''}
    ${lexSec}
    <label class="check" onclick="event.stopPropagation()">
      <input type="checkbox" ${isU?'checked':''} onchange="toggleUnfam('${w.word}',this.checked)"> 🔺 标记不熟悉
    </label>
  </div>`;
}

function match(w){
  if(onlyUnfam && !unfam.has(w.word)) return false;
  if(curLv!=='全部' && !(w.levels||[]).includes(curLv)) return false;
  if(curSg!=='全部' && w.subgroup!==curSg) return false;
  if(curQ){
    const s=(w.word+' '+w.meaning).toLowerCase();
    if(!s.includes(curQ.toLowerCase())) return false;
  }
  return true;
}

function renderGrid(){
  const list = G.words.filter(match);
  // 不熟悉的置顶（稳定排序，保持各自原有相对顺序）
  list.sort((a,b)=>(unfam.has(b.word)?1:0)-(unfam.has(a.word)?1:0));
  const g = document.getElementById('grid');
  g.innerHTML = list.length? list.map(card).join('') : '<div class="empty">没有匹配的单词，换个筛选试试～</div>';
  updateUnfamCount();
}

function toggleUnfam(word, on){
  if(on) unfam.add(word); else unfam.delete(word);
  localStorage.setItem(KEY, JSON.stringify([...unfam]));
  const c = document.querySelector(`.card[data-w="${word}"]`);
  if(c) c.classList.toggle('unfamiliar', on);   // 立即变色，卡片原位不跳动；置顶在下次渲染/筛选时生效
  updateUnfamCount();
}
function updateUnfamCount(){
  const n = G.words.filter(w=>unfam.has(w.word)).length;
  const el = document.getElementById('unfamN');
  if(el) el.textContent = n;
}

document.getElementById('q').addEventListener('input',e=>{curQ=e.target.value;renderGrid();});
document.getElementById('unfamBtn').addEventListener('click',e=>{
  onlyUnfam=!onlyUnfam;
  e.currentTarget.classList.toggle('on',onlyUnfam);
  renderGrid();
});
document.getElementById('memBtn').addEventListener('click',e=>{
  document.body.classList.toggle('mem');
  e.target.classList.toggle('on');
  e.target.textContent = document.body.classList.contains('mem')?'🧠 记忆模式(开)·悬停显形':'🧠 记忆模式';
});

// ---------- 测验：英文 → 中文四选一（覆盖当前筛选到的全部单词）
let quiz=null;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
// 测验池 = 本页(筛选后)全部词 + 它们的同义词 + 衍生词（去重）
function quizPool(){
  const base = G.words.filter(match);
  const items=[]; const seen=new Set();
  const add=(word,ipa,meaning)=>{const k=(word||'').toLowerCase();
    if(!word||!meaning||seen.has(k))return; seen.add(k); items.push({word,ipa:ipa||'',meaning});};
  base.forEach(w=>{
    add(w.word,w.ipa,w.meaning);
    (w.synonyms||[]).forEach(s=>add(s.w,s.ipa,s.gloss||s.note));
    (w.derivatives||[]).forEach(dv=>add(dv.w,dv.ipa,dv.gloss||dv.note));
  });
  return items;
}
function startQuiz(src){
  const pool = src || quizPool();
  if(pool.length<4){ alert('至少要有 4 个词才能测验，请先放宽上方筛选～'); return; }
  quiz={list:shuffle(pool), i:0, score:0, wrong:[], done:false, next:null, pool:quizPool()};
  document.getElementById('quizOv').style.display='flex';
  renderQ();
}
function renderQ(){
  quiz.done=false; quiz.next=null;
  const q=quiz.list[quiz.i];
  const others=(quiz.pool||[]).filter(w=>w.meaning!==q.meaning);
  const opts=shuffle([q.meaning, ...shuffle(others).slice(0,3).map(w=>w.meaning)]);
  const K=['1','2','3','4'];
  document.getElementById('qbox').innerHTML=`
    <div class="qtop"><span>第 ${quiz.i+1} / ${quiz.list.length} 题 · 已答对 ${quiz.score}</span>
      <span style="cursor:pointer" onclick="closeQuiz()">✕ 关闭</span></div>
    <div class="qbar2"><i style="width:${quiz.i/quiz.list.length*100}%"></i></div>
    <div class="qword">${q.word} <button class="say" style="vertical-align:middle;width:30px;height:30px;font-size:14px" onclick="say('${q.word}')">🔊</button></div>
    <div class="qipa">${q.ipa}</div>
    <div class="qopts" id="qopts">${opts.map((o,k)=>
      `<button class="qopt" data-m="${encodeURIComponent(o)}" onclick="answer(this,'${encodeURIComponent(q.meaning)}')">
        <span class="k">${K[k]}</span><span>${o}</span></button>`).join('')}</div>
    <div class="hint">按 1–4 键作答 · 回车进入下一题</div>`;
  say(q.word);
}
function answer(el, correctEnc){
  if(quiz.done) return; quiz.done=true;
  const correct=decodeURIComponent(correctEnc);
  const chosen=decodeURIComponent(el.dataset.m);
  if(chosen===correct) quiz.score++; else quiz.wrong.push(quiz.list[quiz.i]);
  document.querySelectorAll('#qopts .qopt').forEach(b=>{
    const m=decodeURIComponent(b.dataset.m);
    if(m===correct) b.classList.add('right');
    else if(b===el) b.classList.add('wrong');
    else b.classList.add('dim');
    b.style.pointerEvents='none';
  });
  const btn=document.createElement('button');
  btn.className='qnext';
  btn.textContent = quiz.i<quiz.list.length-1 ? '下一题 →' : '看结果 →';
  btn.onclick=nextQ;
  document.getElementById('qbox').appendChild(btn);
  quiz.next=btn;
}
function nextQ(){
  if(quiz.i<quiz.list.length-1){ quiz.i++; renderQ(); } else endQuiz();
}
function endQuiz(){
  const tot=quiz.list.length, pct=Math.round(quiz.score/tot*100);
  const wrongHtml = quiz.wrong.length
    ? quiz.wrong.map(w=>`<div class="r"><b>${w.word}</b> ${w.ipa} — ${w.meaning}</div>`).join('')
    : '<div class="r">全部答对，太强了！🎉</div>';
  const wrongCopy = quiz.wrong.slice();
  document.getElementById('qbox').innerHTML=`
    <div class="qend">
      <div class="qtop" style="justify-content:flex-end"><span style="cursor:pointer" onclick="closeQuiz()">✕ 关闭</span></div>
      <div>本轮得分</div><div class="qscore">${quiz.score}/${tot}</div>
      <div style="color:var(--muted)">正确率 ${pct}%</div>
      <div class="qwrong"><div style="color:var(--exc);font-weight:700;margin-bottom:4px">错题（${quiz.wrong.length}）</div>${wrongHtml}</div>
      <div id="qendBtns"></div>
    </div>`;
  const box=document.getElementById('qendBtns');
  if(wrongCopy.length){
    const b1=document.createElement('button'); b1.className='qnext'; b1.textContent='只测这些错题';
    b1.onclick=()=>startQuiz(wrongCopy); box.appendChild(b1);
  }
  const b2=document.createElement('button'); b2.className='qnext';
  b2.style.cssText='background:#fff;color:var(--accent);border:1.5px solid var(--accent);margin-top:8px';
  b2.textContent='再来一轮（当前筛选）'; b2.onclick=()=>startQuiz(); box.appendChild(b2);
}
function closeQuiz(){ document.getElementById('quizOv').style.display='none'; quiz=null; }
document.getElementById('quizBtn').addEventListener('click',()=>startQuiz());
document.getElementById('quizOv').addEventListener('click',e=>{ if(e.target.id==='quizOv') closeQuiz(); });
document.addEventListener('keydown',e=>{
  if(!quiz || document.getElementById('quizOv').style.display==='none') return;
  if(quiz.next && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); quiz.next.click(); return; }
  if(!quiz.done && /^[1-4]$/.test(e.key)){ const b=document.querySelectorAll('#qopts .qopt')[+e.key-1]; if(b) b.click(); }
});

document.getElementById('foot').innerHTML =
  `共 ${G.words.length} 词 · 数据源：托福 4264 词表（真实词库）+ 六级核心词 · `+
  `发音由浏览器语音合成朗读 · 名著/影视例句均为真实出处，「造句」为学习例句，「高频搭配」为常用短语。`;

renderHero(); renderPassage(); renderSents(); renderFilters(); renderGrid();
</script>
