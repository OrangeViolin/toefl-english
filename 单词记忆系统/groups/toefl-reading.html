认知过程的认知）"}, {"w": "incognito", "gloss": "隐姓埋名的，化名的"}]}, {"word": "colonial", "levels": ["托福"], "ipa": "/kəˈloʊniəl/", "subgroup": "social-science", "meaning": "a. 殖民的；殖民国家的", "etymology": "源自拉丁语 colonia '定居地、被耕种的土地、庄园'，来自 colonus '农民、佃农、在新土地上定居的人'，最终来自 colere '耕种、培育'。罗马帝国的 colonia 是派到征服地上定居的退伍军人社区——既是农场，也是军事据点。从'耕种土地'到'占领土地'，colony 的语义变迁本身就是一部帝国史。同源词：culture（文化，也来自 colere '培育'）、agriculture（农业，田地+培育）、cultivate（耕种、培养）。", "roots": [{"part": "colon-", "meaning": "耕种、定居"}, {"part": "-ial", "meaning": "形容词后缀"}], "phonetics": "/kəˈloʊniəl/，重音在第二音节 /loʊ/；co- 弱读为 /kə/ 而不是 /koʊ/；注意不要读成 /kəˈloʊnəl/（那是 colonel 上校，一个完全不同且拼读不一致的词）。", "tip": "colon(定居地→殖民地)+ial(形容词)=殖民的——colere'耕种'也是culture的词源：殖民者'耕种'新大陆，也'培养'了自己的文化。", "examples": [{"en": "The colonial legacy continues to shape economic inequalities between the Global North and South.", "zh": "殖民遗产至今仍在塑造全球北方与南方之间的经济不平等。", "source": "造句"}, {"en": "colonial rule", "zh": "殖民统治", "source": "高频搭配"}, {"en": "India's struggle for independence from British colonial rule, led by Gandhi's nonviolent movement, became a model for decolonization worldwide.", "zh": "印度在甘地非暴力运动领导下争取从英国殖民统治中独立的斗争，成为全世界去殖民化的典范。", "source": "文化锚点"}], "synonyms": [{"w": "imperial", "ipa": "/ɪmˈpɪriəl/", "gloss": "帝国的", "note": "泛指帝国的扩张和统治，范围比 colonial 更广——日本在朝鲜的统治可称为 imperial，但通常不叫 colonial（因为是邻近征服而非远程定居型殖民地）。"}, {"w": "settler", "ipa": "/ˈsetlər/", "gloss": "定居者（的）", "note": "更中性，描述的是'去新地方定居'这一行为，不一定包含政治统治和征服的含义。"}], "antonyms": [{"w": "postcolonial", "note": "后殖民的"}, {"w": "indigenous", "note": "土著的，本土的"}, {"w": "sovereign", "note": "主权的，独立的"}], "nuance": "colonial 特指'殖民地'这一统治形式：母国向海外派遣定居者、建立政治控制、经济剥削和文化同化。imperial 泛指帝国扩张，不含'定居'要素。Britain had an empire, but only parts of it were colonies（有些是 protectorate 保护国或 mandate 托管地）。", "core": "一艘大船靠岸，穿深色西装的人走下舷梯，脚下的木头在炎热的海风里嘎吱作响——他在一片他从未见过的植物气味中，竖起了一面他从小就认识的旗帜。", "senses": [{"gloss": "a. 殖民的；殖民国家的", "logic": "核心意象'远道而来的宗主国对异域土地的政治、经济和文化控制'→ 从'耕种定居'引申为殖民统治的全部内涵。", "en": "The museum's exhibition critically examines the violence embedded in colonial expansion.", "zh": "博物馆的展览批判性地审视了殖民扩张中蕴含的暴力。"}], "derivatives": [{"w": "colony", "gloss": "殖民地"}, {"w": "colonialism", "gloss": "殖民主义"}, {"w": "colonize", "gloss": "殖民；开拓殖民地"}, {"w": "colonist", "gloss": "殖民者"}]}, {"word": "immigrant", "levels": ["六级", "托福"], "ipa": "/ˈɪmɪɡrənt/", "subgroup": "social-science", "meaning": "n.（外来）移民；侨民 a.（从国外）移来的", "etymology": "源自拉丁语 immigrantem '移入'，由 in- '进入' + migrare '移动、改变居住地' 构成。migrare 是一只候鸟扇动翅膀的意象——季节到了就飞，这是生物的本能。immigrant 就是'飞进来的那只鸟'。同源词：emigrant（移出者，ex- 出去 + migrare）、migrant（流动者，不指明方向）、migrate（迁移，动词）。这一组词的区别全靠前缀：im-（进）vs e-（出）。", "roots": [{"part": "im-", "meaning": "进入"}, {"part": "migr-", "meaning": "移动、迁移"}, {"part": "-ant", "meaning": "做…的人"}], "phonetics": "/ˈɪmɪɡrənt/，重音在第一音节；im- /ˈɪm/（短元音），不是 /aɪm/；两个 m 之间没有 n——很多人因为不习惯 /ɪmɪɡ/ 这个音序列而插入鼻音读成 /ˈɪmɪnɡrənt/。", "tip": "im(进入)+migr(移动)+ant(人)=移'进来'的人——记方向：exit→emigrant出，in→immigrant进。", "examples": [{"en": "Immigrants have founded nearly half of the Fortune 500 companies in the United States.", "zh": "美国财富500强公司中有近一半是由移民创立的。", "source": "造句"}, {"en": "undocumented immigrant", "zh": "无证移民（学术语境替代illegal immigrant的中性说法）", "source": "高频搭配"}, {"en": "Ellis Island processed over 12 million immigrants entering the United States between 1892 and 1954.", "zh": "埃利斯岛在1892年至1954年间处理了超过1200万进入美国的移民。", "source": "文化锚点"}], "synonyms": [{"w": "emigrant", "ipa": "/ˈemɪɡrənt/", "gloss": "移出者，出境移民", "note": "同一个动作的两个视角：从中国去美国的人，对中国是 emigrant（移出者），对美国是 immigrant（移入者）。"}, {"w": "migrant", "ipa": "/ˈmaɪɡrənt/", "gloss": "移民，流动工人", "note": "不指明迁移方向，常指季节性或有期限的流动（migrant worker 农民工/流动工人）。"}, {"w": "refugee", "ipa": "/ˌrefjuˈdʒiː/", "gloss": "难民", "note": "因迫害、战争或灾难被迫离开家园的人，受国际法保护；immigrant 可能是自愿选择迁移。"}], "antonyms": [{"w": "native", "note": "本地人，原住民"}, {"w": "emigrant", "note": "移出者（方向相反）"}], "nuance": "immigrant vs emigrant 是同一趟旅程的两端：你从上海出发去纽约，在上海你是 emigrant（出境移民），在纽约你是 immigrant（入境移民）。migrant 不指定方向，可进可出也可以是内部流动。refugee 有法律定义——必须有'对迫害的充分恐惧'。", "core": "一个人提着行李箱站在海关通道前，前面的标语是他不认识的语言，背后的故乡缩成手机里一张正在加载的照片——踏出这一步，一辈子被切成了之前和之后两半。", "senses": [{"gloss": "n.（外来）移民；侨民", "logic": "核心意象'从一个国家移入另一个国家定居的人'→ 从'移进来的人'引申为移民身份。", "en": "As a first-generation immigrant, she navigated between her parents' traditions and her new country's expectations daily.", "zh": "作为第一代移民，她每天都在父母的传统和新国家的期望之间穿行。"}, {"gloss": "a.（从国外）移来的", "logic": "从名词用法自然引申为形容词——'移民的'→ 修饰与移民相关的任何事物。", "en": "The immigrant neighborhood pulsed with languages from a dozen different countries.", "zh": "这个移民社区里跳动着十几个不同国家的语言。"}], "derivatives": [{"w": "immigrate", "gloss": "移入，移民（动词）"}, {"w": "immigration", "gloss": "移民；入境；移民局"}, {"w": "migrate", "gloss": "迁移，迁徙（不指明方向）"}, {"w": "emigrant", "gloss": "移出者，出境移民"}]}, {"word": "urbanization", "levels": ["托福"], "ipa": "/ˌɜːrbənaɪˈzeɪʃn/", "subgroup": "social-science", "meaning": "n. 都市化", "etymology": "由 urban（源自拉丁语 urbanus '属于城市的'，来自 urbs '城市'）+ -ization（名词化后缀，表示'…化的过程'）构成。古罗马人称自己的首都为 Urbs——大写的'那座城'，因为在他们眼中全世界只有一座真正的城市。当罗马人说 urbanus，他们不只是在说'城市的'，而是在说'文明的、优雅的、有教养的'（与 rusticus '乡下的、粗野的'对立）。urbanization 承载着这种从 urbs 到 metropolis 的文明向心力。同源词：urban（城市的）、suburb（郊区，sub-下面+urbs）、urbane（温文尔雅的，带城市人的精致感）。", "roots": [{"part": "urban-", "meaning": "城市的"}, {"part": "-ization", "meaning": "…化的过程"}], "phonetics": "/ˌɜːrbənaɪˈzeɪʃn/，重音在倒数第三音节 /zeɪ/；ur- 英式读 /ɜː/（类似'呃'拉长），美式读 /ɜːr/（带 r 化）；注意第二个音节 -ban- 弱读为 /bən/，不是 /bæn/；-ization 读 /aɪˈzeɪʃn/ 四个音节缩成接近三个。", "tip": "urban(城市的)+ization(化)=城市化——urban同源suburb(郊区)、urbane(温文尔雅的)，都来自拉丁语urbs'那座城'(罗马)。", "examples": [{"en": "Unchecked urbanization without adequate infrastructure has led to the proliferation of slums across the developing world.", "zh": "缺乏足够基础设施的无序城市化导致了发展中世界贫民窟的激增。", "source": "造句"}, {"en": "rapid urbanization", "zh": "快速城市化", "source": "高频搭配"}, {"en": "China's urbanization rate surged from roughly 18% in 1978 to over 65% by 2024 — the largest migration in human history.", "zh": "中国的城市化率从1978年约18%飙升至2024年超过65%——这是人类历史上最大规模的人口迁移。", "source": "文化锚点"}], "synonyms": [{"w": "urban development", "ipa": "/ˈɜːrbən dɪˈveləpmənt/", "gloss": "城市发展", "note": "侧重规划和建设层面的积极发展，比 urbanization 更正面；urbanization 是中性描述宏观趋势。"}, {"w": "urban sprawl", "ipa": "/ˈɜːrbən sprɔːl/", "gloss": "城市蔓延，无序扩张", "note": "特指低密度、缺乏规划、依赖汽车的城市郊区无限扩张，带强烈负面批判色彩。"}], "antonyms": [{"w": "ruralization", "note": "乡村化（人口从城市回流农村）"}, {"w": "suburbanization", "note": "郊区化（城市人口向郊区扩散而非向市中心集中）"}, {"w": "deurbanization", "note": "逆城市化"}], "nuance": "urbanization 描述人口从农村向城市迁移、城市面积扩大的宏观历史过程，是一个中性的社会学术语。urban sprawl 是 urbanization 的一种特定负面形态——像摊大饼一样无规划地向郊区低密度蔓延。urban development 则侧重'建设'和'改善'，规划者会说 urban development，批评者会说 urban sprawl。", "core": "站在一片正在被推平的稻田边——左边是收割后的秸秆在午后的阳光里静默，右边打桩机的轰鸣震得脚底发麻，地平线上吊塔像钢铁森林一样一夜间长了出来，空气里全是水泥粉尘混着新翻的泥土味。", "senses": [{"gloss": "n. 都市化，城市化", "logic": "核心意象'农村土地被城市吞噬、人口涌入城市的历史过程'→ 从'城市+化'引申为城市化这一宏大的社会转型。", "en": "The rapid urbanization of the 19th century transformed Europe from a continent of farmers into one of factory workers.", "zh": "19世纪的快速城市化将欧洲从一个农民的大陆转变为工厂工人的大陆。"}], "derivatives": [{"w": "urbanize", "gloss": "使城市化"}, {"w": "urban", "gloss": "城市的"}, {"w": "urbanized", "gloss": "已城市化的"}, {"w": "suburb", "gloss": "郊区（sub-下面+urbs城市）"}]}, {"word": "database", "levels": ["六级", "托福"], "ipa": "/ˈdeɪtəbeɪs/", "subgroup": "modern-tech", "meaning": "n. 数据库", "etymology": "20世纪60年代计算机术语，由data（数据）+ base（基地）合成。想象一个军营基地，每个帐篷里按编号整理存放着不同的情报档案，检索员一查编号就能调取。", "roots": [{"part": "data", "meaning": "数据，资料"}, {"part": "base", "meaning": "基地，基础"}], "phonetics": "/ˈdeɪtəbeɪs/ 重音在首音节。注意data英美发音差异（英/deɪ/、美/dæ/），但database常见读/deɪ/。三个音节清晰：day-tuh-base。", "tip": "data的base——数据的大本营，所有信息集中存放的地方。", "examples": [{"en": "All user information is stored in a cloud-based database.", "zh": "所有用户信息存储在一个云端数据库中。", "source": "造句"}, {"en": "relational database management system (RDBMS)", "zh": "关系型数据库管理系统", "source": "TPO高频搭配"}], "synonyms": [{"w": "repository", "ipa": "/rɪˈpɑːzətɔːri/", "gloss": "存储库；仓库", "note": "repository泛指任何存储处（物理档案室或数字仓库），database特指结构化的电子数据库。"}, {"w": "data warehouse", "ipa": "/ˈdeɪtə ˈwerhaʊs/", "gloss": "数据仓库", "note": "数据仓库规模更大，面向分析而非日常事务操作。"}], "antonyms": [{"w": "scattered data", "note": "分散数据"}], "nuance": "database强调结构化、可检索的电子数据集，核心是可查询（query）。repository更广义，可以是非结构化存储或物理实体。TPO阅读填词题常考：文中提到'store and retrieve information'时选database而非storage。", "core": "一间巨大的电子档案室，所有资料按编号规整排列在泛着冷光的金属架上，敲一下键盘，机械臂就能精准抽出你需要的任何一格——无声、精确、永不遗忘。", "senses": [{"gloss": "n. 数据库", "logic": "data(数据)+base(基地)→存放数据的基地→集中存储和管理结构化信息的电子系统→数据库", "en": "The research team built a genetic database of over 10,000 marine species.", "zh": "研究团队建立了一个包含超过一万个海洋物种的基因数据库。"}], "derivatives": [{"w": "dataset", "gloss": "数据集"}, {"w": "metadata", "gloss": "元数据（关于数据的数据）"}, {"w": "data-driven", "gloss": "数据驱动的"}]}, {"word": "virtual", "levels": ["六级", "托福"], "ipa": "/ˈvɜːrʧuəl/", "subgroup": "modern-tech", "meaning": "a.（通过计算机软件）模拟的，虚拟的；实际上的", "etymology": "源自拉丁语virtus（美德、力量、效能）。中世纪经院哲学用virtualis表示'有效果但非物理形式的'，即'实质上等同的'。1960年代计算机时代，这个词从哲学名词变成了科技热词——VR（Virtual Reality）中的virtual就是这个'非物理但效果等同'的意思。", "roots": [{"part": "virtu-", "meaning": "力量，效能（拉丁语virtus）"}, {"part": "-al", "meaning": "形容词后缀"}], "phonetics": "/ˈvɜːrʧuəl/ 重音在首音节。注意中间的tʃ音（像中文'吃'的前半），不要读成/t/或/ʃ/。两个音节，不要加音节读成vir-tu-al（三个音节的读法只出现在极少数英式口音中）。", "tip": "VR = Virtual Reality（虚拟现实），效果完全真实但没有物质实体。", "examples": [{"en": "Students can conduct virtual experiments without stepping into a physical lab.", "zh": "学生无需走进实体实验室就能进行虚拟实验。", "source": "造句"}, {"en": "virtual reality (VR)", "zh": "虚拟现实", "source": "文化锚点"}, {"en": "virtual community / virtual meeting", "zh": "虚拟社区 / 虚拟会议", "source": "高频搭配"}], "synonyms": [{"w": "simulated", "ipa": "/ˈsɪmjuleɪtɪd/", "gloss": "模拟的", "note": "simulated强调'用模型替代真实来运行'，virtual强调'效果等同真实但形式不同'。"}, {"w": "digital", "ipa": "/ˈdɪdʒɪtl/", "gloss": "数字的", "note": "digital指技术形式（0/1信号），virtual更强调体验层面的'非物理但等同'。"}], "antonyms": [{"w": "physical", "note": "实体的，物理的"}, {"w": "actual", "note": "实际的，真实的"}, {"w": "tangible", "note": "有形的，可触摸的"}], "nuance": "virtual强调'本质上等同但形式不同'：virtual meeting和线下会议效果等同。simulated强调'用模型复制'：simulated flight你知道是假的（模拟器）。virtual作'几乎'义（virtual guarantee = 几乎算保证）来自：名义上不是但效果上等同于→实际上。这是填词题最爱考的陷阱：别把'virtual reality'和'a virtual certainty'中的virtual当成两个完全无关的词。", "core": "一道光影构成的长会议桌浮在半空中，你能看到每个人的表情、听到声音、感受到讨论的热度，伸手却只穿过光——它不在物理世界存在，但你的大脑已经把它当成了真实的。", "senses": [{"gloss": "a.（计算机）虚拟的，模拟的", "logic": "从'有效果但不具实体'的哲学义→计算机时代：用软件模拟出看起来/用起来真实但非物理存在的→虚拟的", "en": "The museum launched a virtual tour of its ancient Egyptian collection.", "zh": "博物馆推出了古埃及藏品的虚拟导览。"}, {"gloss": "a. 实际上的，几乎的", "logic": "从'效果等同'延伸→虽然名义上不完全如此，但实质效果等同于→实际上，几乎等同于", "en": "The monopoly position gave the company a virtual stranglehold on the market.", "zh": "垄断地位让这家公司实际上扼住了市场的咽喉。"}], "derivatives": [{"w": "virtually", "gloss": "几乎；实际上；虚拟地"}, {"w": "virtue", "gloss": "美德；优点；功效"}, {"w": "virtualization", "gloss": "虚拟化（技术）"}]}, {"word": "infrastructure", "levels": ["六级", "托福"], "ipa": "/ˈɪnfrəˌstrʌktʃər/", "subgroup": "modern-tech", "meaning": "n. 基础设施，基础结构", "etymology": "源自法语infrastructure（19世纪末），由infra-（在……下面）+ structure（结构）组成。最早是军事工程术语，指铁路、桥梁、堡垒等军用设施的地基和下层支撑结构。二战后广泛用于民用领域，公路网、电网、光缆网，再到今天的云计算infrastructure，都是城市/系统底下那张看不见的骨架。", "roots": [{"part": "infra-", "meaning": "在下，在下层"}, {"part": "struct", "meaning": "建造，搭起"}, {"part": "-ure", "meaning": "名词后缀"}], "phonetics": "/ˈɪnfrəˌstrʌktʃər/ 四个音节，主重音在首音节IN，次重音在STRUC。infra中的a弱读为/ə/（不是/ɑː/）。重音放错（比如读成in-FRUC-ture）是常见错误。", "tip": "infra（下面）+ structure（结构）= 地表以下支撑整个城市的那张隐形骨架。没有它，上面的高楼一秒都站不住。", "examples": [{"en": "The government plans to invest heavily in transportation infrastructure over the next decade.", "zh": "政府计划在未来十年大力投资交通基础设施。", "source": "造句"}, {"en": "IT infrastructure / cloud infrastructure", "zh": "IT基础设施 / 云基础设施", "source": "高频搭配"}, {"en": "critical infrastructure", "zh": "关键基础设施（如电网、供水、通信）", "source": "TPO高频"}], "synonyms": [{"w": "framework", "ipa": "/ˈfreɪmwɜːrk/", "gloss": "框架，结构体系", "note": "framework更抽象，指组织性的框架（如legal framework法律框架）；infrastructure强调实体的/技术的底层支撑系统。"}, {"w": "foundation", "ipa": "/faʊnˈdeɪʃn/", "gloss": "地基，基础", "note": "foundation是'一层地基'，infrastructure是一整套'网络化支撑系统'（交通网+电网+通信网都算）。"}], "antonyms": [{"w": "superstructure", "note": "上层建筑（建在基础设施之上的东西）"}, {"w": "surface-level", "note": "表层的，非底层的"}], "nuance": "infrastructure是复数概念——单条公路不是infrastructure，但整座城市的公路网加上管网和电网才是。TPO城市发展/经济类文章高频词，常讨论'aging infrastructure'（老化基础设施）和'invest in infrastructure'（基础设施投资）。", "core": "你站在繁华的城市路面之上，脚下三米深处，水管、电缆、光缆、地铁隧道像血管和神经一样交织成一张沉默的巨网——你一辈子都看不见它，但城市离了它一秒都活不了。", "senses": [{"gloss": "n. 基础设施，基础结构", "logic": "infra(在下)+struct(建造)+ure(名词)→建在底下的支撑结构→基础设施", "en": "Aging infrastructure poses serious risks to public safety in many cities.", "zh": "老化的基础设施对许多城市的公共安全构成严重风险。"}], "derivatives": [{"w": "structural", "gloss": "结构的；结构上的"}, {"w": "construct", "gloss": "建造；构想（v.）；构想（n.）"}, {"w": "obstruct", "gloss": "阻碍，阻挡（ob-=against）"}]}, {"word": "interface", "levels": ["六级", "托福"], "ipa": "/ˈɪntərfeɪs/", "subgroup": "modern-tech", "meaning": "n. 界面，分界面；接口", "etymology": "1880年代首次出现，由inter-（之间、互相）+ face（面）构成。最初是物理学术语，描述两种物质接触的界面（如油水界面）。1960年代计算机科学借用为'人机交互界面'，后来UI（User Interface）成为数字时代最常用的概念之一。同时，这个词也进入了管理学和交叉学科语境——描述不同领域/系统'对话'的那个中间地带。", "roots": [{"part": "inter-", "meaning": "在……之间，互相"}, {"part": "face", "meaning": "面，表面"}], "phonetics": "/ˈɪntərfeɪs/ 重音在第一音节IN。注意inter在美音中读/ˈɪntər/（t轻读），不是/ɪnˈtɜːr/。face读/feɪs/，不要吞掉/f/。三个音节：IN-ter-face。", "tip": "inter（之间）+ face（面）= 两个世界相触的那个'面'。你指尖碰到的手机屏幕，就是你和数字世界之间的interface。", "examples": [{"en": "The new app has a clean, intuitive user interface that even beginners can navigate easily.", "zh": "新应用有一个干净直观的用户界面，连新手都能轻松操作。", "source": "造句"}, {"en": "user interface (UI)", "zh": "用户界面", "source": "文化锚点"}, {"en": "the interface between science and policy", "zh": "科学与政策的交汇面/接口", "source": "TPO学术搭配"}], "synonyms": [{"w": "boundary", "ipa": "/ˈbaʊndəri/", "gloss": "边界，分界线", "note": "boundary强调分隔（线这边是你那边是我）；interface强调连接和交互（这个面让两边对话）。"}, {"w": "intermediary", "ipa": "/ˌɪntərˈmiːdieri/", "gloss": "中介，中间人", "note": "intermediary是人/机构穿针引线，interface是技术性的系统接触面。"}], "antonyms": [{"w": "barrier", "note": "障碍，壁垒（阻断而非连接）"}, {"w": "isolation", "note": "隔离（无接触）"}], "nuance": "interface的核心功能是连接+交互：它是'两个系统之间可以对话的那个面'。boundary的核心功能是分隔。TPO阅读中interface经常出现在跨学科语境：'at the interface of biology and engineering'（在生物学和工程学的交叉地带）。", "core": "手机屏幕的那层玻璃——它自己不产生任何内容，但你所有对数字世界的触摸、滑动、点击都穿过它。它是两个世界之间那层薄如蝉翼的膜，一边是你的手指，另一边是亿万行代码。", "senses": [{"gloss": "n. 界面；接口；分界面", "logic": "inter(互相)+face(面)→两个系统互相接触的面→界面/接口", "en": "The interface between the two software modules must be clearly documented.", "zh": "两个软件模块之间的接口必须有清晰的文档说明。"}, {"gloss": "v.（使通过接口）连接，交互", "logic": "从名词'接触面'动词化→在接触面上进行连接和交互→连接，交互", "en": "The new payment system interfaces seamlessly with major banks.", "zh": "新的支付系统与各大银行无缝连接。"}], "derivatives": [{"w": "interact", "gloss": "互动，交互"}, {"w": "interpersonal", "gloss": "人际的"}, {"w": "interdisciplinary", "gloss": "跨学科的"}]}, {"word": "prototype", "levels": ["托福"], "ipa": "/ˈproʊtətaɪp/", "subgroup": "modern-tech", "meaning": "n. 原型，雏形", "etymology": "源自希腊语prōtotypon，由prōto-（最初的、第一的）+ typos（模型、印迹、类型）组成。16世纪通过法语prototype进入英语，指'最早的铸模或原始模型'。工程和设计中，prototype是'第一个可以拿来测试的实物版本'——通常粗糙但证明了核心理念可行。", "roots": [{"part": "proto-", "meaning": "最初的，原始的"}, {"part": "type", "meaning": "类型，模型"}], "phonetics": "/ˈproʊtətaɪp/ 重音在首音节PRO。注意proto-读/ˈproʊtə/（PRO-tuh）而非/proˈtɒ/。type中的y读/aɪ/（长音i），不要读成短/i/。", "tip": "proto（最初）+ type（模型）= 最早做出来的那个'样'。汽车公司的概念车、App的第一个可点击版本，都是prototype。", "examples": [{"en": "The engineering team built and tested three prototypes before finalizing the design.", "zh": "工程团队在敲定设计之前制作并测试了三个原型。", "source": "造句"}, {"en": "working prototype", "zh": "可运作的原型机", "source": "TPO高频"}, {"en": "rapid prototyping", "zh": "快速原型开发", "source": "行业锚点（3D打印/软件开发）"}], "synonyms": [{"w": "model", "ipa": "/ˈmɑːdl/", "gloss": "模型", "note": "model泛指任何比例/概念上的模型（建筑模型、数学模型），prototype特指'第一个可测试的实物版本'。"}, {"w": "archetype", "ipa": "/ˈɑːrkitaɪp/", "gloss": "原型，典范", "note": "archetype是文学/心理学中的'原始模型'（如英雄archetype），更抽象；prototype是工程/设计中的实物或早期版本。"}], "antonyms": [{"w": "finished product", "note": "成品"}, {"w": "mass production model", "note": "量产版"}], "nuance": "prototype的核心是'最早可验证的版本'——外观可能粗糙，但核心功能必须能跑。model更偏展示/概念，不一定是可运作的。archetype是抽象的类型原型（如'母亲archetype'），不是实物。", "core": "一个用粗糙木板和胶带搭起来的飞行器，螺旋桨能嗡嗡地转、机翼在风中颤抖，所有人围过来看——它不好看、不能坐人，但当它第一次离地三秒钟的时候，所有人都知道：能飞的，只是还没有磨光滑而已。", "senses": [{"gloss": "n. 原型，雏形，最初版本", "logic": "proto(最初)+type(模型)→最早做出来的那个样版本→原型，雏形", "en": "The prototype of the folding bicycle weighed less than seven kilograms.", "zh": "这款折叠自行车的原型重量不到七公斤。"}], "derivatives": [{"w": "prototypical", "gloss": "原型的；典型的"}, {"w": "protocol", "gloss": "协议；礼仪规范（proto+col→'第一张胶水纸'→最初的规定）"}, {"w": "proton", "gloss": "质子"}]}, {"word": "synthesize", "levels": ["托福"], "ipa": "/ˈsɪnθəsaɪz/", "subgroup": "modern-tech", "meaning": "vt. 合成；综合", "etymology": "源自希腊语synthesis，由syn-（一起、共同）+ tithenai（放、放置）组成。17世纪以名词synthesis进入英语，19世纪衍生出动词synthesize。化学中最先使用——把简单物质'放到一起'产生复杂物质。后来被音乐（合成器）、学术写作（综合文献）、哲学（正反合）等领域广泛借用。", "roots": [{"part": "syn-", "meaning": "一起，共同"}, {"part": "thes", "meaning": "放置，安排"}, {"part": "-ize", "meaning": "动词后缀（使……化）"}], "phonetics": "/ˈsɪnθəsaɪz/ 重音在第一音节SYN。注意syn-读/sɪn/而不是/saɪn/。th在词中保持/θ/音（舌尖轻咬）。三个音节：SIN-thuh-size。", "tip": "syn（一起）+ thes（放）+ ize = 把不同的东西放到一起，化学反应般产生全新的东西。不是'拼凑'，是'合成出新物质'。同源词：photosynthesis（光合作用）= photo(光)+synthesis(合成)。", "examples": [{"en": "A good literature review does not just summarize papers — it synthesizes them into a new argument.", "zh": "好的文献综述不只是罗列论文——它把论文综合成一个新的论点。", "source": "造句"}, {"en": "synthesize a new compound", "zh": "合成一种新化合物", "source": "TPO化学类高频"}, {"en": "synthesize information from multiple sources", "zh": "综合多个来源的信息", "source": "学术写作高频搭配"}], "synonyms": [{"w": "integrate", "ipa": "/ˈɪntɪɡreɪt/", "gloss": "整合，使融入", "note": "integrate强调把分散部分融合成一个整体（如integrate into society融入社会）；synthesize强调从不同元素中创造出新东西。"}, {"w": "combine", "ipa": "/kəmˈbaɪn/", "gloss": "结合，合并", "note": "combine是物理层面的放在一起（mix），synthesize是化学反应式的新造——产生的东西不等于原材料的简单相加。"}], "antonyms": [{"w": "analyze", "note": "分析（拆开看各部分，与synthesize方向相反）"}, {"w": "decompose", "note": "分解"}], "nuance": "synthesize vs analyze是一对经典对立：analyze = 把整体拆成部分来看；synthesize = 把部分合成新的整体。学术写作中的synthesize是高分关键词——它意味着你不仅读了文献，还能从不同文献中提炼、重组、形成新观点，而非简单罗列。", "core": "一个化学家站在实验台前，左手一瓶深蓝液体，右手一罐白色粉末，同时倒进烧瓶——烧瓶里不是蓝白相间，而是冒出紫烟，生成了全新的深紫色晶体。它既不是蓝也不是白，是两种原料在一起后诞生的第三种东西。", "senses": [{"gloss": "v. 合成（化合物）", "logic": "syn(一起)+thes(放置)+ize→把化学物质放到一起产生新物质→（化学）合成", "en": "Researchers successfully synthesized a new polymer that degrades in seawater within weeks.", "zh": "研究人员成功合成了一种能在海水中几周内降解的新型聚合物。"}, {"gloss": "v. 综合，融合（信息/观点）", "logic": "从化学'合成'隐喻延伸到信息处理→把不同来源的信息放在一起形成新的理解→综合", "en": "A skilled historian can synthesize scattered archival records into a compelling narrative.", "zh": "一个有技巧的历史学家能把零散的档案记录综合成一个引人入胜的叙事。"}], "derivatives": [{"w": "synthesis", "gloss": "综合；合成（名词）"}, {"w": "synthetic", "gloss": "合成的；人造的"}, {"w": "photosynthesis", "gloss": "光合作用"}]}, {"word": "simulate", "levels": ["六级", "托福"], "ipa": "/ˈsɪmjuleɪt/", "subgroup": "modern-tech", "meaning": "vt. 模仿，模拟；假装，伪装", "etymology": "源自拉丁语simulare（模仿、假装），词根simil-意为'相似的'。16世纪进入英语时带有明显的贬义——'冒充、假装'。现代科技语境（20世纪中叶以后）洗掉了这个贬义，simulate变成中性的'用模型/计算机复制一个过程'。飞行模拟器（flight simulator）是最经典的例子。", "roots": [{"part": "simul-", "meaning": "相似的，一样的"}, {"part": "-ate", "meaning": "动词后缀"}], "phonetics": "/ˈsɪmjuleɪt/ 重音在首音节SIM。注意u读/ju/（像'you'），不是/ʌ/。-ate结尾读/eɪt/（不是/ət/，英式/ət/只在形容词中出现）。同源词similar的发音可辅助记忆。", "tip": "simul（相似）+ ate（使）= 使看起来和真的一样。和similar（相似的）是同源词——simul就是'similar'的词根！", "examples": [{"en": "Pilots spend hundreds of hours training in flight simulators before ever touching a real cockpit.", "zh": "飞行员在摸到真实驾驶舱之前，要在飞行模拟器中训练数百小时。", "source": "造句"}, {"en": "computer simulation", "zh": "计算机模拟", "source": "高频搭配"}, {"en": "simulate extreme weather conditions", "zh": "模拟极端天气条件", "source": "TPO自然科学类高频"}], "synonyms": [{"w": "imitate", "ipa": "/ˈɪmɪteɪt/", "gloss": "模仿，仿效", "note": "imitate偏向'照着样子做/学'（模仿口音/笔迹）；simulate偏向'用模型/系统复制过程/行为'（规模更大更系统）。"}, {"w": "replicate", "ipa": "/ˈreplɪkeɪt/", "gloss": "复制，重做", "note": "replicate强调精确再现结果；simulate强调再现过程而非精确复制每一个细节。"}], "antonyms": [{"w": "execute genuinely", "note": "真实执行（非模拟）"}], "nuance": "simulate侧重'用模型再现过程'——目的是训练（simulate emergency）或预测（simulate climate change）。imitate侧重'模仿外观或行为'，不一定有系统性模型。填词题常考：提到computer model/math model的语境下，动词一定是simulate而非imitate。", "core": "你坐在一个会震动的铁椅子里，眼前环绕屏幕上跑道在飞速后退，仪表盘上所有指针都在跳。身体告诉你飞机在爬升，耳朵里是引擎的轰鸣，窗外是云——但你其实哪儿都没去，椅子原地不动，只是所有的感官都相信了。", "senses": [{"gloss": "v. 模拟，模仿（过程/系统）", "logic": "simul(相似)+ate(使)→用模型/计算机等手段使某个系统的运行被再现→模拟", "en": "Climate scientists use supercomputers to simulate how ocean currents affect global temperatures.", "zh": "气候科学家使用超级计算机来模拟洋流如何影响全球温度。"}, {"gloss": "v. 假装，伪装（情感/状态）", "logic": "从'模仿过程'延伸到人的情感表现→做出看似真实但并非真实感受的表情/态度→假装", "en": "He simulated enthusiasm during the client meeting, though he was exhausted.", "zh": "他在客户会议上假装热情，尽管已经筋疲力尽。"}], "derivatives": [{"w": "simulation", "gloss": "模拟；仿真（名词）"}, {"w": "simulator", "gloss": "模拟器（如flight simulator飞行模拟器）"}, {"w": "similar", "gloss": "相似的（同词根simul-）"}, {"w": "simultaneous", "gloss": "同时发生的（simul+taneous→'同一时间的'）"}]}, {"word": "satellite", "levels": ["六级", "托福"], "ipa": "/ˈsætəlaɪt/", "subgroup": "modern-tech", "meaning": "n. 卫星；人造卫星", "etymology": "源自拉丁语satelles（随从、侍卫、保镖——总是跟在主人身边的那个人）。16世纪天文学家用它来比喻围绕行星运行的天然天体：月亮就像地球的随从一样忠实地绕着转。1957年苏联发射Sputnik，satellite从此又添了一个新意思——人造卫星。后来这个'围绕者'的意象还被政治学借用：satellite state = 卫星国（依附于大国的附庸国）。", "roots": [{"part": "satellit-", "meaning": "随从，侍卫（拉丁语satelles）"}, {"part": "-e", "meaning": "名词后缀（通过法语借入）"}], "phonetics": "/ˈsætəlaɪt/ 重音在首音节SAT。注意它有三个音节SAT-uh-lite，不要漏掉中间的/ə/读成两个音节。末尾的e不发音。-lite读/laɪt/像light（光）。", "tip": "satell（随从，忠实地跟随）+ ite = 像贴身侍卫一样，永远在轨道上绕着主人转的'天空随从'。月亮就是地球的natural satellite。", "examples": [{"en": "The weather satellite transmits atmospheric data back to Earth every fifteen minutes.", "zh": "气象卫星每十五分钟向地球传回大气数据。", "source": "造句"}, {"en": "satellite imagery / satellite navigation", "zh": "卫星图像 / 卫星导航", "source": "TPO科技类高频"}, {"en": "communications satellite", "zh": "通信卫星", "source": "高频搭配"}], "synonyms": [{"w": "spacecraft", "ipa": "/ˈspeɪskræft/", "gloss": "航天器，宇宙飞船", "note": "spacecraft泛指所有太空飞行器（包括载人飞船），satellite特指在轨道上'绕圈'运行的卫星（大多无人）。"}, {"w": "moon", "ipa": "/muːn/", "gloss": "卫星（天然）", "note": "moon特指天然卫星。地球的moon就是the Moon。satellite可以指天然，也可以指人造。"}], "antonyms": [{"w": "ground station", "note": "地面站（卫星的对立面——地上接收器而非天上发射器）"}], "nuance": "satellite的核心意象是'围绕者'——永远在轨道上。天文学中天然卫星是satellite；科技中人造卫星也是satellite；政治学中satellite state = 围着大国转的卫星国/附庸国；商业中satellite office = 围绕总部的卫星办事处。同一个核心意象，在不同语境下衍生出不同含义。", "core": "一个银色的金属盒子在漆黑得发蓝的太空中，沿着一根隐形的轨道默默地兜圈子——六十年来一圈又一圈，不曾停、不曾问为什么、不曾偏离一厘米。它的存在意义就是永远围着那颗蓝色星球转，把从太空中看到的一切传回地面。", "senses": [{"gloss": "n. 卫星（天体）", "logic": "从拉丁语'随从/侍卫'→天文学借用→围绕行星运行的天体→卫星", "en": "Jupiter has more than 95 known satellites, including the volcanic moon Io.", "zh": "木星有超过95颗已知卫星，包括火山活跃的木卫一。"}, {"gloss": "n. 人造卫星", "logic": "从天然卫星引申→人类发射到地球轨道上的人造物体→人造卫星", "en": "The GPS system relies on a constellation of at least 24 operational satellites.", "zh": "GPS系统依赖至少24颗运行中卫星组成的星座网络。"}, {"gloss": "n. 卫星国 / 卫星组织（附属体）", "logic": "从'围绕中心运行'的意象→政治/商业中附属于大主体的组织→卫星国/附属机构", "en": "The tech giant opened satellite offices in three major Asian cities.", "zh": "这家科技巨头在亚洲三个主要城市设立了卫星办事处。"}], "derivatives": [{"w": "satellite dish", "gloss": "卫星天线（俗称'锅'）"}, {"w": "satellite navigation (sat-nav)", "gloss": "卫星导航"}, {"w": "satellite TV", "gloss": "卫星电视"}]}, {"word": "genetic", "levels": ["六级", "托福"], "ipa": "/dʒəˈnetɪk/", "subgroup": "modern-tech", "meaning": "a. 基因的，遗传（学）的", "etymology": "源自希腊语genesis（起源、诞生、创世），词根gen-意为'产生、出生'。1831年达尔文同时代的科学家用genetic描述'与起源有关的'。1905年遗传学家Bateson正式将其限定为'与遗传有关的'。gene（基因）这个词反而更晚——1909年才从德语Gen进入英语。所以genetic比gene这个词还要早出现！", "roots": [{"part": "gen-", "meaning": "产生，出生，起源"}, {"part": "-etic", "meaning": "形容词后缀（与……有关的）"}], "phonetics": "/dʒəˈnetɪk/ 重音在第二音节NET。注意g在e前读/dʒ/（软g，像'这'的声母），不是/g/（硬g）。这和gene、genius、general中的g一样都是软g。三音节：juh-NET-ik。", "tip": "gen（产生→基因决定生命特征的产生）+ etic = 与基因/遗传有关的。gen-词根家族庞大：gene(基因)、generate(产生)、generation(代)、genesis(起源)、genius(天赋=天生才能)。", "examples": [{"en": "The disease has a strong genetic component, though environmental factors also play a role.", "zh": "这种疾病有很强的遗传因素，不过环境因素也起作用。", "source": "造句"}, {"en": "genetic engineering / genetic modification", "zh": "基因工程 / 基因改造", "source": "文化锚点"}, {"en": "genetic diversity", "zh": "遗传多样性", "source": "TPO生物类高频"}], "synonyms": [{"w": "hereditary", "ipa": "/həˈredɪteri/", "gloss": "遗传的，世袭的", "note": "hereditary强调'从祖先/父母传下来'（家系视角），genetic强调'基因/DNA分子层面的机制'（分子生物学视角）。"}, {"w": "inherited", "ipa": "/ɪnˈherɪtɪd/", "gloss": "继承的，遗传的", "note": "inherited更口语化、泛指（inherited wealth继承的财富 / inherited trait遗传的特征）；genetic是科学术语，严格指基因层面。"}], "antonyms": [{"w": "acquired", "note": "后天获得的（非先天遗传的）"}, {"w": "environmental", "note": "环境的（非基因决定的）"}], "nuance": "genetic是分子层面的'与基因有关的'；hereditary是家族层面的'祖传的'。一种病可以既是genetic又是hereditary（基因病且家族遗传），但genetic mutation（基因突变）可能不是hereditary——它是你这个个体新发生的，不会传给后代（除非是生殖细胞突变）。TPO生物学文章常讨论'genetic vs environmental factors'（基因vs环境因素之争）。", "core": "一个螺旋上升的双股楼梯，每一级台阶的扶手上都刻着一种颜色——你的眼睛是深棕还是浅蓝、头发是直是卷、甚至身体会不会在闻到某种花香时打喷嚏，都是这条楼梯深处某级台阶上的刻字。", "senses": [{"gloss": "a. 基因的，遗传（学）的", "logic": "gen(产生→决定生命特征生成的根本机制)+etic(形容词)→与基因/遗传相关的→基因的，遗传学的", "en": "Genetic research over the past two decades has transformed medicine.", "zh": "过去二十年的基因研究彻底改变了医学。"}], "derivatives": [{"w": "gene", "gloss": "基因"}, {"w": "genetics", "gloss": "遗传学"}, {"w": "genome", "gloss": "基因组"}, {"w": "genesis", "gloss": "起源，创始（创世记）"}]}, {"word": "innovate", "levels": ["托福"], "ipa": "/ˈɪnəveɪt/", "subgroup": "modern-tech", "meaning": "v. 革新，创新", "etymology": "源自拉丁语innovare（更新、改变），由in-（进入，使）+ novare（使变新）组成，novus = new（新的）。16世纪英语借入，最初意思是'引入新东西、带来改变'。在工业革命和现代科技文化中，innovate变成了一个几乎神圣的词——它不再是简单地'搞点新花样'，而是'在已有基础上做出有价值的新突破'。注意：innovate不是invent（发明）——发明是无中生有，创新是推陈出新。", "roots": [{"part": "in-", "meaning": "进入，使……（加强意义）"}, {"part": "nov", "meaning": "新的"}, {"part": "-ate", "meaning": "动词后缀"}], "phonetics": "/ˈɪnəveɪt/ 重音在首音节IN。注意第二个音节o读/ə/（弱读，像'呃'），不是/oʊ/。-ate尾读/eɪt/（清晰长音）。三个音节：IN-uh-vate。", "tip": "in（使）+ nov（新）+ ate = 使变新→创新。nov和novel（小说 / 新颖的）同源——novel就是'讲别人没讲过的新故事'！同根词：novice（新手=刚来的新人）。", "examples": [{"en": "Companies that fail to innovate risk being overtaken by more agile competitors.", "zh": "不创新的公司有被更敏捷的竞争对手赶超的风险。", "source": "造句"}, {"en": "the drive / ability to innovate", "zh": "创新的驱动力 / 创新能力", "source": "TPO商业类高频"}, {"en": "innovate on traditional methods", "zh": "在传统方法基础上进行创新", "source": "学术搭配"}], "synonyms": [{"w": "revolutionize", "ipa": "/ˌrevəˈluːʃənaɪz/", "gloss": "彻底改变，革命化", "note": "revolutionize是颠覆性的、推倒重来的变革；innovate是在现有基础上改良出新，不一定要推翻一切。"}, {"w": "invent", "ipa": "/ɪnˈvent/", "gloss": "发明，创造", "note": "invent强调从无到有创造全新的东西（爱迪生invented灯泡），innovate强调对已有的东西做有价值的更新（苹果每代iPhone都是innovate而非invent）。"}], "antonyms": [{"w": "stagnate", "note": "停滞不前"}, {"w": "imitate", "note": "模仿，因循守旧"}], "nuance": "innovate不等于invent。invent是从0到1（发明了世界上第一台电话）；innovate是从1到N或从N到N+1（把电话从座机innovate成智能手机）。TPO经济/商业类文章高频词，常出现在讨论企业竞争力、技术进步的语境中。", "core": "一个老工匠对着用了十年的扳手皱起眉头，他没有扔掉它——而是沿着把手的外弧，多开了一道更贴合指关节的凹槽。还是那把扳手，但用起来顺手了十倍。", "senses": [{"gloss": "v. 革新，创新，改革", "logic": "in(使)+nov(新)+ate(动词)→引入新思想/方法使现有事物更新→创新，革新", "en": "The company has continued to innovate in renewable energy storage technology.", "zh": "这家公司在可再生能源存储技术领域持续创新。"}], "derivatives": [{"w": "innovation", "gloss": "创新；革新（名词）"}, {"w": "innovative", "gloss": "创新的；革新的（形容词）"}, {"w": "innovator", "gloss": "创新者，革新者"}, {"w": "novel", "gloss": "新颖的（adj.）；小说（n.）"}]}, {"word": "automatic", "levels": ["六级", "托福"], "ipa": "/ˌɔːtəˈmætɪk/", "subgroup": "modern-tech", "meaning": "a. 自动的；无意识的；必然的", "etymology": "源自希腊语automatos（自我行动的、自动的），由auto-（自己）+ matos（思考、意愿、行动）组成——一个会'自己动'的东西！17世纪进入英语后用来描述'像有自己意志一样运作'的机械设备。工业革命让这个词普及（自动机器），20世纪心理学又给它加了一层意思：不经思考的条件反射（automatic response = 本能反应）。", "roots": [{"part": "auto-", "meaning": "自己，自动"}, {"part": "mat", "meaning": "思考，意愿，行动（希腊语matos）"}, {"part": "-ic", "meaning": "形容词后缀"}], "phonetics": "/ˌɔːtəˈmætɪk/ 重音在第三音节MAT。这是四个音节的词：aw-tuh-MAT-ik。注意au读/ɔː/（嘴巴张圆的'哦'音），不是/aʊ/（'奥'）。auto-在词中间时拼读为/ɔːtə/。", "tip": "auto（自己）+ mat（动）+ ic = 自己就会动的 → 自动的。记住automobile（汽车）= auto(自己)+mobile(移动)=自己会跑的车！同族：automation（自动化）、autonomous（自主的）。", "examples": [{"en": "The greenhouse uses an automatic irrigation system that waters plants based on soil moisture.", "zh": "温室使用自动灌溉系统，根据土壤湿度给植物浇水。", "source": "造句"}, {"en": "automatic transmission", "zh": "自动变速器（自动挡汽车）", "source": "文化锚点"}, {"en": "automatic response / automatic behavior", "zh": "自动反应 / 自动化行为（不经思考的本能反应）", "source": "TPO心理学类高频"}], "synonyms": [{"w": "spontaneous", "ipa": "/spɑːnˈteɪniəs/", "gloss": "自发的，自然而然的", "note": "spontaneous强调'没有外部触发、从内部自然发生'（如spontaneous applause自发的掌声）；automatic强调'被预设机制触发、不经思考就执行'。"}, {"w": "mechanical", "ipa": "/məˈkænɪkl/", "gloss": "机械的；不假思索的", "note": "mechanical强调'像机器一样重复、生硬、无情感'（贬义）；automatic强调'触发即自动执行'（中性）。"}], "antonyms": [{"w": "manual", "note": "手动的，人工的"}, {"w": "deliberate", "note": "刻意的，深思熟虑的"}, {"w": "voluntary", "note": "自愿的，有意识的"}], "nuance": "automatic的核心是'触发即执行、中间没有决策环节'。你走到商场门口，门自己开了——这是automatic（传感器触发→电机执行）。呼吸也是automatic。TPO阅读常考两个语境：工程类（自动机器）和心理学类（自动行为/无意识反应）。第三个义项'automatic promotion（必然晋升）'是引申：'触发条件满足后必然自动发生→必然的'。", "core": "你走进商场大门，双手还插在口袋里，两扇玻璃门就自己向两边无声滑开了——就像它们一直在等你，你的到来本身触发了开门。没有人在背后按按钮，没有一个保安在盯着监控。一切流畅、无声、必然。", "senses": [{"gloss": "a. 自动的（机器/系统）", "logic": "auto(自己)+mat(行动)+ic→自己就能运行不需人工干预→自动的", "en": "The factory installed automatic assembly lines to triple its production capacity.", "zh": "工厂安装了自动装配线，将产能提升了三倍。"}, {"gloss": "a. 无意识的，不假思索的（行为/反应）", "logic": "从'机器自动运行'隐喻到人的行为→不经大脑有意识思考就自动做出的→无意识的，本能的", "en": "For experienced drivers, checking the rearview mirror becomes almost automatic.", "zh": "对有经验的司机来说，看后视镜几乎成了一种自动反应。"}, {"gloss": "a. 必然的（结果）", "logic": "从'触发后必然自动发生'引申→在某些语境下表示'条件满足后必然随之而来的'→必然的", "en": "A college degree is no longer an automatic ticket to a well-paying job.", "zh": "大学学位不再是一张通往高薪工作的必然门票。"}], "derivatives": [{"w": "automatically", "gloss": "自动地；必然地"}, {"w": "automation", "gloss": "自动化（名词）"}, {"w": "automated", "gloss": "自动化的（已被自动化改造的）"}, {"w": "autonomous", "gloss": "自主的，自治的"}]}, {"word": "digitize", "levels": ["托福"], "ipa": "/ˈdɪdʒɪtaɪz/", "subgroup": "modern-tech", "meaning": "vt. 数字化", "etymology": "digit（数字；手指）+ -ize（使……化）。digit源自拉丁语digitus（手指），因为人类最早的计数工具就是十根手指——扳着指头数数。当计算机时代来临（1950年代），人们需要描述'把模拟信息转化为0和1组成的数字信息'这个新动作，就在digit后面加了-ize造出了digitize。所以这个单词的底层画面非常原始：用手指头数数→数字→数字化。", "roots": [{"part": "digit", "meaning": "数字（原义：手指）"}, {"part": "-ize", "meaning": "动词后缀，使……化"}], "phonetics": "/ˈdɪdʒɪtaɪz/ 重音在首音节DIG。注意第一个i读/ɪ/（短音，像'的'的韵母），第二个i也读/ɪ/（不是/iː/），-ize读/aɪz/。三个音节：DIJ-it-eyes。不要读成/ˈdɪɡɪtaɪz/（g不读硬音）。", "tip": "digit（用手指头数数→数字）+ ize（化）= 变成数字形式。digital camera（数码相机）= 把光线变成数字信号的相机。", "examples": [{"en": "The library has launched a project to digitize its entire collection of rare medieval manuscripts.", "zh": "图书馆启动了一个项目，将其全部珍稀中世纪手稿数字化。", "source": "造句"}, {"en": "digitize archival records", "zh": "将档案记录数字化", "source": "TPO高频"}, {"en": "digital transformation", "zh": "数字化转型（digitize的宏观版本）", "source": "行业锚点"}], "synonyms": [{"w": "convert (to digital)", "ipa": "/kənˈvɜːrt/", "gloss": "转换，转化为数字格式", "note": "convert泛指任何形式转换（convert to PDF/convert currency），digitize特指'转为离散的数字数据'。"}, {"w": "encode", "ipa": "/ɪnˈkoʊd/", "gloss": "编码", "note": "encode强调'把信息表示为代码'（如encode a message），digitize强调'将连续的模拟信号采样和量化为离散的数字值'。"}], "antonyms": [{"w": "analog (format)", "note": "模拟的（非数字化格式）"}], "nuance": "digitize的核心动作是'采样+量化'——把连续的模拟世界切成一格一格的数字。纸质书扫描变成PDF是digitize；把收音机的模拟信号变成MP3也是digitize。encode是把信息编成某种'代码'（比如把字母A编码为ASCII码65），不一定要涉及模拟→数字的转换。", "core": "一本发黄的老相册被小心翼翼翻开，一道冷色的扫描光从第一页缓缓滑到最后一页——照片上奶奶年轻时的笑容、折角的痕迹、甚至纸张被岁月沁出的霉斑，都变成了屏幕上由0和1组成的精确像素阵列。从此它永远不会再褪色了。", "senses": [{"gloss": "v. 使数字化", "logic": "digit(数字，本义手指→计数→数字)+ize(使……化)→把模拟/物理信息转换为0和1组成的数字形式→数字化", "en": "Museums worldwide are racing to digitize their collections before fragile artifacts deteriorate further.", "zh": "世界各地的博物馆正竞相在脆弱文物进一步损坏之前将其藏品数字化。"}], "derivatives": [{"w": "digital", "gloss": "数字的；数码的"}, {"w": "digitization", "gloss": "数字化（过程/名词）"}, {"w": "digit", "gloss": "数字（0-9）；手指"}]}]}</script>
<script>
const G = JSON.parse(document.getElementById('data').textContent);
const KEY = 'vocab-unfam-' + G.id;
let unfam = new Set(JSON.parse(localStorage.getItem(KEY) || '[]'));
let curLv = '全部', curSg = '全部', curQ = '', onlyUnfam = false;

/* ===== 句中每词可查（满配标准第11项）· CAP: sentWordsClickable =====
   例句/义项句里每个词包可点 span：点词→🔊，收录词展开释义+跳词卡，其他词给查词典。 */
const PAGEWORDS = {};
(G.words||[]).forEach(w=>{ PAGEWORDS[(w.word||'').toLowerCase().replace(/[^a-z]/g,'')] = w; });
function sentWordsClickable(text){
  if(!text) return '';
  return String(text).replace(/[A-Za-z][A-Za-z’'-]*/g, m=>`<span class="sw" data-w="${m}" onclick="event.stopPropagation();swLookup(this)">${m}</span>`);
}
function jumpToWord(word){
  const c = document.querySelector('.card[data-w="'+word+'"]');
  if(c){ c.scrollIntoView({behavior:'smooth',block:'center'}); c.classList.add('flashcard'); setTimeout(()=>c.classList.remove('flashcard'),1200); }
}
function swLookup(el){
  const raw = el.dataset.w||''; say(raw);
  document.querySelectorAll('.sw-pop').forEach(p=>p.remove());
  document.querySelectorAll('.sw.sw-open').forEach(x=>{ if(x!==el) x.classList.remove('sw-open'); });
  if(el.classList.contains('sw-open')){ el.classList.remove('sw-open'); return; }
  el.classList.add('sw-open');
  const key = raw.toLowerCase().replace(/[^a-z]/g,'');
  const pw = PAGEWORDS[key];
  const pop = document.createElement('div'); pop.className='sw-pop';
  if(pw){
    pop.innerHTML = `<b>${pw.word}</b> <span class="pop-ipa">${pw.ipa||''}</span> `+
      `<button class="pop-say" data-w="${pw.word}" onclick="event.stopPropagation();say(this.dataset.w)">🔊</button>`+
      `<div class="pop-mean">${pw.meaning||''}</div>`+
      `<span class="pop-jump" data-w="${pw.word}" onclick="event.stopPropagation();jumpToWord(this.dataset.w)">↧ 跳到该词卡</span>`;
  } else {
    pop.innerHTML = `<b>${raw}</b> `+
      `<button class="pop-say" data-w="${raw}" onclick="event.stopPropagation();say(this.dataset.w)">🔊</button> `+
      `<a class="pop-dict" href="https://dictionary.cambridge.org/dictionary/english/${key}" target="_blank" rel="noopener" onclick="event.stopPropagation()">查词典 ↗</a>`;
  }
  el.after(pop);
}

const LVCLASS = {'六级':'lv6','托福':'tfl','GRE拓展':'gre','基础':'','口语':'spk','场景':'scn'};
// 发音分组配色（按 subgroups 顺序循环取用）
const SGCOLORS = ['#2f8f83','#b0603f','#6a52a8','#c1662f','#3a7bd5'];
const SUBG = G.subgroups || [];
function sgIndex(key){ const i=SUBG.findIndex(s=>s.key===key); return i<0?0:i; }
function sgColor(key){ return SGCOLORS[sgIndex(key)%SGCOLORS.length]; }
function sgOf(key){ return SUBG.find(s=>s.key===key); }

// ---------- header
function renderHero(){
  const h = document.getElementById('hero');
  const rules = SUBG.map((s,i)=>{
    const c = SGCOLORS[i%SGCOLORS.length];
    return `<div class="rule" style="border-left:5px solid ${c}"><b style="color:${c}">${s.label}</b>${s.desc||''}</div>`;
  }).join('');
  const rhymes = (G.rhymeChains && G.rhymeChains.length)
    ? `<div class="rhymes"><h3>🎵 同韵顺口溜 · 点单词听发音，成串背最快</h3>${
        G.rhymeChains.map(c=>`<div class="chain"><span class="lab">${c.label}</span>${
          c.words.map(w=>`<span class="chip" onclick="say('${w}')">${w}</span>`).join('')
        }</div>`).join('')}</div>`
    : '';
  h.innerHTML = `
    <div class="combo"><span class="big">${G.combo}</span><span class="snd">${G.sound}</span></div>
    <h1>${G.title} · ${G.subtitle||''}</h1>
    <p class="intro">${G.intro}</p>
    <div class="rules">${rules}</div>
    ${rhymes}`;
}

// ---------- 精读：文章 + 句法分析
let speaking=false;
function sayPassage(btn){
  if(speaking){ speechSynthesis.cancel(); speaking=false; if(btn) btn.textContent='🔊 朗读全文'; return; }
  const P = G.passage; if(!P) return;
  const texts = (P.paragraphs||[]).map(p=>p.en).filter(Boolean);
  if(!texts.length) return;
  if(!VOICE) pickVoice();
  speaking=true; if(btn) btn.textContent='⏹ 停止朗读';
  let last=null;
  texts.forEach((t,i)=>{
    const u = new SpeechSynthesisUtterance(t);
    u.lang='en-US'; if(VOICE) u.voice=VOICE; u.rate=.95; u.pitch=1.0;
    if(i===texts.length-1) last=u;
    speechSynthesis.speak(u);
  });
  if(last) last.onend=()=>{ speaking=false; if(btn) btn.textContent='🔊 朗读全文'; };
}
function renderPassage(){
  const el = document.getElementById('passage');
  const P = G.passage; if(!P){ el.style.display='none'; return; }
  const paras = (P.paragraphs||[]).map(p=>{
    let en = p.en||'';
    // 高亮关键词（p.kws 或自动匹配词表词）
    const kws = p.kws || [];
    kws.forEach(k=>{ en = en.replace(new RegExp('('+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'), '<span class="kw" onclick="say(\'$1\')">$1</span>'); });
    return `<p><div class="en">${en}</div>${p.zh?`<div class="zh">${p.zh}</div>`:''}</p>`;
  }).join('');
  el.innerHTML = `<div class="passage"><h2>📖 精读原文</h2>
    <div class="p-title">${P.title||''} <button class="readall" onclick="sayPassage(this)">🔊 朗读全文</button></div>
    ${paras}</div>`;
}
const ROLECOLOR = { '主语':'#2f8f83','谓语':'#c1662f','宾语':'#3a7bd5','状语':'#6a52a8','定语':'#b0603f','补语':'#c1662f','从句':'#8c8072','连词':'#8c8072','介词':'#8c8072','插入语':'#8c8072','同位语':'#b0603f' };
function roleColor(r){ return ROLECOLOR[r] || '#6a52a8'; }
function escAttr(s){ return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
// 句子内括号标注：介词短语 ( ) · 从句 [ ] · 非谓语 { }
const BRK = {'pp':['(',')'], 'cl':['[',']'], 'nf':['{','}']};
const BRKC = {'pp':'#6a52a8', 'cl':'#3a7bd5', 'nf':'#b0603f'};
function renderFlow(s){
  let html='';
  (s.flow||[]).forEach(it=>{
    if(it.open){ const k=it.open; html+=`<span class="brkbox" style="background:${BRKC[k]}16;border-bottom:2px solid ${BRKC[k]}66"><b class="brk" style="color:${BRKC[k]}">${BRK[k][0]}</b>`; }
    else if(it.close){ const k=it.close; html+=`<b class="brk" style="color:${BRKC[k]}">${BRK[k][1]}</b></span>`; }
    else { html+=escAttr(it.t); }
  });
  return html;
}
function renderSents(){
  const el = document.getElementById('sents');
  const S = G.sentences; if(!S || !S.length){ el.style.display='none'; return; }
  const items = S.map((s,i)=>{
    const flowHtml = (s.flow && s.flow.length) ? renderFlow(s) : escAttr(s.en);
    const parts = (s.parts||[]).map(p=>{
      const c = roleColor(p.r);
      return `<span class="spart" style="background:${c}18;border:1px solid ${c}55">
        <span class="st" style="color:${c}">${escAttr(p.t)}</span>
        <span class="sr" style="background:${c}">${p.r}</span>
        ${p.n?`<span class="sn">${p.n}</span>`:''}</span>`;
    }).join('');
    return `<div class="sent">
      <div class="s-flow" data-en="${escAttr(s.en)}" onclick="say(this.dataset.en)" title="点句子朗读">${flowHtml} <button class="say-mini" data-en="${escAttr(s.en)}" onclick="event.stopPropagation();say(this.dataset.en)" title="朗读">🔊</button></div>
      ${s.zh?`<div class="s-zh">${s.zh}</div>`:''}
      <div class="s-parts">${parts}</div>
      ${s.note?`<div class="snotes">${s.note}</div>`:''}</div>`;
  }).join('');
  el.innerHTML = `<div class="sents"><h2>🔍 长难句 · 句法分析</h2>
    <div class="s-sub">点英文句可朗读 · 括号标注：<b style="color:#6a52a8">( ) 介词短语</b> · <b style="color:#3a7bd5">[ ] 从句</b> · <b style="color:#b0603f">{ } 非谓语动词</b> · 下方色块=成分功能</div>
    ${items}</div>`;
}

// ---------- filters
function renderFilters(){
  const lvs = ['全部','六级','托福','GRE拓展','基础'];
  document.getElementById('lvf').innerHTML = lvs.map(l=>
    `<span class="f${l===curLv?' on':''}" onclick="setLv('${l}')">${l}</span>`).join('');
  const sgs = [['全部','全部'], ...SUBG.map(s=>[s.tag||s.label, s.key])];
  document.getElementById('sgf').innerHTML = sgs.map(([t,v])=>
    `<span class="f${v===curSg?' on':''}" onclick="setSg('${v}')">${t}</span>`).join('');
}
function setLv(l){curLv=l;renderFilters();renderGrid();}
function setSg(s){curSg=s;renderFilters();renderGrid();}

// ---------- speech：优先自然美式女声
let VOICE=null, VOICES=[];
// 各浏览器/系统里公认自然的美式女声，按优先级排序
const PREF=[
  'Google US English',                 // Chrome：自然女声
  'Microsoft Aria Online (Natural) - English (United States)',
  'Microsoft Jenny Online (Natural) - English (United States)',
  'Microsoft Ava Online (Natural) - English (United States)',
  'Microsoft Aria','Microsoft Jenny','Microsoft Michelle',
  'Ava (Premium)','Ava (Enhanced)','Ava',   // macOS Siri 女声
  'Samantha',                          // macOS 经典美式女声
  'Allison','Susan','Nicky','Zoe','Karen','Victoria'
];
const MALE=/(alex|daniel|fred|tom|david|mark|male|aaron|arthur|gordon|oliver|rishi|junior|ralph)/i;
function usPool(){
  VOICES = speechSynthesis.getVoices()||[];
  let us = VOICES.filter(v=>/en[-_]US/i.test(v.lang)||/United States/i.test(v.name));
  if(!us.length) us = VOICES.filter(v=>/^en/i.test(v.lang));
  return us;
}
function pickVoice(){
  const pool=usPool(); if(!pool.length) return;
  VOICE=null;
  for(const n of PREF){ const h=pool.find(v=>v.name===n)||pool.find(v=>v.name.indexOf(n)===0); if(h){VOICE=h;break;} }
  if(!VOICE) VOICE = pool.find(v=>/(samantha|ava|allison|susan|nicky|zoe|karen|victoria|aria|jenny|michelle|female|google us)/i.test(v.name))
                   || pool.find(v=>!MALE.test(v.name)) || pool[0];
  fillVoiceSel(pool);
}
function fillVoiceSel(pool){
  const s=document.getElementById('voiceSel'); if(!s) return;
  s.innerHTML = pool.map(v=>{
    const nm=v.name.replace(/ - English.*/,'').replace(/Online \(Natural\)/,'✨');
    return `<option value="${v.name}"${VOICE&&v.name===VOICE.name?' selected':''}>🎙 ${nm}</option>`;
  }).join('');
}
document.getElementById('voiceSel').addEventListener('change',e=>{
  VOICE = VOICES.find(v=>v.name===e.target.value)||VOICE; say(G.combo==='aw'?'awesome':'natural');
});
if('onvoiceschanged' in speechSynthesis) speechSynthesis.onvoiceschanged = pickVoice;
pickVoice();
function say(w){
  try{
    if(!VOICE) pickVoice();
    const u = new SpeechSynthesisUtterance(w);
    u.lang='en-US'; if(VOICE) u.voice=VOICE; u.rate=.95; u.pitch=1.0;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }catch(e){}
}

// 高亮单词里的目标拼写：优先用该词自带的 hl（音位页里每词各自的拼写），否则用组的 combo
function hlWord(word, spell){
  const c = (spell||'').replace(/[.*+?^${}()|[\]\\\/·\s]/g,'');  // 只取干净字母做高亮，去掉 / · 空格等
  if(!c) return word;
  try{ return word.replace(new RegExp('('+c+')','i'), '<span class="hl">$1</span>'); }
  catch(e){ return word; }
}

// ---------- card
function card(w){
  const tags = (w.levels||[]).map(l=>`<span class="tag ${LVCLASS[l]||''}">${l}</span>`).join('');
  const roots = (w.roots||[]).map(r=>`<span class="root"><b>${r.part}</b> ${r.meaning}</span>`).join('');
  const exs = (w.examples||[]).map(e=>{
    const fam = /造句/.test(e.source)? '' : ' famous';
    return `<div class="ex${fam}"><div class="en">${sentWordsClickable(e.en)}</div><div class="zh">${e.zh}</div><span class="src">— ${e.source}</span></div>`;
  }).join('');
  const syns = (w.synonyms||[]).map(s=>
    `<div class="lex"><b class="lw" onclick="event.stopPropagation();say('${s.w}')">${s.w}</b>`+
    `${s.ipa?` <span class="lip">${s.ipa}</span>`:''}${s.note?` <span class="ln">— ${s.note}</span>`:''}</div>`).join('');
  const ants = (w.antonyms||[]).map(a=>
    `<span class="antchip" onclick="event.stopPropagation();say('${a.w}')">${a.w}${a.note?` <i>${a.note}</i>`:''}</span>`).join('');
  const lexSec = (syns||ants||w.nuance)
    ? `<div class="sec"><span class="l">🔗 近义词辨析 · 反义词</span>`+
      `${syns?`<div class="lexgroup"><span class="lextag syn">近义</span><div class="lexlist">${syns}</div></div>`:''}`+
      `${ants?`<div class="lexgroup"><span class="lextag ant">反义</span><div class="lexlist antline">${ants}</div></div>`:''}`+
      `${w.nuance?`<div class="nuance">🎯 ${w.nuance}</div>`:''}</div>`
    : '';
  const senses = (w.senses||[]).map(s=>
    `<div class="sense"><div class="s-gloss"><b>${s.gloss}</b>${s.logic?` <span class="s-logic">← ${s.logic}</span>`:''}</div>`+
    `${s.en?`<div class="s-ex"><span class="s-en">${sentWordsClickable(s.en)}</span> <span class="s-zh">${s.zh||''}</span></div>`:''}</div>`).join('');
  const senseSec = (w.core||senses)
    ? `<div class="sec"><span class="l">🧠 一词多义 · 核心意象串解</span>`+
      `${w.core?`<div class="coreimg">🎯 核心感觉：${w.core}</div>`:''}${senses}</div>`
    : '';
  const isU = unfam.has(w.word);
  const so = sgOf(w.subgroup);
  return `<div class="card${isU?' unfamiliar':''}" data-w="${w.word}" onclick="if(document.body.classList.contains('mem'))this.classList.toggle('reveal')">
    <span class="sub-tag" style="background:${sgColor(w.subgroup)}">${so?(so.tag||so.label):''}</span>
    <div class="whead">
      <span class="word">${hlWord(w.word, w.hl || G.combo)}</span>
      <span class="ipa">${w.ipa}</span>
      <button class="say" onclick="event.stopPropagation();say('${w.word}')" title="朗读">🔊</button>
    </div>
    <div class="tags">${tags}</div>
    <div class="mean">${w.meaning}</div>
    ${senseSec}
    ${w.etymology?`<div class="sec"><span class="l">🏛 造词来源 · 词源故事</span>${w.etymology}</div>`:''}
    ${roots?`<div class="sec"><span class="l">🧩 词根词缀</span><div class="roots">${roots}</div></div>`:''}
    ${w.phonetics?`<div class="sec"><span class="l">🗣 发音规律</span>${w.phonetics}</div>`:''}
    ${w.tip?`<div class="sec"><span class="l">💡 记忆钩子</span><div class="tip">${w.tip}</div></div>`:''}
    ${exs?`<div class="sec"><span class="l">✍️ 造句 · 名著/影视例句</span>${exs}</div>`:''}
    ${lexSec}
    <label class="check" onclick="event.stopPropagation()">
      <input type="checkbox" ${isU?'checked':''} onchange="toggleUnfam('${w.word}',this.checked)"> 🔺 标记不熟悉
    </label>
  </div>`;
}

function match(w){
  if(onlyUnfam && !unfam.has(w.word)) return false;
  if(curLv!=='全部' && !(w.levels||[]).includes(curLv)) return false;
  if(curSg!=='全部' && w.subgroup!==curSg) return false;
  if(curQ){
    const s=(w.word+' '+w.meaning).toLowerCase();
    if(!s.includes(curQ.toLowerCase())) return false;
  }
  return true;
}

function renderGrid(){
  const list = G.words.filter(match);
  // 不熟悉的置顶（稳定排序，保持各自原有相对顺序）
  list.sort((a,b)=>(unfam.has(b.word)?1:0)-(unfam.has(a.word)?1:0));
  const g = document.getElementById('grid');
  g.innerHTML = list.length? list.map(card).join('') : '<div class="empty">没有匹配的单词，换个筛选试试～</div>';
  updateUnfamCount();
}

function toggleUnfam(word, on){
  if(on) unfam.add(word); else unfam.delete(word);
  localStorage.setItem(KEY, JSON.stringify([...unfam]));
  const c = document.querySelector(`.card[data-w="${word}"]`);
  if(c) c.classList.toggle('unfamiliar', on);   // 立即变色，卡片原位不跳动；置顶在下次渲染/筛选时生效
  updateUnfamCount();
}
function updateUnfamCount(){
  const n = G.words.filter(w=>unfam.has(w.word)).length;
  const el = document.getElementById('unfamN');
  if(el) el.textContent = n;
}

document.getElementById('q').addEventListener('input',e=>{curQ=e.target.value;renderGrid();});
document.getElementById('unfamBtn').addEventListener('click',e=>{
  onlyUnfam=!onlyUnfam;
  e.currentTarget.classList.toggle('on',onlyUnfam);
  renderGrid();
});
document.getElementById('memBtn').addEventListener('click',e=>{
  document.body.classList.toggle('mem');
  e.target.classList.toggle('on');
  e.target.textContent = document.body.classList.contains('mem')?'🧠 记忆模式(开)·悬停显形':'🧠 记忆模式';
});

// ---------- 测验：英文 → 中文四选一（覆盖当前筛选到的全部单词）
let quiz=null;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
// 测验池 = 本页(筛选后)全部词 + 它们的同义词 + 衍生词（去重）
function quizPool(){
  const base = G.words.filter(match);
  const items=[]; const seen=new Set();
  const add=(word,ipa,meaning)=>{const k=(word||'').toLowerCase();
    if(!word||!meaning||seen.has(k))return; seen.add(k); items.push({word,ipa:ipa||'',meaning});};
  base.forEach(w=>{
    add(w.word,w.ipa,w.meaning);
    (w.synonyms||[]).forEach(s=>add(s.w,s.ipa,s.gloss||s.note));
    (w.derivatives||[]).forEach(dv=>add(dv.w,dv.ipa,dv.gloss||dv.note));
  });
  return items;
}
function startQuiz(src){
  const pool = src || quizPool();
  if(pool.length<4){ alert('至少要有 4 个词才能测验，请先放宽上方筛选～'); return; }
  quiz={list:shuffle(pool), i:0, score:0, wrong:[], done:false, next:null, pool:quizPool()};
  document.getElementById('quizOv').style.display='flex';
  renderQ();
}
function renderQ(){
  quiz.done=false; quiz.next=null;
  const q=quiz.list[quiz.i];
  const others=(quiz.pool||[]).filter(w=>w.meaning!==q.meaning);
  const opts=shuffle([q.meaning, ...shuffle(others).slice(0,3).map(w=>w.meaning)]);
  const K=['1','2','3','4'];
  document.getElementById('qbox').innerHTML=`
    <div class="qtop"><span>第 ${quiz.i+1} / ${quiz.list.length} 题 · 已答对 ${quiz.score}</span>
      <span style="cursor:pointer" onclick="closeQuiz()">✕ 关闭</span></div>
    <div class="qbar2"><i style="width:${quiz.i/quiz.list.length*100}%"></i></div>
    <div class="qword">${q.word} <button class="say" style="vertical-align:middle;width:30px;height:30px;font-size:14px" onclick="say('${q.word}')">🔊</button></div>
    <div class="qipa">${q.ipa}</div>
    <div class="qopts" id="qopts">${opts.map((o,k)=>
      `<button class="qopt" data-m="${encodeURIComponent(o)}" onclick="answer(this,'${encodeURIComponent(q.meaning)}')">
        <span class="k">${K[k]}</span><span>${o}</span></button>`).join('')}</div>
    <div class="hint">按 1–4 键作答 · 回车进入下一题</div>`;
  say(q.word);
}
function answer(el, correctEnc){
  if(quiz.done) return; quiz.done=true;
  const correct=decodeURIComponent(correctEnc);
  const chosen=decodeURIComponent(el.dataset.m);
  if(chosen===correct) quiz.score++; else quiz.wrong.push(quiz.list[quiz.i]);
  document.querySelectorAll('#qopts .qopt').forEach(b=>{
    const m=decodeURIComponent(b.dataset.m);
    if(m===correct) b.classList.add('right');
    else if(b===el) b.classList.add('wrong');
    else b.classList.add('dim');
    b.style.pointerEvents='none';
  });
  const btn=document.createElement('button');
  btn.className='qnext';
  btn.textContent = quiz.i<quiz.list.length-1 ? '下一题 →' : '看结果 →';
  btn.onclick=nextQ;
  document.getElementById('qbox').appendChild(btn);
  quiz.next=btn;
}
function nextQ(){
  if(quiz.i<quiz.list.length-1){ quiz.i++; renderQ(); } else endQuiz();
}
function endQuiz(){
  const tot=quiz.list.length, pct=Math.round(quiz.score/tot*100);
  const wrongHtml = quiz.wrong.length
    ? quiz.wrong.map(w=>`<div class="r"><b>${w.word}</b> ${w.ipa} — ${w.meaning}</div>`).join('')
    : '<div class="r">全部答对，太强了！🎉</div>';
  const wrongCopy = quiz.wrong.slice();
  document.getElementById('qbox').innerHTML=`
    <div class="qend">
      <div class="qtop" style="justify-content:flex-end"><span style="cursor:pointer" onclick="closeQuiz()">✕ 关闭</span></div>
      <div>本轮得分</div><div class="qscore">${quiz.score}/${tot}</div>
      <div style="color:var(--muted)">正确率 ${pct}%</div>
      <div class="qwrong"><div style="color:var(--exc);font-weight:700;margin-bottom:4px">错题（${quiz.wrong.length}）</div>${wrongHtml}</div>
      <div id="qendBtns"></div>
    </div>`;
  const box=document.getElementById('qendBtns');
  if(wrongCopy.length){
    const b1=document.createElement('button'); b1.className='qnext'; b1.textContent='只测这些错题';
    b1.onclick=()=>startQuiz(wrongCopy); box.appendChild(b1);
  }
  const b2=document.createElement('button'); b2.className='qnext';
  b2.style.cssText='background:#fff;color:var(--accent);border:1.5px solid var(--accent);margin-top:8px';
  b2.textContent='再来一轮（当前筛选）'; b2.onclick=()=>startQuiz(); box.appendChild(b2);
}
function closeQuiz(){ document.getElementById('quizOv').style.display='none'; quiz=null; }
document.getElementById('quizBtn').addEventListener('click',()=>startQuiz());
document.getElementById('quizOv').addEventListener('click',e=>{ if(e.target.id==='quizOv') closeQuiz(); });
document.addEventListener('keydown',e=>{
  if(!quiz || document.getElementById('quizOv').style.display==='none') return;
  if(quiz.next && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); quiz.next.click(); return; }
  if(!quiz.done && /^[1-4]$/.test(e.key)){ const b=document.querySelectorAll('#qopts .qopt')[+e.key-1]; if(b) b.click(); }
});

document.getElementById('foot').innerHTML =
  `共 ${G.words.length} 词 · 数据源：托福 4264 词表（真实词库）+ 六级核心词 · `+
  `发音由浏览器语音合成朗读 · 名著/影视例句均为真实出处，「造句」为学习例句，「高频搭配」为常用短语。`;

renderHero(); renderPassage(); renderSents(); renderFilters(); renderGrid();
</script>
