<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>aw 同音家族 · 单词拆解卡片</title>
<style>
  :root{
    --bg:#f7f1e7; --card:#fffdf8; --ink:#2f2a24; --muted:#8c8072;
    --line:#eaddc9; --accent:#c1662f; --accent2:#e0913c; --amber:#fbe6c4;
    --core:#2f8f83; --exc:#b0603f; --ok:#4a9a5e;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,"PingFang SC","Helvetica Neue",Segoe UI,sans-serif;
    line-height:1.6;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1180px;margin:0 auto;padding:26px 20px 90px}
  a{color:var(--accent);text-decoration:none}
  .top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
  .top a{color:var(--muted)}
  /* header */
  header.hero{margin:14px 0 22px}
  .combo{display:inline-flex;align-items:baseline;gap:14px}
  .combo .big{font-family:Georgia,"Times New Roman",serif;font-size:60px;font-weight:700;
    background:var(--amber);color:var(--accent);padding:2px 20px;border-radius:18px;line-height:1.1}
  .combo .snd{font-size:30px;color:var(--core);font-weight:700}
  h1{font-size:23px;margin:14px 0 4px}
  .intro{color:#5f574c;max-width:860px;font-size:15px}
  /* rule cards */
  .rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin:18px 0}
  .rule{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:14px}
  .rule.core{border-left:5px solid var(--core)}
  .rule.exc{border-left:5px solid var(--exc)}
  .rule b{display:block;margin-bottom:4px;font-size:14px}
  .rule.core b{color:var(--core)} .rule.exc b{color:var(--exc)}
  /* rhyme chains */
  .rhymes{background:linear-gradient(135deg,#fff6e8,#fdeede);border:1px dashed var(--accent2);
    border-radius:14px;padding:14px 16px;margin-bottom:20px}
  .rhymes h3{margin:0 0 8px;font-size:15px;color:var(--accent)}
  .chain{margin:6px 0;font-size:14px}
  .chain .lab{color:var(--muted);margin-right:8px}
  .chip{display:inline-block;background:#fff;border:1px solid var(--line);border-radius:20px;
    padding:2px 11px;margin:3px 4px 3px 0;cursor:pointer;font-family:Georgia,serif;font-size:15px;transition:.15s}
  .chip:hover{background:var(--amber);border-color:var(--accent2)}
  /* toolbar */
  .toolbar{position:sticky;top:0;z-index:20;background:rgba(247,241,231,.94);backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);padding:12px 0;margin-bottom:18px;
    display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .search{flex:1;min-width:180px;padding:8px 13px;border:1px solid var(--line);border-radius:10px;
    font-size:14px;background:#fff}
  .filters{display:flex;flex-wrap:wrap;gap:6px}
  .f{padding:6px 12px;border:1px solid var(--line);background:#fff;border-radius:20px;font-size:13px;
    cursor:pointer;color:#6b6154;transition:.15s}
  .f.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  select.f{max-width:170px;color:#6b6154;cursor:pointer}
  .btn{padding:7px 14px;border:1px solid var(--accent);background:#fff;color:var(--accent);
    border-radius:20px;font-size:13px;cursor:pointer;font-weight:600}
  .btn.on{background:var(--accent);color:#fff}
  .prog{font-size:13px;color:var(--muted);white-space:nowrap}
  .bar{height:6px;background:var(--line);border-radius:6px;width:120px;overflow:hidden;display:inline-block;vertical-align:middle}
  .bar>i{display:block;height:100%;background:var(--ok);width:0}
  /* cards */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 17px;
    box-shadow:0 2px 10px rgba(150,120,70,.06);display:flex;flex-direction:column;gap:10px;position:relative}
  .card.unfamiliar{border-color:#e08a3c;background:#fff7ec;box-shadow:0 2px 14px rgba(210,120,40,.20)}
  .card .sub-tag{position:absolute;top:0;right:16px;transform:translateY(-50%);
    font-size:11px;padding:2px 9px;border-radius:10px;color:#fff}
  .sub-core{background:var(--core)} .sub-exc{background:var(--exc)}
  .whead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .word{font-family:Georgia,"Times New Roman",serif;font-size:30px;font-weight:700;letter-spacing:.5px}
  .word .hl{background:var(--amber);color:var(--accent);border-radius:6px;padding:0 3px}
  .ipa{color:var(--core);font-size:16px;font-weight:600}
  .say{margin-left:auto;border:none;background:var(--amber);color:var(--accent);border-radius:50%;
    width:34px;height:34px;font-size:16px;cursor:pointer;flex:none}
  .say:hover{background:var(--accent2);color:#fff}
  .tags{display:flex;gap:5px;flex-wrap:wrap}
  .tag{font-size:11px;padding:1px 8px;border-radius:9px;background:#f0e7d6;color:#8a6a3c}
  .tag.lv6{background:#e6f0ec;color:#2f8f83}
  .tag.tfl{background:#eae6f5;color:#6a52a8}
  .tag.gre{background:#f7e6ea;color:#b0507a}
  .tag.spk{background:#fdeccd;color:#b5661f}
  .tag.scn{background:#e4f0e6;color:#3d7a4a}
  .mean{font-size:15.5px;font-weight:600;color:#3a332b}
  .sec{font-size:13.5px;color:#4d463c;border-top:1px dashed var(--line);padding-top:8px}
  .sec .l{font-size:11.5px;color:var(--accent);font-weight:700;letter-spacing:.5px;display:block;margin-bottom:2px}
  .roots{display:flex;flex-wrap:wrap;gap:6px}
  .root{background:#f6efe1;border-radius:8px;padding:3px 9px;font-size:12.5px}
  .root b{font-family:Georgia,serif;color:var(--accent)}
  .tip{background:#fff6e8;border-left:3px solid var(--accent2);padding:5px 10px;border-radius:0 8px 8px 0;font-size:13px}
  /* 一词多义 · 核心意象 */
  .coreimg{background:#f4f0e5;border-radius:8px;padding:6px 10px;font-size:13.5px;color:#5a4a2e;margin-bottom:7px}
  .sense{border-left:3px solid var(--accent2);padding:3px 0 3px 10px;margin:6px 0}
  .sense .s-gloss{font-size:14px}
  .sense .s-gloss b{color:#3a332b}
  .sense .s-logic{color:var(--accent);font-size:12.5px}
  .sense .s-ex{margin-top:2px;font-size:13px}
  .sense .s-en{font-family:Georgia,serif;color:#2f2a24}
  .sense .s-zh{color:#6b6154}
  .ex{margin:7px 0}
  .ex .en{font-family:Georgia,serif;font-size:14px;color:#2f2a24}
  .ex .zh{color:#6b6154;font-size:13px}
  .ex .src{display:inline-block;font-size:11px;color:#a89a86;margin-top:1px}
  .ex.famous{background:#fbf4e7;border-radius:8px;padding:7px 10px}
  /* 近义词辨析 / 反义词 */
  .lexgroup{display:flex;gap:8px;margin:4px 0;align-items:flex-start}
  .lextag{flex:none;font-size:11px;font-weight:700;padding:1px 8px;border-radius:8px;margin-top:3px}
  .lextag.syn{background:#e6f0ec;color:#2f8f83}
  .lextag.ant{background:#f7e6ea;color:#b0507a}
  .lexlist{display:flex;flex-direction:column;gap:3px;font-size:13.5px;flex:1}
  .lexlist.antline{flex-direction:row;flex-wrap:wrap;gap:6px;align-items:center}
  .lex .lw{font-family:Georgia,serif;color:var(--accent);cursor:pointer;font-weight:600}
  .lex .lw:hover{text-decoration:underline}
  .lex .lip{color:var(--core);font-size:12px}
  .lex .ln{color:#5f574c}
  .antchip{background:#faf0f2;border-radius:8px;padding:2px 9px;cursor:pointer;font-family:Georgia,serif;font-size:13px;color:#b0507a}
  .antchip:hover{background:#f6e3e8}
  .antchip i{font-style:normal;color:#9a8f86;font-size:12px}
  .nuance{background:#eef6f3;border-left:3px solid var(--core);padding:6px 10px;border-radius:0 8px 8px 0;font-size:13px;margin-top:7px;color:#33463f}
  /* memorize mode hides meaning+detail until hover/click */
  body.mem .mean, body.mem .sec{filter:blur(5px);transition:.15s;cursor:pointer}
  body.mem .card:hover .mean, body.mem .card.reveal .mean,
  body.mem .card:hover .sec, body.mem .card.reveal .sec{filter:none}
  .check{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer;margin-top:2px}
  .check input{width:16px;height:16px;accent-color:#c1662f}
  .card.unfamiliar .check{color:#c1662f;font-weight:600}
  .empty{text-align:center;color:var(--muted);padding:40px;grid-column:1/-1}
  footer{margin-top:36px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
  /* 测验 */
  #quizOv{display:none;position:fixed;inset:0;background:rgba(47,42,36,.55);z-index:50;
    align-items:center;justify-content:center;padding:18px}
  .qbox{background:var(--card);border-radius:20px;max-width:560px;width:100%;padding:22px 24px 20px;
    box-shadow:0 24px 70px rgba(0,0,0,.32);max-height:92vh;overflow:auto}
  .qtop{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px;margin-bottom:8px}
  .qbar2{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:16px}
  .qbar2>i{display:block;height:100%;background:var(--accent);width:0;transition:.3s}
  .qword{font-family:Georgia,serif;font-size:40px;font-weight:700;text-align:center;margin:4px 0 2px}
  .qipa{text-align:center;color:var(--core);font-size:16px;margin-bottom:16px}
  .qopts{display:grid;gap:10px}
  .qopt{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:11px 14px;font-size:14.5px;
    cursor:pointer;text-align:left;transition:.12s;display:flex;gap:10px;align-items:flex-start;font-family:inherit;color:var(--ink)}
  .qopt:hover{border-color:var(--accent2);background:#fffaf0}
  .qopt .k{font-weight:700;color:var(--accent);flex:none}
  .qopt.right{border-color:var(--ok);background:#eafaef}
  .qopt.wrong{border-color:var(--exc);background:#fdeeea}
  .qopt.dim{opacity:.45}
  .qnext{margin-top:14px;width:100%;padding:12px;border:none;border-radius:12px;background:var(--accent);
    color:#fff;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
  .qend{text-align:center}
  .qscore{font-size:46px;font-weight:800;color:var(--accent);margin:4px 0}
  .qwrong{text-align:left;margin:14px 0;max-height:34vh;overflow:auto}
  .qwrong .r{border-top:1px dashed var(--line);padding:7px 0;font-size:14px}
  .qwrong .r b{font-family:Georgia,serif;color:var(--exc)}
  .hint{text-align:center;color:var(--muted);font-size:12px;margin-top:10px}
  /* 精读 · 文章 + 句法分析 */
  .passage{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--accent);
    border-radius:14px;padding:18px 20px;margin:0 0 22px}
  .passage h2{margin:0 0 10px;font-size:18px;color:var(--accent)}
  .passage .p-title{font-family:Georgia,serif;font-size:20px;font-weight:700;color:var(--ink);margin-bottom:10px}
  .passage p{font-size:15px;line-height:1.9;margin:10px 0}
  .passage .en{color:#3a332b;font-family:Georgia,"Times New Roman",serif}
  .passage .zh{color:var(--muted);font-size:13.5px}
  .passage .kw{cursor:pointer;color:var(--accent);font-weight:600;border-bottom:1px dotted var(--accent2)}
  .readall{background:var(--accent);color:#fff;border:none;border-radius:20px;padding:4px 14px;font-size:13px;
    cursor:pointer;margin-left:10px;vertical-align:middle;transition:.15s}
  .readall:hover{background:var(--core)}
  .sents{background:linear-gradient(135deg,#f3f8f6,#eef3f0);border:1px solid var(--line);
    border-radius:14px;padding:18px 20px;margin:0 0 22px}
  .sents h2{margin:0 0 6px;font-size:18px;color:var(--core)}
  .sents .s-sub{color:var(--muted);font-size:13px;margin-bottom:14px}
  .sent{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:12px 0}
  .sent .s-en{font-family:Georgia,"Times New Roman",serif;font-size:15.5px;line-height:1.7;cursor:pointer;color:#3a332b}
  .sent .s-en:hover{color:var(--accent)}
  .sent .s-zh{color:var(--muted);font-size:13.5px;margin:6px 0 10px}
  .sent .s-parts{display:flex;flex-wrap:wrap;gap:6px}
  .spart{display:inline-flex;align-items:center;gap:6px;border-radius:9px;padding:4px 9px;font-size:13px;line-height:1.4}
  .spart .st{font-family:Georgia,serif;font-weight:600}
  .spart .sr{font-size:11px;color:#fff;border-radius:5px;padding:0 5px;white-space:nowrap}
  .spart .sn{font-size:12px;color:var(--muted)}
  .snotes{margin-top:10px;padding-top:8px;border-top:1px dashed var(--line);font-size:13px;color:#5f574c}
  .snotes b{color:var(--accent)}
  /* 句子内括号标注 */
  .s-flow{font-family:Georgia,"Times New Roman",serif;font-size:16px;line-height:2.1;cursor:pointer;color:#3a332b;padding:2px 0}
  .s-flow:hover{color:var(--accent)}
  .brkbox{border-radius:4px;padding:1px 1px;transition:.15s}
  .brk{font-weight:700;font-size:17px;padding:0 1px}
  .say-mini{background:none;border:none;cursor:pointer;font-size:15px;padding:0 4px;vertical-align:middle}
  @media(max-width:680px){.rules{grid-template-columns:1fr}.combo .big{font-size:44px}}
</style>
</head>

<script id="data" type="application/json">{"id": "aw", "combo": "aw", "title": "aw 同音家族", "sound": "/ɔː/", "subtitle": "一个口型，串起一整族单词", "intro": "「aw」是英语里最规整的拼写—发音对应之一。只要 a 和 w 待在同一个音节里，它几乎永远发长元音 /ɔː/——一个音，不是「啊」加「屋」两个音。于是 law、saw、draw、jaw、raw…… 全部同韵，可以像唱歌一样成串背下来。这一页把六级与托福里所有含 aw 的词按发音分成两拨：主力是同音的 /ɔː/ 家族，另设一小拨「同形不同音」的例外，帮你一次把规律和陷阱都吃透。", "subgroups": [{"key": "core", "tag": "/ɔː/ 同音", "label": "✅ aw = /ɔː/（主力同音组）", "desc": "核心规律：a + w 同音节 → /ɔː/。发音要领——下巴放低、嘴唇圆拢、舌根后缩，从「啊」滑向「哦」，就是医生看喉咙时让你发的那个「啊——」再收口。所有 -aw / -awl / -awn 结尾的词都共享这个口型。"}, {"key": "exception", "tag": "aw≠/ɔː/ 例外", "label": "⚠️ 同形不同音（例外组）", "desc": "例外规律：如果 a 和 w 分属两个音节（a·ware、a·wake、a·way、a·wait、a·ward），前面的 a 会弱读成 /ə/（schwa 短而含糊），w 归到后一音节，此时 aw 不再是 /ɔː/。特例 awry：wry 里的 w 不发音，所以读 /əˈraɪ/（әˈ瑞），千万别读成「奥瑞」。"}], "rhymeChains": [{"label": "-aw 结尾（最纯的同韵串）", "words": ["raw", "saw", "paw", "law", "jaw", "draw", "claw", "flaw", "straw"]}, {"label": "-awn 结尾", "words": ["dawn", "lawn", "yawn", "spawn", "prawn", "brawn"]}, {"label": "-awl 结尾", "words": ["crawl", "sprawl", "brawl", "scrawl", "drawl", "shawl"]}], "words": [{"word": "awe", "levels": ["六级"], "ipa": "/ɔː/", "subgroup": "core", "meaning": "n. 敬畏，惊叹  v. 使敬畏", "etymology": "词族的老祖宗。来自古诺尔斯语 agi「恐惧、战栗」，本义是那种既害怕又崇拜、让人腿软的巨大敬畏。后面的 awful、awesome、awstruck 全是它的孩子。", "roots": [{"part": "awe", "meaning": "令人战栗的敬畏（本词即词根）"}], "phonetics": "整词就一个音 /ɔː/，e 不发音。张大嘴发「哦——」。", "tip": "awe 是「敬畏」的源头：加 -ful 变「令人畏惧的→糟糕」，加 -some 变「令人赞叹的→超棒」，一褒一贬记一串。", "examples": [{"en": "The tourists stood in silent awe before the ancient temple.", "zh": "游客们在古庙前肃然静立，满怀敬畏。", "source": "造句"}, {"en": "shock and awe", "zh": "「震慑」——现代军事与媒体高频短语，用压倒性力量制造敬畏。", "source": "文化短语"}], "synonyms": [{"w": "reverence", "ipa": "/ˈrevərəns/", "note": "更侧重「崇敬、恭敬」，常用于宗教或对长辈，语域正式；awe 含有更多震撼、腿软的生理感。例：reverence for one's ancestors（对祖先的崇敬）", "gloss": "崇敬，恭敬"}, {"w": "wonder", "ipa": "/ˈwʌndər/", "note": "更强调「惊奇、惊叹」，偏向于正面的惊喜，没有 awe 那种让人敬畏的庄严感；口语通用。", "gloss": "惊奇，惊叹"}, {"w": "veneration", "ipa": "/ˌvenəˈreɪʃn/", "note": "最正式，专指对神圣人物/事物的崇拜膜拜，比 awe 更强调主动献上的尊崇。", "gloss": "崇拜，膜拜"}], "antonyms": [{"w": "contempt", "note": "蔑视，与敬畏截然相反"}, {"w": "indifference", "note": "漠然，毫无敬畏或惊叹之感"}], "nuance": "awe 是「既怕又崇拜」的复合情感，身体层面会让人屏息腿软；wonder 偏愉快的惊奇，缺少那种威压感；reverence 侧重主动表达的崇敬姿态。对比：The volcano filled us with awe（让人敬畏到腿软），而 The waterfall was a wonder to behold（令人愉快地惊叹）。", "core": "令人腿软的巨大敬畏——既害怕又崇拜，身体和心理同时被震慑。", "senses": [{"gloss": "n. 敬畏，惊叹（的感受）", "logic": "核心义本身，指那种震慑到让人屏息的复合情绪。", "en": "Standing at the edge of the Grand Canyon, she felt a profound sense of awe.", "zh": "站在大峡谷边缘，她感到一种深沉的敬畏。"}, {"gloss": "v. 使敬畏，使震惊", "logic": "从「敬畏感」引申为「使某人产生这种感受」的动作。", "en": "The scale of the universe never fails to awe me.", "zh": "宇宙的尺度每次都让我叹为观止。"}], "derivatives": [{"w": "awesome", "gloss": "令人敬畏的；（口语）极好的"}, {"w": "awful", "gloss": "糟糕的；可怕的（词义已贬化）"}, {"w": "awestruck", "gloss": "被震撼到目瞪口呆的"}]}, {"word": "awesome", "levels": ["托福"], "ipa": "/ˈɔːsəm/", "subgroup": "core", "meaning": "adj. 令人敬畏的；（口语）棒极了", "etymology": "awe + -some（充满某种性质的）。16 世纪本义「令人敬畏的」，1960 年代美国俚语把它彻底口语化成「超赞」。", "roots": [{"part": "awe", "meaning": "敬畏"}, {"part": "-some", "meaning": "充满……的（形容词后缀，如 handsome、tiresome）"}], "phonetics": "aw = /ɔː/ 重读，-some 弱读成 /səm/。", "examples": [{"en": "You just fixed it in five minutes? That's awesome!", "zh": "你五分钟就修好了？太牛了！", "source": "造句"}, {"en": "Everything Is Awesome", "zh": "《乐高大电影》(2014) 主题曲，把 awesome 唱成全民口头禅。", "source": "电影歌曲"}], "synonyms": [{"w": "magnificent", "ipa": "/mæɡˈnɪfɪsnt/", "note": "正式书面词，侧重壮丽、宏大，可形容建筑、景色，不像 awesome 那么口语化。", "gloss": "壮丽的，宏伟的"}, {"w": "impressive", "ipa": "/ɪmˈpresɪv/", "note": "中性词，强调给人留下深刻印象，语域比 awesome 正式、适用场景更广；awesome 在口语中常泛化为「好」。", "gloss": "令人印象深刻的"}, {"w": "incredible", "ipa": "/ɪnˈkredɪbl/", "note": "强调「难以置信的好/大」，与 awesome 可互换，但 incredible 有更强的「超出预期」感。", "gloss": "难以置信地好的"}, {"w": "mind-blowing", "note": "纯口语俚语，强调让人脑洞大开的震撼，与 awesome 语气相近，更年轻化。", "gloss": "令人震撼的，让人脑洞大开的"}], "antonyms": [{"w": "terrible", "note": "糟糕的（与口语义相反）"}, {"w": "mediocre", "note": "平庸的，毫不出彩"}], "nuance": "awesome 在现代口语中已高度泛化，几乎等于「好」；magnificent 和 impressive 保留了「令人敬畏地壮丽」的本义，适合书面。若要在正式写作中表达「震撼壮观」，用 magnificent / breathtaking，不要用 awesome。", "core": "充满敬畏感——原指「令人敬畏的庄严」，后口语化为「超棒」。", "senses": [{"gloss": "adj. 令人敬畏的，令人震撼的（本义）", "logic": "awe（敬畏）+ -some（充满），字面就是「充满敬畏感的」。", "en": "The aurora borealis is an awesome natural display.", "zh": "北极光是令人叹为观止的自然奇景。"}, {"gloss": "adj. 极好的，太棒了（口语义）", "logic": "1960年代美式俚语将「震撼」感缩减为泛化的正面评价。", "en": "You finished the whole project in one day? That's awesome!", "zh": "你一天就完成了整个项目？太厉害了！"}], "derivatives": [{"w": "awesomely", "gloss": "令人叹为观止地；（口语）非常棒地"}, {"w": "awesomeness", "gloss": "令人叹为观止的特质"}]}, {"word": "awful", "levels": ["六级", "托福"], "ipa": "/ˈɔːfl/", "subgroup": "core", "meaning": "adj. 糟糕的，可怕的；（副词化）非常", "etymology": "awe + -ful（充满……的）。本义竟是褒义的「令人敬畏的、威严的」——早期《圣经》里 God is awful 是赞美。19 世纪词义贬化：令人敬畏 → 令人害怕 → 糟糕透顶。它的孪生兄弟 awesome 却走向了褒义。", "roots": [{"part": "awe", "meaning": "敬畏"}, {"part": "-ful", "meaning": "充满……的（形容词后缀）"}], "phonetics": "aw = /ɔː/，-ful 弱读成 /fl/，别念成 full。", "examples": [{"en": "The weather was awful, but the company was wonderful.", "zh": "天气糟透了，但同行的人很棒。", "source": "造句"}, {"en": "The Awful Truth", "zh": "《春闺风月》(1937)，加里·格兰特经典爱情喜剧，片名里的 awful 带反讽。", "source": "电影片名"}], "synonyms": [{"w": "terrible", "ipa": "/ˈterɪbl/", "note": "最常用的近义词，语气相当，口语书面皆宜；awful 有时偏主观感受，terrible 更多指客观糟糕。", "gloss": "糟糕的，可怕的"}, {"w": "dreadful", "ipa": "/ˈdredf(ə)l/", "note": "语气稍强于 awful，带有「令人恐惧」的意味，多见于英式英语。例：dreadful news（可怕的消息）", "gloss": "令人恐惧的，极糟糕的"}, {"w": "atrocious", "ipa": "/əˈtrəʊʃəs/", "note": "语气最强，本义「残暴的」，现也用于表达极度糟糕（如 atrocious weather），语气比 awful 更夸张正式。", "gloss": "极度恶劣的，残暴的"}], "antonyms": [{"w": "wonderful", "note": "精彩的、美好的"}, {"w": "excellent", "note": "优秀的"}], "nuance": "awful 和 terrible 几乎可互换，awful 偏口语感叹（That's awful!），terrible 在书面中更自然；dreadful 带恐惧色彩，多见于英式；atrocious 语气最重，暗示道德或质量层面的严重劣质。", "core": "充满敬畏感——但词义贬化，由「令人敬畏」滑向「可怕→糟糕」。", "senses": [{"gloss": "adj. 糟糕的，可怕的", "logic": "「令人敬畏」的感受历经几百年贬化，变成纯负面的「可怕→糟透了」。", "en": "The traffic was awful; we sat in the car for two hours.", "zh": "交通糟透了，我们在车里坐了两个小时。"}, {"gloss": "adv.（口语）非常，极其（awful + adj.）", "logic": "从程度副词化引申，强调极端程度，如 awful tired（极其疲倦）。", "en": "She was awful tired after the long hike.", "zh": "长途徒步后她累得很。"}], "derivatives": [{"w": "awfully", "gloss": "极其，非常；可怕地"}, {"w": "awfulness", "gloss": "可怕程度；糟糕的状态"}]}, {"word": "awkward", "levels": ["六级", "托福"], "ipa": "/ˈɔːkwərd/", "subgroup": "core", "meaning": "adj. 尴尬的；笨拙的；难处理的", "etymology": "一个绝妙的词源：中古英语 awk「反的、错方向的」（源自古诺尔斯语 afugr「转错了方向」）+ -ward（方向后缀，如 backward）。字面意思就是「朝错误方向的」——于是引申为动作别扭、场面尴尬。", "roots": [{"part": "awk", "meaning": "反的、错方向的"}, {"part": "-ward", "meaning": "朝……方向（如 forward、toward）"}], "phonetics": "aw = /ɔː/，kw 连读像「垮」，整体 /ˈɔːkwərd/。", "tip": "记住「朝错误方向 = 别扭尴尬」，awk-ward 拆开就是画面。", "examples": [{"en": "There was an awkward silence after his joke fell flat.", "zh": "他的笑话冷场后，出现了一阵尴尬的沉默。", "source": "造句"}, {"en": "Awkward", "zh": "MTV 青春剧《高中的烦恼》(2011)，剧名一词道尽青春期的别扭。", "source": "美剧片名"}], "synonyms": [{"w": "clumsy", "ipa": "/ˈklʌmzi/", "note": "侧重动作笨拙、不协调，多指身体层面（clumsy fingers），而 awkward 还涵盖社交场面的尴尬。", "gloss": "笨拙的，不协调的"}, {"w": "uncomfortable", "ipa": "/ʌnˈkʌmftəbl/", "note": "指「令人不舒适/不自在」，可替代 awkward 的「尴尬」义，但 awkward 更强调双方都感到为难的僵局。", "gloss": "令人不舒适的，令人不自在的"}, {"w": "embarrassing", "ipa": "/ɪmˈbærəsɪŋ/", "note": "专指令人难堪、羞窘，比 awkward 更强调当事人的内心羞耻感；awkward 更侧重局面的棘手。", "gloss": "令人尴尬的，令人羞窘的"}, {"w": "ungainly", "ipa": "/ʌnˈɡeɪnli/", "note": "书面词，专指动作或外形笨拙难看，不含社交尴尬义，比 clumsy 更书面。", "gloss": "动作难看的，笨拙的"}], "antonyms": [{"w": "graceful", "note": "优雅的，动作流畅自然"}, {"w": "smooth", "note": "顺畅的，（社交）应对自如"}], "nuance": "awkward 最广义：既可指动作笨拙（awkward posture），又可指场面尴尬（awkward silence），还可指难处理（awkward question）；clumsy 专指动作层面；embarrassing 专指令人羞窘。三者中 awkward 最百搭。", "core": "朝错误方向——字面是「转错了方向」，引申为动作别扭、场面尴尬、情况棘手。", "senses": [{"gloss": "adj. 尴尬的，令人不自在的", "logic": "「朝错误方向」的人际关系状态，双方都感到为难的僵局。", "en": "There was an awkward silence after he made the insensitive remark.", "zh": "他说出那番失礼的话后，现场陷入了尴尬的沉默。"}, {"gloss": "adj. 笨拙的，不协调的（动作）", "logic": "动作「朝错误方向」，无法流畅协调地完成。", "en": "He made an awkward attempt to catch the ball and missed.", "zh": "他笨拙地试图接住球，却没抓到。"}, {"gloss": "adj. 难处理的，棘手的", "logic": "事情「朝错误方向」，不好解决。", "en": "You've put me in a very awkward position.", "zh": "你让我陷入了一个非常棘手的处境。"}], "derivatives": [{"w": "awkwardly", "gloss": "尴尬地；笨拙地"}, {"w": "awkwardness", "gloss": "尴尬；笨拙"}, {"w": "awk", "gloss": "（词根）反的、错方向的（已不独立使用）"}]}, {"word": "dawn", "levels": ["六级", "托福"], "ipa": "/dɔːn/", "subgroup": "core", "meaning": "n. 黎明，破晓；开端  v. 破晓；开始明白", "etymology": "由 dawning 逆构而来，词根是 day。古英语 dagian「天亮」。dawn on sb 表示「某人恍然大悟」——像天光乍现。", "roots": [{"part": "daw- (day)", "meaning": "白天、天亮"}, {"part": "-n", "meaning": "构成名词/动词"}], "phonetics": "aw = /ɔː/，词尾 n。与 dawn/lawn/yawn 同韵。", "examples": [{"en": "It suddenly dawned on her that she had left the keys inside.", "zh": "她突然意识到自己把钥匙落在里面了。", "source": "造句（dawn on 用法）"}, {"en": "Dawn of the Dead", "zh": "《活死人黎明》(1978/2004)，丧尸片经典，dawn 是「新纪元的开端」。", "source": "电影片名"}], "synonyms": [{"w": "daybreak", "ipa": "/ˈdeɪbreɪk/", "note": "与 dawn 几乎同义，指天刚亮的时刻，但更口语直白，常见于新闻标题。", "gloss": "破晓，天刚亮"}, {"w": "sunrise", "ipa": "/ˈsʌnraɪz/", "note": "强调太阳升起的那一刻，dawn 更广义（包括天光初现的整个过程）；sunrise 侧重视觉上的日出景象。", "gloss": "日出，太阳升起"}, {"w": "daylight", "ipa": "/ˈdeɪlaɪt/", "note": "泛指白天的光线，范围比 dawn 宽，不专指黎明时刻；常用于 daylight hours（白天时间）。", "gloss": "白天的光，日光"}], "antonyms": [{"w": "dusk", "note": "黄昏，傍晚天色渐暗"}, {"w": "nightfall", "note": "夜幕降临"}], "nuance": "dawn 兼具名词（黎明）和动词（破晓/领悟），且有丰富引申义（dawn of civilization 文明曙光；it dawned on me 恍然大悟）；sunrise 只指日出景象，无引申；daybreak 最口语，无引申义。", "core": "光从黑暗中破出——黎明时天光乍现的那一刻，引申为开端与恍然大悟。", "senses": [{"gloss": "n. 黎明，破晓", "logic": "核心意象：黑夜结束，光线第一次出现。", "en": "They set off at dawn to avoid the midday heat.", "zh": "他们在黎明时出发，以避开正午的酷热。"}, {"gloss": "n. 开端，起点", "logic": "「光破黑暗」引申为某事物的「开始」，如 the dawn of civilization（文明曙光）。", "en": "We are witnessing the dawn of a new era in computing.", "zh": "我们正在见证计算机领域新纪元的开端。"}, {"gloss": "v. 破晓，天亮", "logic": "黎明到来的动作本身。", "en": "The day dawned cold and grey.", "zh": "天亮了，又冷又阴沉。"}, {"gloss": "v. （dawn on sb）使某人恍然大悟", "logic": "「光突然照进来」的感觉，比喻理解在脑中乍现——像晨光突然照亮黑暗。", "en": "It suddenly dawned on him that he had left his wallet at home.", "zh": "他突然意识到自己把钱包落在家里了。"}], "derivatives": [{"w": "predawn", "gloss": "黎明前的，拂晓前的"}, {"w": "daybreak", "gloss": "破晓，天亮（同义近义词）"}]}, {"word": "draw", "levels": ["六级", "托福"], "ipa": "/drɔː/", "subgroup": "core", "meaning": "v. 画；拉，拖；吸引；提取（款项）  n. 平局；抽签", "etymology": "古英语 dragan「拖、拉」，和 drag 同源。所有含义都是「拉」的引申：拉笔过纸 = 画；拉过来 = 吸引；从账户拉出钱 = 取款。", "roots": [{"part": "draw (drag)", "meaning": "拖、拉"}], "phonetics": "dr- 辅音连缀 + aw /ɔː/。r 是英式轻擦音。", "tip": "一个「拉」字打通所有释义：画=拉笔，吸引=拉近，取款=拉出钱。", "examples": [{"en": "Her novel draws heavily on her childhood in Shanghai.", "zh": "她的小说大量取材于她在上海的童年。", "source": "造句（draw on 用法）"}, {"en": "back to the drawing board", "zh": "「回到绘图板」——推倒重来、从头再想，英语超高频习语。", "source": "文化习语"}], "synonyms": [{"w": "pull", "ipa": "/pʊl/", "note": "「拉/拖」最直白的近义词，侧重施力方向（朝自己拉），比 draw 更口语；draw 还有画画、吸引等引申义，pull 没有。", "gloss": "拉，拖"}, {"w": "sketch", "ipa": "/sketʃ/", "note": "取 draw「画」义的近义词，侧重快速勾勒草图，比 draw 更具体；draw 泛指任何绘图动作。", "gloss": "素描，速写；勾勒"}, {"w": "attract", "ipa": "/əˈtrækt/", "note": "取 draw「吸引」义的近义词；attract 更正式，draw 在此义项上更隐喻性（draw a crowd 吸引人群）。", "gloss": "吸引"}, {"w": "extract", "ipa": "/ɪkˈstrækt/", "note": "取 draw「提取」义（draw water/blood）的近义词，更书面正式，常用于技术/医学语境。", "gloss": "提取，抽取"}], "antonyms": [{"w": "push", "note": "推（与「拉」相对）"}, {"w": "repel", "note": "排斥、驱离（与「吸引」相对）"}], "nuance": "draw 是高度多义词，核心是「拉」的动作。与 pull 的关键区别：draw 更优雅/正式（draw a curtain 拉帘子；draw a conclusion 得出结论），pull 更粗暴直接（pull the trigger 扣扳机）；draw 还独有「画画」「平局」等义。", "core": "拉——所有义项都是「拉」的引申：拉笔过纸是画，把人拉近是吸引，从账户拉出来是取款。", "senses": [{"gloss": "v. 画，绘制", "logic": "「拉着笔」在纸上划过，形成线条。", "en": "She drew a quick sketch of the building on her notepad.", "zh": "她在记事本上快速画了栋楼的草图。"}, {"gloss": "v. 拉，拖", "logic": "核心义，施力将物体朝自己方向移动。", "en": "He drew the curtains and let in the morning light.", "zh": "他拉开窗帘，让晨光照进来。"}, {"gloss": "v. 吸引，招引", "logic": "像磁铁一样把人「拉」过来。", "en": "The festival draws thousands of visitors every year.", "zh": "这个节日每年吸引数以千计的游客。"}, {"gloss": "v. 提取（款项）；取用", "logic": "从账户把钱「拉出来」。", "en": "She drew five hundred dollars from her savings account.", "zh": "她从储蓄账户取出了五百美元。"}, {"gloss": "n. 平局", "logic": "两队势均力敌，互相「拉扯」，谁也拉不赢——历史偶合，并非从「拉」直接引申，需标注。", "en": "The match ended in a draw, one goal each.", "zh": "比赛以平局告终，双方各进一球。"}, {"gloss": "n. 抽签；吸引人的事物", "logic": "「拉出」一个号码或结果，引申为「吸引力」。", "en": "The new coffee shop is already a big draw in the neighbourhood.", "zh": "那家新咖啡馆已经成为街区的一大吸引点。"}], "derivatives": [{"w": "drawback", "gloss": "缺点，不利因素"}, {"w": "drawer", "gloss": "抽屉；绘图者"}, {"w": "drawing", "gloss": "画；绘图；抽签"}]}, {"word": "drawback", "levels": ["六级", "托福"], "ipa": "/ˈdrɔːbæk/", "subgroup": "core", "meaning": "n. 缺点，不利因素", "etymology": "draw（拉）+ back（回）= 把你往回拉的东西 → 阻碍、缺点。原是贸易术语，指「退税」（把税款拉回来）。", "roots": [{"part": "draw", "meaning": "拉"}, {"part": "back", "meaning": "向后、回"}], "phonetics": "重音在前 DRAW-back，aw = /ɔː/。", "examples": [{"en": "The main drawback of the plan is its high cost.", "zh": "这个方案的主要缺点是成本太高。", "source": "造句"}, {"en": "the one drawback / a serious drawback", "zh": "写作高频搭配：the main / one / serious drawback of…", "source": "高频搭配"}], "synonyms": [{"w": "disadvantage", "ipa": "/ˌdɪsədˈvɑːntɪdʒ/", "note": "最通用的近义词，侧重「不利条件/劣势」，比 drawback 更正式书面，可数不可数均可。", "gloss": "不利条件，劣势"}, {"w": "downside", "ipa": "/ˈdaʊnsaɪd/", "note": "口语近义词，常用于 the downside of/to sth，语气比 drawback 轻松；多指某事物的「阴暗面」。", "gloss": "不利的一面，缺点"}, {"w": "shortcoming", "ipa": "/ˈʃɔːtkʌmɪŋ/", "note": "侧重某人/某事物本身的「不足、缺陷」，比 drawback 更强调内在缺陷，而 drawback 更侧重外部不利因素。", "gloss": "缺点，不足之处"}, {"w": "limitation", "ipa": "/ˌlɪmɪˈteɪʃn/", "note": "强调「局限性」，多用于方法、技术、能力层面；比 drawback 更中性，不带「拖后腿」的负面感。", "gloss": "局限性，限制"}], "antonyms": [{"w": "advantage", "note": "优势，有利条件"}, {"w": "benefit", "note": "益处，好处"}], "nuance": "drawback 最常用于「一个计划/方案的缺点」，搭配 the main drawback of…；shortcoming 更常用于指人的缺 es": [{"en": "He withdrew from the competition after injuring his knee.", "zh": "膝盖受伤后他退出了比赛。", "source": "造句"}, {"en": "withdraw the troops", "zh": "「撤军」——新闻高频搭配；也说 withdraw an offer / remark。", "source": "高频搭配"}], "synonyms": [{"w": "retreat", "ipa": "/rɪˈtriːt/", "note": "取「撤退」义，侧重军事或物理空间上的后撤，比 withdraw 更强调被迫退后；withdraw 更正式中性（也可指撤销声明）。", "gloss": "撤退，后退"}, {"w": "retract", "ipa": "/rɪˈtrækt/", "note": "取「收回/撤回」义，专指收回已说出的话/做出的声明，比 withdraw 更聚焦于言辞层面。例：retract a statement（撤回声明）", "gloss": "收回（言辞），缩回"}, {"w": "pull out", "note": "口语化的「撤出、退出」，与 withdraw from 意思相近，但更非正式；withdraw from negotiations 比 pull out of negotiations 更正式。", "gloss": "撤出，退出（口语）"}, {"w": "revoke", "ipa": "/rɪˈvəʊk/", "note": "取「撤销」义，专用于正式撤销法律/许可/决定，比 withdraw 更具法律效力感。例：revoke a license（吊销执照）", "gloss": "撤销，吊销（法律效力）"}], "antonyms": [{"w": "deposit", "note": "存款（与取款相对）"}, {"w": "advance", "note": "前进、推进（与撤退相对）"}, {"w": "submit", "note": "提交、递交（与收回相对）"}], "nuance": "withdraw 最通用：涵盖撤退（军事）、取款（金融）、撤回（言辞/申请）三大场景；retract 专指撤回言辞，多用于新闻/法律；retreat 专指物理或军事后撤，带有「被迫」色彩；revoke 专用于法律效力的正式撤销。", "core": "往回拉——with-（向后）+draw（拉），所有义项都是「把某物从当前位置拉离」。", "senses": [{"gloss": "v. 撤回，收回（承诺/声明/申请）", "logic": "把已发出去的东西「拉回来」。", "en": "He withdrew his earlier comments after they caused public outrage.", "zh": "在引起公众愤慨后，他收回了早前的言论。"}, {"gloss": "v. 撤退，退出（军事/竞争）", "logic": "把军队或自己「拉离」当前位置。", "en": "The army was ordered to withdraw from the occupied territory.", "zh": "军队被命令撤出占领区。"}, {"gloss": "v. 取款，提款", "logic": "把钱从账户「拉出来」。", "en": "Can I withdraw cash at this ATM without a fee?", "zh": "我能在这台ATM免费取现吗？"}], "derivatives": [{"w": "withdrawal", "gloss": "撤回；取款；戒断反应"}, {"w": "withdrawn", "gloss": "内向的，孤僻的（引申义）"}]}, {"word": "withdrawal", "levels": ["六级"], "ipa": "/wɪðˈdrɔːəl/", "subgroup": "core", "meaning": "n. 收回，撤退；取款；（药物）戒断反应", "etymology": "withdraw + -al（名词后缀）。医学上 withdrawal symptoms 指停药后的「戒断反应」——身体被「往回拉」的痛苦。", "roots": [{"part": "withdraw", "meaning": "撤回、拉回"}, {"part": "-al", "meaning": "名词后缀（表动作/状态）"}], "phonetics": "-drawa ul claws to grip the fish.", "zh": "老鹰用强有力的爪子抓住了鱼。"}, {"gloss": "v. （用爪）抓，撕；拼命争取", "logic": "用爪子抓的动作，引申为不顾一切地拼命抓取（claw one's way 一路拼杀）。", "en": "She clawed her way back to the top after losing everything.", "zh": "失去一切后，她拼命挣扎重回巅峰。"}], "derivatives": [{"w": "clawed", "gloss": "有爪的；被爪抓过的"}, {"w": "clawback", "gloss": "追回，收回（已发放的钱/奖金）"}]}, {"word": "jaw", "levels": ["六级", "托福"], "ipa": "/dʒɔː/", "subgroup": "core", "meaning": "n. 颌，下巴；（复数）钳口", "etymology": "词源不确定，可能受古法语 joue「脸颊」与 chew「咀嚼」双重影响——毕竟下巴就是用来嚼的。", "roots": [{"part": "jaw", "meaning": "颌、下巴"}], "phonetics": "j = /dʒ/，aw = /ɔː/。", "examples": [{"en": "His jaw dropped when he saw the bill.", "zh": "看到账单时他惊得下巴都掉了。", "source": "造句（jaw drop 用法）"}, {"en": "Jaws", "zh": "斯皮尔伯格《大白鲨》(1975)，片名 Jaws 就是那张吞人巨口，影史经典。", "source": "电影片名"}], "synonyms": [{"w": "mandible", "ipa": "/ˈmændɪbl/", "note": "解剖/生物学术语，专指「下颌骨」；jaw 是日常口语词，mandible 出现在学术文章中。", "gloss": "下颌骨（解剖/生物学术语）"}, {"w": "chin", "ipa": "/tʃɪn/", "note": "「下巴」（外部可见部分），与 jaw（颌骨/颌部）有区别：chin 是外观，jaw 是骨骼结构及其动作。", "gloss": "下巴（外部可见部分）"}], "nuance": "jaw 是具体解剖部位名词，近义词很少。mandible 是其学术精确表达；chin 是外部可见的下巴尖部，两者不完全重合。jaw-dropping（令人震惊到下巴掉下来）是重要习语用法。", "core": "用来咬的颌部——颌骨和下巴的总称，引申为「令人震惊到下巴掉下来」。", "senses": [{"gloss": "n. 颌，下巴（解剖部位）", "logic": "核心义，指面部用于咀嚼、咬合的骨骼结构。", "en": "He fractured his jaw in the fall.", "zh": "他摔倒时摔断了下颌。"}, {"gloss": "n. （复数）钳口，夹紧装置", "logic": "两个「颌」合拢夹紧，比喻机械夹具的两个夹片。", "en": "The jaws of the vice gripped the metal rod firmly.", "zh": "台钳的钳口牢牢夹住了金属杆。"}, {"gloss": "n. （复数）险境，危险的口（文学比喻）", "logic": "「大口」的意象引申为「吞噬一切」的危险处境。", "en": "Somehow they escaped from the jaws of defeat.", "zh": "他们竟然从败局的边缘逃脱了。"}], "derivatives": [{"w": "jaw-dropping", "gloss": "令人瞠目结舌的，令人震惊的"}, {"w": "jawbone", "gloss": "颌骨"}, {"w": "jawline", "gloss": "下颌线"}]}, {"word": "raw", "levels": ["六级", "托福"], "ipa": "/rɔː/", "subgroup": "core", "meaning": "adj. 生的，未加工的；原始的；（伤口）红肿的", "etymology": "古英语 hreaw，可追溯到印欧词根 *kreue-「生肉、血」——与 crude（未加工的）、cruel（残忍的）同源。", "roots": [{"part": "raw", "meaning": " 慢爬行，引申为速度极慢或网络爬虫。", "senses": [{"gloss": "v. 爬行，匍匐前进", "logic": "核心义，四肢着地贴近地面移动。", "en": "The baby learned to crawl before she could walk.", "zh": "婴儿在会走路之前先学会了爬。"}, {"gloss": "v./n. 缓慢移动；缓慢状态", "logic": "爬行速度极慢，引申为任何极缓慢的移动（交通堵塞等）。", "en": "Traffic slowed to a crawl during rush hour.", "zh": "高峰时段交通减速到几乎停滞。"}, {"gloss": "v. 爬取（网页），网络爬虫", "logic": "技术义，程序像虫子爬过网络，逐页抓取数据。", "en": "The search engine crawls billions of web pages every day.", "zh": "这个搜索引擎每天爬取数十亿个网页。"}], "derivatives": [{"w": "crawler", "gloss": "爬行者；网络爬虫程序"}, {"w": "crawlspace", "gloss": "爬行空间（建筑中人可爬入的狭窄空间）"}]}, {"word": "sprawl", "levels": ["托福"], "ipa": "/sprɔːl/", "subgroup": "core", "meaning": "v. 四肢摊开地躺/坐；（城市）无序蔓延  n. 蔓延", "etymology": "古英语 spreawlian「痉挛地乱动」，引申为「摊开、无序扩张」。", "roots": [{"part": "sprawl", "meaning": "摊开、蔓延"}], "phonetics": "spr- 三连缀 + awl /ɔːl/。", "examples": [{"en": "He sprawled on the sofa, too tired to move.", "zh": "他四肢摊开瘫在沙发上，累得动不了。", "source": "造句"}, {"en": "urban sprawl", "zh": "「城市无序扩张」——城市规划核心术语，托福阅读高频。", "source": "学术术语"}], "synonyms": [{"w": "stretch out", "note": "「伸展开来躺着」，与 sprawl 的「摊开躺」义最接近，但更口语中性；sprawl 带有随意、无节制的意味。", "gloss": "伸展，摊开躺着"}, {"w": "spread", "ipa": "/spred/", "note": "取 sprawl「蔓延」义的近义词，比 sprawl 更中性；urban sprawl 中 sprawl 特指无序杂乱的扩张，spread 更中性无贬义。", "gloss": "蔓延，扩散（更中性）"}, {"w": "loll", "ipa": "/lɒl/", "note": "「懒洋洋地躺/坐」，与 sprawl 的姿态义相近，但 loll 更强调懒散随意，sprawl 更强调四肢张开摊开的样子。", "gloss": "懒洋洋地躺着或靠着"}], "antonyms": [{"w": "contract", "note": "收缩，紧缩（与蔓延相对）"}, {"w": "sit upright", "note": "端正坐好（与四肢摊开相对）"}], "nuance": "sprawl 有两个核心义：①人「四肢摊开躺着」——比 lie 更强调姿态随意无序；②城市「无序蔓延」（urban sprawl）——比 spread 带有更强的负面评价（杂乱、低密度、难管理）。这种负面色彩是 sprawl 区别于其他词的关键。", "core": "无序摊开——四肢摊开躺着或城市无计划地向外蔓延，两义共享「杂乱无序扩张」的感觉。", "senses": [{"gloss": "v. 四肢摊开地躺或坐", "logic": "身体随意扩展到最大面积，姿态无序。", "en": "He sprawled across the sofa and fell asleep immediately.", "zh": "他四肢大开地瘫在沙发上，立刻睡着了。"}, {"gloss": "v./n. （城市）无序蔓延；蔓延状态", "logic": "城市像摊开的躯体一样不受控制地向外扩张，杂乱无章。", "en": "Urban sprawl is consuming farmland at an alarming rate.", "zh": "城市无序扩张正以惊人的速度侵吞农田。"}], "derivatives": [{"w": "sprawling", "gloss": "摊开的；（城市）无序蔓延的"}, {"w": "urban sprawl", "gloss": "城市无序扩张（固定短语）"}]}, {"word": "shawl", "levels": ["六级", "GRE拓展"], "ipa": "/ʃɔːl/", "subgroup": "core", "meaning": "n. 披肩，围巾", "etymology": "外来词。经乌尔都语/印地语从波斯语 shāl 传入英语——一条丝路上的词。", "roots": [{"part": "shawl (shāl)", "meaning": "波斯语「披巾」"}], "phonetics": "sh = /ʃ/，awl = /ɔːl/。", "examples": [{"en": "The old woman wrapped a woolen shawl around her shoulders.", "zh": "老妇人把一条羊毛披肩裹在肩上。", "source": "造句"}, {"en": "a fringed shawl", "zh": "「带流苏的披肩」——文学描写高频搭配。", "source": "高频搭配"}], "synonyms": [{"w": "wrap", "ipa": "/ræp/", "note": "「围巾/披肩」的通用词，比 shawl 更口语；shawl 特指较大的方形或长方形披肩，wrap 更宽泛。", "gloss": "围巾，披肩（宽泛通称）"}, {"w": "stole", "ipa": "/stəʊl/", "note": "「长条披肩/领巾」，比 shawl 更细长，多用于正式场合或宗教仪式；shawl 更厚实方形，stole 更轻薄修长。", "gloss": "长条披肩，领巾（较修长正式）"}, {"w": "scarf", "ipa": "/skɑːrf/", "note": "「围巾」，比 shawl 更细窄，主要用于颈部保暖；shawl 更宽大，可披在肩上。", "gloss": "围巾（细长，主要围颈部）"}], "nuance": "shawl 是具体服饰名词，指宽大的披肩布料。与 scarf 的区别：scarf 细长围脖，shawl 宽大披肩；与 stole 的区别：stole 更修长正式，shawl 更厚实日常。", "core": "裹在肩上的大块布料——从波斯丝路传来的词，指宽大保暖的披肩，无多义。", "senses": [{"gloss": "n. 披肩，围巾（宽大的方形或长方形）", "logic": "核心义且唯一义，指披裹在肩上或头上的大块布料。", "en": "She wrapped a cashmere shawl around her shoulders against the chill.", "zh": "她把一条羊绒披肩裹在肩上抵御寒意。"}], "derivatives": [{"w": "shawl collar", "gloss": "披肩领（服装术语）"}]}, {"word": "brawl", "levels": ["GRE拓展"], "ipa": "/brɔːl/", "subgroup": "core", "meaning": "n./v. （在公共场合）斗殴，打架", "etymology": "或源自荷兰语 brallen「大声吵嚷、吹嘘」——先吵后打，画面感十足。", "roots": [{"part": "brawl", "meaning": "喧闹、斗殴"}], "phonetics": "br- 连缀 + awl /ɔːl/。", "examples": [{"en": "A drunken brawl broke out outside the bar.", "zh": "酒吧外爆发了一场醉汉斗殴。", "source": "造句"}, {"en": "bar brawl / brawl broke out", "zh": "「酒吧斗殴 / 斗殴爆发」——高频搭配。", "source": "高频搭配"}], "synonyms": [{"w": "fight", "ipa": "/faɪt/", "note": "最通用的「打架、斗殴」，比 brawl 范围更广（可指正式拳击也可指街头打架）；brawl 专指混乱的公共场合群殴，多人参与。", "gloss": "打架，打斗（最通用）"}, {"w": "scuffle", , "roots": [{"part": "saw (*sek-)", "meaning": "切割"}], "phonetics": "/sɔː/，与 raw、law 同韵。别和过去式 saw（同拼同音）混淆。", "tip": "一个 saw 三副面孔：锯子 / see 的过去式 / 老话格言。", "examples": [{"en": "He sawed the plank in half.", "zh": "他把木板锯成两半。", "source": "造句"}, {"en": "an old saw", "zh": "「一句老话、老生常谈的格言」——saw 鲜为人知的名词义。", "source": "文化用法"}], "synonyms": [{"w": "proverb", "ipa": "/ˈprɒvɜːrb/", "note": "取 saw「格言/老话」义的最近义词，比 saw 更常用，指民间流传的智慧箴言；saw 更古旧，带有陈词滥调的意味。", "gloss": "谚语，箴言（最通用）"}, {"w": "adage", "ipa": "/ˈædɪdʒ/", "note": "「古语、名言」，与 saw 在「格言」义上近义，比 saw 更书面正式；adage 常用于 the old adage that…", "gloss": "古语，名言（书面正式）"}, {"w": "maxim", "ipa": "/ˈmæksɪm/", "note": "「格言、座右铭」，比 saw 更简洁有力，通常是有逻辑的行为准则；saw 更偏向民间俗语。", "gloss": "格言，座右铭（简练有力）"}, {"w": "hacksaw", "ipa": "/ˈhæksɔː/", "note": "取 saw「锯子」义：hacksaw 是手工钢锯；jigsaw 是拼图/线锯；chainsaw 是链锯。这些是 saw 的具体种类而非近义词。", "gloss": "钢锯（锯子义的具体种类）"}], "nuance": "saw 作「格言」义时，暗示该话已是老生常谈（an old saw 老话一句）；proverb 中性，指流传的民间智慧；adage 更书面，带古老权威感；maxim 更精练，像行为准则。作「锯子」义时无真正近义词，只有种类词（hacksaw/jigsaw 等）。", "core": "（注意：三个同形异义词）锯子的 saw 核心是「切割」；see 的过去式是历史偶合；格言的 saw 来自「说的话」。", "senses": [{"gloss": "n. 锯子  v. 锯（锯、切割）", "logic": "来自印欧词根 *sek-「切」，锯子是「切割工具」，核心义。", "en": "He used a handsaw to cut the planks to size.", "zh": "他用手锯把木板锯到合适的尺寸。"}, {"gloss": "v. see 的过去式（历史偶合，与锯子无关）", "logic": "历史偶合：see 的过去式碰巧也拼作 saw，与锯子词源完全不同，无法串记，需直接记忆。", "en": "I saw her at the market yesterday.", "zh": "昨天我在市场看到了她。"}, {"gloss": "n. 格言，老话（an old saw）", "logic": "来自古英语 sagu「说的话」，与 say 同源，历史偶合与锯子无关，需标注。", "en": "As the old saw goes, actions speak louder than words.", "zh": "正如那句老话所说，行动胜于言辞。"}], "derivatives": [{"w": "hacksaw", "gloss": "钢锯，手工金属锯"}, {"w": "chainsaw", "gloss": "链锯"}, {"w": "jigsaw", "gloss": "线锯；拼图玩具"}]}, {"word": "paw", "levels": ["六级"], "ipa": "/pɔː/", "subgroup": "core", "meaning": "n. （动物的）爪子  v. （笨拙或粗鲁地）用手抓摸", "etymology": "来自古法语 powe「爪、掌」。指动物带肉垫的脚掌，与带利爪的 claw 不同。", "roots": [{"part": "paw", "meaning": "掌、爪"}], "phonetics": "/pɔː/，与 raw、saw 同韵。", "examples": [{"en": "The cat gently p : "awake", "levels": ["托福"], "ipa": "/əˈweɪk/", "subgroup": "exception", "meaning": "adj. 醒着的  v. 唤醒，觉醒（awake-awoke-awoken）", "etymology": "古英语 awæcnan，a-（加强）+ wake（醒）。", "roots": [{"part": "a-", "meaning": "加强语气"}, {"part": "wake", "meaning": "醒、唤醒"}], "phonetics": "例外！a·wake：a 弱读 /ə/，重音 -wake /ˈweɪk/。非 /ɔː/。", "examples": [{"en": "I lay wide awake, listening to the rain.", "zh": "我毫无睡意地躺着，听着雨声。", "source": "造句（wide awake）"}, {"en": "wide awake", "zh": "「完全清醒」——高频搭配，也是 Katy Perry 歌名。", "source": "文化搭配"}], "synonyms": [{"w": "alert", "ipa": "/əˈlɜːrt/", "note": "「警觉的，精神集中的」，与 awake「醒着的」义近似但更强调精神状态；wide awake 和 fully alert 都指「完全清醒且精神集中」，但 alert 更强调反应灵敏。", "gloss": "警觉的，精神集中的"}, {"w": "conscious", "ipa": "/ˈkɒnʃəs/", "note": "「有意识的」，医学语境中 conscious 与 awake 几乎同义（患者是否有意识/清醒）；日常语境中 awake 更口语（are you awake? 你醒了吗？）。", "gloss": "有意识的（医学语境）"}, {"w": "rouse", "ipa": "/raʊz/", "note": "取动词义「唤醒」，与 awake（v.唤醒）近义；rouse 更强调从深度睡眠中被强力唤醒（rouse sb from sleep），awake 更书面文学化。", "gloss": "唤醒（从深睡中强力唤醒）"}], "antonyms": [{"w": "asleep", "note": "睡着的（直接反义词）"}, {"w": "drowsy", "note": "昏昏欲睡的"}], "nuance": "awake 形容词义「醒着的」是最常用形式（I was awake all night 我整夜没睡）；动词义「唤醒/觉醒」比 awaken 更古旧文学（awake 的过去式 awoke 见于文学），日常更多用 wake up；alert 在「清醒警觉」义上更强调行动反应力。", "core": "从睡眠状态脱离——醒来或被唤醒，引申为觉醒。", "senses": [{"gloss": "adj. 醒着的，清醒的", "logic": "核心义，指处于非睡眠的清醒状态。", "en": "I was wide awake at three in the morning, unable to stop thinking.", "zh": "凌晨三点我完全清醒，无法停止思考。"}, {"gloss": "v. 唤醒，觉醒（文学用法）", "logic": "从睡眠中「出来」，引申为意识的觉醒，书面文学用法。", "en": "He awoke to find himself alone in the dark.", "zh": "他醒来发现自己独自置身黑暗之中。"}], "derivatives": [{"w": "awaken", "gloss": "唤醒；激起（情感）（比 awake 更书面）"}, {"w": "wide awake", "gloss": "完全清醒的（固定搭配）"}]}, {"word": "awaken", "levels": ["六级"], "ipa": "/əˈweɪkən/", "subgroup": "exception", "meaning": "v. 唤醒，觉醒；激起（情感）", "etymology": "awake + -en（动词后缀，表「使……」，如 strengthen、widen）。比 awake 更书面。", "roots": [{"part": "awake", "meaning": "醒"}, {"part": "-en", "meaning": "使……（动词后缀）"}], "phonetics": "a 弱读 /ə/，重音 -wa- /ˈweɪ/，非 /ɔː/。", "examples": [{"en": "The music awakened old memories of her hometown.", "zh": "这段音乐唤起了她对故乡的旧日记忆。", "source": "造句"}, {"en": "Star Wars: The Force Awakens", "zh": "《星球大战：原力觉醒》(2015)，awaken 的现象级用例。", "source": "电影片名"}], "synonyms": [{"w": "arouse", "ipa": "/əˈraʊz/", "note": "「激起、唤起」，与 awaken「激起情感」义最接近（arouse curiosity = awaken curiosity）；awaken 更文学优雅，arouse 更通用但在某些语境有情欲含义，需注意。", "gloss": "激起，唤起（情感）"}, {"w": "stir", "ipa": "/stɜːr/", "note": "「激起、搅动」，可替代 awaken 的「激起情感」义（stir emotions = awaken emotions）；stir 更口语，awaken 更书面诗意。", "gloss": "激起，搅动（情感）"}, {"w": "kindle", "ipa": "/ˈkɪndl/", "note": "「点燃（情感/兴趣）」，与 awaken 的「激起」义近义，多用于 kindle curiosity/interest/passion；比 awaken 更强调从无到有地点燃。", "gloss": "点燃（兴趣/热情）"}, {"w": "wake up", "note": "「叫醒/唤醒」，与 awaken 最基本义相同，但 wake up 口语，awaken 书面；The Force Awakens 改成 wake up 会完全失去庄重感。", "gloss": "叫醒，唤醒（口语）"}], "antonyms": [{"w": "lull", "note": "使入睡，使平静"}, {"w": "suppress", "note": "压制（情感）"}], "nuance": "awaken 比 wake up 正式书面，多用于比喻义（awaken memories/interest/passion 唤起记忆/兴趣/热情）；arouse 可替换 awaken 的「激起情感」义，但 arouse 在「引起（负面关注/怀疑）」上更常用（arouse suspicion），awaken 更专注于正面的「唤醒/觉醒」。", "core": "唤醒——比 awake 更书面的形式，既指字面唤醒，更常用于比喻「激起情感/觉醒」。", "senses": [{"gloss": "v. 唤醒，使醒来", "logic": "字面义，使某人从睡眠中醒来。", "en": "She was awakened by a loud noise outside her window.", "zh": "她被窗外一声巨响惊醒。"}, {"gloss": "v. 激起，唤起（情感/记忆/兴趣）", "logic": "「唤醒」沉睡的情感或意识，比喻义更常见。", "en": "Travelling abroad awakened her interest in foreign languages.", "zh": "出国旅行激起了她对外语的兴趣。"}], "derivatives": [{"w": "awakening", "gloss": "觉醒；唤醒"}, {"w": "reawaken", "gloss": "重新唤醒，再度激起"}]}, {"word": "await", "levels": ["六级"], "ipa": "/əˈweɪt/", "subgroup": "exception", "meaning": "v. 等待，等候（及物，比 wait for 更正式）", "etymology": "a-（处于）+ wait（等，源自古北法语 waitier「守望」，与 watch 同源）。", "roots": [{"part": "a-", "meaning": "处于……状态"}, {"part": "wait", "meaning": "等待、守望"}], "phonetics": "a 弱读 /ə/，重音 -wait /ˈweɪt/，非 /ɔː/。", "examples": [{"en": "A warm welcome awaits every new student.", "zh": "每位新生都会受到热情欢迎。", "source": "造句（await 直接接宾语）"}, {"en": "await sb's decision / reply", "zh": "「等候某人的决定/回复」——正式文书高频搭配。", "source": "高频搭配"}], "synonyms": [{"w": "wait for", "note": "最直接的近义词；区别在于语法：await 直接接宾语（await your reply），wait for 必须加介词（wait for your reply）；await 更正式书面。", "gloss": "等待……（口语，需加介词）"}, {"w": "anticipate", "ipa": "/ænˈtɪsɪpeɪt/", "note": "「期待、预期」，与 await 在「等待某事发生」义上近似，但 anticipate 更强调主动预期和心理准备，await 更被动地等待。", "gloss": "期待，预期（含主动心理准备）"}, {"w": "expect", "ipa": "/ɪkˈspekt/", "note": "「期待、预计」，比 await 口语，且 expect 含有「认为会发生」的判断，await 更纯粹是「等候」，无判断含义。", "gloss": "期待，预计（含判断某事会发生）"}], "antonyms": [{"w": "ignore", "note": "忽视，不等待"}, {"w": "dismiss", "note": "不予理睬"}], "nuance": "await 和 wait for 最关键区别是语法：await 是正式及物动词（a warm welcome awaits you），不加介词；wait for 口语常用（I'm waiting for you）。在正式书面语（信件、公告）中用 await（we await your response），口语中用 wait for。", "core": "守候等待——正式的「等待」，及物动词直接接宾语，常用于书面和正式语境。", "senses": [{"gloss": "v. 等待，等候（及物，正式）", "logic": "核心义，处于等待某人或某事发生的状态，比 wait for 更书面正式。", "en": "A hero's welcome awaited the returning athletes.", "zh": "英雄般的欢迎在等待着归来的运动员们。"}], "derivatives": [{"w": "wait", "gloss": "等待（口语，需加 for）"}, {"w": "awaiting", "gloss": "等待中的（现在分词，常用）"}]}, {"word": "award", "levels": ["六级"], "ipa": "/əˈwɔːrd/", "subgroup": "exception", "meaning": "n. 奖，奖品  v. 授予，判给", "etymology": "古北法语 eswarder「审议后裁定」= es-（出）+ warder（守望、审视，与 ward、guard、regard 同源）。所以 award 本义是「经审视后作出裁决」→ 授予。", "roots": [{"part": "a- (es-)", "meaning": "出、彻底"}, {"part": "ward (guard)", "meaning": "守望、审视"}], "phonetics": "半例外：a 弱读 /ə/，重音在 -ward /ˈwɔːrd/。/ɔː/ 出现在 ward 里，不是在 aw 上。", "tip": "aw 被音节切开：a·ward。真正发 /ɔː/ 的是 -war-（同 warm、war）。", "examples": [{"en": "The committee awarded her first prize for the essay.", "zh": "委员会将论文一等奖授予了她。", "source": "造句"}, {"en": "the Academy Award", "zh": "「奥斯卡金像奖」——award 最著名的用例；award-winning = 获奖的。", "source": "文化用例"}], "synonyms": [{"w": "prize", "ipa": "/praɪz/", "note": "取名词「奖」义，最通用；prize 更强调竞争中获得的奖项（Nobel Prize），award 可以是授予的荣誉（不必经过竞争）；award 也作动词，prize 不作动词。", "gloss": "奖品，奖项（强调竞争获得）"}, {"w": "grant", "ipa": "/ɡrɑːnt/", "note": "取动词「授予」义，侧重授予权利/资格/资金（grant a scholarship 授予奖学金），比 award 更正式，且 grant 的宾语常是权利或资金，award 常是奖项或赔偿。", "gloss": "授予（权利/资金）；拨款"}, {"w": "bestow", "ipa": "/bɪˈstəʊ/", "note": "「授予、赐予」，比 award 更正式文学化，带有庄重的仪式感；bestow an honour upon sb 比 award an honour 更隆重。", "gloss": "赐予，授予（最庄重正式）"}, {"w": "confer", "ipa": "/kənˈfɜːr/", "note": "「授予（学位/头衔/荣誉）」，正式书面词；confer a degree 比 award a degree 更学术正式，多用于大学典礼语境。", "gloss": "授予（学位/头衔，学术正式）"}], "antonyms": [{"w": "revoke", "note": "撤销（奖项/权利）"}, {"w": "strip of", "note": "剥夺（奖项/头衔）"}], "nuance": "award 兼作名词（an award 奖项）和动词（to award sb sth 授予某人某物），是最通用的词；bestow 和 confer 更正式庄重，多用于典礼和正式文件；grant 侧重授予权利/资金类，不常用于竞赛奖项。", "core": "经审视后作出的裁决——原义是「审视后裁定」，引申为正式授予奖项或赔偿。", "senses": [{"gloss": "n. 奖，奖品，奖项", "logic": "审视裁定后给予的荣誉或奖励。", "en": "She received an award for outstanding contribution to medical research.", "zh": "她因在医学研究方面的杰出贡献而获奖。"}, {"gloss": "v. 授予，颁发；判给（赔偿）", "logic": "将经审视裁定的奖项或赔偿正式给予某人。", "en": "The court awarded the plaintiff two million dollars in damages.", "zh": "法院判给原告两百万美元的赔偿金。"}], "derivatives": [{"w": "award-winning", "gloss": "获奖的"}, {"w": "awardee", "gloss": "获奖者"}, {"w": "awards ceremony", "gloss": "颁奖典礼"}]}, {"word": "awry", "levels": ["六级", "GRE拓展"], "ipa": "/əˈraɪ/", "subgroup": "exception", "meaning": "adv./adj. 出差错地；歪斜地", "etymology": "a-（处于）+ wry（扭曲的；古英语 wrigian「扭转」，与 wriggle 蠕动、wrist 手腕同源）。字面「处于扭曲状态」→ 歪了、出岔子了。", "roots": [{"part": "a-", "meaning": "处于……状态"}, {"part": "wry", "meaning": "扭曲、歪（w 不发音）"}], "phonetics": "双重陷阱！wry 里 w 不发音 = /raɪ/，所以 awry 读 /əˈraɪ/（әˈ瑞），绝不是「奥瑞」。", "tip": "wr- 开头 w 一律沉默：wry / write / wrong / wrist / wrap。", "examples": [{"en": "Their carefully laid plans went awry at the last minute.", "zh": "他们精心制定的计划在最后关头出了岔子。", "source": "造句（go awry）"}, {"en": "The best-laid plans of mice and men often go awry.", "zh": "「即便最周密的计划也常会出错。」——出自彭斯诗《致老鼠》，斯坦贝克《人鼠之间》书名即源于此。", "source": "名著（彭斯 / 斯坦贝克）"}], "synonyms": [{"w": "wrong", "ipa": "/rɒŋ/", "note": "取 awry「出差错」义，最口语直白（go wrong = go awry）；awry 更书面优雅，且含「偏离原定方向」的方向感；wrong 更口语中性。", "gloss": "错误的；出差错（最口语）"}, {"w": "amiss", "ipa": "/əˈmɪs/", "note": "「有差错地，不对头地」，与 awry 几乎同义；两者均常与 go 搭配（go awry / go amiss），amiss 更常用于「something is amiss」（有什么不对劲）。", "gloss": "有差错地，不对头（something is amiss）"}, {"w": "astray", "ipa": "/əˈstreɪ/", "note": "「迷路的，出轨的」，与 awry 的「偏离」义近义；go astray 侧重「偏离正途」（道德/方向），go awry 更侧重「计划出岔子」。", "gloss": "迷途的，偏离正轨的"}, {"w": "crooked", "ipa": "/ˈkrʊkɪd/", "note": "取 awry「歪斜」义的近义词，比 awry 更口语直白（your tie is crooked 你领带歪了）；awry 在「歪斜」义上更文学。", "gloss": "歪斜的，弯曲的（口语直白）"}], "antonyms": [{"w": "on track", "note": "在正轨上，顺利进行"}, {"w": "straight", "note": "笔直的，不偏的"}], "nuance": "awry 最常见于 go awry（计划出岔子）；amiss 最常见于 something seems amiss（感觉有什么不对）；astray 偏向「道德/方向偏离」（lead sb astray 把人带坏）；三词都含「偏离正常」的核心义，但使用场景有细微差别。awry 带有文学色彩，the best-laid plans often go awry 是名句。", "core": "处于扭曲状态——字面是「歪斜」，最常见于 go awry（计划出岔子），带有文学色彩。", "senses": [{"gloss": "adv./adj. 出差错，出岔子（go awry）", "logic": "「扭曲偏离」引申为计划偏离预期轨道，出现问题。", "en": "Despite careful preparation, everything went awry on the day.", "zh": "尽管准备周全，当天一切还是出了岔子。"}, {"gloss": "adv./adj. 歪斜，不正", "logic": "字面义，物体偏离正确方向，不端正。", "en": "His tie was awry and his shirt untucked.", "zh": "他的领带歪着，衬衫也没塞进裤腰。"}], "derivatives": [{"w": "wry", "gloss": "扭曲的；（笑容）苦涩带讽的"}, {"w": "wryly", "gloss": "带着苦涩讽刺地"}]}]}</script>
<script>
const G = JSON.parse(document.getElementById('data').textContent);
const KEY = 'vocab-unfam-' + G.id;
let unfam = new Set(JSON.parse(localStorage.getItem(KEY) || '[]'));
let curLv = '全部', curSg = '全部', curQ = '', onlyUnfam = false;

const LVCLASS = {'六级':'lv6','托福':'tfl','GRE拓展':'gre','基础':'','口语':'spk','场景':'scn'};
// 发音分组配色（按 subgroups 顺序循环取用）
const SGCOLORS = ['#2f8f83','#b0603f','#6a52a8','#c1662f','#3a7bd5'];
const SUBG = G.subgroups || [];
function sgIndex(key){ const i=SUBG.findIndex(s=>s.key===key); return i<0?0:i; }
function sgColor(key){ return SGCOLORS[sgIndex(key)%SGCOLORS.length]; }
function sgOf(key){ return SUBG.find(s=>s.key===key); }

// ---------- header
function renderHero(){
  const h = document.getElementById('hero');
  const rules = SUBG.map((s,i)=>{
    const c = SGCOLORS[i%SGCOLORS.length];
    return `<div class="rule" style="border-left:5px solid ${c}"><b style="color:${c}">${s.label}</b>${s.desc||''}</div>`;
  }).join('');
  const rhymes = (G.rhymeChains && G.rhymeChains.length)
    ? `<div class="rhymes"><h3>🎵 同韵顺口溜 · 点单词听发音，成串背最快</h3>${
        G.rhymeChains.map(c=>`<div class="chain"><span class="lab">${c.label}</span>${
          c.words.map(w=>`<span class="chip" onclick="say('${w}')">${w}</span>`).join('')
        }</div>`).join('')}</div>`
    : '';
  h.innerHTML = `
    <div class="combo"><span class="big">${G.combo}</span><span class="snd">${G.sound}</span></div>
    <h1>${G.title} · ${G.subtitle||''}</h1>
    <p class="intro">${G.intro}</p>
    <div class="rules">${rules}</div>
    ${rhymes}`;
}

// ---------- 精读：文章 + 句法分析
let speaking=false;
function sayPassage(btn){
  if(speaking){ speechSynthesis.cancel(); speaking=false; if(btn) btn.textContent='🔊 朗读全文'; return; }
  const P = G.passage; if(!P) return;
  const texts = (P.paragraphs||[]).map(p=>p.en).filter(Boolean);
  if(!texts.length) return;
  if(!VOICE) pickVoice();
  speaking=true; if(btn) btn.textContent='⏹ 停止朗读';
  let last=null;
  texts.forEach((t,i)=>{
    const u = new SpeechSynthesisUtterance(t);
    u.lang='en-US'; if(VOICE) u.voice=VOICE; u.rate=.95; u.pitch=1.0;
    if(i===texts.length-1) last=u;
    speechSynthesis.speak(u);
  });
  if(last) last.onend=()=>{ speaking=false; if(btn) btn.textContent='🔊 朗读全文'; };
}
function renderPassage(){
  const el = document.getElementById('passage');
  const P = G.passage; if(!P){ el.style.display='none'; return; }
  const paras = (P.paragraphs||[]).map(p=>{
    let en = p.en||'';
    // 高亮关键词（p.kws 或自动匹配词表词）
    const kws = p.kws || [];
    kws.forEach(k=>{ en = en.replace(new RegExp('('+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'), '<span class="kw" onclick="say(\'$1\')">$1</span>'); });
    return `<p><div class="en">${en}</div>${p.zh?`<div class="zh">${p.zh}</div>`:''}</p>`;
  }).join('');
  el.innerHTML = `<div class="passage"><h2>📖 精读原文</h2>
    <div class="p-title">${P.title||''} <button class="readall" onclick="sayPassage(this)">🔊 朗读全文</button></div>
    ${paras}</div>`;
}
const ROLECOLOR = { '主语':'#2f8f83','谓语':'#c1662f','宾语':'#3a7bd5','状语':'#6a52a8','定语':'#b0603f','补语':'#c1662f','从句':'#8c8072','连词':'#8c8072','介词':'#8c8072','插入语':'#8c8072','同位语':'#b0603f' };
function roleColor(r){ return ROLECOLOR[r] || '#6a52a8'; }
function escAttr(s){ return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
// 句子内括号标注：介词短语 ( ) · 从句 [ ] · 非谓语 { }
const BRK = {'pp':['(',')'], 'cl':['[',']'], 'nf':['{','}']};
const BRKC = {'pp':'#6a52a8', 'cl':'#3a7bd5', 'nf':'#b0603f'};
function renderFlow(s){
  let html='';
  (s.flow||[]).forEach(it=>{
    if(it.open){ const k=it.open; html+=`<span class="brkbox" style="background:${BRKC[k]}16;border-bottom:2px solid ${BRKC[k]}66"><b class="brk" style="color:${BRKC[k]}">${BRK[k][0]}</b>`; }
    else if(it.close){ const k=it.close; html+=`<b class="brk" style="color:${BRKC[k]}">${BRK[k][1]}</b></span>`; }
    else { html+=escAttr(it.t); }
  });
  return html;
}
function renderSents(){
  const el = document.getElementById('sents');
  const S = G.sentences; if(!S || !S.length){ el.style.display='none'; return; }
  const items = S.map((s,i)=>{
    const flowHtml = (s.flow && s.flow.length) ? renderFlow(s) : escAttr(s.en);
    const parts = (s.parts||[]).map(p=>{
      const c = roleColor(p.r);
      return `<span class="spart" style="background:${c}18;border:1px solid ${c}55">
        <span class="st" style="color:${c}">${escAttr(p.t)}</span>
        <span class="sr" style="background:${c}">${p.r}</span>
        ${p.n?`<span class="sn">${p.n}</span>`:''}</span>`;
    }).join('');
    return `<div class="sent">
      <div class="s-flow" data-en="${escAttr(s.en)}" onclick="say(this.dataset.en)" title="点句子朗读">${flowHtml} <button class="say-mini" data-en="${escAttr(s.en)}" onclick="event.stopPropagation();say(this.dataset.en)" title="朗读">🔊</button></div>
      ${s.zh?`<div class="s-zh">${s.zh}</div>`:''}
      <div class="s-parts">${parts}</div>
      ${s.note?`<div class="snotes">${s.note}</div>`:''}</div>`;
  }).join('');
  el.innerHTML = `<div class="sents"><h2>🔍 长难句 · 句法分析</h2>
    <div class="s-sub">点英文句可朗读 · 括号标注：<b style="color:#6a52a8">( ) 介词短语</b> · <b style="color:#3a7bd5">[ ] 从句</b> · <b style="color:#b0603f">{ } 非谓语动词</b> · 下方色块=成分功能</div>
    ${items}</div>`;
}

// ---------- filters
function renderFilters(){
  const lvs = ['全部','六级','托福','GRE拓展','基础'];
  document.getElementById('lvf').innerHTML = lvs.map(l=>
    `<span class="f${l===curLv?' on':''}" onclick="setLv('${l}')">${l}</span>`).join('');
  const sgs = [['全部','全部'], ...SUBG.map(s=>[s.tag||s.label, s.key])];
  document.getElementById('sgf').innerHTML = sgs.map(([t,v])=>
    `<span class="f${v===curSg?' on':''}" onclick="setSg('${v}')">${t}</span>`).join('');
}
function setLv(l){curLv=l;renderFilters();renderGrid();}
function setSg(s){curSg=s;renderFilters();renderGrid();}

// ---------- speech：优先自然美式女声
let VOICE=null, VOICES=[];
// 各浏览器/系统里公认自然的美式女声，按优先级排序
const PREF=[
  'Google US English',                 // Chrome：自然女声
  'Microsoft Aria Online (Natural) - English (United States)',
  'Microsoft Jenny Online (Natural) - English (United States)',
  'Microsoft Ava Online (Natural) - English (United States)',
  'Microsoft Aria','Microsoft Jenny','Microsoft Michelle',
  'Ava (Premium)','Ava (Enhanced)','Ava',   // macOS Siri 女声
  'Samantha',                          // macOS 经典美式女声
  'Allison','Susan','Nicky','Zoe','Karen','Victoria'
];
const MALE=/(alex|daniel|fred|tom|david|mark|male|aaron|arthur|gordon|oliver|rishi|junior|ralph)/i;
function usPool(){
  VOICES = speechSynthesis.getVoices()||[];
  let us = VOICES.filter(v=>/en[-_]US/i.test(v.lang)||/United States/i.test(v.name));
  if(!us.length) us = VOICES.filter(v=>/^en/i.test(v.lang));
  return us;
}
function pickVoice(){
  const pool=usPool(); if(!pool.length) return;
  VOICE=null;
  for(const n of PREF){ const h=pool.find(v=>v.name===n)||pool.find(v=>v.name.indexOf(n)===0); if(h){VOICE=h;break;} }
  if(!VOICE) VOICE = pool.find(v=>/(samantha|ava|allison|susan|nicky|zoe|karen|victoria|aria|jenny|michelle|female|google us)/i.test(v.name))
                   || pool.find(v=>!MALE.test(v.name)) || pool[0];
  fillVoiceSel(pool);
}
function fillVoiceSel(pool){
  const s=document.getElementById('voiceSel'); if(!s) return;
  s.innerHTML = pool.map(v=>{
    const nm=v.name.replace(/ - English.*/,'').replace(/Online \(Natural\)/,'✨');
    return `<option value="${v.name}"${VOICE&&v.name===VOICE.name?' selected':''}>🎙 ${nm}</option>`;
  }).join('');
}
document.getElementById('voiceSel').addEventListener('change',e=>{
  VOICE = VOICES.find(v=>v.name===e.target.value)||VOICE; say(G.combo==='aw'?'awesome':'natural');
});
if('onvoiceschanged' in speechSynthesis) speechSynthesis.onvoiceschanged = pickVoice;
pickVoice();
function say(w){
  try{
    if(!VOICE) pickVoice();
    const u = new SpeechSynthesisUtterance(w);
    u.lang='en-US'; if(VOICE) u.voice=VOICE; u.rate=.95; u.pitch=1.0;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }catch(e){}
}

// 高亮单词里的目标拼写：优先用该词自带的 hl（音位页里每词各自的拼写），否则用组的 combo
function hlWord(word, spell){
  const c = (spell||'').replace(/[.*+?^${}()|[\]\\\/·\s]/g,'');  // 只取干净字母做高亮，去掉 / · 空格等
  if(!c) return word;
  try{ return word.replace(new RegExp('('+c+')','i'), '<span class="hl">$1</span>'); }
  catch(e){ return word; }
}

// ---------- card
function card(w){
  const tags = (w.levels||[]).map(l=>`<span class="tag ${LVCLASS[l]||''}">${l}</span>`).join('');
  const roots = (w.roots||[]).map(r=>`<span class="root"><b>${r.part}</b> ${r.meaning}</span>`).join('');
  const exs = (w.examples||[]).map(e=>{
    const fam = /造句/.test(e.source)? '' : ' famous';
    return `<div class="ex${fam}"><div class="en">${e.en}</div><div class="zh">${e.zh}</div><span class="src">— ${e.source}</span></div>`;
  }).join('');
  const syns = (w.synonyms||[]).map(s=>
    `<div class="lex"><b class="lw" onclick="event.stopPropagation();say('${s.w}')">${s.w}</b>`+
    `${s.ipa?` <span class="lip">${s.ipa}</span>`:''}${s.note?` <span class="ln">— ${s.note}</span>`:''}</div>`).join('');
  const ants = (w.antonyms||[]).map(a=>
    `<span class="antchip" onclick="event.stopPropagation();say('${a.w}')">${a.w}${a.note?` <i>${a.note}</i>`:''}</span>`).join('');
  const lexSec = (syns||ants||w.nuance)
    ? `<div class="sec"><span class="l">🔗 近义词辨析 · 反义词</span>`+
      `${syns?`<div class="lexgroup"><span class="lextag syn">近义</span><div class="lexlist">${syns}</div></div>`:''}`+
      `${ants?`<div class="lexgroup"><span class="lextag ant">反义</span><div class="lexlist antline">${ants}</div></div>`:''}`+
      `${w.nuance?`<div class="nuance">🎯 ${w.nuance}</div>`:''}</div>`
    : '';
  const senses = (w.senses||[]).map(s=>
    `<div class="sense"><div class="s-gloss"><b>${s.gloss}</b>${s.logic?` <span class="s-logic">← ${s.logic}</span>`:''}</div>`+
    `${s.en?`<div class="s-ex"><span class="s-en">${s.en}</span> <span class="s-zh">${s.zh||''}</span></div>`:''}</div>`).join('');
  const senseSec = (w.core||senses)
    ? `<div class="sec"><span class="l">🧠 一词多义 · 核心意象串解</span>`+
      `${w.core?`<div class="coreimg">🎯 核心感觉：${w.core}</div>`:''}${senses}</div>`
    : '';
  const isU = unfam.has(w.word);
  const so = sgOf(w.subgroup);
  return `<div class="card${isU?' unfamiliar':''}" data-w="${w.word}" onclick="if(document.body.classList.contains('mem'))this.classList.toggle('reveal')">
    <span class="sub-tag" style="background:${sgColor(w.subgroup)}">${so?(so.tag||so.label):''}</span>
    <div class="whead">
      <span class="word">${hlWord(w.word, w.hl || G.combo)}</span>
      <span class="ipa">${w.ipa}</span>
      <button class="say" onclick="event.stopPropagation();say('${w.word}')" title="朗读">🔊</button>
    </div>
    <div class="tags">${tags}</div>
    <div class="mean">${w.meaning}</div>
    ${senseSec}
    ${w.etymology?`<div class="sec"><span class="l">🏛 造词来源 · 词源故事</span>${w.etymology}</div>`:''}
    ${roots?`<div class="sec"><span class="l">🧩 词根词缀</span><div class="roots">${roots}</div></div>`:''}
    ${w.phonetics?`<div class="sec"><span class="l">🗣 发音规律</span>${w.phonetics}</div>`:''}
    ${w.tip?`<div class="sec"><span class="l">💡 记忆钩子</span><div class="tip">${w.tip}</div></div>`:''}
    ${exs?`<div class="sec"><span class="l">✍️ 造句 · 名著/影视例句</span>${exs}</div>`:''}
    ${lexSec}
    <label class="check" onclick="event.stopPropagation()">
      <input type="checkbox" ${isU?'checked':''} onchange="toggleUnfam('${w.word}',this.checked)"> 🔺 标记不熟悉
    </label>
  </div>`;
}

function match(w){
  if(onlyUnfam && !unfam.has(w.word)) return false;
  if(curLv!=='全部' && !(w.levels||[]).includes(curLv)) return false;
  if(curSg!=='全部' && w.subgroup!==curSg) return false;
  if(curQ){
    const s=(w.word+' '+w.meaning).toLowerCase();
    if(!s.includes(curQ.toLowerCase())) return false;
  }
  return true;
}

function renderGrid(){
  const list = G.words.filter(match);
  // 不熟悉的置顶（稳定排序，保持各自原有相对顺序）
  list.sort((a,b)=>(unfam.has(b.word)?1:0)-(unfam.has(a.word)?1:0));
  const g = document.getElementById('grid');
  g.innerHTML = list.length? list.map(card).join('') : '<div class="empty">没有匹配的单词，换个筛选试试～</div>';
  updateUnfamCount();
}

function toggleUnfam(word, on){
  if(on) unfam.add(word); else unfam.delete(word);
  localStorage.setItem(KEY, JSON.stringify([...unfam]));
  const c = document.querySelector(`.card[data-w="${word}"]`);
  if(c) c.classList.toggle('unfamiliar', on);   // 立即变色，卡片原位不跳动；置顶在下次渲染/筛选时生效
  updateUnfamCount();
}
function updateUnfamCount(){
  const n = G.words.filter(w=>unfam.has(w.word)).length;
  const el = document.getElementById('unfamN');
  if(el) el.textContent = n;
}

document.getElementById('q').addEventListener('input',e=>{curQ=e.target.value;renderGrid();});
document.getElementById('unfamBtn').addEventListener('click',e=>{
  onlyUnfam=!onlyUnfam;
  e.currentTarget.classList.toggle('on',onlyUnfam);
  renderGrid();
});
document.getElementById('memBtn').addEventListener('click',e=>{
  document.body.classList.toggle('mem');
  e.target.classList.toggle('on');
  e.target.textContent = document.body.classList.contains('mem')?'🧠 记忆模式(开)·悬停显形':'🧠 记忆模式';
});

// ---------- 测验：英文 → 中文四选一（覆盖当前筛选到的全部单词）
let quiz=null;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
// 测验池 = 本页(筛选后)全部词 + 它们的同义词 + 衍生词（去重）
function quizPool(){
  const base = G.words.filter(match);
  const items=[]; const seen=new Set();
  const add=(word,ipa,meaning)=>{const k=(word||'').toLowerCase();
    if(!word||!meaning||seen.has(k))return; seen.add(k); items.push({word,ipa:ipa||'',meaning});};
  base.forEach(w=>{
    add(w.word,w.ipa,w.meaning);
    (w.synonyms||[]).forEach(s=>add(s.w,s.ipa,s.gloss||s.note));
    (w.derivatives||[]).forEach(dv=>add(dv.w,dv.ipa,dv.gloss||dv.note));
  });
  return items;
}
function startQuiz(src){
  const pool = src || quizPool();
  if(pool.length<4){ alert('至少要有 4 个词才能测验，请先放宽上方筛选～'); return; }
  quiz={list:shuffle(pool), i:0, score:0, wrong:[], done:false, next:null, pool:quizPool()};
  document.getElementById('quizOv').style.display='flex';
  renderQ();
}
function renderQ(){
  quiz.done=false; quiz.next=null;
  const q=quiz.list[quiz.i];
  const others=(quiz.pool||[]).filter(w=>w.meaning!==q.meaning);
  const opts=shuffle([q.meaning, ...shuffle(others).slice(0,3).map(w=>w.meaning)]);
  const K=['1','2','3','4'];
  document.getElementById('qbox').innerHTML=`
    <div class="qtop"><span>第 ${quiz.i+1} / ${quiz.list.length} 题 · 已答对 ${quiz.score}</span>
      <span style="cursor:pointer" onclick="closeQuiz()">✕ 关闭</span></div>
    <div class="qbar2"><i style="width:${quiz.i/quiz.list.length*100}%"></i></div>
    <div class="qword">${q.word} <button class="say" style="vertical-align:middle;width:30px;height:30px;font-size:14px" onclick="say('${q.word}')">🔊</button></div>
    <div class="qipa">${q.ipa}</div>
    <div class="qopts" id="qopts">${opts.map((o,k)=>
      `<button class="qopt" data-m="${encodeURIComponent(o)}" onclick="answer(this,'${encodeURIComponent(q.meaning)}')">
        <span class="k">${K[k]}</span><span>${o}</span></button>`).join('')}</div>
    <div class="hint">按 1–4 键作答 · 回车进入下一题</div>`;
  say(q.word);
}
function answer(el, correctEnc){
  if(quiz.done) return; quiz.done=true;
  const correct=decodeURIComponent(correctEnc);
  const chosen=decodeURIComponent(el.dataset.m);
  if(chosen===correct) quiz.score++; else quiz.wrong.push(quiz.list[quiz.i]);
  document.querySelectorAll('#qopts .qopt').forEach(b=>{
    const m=decodeURIComponent(b.dataset.m);
    if(m===correct) b.classList.add('right');
    else if(b===el) b.classList.add('wrong');
    else b.classList.add('dim');
    b.style.pointerEvents='none';
  });
  const btn=document.createElement('button');
  btn.className='qnext';
  btn.textContent = quiz.i<quiz.list.length-1 ? '下一题 →' : '看结果 →';
  btn.onclick=nextQ;
  document.getElementById('qbox').appendChild(btn);
  quiz.next=btn;
}
function nextQ(){
  if(quiz.i<quiz.list.length-1){ quiz.i++; renderQ(); } else endQuiz();
}
function endQuiz(){
  const tot=quiz.list.length, pct=Math.round(quiz.score/tot*100);
  const wrongHtml = quiz.wrong.length
    ? quiz.wrong.map(w=>`<div class="r"><b>${w.word}</b> ${w.ipa} — ${w.meaning}</div>`).join('')
    : '<div class="r">全部答对，太强了！🎉</div>';
  const wrongCopy = quiz.wrong.slice();
  document.getElementById('qbox').innerHTML=`
    <div class="qend">
      <div class="qtop" style="justify-content:flex-end"><span style="cursor:pointer" onclick="closeQuiz()">✕ 关闭</span></div>
      <div>本轮得分</div><div class="qscore">${quiz.score}/${tot}</div>
      <div style="color:var(--muted)">正确率 ${pct}%</div>
      <div class="qwrong"><div style="color:var(--exc);font-weight:700;margin-bottom:4px">错题（${quiz.wrong.length}）</div>${wrongHtml}</div>
      <div id="qendBtns"></div>
    </div>`;
  const box=document.getElementById('qendBtns');
  if(wrongCopy.length){
    const b1=document.createElement('button'); b1.className='qnext'; b1.textContent='只测这些错题';
    b1.onclick=()=>startQuiz(wrongCopy); box.appendChild(b1);
  }
  const b2=document.createElement('button'); b2.className='qnext';
  b2.style.cssText='background:#fff;color:var(--accent);border:1.5px solid var(--accent);margin-top:8px';
  b2.textContent='再来一轮（当前筛选）'; b2.onclick=()=>startQuiz(); box.appendChild(b2);
}
function closeQuiz(){ document.getElementById('quizOv').style.display='none'; quiz=null; }
document.getElementById('quizBtn').addEventListener('click',()=>startQuiz());
document.getElementById('quizOv').addEventListener('click',e=>{ if(e.target.id==='quizOv') closeQuiz(); });
document.addEventListener('keydown',e=>{
  if(!quiz || document.getElementById('quizOv').style.display==='none') return;
  if(quiz.next && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); quiz.next.click(); return; }
  if(!quiz.done && /^[1-4]$/.test(e.key)){ const b=document.querySelectorAll('#qopts .qopt')[+e.key-1]; if(b) b.click(); }
});

document.getElementById('foot').innerHTML =
  `共 ${G.words.length} 词 · 数据源：托福 4264 词表（真实词库）+ 六级核心词 · `+
  `发音由浏览器语音合成朗读 · 名著/影视例句均为真实出处，「造句」为学习例句，「高频搭配」为常用短语。`;

renderHero(); renderPassage(); renderSents(); renderFilters(); renderGrid();
</script>
