<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>/ɜː/ 中央长音家族 · 单词拆解卡片</title>
<style>
  :root{
    --bg:#f7f1e7; --card:#fffdf8; --ink:#2f2a24; --muted:#8c8072;
    --line:#eaddc9; --accent:#c1662f; --accent2:#e0913c; --amber:#fbe6c4;
    --core:#2f8f83; --exc:#b0603f; --ok:#4a9a5e;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,"PingFang SC","Helvetica Neue",Segoe UI,sans-serif;
    line-height:1.6;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1180px;margin:0 auto;padding:26px 20px 90px}
  a{color:var(--accent);text-decoration:none}
  .top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
  .top a{color:var(--muted)}
  /* header */
  header.hero{margin:14px 0 22px}
  .combo{display:inline-flex;align-items:baseline;gap:14px}
  .combo .big{font-family:Georgia,"Times New Roman",serif;font-size:60px;font-weight:700;
    background:var(--amber);color:var(--accent);padding:2px 20px;border-radius:18px;line-height:1.1}
  .combo .snd{font-size:30px;color:var(--core);font-weight:700}
  h1{font-size:23px;margin:14px 0 4px}
  .intro{color:#5f574c;max-width:860px;font-size:15px}
  /* rule cards */
  .rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin:18px 0}
  .rule{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:14px}
  .rule.core{border-left:5px solid var(--core)}
  .rule.exc{border-left:5px solid var(--exc)}
  .rule b{display:block;margin-bottom:4px;font-size:14px}
  .rule.core b{color:var(--core)} .rule.exc b{color:var(--exc)}
  /* rhyme chains */
  .rhymes{background:linear-gradient(135deg,#fff6e8,#fdeede);border:1px dashed var(--accent2);
    border-radius:14px;padding:14px 16px;margin-bottom:20px}
  .rhymes h3{margin:0 0 8px;font-size:15px;color:var(--accent)}
  .chain{margin:6px 0;font-size:14px}
  .chain .lab{color:var(--muted);margin-right:8px}
  .chip{display:inline-block;background:#fff;border:1px solid var(--line);border-radius:20px;
    padding:2px 11px;margin:3px 4px 3px 0;cursor:pointer;font-family:Georgia,serif;font-size:15px;transition:.15s}
  .chip:hover{background:var(--amber);border-color:var(--accent2)}
  /* toolbar */
  .toolbar{position:sticky;top:0;z-index:20;background:rgba(247,241,231,.94);backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);padding:12px 0;margin-bottom:18px;
    display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .search{flex:1;min-width:180px;padding:8px 13px;border:1px solid var(--line);border-radius:10px;
    font-size:14px;background:#fff}
  .filters{display:flex;flex-wrap:wrap;gap:6px}
  .f{padding:6px 12px;border:1px solid var(--line);background:#fff;border-radius:20px;font-size:13px;
    cursor:pointer;color:#6b6154;transition:.15s}
  .f.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  select.f{max-width:170px;color:#6b6154;cursor:pointer}
  .btn{padding:7px 14px;border:1px solid var(--accent);background:#fff;color:var(--accent);
    border-radius:20px;font-size:13px;cursor:pointer;font-weight:600}
  .btn.on{background:var(--accent);color:#fff}
  .prog{font-size:13px;color:var(--muted);white-space:nowrap}
  .bar{height:6px;background:var(--line);border-radius:6px;width:120px;overflow:hidden;display:inline-block;vertical-align:middle}
  .bar>i{display:block;height:100%;background:var(--ok);width:0}
  /* cards */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 17px;
    box-shadow:0 2px 10px rgba(150,120,70,.06);display:flex;flex-direction:column;gap:10px;position:relative}
  .card.unfamiliar{border-color:#e08a3c;background:#fff7ec;box-shadow:0 2px 14px rgba(210,120,40,.20)}
  .card .sub-tag{position:absolute;top:0;right:16px;transform:translateY(-50%);
    font-size:11px;padding:2px 9px;border-radius:10px;color:#fff}
  .sub-core{background:var(--core)} .sub-exc{background:var(--exc)}
  .whead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .word{font-family:Georgia,"Times New Roman",serif;font-size:30px;font-weight:700;letter-spacing:.5px}
  .word .hl{background:var(--amber);color:var(--accent);border-radius:6px;padding:0 3px}
  .ipa{color:var(--core);font-size:16px;font-weight:600}
  .say{margin-left:auto;border:none;background:var(--amber);color:var(--accent);border-radius:50%;
    width:34px;height:34px;font-size:16px;cursor:pointer;flex:none}
  .say:hover{background:var(--accent2);color:#fff}
  .tags{display:flex;gap:5px;flex-wrap:wrap}
  .tag{font-size:11px;padding:1px 8px;border-radius:9px;background:#f0e7d6;color:#8a6a3c}
  .tag.lv6{background:#e6f0ec;color:#2f8f83}
  .tag.tfl{background:#eae6f5;color:#6a52a8}
  .tag.gre{background:#f7e6ea;color:#b0507a}
  .mean{font-size:15.5px;font-weight:600;color:#3a332b}
  .sec{font-size:13.5px;color:#4d463c;border-top:1px dashed var(--line);padding-top:8px}
  .sec .l{font-size:11.5px;color:var(--accent);font-weight:700;letter-spacing:.5px;display:block;margin-bottom:2px}
  .roots{display:flex;flex-wrap:wrap;gap:6px}
  .root{background:#f6efe1;border-radius:8px;padding:3px 9px;font-size:12.5px}
  .root b{font-family:Georgia,serif;color:var(--accent)}
  .tip{background:#fff6e8;border-left:3px solid var(--accent2);padding:5px 10px;border-radius:0 8px 8px 0;font-size:13px}
  /* 一词多义 · 核心意象 */
  .coreimg{background:#f4f0e5;border-radius:8px;padding:6px 10px;font-size:13.5px;color:#5a4a2e;margin-bottom:7px}
  .sense{border-left:3px solid var(--accent2);padding:3px 0 3px 10px;margin:6px 0}
  .sense .s-gloss{font-size:14px}
  .sense .s-gloss b{color:#3a332b}
  .sense .s-logic{color:var(--accent);font-size:12.5px}
  .sense .s-ex{margin-top:2px;font-size:13px}
  .sense .s-en{font-family:Georgia,serif;color:#2f2a24}
  .sense .s-zh{color:#6b6154}
  .ex{margin:7px 0}
  .ex .en{font-family:Georgia,serif;font-size:14px;color:#2f2a24}
  .ex .zh{color:#6b6154;font-size:13px}
  .ex .src{display:inline-block;font-size:11px;color:#a89a86;margin-top:1px}
  .ex.famous{background:#fbf4e7;border-radius:8px;padding:7px 10px}
  /* 近义词辨析 / 反义词 */
  .lexgroup{display:flex;gap:8px;margin:4px 0;align-items:flex-start}
  .lextag{flex:none;font-size:11px;font-weight:700;padding:1px 8px;border-radius:8px;margin-top:3px}
  .lextag.syn{background:#e6f0ec;color:#2f8f83}
  .lextag.ant{background:#f7e6ea;color:#b0507a}
  .lexlist{display:flex;flex-direction:column;gap:3px;font-size:13.5px;flex:1}
  .lexlist.antline{flex-direction:row;flex-wrap:wrap;gap:6px;align-items:center}
  .lex .lw{font-family:Georgia,serif;color:var(--accent);cursor:pointer;font-weight:600}
  .lex .lw:hover{text-decoration:underline}
  .lex .lip{color:var(--core);font-size:12px}
  .lex .ln{color:#5f574c}
  .antchip{background:#faf0f2;border-radius:8px;padding:2px 9px;cursor:pointer;font-family:Georgia,serif;font-size:13px;color:#b0507a}
  .antchip:hover{background:#f6e3e8}
  .antchip i{font-style:normal;color:#9a8f86;font-size:12px}
  .nuance{background:#eef6f3;border-left:3px solid var(--core);padding:6px 10px;border-radius:0 8px 8px 0;font-size:13px;margin-top:7px;color:#33463f}
  /* memorize mode hides meaning+detail until hover/click */
  body.mem .mean, body.mem .sec{filter:blur(5px);transition:.15s;cursor:pointer}
  body.mem .card:hover .mean, body.mem .card.reveal .mean,
  body.mem .card:hover .sec, body.mem .card.reveal .sec{filter:none}
  .check{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer;margin-top:2px}
  .check input{width:16px;height:16px;accent-color:#c1662f}
  .card.unfamiliar .check{color:#c1662f;font-weight:600}
  .empty{text-align:center;color:var(--muted);padding:40px;grid-column:1/-1}
  footer{margin-top:36px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
  /* 测验 */
  #quizOv{display:none;position:fixed;inset:0;background:rgba(47,42,36,.55);z-index:50;
    align-items:center;justify-content:center;padding:18px}
  .qbox{background:var(--card);border-radius:20px;max-width:560px;width:100%;padding:22px 24px 20px;
    box-shadow:0 24px 70px rgba(0,0,0,.32);max-height:92vh;overflow:auto}
  .qtop{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px;margin-bottom:8px}
  .qbar2{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:16px}
  .qbar2>i{display:block;height:100%;background:var(--accent);width:0;transition:.3s}
  .qword{font-family:Georgia,serif;font-size:40px;font-weight:700;text-align:center;margin:4px 0 2px}
  .qipa{text-align:center;color:var(--core);font-size:16px;margin-bottom:16px}
  .qopts{display:grid;gap:10px}
  .qopt{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:11px 14px;font-size:14.5px;
    cursor:pointer;text-align:left;transition:.12s;display:flex;gap:10px;align-items:flex-start;font-family:inherit;color:var(--ink)}
  .qopt:hover{border-color:var(--accent2);background:#fffaf0}
  .qopt .k{font-weight:700;color:var(--accent);flex:none}
  .qopt.right{border-color:var(--ok);background:#eafaef}
  .qopt.wrong{border-color:var(--exc);background:#fdeeea}
  .qopt.dim{opacity:.45}
  .qnext{margin-top:14px;width:100%;padding:12px;border:none;border-radius:12px;background:var(--accent);
    color:#fff;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
  .qend{text-align:center}
  .qscore{font-size:46px;font-weight:800;color:var(--accent);margin:4px 0}
  .qwrong{text-align:left;margin:14px 0;max-height:34vh;overflow:auto}
  .qwrong .r{border-top:1px dashed var(--line);padding:7px 0;font-size:14px}
  .qwrong .r b{font-family:Georgia,serif;color:var(--exc)}
  .hint{text-align:center;color:var(--muted);font-size:12px;margin-top:10px}
  /* 精读 · 文章 + 句法分析 */
  .passage{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--accent);
    border-radius:14px;padding:18px 20px;margin:0 0 22px}
  .passage h2{margin:0 0 10px;font-size:18px;color:var(--accent)}
  .passage .p-title{font-family:Georgia,serif;font-size:20px;font-weight:700;color:var(--ink);margin-bottom:10px}
  .passage p{font-size:15px;line-height:1.9;margin:10px 0}
  .passage .en{color:#3a332b;font-family:Georgia,"Times New Roman",serif}
  .passage .zh{color:var(--muted);font-size:13.5px}
  .passage .kw{cursor:pointer;color:var(--accent);font-weight:600;border-bottom:1px dotted var(--accent2)}
  .readall{background:var(--accent);color:#fff;border:none;border-radius:20px;padding:4px 14px;font-size:13px;
    cursor:pointer;margin-left:10px;vertical-align:middle;transition:.15s}
  .readall:hover{background:var(--core)}
  .sents{background:linear-gradient(135deg,#f3f8f6,#eef3f0);border:1px solid var(--line);
    border-radius:14px;padding:18px 20px;margin:0 0 22px}
  .sents h2{margin:0 0 6px;font-size:18px;color:var(--core)}
  .sents .s-sub{color:var(--muted);font-size:13px;margin-bottom:14px}
  .sent{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:12px 0}
  .sent .s-en{font-family:Georgia,"Times New Roman",serif;font-size:15.5px;line-height:1.7;cursor:pointer;color:#3a332b}
  .sent .s-en:hover{color:var(--accent)}
  .sent .s-zh{color:var(--muted);font-size:13.5px;margin:6px 0 10px}
  .sent .s-parts{display:flex;flex-wrap:wrap;gap:6px}
  .spart{display:inline-flex;align-items:center;gap:6px;border-radius:9px;padding:4px 9px;font-size:13px;line-height:1.4}
  .spart .st{font-family:Georgia,serif;font-weight:600}
  .spart .sr{font-size:11px;color:#fff;border-radius:5px;padding:0 5px;white-space:nowrap}
  .spart .sn{font-size:12px;color:var(--muted)}
  .snotes{margin-top:10px;padding-top:8px;border-top:1px dashed var(--line);font-size:13px;color:#5f574c}
  .snotes b{color:var(--accent)}
  /* 句子内括号标注 */
  .s-flow{font-family:Georgia,"Times New Roman",serif;font-size:16px;line-height:2.1;cursor:pointer;color:#3a332b;padding:2px 0}
  .s-flow:hover{color:var(--accent)}
  .brkbox{border-radius:4px;padding:1px 1px;transition:.15s}
  .brk{font-weight:700;font-size:17px;padding:0 1px}
  .say-mini{background:none;border:none;cursor:pointer;font-size:15px;padding:0 4px;vertical-align:middle}
  @media(max-width:680px){.rules{grid-template-columns:1fr}.combo .big{font-size:44px}}
</style>
</head>

<div class="wrap">
  <div class="top">
    <a href="../index.html">← 返回总目录</a>
    <span>六级 · 托福单词记忆系统</span>
  </div>

  <header class="hero" id="hero"></header>

  <div id="passage"></div>
  <div id="sents"></div>

  <div class="toolbar">
    <input class="search" id="q" placeholder="🔎 搜索单词或释义…">
    <div class="filters" id="lvf"></div>
    <div class="filters" id="sgf"></div>
    <select class="f" id="voiceSel" title="选择发音音色（美式女声）"></select>
    <button class="btn" id="quizBtn">📝 测验</button>
    <button class="btn" id="memBtn">🧠 记忆模式</button>
    <button class="btn" id="unfamBtn">🔺 只看不熟悉 (<span id="unfamN">0</span>)</button>
  </div>

  <div class="grid" id="grid"></div>
  <footer id="foot"></footer>
</div>

 {"gloss": "n. 条款（协议中划定权责的条件，常用复数 terms）", "logic": "「划定边界」→ 协议里每一条边界和约定", "en": "Read the terms carefully before signing the contract.", "zh": "签合同前请仔细阅读条款。"}, {"gloss": "v. 将……称为、把……叫做", "logic": "「划定边界」→ 用一个词给某事物贴上清晰的标签", "en": "What she did can only be termed a miracle.", "zh": "她所做的事只能称之为奇迹。"}], "derivatives": [{"w": "terminal", "gloss": "终端；末期的；终点站"}, {"w": "terminate", "gloss": "终止，结束"}, {"w": "terminology", "gloss": "术语体系，专业词汇"}, {"w": "determine", "gloss": "决定，确定（词根含「划定界限」义）"}], "examples": [{"en": "The contract included strict terms about delivery deadlines.", "zh": "合同包含关于交货期限的严格条款。", "source": "造句"}, {"en": "in the long term / in terms of", "zh": "「从长远来看 / 就……而言」——学术写作最高频的两个 term 搭配。", "source": "高频搭配"}], "synonyms": [{"w": "period", "ipa": "/ˈpɪəriəd/", "gloss": "时期，阶段", "note": "「时期」义的近义，比 term 更泛，无「固定边界」含义；a period of growth（成长期）"}, {"w": "terminology", "ipa": "/ˌtɜːrmɪˈnɒlədʒi/", "gloss": "术语体系，专业词汇集合", "note": "「术语体系」，term 是单个术语，terminology 是一套领域词汇系统"}, {"w": "clause", "ipa": "/klɔːz/", "gloss": "（合同或法律文件中的）条款", "note": "「条款」义的正式近义，多指合同或法律文件中的具体条文"}], "antonyms": [{"w": "whole", "note": "整体（相对于 term 的「限定范围」义）"}], "nuance": "term 作「术语」时比 word 更强调专业领域的专门用法；作「条款」时（terms of agreement）和 clause 可互换，但 terms 常用复数指一整套条件；in terms of 是学术写作的万能介词短语，表示「就……维度而言」。"}, {"word": "serve", "hl": "er", "levels": ["六级"], "ipa": "/sɜːrv/", "subgroup": "er", "meaning": "v. 服务；供应（食物）；满足（需求）；服役；（在法庭）送达  n. 发球", "etymology": "拉丁语 servire「做奴隶、服侍」，与 servant（仆人）、service（服务）、reserve（保留，字面「再次服务备用」）同根。核心义：为他人而动。", "roots": [{"part": "serv- (servire)", "meaning": "服侍、为……服务"}], "phonetics": "s + er /ɜːr/ + v，与 nerve、curve 押韵。注意 -ve 结尾哑 e，整词只有一个音节。", "core": "为他人而动的感觉——身体或功能朝着另一方的需要运作，无论是端菜、当兵还是发球，都是「把自己的力量交出去」。", "senses": [{"gloss": "v. 服务，为……服务", "logic": "「为他人而动」的最直接体现", "en": "This library serves thousands of students every year.", "zh": "这座图书馆每年为数千名学生提供服务。"}, {"gloss": "v. 供应（食物或饮料）", "logic": "「为他人而动」→ 把食物送到对方面前", "en": "The restaurant serves traditional dishes from the region." en": "first and foremost", "zh": "「首先、最重要的是」——强调优先级的高频短语，first 和 fore 语义呼应。", "source": "高频搭配"}], "synonyms": [{"w": "primary", "ipa": "/ˈpraɪmeri/", "gloss": "首要的，主要的（重要性第一）", "note": "「首要的」，强调重要性排序第一，比 first 更抽象，不含时间序列"}, {"w": "initial", "ipa": "/ɪˈnɪʃl/", "gloss": "最初的，开始时的（时间上最先）", "note": "「最初的」，强调时间上最早，比 first 更正式；initial response（最初的反应）"}, {"w": "foremost", "ipa": "/ˈfɔːrmoʊst/", "gloss": "最重要的，最杰出的", "note": "「最重要的、最杰出的」，和 first 同词根，first and foremost 常连用"}], "antonyms": [{"w": "last", "note": "最后的"}, {"w": "final", "note": "最终的"}], "nuance": "first 既表时间顺序（arrive first）也表重要性（first priority）；primary 只表重要性排序；initial 只表时间上的最先，不含「最重要」意味。「first impression」是「第一印象」，「primary concern」是「首要关切」，两者不可互换。"}, {"word": "shirt", "hl": "ir", "levels": ["六级"], "ipa": "/ʃɜːrt/", "subgroup": "ir", "meaning": "n. 衬衫，上衣", "etymology": "古英语 scyrte「短衣」，日耳曼同根，与 skirt（裙子）同一词源——两者都是「切短的布」，后来分化为上身与下身。shirt 和 skirt 是「双胞胎词」（doublets）。", "roots": [{"part": "shirt（scyrte）", "meaning": "短衣，与 skirt 同根"}], "phonetics": "sh /ʃ/ + ir /ɜːr/ + t，与 dirt、first 押韵。注意 sh 是单一音素 /ʃ/，不要拆成 s+h。", "tip": "shirt（衬衫）和 skirt（裙子）是同一个古英语词演化的双胞胎：shirt 上身、skirt 下身，读音一字之差（sh-/sk-）。", "core": "贴身穿在上半身的基础布料——实用、贴近身体，是着装的第一层，由此延伸出各类场合的衬衫文化。", "senses": [{"gloss": "n. 衬衫（上身穿的有领或无领上衣，涵盖正装衬衫和T恤等）", "logic": "词的本义，单义词", "en": "He ironed his shirt before the interview.", "zh": "他在面试前熨好了衬衫。"}], "derivatives": [{"w": "T-shirt", "gloss": "T恤衫（因形状似字母T得名）"}, {"w": "undershirt", "gloss": "内衣，汗衫"}, {"w": "shirtsleeve", "gloss": "衬衫袖子；in one's shirtsleeves 不穿外套"}], "examples": [{"en": "He ironed his shirt before the interview.", "zh": "他在面试前熨好了衬衫。", "source": "造句"}, {"en": "lose one's shirt", "zh": "「倾家荡产」——连衬衫都输掉了的高频口语比喻。", "source": "高频搭配"}], "synonyms": [{"w": "blouse", "ipa": "/blaʊz/", "gloss": "（女式）衬衫，宽松上衣", "note": "「（女式）衬衫」，比 shirt 更宽松飘逸，通常特指女装上衣"}, {"w": "top", "ipa": "/tɒp/", "gloss": "上衣（最宽泛的口语通称）", "note": "「上衣」的口语通称，比 shirt 更泛，涵盖各种上身服装"}], "antonyms": [], "nuance": "shirt 通常指正式或半正式场合的有领上衣（T-shirt 除外）；blouse 特指女式较飘逸的上衣；top 是最宽泛的口语词，指任何上身服装。dress shirt（正装衬衫）、T-shirt、polo shirt 是常见的固定搭配。"}, {"word": "circle", "hl": "ir", "levels": ["六级"], "ipa": "/ˈsɜːrkl/", "subgroup": "ir", "meaning": "n. 圆；圈子；循环  v. 绕圈；圈出", "etymology": "拉丁语 circulus「小圆」，是 circus（圆形竞技场）的小称形式。与 circuit（回路，字面「绕圆一圈」）、circumference（周长）、circular（圆形的）同根——circ- = 圆/环。", "roots": [{"part": "circ- (circulus)", "meaning": "圆、环"}, {"part": "-le", "meaning": "名词/动词后缀"}], "phonetics": "重音在前 CIR-cle，cir = /sɜːr/，-cle 弱读 /kl/。circle 里的 ir 读 /ɜːr/ 是规律，不要读成 /ɪr/。", "tip": "circ- 家族：circle（圆）→ circuit（回路）→ circular（圆形的）→ circumference（周长）→ circus（圆形场地）。认识这个词根，看见 circ- 就想到「绕圆」。", "core": "封闭曲线环绕中心的形状感——从几何的「圆」延伸到人际的「圈子」，再到时间的「循环」，都是「回到起点、无始无终」的意象。", "senses": [{"gloss": "n. 圆，圆形（几何形状）", "logic": "词的核心本义：封闭曲线", "en": "Draw a circle with a radius of five centimeters.", "zh": "画一个半径为五厘米的圆。"}, {"gloss": "n. 圈子（社交群体，有边界感的人际网络）", "logic": "「封闭曲线」→ 有内外之分的人际边界", "en": "She moves in very exclusive social circles.", "zh": "她活跃在非常精英的社交圈子里。"}, {"gloss": "n. 循环（周期性回到原点的过程）", "logic": "「回到起点」→ 周而复始的过程", "en": "Breaking the circle of poverty requires long-term investment.", "zh": "打破贫穷的循环需要长期投入。"}, {"gloss": "v. 绕圈飞行或运动（围着某物转）", "logic": "「做圆形轨迹」→ 围绕某个中心转动", "en": "The hawk circled lazily above the field.", "zh": "那只鹰懒洋洋地在田野上空盘旋。"}, {"gloss": "v. 圈出，画圆圈标注", "logic": "「用圆圈框住」→ 用圆圈标记某个内容", "en": "Circle the correct answer on your test sheet.", "zh": "在试卷上圈出正确答案。"}], "derivatives": [{"w": "circular", "gloss": "圆形的；循环的；（名词）通知，传单"}, {"w": "circuit", "gloss": "回路，电路；赛道；巡回"}, {"w": "circumference", "gloss": "（圆的）周长，圆周"}], "examples": [{"en": "The students sat in a circle and took turns speaking.", "zh": "学生们围成一圈轮流发言。", "source": "造句"}, {"en": "go around in circles", "zh": "「原地打转、没有进展」——高频习语，比喻讨论或工作毫无推进。", "source": "高频搭配"}], "synonyms": [{"w": "ring", "ipa": "/rɪŋ/", "gloss": "圆环，环形（强调空心的环）", "note": "「圆环」，比 circle 更强调空心的环形，常指实物；a ring of light（一圈光）"}, {"w": "cycle", "ipa": "/ˈsaɪkl/", "gloss": "循环，周期（时间维度）", "note": "「循环」义的近义，强调时间或过程的循环，circle 的「循环」义偏空间"}, {"w": "orbit", "ipa": "/ˈɔːrbɪt/", "gloss": "轨道，运行轨迹（天体或抽象）", "note": "「轨道」，circle 的近义，强调绕某天体的圆形路径；orbit the earth（绕地球运行）"}], "antonyms": [{"w": "line", "note": "直线（相对于圆形）"}], "nuance": "circle 既可指形状（完整的圆）也可指社会群体（a circle of friends），还可作动词表示「绕圈飞行/圈出」；ring 偏实物的圆环，cycle 强调时间维度的循环，orbit 专用于天体或抽象权力轨道。"}, {"word": "confirm", "hl": "ir", "levels": ["六级", "托福"], "ipa": "/kənˈfɜːrm/", "subgroup": "ir", "meaning": "v. 确认；证实；批准；使坚定（信念）", "etymology": "拉丁语 confirmare = con-(完全) + firmare(使坚固) = 「彻底使坚固」→ 确认/证实。与 firm（坚定的）、affirm（肯定）、infirm（虚弱的，不坚固的）同根。firm 的本义是「坚固、稳固」。", "roots": [{"part": "con-", "meaning": "完全、彻底"}, {"part": "-firm (firmare)", "meaning": "使坚固、使稳固"}], "phonetics": "重音在后 con-FIRM，-firm = /fɜːrm/；con- 弱读 /kən/。-fir- 里的 ir 读 /ɜːr/，不是 /ɪr/。", "tip": "affirm（肯定）、confirm（确认）、infirm（虚弱）、firm（坚定）——firm 词根家族：从「坚固」出发，affirm 是正向加固，confirm 是彻底加固，infirm 是不坚固。", "core": "「把松动的东西彻底固定住」的感觉——无论是核实一个事实、敲定一个预约，还是加固一个信念，都是让不确定的变得确定。", "senses": [{"gloss": "v. 确认（敲定安排或信息，让不确定变确定）", "logic": "「彻底固定」→ 把未确认的状态变成确认", "en": "Please confirm your attendance by Friday.", "zh": "请在周五前确认出席。"}, {"gloss": "v. 证实（通过证据让某事实更稳固）", "logic": "「彻底固定」→ 用证据把某个说法「钉死」", "en": "The lab results confirmed the doctor's diagnosis.", "zh": "化验结果证实了医生的诊断。"}, {"gloss": "v. 批准，正式任命（让地位稳固）", "logic": "「彻底固定」→ 正式批准使职位或决定稳固", "en": "The Senate confirmed her nomination as secretary.", "zh": "参议院批准了她作为部长的提名。"}, {"gloss": "v. 使坚定（某信念或决心）", "logic": "「彻底固定」→ 让内心的想法更加稳固不动摇", "en": "The trip confirmed his belief that travel broadens the mind.", "zh": "这次旅行让他更加坚信旅行能开阔眼界。"}], "derivatives": [{"w": "confirmation", "gloss": "确认；证实；（宗教）坚信礼"}, {"w": "confirmed", "gloss": "确认的；根深蒂固的（如 a confirmed bachelor 坚定的单身汉）"}, {"w": "reconfirm", "gloss": "再次确认"}], "examples": [{"en": "Please confirm your attendance by Friday.", "zh": "请在周五前确认出席。", "source": "造句"}, {"en": "confirm a booking / confirm a theory", "zh": "「确认预订 / 证实理论」——商务和学术中最高频的两个搭配。", "source": "高频搭配"}], "synonyms": [{"w": "verify", "ipa": "/ˈverɪfaɪ/", "gloss": "核实，验证（通过检查证明真实）", "note": "「核实、验证」，比 confirm 更强调通过检查来证明真实；verify a claim（核实声明）"}, {"w": "validate", "ipa": "/ˈvælɪdeɪt/", "gloss": "验证有效性，认可", "note": "「验证有效性」，比 confirm 更正式，多用于数据、文件、资格；validate a passport（验证护照有效性）"}, {"w": "affirm", "ipa": "/əˈfɜːrm/", "gloss": "肯定，声明（主动表态）", "note": "「肯定、声明」，比 confirm 更强调主动表态而非被动验证；affirm one's commitment（表明承诺）"}], "antonyms": [{"w": "deny", "note": "否认"}, {"w": "refute", "note": "反驳、驳斥"}], "nuance": "confirm 是最通用的「确认」，兼覆盖预约确认和事实证实；verify 强调通过独立证据或程序来核实，比 confirm 更严格；validate 专注于合规性和有效性；affirm 更像是主动声明立场，而非被动证实。「confirm a fact」可替换为 verify，但「confirm a reservation」不能。"}, {"word": "turn", "hl": "ur", "levels": ["六级"], "ipa": "/tɜːrn/", "subgroup": "ur", "meaning": "v. 转动；变成；使转向  n. 转弯；轮次；机会", "etymology": "古英语 turnian，源自拉丁语 tornare「用车床旋转」，与 tour（旅行，原义「绕圈走」）、tournament（比武，原义「骑马转圈」）同根。核心义：围绕轴心旋转。", "roots": [{"part": "turn（tornare）", "meaning": "旋转、转动"}], "phonetics": "t + ur /ɜːr/ + n，与 burn、learn、return、earn 押韵，构成 -urn 韵脚家族。", "core": "围绕轴心旋转的感觉——从物理的转动，延伸到方向的改变，再到状态的转变，以及轮流时「转到你了」的轮次感。", "senses": [{"gloss": "v. 转动，旋转（物理上绕轴运动）", "logic": "词的核心本义", "en": "Turn the key to the right to unlock the door.", "zh": "将钥匙向右转来开锁。"}, {"gloss": "v. 转向，改变方向", "logic": "「旋转」→ 整体方向发生角度变化", "en": "Turn left at the traffic lights.", "zh": "在红绿灯处向左转。"}, {"gloss": "v. 变成，转变为（turn + 形容词/名词）", "logic": "「旋转到另一面」→ 状态从一面翻转到另一面", "en": "The situation turned out better than anyone expected.", "zh": "局势的发展比任何人预期的都要好。"}, {"gloss": "n. 转弯处，弯道", "logic": "「旋转」→ 道路发生方向改变的地点", "en": "There's a sharp turn just past the bridge.", "zh": "过了桥之后有一个急转弯。"}, {"gloss": "n. 轮次，轮流（take turns，到某人了）", "logic": "「转」→ 事物轮流「转」到下一个人", "en": "It's your turn to wash the dishes tonight.", "zh": "今晚轮到你洗碗了。"}], "derivatives": [{"w": "return", "gloss": "返回；回报；退货"}, {"w": "overturn", "gloss": "推翻；翻转"}, {"w": "turnover", "gloss": "营业额；人员流动率；翻转"}, {"w": "tournament", "gloss": "锦标赛（原义「骑马转圈比武」）"}], "examples": [{"en": "The situation turned out better than anyone expected.", "zh": "局势的发展比任何人预期的都要好。", "source": "造句"}, {"en": "take turns / in turn", "zh": "「轮流 / 依次」——排序和协作的高频搭配。", "source": "高频搭配"}], "synonyms": [{"w": "rotate", "ipa": "/roʊˈteɪt/", "gloss": "旋转（强调围绕固定轴的圆周运动）", "note": "「旋转」，比 turn 更强调围绕固定轴的圆周运动，多用于机械；rotate 360 degrees"}, {"w": "shift", "ipa": "/ʃɪft/", "gloss": "转移，改变（强调位置或状态的横向移动）", "note": "「转移/变化」，turn 的近义词，更强调位置或状态的改变而非旋转；shift one's attention（转移注意力）"}, {"w": "spin", "ipa": "/spɪn/", "gloss": "快速旋转（强调速度和连续性）", "note": "「快速旋转」，比 turn 更强调速度和连续性；spin a coin（旋转硬币）"}], "antonyms": [{"w": "stay", "note": "保持不变（相对于转变义）"}], "nuance": "turn 是最通用的「转动/转变」，可指物理旋转（turn the key）或状态变化（turn red）；rotate 专指机械性的固轴旋转；spin 强调快速旋转；shift 更强调位置或注意力的横向移动。「turn into」强调变化的结果，「become」比它更正式。"}, {"word": "nurse", "hl": "ur", "levels": ["六级"], "ipa": "/nɜːrs/", "subgroup": "ur", "meaning": "n. 护士；保姆  v. 护理；哺乳；精心培育；（心中）抱着（怨恨等）", "etymology": "拉丁语 nutrire「滋养、喂养」，经古法语 norrice 演变。与 nourish（滋养）、nutrition（营养）、nurture（培育）同根——都在讲「喂养→照料→培育」的连贯义链。", "roots": [{"part": "nurs- (nutrire)", "meaning": "滋养、喂养、照料"}], "phonetics": "n + ur /ɜːr/ + s + e，词尾哑 e，发音 /nɜːrs/。与 curse、purse、verse 押韵。", "tip": "nurse/nourish/nurture/nutrition 同根：nurse 是照料人，nourish 是滋养，nurture 是培育，nutrition 是营养——一个词根的「照料」家族。", "core": "持续、耐心地喂养和照料的感觉——不是一次性给予，而是长期守在旁边提供滋养，由此延伸到心中「养着」某种情绪。", "senses": [{"gloss": "n. 护士（医疗机构中照料病人的专业人员）", "logic": "「喂养照料者」→ 专业从事照料工作的人", "en": "The nurse checked his blood pressure every two hours.", "zh": "护士每两小时给他量一次血压。"}, {"gloss": "n. 保姆，奶妈（旧义，照料婴幼儿的人）", "logic": "「喂养照料者」→ 负责喂养和照看幼儿的人", "en": "The children were left in the care of a nurse.", "zh": "孩子们被交由保姆照看。"}, {"gloss": "v. 护理，悉心照料（病人或伤者）", "logic": "「持续喂养照料」→ 对病人进行长期细心的护理", "en": "She nursed her father back to health after his surgery.", "zh": "她悉心照料父亲，使他在手术后康复。"}, {"gloss": "v. 哺乳（母乳喂养婴儿）", "logic": "「喂养」的最直接生物义", "en": "She nursed the baby for six months.", "zh": "她母乳喂养婴儿六个月。"}, {"gloss": "v. 心中抱着（怨恨、希望等），默默养着某种情绪", "logic": "「持续喂养」→ 在内心长期「喂大」某种感情或想法", "en": "He nursed a grudge against her for years.", "zh": "他对她怀恨在心多年。"}], "derivatives": [{"w": "nursery", "gloss": "托儿所；苗圃；儿童房"}, {"w": "nursing", "gloss": "护理（职业）；哺乳"}, {"w": "nurture", "gloss": "培育，养育（同根，更强调长期促进成长）"}], "examples": [{"en": "She nursed her father back to health after his surgery.", "zh": "她悉心照料父亲，使他在手术后康复。", "source": "造句"}, {"en": "nurse a grudge", "zh": "「长期怀恨在心」——nurse 作「心中抱着」义的高频搭配，含义极负面。", "source": "高频搭配"}], "synonyms": [{"w": "caregiver", "ipa": "/ˈkeərɡɪvər/", "gloss": "照料者，护理人员（通用称呼）", "note": "「照料者」，比 nurse 更通用，不特指医疗专业人员"}, {"w": "nourish", "ipa": "/ˈnɜːrɪʃ/", "gloss": "滋养，给予营养（偏抽象）", "note": "「滋养」，nurse 同根词，更强调提供营养和支持，偏抽象"}, {"w": "nurture", "ipa": "/ˈnɜːrtʃər/", "gloss": "培育，养育（强调长期促进成长）", "note": "「培育」，同根，强调长期照料和促进成长；nurture talent（培养人才）"}], "antonyms": [{"w": "neglect", "note": "忽视、放任不管"}, {"w": "abandon", "note": "遗弃"}], "nuance": "nurse 强调对病人或婴儿的直接照料；nourish 更抽象，偏重「提供滋养」（nourish the soul）；nurture 强调长期的促进成长（nurture creativity）；三词共享词根，但语境和对象各有侧重。"}, {"word": "church", "hl": "ur", "levels": ["六级"], "ipa": "/tʃɜːrtʃ/", "subgroup": "ur", "meaning": "n. 教堂；教会；礼拜仪式", "etymology": "古英语 cirice，源自希腊语 kuriakon「属于上帝的（地方）」，kurion = 主、上帝。ku-ri-a-kon → cirice → church，是音位收缩的极端案例。", "roots": [{"part": "church（kuriakon）", "meaning": "属于上帝的地方"}], "phonetics": "ch /tʃ/ + ur /ɜːr/ + ch /tʃ/：首尾都是 /tʃ/，中间是 /ɜːr/，是这个音位的高强度练习词——一词练两次 /tʃ/ 和一次 /ɜːr/。", "tip": "church 首尾都是 /tʃ/，是发音上的「对称词」，有助于记忆 ur = /ɜːr/。", "core": "「属于上帝的场所」的神圣感——由一个具体的建筑延伸到信仰的群体组织，再延伸到礼拜这件事本身。", "senses": [{"gloss": "n. 教堂（基督教礼拜建筑）", "logic": "词的本义：属于上帝的物理空间", "en": "They were married in a small church on the hill.", "zh": "他们在山上一座小教堂结婚。"}, {"gloss": "n. 教会（基督教组织或宗派，如 the Catholic Church）", "logic": "「属于上帝的场所」→ 信众组成的群体组织", "en": "The church has played a major role in local politics.", "zh": "教会在当地政治中扮演了重要角色。"}, {"gloss": "n. 礼拜（宗教仪式，无冠词时指这件事本身）", "logic": "「属于上帝的场所」→ 在那里发生的活动本身", "en": "They go to church every Sunday morning.", "zh": "他们每周日早上都去做礼拜。"}], "derivatives": [{"w": "churchyard", "gloss": "教堂庭院；教堂附属墓地"}, {"w": "churchgoer", "gloss": "定期去做礼拜的人"}, {"w": "unchurch", "gloss": "开除教籍（罕见）"}], "examples": [{"en": "They were married in a small church on the hill.", "zh": "他们在山上一座小教堂结婚。", "source": "造句"}, {"en": "go to church", "zh": "「去做礼拜」——church 无冠词时指礼拜这件事，有冠词 the church 时指建筑物。", "source": "高频搭配"}], "synonyms": [{"w": "chapel", "ipa": "/ˈtʃæpl/", "gloss": "礼拜堂（小型，常附属于其他机构）", "note": "「礼拜堂」，比 church 更小，多指附属于学校、医院、机场等的小礼拜堂"}, {"w": "cathedral", "ipa": "/kəˈθiːdrəl/", "gloss": "大教堂（主教座堂，规模最大）", "note": "「大教堂」，比 church 更大更正式，是主教的驻地所在教堂"}, {"w": "congregation", "ipa": "/ˌkɒŋɡrɪˈɡeɪʃn/", "gloss": "会众，教堂的信徒群体", "note": "「会众」，指教堂里的信众群体，是 church 的「成员」义延伸"}], "antonyms": [{"w": "state", "note": "世俗国家（separation of church and state 政教分离）"}], "nuance": "church 指任何基督教礼拜场所（含建筑和信仰群体）；chapel 是较小的附属礼拜堂；cathedral 是主教座堂，规模最大、地位最高。「go to church」（无冠词）指参加礼拜，「go to the church」则指前往教堂建筑物。"}, {"word": "curve", "hl": "ur", "levels": ["六级", "托福"], "ipa": "/kɜːrv/", "subgroup": "ur", "meaning": "n. 曲线；弯道；（统计）曲线图  v. 弯曲，成弧形", "etymology": "拉丁语 curvus「弯曲的」，与 curl（卷曲）、curb（路缘，弯曲边界）同根。curvature（曲率）、curved（弯曲的）直接派生。", "roots": [{"part": "curv- (curvus)", "meaning": "弯曲"}], "phonetics": "c /k/ + ur /ɜːr/ + ve，与 serve、nerve 押韵。词尾 -ve 不发音（哑 e）。", "tip": "throw someone a curve（ball）=「给某人出难题」——棒球中的曲线球，已进入日常英语比喻。", "core": "「不走直线」的弯曲感——从道路的弯道，到数学的曲线，到数据的趋势走势，都是「偏离直线的柔性路径」。", "senses": [{"gloss": "n. 曲线，弧线（几何或物理形状）", "logic": "词的本义：弯曲的线", "en": "The designer used gentle curves instead of sharp angles.", "zh": "设计师用柔和的曲线代替了锐角。"}, {"gloss": "n. 弯道（道路的弯曲处）", "logic": "「弯曲」→ 道路不走直线的地方", "en": "The road curves sharply to the left just past the tunnel.", "zh": "隧道过后，道路急剧向左弯曲。"}, {"gloss": "n. 曲线图，统计趋势线", "logic": "「弯曲的线」→ 表示数据走势的弯曲图形", "en": "The infection rate is finally following a downward curve.", "zh": "感染率终于开始呈下降曲线。"}, {"gloss": "v. 弯曲，呈弧形延伸", "logic": "「弯曲」的动词用法", "en": "The coastline curves gently toward the south.", "zh": "海岸线缓缓向南弯曲延伸。"}], "derivatives": [{"w": "curvature", "gloss": "曲率；弯曲程度（如脊柱曲率）"}, {"w": "curved", "gloss": "弯曲的，成弧形的"}, {"w": "curb", "gloss": "路缘石；抑制，约束（同根，原义「弯曲的边界」）"}], "examples": [{"en": "The road curves sharply to the left just past the tunnel.", "zh": "隧道过后，道路急剧向左弯曲。", "source": "造句"}, {"en": "learning curve / bell curve", "zh": "「学习曲线 / 正态分布曲线」——两个学术高频搭配。", "source": "高频搭配"}], "synonyms": [{"w": "bend", "ipa": "/bend/", "gloss": "弯道；弯曲（口语，强调折弯）", "note": "「弯道/弯曲」，比 curve 更口语，强调物理上的折弯；a bend in the road（路的弯道）"}, {"w": "arc", "ipa": "/ɑːrk/", "gloss": "弧，弧形（圆的一部分）", "note": "「弧」，比 curve 更精确，指圆的一部分或完美的弧形；the arc of a rainbow（彩虹的弧度）"}, {"w": "trajectory", "ipa": "/trəˈdʒektəri/", "gloss": "轨迹，运动路径（学术用语）", "note": "「轨迹」，强调运动的弧形路径，比 curve 更学术；the trajectory of a ball（球的飞行轨迹）"}], "antonyms": [{"w": "straight line", "note": "直线"}, {"w": "flat", "note": "平直的"}], "nuance": "curve 是最通用的「曲线/弯曲」，可指几何形状、道路、数据图形；arc 强调精确的圆弧形；bend 偏口语，多指道路或管道的弯折；trajectory 专指运动物体在空中或数据发展的轨迹路径。"}, {"word": "disturb", "hl": "ur", "levels": ["六级", "托福"], "ipa": "/dɪˈstɜːrb/", "subgroup": "ur", "meaning": "v. 打扰；使不安；扰乱（秩序）", "etymology": "拉丁语 disturbare = dis-(分离/破坏) + turbare(使混乱) = 「彻底搅乱」。turbare 来自 turba（混乱的人群），与 turbulent（汹涌的）、perturb（使不安）同根——turb- = 搅动、乱。", "roots": [{"part": "dis-", "meaning": "破坏、打散"}, {"part": "-turb (turbare)", "meaning": "使混乱、搅动"}], "phonetics": "重音在后 dis-TURB，-turb = /tɜːrb/；dis- 弱读 /dɪ/。turb 里的 ur 读 /ɜːr/，不要读 /ʊr/。", "tip": "turb- 家族：disturb（打扰）、perturb（使不安）、turbulent（汹涌的）、turbine（涡轮）——都在讲「搅动/旋转的混乱」。", "core": "「把平静的状态搅乱」的感觉——无论是打断别人的专注，还是让人心里产生不安，都是用外力把原本安定的东西搅动了。", "senses": [{"gloss": "v. 打扰，妨碍（打断别人的工作或休息）", "logic": "「搅乱」→ 用外部干扰打破别人的平静状态", "en": "Please do not disturb — I'm in the middle of an important call.", "zh": "请勿打扰——我正在打一个重要电话。"}, {"gloss": "v. 使不安，使忧虑（心理层面的搅乱）", "logic": "「搅乱」→ 把内心的平静搅动，产生不安感", "en": "The documentary was deeply disturbing to watch.", "zh": "这部纪录片让人看了深感不安。"}, {"gloss": "v. 扰乱，破坏（秩序、安排或平衡）", "logic": "「搅乱」→ 破坏原本有序的状态", "en": "Heavy rain disturbed the flow of traffic.", "zh": "大雨扰乱了交通秩序。"}], "derivatives": [{"w": "disturbance", "gloss": "干扰；骚乱；（气象）扰动"}, {"w": "disturbing", "gloss": "令人不安的，令人忧虑的"}, {"w": "undisturbed", "gloss": "未被打扰的，安静的"}], "examples": [{"en": "Please do not disturb — I'm in the middle of an important call.", "zh": "请勿打扰——我正在打一个重要电话。", "source": "造句"}, {"en": "disturbing news / deeply disturbing", "zh": "「令人不安的消息 / 深感不安」——disturbing 是形容词高频用法。", "source": "高频搭配"}], "synonyms": [{"w": "disrupt", "ipa": "/dɪsˈrʌpt/", "gloss": "打断，扰乱（系统或进程）", "note": "「打断、扰乱（系统/流程）」，比 disturb 更强调对秩序或进程的破坏；disrupt a meeting（打断会议进程）"}, {"w": "interrupt", "ipa": "/ˌɪntəˈrʌpt/", "gloss": "打断（正在进行的事或话语）", "note": "「打断（说话/活动）」，比 disturb 更具体，指打断正在进行的事；interrupt a conversation（打断谈话）"}, {"w": "unsettle", "ipa": "/ʌnˈsetl/", "gloss": "使不安，使动摇（心理层面）", "note": "「使不安/动摇」，比 disturb 更偏心理层面的不稳定感；unsettle one's beliefs（动摇信念）"}], "antonyms": [{"w": "calm", "note": "使平静"}, {"w": "settle", "note": "使安定"}], "nuance": "disturb 兼覆盖物理干扰（请勿打扰）和心理不安（disturbing content）；disrupt 强调对进程或系统的破坏性中断，现多用于商业（disruptive innovation 颠覆式创新）；interrupt 专指时间上打断正在进行的事；unsettle 专注于心理层面的不稳定感。"}, {"word": "earth", "hl": "ear", "levels": ["六级"], "ipa": "/ɜːrθ/", "subgroup": "ear", "meaning": "n. 地球；土地，泥土；（电）接地  v. 接地（电路）", "etymology": "古英语 eorþe「大地、土地」，日耳曼同根，与德语 Erde（大地）同源。地球 Earth 大写时专指行星，小写时指土壤或地面。与 earthy（朴实的）、earthly（尘世的）直接派生。", "roots": [{"part": "earth（eorþe）", "meaning": "大地、土地"}], "phonetics": "ear /ɜːr/ + th /θ/，注意 ear 在此读 /ɜːr/ 而非 /ɪər/（区别于 hear/near）；th 结尾是清辅音 /θ/，非浊音 /ð/。", "tip": "earth 的 ear 读 /ɜːr/，不是 /ɪər/——用「泥土比空气更厚重」来记：hear/near 的 ear 轻盈（/ɪər/），earth/learn 的 ear 沉落（/ɜːr/）。", "core": "「落地、沉实」的感觉——是脚踩的土、生活其上的星球、以及电流导向大地的通路，共享着「向下、踏实」的核心意象。", "senses": [{"gloss": "n. 地球（行星，大写 Earth 时为专有名词）", "logic": "「大地」→ 人类栖居的整个星球", "en": "The Earth orbits the Sun once every 365 days.", "zh": "地球每365天绕太阳公转一圈。"}, {"gloss": "n. 土地，泥土（可耕作或接触的地面物质）", "logic": "词的古老本义：脚下的土", "en": "The soil on this earth is rich enough to grow almost anything.", "zh": "这片土地的土壤肥沃，几乎什么都能种。"}, {"gloss": "n. （电气）接地，地线（使电路连向大地）", "logic": "「大地」→ 电流导向大地以安全泄放，历史偶合延伸", "en": "Make sure the appliance is properly earthed before use.", "zh": "使用前请确保设备已正确接地。"}, {"gloss": "v. 为（电路）接地", "logic": "「连向大地」的动词化", "en": "The electrician earthed the entire circuit.", "zh": "电工给整个线路做了接地处理。"}], "derivatives": [{"w": "earthly", "gloss": "尘世的，世俗的；（口语强调）究竟"}, {"w": "earthquake", "gloss": "地震"}, {"w": "earthy", "gloss": "泥土气息的；粗犷朴实的"}, {"w": "unearth", "gloss": "挖出；发掘，揭露"}], "examples": [{"en": "The soil on this earth is rich enough to grow almost anything.", "zh": "这片土地的土壤肥沃，几乎什么都能种。", "source": "造句"}, {"en": "down to earth / on earth", "zh": "「脚踏实地 / 究竟（强调语气）」——两个高频固定搭配。", "source": "高频搭配"}], "synonyms": [{"w": "soil", "ipa": "/sɔɪl/", "gloss": "土壤（农业或生态意义，专业用词）", "note": "「土壤」，比 earth 更专业，强调农业或生态意义上的土质；fertile soil（肥沃的土壤）"}, {"w": "ground", "ipa": "/ɡraʊnd/", "gloss": "地面（强调表面，不含星球义）", "note": "「地面」，比 earth 更强调表面，不含「星球」义；on the ground（在地面上）"}, {"w": "globe", "ipa": "/ɡloʊb/", "gloss": "地球（强调球形，常用于地理旅行语境）", "note": "「地球（球体）」，强调球形，常用于地理和旅行语境；around the globe（全球各地）"}], "antonyms": [{"w": "sky", "note": "天空（物理相对）"}, {"w": "heaven", "note": "天堂（哲学/宗教相对）"}], "nuance": "earth 可指星球（Earth's atmosphere）、土壤（rich earth）或地面（come down to earth）；soil 专指农业土壤，不可指星球；ground 指地面表面，不含土质或星球义；globe 强调球形，多见于旅行和地理语境。"}, {"word": "learn", "hl": "ear", "levels": ["六级"], "ipa": "/lɜːrn/", "subgroup": "ear", "meaning": "v. 学习；学会；得知", "etymology": "古英语 leornian「学习、跟随轨迹」，日耳曼同根，与德语 lernen 同源。核心义「跟着走→学习」，与 last（持续）、list（倾听，古义）有语源联系。earn（挣得）与 learn 押韵，民间常联系「earn by learn」。", "roots": [{"part": "learn（leornian）", "meaning": "跟随轨迹，学习"}], "phonetics": "l + ear /ɜːr/ + n，和 earn、burn、turn 押韵（-urn/-earn 家族）。注意 ear 在此读 /ɜːr/，不是 /ɪər/。", "tip": "learn by doing（从实践中学）、earn by learn（学到才能赚到）——押韵帮助记忆。", "core": "「跟着走、把路径印进自己脑子」的感觉——可以指学习的过程，可以指最终学会，也可以指得知某个消息，共享「把外部信息纳入自身」的意象。", "senses": [{"gloss": "v. 学习（进行中的过程）", "logic": "「跟随轨迹」→ 持续走在获取知识的路上", "en": "She is learning to play the piano.", "zh": "她正在学弹钢琴。"}, {"gloss": "v. 学会，掌握（达成的结果）", "logic": "「跟随轨迹」→ 走完之后，技能或知识已内化", "en": "You can only learn to speak a language by actually speaking it.", "zh": "学语言只能靠真正开口去说才能学会。"}, {"gloss": "v. 得知，获悉（某消息）", "logic": "「把外部信息纳入自身」→ 知道了本来不知道的事情", "en": "We later learned that he had already left the country.", "zh": "我们后来得知他已经离开了这个国家。"}], "derivatives": [{"w": "learner", "gloss": "学习者，初学者"}, {"w": "learning", "gloss": "学习（过程）；学问，知识"}, {"w": "learned", "gloss": "博学的（形容词，重音在前 /ˈlɜːrnɪd/）；learn 的过去式（/lɜːrnd/）"}], "examples": [{"en": "You can only learn to speak a language by actually speaking it.", "zh": "学语言只能靠真正开口去说才能学会。", "source": "造句"}, {"en": "learn the hard way", "zh": "「从痛苦教训中学会」——经历挫折后才明白道理的高频表达。", "source": "高频搭配"}], "synonyms": [{"w": "study", "ipa": "/ˈstʌdi/", "gloss": "学习，研究（强调主动投入时间精力的过程）", "note": "「学习/研究」，比 learn 更强调主动投入时间和精力的过程；study for an exam（备考）"}, {"w": "acquire", "ipa": "/əˈkwaɪər/", "gloss": "习得，获得（强调通过积累渐进获取）", "note": "「习得、获得」，比 learn 更正式，强调通过过程积累而得；acquire a skill（习得技能）"}, {"w": "grasp", "ipa": "/ɡrɑːsp/", "gloss": "掌握，理解（强调真正理解并能运用）", "note": "「掌握、理解」，强调真正理解并能运用，比 learn 更强调深度；grasp a concept（掌握一个概念）"}], "antonyms": [{"w": "forget", "note": "忘记"}, {"w": "ignore", "note": "忽视、不学"}], "nuance": "learn 既可指过程（I am learning French）也可指结果（I learned how to do it）；study 只指过程，不含「学会」的结果；acquire 强调技能或知识的积累性获得；grasp 强调真正理解，而非只接触过。"}, {"word": "heard", "hl": "ear", "levels": ["六级"], "ipa": "/hɜːrd/", "subgroup": "ear", "meaning": "v. 听到（hear 的过去式和过去分词）", "etymology": "古英语 hēran 的过去式，与 heart（心脏）有古老的亲缘关系——远古日耳曼语中「听」和「心」共享语根，「用心听」的文化印迹留在语言里。heard 是 hear 的不规则过去式，元音从 /ɪər/ 变为 /ɜːr/。", "roots": [{"part": "hear（hēran）", "meaning": "听见，过去式变音为 heard"}], "phonetics": "h + ear /ɜːr/ + d，注意和 hear /hɪər/ 的区别：现在式 hear 读 /ɪər/，过去式 heard 读 /ɜːr/——元音完全不同，是英语中重要的易混淆对。", "tip": "hear /hɪər/ vs heard /hɜːrd/：现在式轻盈（/ɪər/），过去式沉落（/ɜːr/）——事情发生过之后，声音「落地」了。", "core": "「声音已经抵达并落入记忆」的完成感——hear 是当下感知，heard 是已发生、已进入过去的听见，带着「已成事实」的沉实感。", "senses": [{"gloss": "v. 听到（hear 的过去式，单纯表示过去感知到了声音）", "logic": "词的本义的时态变化形式，无引申，唯一义项", "en": "I heard what you said, and I disagree.", "zh": "我听到你说的话了，但我不同意。"}], "derivatives": [{"w": "hear", }], "examples": [{"en": "She arrived early to secure a good seat.", "zh": "她早早赶到，抢占了一个好位置。", "source": "造句"}, {"en": "at an early stage / early adopter", "zh": "「在早期阶段 / 早期用户」——产品和技术语境的高频搭配。", "source": "高频搭配"}], "synonyms": [{"w": "ahead of time", "gloss": "提前，早于计划", "note": "「提前、早于预定」，比 early 更强调超前于计划；arrive ahead of time（提前到达）"}, {"w": "prompt", "ipa": "/prɒmpt/", "gloss": "及时的，不拖延的", "note": "「及时、准时」，比 early 更强调不拖延、按时行动；prompt payment（及时付款）"}, {"w": "initial", "ipa": "/ɪˈnɪʃl/", "gloss": "最初的，开始时的", "note": "「最初的」义的近义，比 early 更书面，用于「早期阶段」的 early 可替换；initial stage（初期阶段）"}], "antonyms": [{"w": "late", "note": "晚、迟到"}, {"w": "overdue", "note": "逾期、过时"}], "nuance": "early 是最通用的「早」，同时形容时间节点（come early）和历史时期（early civilization）；prompt 强调守时、不拖延，多正面含义；initial 只形容「最初阶段」，不可形容「早到」这一行为。"}, {"word": "search", "hl": "ear", "levels": ["六级"], "ipa": "/sɜːrtʃ/", "subgroup": "ear", "meaning": "v. 搜索；搜查；检索  n. 搜索；搜查", "etymology": "古法语 cerchier「绕圈检查」，源自拉丁语 circare = circare(绕圈)，与 circle（圆）同根。「绕圈检查」→ 搜索——搜索的本质是「围绕目标画圆，不遗漏」。", "roots": [{"part": "search（circare）", "meaning": "绕圈检查、搜索"}], "phonetics": "s + ear /ɜːr/ + ch /tʃ/，与 church 共享 ear + ch 的组合；注意 ea 读 /ɜːr/ 不是 /ɪər/。", "tip": "search 和 circle 同根（circare = 绕圈）——搜索的本质是绕圈不遗漏，这个词源图像帮助理解「搜索」的全面性。", "core": "「绕圈不遗漏地找」的感觉——系统性地覆盖一个范围以找到目标，无论是翻找房间、检索数据库还是寻求某种答案，都带着「不放过任何角落」的彻底感。", "senses": [{"gloss": "v. 搜索，翻找（在某空间或范围内寻找）", "logic": "「绕圈检查」→ 在物理空间中不遗漏地找", "en": "Police searched the building for several hours.", "zh": "警察搜查了这栋楼好几个小时。"}, {"gloss": "v. 检索，在数据中搜索", "logic": "「绕圈检查」→ 在信息海洋中系统性地找", "en": "She searched the internet for hours but couldn't find a reliable source.", "zh": "她在网上搜索了好几个小时，却找不到可靠的来源。"}, {"gloss": "v. 搜查（人身或场所，多指执法行为）", "logic": "「绕圈检查」→ 对人身或场所进行系统性检查", "en": "Customs officers searched his luggage at the border.", "zh": "海关人员在边境对他的行李进行了搜查。"}, {"gloss": "n. 搜索，搜查（动词义名词化）", "logic": "行为本身被名词化", "en": "The search for the missing hiker lasted three days.", "zh": "对失踪登山者的搜寻持续了三天。"}], "derivatives": [{"w": "research", "gloss": "研究，调查（re- 再次搜索→深入研究）"}, {"w": "searcher", "gloss": "搜索者，搜查者"}, {"w": "search engine", "gloss": "搜索引擎"}], "examples": [{"en": "She searched the internet for hours but couldn't find a reliable source.", "zh": "她在网上搜索了好几个小时，却找不到可靠的来源。", "source": "造句"}, {"en": "in search of / search engine", "zh": "「寻找……/ 搜索引擎」——两个最高频的 search 搭配。", "source": "高频搭配"}], "synonyms": [{"w": "seek", "ipa": "/siːk/", "gloss": "寻求，寻找（书面语，强调目的和渴望）", "note": "「寻求、寻找」，比 search 更书面，强调目的和渴望，不强调过程；seek help（寻求帮助）"}, {"w": "look for", "gloss": "找（最口语的表达，不含系统性搜索义）", "note": "「找」的口语说法，比 search 更随意；search 含「系统性/彻底地」搜索的含义"}, {"w": "investigate", "ipa": "/ɪnˈvestɪɡeɪt/", "gloss": "调查，查明（系统性探究目的和原因）", "note": "「调查」，比 search 更强调系统性探究目的和原因；investigate a crime（调查犯罪）"}], "antonyms": [{"w": "find", "note": "找到（搜索的结果）"}, {"w": "ignore", "note": "忽视、不寻找"}], "nuance": "search 强调系统性地翻找（search a room）或在大量信息中检索（search the internet）；seek 更文学、更正式，侧重「渴望找到某物」的目的（seek truth）；look for 是最口语的「找」；investigate 超出「搜索」义，更强调弄清楚原因和事实。"}]}</script>
<script>
const G = JSON.parse(document.getElementById('data').textContent);
const KEY = 'vocab-unfam-' + G.id;
let unfam = new Set(JSON.parse(localStorage.getItem(KEY) || '[]'));
let curLv = '全部', curSg = '全部', curQ = '', onlyUnfam = false;

const LVCLASS = {'六级':'lv6','托福':'tfl','GRE拓展':'gre','基础':''};
// 发音分组配色（按 subgroups 顺序循环取用）
const SGCOLORS = ['#2f8f83','#b0603f','#6a52a8','#c1662f','#3a7bd5'];
const SUBG = G.subgroups || [];
function sgIndex(key){ const i=SUBG.findIndex(s=>s.key===key); return i<0?0:i; }
function sgColor(key){ return SGCOLORS[sgIndex(key)%SGCOLORS.length]; }
function sgOf(key){ return SUBG.find(s=>s.key===key); }

// ---------- header
function renderHero(){
  const h = document.getElementById('hero');
  const rules = SUBG.map((s,i)=>{
    const c = SGCOLORS[i%SGCOLORS.length];
    return `<div class="rule" style="border-left:5px solid ${c}"><b style="color:${c}">${s.label}</b>${s.desc||''}</div>`;
  }).join('');
  const rhymes = (G.rhymeChains && G.rhymeChains.length)
    ? `<div class="rhymes"><h3>🎵 同韵顺口溜 · 点单词听发音，成串背最快</h3>${
        G.rhymeChains.map(c=>`<div class="chain"><span class="lab">${c.label}</span>${
          c.words.map(w=>`<span class="chip" onclick="say('${w}')">${w}</span>`).join('')
        }</div>`).join('')}</div>`
    : '';
  h.innerHTML = `
    <div class="combo"><span class="big">${G.combo}</span><span class="snd">${G.sound}</span></div>
    <h1>${G.title} · ${G.subtitle||''}</h1>
    <p class="intro">${G.intro}</p>
    <div class="rules">${rules}</div>
    ${rhymes}`;
}

// ---------- 精读：文章 + 句法分析
let speaking=false;
function sayPassage(btn){
  if(speaking){ speechSynthesis.cancel(); speaking=false; if(btn) btn.textContent='🔊 朗读全文'; return; }
  const P = G.passage; if(!P) return;
  const texts = (P.paragraphs||[]).map(p=>p.en).filter(Boolean);
  if(!texts.length) return;
  if(!VOICE) pickVoice();
  speaking=true; if(btn) btn.textContent='⏹ 停止朗读';
  let last=null;
  texts.forEach((t,i)=>{
    const u = new SpeechSynthesisUtterance(t);
    u.lang='en-US'; if(VOICE) u.voice=VOICE; u.rate=.95; u.pitch=1.0;
    if(i===texts.length-1) last=u;
    speechSynthesis.speak(u);
  });
  if(last) last.onend=()=>{ speaking=false; if(btn) btn.textContent='🔊 朗读全文'; };
}
function renderPassage(){
  const el = document.getElementById('passage');
  const P = G.passage; if(!P){ el.style.display='none'; return; }
  const paras = (P.paragraphs||[]).map(p=>{
    let en = p.en||'';
    // 高亮关键词（p.kws 或自动匹配词表词）
    const kws = p.kws || [];
    kws.forEach(k=>{ en = en.replace(new RegExp('('+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'), '<span class="kw" onclick="say(\'$1\')">$1</span>'); });
    return `<p><div class="en">${en}</div>${p.zh?`<div class="zh">${p.zh}</div>`:''}</p>`;
  }).join('');
  el.innerHTML = `<div class="passage"><h2>📖 精读原文</h2>
    <div class="p-title">${P.title||''} <button class="readall" onclick="sayPassage(this)">🔊 朗读全文</button></div>
    ${paras}</div>`;
}
const ROLECOLOR = { '主语':'#2f8f83','谓语':'#c1662f','宾语':'#3a7bd5','状语':'#6a52a8','定语':'#b0603f','补语':'#c1662f','从句':'#8c8072','连词':'#8c8072','介词':'#8c8072','插入语':'#8c8072','同位语':'#b0603f' };
function roleColor(r){ return ROLECOLOR[r] || '#6a52a8'; }
function escAttr(s){ return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
// 句子内括号标注：介词短语 ( ) · 从句 [ ] · 非谓语 { }
const BRK = {'pp':['(',')'], 'cl':['[',']'], 'nf':['{','}']};
const BRKC = {'pp':'#6a52a8', 'cl':'#3a7bd5', 'nf':'#b0603f'};
function renderFlow(s){
  let html='';
  (s.flow||[]).forEach(it=>{
    if(it.open){ const k=it.open; html+=`<span class="brkbox" style="background:${BRKC[k]}16;border-bottom:2px solid ${BRKC[k]}66"><b class="brk" style="color:${BRKC[k]}">${BRK[k][0]}</b>`; }
    else if(it.close){ const k=it.close; html+=`<b class="brk" style="color:${BRKC[k]}">${BRK[k][1]}</b></span>`; }
    else { html+=escAttr(it.t); }
  });
  return html;
}
function renderSents(){
  const el = document.getElementById('sents');
  const S = G.sentences; if(!S || !S.length){ el.style.display='none'; return; }
  const items = S.map((s,i)=>{
    const flowHtml = (s.flow && s.flow.length) ? renderFlow(s) : escAttr(s.en);
    const parts = (s.parts||[]).map(p=>{
      const c = roleColor(p.r);
      return `<span class="spart" style="background:${c}18;border:1px solid ${c}55">
        <span class="st" style="color:${c}">${escAttr(p.t)}</span>
        <span class="sr" style="background:${c}">${p.r}</span>
        ${p.n?`<span class="sn">${p.n}</span>`:''}</span>`;
    }).join('');
    return `<div class="sent">
      <div class="s-flow" data-en="${escAttr(s.en)}" onclick="say(this.dataset.en)" title="点句子朗读">${flowHtml} <button class="say-mini" data-en="${escAttr(s.en)}" onclick="event.stopPropagation();say(this.dataset.en)" title="朗读">🔊</button></div>
      ${s.zh?`<div class="s-zh">${s.zh}</div>`:''}
      <div class="s-parts">${parts}</div>
      ${s.note?`<div class="snotes">${s.note}</div>`:''}</div>`;
  }).join('');
  el.innerHTML = `<div class="sents"><h2>🔍 长难句 · 句法分析</h2>
    <div class="s-sub">点英文句可朗读 · 括号标注：<b style="color:#6a52a8">( ) 介词短语</b> · <b style="color:#3a7bd5">[ ] 从句</b> · <b style="color:#b0603f">{ } 非谓语动词</b> · 下方色块=成分功能</div>
    ${items}</div>`;
}

// ---------- filters
function renderFilters(){
  const lvs = ['全部','六级','托福','GRE拓展','基础'];
  document.getElementById('lvf').innerHTML = lvs.map(l=>
    `<span class="f${l===curLv?' on':''}" onclick="setLv('${l}')">${l}</span>`).join('');
  const sgs = [['全部','全部'], ...SUBG.map(s=>[s.tag||s.label, s.key])];
  document.getElementById('sgf').innerHTML = sgs.map(([t,v])=>
    `<span class="f${v===curSg?' on':''}" onclick="setSg('${v}')">${t}</span>`).join('');
}
function setLv(l){curLv=l;renderFilters();renderGrid();}
function setSg(s){curSg=s;renderFilters();renderGrid();}

// ---------- speech：优先自然美式女声
let VOICE=null, VOICES=[];
// 各浏览器/系统里公认自然的美式女声，按优先级排序
const PREF=[
  'Google US English',                 // Chrome：自然女声
  'Microsoft Aria Online (Natural) - English (United States)',
  'Microsoft Jenny Online (Natural) - English (United States)',
  'Microsoft Ava Online (Natural) - English (United States)',
  'Microsoft Aria','Microsoft Jenny','Microsoft Michelle',
  'Ava (Premium)','Ava (Enhanced)','Ava',   // macOS Siri 女声
  'Samantha',                          // macOS 经典美式女声
  'Allison','Susan','Nicky','Zoe','Karen','Victoria'
];
const MALE=/(alex|daniel|fred|tom|david|mark|male|aaron|arthur|gordon|oliver|rishi|junior|ralph)/i;
function usPool(){
  VOICES = speechSynthesis.getVoices()||[];
  let us = VOICES.filter(v=>/en[-_]US/i.test(v.lang)||/United States/i.test(v.name));
  if(!us.length) us = VOICES.filter(v=>/^en/i.test(v.lang));
  return us;
}
function pickVoice(){
  const pool=usPool(); if(!pool.length) return;
  VOICE=null;
  for(const n of PREF){ const h=pool.find(v=>v.name===n)||pool.find(v=>v.name.indexOf(n)===0); if(h){VOICE=h;break;} }
  if(!VOICE) VOICE = pool.find(v=>/(samantha|ava|allison|susan|nicky|zoe|karen|victoria|aria|jenny|michelle|female|google us)/i.test(v.name))
                   || pool.find(v=>!MALE.test(v.name)) || pool[0];
  fillVoiceSel(pool);
}
function fillVoiceSel(pool){
  const s=document.getElementById('voiceSel'); if(!s) return;
  s.innerHTML = pool.map(v=>{
    const nm=v.name.replace(/ - English.*/,'').replace(/Online \(Natural\)/,'✨');
    return `<option value="${v.name}"${VOICE&&v.name===VOICE.name?' selected':''}>🎙 ${nm}</option>`;
  }).join('');
}
document.getElementById('voiceSel').addEventListener('change',e=>{
  VOICE = VOICES.find(v=>v.name===e.target.value)||VOICE; say(G.combo==='aw'?'awesome':'natural');
});
if('onvoiceschanged' in speechSynthesis) speechSynthesis.onvoiceschanged = pickVoice;
pickVoice();
function say(w){
  try{
    if(!VOICE) pickVoice();
    const u = new SpeechSynthesisUtterance(w);
    u.lang='en-US'; if(VOICE) u.voice=VOICE; u.rate=.95; u.pitch=1.0;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }catch(e){}
}

// 高亮单词里的目标拼写：优先用该词自带的 hl（音位页里每词各自的拼写），否则用组的 combo
function hlWord(word, spell){
  const c = (spell||'').replace(/[.*+?^${}()|[\]\\\/·\s]/g,'');  // 只取干净字母做高亮，去掉 / · 空格等
  if(!c) return word;
  try{ return word.replace(new RegExp('('+c+')','i'), '<span class="hl">$1</span>'); }
  catch(e){ return word; }
}

// ---------- card
function card(w){
  const tags = (w.levels||[]).map(l=>`<span class="tag ${LVCLASS[l]||''}">${l}</span>`).join('');
  const roots = (w.roots||[]).map(r=>`<span class="root"><b>${r.part}</b> ${r.meaning}</span>`).join('');
  const exs = (w.examples||[]).map(e=>{
    const fam = /造句/.test(e.source)? '' : ' famous';
    return `<div class="ex${fam}"><div class="en">${e.en}</div><div class="zh">${e.zh}</div><span class="src">— ${e.source}</span></div>`;
  }).join('');
  const syns = (w.synonyms||[]).map(s=>
    `<div class="lex"><b class="lw" onclick="event.stopPropagation();say('${s.w}')">${s.w}</b>`+
    `${s.ipa?` <span class="lip">${s.ipa}</span>`:''}${s.note?` <span class="ln">— ${s.note}</span>`:''}</div>`).join('');
  const ants = (w.antonyms||[]).map(a=>
    `<span class="antchip" onclick="event.stopPropagation();say('${a.w}')">${a.w}${a.note?` <i>${a.note}</i>`:''}</span>`).join('');
  const lexSec = (syns||ants||w.nuance)
    ? `<div class="sec"><span class="l">🔗 近义词辨析 · 反义词</span>`+
      `${syns?`<div class="lexgroup"><span class="lextag syn">近义</span><div class="lexlist">${syns}</div></div>`:''}`+
      `${ants?`<div class="lexgroup"><span class="lextag ant">反义</span><div class="lexlist antline">${ants}</div></div>`:''}`+
      `${w.nuance?`<div class="nuance">🎯 ${w.nuance}</div>`:''}</div>`
    : '';
  const senses = (w.senses||[]).map(s=>
    `<div class="sense"><div class="s-gloss"><b>${s.gloss}</b>${s.logic?` <span class="s-logic">← ${s.logic}</span>`:''}</div>`+
    `${s.en?`<div class="s-ex"><span class="s-en">${s.en}</span> <span class="s-zh">${s.zh||''}</span></div>`:''}</div>`).join('');
  const senseSec = (w.core||senses)
    ? `<div class="sec"><span class="l">🧠 一词多义 · 核心意象串解</span>`+
      `${w.core?`<div class="coreimg">🎯 核心感觉：${w.core}</div>`:''}${senses}</div>`
    : '';
  const isU = unfam.has(w.word);
  const so = sgOf(w.subgroup);
  return `<div class="card${isU?' unfamiliar':''}" data-w="${w.word}" onclick="if(document.body.classList.contains('mem'))this.classList.toggle('reveal')">
    <span class="sub-tag" style="background:${sgColor(w.subgroup)}">${so?(so.tag||so.label):''}</span>
    <div class="whead">
      <span class="word">${hlWord(w.word, w.hl || G.combo)}</span>
      <span class="ipa">${w.ipa}</span>
      <button class="say" onclick="event.stopPropagation();say('${w.word}')" title="朗读">🔊</button>
    </div>
    <div class="tags">${tags}</div>
    <div class="mean">${w.meaning}</div>
    ${senseSec}
    ${w.etymology?`<div class="sec"><span class="l">🏛 造词来源 · 词源故事</span>${w.etymology}</div>`:''}
    ${roots?`<div class="sec"><span class="l">🧩 词根词缀</span><div class="roots">${roots}</div></div>`:''}
    ${w.phonetics?`<div class="sec"><span class="l">🗣 发音规律</span>${w.phonetics}</div>`:''}
    ${w.tip?`<div class="sec"><span class="l">💡 记忆钩子</span><div class="tip">${w.tip}</div></div>`:''}
    ${exs?`<div class="sec"><span class="l">✍️ 造句 · 名著/影视例句</span>${exs}</div>`:''}
    ${lexSec}
    <label class="check" onclick="event.stopPropagation()">
      <input type="checkbox" ${isU?'checked':''} onchange="toggleUnfam('${w.word}',this.checked)"> 🔺 标记不熟悉
    </label>
  </div>`;
}

function match(w){
  if(onlyUnfam && !unfam.has(w.word)) return false;
  if(curLv!=='全部' && !(w.levels||[]).includes(curLv)) return false;
  if(curSg!=='全部' && w.subgroup!==curSg) return false;
  if(curQ){
    const s=(w.word+' '+w.meaning).toLowerCase();
    if(!s.includes(curQ.toLowerCase())) return false;
  }
  return true;
}

function renderGrid(){
  const list = G.words.filter(match);
  // 不熟悉的置顶（稳定排序，保持各自原有相对顺序）
  list.sort((a,b)=>(unfam.has(b.word)?1:0)-(unfam.has(a.word)?1:0));
  const g = document.getElementById('grid');
  g.innerHTML = list.length? list.map(card).join('') : '<div class="empty">没有匹配的单词，换个筛选试试～</div>';
  updateUnfamCount();
}

function toggleUnfam(word, on){
  if(on) unfam.add(word); else unfam.delete(word);
  localStorage.setItem(KEY, JSON.stringify([...unfam]));
  const c = document.querySelector(`.card[data-w="${word}"]`);
  if(c) c.classList.toggle('unfamiliar', on);   // 立即变色，卡片原位不跳动；置顶在下次渲染/筛选时生效
  updateUnfamCount();
}
function updateUnfamCount(){
  const n = G.words.filter(w=>unfam.has(w.word)).length;
  const el = document.getElementById('unfamN');
  if(el) el.textContent = n;
}

document.getElementById('q').addEventListener('input',e=>{curQ=e.target.value;renderGrid();});
document.getElementById('unfamBtn').addEventListener('click',e=>{
  onlyUnfam=!onlyUnfam;
  e.currentTarget.classList.toggle('on',onlyUnfam);
  renderGrid();
});
document.getElementById('memBtn').addEventListener('click',e=>{
  document.body.classList.toggle('mem');
  e.target.classList.toggle('on');
  e.target.textContent = document.body.classList.contains('mem')?'🧠 记忆模式(开)·悬停显形':'🧠 记忆模式';
});

// ---------- 测验：英文 → 中文四选一（覆盖当前筛选到的全部单词）
let quiz=null;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
// 测验池 = 本页(筛选后)全部词 + 它们的同义词 + 衍生词（去重）
function quizPool(){
  const base = G.words.filter(match);
  const items=[]; const seen=new Set();
  const add=(word,ipa,meaning)=>{const k=(word||'').toLowerCase();
    if(!word||!meaning||seen.has(k))return; seen.add(k); items.push({word,ipa:ipa||'',meaning});};
  base.forEach(w=>{
    add(w.word,w.ipa,w.meaning);
    (w.synonyms||[]).forEach(s=>add(s.w,s.ipa,s.gloss||s.note));
    (w.derivatives||[]).forEach(dv=>add(dv.w,dv.ipa,dv.gloss||dv.note));
  });
  return items;
}
function startQuiz(src){
  const pool = src || quizPool();
  if(pool.length<4){ alert('至少要有 4 个词才能测验，请先放宽上方筛选～'); return; }
  quiz={list:shuffle(pool), i:0, score:0, wrong:[], done:false, next:null, pool:quizPool()};
  document.getElementById('quizOv').style.display='flex';
  renderQ();
}
function renderQ(){
  quiz.done=false; quiz.next=null;
  const q=quiz.list[quiz.i];
  const others=(quiz.pool||[]).filter(w=>w.meaning!==q.meaning);
  const opts=shuffle([q.meaning, ...shuffle(others).slice(0,3).map(w=>w.meaning)]);
  const K=['1','2','3','4'];
  document.getElementById('qbox').innerHTML=`
    <div class="qtop"><span>第 ${quiz.i+1} / ${quiz.list.length} 题 · 已答对 ${quiz.score}</span>
      <span style="cursor:pointer" onclick="closeQuiz()">✕ 关闭</span></div>
    <div class="qbar2"><i style="width:${quiz.i/quiz.list.length*100}%"></i></div>
    <div class="qword">${q.word} <button class="say" style="vertical-align:middle;width:30px;height:30px;font-size:14px" onclick="say('${q.word}')">🔊</button></div>
    <div class="qipa">${q.ipa}</div>
    <div class="qopts" id="qopts">${opts.map((o,k)=>
      `<button class="qopt" data-m="${encodeURIComponent(o)}" onclick="answer(this,'${encodeURIComponent(q.meaning)}')">
        <span class="k">${K[k]}</span><span>${o}</span></button>`).join('')}</div>
    <div class="hint">按 1–4 键作答 · 回车进入下一题</div>`;
  say(q.word);
}
function answer(el, correctEnc){
  if(quiz.done) return; quiz.done=true;
  const correct=decodeURIComponent(correctEnc);
  const chosen=decodeURIComponent(el.dataset.m);
  if(chosen===correct) quiz.score++; else quiz.wrong.push(quiz.list[quiz.i]);
  document.querySelectorAll('#qopts .qopt').forEach(b=>{
    const m=decodeURIComponent(b.dataset.m);
    if(m===correct) b.classList.add('right');
    else if(b===el) b.classList.add('wrong');
    else b.classList.add('dim');
    b.style.pointerEvents='none';
  });
  const btn=document.createElement('button');
  btn.className='qnext';
  btn.textContent = quiz.i<quiz.list.length-1 ? '下一题 →' : '看结果 →';
  btn.onclick=nextQ;
  document.getElementById('qbox').appendChild(btn);
  quiz.next=btn;
}
function nextQ(){
  if(quiz.i<quiz.list.length-1){ quiz.i++; renderQ(); } else endQuiz();
}
function endQuiz(){
  const tot=quiz.list.length, pct=Math.round(quiz.score/tot*100);
  const wrongHtml = quiz.wrong.length
    ? quiz.wrong.map(w=>`<div class="r"><b>${w.word}</b> ${w.ipa} — ${w.meaning}</div>`).join('')
    : '<div class="r">全部答对，太强了！🎉</div>';
  const wrongCopy = quiz.wrong.slice();
  document.getElementById('qbox').innerHTML=`
    <div class="qend">
      <div class="qtop" style="justify-content:flex-end"><span style="cursor:pointer" onclick="closeQuiz()">✕ 关闭</span></div>
      <div>本轮得分</div><div class="qscore">${quiz.score}/${tot}</div>
      <div style="color:var(--muted)">正确率 ${pct}%</div>
      <div class="qwrong"><div style="color:var(--exc);font-weight:700;margin-bottom:4px">错题（${quiz.wrong.length}）</div>${wrongHtml}</div>
      <div id="qendBtns"></div>
    </div>`;
  const box=document.getElementById('qendBtns');
  if(wrongCopy.length){
    const b1=document.createElement('button'); b1.className='qnext'; b1.textContent='只测这些错题';
    b1.onclick=()=>startQuiz(wrongCopy); box.appendChild(b1);
  }
  const b2=document.createElement('button'); b2.className='qnext';
  b2.style.cssText='background:#fff;color:var(--accent);border:1.5px solid var(--accent);margin-top:8px';
  b2.textContent='再来一轮（当前筛选）'; b2.onclick=()=>startQuiz(); box.appendChild(b2);
}
function closeQuiz(){ document.getElementById('quizOv').style.display='none'; quiz=null; }
document.getElementById('quizBtn').addEventListener('click',()=>startQuiz());
document.getElementById('quizOv').addEventListener('click',e=>{ if(e.target.id==='quizOv') closeQuiz(); });
document.addEventListener('keydown',e=>{
  if(!quiz || document.getElementById('quizOv').style.display==='none') return;
  if(quiz.next && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); quiz.next.click(); return; }
  if(!quiz.done && /^[1-4]$/.test(e.key)){ const b=document.querySelectorAll('#qopts .qopt')[+e.key-1]; if(b) b.click(); }
});

document.getElementById('foot').innerHTML =
  `共 ${G.words.length} 词 · 数据源：托福 4264 词表（真实词库）+ 六级核心词 · `+
  `发音由浏览器语音合成朗读 · 名著/影视例句均为真实出处，「造句」为学习例句，「高频搭配」为常用短语。`;

renderHero(); renderPassage(); renderSents(); renderFilters(); renderGrid();
</script>
