<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>/ŋ/ 舌根鼻音 · 单词拆解卡片</title>
<style>
  :root{
    --bg:#f7f1e7; --card:#fffdf8; --ink:#2f2a24; --muted:#8c8072;
    --line:#eaddc9; --accent:#c1662f; --accent2:#e0913c; --amber:#fbe6c4;
    --core:#2f8f83; --exc:#b0603f; --ok:#4a9a5e;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,"PingFang SC","Helvetica Neue",Segoe UI,sans-serif;
    line-height:1.6;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1180px;margin:0 auto;padding:26px 20px 90px}
  a{color:var(--accent);text-decoration:none}
  .top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
  .top a{color:var(--muted)}
  /* header */
  header.hero{margin:14px 0 22px}
  .combo{display:inline-flex;align-items:baseline;gap:14px}
  .combo .big{font-family:Georgia,"Times New Roman",serif;font-size:60px;font-weight:700;
    background:var(--amber);color:var(--accent);padding:2px 20px;border-radius:18px;line-height:1.1}
  .combo .snd{font-size:30px;color:var(--core);font-weight:700}
  h1{font-size:23px;margin:14px 0 4px}
  .intro{color:#5f574c;max-width:860px;font-size:15px}
  /* rule cards */
  .rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin:18px 0}
  .rule{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:14px}
  .rule.core{border-left:5px solid var(--core)}
  .rule.exc{border-left:5px solid var(--exc)}
  .rule b{display:block;margin-bottom:4px;font-size:14px}
  .rule.core b{color:var(--core)} .rule.exc b{color:var(--exc)}
  /* rhyme chains */
  .rhymes{background:linear-gradient(135deg,#fff6e8,#fdeede);border:1px dashed var(--accent2);
    border-radius:14px;padding:14px 16px;margin-bottom:20px}
  .rhymes h3{margin:0 0 8px;font-size:15px;color:var(--accent)}
  .chain{margin:6px 0;font-size:14px}
  .chain .lab{color:var(--muted);margin-right:8px}
  .chip{display:inline-block;background:#fff;border:1px solid var(--line);border-radius:20px;
    padding:2px 11px;margin:3px 4px 3px 0;cursor:pointer;font-family:Georgia,serif;font-size:15px;transition:.15s}
  .chip:hover{background:var(--amber);border-color:var(--accent2)}
  /* toolbar */
  .toolbar{position:sticky;top:0;z-index:20;background:rgba(247,241,231,.94);backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);padding:12px 0;margin-bottom:18px;
    display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .search{flex:1;min-width:180px;padding:8px 13px;border:1px solid var(--line);border-radius:10px;
    font-size:14px;background:#fff}
  .filters{display:flex;flex-wrap:wrap;gap:6px}
  .f{padding:6px 12px;border:1px solid var(--line);background:#fff;border-radius:20px;font-size:13px;
    cursor:pointer;color:#6b6154;transition:.15s}
  .f.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  select.f{max-width:170px;color:#6b6154;cursor:pointer}
  .btn{padding:7px 14px;border:1px solid var(--accent);background:#fff;color:var(--accent);
    border-radius:20px;font-size:13px;cursor:pointer;font-weight:600}
  .btn.on{background:var(--accent);color:#fff}
  .prog{font-size:13px;color:var(--muted);white-space:nowrap}
  .bar{height:6px;background:var(--line);border-radius:6px;width:120px;overflow:hidden;display:inline-block;vertical-align:middle}
  .bar>i{display:block;height:100%;background:var(--ok);width:0}
  /* cards */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 17px;
    box-shadow:0 2px 10px rgba(150,120,70,.06);display:flex;flex-direction:column;gap:10px;position:relative}
  .card.unfamiliar{border-color:#e08a3c;background:#fff7ec;box-shadow:0 2px 14px rgba(210,120,40,.20)}
  .card .sub-tag{position:absolute;top:0;right:16px;transform:translateY(-50%);
    font-size:11px;padding:2px 9px;border-radius:10px;color:#fff}
  .sub-core{background:var(--core)} .sub-exc{background:var(--exc)}
  .whead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .word{font-family:Georgia,"Times New Roman",serif;font-size:30px;font-weight:700;letter-spacing:.5px}
  .word .hl{background:var(--amber);color:var(--accent);border-radius:6px;padding:0 3px}
  .ipa{color:var(--core);font-size:16px;font-weight:600}
  .say{margin-left:auto;border:none;background:var(--amber);color:var(--accent);border-radius:50%;
    width:34px;height:34px;font-size:16px;cursor:pointer;flex:none}
  .say:hover{background:var(--accent2);color:#fff}
  .tags{display:flex;gap:5px;flex-wrap:wrap}
  .tag{font-size:11px;padding:1px 8px;border-radius:9px;background:#f0e7d6;color:#8a6a3c}
  .tag.lv6{background:#e6f0ec;color:#2f8f83}
  .tag.tfl{background:#eae6f5;color:#6a52a8}
  .tag.gre{background:#f7e6ea;color:#b0507a}
  .tag.spk{background:#fdeccd;color:#b5661f}
  .tag.scn{background:#e4f0e6;color:#3d7a4a}
  .mean{font-size:15.5px;font-weight:600;color:#3a332b}
  .sec{font-size:13.5px;color:#4d463c;border-top:1px dashed var(--line);padding-top:8px}
  .sec .l{font-size:11.5px;color:var(--accent);font-weight:700;letter-spacing:.5px;display:block;margin-bottom:2px}
  .roots{display:flex;flex-wrap:wrap;gap:6px}
  .root{background:#f6efe1;border-radius:8px;padding:3px 9px;font-size:12.5px}
  .root b{font-family:Georgia,serif;color:var(--accent)}
  .tip{background:#fff6e8;border-left:3px solid var(--accent2);padding:5px 10px;border-radius:0 8px 8px 0;font-size:13px}
  /* 一词多义 · 核心意象 */
  .coreimg{background:#f4f0e5;border-radius:8px;padding:6px 10px;font-size:13.5px;color:#5a4a2e;margin-bottom:7px}
  .sense{border-left:3px solid var(--accent2);padding:3px 0 3px 10px;margin:6px 0}
  .sense .s-gloss{font-size:14px}
  .sense .s-gloss b{color:#3a332b}
  .sense .s-logic{color:var(--accent);font-size:12.5px}
  .sense .s-ex{margin-top:2px;font-size:13px}
  .sense .s-en{font-family:Georgia,serif;color:#2f2a24}
  .sense .s-zh{color:#6b6154}
  .ex{margin:7px 0}
  .ex .en{font-family:Georgia,serif;font-size:14px;color:#2f2a24}
  .ex .zh{color:#6b6154;font-size:13px}
  .ex .src{display:inline-block;font-size:11px;color:#a89a86;margin-top:1px}
  .ex.famous{background:#fbf4e7;border-radius:8px;padding:7px 10px}
  /* 近义词辨析 / 反义词 */
  .lexgroup{display:flex;gap:8px;margin:4px 0;align-items:flex-start}
  .lextag{flex:none;font-size:11px;font-weight:700;padding:1px 8px;border-radius:8px;margin-top:3px}
  .lextag.syn{background:#e6f0ec;color:#2f8f83}
  .lextag.ant{background:#f7e6ea;color:#b0507a}
  .lexlist{display:flex;flex-direction:column;gap:3px;font-size:13.5px;flex:1}
  .lexlist.antline{flex-direction:row;flex-wrap:wrap;gap:6px;align-items:center}
  .lex .lw{font-family:Georgia,serif;color:var(--accent);cursor:pointer;font-weight:600}
  .lex .lw:hover{text-decoration:underline}
  .lex .lip{color:var(--core);font-size:12px}
  .lex .ln{color:#5f574c}
  .antchip{background:#faf0f2;border-radius:8px;padding:2px 9px;cursor:pointer;font-family:Georgia,serif;font-size:13px;color:#b0507a}
  .antchip:hover{background:#f6e3e8}
  .antchip i{font-style:normal;color:#9a8f86;font-size:12px}
  .nuance{background:#eef6f3;border-left:3px solid var(--core);padding:6px 10px;border-radius:0 8px 8px 0;font-size:13px;margin-top:7px;color:#33463f}
  /* memorize mode hides meaning+detail until hover/click */
  body.mem .mean, body.mem .sec{filter:blur(5px);transition:.15s;cursor:pointer}
  body.mem .card:hover .mean, body.mem .card.reveal .mean,
  body.mem .card:hover .sec, body.mem .card.reveal .sec{filter:none}
  .check{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer;margin-top:2px}
  .check input{width:16px;height:16px;accent-color:#c1662f}
  .card.unfamiliar .check{color:#c1662f;font-weight:600}
  .empty{text-align:center;color:var(--muted);padding:40px;grid-column:1/-1}
  footer{margin-top:36px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
  /* 测验 */
  #quizOv{display:none;position:fixed;inset:0;background:rgba(47,42,36,.55);z-index:50;
    align-items:center;justify-content:center;padding:18px}
  .qbox{background:var(--card);border-radius:20px;max-width:560px;width:100%;padding:22px 24px 20px;
    box-shadow:0 24px 70px rgba(0,0,0,.32);max-height:92vh;overflow:auto}
  .qtop{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px;margin-bottom:8px}
  .qbar2{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:16px}
  .qbar2>i{display:block;height:100%;background:var(--accent);width:0;transition:.3s}
  .qword{font-family:Georgia,serif;font-size:40px;font-weight:700;text-align:center;margin:4px 0 2px}
  .qipa{text-align:center;color:var(--core);font-size:16px;margin-bottom:16px}
  .qopts{display:grid;gap:10px}
  .qopt{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:11px 14px;font-size:14.5px;
    cursor:pointer;text-align:left;transition:.12s;display:flex;gap:10px;align-items:flex-start;font-family:inherit;color:var(--ink)}
  .qopt:hover{border-color:var(--accent2);background:#fffaf0}
  .qopt .k{font-weight:700;color:var(--accent);flex:none}
  .qopt.right{border-color:var(--ok);background:#eafaef}
  .qopt.wrong{border-color:var(--exc);background:#fdeeea}
  .qopt.dim{opacity:.45}
  .qnext{margin-top:14px;width:100%;padding:12px;border:none;border-radius:12px;background:var(--accent);
    color:#fff;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
  .qend{text-align:center}
  .qscore{font-size:46px;font-weight:800;color:var(--accent);margin:4px 0}
  .qwrong{text-align:left;margin:14px 0;max-height:34vh;overflow:auto}
  .qwrong .r{border-top:1px dashed var(--line);padding:7px 0;font-size:14px}
  .qwrong .r b{font-family:Georgia,serif;color:var(--exc)}
  .hint{text-align:center;color:var(--muted);font-size:12px;margin-top:10px}
  /* 精读 · 文章 + 句法分析 */
  .passage{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--accent);
    border-radius:14px;padding:18px 20px;margin:0 0 22px}
  .passage h2{margin:0 0 10px;font-size:18px;color:var(--accent)}
  .passage .p-title{font-family:Georgia,serif;font-size:20px;font-weight:700;color:var(--ink);margin-bottom:10px}
  .passage p{font-size:15px;line-height:1.9;margin:10px 0}
  .passage .en{color:#3a332b;font-family:Georgia,"Times New Roman",serif}
  .passage .zh{color:var(--muted);font-size:13.5px}
  .passage .kw{cursor:pointer;color:var(--accent);font-weight:600;border-bottom:1px dotted var(--accent2)}
  .readall{background:var(--accent);color:#fff;border:none;border-radius:20px;padding:4px 14px;font-size:13px;
    cursor:pointer;margin-left:10px;vertical-align:middle;transition:.15s}
  .readall:hover{background:var(--core)}
  .sents{background:linear-gradient(135deg,#f3f8f6,#eef3f0);border:1px solid var(--line);
    border-radius:14px;padding:18px 20px;margin:0 0 22px}
  .sents h2{margin:0 0 6px;font-size:18px;color:var(--core)}
  .sents .s-sub{color:var(--muted);font-size:13px;margin-bottom:14px}
  .sent{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:12px 0}
  .sent .s-en{font-family:Georgia,"Times New Roman",serif;font-size:15.5px;line-height:1.7;cursor:pointer;color:#3a332b}
  .sent .s-en:hover{color:var(--accent)}
  .sent .s-zh{color:var(--muted);font-size:13.5px;margin:6px 0 10px}
  .sent .s-parts{display:flex;flex-wrap:wrap;gap:6px}
  .spart{display:inline-flex;align-items:center;gap:6px;border-radius:9px;padding:4px 9px;font-size:13px;line-height:1.4}
  .spart .st{font-family:Georgia,serif;font-weight:600}
  .spart .sr{font-size:11px;color:#fff;border-radius:5px;padding:0 5px;white-space:nowrap}
  .spart .sn{font-size:12px;color:var(--muted)}
  .snotes{margin-top:10px;padding-top:8px;border-top:1px dashed var(--line);font-size:13px;color:#5f574c}
  .snotes b{color:var(--accent)}
  /* 句子内括号标注 */
  .s-flow{font-family:Georgia,"Times New Roman",serif;font-size:16px;line-height:2.1;cursor:pointer;color:#3a332b;padding:2px 0}
  .s-flow:hover{color:var(--accent)}
  .brkbox{border-radius:4px;padding:1px 1px;transition:.15s}
  .brk{font-weight:700;font-size:17px;padding:0 1px}
  .say-mini{background:none;border:none;cursor:pointer;font-size:15px;padding:0 4px;vertical-align:middle}
  @media(max-width:680px){.rules{grid-template-columns:1fr}.combo .big{font-size:44px}}
</style>
</head>

<div class="wrap">
  <div class="top">
    <a href="../index.html">← 返回总目录</a>
    <span>六级 · 托福单词记忆系统</span>
  </div>

  <header class="hero" id="hero"></header>

  <div id="passage"></div>

  <div class="toolbar">
    <input class="search" id="q" placeholder="🔎 搜索单词或释义…">
    <div class="filters" id="lvf"></div>
    <div class="filters" id="sgf"></div>

</div>

e（紧握把手）"}, {"w": "persist", "ipa": "/pərˈsɪst/", "gloss": "坚持／持续", "note": "「坚持/持续」，多用于习惯、问题；persist in old habits（坚持旧习惯）"}], "antonyms": [{"w": "release", "note": "松开、释放"}, {"w": "abandon", "note": "放弃（旧观念）"}], "nuance": "cling to 带有执着、甚至有点固执的意味（不愿放手）；adhere to 更正式中性（遵守规则）；grip 强调物理握力；persist 强调时间上持续。"}, {"word": "sting", "hl": "ng", "levels": ["托福"], "ipa": "/stɪŋ/", "subgroup": "ng", "meaning": "v. 刺痛；（言语）使受伤；（昆虫）蜇  n. 蜇伤；刺痛；（诈骗）钓鱼行动", "etymology": "古英语 stingan「刺、蜇」，日耳曼同根。不规则动词：sting–stung–stung。核心义「尖锐的刺入感」，引申到言辞刺痛和比喻义。", "roots": [{"part": "sting（stingan）", "meaning": "刺、蜇"}], "phonetics": "st + i /ɪ/ + ng /ŋ/，不规则变形 stung = /stʌŋ/（元音变 /ʌ/，但词尾仍是 /ŋ/）。", "tip": "sting operation（钓鱼执法/卧底行动）是新闻英语高频词汇，the sting of criticism（批评的刺痛）是学术写作常见比喻。", "core": "像针尖突然扎进皮肤——短暂、尖锐、让人一缩的那一下刺痛感", "senses": [{"gloss": "刺痛／蜇伤（物理）", "logic": "针扎感的最直接体现——昆虫蜇、植物刺入", "en": "A bee sting can be painful.", "zh": "蜜蜂蜇伤会很痛。"}, {"gloss": "（言语）刺痛／使受伤", "logic": "物理刺痛映射为心理——话语像针一样扎人", "en": "His harsh words stung her more than any physical blow.", "zh": "他刻薄的话语比任何身体打击更令她感到刺痛。"}, {"gloss": "钓鱼执法／卧底行动", "logic": "历史偶合，非同一感觉引申——警方设陷阱像蜜蜂蜇人，与'针扎感'无关", "en": "The police ran a sting operation to catch the dealers.", "zh": "警方进行了一次卧底行动抓捕毒贩。"}], "derivatives": [{"w": "stung", "gloss": "sting 的过去式／分词"}, {"w": "stinger", "gloss": "蜇针／刺"}], "examples": [{"en": "His harsh words stung her more than any physical blow.", "zh": "他刻薄的话语比任何身体打击更令她感到刺痛。", "source": "造句"}, {"en": "take the sting out of", "zh": "「减轻……的刺痛/危害」——固定搭配，指降低某事的伤害性。", "source": "高频搭配"}], "synonyms": [{"w": "pierce", "ipa": "/pɪərs/", "gloss": "刺穿", "note": "「刺穿」，强调穿透，比 sting 更指物理刺入；pierce the skin（刺穿皮肤）"}, {"w": "hurt", "ipa": "/hɜːrt/", "gloss": "使受伤／刺痛", "note": "「使受伤/刺痛」，最口语通用，可互换但没有 sting 的「尖锐」感"}, {"w": "wound", "ipa": "/wuːnd/", "gloss": "使受伤（书面）", "note": "「使受伤」，比 sting 更正式，多用于情感上的深度伤害；wound someone's pride（伤害某人的自尊）"}], "antonyms": [{"w": "soothe", "note": "安抚、缓和"}, {"w": "comfort", "note": "抚慰"}], "nuance": "sting 暗含短暂而尖锐的刺痛感（身体或情绪），hurt 最通用，wound 暗含更深的情感伤害且更书面，pierce 强调贯穿动作本身。"}, {"word": "gang", "hl": "ng", "levels": ["托福"], "ipa": "/ɡæŋ/", "subgroup": "ng", "meaning": "n. 帮派；一伙；（工人/囚犯的）队伍  v. gang up on = 合伙对付", "etymology": "古英语 gang「行走、一队人马」，日耳曼同根，本义是「一起走的人」。现代含义特指「有组织的犯罪团伙」，也可中性指「一帮朋友」（informal）。", "roots": [{"part": "gang（gangan）", "meaning": "行走、成群结队"}], "phonetics": "g + a /æ/ + ng /ŋ/，词尾舌根鼻音，与 bang、hang、sang 押韵。注意 a 在 /ŋ/ 前读 /æ/，不是 /ɑː/。", "core": "一群人走在一起，步伐一致，黑压压地向你靠近——有组织、有压迫感的群体感", "senses": [{"gloss": "帮派／团伙", "logic": "一群人走在一起→有组织的（通常犯罪）群体", "en": "The city launched a crackdown on gang-related violence.", "zh": "该市发起了针对帮派暴力的打压行动。"}, {"gloss": "一伙／一群（朋友，非正式）", "logic": "帮派义弱化→口语中性指一群（常指年轻人）伙伴", "en": "The whole gang went to the beach.", "zh": "一大伙人去了海滩。"}, {"gloss": "（工人／囚犯的）队伍", "logic": "一群人一起干活→劳动队伍", "en": "A gang of workers repaired the road.", "zh": "一队工人修了路。"}, {"gloss": "合伙对付（gang up on）", "logic": "一群人围起来对付一个人——群体优势的动词化", "en": "They all ganged up on him.", "zh": "他们合伙对付他。"}], "derivatives": [{"w": "gangster", "gloss": "黑帮分子"}, {"w": "gangland", "gloss": "黑帮地盘"}, {"w": "gangway", "gloss": "通道（船员走的过道）"}], "examples": [{"en": "The city launched a crackdown on gang-related violence.", "zh": "该市发起了针对帮派暴力的打压行动。", "source": "造句"}, {"en": "gang up on", "zh": "「合伙对付（某人）」——高频短语动词，口语和新闻英语常见。", "source": "高频搭配"}], "synonyms": [{"w": "mob", "ipa": "/mɒb/", "gloss": "暴徒／乌合之众", "note": "「暴徒」，比 gang 更强调群体的无序和暴力性；a flash mob（快闪）是中性引申"}, {"w": "crew", "ipa": "/kruː/", "gloss": "团队／伙伴", "note": "「团队/伙伴」，比 gang 更口语中性，也可指帮派；film crew（摄制组）"}, {"w": "faction", "ipa": "/ˈfækʃn/", "gloss": "派系", "note": "「派系」，比 gang 更正式，多用于政治或组织内部的小团体"}], "antonyms": [{"w": "individual", "note": "个人（群体义相对）"}], "nuance": "gang 通常带负面含义（帮派），但口语中可中性指「一群朋友」；mob 更强调乌合之众的暴力性；crew 最中性，广泛用于各种团队；faction 专指有共同利益的政治派别。"}, {"word": "mingle", "hl": "ng", "levels": ["托福"], "ipa": "/ˈmɪŋɡl/", "subgroup": "ng2", "meaning": "v. （使）混合；（在社交场合）与人交往、应酬", "etymology": "古英语 mengan「混合」，日耳曼同根，与德语 mengen 同源。核心义是「让不同的东西混在一起」，引申到社交「与各种人交流」。", "roots": [{"part": "ming- (mengan)", "meaning": "混合"}, {"part": "-le", "meaning": "反复动作后缀"}], "phonetics": "m + i /ɪ/ + ng /ŋ/ + g /ɡ/ + l + e。注意：mingle 的 ng 夹在元音中间（i-ng-le），读 /ŋg/ 而非 /ŋ/——g 要发出来！对比 sing（词尾 /ŋ/）vs min-gle（词中 /ŋg/）。", "tip": "社交场合的「mingle」是托福听力对话高频词，描述鸡尾酒会、学术会议上的人际互动。", "core": "不同的液体倒进一个杯子，各自还在但边界变得模糊——'混而不融'的感觉", "senses": [{"gloss": "（使）混合", "logic": "不同东西倒在一起但各自可辨——'混而不融'，保持独立性", "en": "A sense of sadness mingled with relief.", "zh": "悲伤与如释重负交织的感觉。"}, {"gloss": "社交应酬／走动交流", "logic": "人像液体一样在房间里流动混合——各人身份还在，但互相接触交流", "en": "The conference gave students a chance to mingle with industry professionals.", "zh": "此次会议给了学生们与业界专业人士交流的机会。"}], "derivatives": [{"w": "commingle", "gloss": "混合（com- 一起 + mingle）"}, {"w": "intermingle", "gloss": "互相混合（inter- 相互 + mingle）"}], "examples": [{"en": "The conference gave students a chance to mingle with industry professionals.", "zh": "此次会议给了学生们与业界专业人士交流的机会。", "source": "造句"}, {"en": "a sense of sadness mingled with relief", "zh": "「悲伤与如释重负交织的感觉」——情绪混合的文学用法。", "source": "高频搭配"}], "synonyms": [{"w": "blend", "ipa": "/blend/", "gloss": "混合／融合", "note": "「混合」，比 mingle 更彻底，混合后难以分辨各成分；blend colors（调和颜色）"}, {"w": "socialize", "ipa": "/ˈsoʊʃəlaɪz/", "gloss": "社交", "note": "「社交」义近义词，比 mingle 更正式，强调建立社交关系的过程"}, {"w": "mix", "ipa": "/mɪks/", "gloss": "混合／交际", "note": "「混合/交际」，最口语，mix with people（与人打交道）"}], "antonyms": [{"w": "separate", "note": "分开"}, {"w": "isolate", "note": "孤立、隔绝"}], "nuance": "mingle 暗含保持各自独立性的「混在一起」（人还是个体），blend 是彻底融合（分不清来源）；社交义上 mingle 比 socialize 更口语，强调在场合里走动交流的动态过程。"}, {"word": "single", "hl": "ng", "levels": ["六级"], "ipa": "/ˈsɪŋɡl/", "subgroup": "ng2", "meaning": "adj. 单一的；单身的；单程的  n. 单曲；单人间  v. single out = 单独挑出", "etymology": "拉丁语 singulus「单个」，与 singular（单数的/独特的）同根。核心义始终是「只有一个」：一张单曲、一个人、一张单程票。", "roots": [{"part": "singl- (singulus)", "meaning": "单个"}], "phonetics": "s + i /ɪ/ + ng /ŋ/ + g /ɡ/ + le。ng 在元音间：/ŋg/，g 发出来！/ˈsɪŋɡl/，对比 sing /sɪŋ/——single 多一个 /ɡ/。", "tip": "single out（挑选出来）在托福阅读里常见，意为「将……单独挑出/指名」；not a single one = 一个都没有，强调语气比 none 更强。", "core": "一个人站在空地正中央，环顾四周，看不到第二个影子——绝对的'唯一'感", "senses": [{"gloss": "单一的／唯一的", "logic": "只有一个、没有第二个——绝对纯粹的唯一", "en": "Not a single word was spoken.", "zh": "一个字都没有说。"}, {"gloss": "单身的", "logic": "只有一个人——没有伴侣", "en": "She's been single for two years.", "zh": "她单身两年了。"}, {"gloss": "单程的", "logic": "只有去的路没有返回——单向", "en": "A single ticket to London.", "zh": "一张去伦敦的单程票。"}, {"gloss": "单曲", "logic": "单独的一首歌，不是整张专辑", "en": "The band released a new single.", "zh": "乐队发行了一首新单曲。"}, {"gloss": "单独挑出（single out）", "logic": "从一群人里把唯一一个挑出来——动词化", "en": "The report singled out three factors as critical.", "zh": "报告单独指出了三个至关重要的因素。"}], "derivatives": [{"w": "singular", "gloss": "单数的／独特的"}, {"w": "singularity", "gloss": "奇点／独特性"}, {"w": "singly", "gloss": "一个一个地（adv.）"}], "examples": [{"en": "The report singled out three factors as critical to the project's failure.", "zh": "报告单独指出了三个对项目失败至关重要的因素。", "source": "造句"}, {"en": "not a single word", "zh": "「一个字都没有」——强调语气，比 no words 更绝对。", "source": "高频搭配"}], "synonyms": [{"w": "sole", "ipa": "/soʊl/", "gloss": "唯一的（排他）", "note": "「唯一的」，比 single 更强调排他性；the sole survivor（唯一幸存者）"}, {"w": "individual", "ipa": "/ˌɪndɪˈvɪdʒuəl/", "gloss": "单独的／个人的", "note": "「单独的/个人的」，强调独立性，比 single 更正式"}, {"w": "unmarried", "ipa": "/ʌnˈmærid/", "gloss": "未婚的", "note": "「未婚」，是 single（单身）义的正式说法，多用于官方文件"}], "antonyms": [{"w": "multiple", "note": "多个的"}, {"w": "married", "note": "已婚的（单身义）"}], "nuance": "single 是中性「单个」；sole 更强调「除此之外别无他物」（更排他）；individual 强调独立个体性，多用于对比「集体」；unmarried 仅用于婚姻状态，比 single 更正式。"}, {"word": "angry", "hl": "n", "levels": ["六级"], "ipa": "/ˈæŋɡri/", "subgroup": "ng2", "meaning": "adj. 愤怒的；（伤口）红肿发炎的", "etymology": "古诺斯语 angr「悲伤、痛苦」，词根 ang- 核心义是「压迫、收紧」——愤怒是一种被压缩的情绪。与 anguish（极度痛苦）、anger（愤怒，名词）同根。", "roots": [{"part": "ang- (angr)", "meaning": "压迫、痛苦"}, {"part": "-ry", "meaning": "形容词后缀"}], "phonetics": "æ + n /ŋ/ + gr + i。注意：字母是 n+g，但 n 在 g 前同化为 /ŋ/，g 保留 /ɡ/，合读 /ŋɡr/——这是第三组规律的典型例子。不要读成 /ˈænɡri/（ /n/ + /g/），要读 /ˈæŋɡri/（/ŋ/ + /g/）。", "core": "胸口有一团气被死死压住，憋着、胀着，想炸但还没炸——那种被压缩的热感", "senses": [{"gloss": "愤怒的", "logic": "被压缩的情绪一旦释放就是爆发——愤怒就是这股被压住的、发热的能量", "en": "She was angry not because she failed, but because no one warned her.", "zh": "她愤怒的原因不是失败本身，而是没有人事先警告她。"}, {"gloss": "（伤口）红肿发炎的", "logic": "历史偶合，非同一感觉引申——伤口红肿像愤怒的脸红胀，但不是从'压迫'引申来的", "en": "An angry red wound on his arm.", "zh": "他手臂上一个红肿的伤口。"}], "derivatives": [{"w": "anger", "gloss": "愤怒（n.）"}, {"w": "angrily", "gloss": "愤怒地（adv.）"}, {"w": "anguish", "gloss": "极度痛苦（同根词）"}], "examples": [{"en": "She was angry not because she failed, but because no one warned her.", "zh": "她愤怒的原因不是失败本身，而是没有人事先警告她。", "source": "造句"}, {"en": "an angry red wound", "zh": "「红肿的伤口」——angry 的身体义，描述发炎状态。", "source": "高频搭配"}], "synonyms": [{"w": "furious", "ipa": "/ˈfjʊəriəs/", "gloss": "狂怒的", "note": "「狂怒的」，比 angry 程度强得多，几乎失控；furious at the injustice（对不公愤恨填膺）"}, {"w": "irritated", "ipa": "/ˈɪrɪteɪtɪd/", "gloss": "恼怒的（轻度）", "note": "「恼怒的」，程度比 angry 轻，是一种烦躁的不满；irritated by the noise（被噪音惹烦）"}, {"w": "indignant", "ipa": "/ɪnˈdɪɡnənt/", "gloss": "义愤的", "note": "「义愤填膺的」，因为感到不公正而愤怒，比 angry 更正式，带道德色彩"}], "antonyms": [{"w": "calm", "note": "平静的"}, {"w": "pleased", "note": "满意的、高兴的"}], "nuance": "angry 是基准词；irritated 是「被轻微惹烦」（程度最轻）；angry 是「明显愤怒」；furious 是「快要失控」（程度最强）；indignant 特指因感到不公正而产生的有原则的愤怒。"}, {"word": "finger", "hl": "n", "levels": ["六级"], "ipa": "/ˈfɪŋɡər/", "subgroup": "ng2", "meaning": "n. 手指（通常指食指到小指）  v. 用手指触摸；指认（嫌疑人）", "etymology": "古英语 finger，日耳曼同根，与德语 Finger 同源。核心义始终是「手上的指头」，引申到「指认某人」（finger the suspect）。", "roots": [{"part": "finger（古英语）", "meaning": "手指"}], "phonetics": "f + i /ɪ/ + n + g + er。字母 ng 夹在元音间：n 同化为 /ŋ/，g 保留 /ɡ/——/ˈfɪŋɡər/。这是最常被错读的词：不要读成 /ˈfɪnɡər/（保持普通 /n/），也不要读成 /ˈfɪŋər/（吞掉 /g/）。", "tip": "finger 五指区分：thumb（拇指）、index finger（食指）、middle finger（中指）、ring finger（无名指）、little/pinky finger（小指）。", "core": "五根细长的东西从手掌心伸出，每一根都能独立弯曲、指、捏——灵活而精准的工具感", "senses": [{"gloss": "手指", "logic": "身体的这五根灵活分支就是本体", "en": "She pointed a finger at the map.", "zh": "她用手指指着地图。"}, {"gloss": "用手指触摸", "logic": "名词动词化——用手指去触碰／摆弄", "en": "He fingered the fabric to feel its texture.", "zh": "他用手摸那块布料感受质地。"}, {"gloss": "指认（嫌疑人）", "logic": "用手指指向某人→在警方语境里引申为指认出罪犯", "en": "The witness fingered him as the robber.", "zh": "目击者指认他就是劫匪。"}], "derivatives": [{"w": "fingertip", "gloss": "指尖"}, {"w": "fingernail", "gloss": "指甲"}, {"w": "fingerprint", "gloss": "指纹"}, {"w": "fingering", "gloss": "（音乐）指法"}], "examples": [{"en": "She pointed an accusing finger at the company's management.", "zh": "她用指责的手指指向公司管理层。", "source": "造句"}, {"en": "put one's finger on", "zh": "「说出……的准确原因」——高频习语，比 identify 更形象。", "source": "高频搭配"}], "synonyms": [{"w": "digit", "ipa": "/ˈdɪdʒɪt/", "gloss": "手指／脚趾（解剖学术语）", "note": "「手指/脚趾」的正式医学/解剖学术语，也是「数字」（digital 的词根）"}, {"w": "point", "ipa": "/pɔɪnt/", "gloss": "指向", "note": "「指向」义，finger 作动词时的近义；point at the suspect（指向嫌疑人）"}], "antonyms": [], "nuance": "finger 是日常词，digit 是科学/技术术语（数字设备 digital device 都从 digit 来）。finger 作动词「指认」时带有正式/法律语境色彩。"}, {"word": "think", "hl": "n", "levels": ["六级"], "ipa": "/θɪŋk/", "subgroup": "nk", "meaning": "v. 思考；认为；设想  n. 思考（a good think）", "etymology": "古英语 þencan「考虑、估计」，日耳曼同根，与德语 denken 同源。核心义是「在脑子里运算」，区别于 feel（用感觉）。", "roots": [{"part": "think（þencan）", "meaning": "思考"}], "phonetics": "th /θ/ + i /ɪ/ + nk /ŋk/——n 在 k 前同化为 /ŋ/，读出 /ŋk/ 的 k 爆破。/θɪŋk/，不是 /θɪnk/。这是 nk 规律最高频的词，从这里建立 /ŋk/ 肌肉记忆。", "tip": "think 的不规则变形：think–thought–thought（元音彻底变，past tense /θɔːt/）。", "core": "脑袋里像有一个齿轮在转动，把进来的信息碾碎、翻面、重新组合——那种'运筹'的感觉", "senses": [{"gloss": "思考／想", "logic": "齿轮转动的过程就是思考本身——信息在脑子里被加工", "en": "I think we need to reconsider the entire approach.", "zh": "我认为我们需要重新考虑整体方案。"}, {"gloss": "认为／觉得", "logic": "思考的输出结果——'想过之后得出的判断'", "en": "She thinks it's a good idea.", "zh": "她认为这是个好主意。"}, {"gloss": "设想／想象", "logic": "在脑子里搭建还没发生的事——思维的一种前瞻延伸", "en": "Think of a world without war.", "zh": "想象一个没有战争的世界。"}], "derivatives": [{"w": "thought", "gloss": "思想／think 的过去式／分词"}, {"w": "thinker", "gloss": "思想家"}, {"w": "thinking", "gloss": "思考（n.）"}, {"w": "thinkable", "gloss": "可想象的"}, {"w": "unthinkable", "gloss": "不可想象的"}], "examples": [{"en": "I think we need to reconsider the entire approach.", "zh": "我认为我们需要重新考虑整体方案。", "source": "造句"}, {"en": "think outside the box", "zh": "「跳出框框思考」——高频职场习语，表示创新性思维。", "source": "高频搭配"}], "synonyms": [{"w": "consider", "ipa": "/kənˈsɪdər/", "gloss": "考虑", "note": "「考虑」，比 think 更正式，强调权衡利弊；consider all options（考虑所有选项）"}, {"w": "believe", "ipa": "/bɪˈliːv/", "gloss": "认为／相信", "note": "「认为/相信」，比 think 确信度更高；I believe it's right（我相信它是对的）"}, {"w": "ponder", "ipa": "/ˈpɒndər/", "gloss": "深思熟虑", "note": "「深思熟虑」，比 think 更强调长时间仔细琢磨；ponder a decision（反复权衡一个决定）"}], "antonyms": [{"w": "feel", "note": "用直觉/情感而非思考判断"}], "nuance": "think 最通用，覆盖认知和判断；consider 更强调权衡过程；believe 有主观确信感；ponder 是「反复咀嚼、慢慢想」。I think 比 I believe 不确定性更高，I ponder 不用于陈述观点，而用于描述思考过程。"}, {"word": "thank", "hl": "n", "levels": ["六级"], "ipa": "/θæŋk/", "subgroup": "nk", "meaning": "v. 感谢  n. thanks = 谢意；谢谢（感叹词）", "etymology": "古英语 þancian「感谢」，日耳曼同根，与德语 danken 同源。think 和 thank 是同一个词根 þencan 的分支——「想到（对方的好）→ 表达感谢」。两词在古英语里几乎一致，后来分化。", "roots": [{"part": "thank（þancian）", "meaning": "感谢、想到别人的恩惠"}], "phonetics": "th /θ/ + a /æ/ + nk /ŋk/，n 在 k 前读 /ŋ/，k 发出来，收尾是轻爆破。/θæŋk/ vs think /θɪŋk/——唯一区别是元音 /æ/ vs /ɪ/。", "tip": "think 和 thank 在词根上同源（古英语 þanc = 思想/感谢），「感恩」这个行为本就是「想到别人的好」——两词是绝佳的同根记忆对。", "core": "心里暖暖的，一股感激从胸口升上来，想对着那个人说出来——'被给予后想回应'的感觉", "senses": [{"gloss": "感谢（v.）", "logic": "被给予后的温暖回应——想到对方的好，说出口", "en": "I'd like to thank everyone who supported this project.", "zh": "我想感谢所有支持这个项目的人。"}, {"gloss": "谢意／谢谢（n.）", "logic": "感谢行为的名词化", "en": "A big thanks to the volunteers.", "zh": "非常感谢志愿者们。"}, {"gloss": "多亏了（thanks to）", "logic": "半固定搭配——'因为有了……的帮助／原因'，可正可反讽", "en": "Thanks to his help, we finished early.", "zh": "多亏了他的帮助，我们提前完成了。"}], "derivatives": [{"w": "thankful", "gloss": "感激的"}, {"w": "thankless", "gloss": "吃力不讨好的（没人感谢的）"}, {"w": "thanksgiving", "gloss": "感恩节／感恩"}, {"w": "thankfully", "gloss": "庆幸地"}], "examples": [{"en": "I'd like to thank everyone who supported this project.", "zh": "我想感谢所有支持这个项目的人。", "source": "造句"}, {"en": "thanks to", "zh": "「多亏了……」——可表正面（thanks to your help）或反讽（thanks to his mistake）。", "source": "高频搭配"}], "synonyms": [{"w": "appreciate", "ipa": "/əˈpriːʃieɪt/", "gloss": "感激／欣赏", "note": "「感激/欣赏」，比 thank 更强调内心的认可价值，正式语境；I appreciate your help"}, {"w": "acknowledge", "ipa": "/əkˈnɒlɪdʒ/", "gloss": "致谢／承认", "note": "「致谢/承认」，公开表达感谢，比 thank 更正式；acknowledge someone's contribution（致谢某人的贡献）"}, {"w": "express gratitude", "gloss": "表达感谢", "note": "「表达感谢」——正式书面替换，比 thank 更完整"}], "antonyms": [{"w": "blame", "note": "责怪"}, {"w": "criticize", "note": "批评"}], "nuance": "thank 是最口语直接的感谢动词；appreciate 更内化（感受到价值）；acknowledge 是公开的正式致谢（多出现在演讲或论文致谢部分）。「Thanks to」作为连接词时已半固定，不等于 thank。"}, {"word": "shrink", "hl": "n", "levels": ["托福"], "ipa": "/ʃrɪŋk/", "subgroup": "nk", "meaning": "v. 收缩；减少；退缩（shrink from = 逃避）  n. 心理医生（俚语）", "etymology": "古英语 scrincan「萎缩、收缩」，日耳曼同根。不规则动词：shrink–shrank–shrunk（《小鬼当家》Honey, I Shrunk the Kids 里的 shrunk 是过去分词）。", "roots": [{"part": "shrink（scrincan）", "meaning": "萎缩、收缩"}], "phonetics": "shr- + i /ɪ/ + nk /ŋk/。shr- 三辅音连缀（sh /ʃ/ + r）；nk = /ŋk/，k 爆破收尾。不规则变形要记：shrank（过去式）/ shrunk（过去分词）。", "tip": "shrink from 在托福写作里是「回避/不敢面对」的学术搭配；shrink 作俚语「心理医生」来自「head shrinker（给脑袋缩水的人）」，是20世纪口语。", "core": "一个东西像被抽了气一样，从大变小、从鼓变瘪——那种'往回缩'的感觉", "senses": [{"gloss": "收缩／缩小", "logic": "物理上从大变小的过程——体积、数量、规模的缩减", "en": "The economy shrank by 3% in the second quarter due to supply chain disruptions.", "zh": "由于供应链中断，经济在第二季度萎缩了3%。"}, {"gloss": "退缩／回避（shrink from）", "logic": "物理收缩映射到心理——人往后缩 = 不敢面对", "en": "He shrank from the responsibility.", "zh": "他逃避了责任。"}, {"gloss": "心理医生（俚语）", "logic": "历史偶合，非同一感觉引申——来自 head-shrinker（给脑袋缩水的人），调侃心理咨询师", "en": "She's been seeing a shrink for anxiety.", "zh": "她因焦虑在看心理医生。"}], "derivatives": [{"w": "shrank", "gloss": "shrink 的过去式"}, {"w": "shrunk", "gloss": "shrink 的过去分词"}, {"w": "shrinkage", "gloss": "缩水／损耗"}, {"w": "shrinkable", "gloss": "可收缩的"}], "examples": [{"en": "The economy shrank by 3% in the second quarter due to supply chain disruptions.", "zh": "由于供应链中断，经济在第二季度萎缩了3%。", "source": "造句"}, {"en": "shrink from responsibility", "zh": "「逃避责任」——shrink from = 不敢面对/回避，托福写作常用。", "source": "高频搭配"}], "synonyms": [{"w": "contract", "ipa": "/kənˈtrækt/", "gloss": "收缩", "note": "「收缩」，比 shrink 更正式，用于物理或经济收缩；the market contracted（市场收缩）"}, {"w": "diminish", "ipa": "/dɪˈmɪnɪʃ/", "gloss": "减小／减弱", "note": "「减小/减弱」，比 shrink 更正式，强调逐渐减少；diminishing returns（收益递减）"}, {"w": "recoil", "ipa": "/rɪˈkɔɪl/", "gloss": "退缩／反冲", "note": "「退缩/反冲」，比 shrink from 更强调本能性的畏缩反应；recoil in horror（惊骇退缩）"}], "antonyms": [{"w": "expand", "note": "扩张、增大"}, {"w": "grow", "note": "增长"}], "nuance": "shrink 最通用（物理、经济、心理皆可）；contract 更正式（经济合同语境）；diminish 强调「逐渐减小」的过程；recoil 专指本能性的退缩。shrink from（逃避）和 recoil from（本能退缩）有细微差异：前者更主动的回避，后者更本能的厌恶反应。"}, {"word": "distinct", "hl": "n", "levels": ["托福"], "ipa": "/dɪˈstɪŋkt/", "subgroup": "nk", "meaning": "adj. 明显的；截然不同的；清晰可辨的", "etymology": "拉丁语 distinctus = dis-(分开) + stinguere(刺、标记) = 「分别标记出来」。与 extinguish（熄灭，「把标记抹去」）、instinct（本能）同根——都含 stinguere（刺/标记）。", "roots": [{"part": "dis-", "meaning": "分开、区别"}, {"part": "-stinct (stinguere)", "meaning": "刺、标记"}], "phonetics": "di + s + t + i /ɪ/ + n /ŋ/ + ct /kt/。注意：nct 结尾 = /ŋkt/，n 在 k 前同化为 /ŋ/，k 和 t 都发出来。/dɪˈstɪŋkt/，不是 /dɪˈstɪnkt/。", "tip": "distinct vs distinctive：distinct = 明显不同（a distinct advantage），distinctive = 有鲜明特色/可识别性（a distinctive style）——前者强调差异，后者强调独特标志性。", "core": "两个东西放在一起，一眼就看出它们不是同一个——那种边界清晰的'可区分感'", "senses": [{"gloss": "截然不同的", "logic": "两个东西被'刺开标记'→各自独立可辨，不是同一个", "en": "There is a distinct difference between correlation and causation.", "zh": "相关性与因果关系之间存在明显差异。"}, {"gloss": "清晰可辨的／明显的", "logic": "标记出来的东西轮廓鲜明→一眼就能看清、不会混淆", "en": "A distinct smell of coffee filled the room.", "zh": "房间里弥漫着明显的咖啡味。"}, {"gloss": "确切的／明确的（强调程度）", "logic": "清晰到无法忽视→不是模糊可能，而是确定的存在", "en": "There is a distinct possibility he is lying.", "zh": "他有相当大的可能在撒谎。"}], "derivatives": [{"w": "distinction", "gloss": "区别／差别"}, {"w": "distinctive", "gloss": "有特色的／独特的"}, {"w": "distinctly", "gloss": "明显地／清楚地"}, {"w": "indistinct", "gloss": "模糊的／不清晰的"}], "examples": [{"en": "There is a distinct difference between correlation and causation.", "zh": "相关性与因果关系之间存在明显差异。", "source": "造句"}, {"en": "a distinct possibility", "zh": "「相当大的可能性」——distinct = 明显的，是表达「可能性不低」的正式说法。", "source": "高频搭配"}], "synonyms": [{"w": "clear", "ipa": "/klɪər/", "gloss": "清晰的", "note": "「清晰的」，最口语，比 distinct 更泛；a clear difference（明显的差异）"}, {"w": "marked", "ipa": "/mɑːrkt/", "gloss": "显著的", "note": "「显著的」，比 distinct 更强调「幅度大、无法忽视」；a marked improvement（显著改善）"}, {"w": "evident", "ipa": "/ˈevɪdənt/", "gloss": "显而易见的", "note": "「显而易见的」，比 distinct 更强调「任何人都能看出来」；evident concern（显而易见的担忧）"}], "antonyms": [{"w": "vague", "note": "模糊的"}, {"w": "indistinct", "note": "不清晰的，难以辨认的"}], "nuance": "distinct 强调「可以清楚区分/不混淆」；marked 强调「程度显著、量上差别大」；evident 强调「对所有观察者都明显」；clear 最口语，不分场合。学术写作中 distinct 和 marked 比 clear 更正式。"}, {"word": "instinct", "hl": "n", "levels": ["托福"], "ipa": "/ˈɪnstɪŋkt/", "subgroup": "nk", "meaning": "n. 本能；天生的冲动；（对某事的）直觉", "etymology": "拉丁语 instinctus = in-(向内) + stinguere(刺、激发) = 「从内部刺激驱动」。与 distinct、extinct 同根——stinguere 这把「刺」一根打出三个词：标记（distinct）、熄灭（extinct）、内驱（instinct）。", "roots": [{"part": "in-", "meaning": "向内"}, {"part": "-stinct (stinguere)", "meaning": "刺、激发"}], "phonetics": "in + s + t + i /ɪ/ + nct /ŋkt/，重音在前 IN-stinct。词尾 -nct 读 /ŋkt/：n 同化为 /ŋ/，k 和 t 都发出来——是 nk 规律 + 额外 t 的组合。", "tip": "instinct 和 distinct、extinct 是「词根同源三兄弟」：in-stinct（刺进去=本能）/ di-stinct（刺开=区分）/ ex-tinct（刺灭=绝灭）。背一个带三个。", "core": "不需要经过大脑想，身体自己就知道该做什么——那种'被一只无形的手从里面推着走'的感觉", "senses": [{"gloss": "本能／天性", "logic": "从内部被激发驱动——天生就会的、不需要学习的反应", "en": "Her instinct told her something was wrong before she saw any evidence.", "zh": "在看到任何证据之前，她的直觉已经告诉她有什么不对劲。"}, {"gloss": "直觉", "logic": "本能弱化→不需要推理的直接判断，是内在感觉而非理性分析", "en": "Trust your instincts.", "zh": "相信你的直觉。"}], "derivatives": [{"w": "instinctive", "gloss": "本能的／直觉的"}, {"w": "instinctively", "gloss": "本能地（adv.）"}, {"w": "instinctual", "gloss": "本能的（偏学术，同 instinctive）"}], "examples": [{"en": "Her instinct told her something was wrong before she saw any evidence.", "zh": "在看到任何证据之前，她的直觉已经告诉她有什么不对劲。", "source": "造句"}, {"en": "survival instinct", "zh": "「求生本能」——托福生物和心理类阅读高频搭配。", "source": "高频搭配"}], "synonyms": [{"w": "intuition", "ipa": "/ˌɪntjuˈɪʃn/", "gloss": "直觉", "note": "「直觉」，比 instinct 更侧重认知上的无意识判断，instinct 偏生物性驱动；female intuition（女性直觉）"}, {"w": "impulse", "ipa": "/ˈɪmpʌls/", "gloss": "冲动", "note": "「冲动」，比 instinct 更强调突发性和短暂性；act on impulse（冲动行事）"}, {"w": "reflex", "ipa": "/ˈriːfleks/", "gloss": "反射动作", "note": "「反射动作」，比 instinct 更生理性，是自动的神经反应；a reflex action（反射动作）"}], "antonyms": [{"w": "reason", "note": "理性思考（与本能相对）"}, {"w": "deliberation", "note": "深思熟虑"}], "nuance": "instinct 是深层生物性驱动（动物的求生本能）；intuition 是无意识的认知判断（直觉感知）；impulse 是短暂的冲动（一时的欲望）；reflex 是自动的神经反应（无法控制）。人类行为中 instinct 和 intuition 常混用，但严格区分时 instinct 更原始、更生物性。"}, {"word": "extinct", "hl": "n", "levels": ["托福"], "ipa": "/ɪkˈstɪŋkt/", "subgroup": "nk", "meaning": "adj. 灭绝的；（火山）已死的；（制度/职位）废止的", "etymology": "拉丁语 extinctus = ex-(出、去除) + stinguere(刺灭、熄灭) = 「把火焰刺灭」→ 消亡。与 distinguish（「用光拉开」→ 区分）、instinct 同根。extinction（灭绝）是其名词形式，托福生物类文章超高频。", "roots": [{"part": "ex-", "meaning": "向外、去除"}, {"part": "-stinct (stinguere)", "meaning": "刺灭、熄灭"}], "phonetics": "ex + t + i /ɪ/ + nct /ŋkt/，重音在后 ex-TINCT。-nct = /ŋkt/：n 在 k 前同化为 /ŋ/，再跟 k 和 t 的双爆破。/ɪkˈstɪŋkt/。", "core": "火苗被掐灭后升起的一缕烟，热量没了，光没了，什么都没有留下——彻底沉寂的消亡感", "senses": [{"gloss": "灭绝的（物种）", "logic": "火焰被刺灭→物种种群被彻底消灭干净，一个不剩", "en": "The dodo became extinct in the late 17th century due to human hunting and habitat destruction.", "zh": "渡渡鸟因人类捕猎和栖息地破坏，于17世纪末灭绝。"}, {"gloss": "已死的（火山）", "logic": "火山的活力像火一样被熄灭——不再喷发", "en": "The volcano is extinct.", "zh": "这座火山是死火山。"}, {"gloss": "废止的（制度／职位）", "logic": "制度或职位像火焰一样被扑灭——不再存在", "en": "The position became extinct after the reorganization.", "zh": "该职位在重组后被废止。"}], "derivatives": [{"w": "extinction", "gloss": "灭绝（n.）"}, {"w": "extinguish", "gloss": "熄灭／扑灭（v.）"}, {"w": "extinguisher", "gloss": "灭火器"}], "examples": [{"en": "The dodo became extinct in the late 17th century due to human hunting and habitat destruction.", "zh": "渡渡鸟因人类捕猎和栖息地破坏，于17世纪末灭绝。", "source": "造句"}, {"en": "on the brink of extinction", "zh": "「濒临灭绝」——托福生物和环境类文章最高频的搭配之一。", "source": "高频搭配"}], "synonyms": [{"w": "vanished", "ipa": "/ˈvænɪʃt/", "gloss": "消失的", "note": "「消失的」，比 extinct 更口语，不带科学分类色彩；vanished civilizations（消亡的文明）"}, {"w": "obsolete", "ipa": "/ˌɒbsəˈliːt/", "gloss": "过时废弃的", "note": "「过时废弃的」，用于技术、制度、词语——人类造物的消亡，不用于生物"}, {"w": "defunct", "ipa": "/dɪˈfʌŋkt/", "gloss": "已停止运作的", "note": "「已停止运作的」，用于组织、机构、系统；a defunct company（倒闭的公司）"}], "antonyms": [{"w": "extant", "note": "现存的（学术反义词，尤用于物种和文献）"}, {"w": "thriving", "note": "繁盛的"}], "nuance": "extinct 是生物学专用词，特指物种永久消亡（无可逆转）；obsolete 是技术/语言领域的「废弃」；defunct 是组织/机构的「停运」；vanished 最口语，不带技术分类色彩。在托福生物文章里，extinct 和 extant（现存）是一对高频对立词。"}, {"word": "blanket", "hl": "n", "levels": ["托福"], "ipa": "/ˈblæŋkɪt/", "subgroup": "nk", "meaning": "n. 毯子；（覆盖一切的）一层  adj. 全面的、一刀切的（blanket ban）  v. 覆盖", "etymology": "中古英语 blankete，来自 Thomas Blanket（14世纪布里斯托尔商人），据说他推广了这种织物。词义从名词「毯子」→ 动词「用毯子覆盖」→ 形容词「覆盖一切的/全面的」。", "roots": [{"part": "blank-", "meaning": "空白的（早期含义，毯子是单色布）"}, {"part": "-et", "meaning": "小词后缀"}], "phonetics": "bl + a /æ/ + nk /ŋk/ + et，n 在 k 前同化为 /ŋ/，k 发出来。重音在前 BLAN-ket，-ket 弱读 /kɪt/。", "tip": "blanket ban / blanket policy（全面禁令/一刀切政策）是托福阅读和写作的高频搭配，描述不加区分的整体措施——是「毯子一样盖住所有人」的比喻。", "core": "一张大毯子从头盖到脚，把底下所有东西都罩住——不分彼此、一律覆盖的感觉", "senses": [{"gloss": "毯子", "logic": "覆盖身体的织物——本体，最早的含义", "en": "She pulled the blanket over herself.", "zh": "她把毯子拉过来盖住自己。"}, {"gloss": "（覆盖一切的）一层", "logic": "毯子盖住一切→像毯子一样覆盖的层", "en": "A blanket of snow covered the entire valley.", "zh": "一层白雪覆盖了整个山谷。"}, {"gloss": "全面的／一刀切的（adj.）", "logic": "像毯子盖住所有人一样→不加区分、一律对待", "en": "The government imposed a blanket ban on all public gatherings.", "zh": "政府对所有公共集会实施了全面禁令。"}, {"gloss": "覆盖（v.）", "logic": "名词动词化→用毯子盖住", "en": "Snow blanketed the landscape.", "zh": "大雪覆盖了大地。"}], "derivatives": [{"w": "blanketing", "gloss": "覆盖（n.）"}, {"w": "blanketed", "gloss": "被覆盖的（adj.）"}], "examples": [{"en": "The government imposed a blanket ban on all public gatherings.", "zh": "政府对所有公共集会实施了全面禁令。", "source": "造句"}, {"en": "A blanket of snow covered the entire valley.", "zh": "一层白雪覆盖了整个山谷。", "source": "造句"}], "synonyms": [{"w": "comprehensive", "ipa": "/ˌkɒmprɪˈhensɪv/", "gloss": "全面的", "note": "「全面的」，比 blanket 更正式，强调「覆盖所有方面」，不带「一刀切」的负面含义"}, {"w": "sweeping", "ipa": "/ˈswiːpɪŋ/", "gloss": "大范围的／笼统的", "note": "「大范围的/笼统的」，与 blanket 很接近，sweeping changes（大刀阔斧的变革），可带正面或批评意味"}, {"w": "across-the-board", "gloss": "全面的／一律的", "note": "「全面的/一律的」，口语化，与 blanket 在「不加区分」这一含义上最接近"}], "antonyms": [{"w": "selective", "note": "有选择性的"}, {"w": "targeted", "note": "针对特定目标的"}], "nuance": "blanket（作形容词）强调「不加区分、不考虑个别情况」，通常带有一定批评色彩（a blanket ban 暗示可能太简单粗暴）；comprehensive 是褒义，强调全面覆盖；sweeping 强调影响范围大，可褒可贬。"}, {"word": "plank", "hl": "n", "levels": ["托福"], "ipa": "/plæŋk/", "subgroup": "nk", "meaning": "n. 厚木板；（政党/计划的）核心政策条款  v. 用木板铺设", "etymology": "古法语 planke「厚板」，来自拉丁语 planca。从「建筑用厚木板」引申到「支撑整体的核心结构」，因此政党竞选纲领里的核心条款叫 plank（「政策支柱」）。", "roots": [{"part": "plank（planca）", "meaning": "厚板"}], "phonetics": "pl + a /æ/ + nk /ŋk/，n 在 k 前同化为 /ŋ/，k 发出来，末尾干净收爆破。单音节，与 bank、rank、frank、blank 押韵。", "tip": "「walk the plank」（走跳板、被迫离职）是高频习语，来自海盗强迫俘虏从船舷木板走入大海的历史；a key plank of the policy = 政策的核心支柱，是托福阅读政治/社会类文章的用语。", "core": "一块厚实的木板，平放着可以踩，竖起来可以撑——结实、可靠、不会断的支撑感", "senses": [{"gloss": "厚木板", "logic": "结实厚实的木板——本体", "en": "They laid planks to cross the mud.", "zh": "他们铺了厚木板过泥地。"}, {"gloss": "核心政策条款", "logic": "政治纲领像房子一样由木板搭建→每一块政策板就是一根支撑结构的支柱", "en": "Universal healthcare is a central plank of the party's election platform.", "zh": "全民医疗保健是该党选举纲领的核心政策条款。"}, {"gloss": "用木板铺设（v.）", "logic": "名词动词化——铺木板", "en": "They planked the deck.", "zh": "他们用木板铺了甲板。"}], "derivatives": [{"w": "planking", "gloss": "铺板／平板支撑（健身）"}, {"w": "planked", "gloss": "铺了木板的（adj.）"}], "examples": [{"en": "Universal healthcare is a central plank of the party's election platform.", "zh": "全民医疗保健是该党选举纲领的核心政策条款。", "source": "造句"}, {"en": "walk the plank", "zh": "「走跳板——被迫下台/离职」——来自海盗传说的高频习语。", "source": "高频搭配"}], "synonyms": [{"w": "board", "ipa": "/bɔːrd/", "gloss": "木板", "note": "「木板」义近义词，比 plank 更通用，plank 特指厚板；board and plank 有时并列出现"}, {"w": "pillar", "ipa": "/ˈpɪlər/", "gloss": "支柱／核心", "note": "「支柱/核心」义近义词，比 plank 更常用于抽象义；a pillar of the community（社区支柱）"}, {"w": "cornerstone", "ipa": "/ˈkɔːrnərˌstoʊn/", "gloss": "基石", "note": "「基石」，比 plank 更强调「整体之基础」；the cornerstone of democracy（民主的基石）"}], "antonyms": [], "nuance": "plank 作「政策条款」时强调「是整体纲领的一块板——可数、可独立」；pillar 强调「支撑整体」；cornerstone 强调「整个大厦从这里开始」，是更根本性的基础。"}, {"word": "frank", "hl": "n", "levels": ["托福"], "ipa": "/fræŋk/", "subgroup": "nk", "meaning": "adj. 坦诚的，直言不讳的  v. 在邮件上盖免费邮戳（历史用法）  n. Frank = 法兰克人", "etymology": "来自 Frank（法兰克人），日耳曼民族，在高卢统治阶级，拥有自由发言权。「法兰克人的直接」→ 坦诚直率。同根延伸：franchise（特许经营，原指「给予自由/特权」）、France（法国）都来自 Franks。", "roots": [{"part": "frank（Frankish）", "meaning": "法兰克人→自由直率"}], "phonetics": "fr + a /æ/ + nk /ŋk/，n 在 k 前同化为 /ŋ/，k 发出来。/fræŋk/，与 blank、plank、rank、bank 押韵。", "tip": "to be frank（坦白说）是托福写作和口语常用插入语，比 honestly 更正式；frankly speaking = to be frank，两种用法都高频。", "core": "心里想什么嘴里说什么，像一面没有窗帘的窗户——看进去就是心里，没有隔层的感觉", "senses": [{"gloss": "坦诚的／直言不讳的", "logic": "像法兰克人的自由直率→心里话直接说出口，不绕弯子", "en": "To be frank, I don't think the current plan will work.", "zh": "坦白说，我认为当前的计划行不通。"}, {"gloss": "法兰克人（n. Frank）", "logic": "原始义——日耳曼部族，曾统治高卢，拥有自由发言的特权", "en": "The Franks ruled Gaul after the fall of Rome.", "zh": "法兰克人在罗马陷落后统治了高卢。"}], "derivatives": [{"w": "frankly", "gloss": "坦白地（adv.）"}, {"w": "frankness", "gloss": "坦率（n.）"}, {"w": "franchise", "gloss": "特许经营权（同根——给予自由／特权）"}], "examples": [{"en": "To be frank, I don't think the current plan will work.", "zh": "坦白说，我认为当前的计划行不通。", "source": "造句"}, {"en": "a frank discussion", "zh": "「一次坦诚的讨论」——frank 描述对话时，暗含「说了平时不便说的话」。", "source": "高频搭配"}], "synonyms": [{"w": "candid", "ipa": "/ˈkændɪd/", "gloss": "坦率的（书面）", "note": "「坦率的」，比 frank 更正式书面，且更强调「无隐藏，如实表达」；a candid assessment（坦率的评估）"}, {"w": "direct", "ipa": "/dɪˈrekt/", "gloss": "直接的", "note": "「直接的」，比 frank 更中性，不带「说实话」的含义，只强调表达方式直接"}, {"w": "blunt", "ipa": "/blʌnt/", "gloss": "直率但生硬的", "note": "「直率但有些生硬」，比 frank 语气更强，有时带负面含义（太直接以至于失礼）"}], "antonyms": [{"w": "evasive", "note": "回避的、含糊其辞的"}, {"w": "diplomatic", "note": "外交辞令式的（策略性迂回）"}], "nuance": "frank 和 candid 最接近，都指「如实说」，candid 更书面正式；blunt 是「frank 过了头」——太直接到近乎无礼；direct 只说表达方式，不含「说实话」的含义。「frankly speaking」比「bluntly speaking」少了一分刺耳。"}]}</script>
<script>
const G = JSON.parse(document.getElementById('data').textContent);
const KEY = 'vocab-unfam-' + G.id;
let unfam = new Set(JSON.parse(localStorage.getItem(KEY) || '[]'));
let curLv = '全部', curSg = '全部', curQ = '', onlyUnfam = false;

const LVCLASS = {'六级':'lv6','托福':'tfl','GRE拓展':'gre','基础':'','口语':'spk','场景':'scn'};
// 发音分组配色（按 subgroups 顺序循环取用）
const SGCOLORS = ['#2f8f83','#b0603f','#6a52a8','#c1662f','#3a7bd5'];
const SUBG = G.subgroups || [];
function sgIndex(key){ const i=SUBG.findIndex(s=>s.key===key); return i<0?0:i; }
function sgColor(key){ return SGCOLORS[sgIndex(key)%SGCOLORS.length]; }
function sgOf(key){ return SUBG.find(s=>s.key===key); }

// ---------- header
function renderHero(){
  const h = document.getElementById('hero');
  const rules = SUBG.map((s,i)=>{
    const c = SGCOLORS[i%SGCOLORS.length];
    return `<div class="rule" style="border-left:5px solid ${c}"><b style="color:${c}">${s.label}</b>${s.desc||''}</div>`;
  }).join('');
  const rhymes = (G.rhymeChains && G.rhymeChains.length)
    ? `<div class="rhymes"><h3>🎵 同韵顺口溜 · 点单词听发音，成串背最快</h3>${
        G.rhymeChains.map(c=>`<div class="chain"><span class="lab">${c.label}</span>${
          c.words.map(w=>`<span class="chip" onclick="say('${w}')">${w}</span>`).join('')
        }</div>`).join('')}</div>`
    : '';
  h.innerHTML = `
    <div class="combo"><span class="big">${G.combo}</span><span class="snd">${G.sound}</span></div>
    <h1>${G.title} · ${G.subtitle||''}</h1>
    <p class="intro">${G.intro}</p>
    <div class="rules">${rules}</div>
    ${rhymes}`;
}

// ---------- 精读：文章 + 句法分析
let speaking=false;
function sayPassage(btn){
  if(speaking){ speechSynthesis.cancel(); speaking=false; if(btn) btn.textContent='🔊 朗读全文'; return; }
  const P = G.passage; if(!P) return;
  const texts = (P.paragraphs||[]).map(p=>p.en).filter(Boolean);
  if(!texts.length) return;
  if(!VOICE) pickVoice();
  speaking=true; if(btn) btn.textContent='⏹ 停止朗读';
  let last=null;
  texts.forEach((t,i)=>{
    const u = new SpeechSynthesisUtterance(t);
    u.lang='en-US'; if(VOICE) u.voice=VOICE; u.rate=.95; u.pitch=1.0;
    if(i===texts.length-1) last=u;
    speechSynthesis.speak(u);
  });
  if(last) last.onend=()=>{ speaking=false; if(btn) btn.textContent='🔊 朗读全文'; };
}
function renderPassage(){
  const el = document.getElementById('passage');
  const P = G.passage; if(!P){ el.style.display='none'; return; }
  const paras = (P.paragraphs||[]).map(p=>{
    let en = p.en||'';
    // 高亮关键词（p.kws 或自动匹配词表词）
    const kws = p.kws || [];
    kws.forEach(k=>{ en = en.replace(new RegExp('('+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'), '<span class="kw" onclick="say(\'$1\')">$1</span>'); });
    return `<p><div class="en">${en}</div>${p.zh?`<div class="zh">${p.zh}</div>`:''}</p>`;
  }).join('');
  el.innerHTML = `<div class="passage"><h2>📖 精读原文</h2>
    <div class="p-title">${P.title||''} <button class="readall" onclick="sayPassage(this)">🔊 朗读全文</button></div>
    ${paras}</div>`;
}
const ROLECOLOR = { '主语':'#2f8f83','谓语':'#c1662f','宾语':'#3a7bd5','状语':'#6a52a8','定语':'#b0603f','补语':'#c1662f','从句':'#8c8072','连词':'#8c8072','介词':'#8c8072','插入语':'#8c8072','同位语':'#b0603f' };
function roleColor(r){ return ROLECOLOR[r] || '#6a52a8'; }
function escAttr(s){ return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
// 句子内括号标注：介词短语 ( ) · 从句 [ ] · 非谓语 { }
const BRK = {'pp':['(',')'], 'cl':['[',']'], 'nf':['{','}']};
const BRKC = {'pp':'#6a52a8', 'cl':'#3a7bd5', 'nf':'#b0603f'};
function renderFlow(s){
  let html='';
  (s.flow||[]).forEach(it=>{
    if(it.open){ const k=it.open; html+=`<span class="brkbox" style="background:${BRKC[k]}16;border-bottom:2px solid ${BRKC[k]}66"><b class="brk" style="color:${BRKC[k]}">${BRK[k][0]}</b>`; }
    else if(it.close){ const k=it.close; html+=`<b class="brk" style="color:${BRKC[k]}">${BRK[k][1]}</b></span>`; }
    else { html+=escAttr(it.t); }
  });
  return html;
}
function renderSents(){
  const el = document.getElementById('sents');
  const S = G.sentences; if(!S || !S.length){ el.style.display='none'; return; }
  const items = S.map((s,i)=>{
    const flowHtml = (s.flow && s.flow.length) ? renderFlow(s) : escAttr(s.en);
    const parts = (s.parts||[]).map(p=>{
      const c = roleColor(p.r);
      return `<span class="spart" style="background:${c}18;border:1px solid ${c}55">
        <span class="st" style="color:${c}">${escAttr(p.t)}</span>
        <span class="sr" style="background:${c}">${p.r}</span>
        ${p.n?`<span class="sn">${p.n}</span>`:''}</span>`;
    }).join('');
    return `<div class="sent">
      <div class="s-flow" data-en="${escAttr(s.en)}" onclick="say(this.dataset.en)" title="点句子朗读">${flowHtml} <button class="say-mini" data-en="${escAttr(s.en)}" onclick="event.stopPropagation();say(this.dataset.en)" title="朗读">🔊</button></div>
      ${s.zh?`<div class="s-zh">${s.zh}</div>`:''}
      <div class="s-parts">${parts}</div>
      ${s.note?`<div class="snotes">${s.note}</div>`:''}</div>`;
  }).join('');
  el.innerHTML = `<div class="sents"><h2>🔍 长难句 · 句法分析</h2>
    <div class="s-sub">点英文句可朗读 · 括号标注：<b style="color:#6a52a8">( ) 介词短语</b> · <b style="color:#3a7bd5">[ ] 从句</b> · <b style="color:#b0603f">{ } 非谓语动词</b> · 下方色块=成分功能</div>
    ${items}</div>`;
}

// ---------- filters
function renderFilters(){
  const lvs = ['全部','六级','托福','GRE拓展','基础'];
  document.getElementById('lvf').innerHTML = lvs.map(l=>
    `<span class="f${l===curLv?' on':''}" onclick="setLv('${l}')">${l}</span>`).join('');
  const sgs = [['全部','全部'], ...SUBG.map(s=>[s.tag||s.label, s.key])];
  document.getElementById('sgf').innerHTML = sgs.map(([t,v])=>
    `<span class="f${v===curSg?' on':''}" onclick="setSg('${v}')">${t}</span>`).join('');
}
function setLv(l){curLv=l;renderFilters();renderGrid();}
function setSg(s){curSg=s;renderFilters();renderGrid();}

// ---------- speech：优先自然美式女声
let VOICE=null, VOICES=[];
// 各浏览器/系统里公认自然的美式女声，按优先级排序
const PREF=[
  'Google US English',                 // Chrome：自然女声
  'Microsoft Aria Online (Natural) - English (United States)',
  'Microsoft Jenny Online (Natural) - English (United States)',
  'Microsoft Ava Online (Natural) - English (United States)',
  'Microsoft Aria','Microsoft Jenny','Microsoft Michelle',
  'Ava (Premium)','Ava (Enhanced)','Ava',   // macOS Siri 女声
  'Samantha',                          // macOS 经典美式女声
  'Allison','Susan','Nicky','Zoe','Karen','Victoria'
];
const MALE=/(alex|daniel|fred|tom|david|mark|male|aaron|arthur|gordon|oliver|rishi|junior|ralph)/i;
function usPool(){
  VOICES = speechSynthesis.getVoices()||[];
  let us = VOICES.filter(v=>/en[-_]US/i.test(v.lang)||/United States/i.test(v.name));
  if(!us.length) us = VOICES.filter(v=>/^en/i.test(v.lang));
  return us;
}
function pickVoice(){
  const pool=usPool(); if(!pool.length) return;
  VOICE=null;
  for(const n of PREF){ const h=pool.find(v=>v.name===n)||pool.find(v=>v.name.indexOf(n)===0); if(h){VOICE=h;break;} }
  if(!VOICE) VOICE = pool.find(v=>/(samantha|ava|allison|susan|nicky|zoe|karen|victoria|aria|jenny|michelle|female|google us)/i.test(v.name))
                   || pool.find(v=>!MALE.test(v.name)) || pool[0];
  fillVoiceSel(pool);
}
function fillVoiceSel(pool){
  const s=document.getElementById('voiceSel'); if(!s) return;
  s.innerHTML = pool.map(v=>{
    const nm=v.name.replace(/ - English.*/,'').replace(/Online \(Natural\)/,'✨');
    return `<option value="${v.name}"${VOICE&&v.name===VOICE.name?' selected':''}>🎙 ${nm}</option>`;
  }).join('');
}
document.getElementById('voiceSel').addEventListener('change',e=>{
  VOICE = VOICES.find(v=>v.name===e.target.value)||VOICE; say(G.combo==='aw'?'awesome':'natural');
});
if('onvoiceschanged' in speechSynthesis) speechSynthesis.onvoiceschanged = pickVoice;
pickVoice();
function say(w){
  try{
    if(!VOICE) pickVoice();
    const u = new SpeechSynthesisUtterance(w);
    u.lang='en-US'; if(VOICE) u.voice=VOICE; u.rate=.95; u.pitch=1.0;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }catch(e){}
}

// 高亮单词里的目标拼写：优先用该词自带的 hl（音位页里每词各自的拼写），否则用组的 combo
function hlWord(word, spell){
  const c = (spell||'').replace(/[.*+?^${}()|[\]\\\/·\s]/g,'');  // 只取干净字母做高亮，去掉 / · 空格等
  if(!c) return word;
  try{ return word.replace(new RegExp('('+c+')','i'), '<span class="hl">$1</span>'); }
  catch(e){ return word; }
}

// ---------- card
function card(w){
  const tags = (w.levels||[]).map(l=>`<span class="tag ${LVCLASS[l]||''}">${l}</span>`).join('');
  const roots = (w.roots||[]).map(r=>`<span class="root"><b>${r.part}</b> ${r.meaning}</span>`).join('');
  const exs = (w.examples||[]).map(e=>{
    const fam = /造句/.test(e.source)? '' : ' famous';
    return `<div class="ex${fam}"><div class="en">${e.en}</div><div class="zh">${e.zh}</div><span class="src">— ${e.source}</span></div>`;
  }).join('');
  const syns = (w.synonyms||[]).map(s=>
    `<div class="lex"><b class="lw" onclick="event.stopPropagation();say('${s.w}')">${s.w}</b>`+
    `${s.ipa?` <span class="lip">${s.ipa}</span>`:''}${s.note?` <span class="ln">— ${s.note}</span>`:''}</div>`).join('');
  const ants = (w.antonyms||[]).map(a=>
    `<span class="antchip" onclick="event.stopPropagation();say('${a.w}')">${a.w}${a.note?` <i>${a.note}</i>`:''}</span>`).join('');
  const lexSec = (syns||ants||w.nuance)
    ? `<div class="sec"><span class="l">🔗 近义词辨析 · 反义词</span>`+
      `${syns?`<div class="lexgroup"><span class="lextag syn">近义</span><div class="lexlist">${syns}</div></div>`:''}`+
      `${ants?`<div class="lexgroup"><span class="lextag ant">反义</span><div class="lexlist antline">${ants}</div></div>`:''}`+
      `${w.nuance?`<div class="nuance">🎯 ${w.nuance}</div>`:''}</div>`
    : '';
  const senses = (w.senses||[]).map(s=>
    `<div class="sense"><div class="s-gloss"><b>${s.gloss}</b>${s.logic?` <span class="s-logic">← ${s.logic}</span>`:''}</div>`+
    `${s.en?`<div class="s-ex"><span class="s-en">${s.en}</span> <span class="s-zh">${s.zh||''}</span></div>`:''}</div>`).join('');
  const senseSec = (w.core||senses)
    ? `<div class="sec"><span class="l">🧠 一词多义 · 核心意象串解</span>`+
      `${w.core?`<div class="coreimg">🎯 核心感觉：${w.core}</div>`:''}${senses}</div>`
    : '';
  const isU = unfam.has(w.word);
  const so = sgOf(w.subgroup);
  return `<div class="card${isU?' unfamiliar':''}" data-w="${w.word}" onclick="if(document.body.classList.contains('mem'))this.classList.toggle('reveal')">
    <span class="sub-tag" style="background:${sgColor(w.subgroup)}">${so?(so.tag||so.label):''}</span>
    <div class="whead">
      <span class="word">${hlWord(w.word, w.hl || G.combo)}</span>
      <span class="ipa">${w.ipa}</span>
      <button class="say" onclick="event.stopPropagation();say('${w.word}')" title="朗读">🔊</button>
    </div>
    <div class="tags">${tags}</div>
    <div class="mean">${w.meaning}</div>
    ${senseSec}
    ${w.etymology?`<div class="sec"><span class="l">🏛 造词来源 · 词源故事</span>${w.etymology}</div>`:''}
    ${roots?`<div class="sec"><span class="l">🧩 词根词缀</span><div class="roots">${roots}</div></div>`:''}
    ${w.phonetics?`<div class="sec"><span class="l">🗣 发音规律</span>${w.phonetics}</div>`:''}
    ${w.tip?`<div class="sec"><span class="l">💡 记忆钩子</span><div class="tip">${w.tip}</div></div>`:''}
    ${exs?`<div class="sec"><span class="l">✍️ 造句 · 名著/影视例句</span>${exs}</div>`:''}
    ${lexSec}
    <label class="check" onclick="event.stopPropagation()">
      <input type="checkbox" ${isU?'checked':''} onchange="toggleUnfam('${w.word}',this.checked)"> 🔺 标记不熟悉
    </label>
  </div>`;
}

function match(w){
  if(onlyUnfam && !unfam.has(w.word)) return false;
  if(curLv!=='全部' && !(w.levels||[]).includes(curLv)) return false;
  if(curSg!=='全部' && w.subgroup!==curSg) return false;
  if(curQ){
    const s=(w.word+' '+w.meaning).toLowerCase();
    if(!s.includes(curQ.toLowerCase())) return false;
  }
  return true;
}

function renderGrid(){
  const list = G.words.filter(match);
  // 不熟悉的置顶（稳定排序，保持各自原有相对顺序）
  list.sort((a,b)=>(unfam.has(b.word)?1:0)-(unfam.has(a.word)?1:0));
  const g = document.getElementById('grid');
  g.innerHTML = list.length? list.map(card).join('') : '<div class="empty">没有匹配的单词，换个筛选试试～</div>';
  updateUnfamCount();
}

function toggleUnfam(word, on){
  if(on) unfam.add(word); else unfam.delete(word);
  localStorage.setItem(KEY, JSON.stringify([...unfam]));
  const c = document.querySelector(`.card[data-w="${word}"]`);
  if(c) c.classList.toggle('unfamiliar', on);   // 立即变色，卡片原位不跳动；置顶在下次渲染/筛选时生效
  updateUnfamCount();
}
function updateUnfamCount(){
  const n = G.words.filter(w=>unfam.has(w.word)).length;
  const el = document.getElementById('unfamN');
  if(el) el.textContent = n;
}

document.getElementById('q').addEventListener('input',e=>{curQ=e.target.value;renderGrid();});
document.getElementById('unfamBtn').addEventListener('click',e=>{
  onlyUnfam=!onlyUnfam;
  e.currentTarget.classList.toggle('on',onlyUnfam);
  renderGrid();
});
document.getElementById('memBtn').addEventListener('click',e=>{
  document.body.classList.toggle('mem');
  e.target.classList.toggle('on');
  e.target.textContent = document.body.classList.contains('mem')?'🧠 记忆模式(开)·悬停显形':'🧠 记忆模式';
});

// ---------- 测验：英文 → 中文四选一（覆盖当前筛选到的全部单词）
let quiz=null;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
// 测验池 = 本页(筛选后)全部词 + 它们的同义词 + 衍生词（去重）
function quizPool(){
  const base = G.words.filter(match);
  const items=[]; const seen=new Set();
  const add=(word,ipa,meaning)=>{const k=(word||'').toLowerCase();
    if(!word||!meaning||seen.has(k))return; seen.add(k); items.push({word,ipa:ipa||'',meaning});};
  base.forEach(w=>{
    add(w.word,w.ipa,w.meaning);
    (w.synonyms||[]).forEach(s=>add(s.w,s.ipa,s.gloss||s.note));
    (w.derivatives||[]).forEach(dv=>add(dv.w,dv.ipa,dv.gloss||dv.note));
  });
  return items;
}
function startQuiz(src){
  const pool = src || quizPool();
  if(pool.length<4){ alert('至少要有 4 个词才能测验，请先放宽上方筛选～'); return; }
  quiz={list:shuffle(pool), i:0, score:0, wrong:[], done:false, next:null, pool:quizPool()};
  document.getElementById('quizOv').style.display='flex';
  renderQ();
}
function renderQ(){
  quiz.done=false; quiz.next=null;
  const q=quiz.list[quiz.i];
  const others=(quiz.pool||[]).filter(w=>w.meaning!==q.meaning);
  const opts=shuffle([q.meaning, ...shuffle(others).slice(0,3).map(w=>w.meaning)]);
  const K=['1','2','3','4'];
  document.getElementById('qbox').innerHTML=`
    <div class="qtop"><span>第 ${quiz.i+1} / ${quiz.list.length} 题 · 已答对 ${quiz.score}</span>
      <span style="cursor:pointer" onclick="closeQuiz()">✕ 关闭</span></div>
    <div class="qbar2"><i style="width:${quiz.i/quiz.list.length*100}%"></i></div>
    <div class="qword">${q.word} <button class="say" style="vertical-align:middle;width:30px;height:30px;font-size:14px" onclick="say('${q.word}')">🔊</button></div>
    <div class="qipa">${q.ipa}</div>
    <div class="qopts" id="qopts">${opts.map((o,k)=>
      `<button class="qopt" data-m="${encodeURIComponent(o)}" onclick="answer(this,'${encodeURIComponent(q.meaning)}')">
        <span class="k">${K[k]}</span><span>${o}</span></button>`).join('')}</div>
    <div class="hint">按 1–4 键作答 · 回车进入下一题</div>`;
  say(q.word);
}
function answer(el, correctEnc){
  if(quiz.done) return; quiz.done=true;
  const correct=decodeURIComponent(correctEnc);
  const chosen=decodeURIComponent(el.dataset.m);
  if(chosen===correct) quiz.score++; else quiz.wrong.push(quiz.list[quiz.i]);
  document.querySelectorAll('#qopts .qopt').forEach(b=>{
    const m=decodeURIComponent(b.dataset.m);
    if(m===correct) b.classList.add('right');
    else if(b===el) b.classList.add('wrong');
    else b.classList.add('dim');
    b.style.pointerEvents='none';
  });
  const btn=document.createElement('button');
  btn.className='qnext';
  btn.textContent = quiz.i<quiz.list.length-1 ? '下一题 →' : '看结果 →';
  btn.onclick=nextQ;
  document.getElementById('qbox').appendChild(btn);
  quiz.next=btn;
}
function nextQ(){
  if(quiz.i<quiz.list.length-1){ quiz.i++; renderQ(); } else endQuiz();
}
function endQuiz(){
  const tot=quiz.list.length, pct=Math.round(quiz.score/tot*100);
  const wrongHtml = quiz.wrong.length
    ? quiz.wrong.map(w=>`<div class="r"><b>${w.word}</b> ${w.ipa} — ${w.meaning}</div>`).join('')
    : '<div class="r">全部答对，太强了！🎉</div>';
  const wrongCopy = quiz.wrong.slice();
  document.getElementById('qbox').innerHTML=`
    <div class="qend">
      <div class="qtop" style="justify-content:flex-end"><span style="cursor:pointer" onclick="closeQuiz()">✕ 关闭</span></div>
      <div>本轮得分</div><div class="qscore">${quiz.score}/${tot}</div>
      <div style="color:var(--muted)">正确率 ${pct}%</div>
      <div class="qwrong"><div style="color:var(--exc);font-weight:700;margin-bottom:4px">错题（${quiz.wrong.length}）</div>${wrongHtml}</div>
      <div id="qendBtns"></div>
    </div>`;
  const box=document.getElementById('qendBtns');
  if(wrongCopy.length){
    const b1=document.createElement('button'); b1.className='qnext'; b1.textContent='只测这些错题';
    b1.onclick=()=>startQuiz(wrongCopy); box.appendChild(b1);
  }
  const b2=document.createElement('button'); b2.className='qnext';
  b2.style.cssText='background:#fff;color:var(--accent);border:1.5px solid var(--accent);margin-top:8px';
  b2.textContent='再来一轮（当前筛选）'; b2.onclick=()=>startQuiz(); box.appendChild(b2);
}
function closeQuiz(){ document.getElementById('quizOv').style.display='none'; quiz=null; }
document.getElementById('quizBtn').addEventListener('click',()=>startQuiz());
document.getElementById('quizOv').addEventListener('click',e=>{ if(e.target.id==='quizOv') closeQuiz(); });
document.addEventListener('keydown',e=>{
  if(!quiz || document.getElementById('quizOv').style.display==='none') return;
  if(quiz.next && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); quiz.next.click(); return; }
  if(!quiz.done && /^[1-4]$/.test(e.key)){ const b=document.querySelectorAll('#qopts .qopt')[+e.key-1]; if(b) b.click(); }
});

document.getElementById('foot').innerHTML =
  `共 ${G.words.length} 词 · 数据源：托福 4264 词表（真实词库）+ 六级核心词 · `+
  `发音由浏览器语音合成朗读 · 名著/影视例句均为真实出处，「造句」为学习例句，「高频搭配」为常用短语。`;

renderHero(); renderPassage(); renderSents(); renderFilters(); renderGrid();
</script>
