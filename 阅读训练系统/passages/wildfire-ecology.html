const DATA  = {"id": "wildfire-ecology", "title": "The Ecological Role of Wildfire", "domain": "环境", "difficulty": 4, "est_words": 730, "intro": "This passage examines why fire, long regarded purely as a destructive force, is now understood to be an essential agent in many terrestrial ecosystems.", "paragraphs": [{"n": 1, "text": "For most of the twentieth century, wildfire was regarded almost exclusively as an agent of destruction, a hazard to be suppressed wherever it appeared. Yet ecologists studying the plant communities of regions that burn frequently—the pine forests of western North America, the chaparral of the Mediterranean basin, and the eucalyptus woodlands of Australia—have gradually assembled evidence that fire, far from being an intruder in these landscapes, is a recurring process to which the vegetation has become intricately adapted. In such fire-prone environments, where lightning strikes and prolonged summer droughts make combustion virtually inevitable over time, the plants that dominate are precisely those whose life cycles are keyed to periodic burning. The notion that these communities could be protected simply by keeping flames out of them, an assumption that guided policy for decades, rested on a fundamental misreading of how the systems actually function."}, {"n": 2, "text": "The adaptations that allow certain plants not merely to survive fire but to depend on it take a variety of forms. Some conifers, most famously the lodgepole pine, produce cones that are sealed shut by a coating of resin and that will release their seeds only when the heat of a passing fire melts the resin away—a trait known as serotiny, which ensures that seeds fall onto freshly cleared, nutrient-enriched ground rather than into the shade of an unburned forest. Other species, protected by thick, insulating bark that shields the living tissue beneath from lethal temperatures, are able to withstand ground fires that would kill thinner-barked competitors outright. Still others, their above-ground portions consumed entirely by the flames, resprout vigorously within weeks from underground root crowns or specialized buds, drawing on reserves of stored energy that the fire itself cannot reach."}, {"n": 3, "text": "Beyond these individual adaptations, fire performs functions at the level of the whole ecosystem that no other disturbance replicates so efficiently. When a stand of vegetation burns, the nutrients that had been locked up in accumulated dead wood, fallen needles, and slowly decomposing litter—material that, in cool or dry climates, might otherwise take decades to break down—are converted almost instantly into ash and returned to the soil in a form that living roots can readily absorb. ■ This sudden pulse of released minerals, together with the removal of the shading canopy, creates conditions under which light-demanding pioneer species germinate and spread. ■ Over the years that follow, these early colonizers are themselves gradually displaced by taller, longer-lived plants, so that the burned patch advances through a predictable sequence of communities. ■ Fire, in this sense, does not merely destroy; it resets the successional clock and sustains a shifting mosaic of habitats across the landscape. ■"}, {"n": 4, "text": "The recognition of these ecological roles came late, and its arrival exposed the unintended consequences of the suppression policies that had been pursued so energetically. By extinguishing small fires as quickly as they were detected, land-management agencies inadvertently allowed dead branches, dense undergrowth, and other combustible material to accumulate on the forest floor year after year, unburned. The paradoxical result was that landscapes from which fire had been most successfully excluded became, over time, the ones most dangerously primed to burn: when ignition finally did occur under such conditions, the abundant fuel could feed fires far hotter, larger, and more difficult to control than the frequent, low-intensity burns that suppression had been designed to prevent. Fires of this severity, rather than clearing the understory and sparing the mature trees, may consume entire canopies and sterilize the soil, inflicting precisely the kind of catastrophic damage that the original policy had sought to avoid."}, {"n": 5, "text": "Out of this understanding has grown the increasingly common, though still contested, practice of prescribed burning—the deliberate setting of controlled, low-intensity fires under carefully chosen conditions of weather and moisture in order to consume excess fuel before it can accumulate to dangerous levels. Proponents argue that such managed fire, by mimicking the natural regime under which fire-adapted communities evolved, both reduces the risk of destructive wildfires and restores the ecological benefits that suppression had suppressed. Critics counter that prescribed fires are difficult to contain and occasionally escape, that the smoke they generate poses public-health concerns, and that a century of accumulated fuel cannot be safely burned off without unacceptable risk. What few ecologists now dispute, however, is the underlying premise that had been overlooked for so long: in landscapes shaped by fire, the complete absence of fire is not a stable or a benign condition."}], "glossary": [{"term": "serotiny", "def": "the retention of seeds in cones or fruits that open only in response to an environmental trigger such as heat"}, {"term": "chaparral", "def": "a shrubland plant community of hot, dry regions, characteristic of Mediterranean climates"}, {"term": "succession", "def": "the gradual, orderly replacement of one plant community by another over time"}], "questions": [{"type": "vocabulary", "stem": "The word <b>\"intricately\"</b> in paragraph 1 is closest in meaning to", "para": 1, "highlight": "intricately", "options": ["intensely", "elaborately", "recently", "temporarily"], "answer": 1, "explain": "intricately ＝ 错综复杂地、精细地，与 elaborately（精巧地、复杂地）最接近。原文说植被对火「intricately adapted」，指其适应机制复杂精细。intensely（强烈地）、recently（近期）、temporarily（暂时地）均改变原意。"}, {"type": "factual", "stem": "According to paragraph 1, why is combustion described as \"virtually inevitable over time\" in fire-prone environments?", "para": 1, "options": ["Because the dominant plants deliberately produce flammable resins", "Because lightning strikes and prolonged summer droughts occur there", "Because fire-suppression policies failed in those regions", "Because the vegetation cannot decompose without periodic burning"], "answer": 1, "explain": "原文：「where lightning strikes and prolonged summer droughts make combustion virtually inevitable over time」——雷击与夏季长期干旱使燃烧几乎不可避免。B 正确。A 把第2段的 resin 张冠李戴且原文未说「故意」；C、D 均非本句给出的原因。"}, {"type": "vocabulary", "stem": "The word <b>\"withstand\"</b> in paragraph 2 is closest in meaning to", "para": 2, "highlight": "withstand", "options": ["resist", "attract", "spread", "ignite"], "answer": 0, "explain": "withstand ＝ 抵御、经受住，与 resist 同义。原文说厚树皮的树能 withstand ground fires（经受住地表火），resist 保留原意。attract（吸引）、spread（扩散）、ignite（点燃）均不符。"}, {"type": "factual", "stem": "According to paragraph 2, the trait of serotiny benefits a conifer by ensuring that its seeds", "para": 2, "options": ["are protected by a thick layer of insulating bark", "resprout from underground root crowns after a fire", "land on freshly cleared, nutrient-enriched ground", "remain permanently sealed within resin-coated cones"], "answer": 2, "explain": "原文：serotiny「ensures that seeds fall onto freshly cleared, nutrient-enriched ground rather than into the shade of an unburned forest」。C 正确。A 是另一类适应（厚树皮）；B 是萌蘖，属第三类适应；D 与「release their seeds only when the heat…melts the resin away」相反——遇火即释放，并非永久封闭。"}, {"type": "sentence_simplification", "stem": "Which of the following best expresses the essential information in the <b>highlighted sentence</b> in paragraph 3? Incorrect choices change the meaning or leave out essential information.", "para": 3, "highlight": "When a stand of vegetation burns, the nutrients that had been locked up in accumulated dead wood, fallen needles, and slowly decomposing litter—material that, in cool or dry climates, might otherwise take decades to break down—are converted almost instantly into ash and returned to the soil in a form that living roots can readily absorb.", "options": ["In cool or dry climates, dead wood and litter take decades to decompose, which is why fire rarely occurs there.", "Burning quickly turns nutrients trapped in dead plant material into ash, returning them to the soil in a form roots can easily take up.", "Fire destroys the accumulated dead wood and litter so completely that few nutrients remain available to living roots.", "Living roots absorb nutrients from decomposing litter over decades, a process that fire interrupts and slows."], "answer": 1, "explain": "原句核心：燃烧把困在死木、落叶、枯落物中、本需数十年分解的养分几乎瞬间变成灰、以根系易吸收的形式还给土壤。B 全保留。A 只抓插入语并编造「所以那里少有火」；C 说养分被毁「所剩无几」与原意相反；D 把火说成「打断并减慢」吸收，颠倒了「加速释放」的含义。"}, {"type": "rhetorical_purpose", "stem": "In paragraph 3, the author refers to material that <b>\"might otherwise take decades to break down\"</b> primarily in order to", "para": 3, "highlight": "might otherwise take decades to break down", "options": ["emphasize how much faster fire makes trapped nutrients available than natural decay would", "prove that decomposition is impossible in cool or dry climates", "explain why pioneer species are unable to germinate after a fire", "argue that dead wood should be removed by hand rather than by burning"], "answer": 0, "explain": "该短语与「converted almost instantly」形成对比：自然分解要数十年，火却几乎瞬间释放养分，意在凸显火循环养分之高效。A 正确。B「不可能分解」过度；C、D 原文无据。"}, {"type": "insert_text", "stem": "Look at the four squares [■] in paragraph 3 that indicate where the following sentence could be added. Where would the sentence best fit?", "para": 3, "insert_sentence": "The newly opened ground, in other words, does not stay bare for long.", "options": ["方块 ①", "方块 ②", "方块 ③", "方块 ④"], "answer": 1, "explain": "待插句用「The newly opened ground」回指前句「light-demanding pioneer species germinate and spread」所描述的空地被先锋种迅速占据（「不会长久裸露」），并顺势引出下一句「Over the years that follow」演替被更高植物取代。故放在第 ② 个方块最连贯。放①则「newly opened ground」尚无所指；放③④会割裂演替时间链。"}, {"type": "negative_factual", "stem": "According to paragraph 4, the fire-suppression policies had all of the following consequences EXCEPT:", "para": 4, "options": ["Dead branches and dense undergrowth built up on the forest floor", "The most protected landscapes became the most dangerous to burn", "Later fires could become hotter and harder to control", "The frequency of low-intensity ground fires steadily increased"], "answer": 3, "explain": "灭火政策恰恰是「extinguishing small fires as quickly as they were detected」——低强度地表火被扑灭而非增多，D 与原文相反（EXCEPT 选它）。A（可燃物堆积）、B（越受保护越危险）、C（后来的火更猛更难控）均为原文明述的后果。"}, {"type": "inference", "stem": "It can be inferred from paragraphs 4 and 5 that frequent, low-intensity fires are generally beneficial because they", "para": 5, "options": ["completely eliminate the need for any human management of forests", "consume excess fuel before it can accumulate to dangerous levels", "sterilize the soil and thereby prevent the spread of pioneer species", "raise the temperature of later fires so that canopies burn more thoroughly"], "answer": 1, "explain": "第4段指出正是缺少频繁小火才使燃料堆积、酿成大火；第5段说受控火烧「consume excess fuel before it can accumulate to dangerous levels」。可推断频繁低强度火的好处在于持续清除多余燃料。B 正确。A 过度（第5段仍在讨论管理与争论）；C「sterilize the soil」是高强度大火的破坏，非低强度火之益；D 与减灾逻辑相反。"}, {"type": "prose_summary", "stem": "An introductory sentence for a brief summary of the passage is provided below. Complete the summary by selecting the <b>THREE</b> answer choices that express the most important ideas in the passage.", "para": null, "intro_sentence": "In many fire-prone landscapes, wildfire is not simply a destructive hazard but an ecological process to which the vegetation is adapted.", "options": ["Many plants possess specific adaptations—such as heat-triggered cones, thick bark, and vigorous resprouting—that allow them to survive or even depend on periodic fire.", "By rapidly recycling nutrients and clearing the canopy, fire renews the soil and drives the successional replacement of one plant community by another.", "Decades of aggressive fire suppression allowed fuel to build up, setting the stage for larger and more destructive fires and prompting the debated use of prescribed burning.", "Eucalyptus woodlands in Australia burn more frequently than the pine forests of western North America or the Mediterranean chaparral.", "Prescribed burning has now been universally adopted because it eliminates all public-health concerns associated with smoke.", "Lightning strikes are the single most important cause of forest fires in every terrestrial ecosystem on Earth."], "answer": [0, 1, 2], "explain": "①植物对火的多种适应（第2段主旨）；②火循环养分、除冠、推动演替更新（第3段主旨）；③灭火政策致燃料堆积→更猛的火→引出受控火烧之争（第4、5段主旨）。干扰项：④是原文顺带列举的地点细节间的无据比较，非主旨；⑤与第5段「still contested」及烟雾健康顾虑相矛盾，「universally adopted」「eliminates all」皆过度；⑥「every ecosystem」「single most important」为原文未支持的绝对化陈述。"}]};

  const text = DATA.paragraphs[pi].text;
  const idx = text.indexOf(q.highlight);
  if(idx < 0) return null;
  return { para: pi, start: idx, end: idx + q.highlight.length };
}

function annsFor(pi){
  const list = (annots[pi] || []).map(a => ({...a, sys:false}));
  // ■ 方块作为系统 seg 边界
  const text = DATA.paragraphs[pi].text;
  for(let i=0;i<text.length;i++) if(text[i]==='■') list.push({id:'sq'+i,start:i,end:i+1,mark:'__sq',sys:true});
  const hl = activeHighlight();
  if(hl && hl.para===pi) list.push({id:'__hl',start:hl.start,end:hl.end,mark:'__hl',sys:true});
  return list;
}

function bracketPair(mk){ const m=markOf(mk); if(!m||!m.bracket) return null; return [m.bracket[0], m.bracket[1]]; }

function renderPara(pi){
  const text = DATA.paragraphs[pi].text;
  const anns = annsFor(pi);
  const bounds = new Set([0, text.length]);
  anns.forEach(a => { bounds.add(a.start); bounds.add(a.end); });
  const pts = [...bounds].sort((x,y)=>x-y);
  let sqCount = 0;
  let out = '';
  for(let i=0;i<pts.length;i++){
    const pos = pts[i];
    // 收括号（内层先收：start 大的先）
    anns.filter(a=>a.end===pos && bracketPair(a.mark)).sort((a,b)=>b.start-a.start)
        .forEach(a=>{ const m=markOf(a.mark); out += `<span class="brk" data-aid="${a.id}" data-pi="${pi}" style="color:${m.color}">${bracketPair(a.mark)[1]}</span>`; });
    // 开括号（外层先开：跨度大的先）
    anns.filter(a=>a.start===pos && bracketPair(a.mark)).sort((a,b)=>(b.end-b.start)-(a.end-a.start))
        .forEach(a=>{ const m=markOf(a.mark); out += `<span class="brk" data-aid="${a.id}" data-pi="${pi}" style="color:${m.color}">${bracketPair(a.mark)[0]}</span>`; });
    if(i===pts.length-1) break;
    const a=pos, b=pts[i+1], segText=text.slice(a,b);
    const cover = anns.filter(x=>x.start<=a && x.end>=b);
    const sqAnn = cover.find(x=>x.mark==='__sq');
    if(sqAnn){
      sqCount++;
      out += `<span class="seg sq" data-start="${a}" data-sq="${sqCount}">■</span>`;
      continue;
    }
    // 选内层（跨度最小）决定下划线/高亮
    let style='';
    const real = cover.filter(x=>x.mark!=='__sq');
    if(real.length){
      const inner = real.slice().sort((m,n)=>(m.end-m.start)-(n.end-n.start))[0];
      const m = markOf(inner.mark);
      if(inner.mark==='__hl'){ style='background:#fff3b0;font-weight:600;border-radius:2px;'; }
      else if(m){
        if(m.highlight) style += `background:${m.highlight};`;
        if(m.under==='double') style += `border-bottom:2px double ${m.color};`;
        else if(m.bracket) style += `border-bottom:1.5px solid ${m.color};`;
      }
    }
    out += `<span class="seg" data-start="${a}" style="${style}">${esc(segText)}</span>`;
  }
  return out;
}

function renderArticle(){
  let h = '';
  if(DATA.intro) h += `<div class="intro">${esc(DATA.intro)}</div>`;
  DATA.paragraphs.forEach((p, pi) => {
    h += `<div class="para" data-para="${pi}" id="para-${pi}"><span class="pnum">${p.n}</span><span class="ptext">${renderPara(pi)}</span></div>`;
  });
  if(DATA.glossary && DATA.glossary.length){
    h += '<div class="glossary"><b>Glossary</b><br>';
    h += DATA.glossary.map(g=>`<b>${esc(g.term)}</b>: ${esc(g.def)}`).join('<br>');
    h += '</div>';
  }
  artEl.innerHTML = h;
  artEl.style.fontSize = (1 + fontStep*0.08) + 'em';
  applyInsertPreview();
}

function rerenderPara(pi){
  const el = artEl.querySelector(`#para-${pi} .ptext`);
  if(el) el.innerHTML = renderPara(pi);
}

/* ============ 选区 → 纯文本偏移 ============ */
function plainOffset(pEl, node, off){
  const segs = pEl.querySelectorAll('.seg');
  for(const s of segs){
    const base = +s.dataset.start;
    const r = document.createRange(); r.selectNodeContents(s);
    let c; try{ c = r.comparePoint(node, off); }catch(e){ continue; }
    if(c===0){ return node.nodeType===3 ? base+off : base + (off>0 ? s.textContent.length : 0); }
    if(c<0){ return base; }
  }
  return DATA.paragraphs[+pEl.dataset.para].text.length;
}

function readSelection(){
  const sel = window.getSelection();
  if(!sel.rangeCount || sel.isCollapsed) return null;
  const r = sel.getRangeAt(0);
  let node = r.commonAncestorContainer;
  let pEl = node.nodeType===3 ? node.parentElement : node;
  pEl = pEl.closest('.para');
  if(!pEl || !artEl.contains(pEl)) return null;
  const pi = +pEl.dataset.para;
  let start = plainOffset(pEl, r.startContainer, r.startOffset);
  let end   = plainOffset(pEl, r.endContainer, r.endOffset);
  if(end < start) [start,end] = [end,start];
  const text = DATA.paragraphs[pi].text;
  // 去掉首尾空白
  while(start<end && /\s/.test(text[start])) start++;
  while(end>start && /\s/.test(text[end-1])) end--;
  if(end<=start) return null;
  return { pi, start, end, rect: r.getBoundingClientRect() };
}

/* ============ 选区工具条 ============ */
const pop = document.getElementById('pop');
let curSel = null;

function buildPop(){
  let h = '';
  MARKS.forEach(m=>{
    const g = m.bracket ? m.bracket[0]+m.bracket[1] : (m.under? '＿' : '▉');
    h += `<button data-mk="${m.key}" style="background:${m.color}" title="${m.hint}"><span class="gl">${g}</span>${m.name}</button>`;
  });
  h += `<button class="del" data-mk="__del" title="清除选区内的标注">清除</button>`;
  pop.innerHTML = h;
}
buildPop();

function showPop(sel){
  curSel = sel;
  pop.classList.add('show');
  const pr = pop.getBoundingClientRect();
  let x = sel.rect.left + sel.rect.width/2 - pr.width/2;
  let y = sel.rect.top - pr.height - 8;
  x = Math.max(8, Math.min(x, innerWidth - pr.width - 8));
  if(y < 8) y = sel.rect.bottom + 8;
  pop.style.left = x+'px'; pop.style.top = y+'px';
}
function hidePop(){ pop.classList.remove('show'); curSel=null; }

pop.addEventListener('mousedown', e=>{
  const b = e.target.closest('button'); if(!b || !curSel) return;
  e.preventDefault();
  const mk = b.dataset.mk, {pi,start,end} = curSel;
  if(mk==='__del'){
    annots[pi] = (annots[pi]||[]).filter(a => a.end<=start || a.start>=end);
    if(!annots[pi].length) delete annots[pi];
  }else{
    if(!annots[pi]) annots[pi]=[];
    annots[pi].push({ id:'a'+Date.now()+Math.round(performance.now()), start, end, mark:mk });
  }
  save(AKEY, annots); rerenderPara(pi); hidePop();
  window.getSelection().removeAllRanges();
});

document.addEventListener('mouseup', e=>{
  if(pop.contains(e.target)) return;
  setTimeout(()=>{ const s = readSelection(); if(s) showPop(s); else hidePop(); }, 0);
});
document.addEventListener('mousedown', e=>{ if(!pop.contains(e.target)) hidePop(); });

// 点击括号删除该条标注
artEl.addEventListener('click', e=>{
  const b = e.target.closest('.brk'); if(!b) return;
  const pi=+b.dataset.pi, id=b.dataset.aid;
  annots[pi] = (annots[pi]||[]).filter(a=>a.id!==id);
  if(!annots[pi].length) delete annots[pi];
  save(AKEY, annots); rerenderPara(pi);
});

/* ============ 题目渲染 ============ */
const qbody = document.getElementById('qbody');
const dotsEl = document.getElementById('dots');
const KEYS = ['A','B','C','D','E','F'];

function isMulti(q){ return q.type==='prose_summary'; }

function renderDots(){
  dotsEl.innerHTML = DATA.questions.map((q,i)=>{
    let cls='dot'; if(i===cur) cls+=' cur';
    if(checked[i]){ cls += judge(i) ? ' ok' : ' no'; }
    else if(answers[i]!=null && (!isMulti(q) || answers[i].length)) cls+=' done';
    return `<div class="${cls}" data-i="${i}">${i+1}</div>`;
  }).join('');
}

function judge(i){
  const q=DATA.questions[i], a=answers[i];
  if(isMulti(q)){ const need=q.answer.slice().sort().join(','); const got=(a||[]).slice().sort().join(','); return need===got; }
  return a===q.answer;
}

function renderQ(){
  const q = DATA.questions[cur];
  document.getElementById('qpos').textContent = `第 ${cur+1} / ${DATA.questions.length} 题`;
  let h = `<span class="qtype">${TYPE_LABELS[q.type]||q.type}</span>`;
  h += `<div class="stem">${q.stem}</div>`;
  if(q.type==='insert_text' && q.insert_sentence){
    h += `<div class="insbox">待插入句：<b>${esc(q.insert_sentence)}</b></div>`;
  }
  if(q.type==='prose_summary' && q.intro_sentence){
    h += `<div class="insbox" style="border-style:solid">导语：${esc(q.intro_sentence)}</div>`;
  }
  const multi = isMulti(q);
  const sel = answers[cur];
  const done = checked[cur];
  h += '<div class="opts">';
  q.options.forEach((opt,oi)=>{
    let cls='opt';
    const chosen = multi ? (sel||[]).includes(oi) : sel===oi;
    if(chosen) cls+=' sel';
    if(done){
      const correct = multi ? q.answer.includes(oi) : oi===q.answer;
      if(correct) cls+=' ok'; else if(chosen) cls+=' no';
    }
    let tag='';
    if(done){ const correct = multi ? q.answer.includes(oi) : oi===q.answer;
      if(correct) tag='<span class="tag">✓ 正确</span>'; else if(chosen) tag='<span class="tag">✗</span>'; }
    h += `<div class="${cls}" data-oi="${oi}"><span class="k">${KEYS[oi]}</span><span>${opt}</span>${tag}</div>`;
  });
  h += '</div>';
  const submitLabel = done ? '已提交' : '提交';
  h += `<div class="qfoot">
    <button class="btn p" id="submit" ${done?'disabled':''}>${submitLabel}</button>
    ${multi?'<span style="font-size:12px;color:#8c8072">多选：选 3 项</span>':''}
  </div>`;
  h += `<div class="expl ${done?(judge(cur)?'right show':'wrong show'):''}" id="expl"><b>${done?(judge(cur)?'✓ 回答正确':'✗ 回答错误'):''}</b><br>${q.explain||''}</div>`;
  qbody.innerHTML = h;

  qbody.querySelectorAll('.opt').forEach(el=>{
    el.addEventListener('click', ()=>{
      if(checked[cur]) return;
      const oi=+el.dataset.oi;
      if(multi){
        let arr = answers[cur]||[];
        if(arr.includes(oi)) arr=arr.filter(x=>x!==oi);
        else { if(arr.length>=3){ return; } arr=[...arr,oi]; }
        answers[cur]=arr;
      }else answers[cur]=oi;
      save(QKEY, answers); renderQ(); renderDots();
    });
  });
  const sb = qbody.querySelector('#submit');
  if(sb) sb.addEventListener('click', ()=>{
    if(answers[cur]==null || (multi && answers[cur].length<3)){ sb.textContent = multi?'请选满 3 项':'请先选择'; setTimeout(()=>sb.textContent='提交',900); return; }
    checked[cur]=true; renderQ(); renderDots(); updateScore();
    if(q.type==='insert_text') applyInsertPreview();
  });
  renderDots();
  document.getElementById('prev').disabled = cur===0;
  document.getElementById('next').disabled = cur===DATA.questions.length-1;
  applyInsertPreview();
}

function updateScore(){
  const total = DATA.questions.length;
  const done = Object.keys(checked).length;
  if(done<total){ document.getElementById('scorebar').classList.remove('show'); return; }
  let ok=0; for(let i=0;i<total;i++) if(judge(i)) ok++;
  const sb=document.getElementById('scorebar');
  sb.classList.add('show');
  sb.innerHTML = `本篇完成：<b>${ok} / ${total}</b> 正确${ok>=total*0.8?' 🎉 达到高分区间':''}`;
}

/* ============ insert_text 预览 ============ */
function applyInsertPreview(){
  // 清除旧预览
  artEl.querySelectorAll('.sq.on').forEach(s=>{s.classList.remove('on');});
  artEl.querySelectorAll('.ins-preview').forEach(s=>s.remove());
  const q = DATA.questions[cur];
  if(q.type!=='insert_text' || answers[cur]==null) return;
  const oi = answers[cur];
  const sq = artEl.querySelector(`#para-${q.para-1} .sq[data-sq="${oi+1}"]`);
  if(sq){
    sq.classList.add('on');
    if(checked[cur] && q.insert_sentence){
      const span=document.createElement('span');
      span.className='ins-preview'; span.textContent=' '+q.insert_sentence+' ';
      sq.after(span);
    }
  }
}

/* ============ 导航 ============ */
document.getElementById('prev').onclick = ()=>{ if(cur>0){cur--; onQChange();} };
document.getElementById('next').onclick = ()=>{ if(cur<DATA.questions.length-1){cur++; onQChange();} };
dotsEl.addEventListener('click', e=>{ const d=e.target.closest('.dot'); if(d){ cur=+d.dataset.i; onQChange(); } });
document.getElementById('locate').onclick = e=>{ e.preventDefault(); locate(); };

function onQChange(){
  // 重渲染受 highlight 影响的段落
  DATA.paragraphs.forEach((p,pi)=>rerenderPara(pi));
  renderQ();
  locate(true);
}
function locate(soft){
  const q=DATA.questions[cur]; if(q.para==null) return;
  const el=artEl.querySelector(`#para-${q.para-1}`); if(!el) return;
  el.scrollIntoView({behavior:'smooth', block: soft?'nearest':'center'});
  if(!soft){ el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
}

/* ============ 顶栏控件 ============ */
document.getElementById('ptitle').textContent = DATA.title;
document.getElementById('cdom').textContent = DATA.domain;
document.getElementById('cdiff').textContent = '难度 ' + '★'.repeat(DATA.difficulty) + '☆'.repeat(5-DATA.difficulty);
document.getElementById('cwords').textContent = (DATA.est_words||'') + ' 词';

document.getElementById('btnClear').onclick = ()=>{
  if(!confirm('清空本篇全部括号 / 标注？')) return;
  annots={}; save(AKEY, annots); renderArticle();
};
document.getElementById('btnFont').onclick = ()=>{
  fontStep = (fontStep+1)%4; save('toefl-read:font', fontStep);
  artEl.style.fontSize = (1 + fontStep*0.08) + 'em';
};

// 图例
const legend = document.getElementById('legend');
legend.innerHTML = '<h4>括号法图例（选中原文即可标）</h4>' +
  MARKS.map(m=>{ const g=m.bracket?m.bracket[0]+m.bracket[1]:(m.under?'＿＿':'▉'); return `<div class="lg"><span class="sw" style="color:${m.color}">${g}</span><span><b>${m.name}</b> · ${m.hint}</span></div>`;}).join('') +
  '<div class="tip">用法：鼠标划选原文中的成分 → 弹出条里点对应括号；把从句/短语/插入语逐层括起来，剩下没括的就是<b>主干</b>。点括号可删除；右上「清空标注」重来。</div>';
document.getElementById('btnLegend').onclick = ()=>legend.classList.toggle('show');

// 计时器（倒计时 18 分钟，点击开始/暂停）
let tLeft=18*60, tRun=false, tId=null;
const tEl=document.getElementById('timer');
function fmt(s){ const m=Math.floor(s/60), ss=s%60; return (m<10?'0':'')+m+':'+(ss<10?'0':'')+ss; }
function tick(){ if(tLeft>0){tLeft--; tEl.textContent=fmt(tLeft); if(tLeft===0){tEl.style.color='var(--bad)'; tRun=false; clearInterval(tId);}} }
tEl.onclick=()=>{ if(tRun){clearInterval(tId); tRun=false; tEl.style.opacity=.55;} else {tId=setInterval(tick,1000); tRun=true; tEl.style.opacity=1;} };

/* ============ 键盘：← → 切题 ============ */
document.addEventListener('keydown', e=>{
  if(e.target.tagName==='INPUT') return;
  if(e.key==='ArrowRight' && cur<DATA.questions.length-1){ cur++; onQChange(); }
  if(e.key==='ArrowLeft' && cur>0){ cur--; onQChange(); }
});

/* ============ 启动 ============ */
renderArticle();
renderQ();
// 恢复已提交状态
Object.keys(answers).forEach(k=>{ /* 保留作答，但不自动判分，等用户点提交 */ });
updateScore();
</script>
