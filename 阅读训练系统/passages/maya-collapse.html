<script>
const DATA  = {"id": "maya-collapse", "title": "The Collapse of the Classic Maya", "domain": "历史", "difficulty": 4, "est_words": 730, "intro": "This passage examines the competing explanations that archaeologists have proposed for the abandonment of the great lowland cities of the Classic Maya between roughly 750 and 900 CE.", "paragraphs": [{"n": 1, "text": "Between about 750 and 900 CE, the densely settled cities of the southern Maya lowlands—among them Tikal, Copán, and Palenque, whose monumental architecture and elaborate hieroglyphic inscriptions rank among the great achievements of the ancient Americas—were progressively abandoned. The record left by the Maya themselves, carved on stone monuments known as stelae that kings erected to commemorate their reigns, offers an unusually precise chronology of this decline: at one center after another, the practice of raising dated stelae ceased, and the erection of the last such monument, whose inscribed date can often be read to the day, marks the point beyond which centralized rule seems no longer to have functioned. This process, which unfolded over roughly a century and a half, did not proceed uniformly. Because different cities fell silent at different times, and because the northern lowlands and the highlands were far less severely affected, scholars have long resisted any single, tidy account of what has come to be called the Maya collapse."}, {"n": 2, "text": "For much of the twentieth century, explanations tended to emphasize internal social and political causes. One influential line of argument held that the institution of divine kingship—the ideology by which Maya rulers, presenting themselves as intermediaries between their communities and the supernatural world, justified their authority and the labor extracted to build the temples that glorified them—was inherently fragile. According to this view, a ruler whose legitimacy rested on his claimed ability to guarantee rain, fertility, and victory in war became dangerously exposed when those guarantees failed to materialize, and the very monuments meant to advertise royal power may have imposed demands on the populace that ordinary farmers, in times of hardship, were increasingly unwilling to meet. ■ Endemic warfare, once thought to have been largely ceremonial, has since been shown by the decipherment of the inscriptions to have been frequent, destructive, and aimed at the capture and sacrifice of rival lords. ■ Some archaeologists argue that escalating conflict among competing dynasties disrupted trade and agriculture across whole regions. ■ Others caution that warfare may have been as much a symptom of a deteriorating situation as a cause of it. ■"}, {"n": 3, "text": "A second family of explanations focuses on the environment, and in particular on the pressure that a large and growing population placed upon a fragile tropical landscape. Sustaining the cities required clearing extensive tracts of forest for maize agriculture, a practice that, on the thin and easily exhausted soils of the region, could accelerate erosion and diminish fertility within a few generations. Sediment cores extracted from lake beds, in which layers of soil washed down from the surrounding hills accumulated year after year, record exactly this kind of degradation: a marked increase in eroded material coinciding with the period of densest settlement. The construction of the plaster that coated Maya buildings, moreover, consumed enormous quantities of wood as fuel, so that the demands of monumental architecture themselves may have hastened the stripping of the forests on which the agricultural system ultimately depended."}, {"n": 4, "text": "It is drought, however, that has attracted the most attention in recent decades. Analyses of sediment and of mineral deposits from caves, whose chemistry preserves a sensitive record of ancient rainfall, indicate that the Maya lowlands experienced a series of severe dry episodes during the ninth century, precisely when the collapse was under way. Proponents of the drought hypothesis contend that a civilization dependent on seasonal rains and on reservoirs to store water through the dry months would have been acutely vulnerable to prolonged shortfalls in precipitation. Yet correlation is not causation, and critics point out that some cities were abandoned before the driest intervals recorded in the climate data, while others in comparably arid zones survived. The chronological fit, though suggestive, is imperfect, and drought alone cannot easily explain why the northern cities, subject to the same climatic swings, endured for centuries longer."}, {"n": 5, "text": "Most researchers now regard these hypotheses not as rivals to be adjudicated but as interlocking components of a single vulnerability. In this synthetic view, generations of deforestation and soil exhaustion had already narrowed the margin of subsistence when repeated droughts struck; the resulting shortages intensified competition and warfare among rulers whose authority depended on their being seen to command the very forces of nature that were now failing them; and as confidence in divine kingship eroded, the elaborate apparatus of the royal court—together with the artisans, scribes, and laborers it supported—could no longer be sustained. The collapse, on this reading, was less a sudden catastrophe than a cascade, in which environmental stress, political failure, and social withdrawal reinforced one another until the institutions that had defined Classic Maya civilization simply ceased to be maintained."}], "glossary": [{"term": "stela", "def": "a tall carved stone monument, often bearing a date and a portrait of a ruler (plural: stelae)"}, {"term": "divine kingship", "def": "a political system in which the ruler is regarded as sacred or as a link to the supernatural"}], "questions": [{"type": "factual", "stem": "According to paragraph 1, dated stelae are especially useful to scholars because they", "para": 1, "options": ["were erected only in the northern lowlands and the highlands", "provide a precise timeline for the decline of individual cities", "describe in detail the causes of each city's abandonment", "were produced continuously long after centralized rule had ended"], "answer": 1, "explain": "原文：stelae「offers an unusually precise chronology of this decline」，且最后一块石碑的日期常可精确到「day」，标志中央统治失效的时间点。B 正确。A 张冠李戴（南部低地才是重点）；C 石碑记录王的统治，并非解释废弃原因；D 与「the practice of raising dated stelae ceased」相反。"}, {"type": "vocabulary", "stem": "The word <b>\"fragile\"</b> in paragraph 2 is closest in meaning to", "para": 2, "highlight": "was inherently fragile", "options": ["easily broken down", "widely admired", "poorly recorded", "recently established"], "answer": 0, "explain": "fragile ＝ 脆弱的、易崩溃的，与 easily broken down 同义。下文说合法性一旦无法兑现承诺就「dangerously exposed」，印证其脆弱。B/C/D 均与语境无关。"}, {"type": "sentence_simplification", "stem": "Which of the following best expresses the essential information in the <b>highlighted sentence</b> in paragraph 2? Incorrect choices change the meaning or leave out essential information.", "para": 2, "highlight": "According to this view, a ruler whose legitimacy rested on his claimed ability to guarantee rain, fertility, and victory in war became dangerously exposed when those guarantees failed to materialize, and the very monuments meant to advertise royal power may have imposed demands on the populace that ordinary farmers, in times of hardship, were increasingly unwilling to meet.", "options": ["Rulers who could not deliver the rain, fertility, and victory they promised lost standing, and the costly monuments that displayed their power burdened farmers who, in hard times, grew unwilling to bear it.", "Farmers refused to build monuments because they no longer believed that rain, fertility, and victory could be guaranteed by anyone.", "Rulers advertised their power through monuments so that farmers would continue to provide labor even during periods of hardship.", al coinciding with the period of densest settlement」。B 正确。A、C 原文未由岩芯得出；D 是第 1 段石碑的功能，非岩芯。"}, {"type": "vocabulary", "stem": "The word <b>\"acutely\"</b> in paragraph 4 is closest in meaning to", "para": 4, "highlight": "acutely vulnerable", "options": ["severely", "briefly", "unexpectedly", "openly"], "answer": 0, "explain": "acutely vulnerable ＝ 极其/严重脆弱，acutely 与 severely 同义。语境强调依赖季节雨水的文明面对长期少雨「极度」脆弱。B/C/D 均不合。"}, {"type": "negative_factual", "stem": "According to paragraph 4, all of the following are used by critics to question the drought hypothesis EXCEPT:", "para": 4, "options": ["Some cities were abandoned before the driest recorded intervals.", "Some cities in similarly dry zones managed to survive.", "The northern cities endured for centuries despite the same climatic swings.", "Cave deposits contain no chemical record of ancient rainfall."], "answer": 3, "explain": "原文说 cave deposits「whose chemistry preserves a sensitive record of ancient rainfall」——洞穴沉积恰恰**保存了**降雨记录，D 与原文相反，故为 EXCEPT 所选。A、B、C 都是原文列出的批评者论据（有城市在最旱期之前就废弃、同样干旱区有城市存活、北方城市在相同气候波动下延续数百年）。"}, {"type": "inference", "stem": "It can be inferred from paragraph 4 that the survival of the northern cities is a problem for the drought hypothesis because those cities", "para": 4, "options": ["received far more rainfall than the southern lowlands did", "experienced the same climatic changes yet did not collapse at the same time", "had abandoned divine kingship long before the ninth century", "relied on trade rather than on agriculture for their food"], "answer": 1, "explain": "原文：北方城市「subject to the same climatic swings, endured for centuries longer」。既然经历相同气候波动却未同时崩溃，说明单凭干旱不足以解释崩溃，故对干旱说构成难题。B 正确。A 与「同样的气候波动」矛盾；C、D 原文无据。"}, {"type": "prose_summary", "stem": "An introductory sentence for a brief summary of the passage is provided below. Complete the summary by selecting the <b>THREE</b> answer choices that express the most important ideas in the passage.", "para": null, "intro_sentence": "Scholars have proposed several explanations for the gradual abandonment of the southern lowland Maya cities between about 750 and 900 CE.", "options": ["Some explanations stress internal causes, arguing that the fragile ideology of divine kingship and intensifying warfare undermined royal authority.", "Environmental explanations hold that deforestation and soil exhaustion, worsened by the demands of monumental building, steadily eroded the region's capacity to feed its population.", "Climate records from sediments and cave deposits point to severe ninth-century droughts, though the fit with the collapse is imperfect and disputed.", "The last dated stela at each city proves that centralized rule was violently overthrown by invaders from the northern lowlands.", "Maya rulers deliberately abandoned their cities in order to establish new capitals in the wetter highlands to the south.", "Because the northern cities collapsed first, scholars agree that drought was the sole and decisive cause of the entire collapse."], "answer": [0, 1, 2], "explain": "①内部原因说：神王合法性脆弱＋战争（第2段主旨）；②环境说：毁林与土壤枯竭、被宏伟建筑加剧（第3段主旨）；③干旱说：沉积与洞穴记录指向九世纪大旱但吻合不完美有争议（第4段主旨）。干扰项：④原文只说石碑标志中央统治不再运作，从未说被北方入侵者「暴力推翻」；⑤原文未提向南方高地迁都，且高地受影响更小而非目的地；⑥与原文相反——原文说北方城市反而延续更久，且明确指出干旱并非唯一原因。"}]};

  const text = DATA.paragraphs[pi].text;
  const idx = text.indexOf(q.highlight);
  if(idx < 0) return null;
  return { para: pi, start: idx, end: idx + q.highlight.length };
}

function annsFor(pi){
  const list = (annots[pi] || []).map(a => ({...a, sys:false}));
  // ■ 方块作为系统 seg 边界
  const text = DATA.paragraphs[pi].text;
  for(let i=0;i<text.length;i++) if(text[i]==='■') list.push({id:'sq'+i,start:i,end:i+1,mark:'__sq',sys:true});
  const hl = activeHighlight();
  if(hl && hl.para===pi) list.push({id:'__hl',start:hl.start,end:hl.end,mark:'__hl',sys:true});
  return list;
}

function bracketPair(mk){ const m=markOf(mk); if(!m||!m.bracket) return null; return [m.bracket[0], m.bracket[1]]; }

function renderPara(pi){
  const text = DATA.paragraphs[pi].text;
  const anns = annsFor(pi);
  const bounds = new Set([0, text.length]);
  anns.forEach(a => { bounds.add(a.start); bounds.add(a.end); });
  const pts = [...bounds].sort((x,y)=>x-y);
  let sqCount = 0;
  let out = '';
  for(let i=0;i<pts.length;i++){
    const pos = pts[i];
    // 收括号（内层先收：start 大的先）
    anns.filter(a=>a.end===pos && bracketPair(a.mark)).sort((a,b)=>b.start-a.start)
        .forEach(a=>{ const m=markOf(a.mark); out += `<span class="brk" data-aid="${a.id}" data-pi="${pi}" style="color:${m.color}">${bracketPair(a.mark)[1]}</span>`; });
    // 开括号（外层先开：跨度大的先）
    anns.filter(a=>a.start===pos && bracketPair(a.mark)).sort((a,b)=>(b.end-b.start)-(a.end-a.start))
        .forEach(a=>{ const m=markOf(a.mark); out += `<span class="brk" data-aid="${a.id}" data-pi="${pi}" style="color:${m.color}">${bracketPair(a.mark)[0]}</span>`; });
    if(i===pts.length-1) break;
    const a=pos, b=pts[i+1], segText=text.slice(a,b);
    const cover = anns.filter(x=>x.start<=a && x.end>=b);
    const sqAnn = cover.find(x=>x.mark==='__sq');
    if(sqAnn){
      sqCount++;
      out += `<span class="seg sq" data-start="${a}" data-sq="${sqCount}">■</span>`;
      continue;
    }
    // 选内层（跨度最小）决定下划线/高亮
    let style='';
    const real = cover.filter(x=>x.mark!=='__sq');
    if(real.length){
      const inner = real.slice().sort((m,n)=>(m.end-m.start)-(n.end-n.start))[0];
      const m = markOf(inner.mark);
      if(inner.mark==='__hl'){ style='background:#fff3b0;font-weight:600;border-radius:2px;'; }
      else if(m){
        if(m.highlight) style += `background:${m.highlight};`;
        if(m.under==='double') style += `border-bottom:2px double ${m.color};`;
        else if(m.bracket) style += `border-bottom:1.5px solid ${m.color};`;
      }
    }
    out += `<span class="seg" data-start="${a}" style="${style}">${esc(segText)}</span>`;
  }
  return out;
}

function renderArticle(){
  let h = '';
  if(DATA.intro) h += `<div class="intro">${esc(DATA.intro)}</div>`;
  DATA.paragraphs.forEach((p, pi) => {
    h += `<div class="para" data-para="${pi}" id="para-${pi}"><span class="pnum">${p.n}</span><span class="ptext">${renderPara(pi)}</span></div>`;
  });
  if(DATA.glossary && DATA.glossary.length){
    h += '<div class="glossary"><b>Glossary</b><br>';
    h += DATA.glossary.map(g=>`<b>${esc(g.term)}</b>: ${esc(g.def)}`).join('<br>');
    h += '</div>';
  }
  artEl.innerHTML = h;
  artEl.style.fontSize = (1 + fontStep*0.08) + 'em';
  applyInsertPreview();
}

function rerenderPara(pi){
  const el = artEl.querySelector(`#para-${pi} .ptext`);
  if(el) el.innerHTML = renderPara(pi);
}

/* ============ 选区 → 纯文本偏移 ============ */
function plainOffset(pEl, node, off){
  const segs = pEl.querySelectorAll('.seg');
  for(const s of segs){
    const base = +s.dataset.start;
    const r = document.createRange(); r.selectNodeContents(s);
    let c; try{ c = r.comparePoint(node, off); }catch(e){ continue; }
    if(c===0){ return node.nodeType===3 ? base+off : base + (off>0 ? s.textContent.length : 0); }
    if(c<0){ return base; }
  }
  return DATA.paragraphs[+pEl.dataset.para].text.length;
}

function readSelection(){
  const sel = window.getSelection();
  if(!sel.rangeCount || sel.isCollapsed) return null;
  const r = sel.getRangeAt(0);
  let node = r.commonAncestorContainer;
  let pEl = node.nodeType===3 ? node.parentElement : node;
  pEl = pEl.closest('.para');
  if(!pEl || !artEl.contains(pEl)) return null;
  const pi = +pEl.dataset.para;
  let start = plainOffset(pEl, r.startContainer, r.startOffset);
  let end   = plainOffset(pEl, r.endContainer, r.endOffset);
  if(end < start) [start,end] = [end,start];
  const text = DATA.paragraphs[pi].text;
  // 去掉首尾空白
  while(start<end && /\s/.test(text[start])) start++;
  while(end>start && /\s/.test(text[end-1])) end--;
  if(end<=start) return null;
  return { pi, start, end, rect: r.getBoundingClientRect() };
}

/* ============ 选区工具条 ============ */
const pop = document.getElementById('pop');
let curSel = null;

function buildPop(){
  let h = '';
  MARKS.forEach(m=>{
    const g = m.bracket ? m.bracket[0]+m.bracket[1] : (m.under? '＿' : '▉');
    h += `<button data-mk="${m.key}" style="background:${m.color}" title="${m.hint}"><span class="gl">${g}</span>${m.name}</button>`;
  });
  h += `<button class="del" data-mk="__del" title="清除选区内的标注">清除</button>`;
  pop.innerHTML = h;
}
buildPop();

function showPop(sel){
  curSel = sel;
  pop.classList.add('show');
  const pr = pop.getBoundingClientRect();
  let x = sel.rect.left + sel.rect.width/2 - pr.width/2;
  let y = sel.rect.top - pr.height - 8;
  x = Math.max(8, Math.min(x, innerWidth - pr.width - 8));
  if(y < 8) y = sel.rect.bottom + 8;
  pop.style.left = x+'px'; pop.style.top = y+'px';
}
function hidePop(){ pop.classList.remove('show'); curSel=null; }

pop.addEventListener('mousedown', e=>{
  const b = e.target.closest('button'); if(!b || !curSel) return;
  e.preventDefault();
  const mk = b.dataset.mk, {pi,start,end} = curSel;
  if(mk==='__del'){
    annots[pi] = (annots[pi]||[]).filter(a => a.end<=start || a.start>=end);
    if(!annots[pi].length) delete annots[pi];
  }else{
    if(!annots[pi]) annots[pi]=[];
    annots[pi].push({ id:'a'+Date.now()+Math.round(performance.now()), start, end, mark:mk });
  }
  save(AKEY, annots); rerenderPara(pi); hidePop();
  window.getSelection().removeAllRanges();
});

document.addEventListener('mouseup', e=>{
  if(pop.contains(e.target)) return;
  setTimeout(()=>{ const s = readSelection(); if(s) showPop(s); else hidePop(); }, 0);
});
document.addEventListener('mousedown', e=>{ if(!pop.contains(e.target)) hidePop(); });

// 点击括号删除该条标注
artEl.addEventListener('click', e=>{
  const b = e.target.closest('.brk'); if(!b) return;
  const pi=+b.dataset.pi, id=b.dataset.aid;
  annots[pi] = (annots[pi]||[]).filter(a=>a.id!==id);
  if(!annots[pi].length) delete annots[pi];
  save(AKEY, annots); rerenderPara(pi);
});

/* ============ 题目渲染 ============ */
const qbody = document.getElementById('qbody');
const dotsEl = document.getElementById('dots');
const KEYS = ['A','B','C','D','E','F'];

function isMulti(q){ return q.type==='prose_summary'; }

function renderDots(){
  dotsEl.innerHTML = DATA.questions.map((q,i)=>{
    let cls='dot'; if(i===cur) cls+=' cur';
    if(checked[i]){ cls += judge(i) ? ' ok' : ' no'; }
    else if(answers[i]!=null && (!isMulti(q) || answers[i].length)) cls+=' done';
    return `<div class="${cls}" data-i="${i}">${i+1}</div>`;
  }).join('');
}

function judge(i){
  const q=DATA.questions[i], a=answers[i];
  if(isMulti(q)){ const need=q.answer.slice().sort().join(','); const got=(a||[]).slice().sort().join(','); return need===got; }
  return a===q.answer;
}

function renderQ(){
  const q = DATA.questions[cur];
  document.getElementById('qpos').textContent = `第 ${cur+1} / ${DATA.questions.length} 题`;
  let h = `<span class="qtype">${TYPE_LABELS[q.type]||q.type}</span>`;
  h += `<div class="stem">${q.stem}</div>`;
  if(q.type==='insert_text' && q.insert_sentence){
    h += `<div class="insbox">待插入句：<b>${esc(q.insert_sentence)}</b></div>`;
  }
  if(q.type==='prose_summary' && q.intro_sentence){
    h += `<div class="insbox" style="border-style:solid">导语：${esc(q.intro_sentence)}</div>`;
  }
  const multi = isMulti(q);
  const sel = answers[cur];
  const done = checked[cur];
  h += '<div class="opts">';
  q.options.forEach((opt,oi)=>{
    let cls='opt';
    const chosen = multi ? (sel||[]).includes(oi) : sel===oi;
    if(chosen) cls+=' sel';
    if(done){
      const correct = multi ? q.answer.includes(oi) : oi===q.answer;
      if(correct) cls+=' ok'; else if(chosen) cls+=' no';
    }
    let tag='';
    if(done){ const correct = multi ? q.answer.includes(oi) : oi===q.answer;
      if(correct) tag='<span class="tag">✓ 正确</span>'; else if(chosen) tag='<span class="tag">✗</span>'; }
    h += `<div class="${cls}" data-oi="${oi}"><span class="k">${KEYS[oi]}</span><span>${opt}</span>${tag}</div>`;
  });
  h += '</div>';
  const submitLabel = done ? '已提交' : '提交';
  h += `<div class="qfoot">
    <button class="btn p" id="submit" ${done?'disabled':''}>${submitLabel}</button>
    ${multi?'<span style="font-size:12px;color:#8c8072">多选：选 3 项</span>':''}
  </div>`;
  h += `<div class="expl ${done?(judge(cur)?'right show':'wrong show'):''}" id="expl"><b>${done?(judge(cur)?'✓ 回答正确':'✗ 回答错误'):''}</b><br>${q.explain||''}</div>`;
  qbody.innerHTML = h;

  qbody.querySelectorAll('.opt').forEach(el=>{
    el.addEventListener('click', ()=>{
      if(checked[cur]) return;
      const oi=+el.dataset.oi;
      if(multi){
        let arr = answers[cur]||[];
        if(arr.includes(oi)) arr=arr.filter(x=>x!==oi);
        else { if(arr.length>=3){ return; } arr=[...arr,oi]; }
        answers[cur]=arr;
      }else answers[cur]=oi;
      save(QKEY, answers); renderQ(); renderDots();
    });
  });
  const sb = qbody.querySelector('#submit');
  if(sb) sb.addEventListener('click', ()=>{
    if(answers[cur]==null || (multi && answers[cur].length<3)){ sb.textContent = multi?'请选满 3 项':'请先选择'; setTimeout(()=>sb.textContent='提交',900); return; }
    checked[cur]=true; renderQ(); renderDots(); updateScore();
    if(q.type==='insert_text') applyInsertPreview();
  });
  renderDots();
  document.getElementById('prev').disabled = cur===0;
  document.getElementById('next').disabled = cur===DATA.questions.length-1;
  applyInsertPreview();
}

function updateScore(){
  const total = DATA.questions.length;
  const done = Object.keys(checked).length;
  if(done<total){ document.getElementById('scorebar').classList.remove('show'); return; }
  let ok=0; for(let i=0;i<total;i++) if(judge(i)) ok++;
  const sb=document.getElementById('scorebar');
  sb.classList.add('show');
  sb.innerHTML = `本篇完成：<b>${ok} / ${total}</b> 正确${ok>=total*0.8?' 🎉 达到高分区间':''}`;
}

/* ============ insert_text 预览 ============ */
function applyInsertPreview(){
  // 清除旧预览
  artEl.querySelectorAll('.sq.on').forEach(s=>{s.classList.remove('on');});
  artEl.querySelectorAll('.ins-preview').forEach(s=>s.remove());
  const q = DATA.questions[cur];
  if(q.type!=='insert_text' || answers[cur]==null) return;
  const oi = answers[cur];
  const sq = artEl.querySelector(`#para-${q.para-1} .sq[data-sq="${oi+1}"]`);
  if(sq){
    sq.classList.add('on');
    if(checked[cur] && q.insert_sentence){
      const span=document.createElement('span');
      span.className='ins-preview'; span.textContent=' '+q.insert_sentence+' ';
      sq.after(span);
    }
  }
}

/* ============ 导航 ============ */
document.getElementById('prev').onclick = ()=>{ if(cur>0){cur--; onQChange();} };
document.getElementById('next').onclick = ()=>{ if(cur<DATA.questions.length-1){cur++; onQChange();} };
dotsEl.addEventListener('click', e=>{ const d=e.target.closest('.dot'); if(d){ cur=+d.dataset.i; onQChange(); } });
document.getElementById('locate').onclick = e=>{ e.preventDefault(); locate(); };

function onQChange(){
  // 重渲染受 highlight 影响的段落
  DATA.paragraphs.forEach((p,pi)=>rerenderPara(pi));
  renderQ();
  locate(true);
}
function locate(soft){
  const q=DATA.questions[cur]; if(q.para==null) return;
  const el=artEl.querySelector(`#para-${q.para-1}`); if(!el) return;
  el.scrollIntoView({behavior:'smooth', block: soft?'nearest':'center'});
  if(!soft){ el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
}

/* ============ 顶栏控件 ============ */
document.getElementById('ptitle').textContent = DATA.title;
document.getElementById('cdom').textContent = DATA.domain;
document.getElementById('cdiff').textContent = '难度 ' + '★'.repeat(DATA.difficulty) + '☆'.repeat(5-DATA.difficulty);
document.getElementById('cwords').textContent = (DATA.est_words||'') + ' 词';

document.getElementById('btnClear').onclick = ()=>{
  if(!confirm('清空本篇全部括号 / 标注？')) return;
  annots={}; save(AKEY, annots); renderArticle();
};
document.getElementById('btnFont').onclick = ()=>{
  fontStep = (fontStep+1)%4; save('toefl-read:font', fontStep);
  artEl.style.fontSize = (1 + fontStep*0.08) + 'em';
};

// 图例
const legend = document.getElementById('legend');
legend.innerHTML = '<h4>括号法图例（选中原文即可标）</h4>' +
  MARKS.map(m=>{ const g=m.bracket?m.bracket[0]+m.bracket[1]:(m.under?'＿＿':'▉'); return `<div class="lg"><span class="sw" style="color:${m.color}">${g}</span><span><b>${m.name}</b> · ${m.hint}</span></div>`;}).join('') +
  '<div class="tip">用法：鼠标划选原文中的成分 → 弹出条里点对应括号；把从句/短语/插入语逐层括起来，剩下没括的就是<b>主干</b>。点括号可删除；右上「清空标注」重来。</div>';
document.getElementById('btnLegend').onclick = ()=>legend.classList.toggle('show');

// 计时器（倒计时 18 分钟，点击开始/暂停）
let tLeft=18*60, tRun=false, tId=null;
const tEl=document.getElementById('timer');
function fmt(s){ const m=Math.floor(s/60), ss=s%60; return (m<10?'0':'')+m+':'+(ss<10?'0':'')+ss; }
function tick(){ if(tLeft>0){tLeft--; tEl.textContent=fmt(tLeft); if(tLeft===0){tEl.style.color='var(--bad)'; tRun=false; clearInterval(tId);}} }
tEl.onclick=()=>{ if(tRun){clearInterval(tId); tRun=false; tEl.style.opacity=.55;} else {tId=setInterval(tick,1000); tRun=true; tEl.style.opacity=1;} };

/* ============ 键盘：← → 切题 ============ */
document.addEventListener('keydown', e=>{
  if(e.target.tagName==='INPUT') return;
  if(e.key==='ArrowRight' && cur<DATA.questions.length-1){ cur++; onQChange(); }
  if(e.key==='ArrowLeft' && cur>0){ cur--; onQChange(); }
});

/* ============ 启动 ============ */
renderArticle();
renderQ();
// 恢复已提交状态
Object.keys(answers).forEach(k=>{ /* 保留作答，但不自动判分，等用户点提交 */ });
updateScore();
</script>
