<style>
  :root{--bg:#f6f3ed;--card:#fffdf8;--ink:#2f2a24;--muted:#8c8072;--line:#e5dccb;--accent:#c1662f;--core:#2f8f83;--ok:#2f8f5b;--bad:#c0453a;--blue:#4a5cc7}
  *{box-sizing:border-box}html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang SC","Helvetica Neue",sans-serif;line-height:1.7;-webkit-font-smoothing:antialiased}

  .bar{position:sticky;top:0;z-index:20;background:var(--bg);padding:10px 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-bottom:1px solid var(--line);margin-bottom:6px}

  /* 文段 */

  .pgh h2{font-size:18px;margin:0}
  .pgmeta{font-size:12px;color:#fff;background:var(--core);border-radius:20px;padding:2px 9px}
  .seclbl{font-size:12.5px;color:var(--core);font-weight:700;margin:14px 0 6px}
  .en{font-size:15.5px;line-height:2;background:#faf7ef;border:1px solid var(--line);border-radius:10px;padding:12px 14px}

  .hs-an{font-size:12.8px;color:#2c6a60;margin-top:7px;background:#fff;border-radius:8px;padding:7px 10px}
  .hs-zh{font-size:13.5px;color:#5f574c;margin-top:6px}

  .pw{cursor:pointer;border-bottom:1.5px dotted var(--accent);padding:0 1px;border-radius:3px}

  .pw-plain.open{background:#efe6d4;box-shadow:0 0 0 2px var(--accent)}

  .card.plain{border:1px dashed var(--line);background:#fbf8f1}

  .hook{font-size:12.5px;color:#6f6656;background:#faf7ef;border-radius:7px;padding:6px 9px;margin-top:6px}

  .sec{font-size:12.5px;color:#6f6656;background:#faf7ef;border-radius:7px;padding:6px 9px;margin-top:6px;line-height:1.6}
  .xex{font-size:12.5px;margin-top:6px;color:#433d34;line-height:1.55}
  .xex .xzh{color:#8c8072}
  .syn{font-size:12.5px;margin-top:6px;color:#5f574c;line-height:1.6}
  .syn b{color:var(--core);cursor:pointer}
  .nu{font-size:12.5px;margin-top:6px;background:#eef6f4;border-left:3px solid var(--core);border-radius:0 7px 7px 0;padding:6px 9px;color:#2c6a60}
  .mbtn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 10px;font-size:12px;cursor:pointer;font-family:inherit;color:#5f574c;margin-top:7px}
  .mbtn.on{background:var(--ok);color:#fff;border-color:var(--ok)}
  /* 拼写测验 */
  .quiz{position:fixed;inset:0;background:rgba(40,36,30,.5);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
  .qbox{background:var(--card);border-radius:16px;padding:22px;max-width:460px;width:100%}
  .qprog{font-size:12.5px;color:var(--muted)}
  .qzh{font-size:20px;font-weight:800;margin:6px 0 4px}
  .qpos{font-size:13px;color:var(--muted)}
  .qin{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:17px;font-family:inherit;margin-top:12px}

  .qres{margin-top:10px;font-size:15px;min-height:24px}
  .qres.ok{color:var(--ok)}.qres.no{color:var(--bad)}
  .qbtns{display:flex;gap:8px;margin-top:14px}
  .qbtns button{flex:1;border:0;border-radius:10px;padding:10px;font-size:14px;cursor:pointer;font-family:inherit}
  .qbtns .p{background:var(--accent);color:#fff}.qbtns .g{background:#efe8d8;color:#5f574c}
</style></head>

paroir，再上溯拉丁语 appārēre = ad-（向）+ pārēre（露面、显现）。原义「变得可见、显露出来」，故有「出现」与「显得、似乎」两层意思。同根词：apparent（显然的）、apparition（幽灵、显现）、transparent（透明的，pārēre 变体）。", "ph": "🗣 分两音节 a·ppears /ə-ˈpɪərz/，重音在第二音节；-ears 部分发 /ɪərz/。核心易错：别和 appeals /əˈpiːlz/ 混——appear 的 -pear 是 /pɪər/（如 pier 码头），appeal 的 -peal 是 /piːl/（如 peel 削皮）。", "xex": [{"en": "A ring of mushrooms appears overnight after heavy rain.", "zh": "大雨过后，一圈蘑菇一夜之间冒了出来。", "src": "造句"}, {"en": "It appears that the artifact predates the settlement.", "zh": "看来这件文物比这个定居点更早。", "src": "高频搭配"}], "syn": [{"w": "emerges", "ipa": "/ɪˈmɜːrdʒɪz/", "note": "强调「从隐蔽/内部显露而出」，更具动作感和过程感；appear 只说结果「出现了」。"}, {"w": "seems", "ipa": "/siːmz/", "note": "仅对应 appear 的「似乎」义，不能表「出现」；appears + to be 时二者可互换。"}], "nu": "appears 兼「出现」和「似乎」两义，最易与拼写相近的 appeals（呼吁/吸引）弄错——一个 -pear 一个 -peal，词义毫不相干。"}, {"w": "underground", "ipa": "/ˌʌndərˈɡraʊnd/", "pos": "adv./adj.", "zh": "在地下", "hook": "under+ground", "err": "underestmat（乱拼）", "ety": "🏛 复合词 under（古英语 under，「在…之下」，印欧词根 *ndher-「下」）+ ground（古英语 grund，「地面、底部」）。字面「地面之下」。19 世纪引申出「秘密的、地下（非法/反抗）活动」比喻义；英式英语中 the Underground 特指伦敦地铁。", "ph": "🗣 三音节 un·der·ground /ˌʌn-dər-ˈɡraʊnd/，主重音在末音节 ground /ɡraʊnd/，首音节次重音。-ground 的 /aʊ/ 是双元音，别读成 /oʊ/。", "xex": [{"en": "Fungal networks spread underground, linking the roots of many trees.", "zh": "真菌网络在地下蔓延，连接起许多树木的根系。", "src": "造句"}, {"en": "The city built an underground parking garage beneath the plaza.", "zh": "这座城市在广场下方建了一座地下停车场。", "src": "高频搭配"}], "syn": [{"w": "subterranean", "ipa": "/ˌsʌbtəˈreɪniən/", "note": "正式、书面/学术用词（sub 下+terra 土），多修饰河流、洞穴、结构；underground 更口语通用。"}, {"w": "buried", "ipa": "/ˈberid/", "note": "强调「被埋起来」的被动状态和动作结果；underground 是中性的位置描述，不含「被埋」动作。"}], "nu": "underground 既是副词「在地下」又是形容词「地下的」，语域比学术词 subterranean 通用；书面正式语境优先后者。"}, {"w": "mycelium", "ipa": "/maɪˈsiːliəm/", "pos": "n.", "zh": "菌丝体", "hook": "生物学术词", "ety": "🏛 现代科学拉丁语，19 世纪由希腊语 mykēs（真菌，见 mushroom、mycology）加拉丁后缀 -elium 构成，字面「菌的组织体」。复数 mycelia。同根：mycology（真菌学）、mycorrhiza（菌根，myco 菌 + rhiza 根）。", "ph": "🗣 四音节 my·ce·li·um /maɪ-ˈsiː-li-əm/，重音在第二音节 -ce- /siː/；首音节 my- 读 /maɪ/（如 my）。注意 c 在 e 前发 /s/。", "xex": [{"en": "The mushroom is only the fruiting body; the real organism is the mycelium hidden in the soil.", "zh": "蘑菇只是子实体，真正的生物体是藏在土里的菌丝体。", "src": "造句"}, {"en": "Scientists grow mycelium into leather-like materials.", "zh": "科学家把菌丝体培育成类似皮革的材料。", "src": "高频搭配"}], "nu": "mycelium 是「菌丝体」这一整张地下网络，注意别与其组成单元 hypha（单根菌丝）混淆，也别与地面上的 mushroom（子实体）等同。"}, {"w": "spore", "form": "spores", "ipa": "/spɔːr/", "pos": "n.", "zh": "孢子", "hook": "真菌繁殖单位", "ety": "🏛 源自现代拉丁语 spora，借自希腊语 sporá「播种、种子」，来自 speirein「播撒」（与 sperm 精子、diaspora 离散同根）。19 世纪生物学借用，指真菌、蕨类、细菌等的微小繁殖单位。", "ph": "🗣 单音节 /spɔːr/，与 spawn 开头相同但收尾不同；元音 /ɔː/ + r。最小对照：spore /spɔːr/ vs spare /sper/（多余的）——元音不同，别混。", "xex": [{"en": "Each mushroom releases millions of microscopic spores into the air.", "zh": "每朵蘑菇向空气中释放数百万个微小的孢子。", "src": "造句"}, {"en": "The spores germinate wherever they find moisture and nutrients.", "zh": "孢子一旦找到水分和养分就会萌发。", "src": "高频搭配"}], "syn": [{"w": "seed", "ipa": "/siːd/", "note": "植物的繁殖体，含胚和储备养分、结构复杂；spore 是真菌/蕨类的单细胞繁殖体，二者不可混用，仅功能类比。"}], "nu": "spore（孢子）是真菌/蕨类的繁殖单位，与开花植物的 seed（种子）功能相似但结构与类群完全不同，切勿互换。"}, {"w": "nutrient", "form": "nutrients", "ipa": "/ˈnuːtriənt/", "pos": "n.", "zh": "养分，营养物", "hook": "nutri(营养)+ent", "ety": "🏛 源自拉丁语 nūtrīre「喂养、滋养」的现在分词 nūtriēns，字面「正在滋养的（东西）」。同根词丰富：nutrition（营养）、nurse（护士，原义哺乳者）、nourish（滋养）、nurture（养育）。", "ph": "🗣 三音节 nu·tri·ent /ˈnuː-tri-ənt/，重音在首音节 nu- /nuː/（美音 /nuː/，英音可 /njuː/）。-trient 部分 /triənt/，别读成两音节。", "xex": [{"en": "Mycelium absorbs nutrients from decaying wood and leaves.", "zh": "菌丝体从腐烂的木头和落叶中吸收养分。", "src": "造句"}, {"en": "Leafy greens are packed with essential nutrients.", "zh": "绿叶蔬菜富含必需的营养物质。", "src": "高频搭配"}], "syn": [{"w": "nourishment", "ipa": "/ˈnɜːrɪʃmənt/", "note": "不可数、更抽象，指「滋养（的作用/食物）」整体；nutrient 可数，指具体某种营养成分（蛋白、维生素等）。"}], "nu": "nutrient 指可数的具体营养成分（如蛋白质、矿物质），与抽象不可数的 nourishment（滋养、养料整体）在可数性和抽象度上不同。"}, {"w": "absorb", "ipa": "/əbˈzɔːrb/", "pos": "v.", "zh": "吸收", "hook": "ab-+sorb(吸)", "ety": "🏛 源自拉丁语 absorbēre = ab-（离、away）+ sorbēre（吸、啜）。字面「吸走、吞入」。引申出「吸收（知识/成本）」「使全神贯注」（be absorbed in）。同根少见词：sorbet（果冻冰，同 sorbēre 的「啜饮」）。注意 sorb 词根与 -sorb 的另一族 resorb/desorb。", "ph": "🗣 两音节 ab·sorb /əb-ˈzɔːrb/，重音在第二音节；关键易错：s 在这里发浊音 /z/（不是 /s/），读作 /zɔːrb/。对比 absorption 名词形式 s 回到 /p/ 前的清化。", "xex": [{"en": "Plant roots absorb water and minerals from the soil.", "zh": "植物根系从土壤中吸收水分和矿物质。", "src": "造句"}, {"en": "She was so absorbed in the book that she missed her stop.", "zh": "她太沉浸在书里，坐过了站。", "src": "高频搭配"}], "syn": [{"w": "assimilate", "ipa": "/əˈsɪməleɪt/", "note": "强调「吸收后同化、融为一体」，多用于消化、文化、知识；absorb 泛指吸入，不必然强调转化融合。"}, {"w": "soak up", "ipa": "/soʊk ʌp/", "note": "口语短语动词，形象指「大量吸入液体/信息」；absorb 语域更中性、可用于书面科学语境。"}], "nu": "absorb 的 s 读浊音 /z/ 是最大发音陷阱；与 assimilate 相比，absorb 只说「吸进」，后者还强调「吸收后同化」。"}]}, {"title": "Underwater Archaeology（填词 8/10）", "meta": "Complete the Words", "en": "Archaeologists typically study human history and prehistory through the excavation of artifacts buried underground. Sometimes, however, they discover artifacts submerged underwater. A stone wall was found beneath the Baltic Sea in 2012 that dates to over 10,000 years ago. Researchers believe it was used by hunter-gatherer societies to guide and trap reindeer. The wall consists of approximately 1,670 stones and is considered one of the oldest documented hunting structures made by humans.", "zh": "考古学家通常通过发掘埋在地下的文物来研究人类历史与史前史。但有时，他们会发现沉在水下的文物。2012 年在波罗的海海底发现了一堵石墙，可追溯到一万多年前。研究者认为它被狩猎采集社会用来引导和捕捉驯鹿。这堵墙由约 1670 块石头组成，被视为人类建造的最古老的有记载的狩猎结构之一。", "words": [{"w": "discover", "ipa": "/dɪˈskʌvər/", "pos": "v.", "zh": "发现", "hook": "dis-+cover(盖)→揭盖→发现", "err": "discovry（拼写少字母，应 discover）", "ety": "🏛 源自古法语 descovrir = des-（去除，dis-）+ covrir（覆盖，cover）。字面「揭开盖子」→「使显露、发现（本已存在之物）」。故 discover 强调「找到已存在但未知的东西」，区别于 invent（创造原不存在之物）。同根：cover、discovery、recover。", "ph": "🗣 三音节 dis·cov·er /dɪ-ˈskʌv-ər/，重音在中间 -cov- /skʌv/，元音是 /ʌ/（如 cup）不是 /oʊ/。词尾 -er /ər/ 轻读。", "xex": [{"en": "Divers discovered a submerged city off the coast.", "zh": "潜水员在近海发现了一座沉没的城市。", "src": "造句"}, {"en": "Researchers discovered that fungi communicate through chemical signals.", "zh": "研究人员发现真菌通过化学信号交流。", "src": "高频搭配"}], "syn": [{"w": "uncover", "ipa": "/ʌnˈkʌvər/", "note": "字面「揭开」，多指揭露隐藏/被掩盖之物（真相、阴谋、遗址）；discover 泛指首次找到、认知范围更广。"}, {"w": "detect", "ipa": "/dɪˈtekt/", "note": "强调「借助观察/仪器察觉到（细微、隐蔽的）存在」；discover 是更大的「首次发现」，detect 偏「探测出信号」。"}], "nu": "discover 是「发现已存在之物」，与 invent（发明原不存在之物）本质不同；拼写注意是 disco-ver，别漏字母写成 discovry。"}, {"w": "submerged", "ipa": "/səbˈmɜːrdʒd/", "pos": "adj.", "zh": "淹没的，水下的", "hook": "sub-(在下)+merge(没入)", "err": "submision（拼成 submission=提交，词也选错）", "ety": "🏛 submerge 源自拉丁语 submergere = sub-（在…之下）+ mergere（浸没、沉入，同 merge 合并、emerge 浮现、immerse 浸入的词根）。字面「沉到水面之下」。submerged 为其过去分词/形容词，「淹没的、水下的」。", "ph": "🗣 两音节 sub·merged /səb-ˈmɜːrdʒd/，重音在第二音节；-merged 收尾是 /dʒd/ 三个辅音连读，较难，注意 g 发 /dʒ/。", "xex": [{"en": "Archaeologists explored the submerged ruins with underwater drones.", "zh": "考古学家用水下无人机勘探这些淹没的遗迹。", "src": "造句"}, {"en": "Half the village remained submerged after the flood.", "zh": "洪水过后，半个村庄仍浸在水下。", "src": "高频搭配"}], "syn": [{"w": "underwater", "ipa": "/ˌʌndərˈwɔːtər/", "note": "中性、口语通用，纯描述「在水下」的位置；submerged 更强调「被水淹没沉入」的状态和过程，语域略正式。"}, {"w": "sunken", "ipa": "/ˈsʌŋkən/", "note": "强调「沉没到底」的结果，常修饰 ship/treasure；submerged 只要没入水面下即可，不一定沉底。"}], "nu": "submerged（淹没的/水下的）与拼写、发音相近的 submission（提交、屈服）毫无关联，别因词形相似选错。"}, {"w": "archaeologist", "ipa": "/ˌɑːrkiˈɑːlədʒɪst/", "pos": "n.", "zh": "考古学家", "hook": "archaeo(古)+logist", "ety": "🏛 源自希腊语 arkhaios（古老的，来自 arkhē「开端、起源」）+ logos（学问、话语）+ -ist（从事者）。字面「研究古代之人」。同根：archaic（古老的）、archive（档案）、archaeology（考古学）；logos 一族遍及所有 -ology 学科词。", "ph": "🗣 五音节 ar·chae·ol·o·gist /ˌɑːr-ki-ˈɑː-lə-dʒɪst/，主重音在第三音节 -ol- /ɑː/；chae 发 /ki/（如 key）不是 /tʃ/。拼写含隐蔽的 -chae- 是易错点。", "xex": [{"en": "The archaeologist carefully brushed dirt away from the buried artifact.", "zh": "考古学家小心地刷去埋藏文物上的泥土。", "src": "造句"}, {"en": "Archaeologists dated the site to the Bronze Age.", "zh": "考古学家将该遗址断代为青铜时代。", "src": "高频搭配"}], "syn": [{"w": "excavator", "ipa": "/ˈekskəveɪtər/", "note": "指「发掘者」，侧重挖掘这一动作，也可指挖掘机；archaeologist 是研究古代文明的学者，范围远大于挖掘本身。"}], "nu": "archaeologist 研究「古代人类文明与遗物」，别与研究化石与远古生物的 paleontologist（古生物学家）混淆——一个挖文物，一个挖恐龙。"}, {"w": "excavation", "ipa": "/ˌekskəˈveɪʃn/", "pos": "n.", "zh": "发掘，挖掘", "hook": "ex-(出)+cav(洞穴)→挖出", "ety": "🏛 源自拉丁语 excavāre = ex-（出、向外）+ cavāre（挖空，来自 cavus「空的、洞」，同 cave 洞穴、cavity 蛀洞/腔）。字面「向外挖出（一个洞）」。-ation 名词后缀表动作/结果。", "ph": "🗣 四音节 ex·ca·va·tion /ˌeks-kə-ˈveɪ-ʃn/，主重音在第三音节 -va- /veɪ/；-tion 读 /ʃn/。首音节 ex- 读 /eks/。", "xex": [{"en": "The excavation uncovered pottery beneath three meters of soil.", "zh": "这次发掘在三米厚的土层下出土了陶器。", "src": "造句"}, {"en": "The site is under excavation by a joint research team.", "zh": "该遗址正由一支联合研究团队进行发掘。", "src": "高频搭配"}], "syn": [{"w": "dig", "ipa": "/dɪɡ/", "note": "口语，名词指「一次考古挖掘工作」；excavation 是正式/学术用词，同指考古发掘时二者可互换但语域不同。"}, {"w": "unearthing", "ipa": "/ʌnˈɜːrθɪŋ/", "note": "强调「把埋在地下的东西挖出来使见天日」的结果动作；excavation 更指整个系统性挖掘过程。"}], "nu": "excavation 词根 cav = 挖空的「洞」，与 cave（洞穴）、cavity（腔/蛀洞）同源；指系统性的考古或工程「发掘」，比口语 dig 正式。"}, {"w": "artifact", "form": "artifacts", "ipa": "/ˈɑːrtɪfækt/", "pos": "n.", "zh": "人工制品，文物", "hook": "art(技艺)+fact(做)", "ety": "🏛 源自拉丁短语 arte factum「用技艺做成（的东西）」= arte（技艺，ars 的夺格）+ factum（做，facere 的分词，同 fact、factory、manufacture）。字面「人工造物」，故考古中特指人造器物，别于自然物。英式拼作 artefact。", "ph": "🗣 三音节 ar·ti·fact /ˈɑːr-tɪ-fækt/，重音在首音节 ar- /ɑːr/；三个音节清晰分开，末音节 -fact /fækt/ 同 fact。", "xex": [{"en": "Each artifact was catalogued before being moved to the museum.", "zh": "每件文物在运往博物馆前都被登记入册。", "src": "造句"}, {"en": "The tomb contained gold artifacts over three thousand years old.", "zh": "这座陵墓藏有三千多年历史的黄金器物。", "src": "高频搭配"}], "syn": [{"w": "relic", "ipa": "/ˈrelɪk/", "note": "强调「遗留下来的旧物/圣物」，常带历史/宗教情感色彩；artifact 中性，泛指任何人造遗物，学术味更浓。"}, {"w": "antique", "ipa": "/ænˈtiːk/", "note": "指有年头、有收藏价值的「古董」，侧重年代与商业价值；artifact 侧重「人类制造」的考古/文化属性。"}], "nu": "artifact 的核心义是「人工制造之物」(art 技艺 + fact 做)，与自然形成的物体相对；比带情感色彩的 relic（遗物/圣物）更中性学术。"}, {"w": "beneath", "ipa": "/bɪˈniːθ/", "pos": "prep.", "zh": "在…下方", "hook": "be+neath(下)", "ety": "🏛 古英语 beneoðan = be-（by，在旁）+ neoðan（下面，来自印欧词根 *ndher-「下」，同 nether 下界、Netherlands 低地国）。字面「在…下方」。较 under 更书面、略带文学色彩。", "ph": "🗣 两音节 be·neath /bɪ-ˈniːθ/，重音在第二音节 -neath /niːθ/；词尾 th 发清辅音 /θ/（咬舌）。对比 beneathe 无此词，勿加 e。", "xex": [{"en": "Ancient foundations still lie beneath the modern city.", "zh": "古老的地基至今仍埋在这座现代城市之下。", "src": "造句"}, {"en": "He felt the ground tremble beneath his feet.", "zh": "他感到脚下的地面在颤动。", "src": "高频搭配"}], "syn": [{"w": "under", "ipa": "/ˈʌndər/", "note": "最通用、口语，位置/数量/管辖皆可；beneath 更书面文雅，且可表「不屑」义 (beneath him)，under 无此用法。"}, {"w": "below", "ipa": "/bɪˈloʊ/", "note": "指「在（水平线）下方」，不必正下方也不必接触；beneath 常暗示正下方或紧贴其下。"}], "nu": "beneath 是 under 的书面文雅版，还独有「不屑于」义（如 beneath contempt 不值一提）；below 只说「在下方」不强调正下方。"}]}, {"title": "Industrialization and Skyscrapers（填词 7/10）", "meta": "Complete the Words", "en": "The advent of industrialization in the late eighteenth and nineteenth centuries dramatically reshaped city architecture across Europe and North America. As urban populations surged, cities expanded upward with the construction of multi-story buildings, and, eventually, steel-framed skyscrapers that defined modern skylines. These towering structures reflected new engineering capabilities and the growing demand for centralized workspaces. Within cities, transportation systems like streetcars made commuting more efficient, further fueling urban growth. This architectural transformation marked a shift toward dense, vertical living and working environments, emblematic of the industrial age.", "zh": "18 世纪末到 19 世纪的工业化极大地重塑了欧洲和北美的城市建筑。随着城市人口激增，城市向上扩张，建起多层建筑，并最终建起定义了现代天际线的钢框架摩天大楼。这些高耸的建筑体现了新的工程能力和对集中办公空间日益增长的需求。城市内部，有轨电车等交通系统让通勤更高效，进一步推动城市增长。这一建筑变革标志着向密集、垂直的居住与工作环境转变，是工业时代的象征。", "words": [{"w": "upward", "ipa": "/ˈʌpwərd/", "pos": "adv.", "zh": "向上", "hook": "up+ward(朝…方向)", "err": "upw___（开了头拼不完）", "ety": "🏛 古英语 upweard = up（向上，古英语 up/uppe）+ -weard（朝…方向的后缀，来自印欧 *wert-「转」，同 -ward 系列：toward、backward、forward）。字面「朝上方向」。美式副词多用 upward，英式常加 s 作 upwards。", "ph": "🗣 两音节 up·ward /ˈʌp-wərd/，重音在首音节 up- /ʌp/；-ward 轻读 /wərd/。别把 -ward 读成 /wɔːrd/（那是 ward 病房）。", "xex": [{"en": "The young shoot pushed upward through the soil toward the light.", "zh": "幼芽穿过泥土朝着光向上生长。", "src": "造句"}, {"en": "Prices have been trending upward for months.", "zh": "价格已连续数月呈上升趋势。", "src": "高频搭配"}], "syn": [{"w": "skyward", "ipa": "/ˈskaɪwərd/", "note": "文学色彩强，专指「朝天空方向」；upward 中性通用，可指任何向上，不限于朝天。"}, {"w": "aloft", "ipa": "/əˈlɒft/", "note": "书面/文学词，意为「在高处、在空中」，偏静态位置；upward 表运动方向，二者角度不同。"}], "nu": "upward 的 -ward 表「朝…方向」（与 forward/backward 同族），是方向副词/形容词，别与 -ward 读成 ward（/wɔːrd/ 病房）。"}, {"w": "eventually", "ipa": "/ɪˈventʃuəli/", "pos": "adv.", "zh": "最终", "hook": "eventual(最后的)+ly", "err": "event___（开了头拼不完）", "ety": "🏛 源自拉丁语 ēventus（结果、发生的事）= ex-（出）+ venīre（来，同 event、advent、venue、invent 的词根）。字面「作为最终结果地」。故 eventually 指「（经过一段过程后）最终」，暗含时间推移与曲折。", "ph": "🗣 五音节 e·ven·tu·al·ly /ɪ-ˈven-tʃu-ə-li/，重音在第二音节 -ven- /ven/；-tu- 发 /tʃu/。别吞音成四音节。", "xex": [{"en": "The spores drift on the wind and eventually settle on new ground.", "zh": "孢子随风飘散，最终落在新的土地上。", "src": "造句"}, {"en": "After many delays, the project was eventually completed.", "zh": "历经多次延误，项目最终还是完成了。", "src": "高频搭配"}], "syn": [{"w": "ultimately", "ipa": "/ˈʌltɪmətli/", "note": "更正式，强调「归根结底、最终结果」，可引出结论；eventually 侧重「经过时间/过程后终于」，时间感更强。"}, {"w": "finally", "ipa": "/ˈfaɪnəli/", "note": "常带「盼了很久终于」的情绪，或用于列举收尾；eventually 更中性客观地陈述结局。"}], "nu": "eventually 强调「经过过程后最终发生」（含时间推移），别误当成「event 事件」的副词——它与 event 同根但意为「最终地」。"}, {"w": "skyscraper", "form": "skyscrapers", "ipa": "/ˈskaɪskreɪpər/", "pos": "n.", "zh": "摩天大楼", "hook": "sky(天)+scrape(刮)→刮到天", "err": "skysc___（开了头拼不完）", "ety": "🏛 复合词 sky（古诺尔斯语 ský「云」）+ scraper（scrape 刮、擦，来自古诺尔斯语 skrapa）。字面「刮擦天空者」，极言其高。此词 19 世纪末随芝加哥、纽约高层钢构建筑兴起而定型，前身曾指帆船最高的帆。", "ph": "🗣 三音节 sky·scrap·er /ˈskaɪ-skreɪ-pər/，重音在首音节 sky /skaɪ/；注意 scr 三辅音连缀 /skr/ 要一气读出，别插元音。", "xex": [{"en": "The advent of steel frames made the modern skyscraper possible.", "zh": "钢结构的出现使现代摩天大楼成为可能。", "src": "造句"}, {"en": "Glass skyscrapers now dominate the city's skyline.", "zh": "玻璃幕墙的摩天大楼如今主宰着城市的天际线。", "src": "高频搭配"}], "syn": [{"w": "high-rise", "ipa": "/ˈhaɪraɪz/", "note": "泛指任何多层高楼（含公寓），门槛较低；skyscraper 特指极高的标志性超高层建筑，气势与高度更甚。"}, {"w": "tower", "ipa": "/ˈtaʊər/", "note": "泛指细高的塔形建筑（钟塔、信号塔、办公塔），不限居住/商用；skyscraper 专指超高层楼宇。"}], "nu": "skyscraper 字面「刮到天」，特指极高的标志性超高层楼；比泛指多层楼的 high-rise 更高更具地标性。"}, {"w": "advent", "ipa": "/ˈædvent/", "pos": "n.", "zh": "（重要事物的）出现，到来", "hook": "ad-+vent(来)；the advent of 的出现", "ety": "🏛 源自拉丁语 adventus「到来」= ad-（向）+ venīre（来，同 event、invent、venue 同根）。原为基督教术语 Advent，指耶稣「降临」及圣诞前的将临期；泛化后指「（重要事物、时代的）出现、来临」，常用 the advent of。", "ph": "🗣 两音节 ad·vent /ˈæd-vent/，重音在首音节 ad- /æd/；作名词时重音在前，勿读成动词式后重音。", "xex": [{"en": "The advent of the internet transformed how people communicate.", "zh": "互联网的出现改变了人们的交流方式。", "src": "高频搭配"}, {"en": "With the advent of steel, cities began to grow upward.", "zh": "随着钢材的出现，城市开始向上生长。", "src": "造句"}], "syn": [{"w": "arrival", "ipa": "/əˈraɪvl/", "note": "通用词，指人/物/时刻的「到达」；advent 更正式、庄重，专用于「重要事物或时代的登场」，语气更宏大。"}, {"w": "emergence", "ipa": "/ɪˈmɜːrdʒəns/", "note": "强调「逐渐显现、兴起」的过程；advent 侧重「某物首次登场、开启一个时代」这一节点。"}], "nu": "advent 专用于「重大事物/新时代的到来」（常搭 the advent of），比普通的 arrival（到达）更正式、更有历史分量。"}, {"w": "surge", "form": "surged", "ipa": "/sɜːrdʒ/", "pos": "v.", "zh": "激增，涌动", "hook": "populations surged 人口激增", "ety": "源自拉丁 surgere「升起、涌起」(sub-向上+regere引导)；同源 resurge(复兴)、insurgent(起义者)、resurrection(复活)。本义水浪涌起→引申为数量的猛增。", "ph": "单音节 /sɜːrdʒ/，-urge 读 /ɜːrdʒ/，与 urge、merge 押韵；结尾 g 读 /dʒ/。", "xex": [{"en": "Populations surged as people moved to the city.", "zh": "随着人们涌入城市，人口激增。", "src": "造句"}, {"en": "a surge in demand", "zh": "需求的激增", "src": "高频搭配"}], "syn": [{"w": "soar", "ipa": "/sɔːr/", "note": "soar 强调快速大幅上升(价格/数量)；surge 更强调像浪一样猛涌、有冲劲。"}, {"w": "increase", "ipa": "/ɪnˈkriːs/", "note": "increase 中性通用；surge 突然而猛烈。"}], "nu": "surge vs soar：surge=像浪涌般猛增(常突然)，soar=飞升般大幅上涨。人口激增用 surged，物价飞涨用 soared。"}, {"w": "emblematic", "ipa": "/ˌembləˈmætɪk/", "pos": "adj.", "zh": "象征性的，典型的", "hook": "emblem(象征)+atic；emblematic of 是…的象征", "ety": "🏛 源自希腊语 émblēma「镶嵌进去的东西、浮雕装饰」，动词 emballein = en-(进入) + ballein(投掷)——本义是「把碎片投嵌进底板做成镶嵌画」。经拉丁语 emblema 进入英语后，「镶嵌的图案」引申为「代表某物的图案标志」，即 emblem（象征、徽章），加形容词后缀 -atic 成 emblematic「有象征意味的」。同根 ballein 还生出 problem(抛在面前的难题)、symbol(一起投合的记号)。", "ph": "🗣 em-ble-MAT-ic 四音节，重音在第三音节 -MAT-（/ˌembləˈmætɪk/）。前半 emblem 常被读顺而吞掉 -ble- 的模糊 /ə/，注意别读成 em-BLEM-atic；-atic 收 /ɪk/ 不要读成 /eɪk/。", "xex": [{"en": "The soaring cathedral spire is emblematic of medieval faith.", "zh": "高耸的大教堂尖顶是中世纪信仰的象征。", "src": "造句"}, {"en": "Rising rents are emblematic of a wider housing crisis.", "zh": "房租上涨是更大范围住房危机的一个典型缩影。", "src": "高频搭配"}], "syn": [{"w": "symbolic", "ipa": "/sɪmˈbɑːlɪk/", "note": "最通用的「象征性的」，中性；emblematic 更强调「是某一类事物的典型代表」，常接 of。"}, {"w": "representative", "ipa": "/ˌreprɪˈzentətɪv/", "note": "偏「有代表性的、能反映整体的」，语气更中性客观；emblematic 带更强的「标志/缩影」意味。"}, {"w": "typical", "ipa": "/ˈtɪpɪkl/", "note": "只表「典型、常见」，不含「象征」色彩；emblematic 同时兼「典型」与「象征」两层。"}], "nu": "emblematic of 强调「是某事物的象征性缩影」，比中性的 typical 多一层「代表整个类别/时代」的象征分量。"}]}, {"title": "Medieval French Philosophy（生活阅读 · Q2 EXCEPT 错）", "meta": "Read in Daily Life", "en": "PHIL 223 Medieval French Philosophy. An examination of medieval French philosophical thought, focusing on key figures such as Abelard and Buridan. Surveys theological and logical frameworks through readings, lectures, and discussions. Includes two short presentations and one final research paper. Meeting Tu/Th 2:30 P.M.-4:00 P.M. Prerequisite: PHIL 101. Open only to juniors and seniors.", "zh": "哲学 223 中世纪法国哲学。研究中世纪法国哲学思想，聚焦阿伯拉尔、布里丹等关键人物。通过阅读、讲座和讨论梳理神学与逻辑框架。包含两次短演讲和一篇期末研究论文。周二/周四 14:30–16:00 上课。先修：哲学 101。仅向大三、大四学生开放。", "hard": [{"en": "All of the following would likely be homework assignments for this course EXCEPT: writing a paper about a modern French theologian.", "analysis": "EXCEPT 题 = 选「不符合」的那个。本课是 medieval（中世纪）法国哲学，写 modern（现代）神学家的论文不符→就是它。★她栽在没抓 medieval vs modern 的对立。", "zh": "以下都可能是本课作业，除了：写一篇关于现代法国神学家的论文。"}], "words": [{"w": "theological", "ipa": "/ˌθiːəˈlɑːdʒɪkl/", "pos": "adj.", "zh": "神学的", "hook": "theo(神)+logy(学)", "ety": "🏛 由希腊语 theós(神) + lógos(话语、学问) 构成 theología「关于神的学问」，经拉丁语 theologia、古法语进入英语，加 -ical 成形容词。词根 theo- 还见于 atheist(a-无+theos神=无神论者)、monotheism(mono-一+theism=一神论)、pantheon(pan-全+theon=众神殿)；lógos 则贯穿 -logy 系全部学科词。", "ph": "🗣 the-o-LOG-i-cal 五音节，重音在第三音节 -LOG-（/ˌθiːəˈlɑːdʒɪkl/）。开头 the- 是清辅音 /θ/(咬舌)+长音 /iː/，别读成 /ðə/(the)；-gical 的 g 读 /dʒ/。", "xex": [{"en": "The debate raised deep theological questions about free will.", "zh": "这场辩论引出了关于自由意志的深刻神学问题。", "src": "造句"}, {"en": "He entered the seminary to pursue theological studies.", "zh": "他进入神学院攻读神学。", "src": "高频搭配"}], "syn": [{"w": "religious", "ipa": "/rɪˈlɪdʒəs/", "note": "泛指「宗教的、信仰的」，覆盖面广；theological 专指「关于神/教义的系统学理」，学术性更强。"}, {"w": "doctrinal", "ipa": "/dɑːkˈtraɪnl/", "note": "特指「教义上的」，聚焦具体信条；theological 涵盖对神与信仰的整体理论思辨。"}], "nu": "theological 指「神学的、成体系研究神与教义」，比泛泛的 religious（凡与宗教有关皆可）范围窄、学理性强。"}, {"w": "framework", "form": "frameworks", "ipa": "/ˈfreɪmwɜːrk/", "pos": "n.", "zh": "框架，体系", "hook": "frame+work", "ety": "🏛 复合词 frame + work。frame 源自古英语 framian「有益、促进、使前进」，与 from、forth 同源，本义含「向前构建」，中古时期转指「搭建起来的骨架、支架」；work 源自古英语 weorc(劳作、成品)。二者合成「搭建好的骨架结构」，17 世纪后从字面的「框架、构架」抽象为「(思想/制度的)体系、纲领」。", "ph": "🗣 FRAME-work 两音节，重音在首音节 FRAME（/ˈfreɪmwɜːrk/）。frame 是长双元音 /eɪ/；work 的 or 读 /ɜːr/(卷舌央元音)，别读成 /wɔːrk/。", "xex": [{"en": "The report sets out a clear framework for evaluating risk.", "zh": "报告提出了一套清晰的风险评估框架。", "src": "造句"}, {"en": "These reforms operate within a broader legal framework.", "zh": "这些改革在一个更宏观的法律框架内运作。", "src": "高频搭配"}], "syn": [{"w": "structure", "ipa": "/ˈstrʌktʃər/", "note": "泛指「结构、构造」，可实可虚；framework 更强调「支撑分析/行动的骨架体系」，常用于抽象体系。"}, {"w": "system", "ipa": "/ˈsɪstəm/", "note": "指「相互作用的完整系统」，强调运转；framework 是「搭好的骨架、基本纲领」，偏静态与基础。"}, {"w": "scheme", "ipa": "/skiːm/", "note": "指「方案、计划(体系)」，英式常指具体项目；framework 更抽象、更基础，不落到具体执行方案。"}], "nu": "framework 是「支撑思考或运作的基本骨架」，比 system(强调整体运转) 更基础、更偏纲领性搭建。"}, {"w": "prerequisite", "ipa": "/ˌpriːˈrekwəzɪt/", "pos": "n.", "zh": "先决条件，先修课", "hook": "pre-(先)+require(要求)", "ety": "🏛 pre-(在…之前，拉丁 prae) + requisite(所需之物)。requisite 来自拉丁语 requirere「再三索取、要求」= re-(反复、加强) + quaerere(寻求、索求)。quaerere 是英语一大词根，生出 query(询问)、inquire(探询)、acquire(获取)、conquer(征服=完全求取)。合起来 prerequisite = 「必须先具备/先取得的东西」，即先决条件。", "ph": "🗣 pre-REQ-ui-site 四音节，重音在第二音节 -REQ-（/ˌpriːˈrekwəzɪt/）。pre- 读长音 /priː/；-qui- 读 /kwə/(弱)，末尾 -site 读 /zɪt/ 不是 /saɪt/，别与 site(地点) 的读法混。", "xex": [{"en": "A basic grasp of statistics is a prerequisite for this course.", "zh": "掌握基础统计学是修读本课程的先决条件。", "src": "造句"}, {"en": "Trust is a prerequisite for any lasting partnership.", "zh": "信任是任何持久合作关系的前提。", "src": "高频搭配"}], "syn": [{"w": "requirement", "ipa": "/rɪˈkwaɪərmənt/", "note": "泛指「要求、必备条件」，可贯穿全程；prerequisite 特指「必须先满足」的前置条件，强调时间上的「先」。"}, {"w": "precondition", "ipa": "/ˌpriːkənˈdɪʃn/", "note": "近乎同义，都指「先决条件」；precondition 更常用于谈判/逻辑前提，prerequisite 更常用于课程与资格。"}], "nu": "prerequisite 强调「必须事先具备」的前置条件，比泛泛的 requirement 多一层「时间上在先」的意味。"}, {"w": "medieval", "ipa": "/ˌmediˈiːvl/", "pos": "adj.", "zh": "中世纪的", "hook": "medi(中)+ev(时代)；与 modern 对立", "ety": "🏛 拉丁语 medium aevum「中间的时代」的形容词化：medi-(中间，来自 medius) + aev-(时代，来自 aevum，与 age、eternal 同源) + -al。19 世纪学者用它命名古典时代与文艺复兴「之间」的那段历史，故称「中世纪」。同根 medius 还生出 medium(中间物/媒介)、mediate(居中调停)、Mediterranean(地中海=陆地中间的海)。", "ph": "🗣 me-di-E-val 四音节，重音在第三音节 -E-（/ˌmediˈiːvl/）；也有读作 med-EE-vl 的三音节变体。注意 -ev- 是长音 /iːv/，末尾 -al 弱读成 /vl/。", "xex": [{"en": "The town still has its narrow medieval streets and stone walls.", "zh": "这座小镇仍保留着中世纪的狭窄街道和石墙。", "src": "造句"}, {"en": "The manuscript dates from the early medieval period.", "zh": "这份手稿可追溯至中世纪早期。", "src": "高频搭配"}], "syn": [{"w": "mediaeval", "ipa": "/ˌmediˈiːvl/", "note": "同一词的英式旧拼法，含义完全相同；现代英语普遍用 medieval。"}], "nu": "medieval 专指「中世纪的」(约公元 5–15 世纪)，勿与 modern(现代的) 或形近的 mediation(调解) 混；它常与 modern 成对立指代「古旧、过时」。"}]}, {"title": "Data Science and the Buildings of Tomorrow（学术 1/5）", "meta": "Read an Academic Passage · 词义题+EXCEPT 错", "en": "Once static structures, buildings increasingly function as dynamic systems thanks to applications of data science to the built environment. Building data science uses sensors and Internet of Things (IoT) devices, such as smart thermostats, to collect and interpret data from buildings. Sensors embedded in modern buildings track variables such as energy consumption, temperature, air quality, and occupancy patterns. Monitoring space usage may conflict, however, with occupants' privacy concerns and dislike of being tracked without their consent. Studies show that buildings using these systems can reduce energy consumption by up to 30 percent. A skyscraper that adjusts its internal climate based on external weather conditions exemplifies this potential. Other applications include optimizing the layouts of hospitals or using occupancy data to redesign underutilized office spaces.", "zh": "建筑曾是静态结构，如今借助数据科学在建筑环境中的应用，越来越像动态系统般运作。建筑数据科学利用传感器和物联网（IoT）设备（如智能恒温器）来采集和解读建筑数据。嵌入现代建筑的传感器追踪能耗、温度、空气质量、人员占用等变量。然而，监测空间使用可能与住户的隐私顾虑、以及不愿在未经同意下被追踪相冲突。研究显示使用这些系统的建筑能耗最多可降 30%。一座根据外部天气调节室内气候的摩天楼便体现了这一潜力。其他应用包括优化医院布局，或用占用数据重新设计利用率低的办公空间。", "hard": [{"en": "Monitoring space usage may conflict, however, with occupants' privacy concerns and dislike of being tracked without their consent.", "analysis": "however 作插入语（转折）；主干 Monitoring...may conflict with...；conflict with 与…冲突；being tracked 动名词被动（被追踪）。", "zh": "然而，监测空间使用可能与住户的隐私顾虑、以及不愿在未经同意下被追踪相冲突。"}, {"en": "A skyscraper that adjusts its internal climate based on external weather conditions exemplifies this potential.", "analysis": "that... 定语从句修饰 A skyscraper；主干很短 = A skyscraper exemplifies this potential（一座摩天楼体现了这一潜力）。★学术长句常把主干拆得很开，先找主干再看修饰。", "zh": "一座根据外部天气调节室内气候的摩天楼，体现了这一潜力。"}], "words": [{"w": "static", "ipa": "/ˈstætɪk/", "pos": "adj.", "zh": "静止的，不变的", "hook": "★词义题：static = unchanging（不变），不是 impractical", "err": "词义题选 impractical（正确 unchanging）", "ety": "🏛 源自希腊语 statikós「使…停立、关于平衡的」，来自动词 histánai(使站立)、词根 sta-(站、立)。这个印欧词根 sta- 是英语最庞大的家族之一：stand、stable(稳定)、station(站)、status(状态)、statue(雕像)、stay 全部同源。static 因此本义「站定不动的」，引申为「静止的、不变的」，物理学又借指「静电的」。", "ph": "🗣 STAT-ic 两音节，重音在首音节 STAT（/ˈstætɪk/）。a 读短音 /æ/(如 cat)，别读成 /eɪ/；结尾 -ic 收 /ɪk/。可与 static/statue 词根感一起记(都从「站立」来)。", "xex": [{"en": "Sales figures have stayed static for three consecutive quarters.", "zh": "销售数据已连续三个季度停滞不变。", "src": "造句"}, {"en": "A well-designed page shouldn't feel static and lifeless.", "zh": "设计得当的页面不应显得死板、毫无生气。", "src": "高频搭配"}], "syn": [{"w": "unchanging", "ipa": "/ʌnˈtʃeɪndʒɪŋ/", "note": "最直白的「不变的」，中性描述；static 常暗含「本该变却停滞」的消极意味。"}, {"w": "stationary", "ipa": "/ˈsteɪʃəneri/", "note": "指「静止不动的(位置上)」，多描述物体不移动；static 侧重「状态无变化」，抽象与具体皆可。"}, {"w": "stagnant", "ipa": "/ˈstæɡnənt/", "note": "「停滞的」且带明显贬义(如死水、经济不前)；static 中性得多，未必含腐坏之意。"}], "nu": "托福词义题里 static = unchanging(不变的)，不是 impractical(不切实际的)；它比 stationary(位置静止) 更偏「状态不变」，比 stagnant 中性。"}, {"w": "occupancy", "ipa": "/ˈɑːkjəpənsi/", "pos": "n.", "zh": "占用，入住（率）", "hook": "occupy(占用)→occupancy", "ety": "🏛 来自拉丁语 occupare「占据、抓取」= ob-(朝向、加强) + capere(抓取)。capere 是英语超大词根，生出 capture(捕获)、capable(有能力=能抓住的)、accept(接受)、receive(收取)、capacity(容量)。occupare 经古法语进入英语成 occupy(占用)，加名词后缀 -ancy 表状态，即 occupancy「被占用的状态、入住(率)」。", "ph": "🗣 OC-cu-pan-cy 四音节，重音在首音节 OC（/ˈɑːkjəpənsi/）。首音 o 读 /ɑː/(美式)；-cu- 含 /kj/ 介音；末尾 -cy 读 /si/。别把重音挪到 -pan-。", "xex": [{"en": "The hotel reported an average occupancy of 82% last summer.", "zh": "该酒店报告去年夏季平均入住率为 82%。", "src": "高频搭配"}, {"en": "Sensors detect room occupancy and adjust the lighting.", "zh": "传感器检测房间是否有人使用，并据此调节照明。", "src": "造句"}], "syn": [{"w": "occupation", "ipa": "/ˌɑːkjuˈpeɪʃn/", "note": "同根但更常指「职业」或「(军事)占领」；occupancy 专指「(房屋/座位的)占用、入住状态」，不表职业。"}, {"w": "tenancy", "ipa": "/ˈtenənsi/", "note": "特指「租赁、租住期」，含租约关系；occupancy 只表「被占用」这一事实，不必涉及租赁。"}], "nu": "occupancy 指「空间被占用/入住的状态或比率」，别与同根的 occupation(职业/军事占领) 混——后者重身份或政治占领，前者重空间使用。"}, {"w": "thermostat", "ipa": "/ˈθɜːrməstæt/", "pos": "n.", "zh": "恒温器", "hook": "thermo(热)+stat(固定)", "ety": "🏛 由希腊语 thérmē(热) + statós(使停立、固定，同 sta- 站立根) 造的现代科学复合词(19 世纪)，字面「把热固定住的装置」，即恒温器。thermo- 家族极大：thermometer(测温计)、thermal(热的)、thermos(保温瓶)、hypothermia(体温过低)；-stat 后缀还见于 thermostat 的兄弟 rheostat(变阻器)。", "ph": "🗣 THER-mo-stat 三音节，重音在首音节 THER（/ˈθɜːrməstæt/）。开头 th 是清辅音 /θ/(咬舌)，er 读 /ɜːr/；中间 -mo- 弱读 /mə/；末尾 -stat 读 /stæt/。", "xex": [{"en": "She turned the thermostat down to save on heating.", "zh": "她把恒温器调低以节省供暖费。", "src": "高频搭配"}, {"en": "A smart thermostat learns your schedule and adjusts the temperature.", "zh": "智能恒温器会学习你的作息并自动调节温度。", "src": "造句"}], "nu": "thermostat 是「调控温度的恒温器」这一具体装置，别与同 thermo- 家族的 thermometer(只测温、不控温) 混——一个控温，一个仅显示温度。"}, {"w": "embedded", "ipa": "/ɪmˈbedɪd/", "pos": "adj.", "zh": "嵌入的", "hook": "em-+bed(床/嵌)", "ety": "🏛 embed 由 em-(=en-，使进入，在 b 前拼作 em-) + bed(床) 构成。bed 源自古英语 bedd，本义「睡卧之处」，也指「苗床、河床」这类「安放东西的凹槽底座」。embed 即「把某物牢牢安放进底床里」，故 embedded「嵌入的、深植的」，既可指记者「随军」，也可指技术上「内嵌于系统」。", "ph": "🗣 em-BED-ded 三音节，重音在第二音节 -BED-（/ɪmˈbedɪd/）。词首 em- 常弱读成 /ɪm/；-bed- 读 /bed/，双写 d 只是拼写规则，读一个 /d/，末尾 -ed 读 /ɪd/。", "xex": [{"en": "The sensors are embedded directly in the concrete.", "zh": "这些传感器被直接嵌入混凝土中。", "src": "造句"}, {"en": "These assumptions are deeply embedded in the culture.", "zh": "这些假设深深植根于这种文化之中。", "src": "高频搭配"}], "syn": [{"w": "ingrained", "ipa": "/ɪnˈɡreɪnd/", "note": "多指习惯/观念「根深蒂固」，偏抽象；embedded 抽象具体皆可，尤擅描述「物理嵌入」。"}, {"w": "implanted", "ipa": "/ɪmˈplæntɪd/", "note": "强调「被植入(常指外来物、如芯片/器官)」，含主动放入之意；embedded 更中性，强调「牢固处于其中」。"}], "nu": "embedded 强调「牢牢嵌在某物内部」(可实可虚)，比 ingrained(仅抽象观念根深蒂固) 用途更广，尤能描述物理内嵌。"}, {"w": "optimize", "ipa": "/ˈɑːptɪmaɪz/", "pos": "v.", "zh": "优化", "hook": "optim(最佳)+ize", "ety": "🏛 来自拉丁语 optimus「最好的」(good 的最高级，与 optare 望/选有关)，19 世纪加动词后缀 -ize 造出 optimize「使达到最优」。同根 optimus 还生出 optimum(最佳值)、optimism(乐观主义=相信一切趋向最好)、optimal(最优的)。英式拼作 optimise。", "ph": "🗣 OP-ti-mize 三音节，重音在首音节 OP（/ˈɑːptɪmaɪz/）。首音 o 读 /ɑː/(美式)；-ti- 弱读 /tɪ/；末尾 -mize 读长双元音 /maɪz/(如 my + z)。", "xex": [{"en": "The algorithm optimizes energy use across the whole building.", "zh": "该算法对整栋楼的能源使用进行优化。", "src": "造句"}, {"en": "We need to optimize the site for mobile users.", "zh": "我们需要针对移动端用户优化这个网站。", "src": "高频搭配"}], "syn": [{"w": "improve", "ipa": "/ɪmˈpruːv/", "note": "泛指「改善、变好」，不必到极致；optimize 特指「调到最优、追求最佳配置」，程度与技术性更强。"}, {"w": "streamline", "ipa": "/ˈstriːmlaɪn/", "note": "特指「精简流程、去冗余以提效」；optimize 范围更广，可指任何维度的最优化，未必是删减。"}, {"w": "refine", "ipa": "/rɪˈfaɪn/", "note": "指「打磨、精细改进」，侧重逐步提纯；optimize 侧重整体调到最佳性能。"}], "nu": "optimize 是「调到最优状态」，比泛泛的 improve(只要变好即可) 目标更高、更含「求最佳配置」的技术味。"}, {"w": "exemplify", "form": "exemplifies", "ipa": "/ɪɡˈzemplɪfaɪ/", "pos": "v.", "zh": "是…的典型，例证", "hook": "example→exemplify", "ety": "🏛 来自拉丁语 exemplum「样本、范例」(即 example 的词源，= ex-取出 + emere 拿取，本义「取出来示范的一份」)，中古拉丁语加 -ficare(=make，做) 成 exemplificare「使成为范例、举例说明」。同根 emere(拿取) 还藏在 redeem(赎回)、premium(先取的酬报)、exempt(取出=豁免) 里。", "ph": "🗣 eg-ZEM-pli-fy 四音节，重音在第二音节 -ZEM-（/ɪɡˈzemplɪfaɪ/）。词首 ex- 在此读浊音 /ɪɡz/(不是 /ɪks/)；末尾 -fy 读长双元音 /faɪ/。", "xex": [{"en": "This building exemplifies the city's bold new architecture.", "zh": "这栋建筑是这座城市大胆新建筑风格的典型代表。", "src": "造句"}, {"en": "Her career exemplifies the rewards of perseverance.", "zh": "她的职业生涯正是坚持不懈得到回报的典范。", "src": "高频搭配"}], "syn": [{"w": "illustrate", "ipa": "/ˈɪləstreɪt/", "note": "指「(用例子/图示)说明」，重「阐明道理」；exemplify 重「本身就是某事物的典型例子」。"}, {"w": "epitomize", "ipa": "/ɪˈpɪtəmaɪz/", "note": "语气更强，指「完美浓缩、是…的极致缩影」；exemplify 只需「是典型代表」，程度略轻。"}, {"w": "typify", "ipa": "/ˈtɪpɪfaɪ/", "note": "指「是…的典型、代表某类特征」，与 exemplify 很近；exemplify 稍偏「举以为例」，typify 偏「代表整类」。"}], "nu": "exemplify 指「本身就是某事物的典型例子」，比 illustrate(用例子来说明道理) 更强调「自身即范例」，比 epitomize(极致缩影) 程度弱。"}, {"w": "underutilized", "ipa": "/ˌʌndərˈjuːtəlaɪzd/", "pos": "adj.", "zh": "未被充分利用的", "hook": "under(不足)+utilize(利用)", "ety": "🏛 三段构词：under-(不足、低于，古英语 under) + utilize + -ed。utilize 来自拉丁语 utilis「有用的」，源于 uti(使用)——同根还有 utility(效用)、utensil(用具)、use。整体即「未被充分使用的」。前缀 under- 表「不足」的用法同 underestimate(低估)、underpaid(薪酬过低)。英式拼作 underutilised。", "ph": "🗣 un-der-U-ti-lized 五音节，主重音在第三音节 -U-（/ˌʌndərˈjuːtəlaɪzd/），under- 带次重音。-U- 读 /juː/(带 y 介音)；末尾 -lized 读 /laɪzd/。", "xex": [{"en": "Much of the office space sits underutilized after the shift to remote work.", "zh": "转向远程办公后，大量办公空间处于未被充分利用的状态。", "src": "造句"}, {"en": "These skilled workers are badly underutilized in their current roles.", "zh": "这些技术工人在现有岗位上严重未被充分利用。", "src": "高频搭配"}], "syn": [{"w": "underused", "ipa": "/ˌʌndərˈjuːzd/", "note": "更口语、更短的同义词，含义几乎相同；underutilized 更正式、多见于商业与技术语境。"}], "nu": "underutilized 指「资源/能力未被充分利用」，与反义的 optimize(用到最优) 恰成对照；比中性的 unused(完全没用) 更精确——是「用了但没用够」。"}]}, {"title": "Developmental Systems Theory（学术 · Q3/Q4 错）", "meta": "Read an Academic Passage · EXCEPT+功能题错", "en": "Developmental Systems Theory (DST) is an approach within developmental biology that emphasizes the complex interactions between genetic, environmental, and epigenetic factors in shaping an organism's development. Instead, DST posits that development results from dynamic, reciprocal interactions among all these factors. A key example involves the development of beak shapes in finches. These interactions can lead to epigenetic changes—modifications in gene expression that do not alter the DNA sequence itself. DST also introduces the concept of developmental plasticity, which refers to the ability of an organism to alter its development in response to varying environmental conditions. This adaptability is crucial for survival, especially in rapidly changing environments.", "zh": "发展系统理论（DST）是发育生物学中的一种取向，强调基因、环境和表观遗传因素之间在塑造个体发育中的复杂互动。DST 主张，发育源于所有这些因素之间动态、相互的作用。一个关键例子是雀鸟喙形的发育。这些互动可导致表观遗传变化——即不改变 DNA 序列本身的基因表达修饰。DST 还引入了「发育可塑性」的概念，指个体根据环境变化改变自身发育的能力。这种适应性对生存至关重要，尤其在快速变化的环境中。", "hard": [{"en": "These interactions can lead to epigenetic changes—modifications in gene expression that do not alter the DNA sequence itself.", "analysis": "破折号后是对 epigenetic changes 的同位语解释；that... 定语从句修饰 modifications。★Q3 EXCEPT 的钥匙：表观遗传变化「不改变 DNA 序列」→ 所以「改变 DNA 序列」就是那个 EXCEPT 答案。", "zh": "这些互动可导致表观遗传变化——即不改变 DNA 序列本身的基因表达修饰。"}, {"en": "DST also introduces the concept of developmental plasticity, which refers to the ability of an organism to alter its development in response to varying environmental conditions.", "analysis": "which... 非限定定语从句解释 developmental plasticity；in response to 回应…。★Q4 功能题：作者提它是为「解释 DST 的一个重要方面」，不是反驳什么。", "zh": "DST 还引入「发育可塑性」的概念，指个体根据环境变化改变自身发育的能力。"}], "words": [{"w": "epigenetic", "ipa": "/ˌepɪdʒəˈnetɪk/", "pos": "adj.", "zh": "表观遗传的", "hook": "epi-(在…之上)+genetic；不改DNA序列的基因表达变化", "ety": "🏛 epi-(在…之上、之外，希腊语) + genetic(遗传的，源于希腊 génesis 起源/生成、génos 种族)。字面「凌驾于基因之上的」，指不改变 DNA 序列、却影响基因表达的可遗传变化。前缀 epi- 还见于 epidermis(表皮=皮之上)、epilogue(收场白=言之后)、epicenter(震中=中心之上)、epitaph(墓志铭)。", "ph": "🗣 ep-i-ge-NET-ic 五音节，主重音在第四音节 -NET-（/ˌepɪdʒəˈnetɪk/）。epi- 读 /epɪ/(e 是短音 /e/)；-ge- 读 /dʒə/；末尾 -ic 收 /ɪk/。", "xex": [{"en": "Diet and stress can trigger epigenetic changes in gene expression.", "zh": "饮食和压力可引发基因表达上的表观遗传变化。", "src": "造句"}, {"en": "Researchers study epigenetic markers to understand aging.", "zh": "研究者通过研究表观遗传标记来理解衰老。", "src": "高频搭配"}], "nu": "epigenetic 特指「不改变 DNA 序列、只调控基因表达」的遗传现象，与 genetic(涉及 DNA 序列本身的遗传) 是对照关系——一个「基因之上」，一个「基因本身」。"}, {"w": "reciprocal", "ipa": "/rɪˈsɪprəkl/", "pos": "adj.", "zh": "相互的，互惠的", "hook": "reciproc(来回)→双向", "ety": "🏛 来自拉丁语 reciprocus「往返的、来回的」，一般析为 reque-(向后) + proque-(向前) 的合成，即「一来一回、双向往复」。加 -al 成形容词 reciprocal「相互的、互惠的」。同族 reciprocate(回报、互换)、reciprocity(互惠原则)。数学里 reciprocal 又指「倒数」(1/x，因其互为翻转)。", "ph": "🗣 re-CIP-ro-cal 四音节，重音在第二音节 -CIP-（/rɪˈsɪprəkl/）。c 在 i 前读 /s/；-ro- 弱读 /rə/；末尾 -cal 读 /kl/。别把重音放在首或尾。", "xex": [{"en": "The two nations signed a reciprocal trade agreement.", "zh": "两国签署了一项互惠贸易协定。", "src": "高频搭配"}, {"en": "Healthy friendships rest on reciprocal trust and support.", "zh": "健康的友谊建立在相互的信任与支持之上。", "src": "造句"}], "syn": [{"w": "mutual", "ipa": "/ˈmjuːtʃuəl/", "note": "指「共同的、双方都有的」(如 mutual respect)，未必强调「你给我、我回你」；reciprocal 更强调「对等回报、双向往复」。"}, {"w": "interdependent", "ipa": "/ˌɪntərdɪˈpendənt/", "note": "指「相互依赖」，重彼此需要；reciprocal 重「对等地相互给予/回应」。"}], "nu": "reciprocal 强调「一来一回、对等回报」的双向关系，比 mutual(只表双方共有) 多一层「你予我、我回你」的交换意味。"}, {"w": "plasticity", "ipa": "/plæˈstɪsəti/", "pos": "n.", "zh": "可塑性", "hook": "plastic(可塑的)+ity", "ety": "🏛 来自希腊语 plastikós「可塑的、能被塑形的」，源于动词 plássein(塑造、捏塑)。加名词后缀 -ity 表性质，即「可塑性」。同根 plássein 还生出 plastic(塑料/可塑的)、plaster(灰泥)、protoplasm(原生质)。神经科学的 neuroplasticity(神经可塑性) 即由此词而来。", "ph": "🗣 plas-TIC-i-ty 四音节，重音在第二音节 -TIC-（/plæˈstɪsəti/）。首音 plas- 读 /plæ/(a 短音 /æ/)；-ci- 读 /sɪ/；末尾 -ty 读 /ti/。注意重音从 plastic 的首音节后移了。", "xex": [{"en": "The brain's plasticity allows it to rewire after injury.", "zh": "大脑的可塑性使其能在受损后重新连接。", "src": "高频搭配"}, {"en": "Heated glass gains plasticity and can be shaped by hand.", "zh": "加热后的玻璃具备可塑性，可以手工塑形。", "src": "造句"}], "syn": [{"w": "malleability", "ipa": "/ˌmæliəˈbɪləti/", "note": "本指金属「可锤打延展」，引申「易受影响塑造」；plasticity 更强调「能被塑成新形并保持」，神经/心理学常用。"}, {"w": "flexibility", "ipa": "/ˌfleksəˈbɪləti/", "note": "指「灵活、可弯曲」，弯了常会回弹；plasticity 强调「塑形后定型不回弹」，两者物理内涵不同。"}], "nu": "plasticity 强调「能被塑造成新形态并保持下来」，与 flexibility(弯曲后多会回弹) 不同——一个定型，一个回弹。"}, {"w": "posit", "form": "posits", "ipa": "/ˈpɑːzɪt/", "pos": "v.", "zh": "假定，主张", "hook": "pos(放)→提出主张", "ety": "🏛 来自拉丁语 ponere「放置」的过去分词 positus(被放置的)。词根 pos-/pon-(放) 是英语超级家族：position(位置)、compose(合放=组成)、deposit(放下=存放/沉积)、propose(向前放=提议)、oppose(对着放=反对)。posit 即「把某个命题『摆出来』作为前提或主张」，故译「假定、主张、提出(论点)」。", "ph": "🗣 POS-it 两音节，重音在首音节 POS（/ˈpɑːzɪt/）。首音 o 读 /ɑː/(美式)，s 读浊音 /z/；末尾 -it 读 /ɪt/。别读成 /ˈpoʊzɪt/。", "xex": [{"en": "The theory posits that memory is stored across many neurons.", "zh": "该理论假定记忆是分散储存在众多神经元中的。", "src": "高频搭配"}, {"en": "Some economists posit a link between debt and slow growth.", "zh": "一些经济学家提出债务与增长放缓之间存在关联。", "src": "造句"}], "syn": [{"w": "postulate", "ipa": "/ˈpɑːstʃuleɪt/", "note": "近义，指「假定(为讨论/推理前提)」，学术味浓；posit 与之高度重合，都用于提出未证的前提。"}, {"w": "hypothesize", "ipa": "/haɪˈpɑːθəsaɪz/", "note": "指「提出假说(待验证)」，侧重科学检验；posit 更泛指「主张、假定」，不必强调后续实证。"}, {"w": "assume", "ipa": "/əˈsuːm/", "note": "日常词，「(未加证明就)假定」，可含随意色彩；posit 更正式、多用于学术论述中郑重提出命题。"}], "nu": "posit 指「郑重提出某命题作为前提或主张」，比日常的 assume(随口假定) 更正式、更学术，接近 postulate。"}, {"w": "adaptability", "ipa": "/əˌdæptəˈbɪləti/", "pos": "n.", "zh": "适应性", "hook": "adapt(适应)+ability", "ety": "🏛 层层派生：adapt + -able + -ity。adapt 来自拉丁语 adaptare = ad-(朝向) + aptare(使适合，源于 aptus 合适的)。aptus 这一「合适」根还生出 apt(恰当的)、aptitude(天资)、attitude(姿态)。adapt(使适应) → adaptable(能适应的) → adaptability(适应能力)，即「随环境调整自身以求契合的能力」。", "ph": "🗣 a-dap-ta-BIL-i-ty 五个书写音节，主重音落在 -BIL-（/əˌdæptəˈbɪləti/），adapt 部分带次重音。-dapt- 读 /dæpt/(a 短音 /æ/)；末尾 -ty 读 /ti/。", "xex": [{"en": "Employers increasingly value adaptability over narrow expertise.", "zh": "雇主越来越看重适应能力，而非狭窄的专长。", "src": "高频搭配"}, {"en": "The species survived thanks to its remarkable adaptability.", "zh": "这一物种凭借其非凡的适应能力得以存活。", "src": "造句"}], "syn": [{"w": "flexibility", "ipa": "/ˌfleksəˈbɪləti/", "note": "指「灵活变通、愿意改变」，偏态度/方式；adaptability 强调「适应新环境的能力」，重结果性契合。"}, {"w": "versatility", "ipa": "/ˌvɜːrsəˈtɪləti/", "note": "指「多才多艺、能胜任多种事」，重能力广度；adaptability 重「随变化调整自身」，二者角度不同。"}], "nu": "adaptability 指「顺应新环境调整自身的能力」，比 flexibility(愿意变通的态度) 更强调「适应结果」，比 versatility(样样都能) 侧重「应变」。"}, {"w": "exhibit", "ipa": "/ɪɡˈzɪbɪt/", "pos": "v.", "zh": "表现出，展示", "hook": "ex-(出)+hibit(拿)→拿出来展示", "ety": "🏛 来自拉丁语 exhibere「拿出来、呈现」= ex-(出) + habere(持有、拿)。habere 是英语巨型词根，生出 habit(习惯=持有的状态)、inhibit(抑制=向内持=收住)、prohibit(禁止=向前挡住)、habitat(栖息地)。exhibit 即「把持有之物拿出来展示」，故有「展出、表现出(某特征)」两义。", "ph": "🗣 eg-ZIB-it 三音节，重音在第二音节 -ZIB-（/ɪɡˈzɪbɪt/）。词首 ex- 读浊音 /ɪɡz/(如 exam、exist，不是 /ɪks/)；中间 h 不发音；末尾 -it 读 /ɪt/。", "xex": [{"en": "The material exhibits unusual strength at high temperatures.", "zh": "这种材料在高温下表现出异乎寻常的强度。", "src": "高频搭配"}, {"en": "Several galleries will exhibit her early sketches next month.", "zh": "下个月几家画廊将展出她早期的素描。", "src": "造句"}], "syn": [{"w": "display", "ipa": "/dɪˈspleɪ/", "note": "泛指「展示、显露」，日常且中性；exhibit 更正式，「展出(展品)」及「(学术地)表现出特征」时更常用。"}, {"w": "demonstrate", "ipa": "/ˈdemənstreɪt/", "note": "指「(有意)演示、证明」，含说明目的；exhibit 可以是「自然地表现出」某性质，未必刻意演示。"}, {"w": "manifest", "ipa": "/ˈmænɪfest/", "note": "指「使显现、清楚表现出」，偏抽象与书面；exhibit 兼指具体展品与抽象特征，用途更广。"}], "nu": "exhibit 兼「展出展品」与「表现出某特征」两义，比日常的 display 更正式，比 demonstrate(有意演示) 可以是「自然显露」。"}]}]};
const KEY = 'toefl-review:' + DATA.id;
const $ = s => document.querySelector(s);
const esc = s => (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
let mastered = new Set(JSON.parse(localStorage.getItem(KEY)||'[]'));
const saveM = ()=> localStorage.setItem(KEY, JSON.stringify([...mastered]));
let recite=false;

/* TTS 美音 */
let voices=[]; const lv=()=>{voices=window.speechSynthesis?speechSynthesis.getVoices():[]};
if(window.speechSynthesis){ lv(); speechSynthesis.onvoiceschanged=lv; }
function say(t){ if(!window.speechSynthesis)return; speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t); u.lang='en-US'; u.rate=0.9;
  const v=voices.find(v=>/en-US/i.test(v.lang)&&/Samantha|Aria|Jenny|Google US|female/i.test(v.name))||voices.find(v=>/en-US/i.test(v.lang)); if(v)u.voice=v;
  speechSynthesis.speak(u); }

const allWords = ()=> DATA.passages.flatMap((p,pi)=>p.words.map((w,wi)=>({...w,pi,wi})));
function totalCount(){ const all=allWords(); return `已掌握 ${all.filter(w=>mastered.has(w.w)).length}/${all.length}`; }

/* 原文/长难句里把生词包成可点击 span（共用一套词表 map） */
function buildMap(p){ const map={}; p.words.forEach((w,wi)=>{ map[(w.form||w.w).toLowerCase()]=wi; map[w.w.toLowerCase()]=wi; }); return map; }
function linkText(text, p, pi, map){
  return esc(text).replace(/[A-Za-z][A-Za-z'’-]*/g, tok=>{
    const wi=map[tok.toLowerCase()];
    if(wi==null) return `<span class="pw pw-plain" data-p="${pi}" data-plain="${esc(tok)}">${tok}</span>`;
    return `<span class="pw" data-w="${esc(p.words[wi].w)}" data-p="${pi}" data-wi="${wi}">${tok}</span>`;
  });
}

function render(){
  $('#count').textContent = totalCount();
  $('#body').innerHTML = DATA.passages.map((p,pi)=>{
    const map=buildMap(p);
    const hardHtml = (p.hard&&p.hard.length)
      ? `<div class="seclbl">🔍 长难句精析（在句子里记词）</div>` + p.hard.map((h,hi)=>
          `<div class="hs"><div class="hs-en">${linkText(h.en,p,pi,map)} <span class="hs-say" data-read-hs="${pi}-${hi}">🔊 读句</span></div>`+
          `<div class="hs-an">🧩 ${esc(h.analysis)}</div>`+
          `<div class="hs-zh">${esc(h.zh)}</div></div>`).join('')
      : '';
    return `<section class="pg">
      <div class="pgh"><h2>${esc(p.title)}</h2>${p.meta?`<span class="pgmeta">${esc(p.meta)}</span>`:''}</div>
      <div class="seclbl">📄 原文 <button class="rd" data-read-pi="${pi}">🔊 读原文</button></div>
      <div class="en">${linkText(p.en,p,pi,map)}</div>
      <div class="seclbl">🀄 翻译</div>
      <div class="zhp">${esc(p.zh)}</div>
      ${hardHtml}
      <div class="seclbl">📓 单词（${p.words.length}）</div>
      <div class="cards">${p.words.map((w,wi)=>card(w,pi,wi)).join('')}</div>
    </section>`;
  }).join('');
  wire();
  paint();
}
function card(w,pi,wi){
  const done=mastered.has(w.w);
  return `<div class="card ${done?'done':''}" id="card-${pi}-${wi}">
    <div class="whead"><span class="w">${esc(w.w)}</span><span class="ipa">${esc(w.ipa||'')}</span><span class="pos">${esc(w.pos||'')}</span>
      <button class="spk" data-say="${esc(w.w)}">🔊</button></div>
    <div class="zh">${esc(w.zh)}</div>
    ${w.err?`<div class="err">⚠️ 本次拼错：你写成 <s>${esc(w.err)}</s></div>`:''}
    ${w.ety?`<div class="sec">🏛 ${esc(w.ety)}</div>`:''}
    ${w.ph?`<div class="sec">🗣 ${esc(w.ph)}</div>`:''}
    ${w.hook?`<div class="hook">🔑 ${esc(w.hook)}</div>`:''}
    ${(w.xex&&w.xex.length)?`<div class="xex">${w.xex.map(e=>`✍️ <span class="exen">${esc(e.en)}</span><br><span class="xzh">${esc(e.zh||'')}</span>`).join('<br>')}</div>`:''}
    ${((w.syn&&w.syn.length)||(w.ant&&w.ant.length))?`<div class="syn">🔗 ${[...(w.syn||[]).map(s=>`<b data-say="${esc(s.w)}">${esc(s.w)}</b> ${esc(s.note||'')}`),...(w.ant||[]).map(s=>`反义 <b data-say="${esc(s.w)}">${esc(s.w)}</b> ${esc(s.note||'')}`)].join('　')}</div>`:''}
    ${w.nu?`<div class="nu">🎯 ${esc(w.nu)}</div>`:''}
    <button class="mbtn ${done?'on':''}" data-m="${esc(w.w)}">${done?'✓ 已掌握':'标记已掌握'}</button>
  </div>`;
}
function paint(){ document.querySelectorAll('.pw[data-w]').forEach(el=>el.classList.toggle('done', mastered.has(el.dataset.w))); }
function toggleMastered(w){
  mastered.has(w)?mastered.delete(w):mastered.add(w); saveM();
  const on=mastered.has(w);
  document.querySelectorAll('[data-m]').forEach(b=>{ if(b.dataset.m===w){
    b.classList.toggle('on',on); b.textContent=on?'✓ 已掌握':'标记已掌握';
    const c=b.closest('.card'); if(c) c.classList.toggle('done',on); } });
  $('#count').textContent=totalCount(); paint();
}
function miniCard(word){
  return `<div class="card plain"><div class="whead"><span class="w">${esc(word)}</span>`+
    `<button class="spk" data-say="${esc(word)}">🔊</button></div>`+
    `<a class="dict" href="https://dictionary.cambridge.org/dictionary/english/${encodeURIComponent(word.toLowerCase())}" target="_blank" rel="noopener">查词典（本词非本场生词）↗</a></div>`;
}
/* 点句中任意词 → 就地展开：生词=满配卡，其余=最小卡+查词典；再点收起 */
let openWordEl=null;
function openDetail(el){
  const same=(openWordEl===el);
  document.querySelectorAll('.pdet').forEach(d=>d.remove());
  if(openWordEl) openWordEl.classList.remove('open');
  openWordEl=null;
  if(same) return;
  const word=el.dataset.w||el.dataset.plain||'';
  say(word);
  el.classList.add('open'); openWordEl=el;
  const det=document.createElement('div'); det.className='pdet';
  if(el.hasAttribute('data-wi')) det.innerHTML=card(DATA.passages[+el.dataset.p].words[+el.dataset.wi], +el.dataset.p, +el.dataset.wi);
  else det.innerHTML=miniCard(word);
  el.after(det);   // 就地展开：卡片插在被点词之后（不再掉到整段下面）
  det.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>say(b.dataset.say));
  det.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>toggleMastered(b.dataset.m));
  det.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function wire(){
  document.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>say(b.dataset.say));
  document.querySelectorAll('.zh').forEach(el=>el.onclick=()=>{ if(recite) el.style.filter='none'; });
  document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>toggleMastered(b.dataset.m));
  document.querySelectorAll('.pw').forEach(el=>el.onclick=()=>openDetail(el));
  document.querySelectorAll('[data-read-pi]').forEach(b=>b.onclick=()=>say(DATA.passages[+b.dataset.readPi].en));
  document.querySelectorAll('[data-read-hs]').forEach(b=>b.onclick=()=>{ const a=b.dataset.readHs.split('-'); say(DATA.passages[+a[0]].hard[+a[1]].en); });
}
$('#recite').onclick=()=>{ recite=!recite; document.body.classList.toggle('recite',recite); $('#recite').classList.toggle('on',recite);
  if(recite) document.querySelectorAll('.zh').forEach(el=>el.style.filter=''); };

/* 拼写测验：看中文+听音→打出英文 */
function spell(pool){
  if(!pool.length){ alert('没有可测的词'); return; }
  let i=0, sc=0;
  function step(){
    if(i>=pool.length){ $('#quizmount').innerHTML=`<div class="quiz"><div class="qbox"><div class="qzh">✅ 完成：${sc}/${pool.length} 拼对</div>
      <div class="qbtns"><button class="p" onclick="document.getElementById('quizmount').innerHTML=''">关闭</button></div></div></div>`; return; }
    const q=pool[i];
    $('#quizmount').innerHTML=`<div class="quiz"><div class="qbox">
      <div class="qprog">第 ${i+1}/${pool.length} 题 · 拼对 ${sc}</div>
      <div class="qzh">${esc(q.zh)} <button class="spk" id="qs">🔊</button></div>
      <div class="qpos">${esc(q.pos||'')} ${q.err?'· ⚠️上次拼错':''}</div>
      <input class="qin" id="qin" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="打出英文单词…">
      <div class="qres" id="qres"></div>
      <div class="qbtns"><button class="g" id="qskip">跳过/看答案</button><button class="p" id="qok">提交</button></div>
    </div></div>`;
    const inp=$('#qin'); inp.focus(); $('#qs').onclick=()=>say(q.w);
    say(q.w);
    function judge(reveal){
      const got=(inp.value||'').trim().toLowerCase(); const ok=got===q.w.toLowerCase();
      const r=$('#qres');
      if(ok){ r.className='qres ok'; r.textContent='✓ 正确：'+q.w; sc++; }
      else { r.className='qres no'; r.innerHTML=(reveal?'答案：':'✗ ')+`<b>${esc(q.w)}</b>`+(got?` （你写：${esc(got)}）`:''); }
      inp.disabled=true; $('#qok').textContent='下一题'; $('#qok').onclick=()=>{ i++; step(); };
    }
    $('#qok').onclick=()=>judge(false);
    $('#qskip').onclick=()=>judge(true);
    inp.onkeydown=e=>{ if(e.key==='Enter'){ if(inp.disabled){i++;step();} else judge(false); } };
  }
  step();
}
$('#quizAll').onclick=()=>spell(allWords());
$('#quizErr').onclick=()=>spell(allWords().filter(w=>w.err));

render();
</script>
